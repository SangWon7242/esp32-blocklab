      - id: mission
        type: mission
        title: 미션 — 단계로 움직이는 가로등 (통합 평가)
        minutes: 10
        scene:
          image: images/power-table.svg
          caption: 단계 하나로 글자와 밝기를 함께 정해요. 0 DARK 는 100 %, 3 BRIGHT 는 0 %
        body: |
          이제 세 부품을 한 기계로 묶어요. 활동 칸에는 밝기 LED(26번)와 OLED 준비 블록을 미리 깔아 두었어요. 단계 숫자 하나로 **OLED 글자**와 **LED 밝기**를 함께 정해 보세요.

          판정은 기능 체크리스트예요. 단계 계산 · 화면 글자 · 화면 순서 · LED 밝기 · 밝기 방향을 하나씩 봐요. 숫자는 내가 잰 값으로 바꿔도 괜찮아요.
        todo:
          - 단계 글자 네 개를 어떻게 꺼낼지 정하기 (리스트 또는 갈림길)
          - 반복 안에 OLED 지우기 → 글자 적기 → 내보내기, LED 밝기 정하기 넣기
          - 손으로 가렸다 비췄다 하며 글자와 밝기가 바뀌는지 보고 **판정** 누르기
        instructions: "가로등을 완성하세요. (1) 단계는 지금처럼 범위 바꾸기로 0~3 정수로 구해요. (2) 반복할 때마다 OLED 를 지우고 단계 글자(0 DARK, 1 DIM, 2 MEDIUM, 3 BRIGHT)를 적은 뒤 화면에 내보내요. (3) 단계가 낮을수록 LED 를 밝게 켜요: DARK 100 %, DIM 약 66 %, MEDIUM 약 33 %, BRIGHT 0 %"
        hint: 글자 네 개를 리스트 `names` 에 담아 두면 `names[level]` 처럼 단계 번호로 꺼낼 수 있어요(0 번째부터). 밝기는 범위 바꾸기를 한 번 더 써서 단계 0~3 을 100~0 으로 거꾸로 바꿔 보세요
        code: mission_start.py
        rules:
          - codeMatches: 'level = .*\* \(3 - 0\) // \('
            fail: 단계가 0, 1, 2, 3 네 가지 정수로만 나오나요? 범위 바꾸기의 마지막 두 칸과 나누기 모양을 다시 보세요
          - codeMatches: '^(?=[\s\S]*"DARK")(?=[\s\S]*"DIM")(?=[\s\S]*"MEDIUM")(?=[\s\S]*"BRIGHT")'
            fail: 네 단계의 글자가 모두 코드에 있나요? 글자의 영어 철자도 지시와 같은지 확인해 보세요
          - codeMatches: '^\s+oled\.fill\(0\)$[\s\S]*^\s+oled\.text\([\s\S]*^\s+oled\.show\(\)$'
            fail: 반복할 때마다 화면이 바뀌려면 무엇을 어떤 순서로 해야 할까요? 지난 글자가 겹쳐 보이지 않나요?
          - codeMatches: '^\s+led\.duty\('
            fail: 단계가 바뀔 때 LED 밝기도 바뀌나요? 반복 안에서 밝기를 정하는 블록이 있나요?
          - codeMatches: '\(0 - 100\)|\(3 - level\)|\[100, |100 - level|int\(100 \* 1023 / 100\)'
            fail: 깜깜할 때(DARK) LED 는 몇 % 여야 하나요? 단계 숫자가 커질수록 밝기는 커져야 할까요, 작아져야 할까요?
        answerCode: mission_street_lamp.py

      - id: extra
        type: mission
        title: 추가 미션 — 전기를 얼마나 아꼈을까?
        optional: true
        minutes: 5
        scene:
          image: images/power-table.svg
          caption: 밝기를 모두 더해 횟수로 나누면 평균 밝기. 100 % 에서 평균을 빼면 아낀 비율이에요
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 0.5초마다 정한 LED 밝기를 `total` 에 더해 가고, 몇 번 더했는지 `count` 로 세면 **평균 밝기**를 구할 수 있어요.

          밤새 100 % 로 켰다면 평균은 100 이에요. 그러니 `100 - 평균` 이 우리 가로등이 **아낀 전기의 비율**이에요. OLED 셋째 줄에 보여 줘요.
        todo:
          - 반복 전에 total 과 count 를 0 으로 정하기
          - 반복 안에서 total 에 밝기를 더하고 count 를 1 늘리기
          - "OLED 셋째 줄(y 40)에 `100 - total // count` 를 보여 주고 **판정** 누르기"
        instructions: "미션 가로등에 에너지 계산을 더하세요. 반복 전에 total 과 count 를 0 으로 정하고, 반복할 때마다 total 에 power 를 더하고 count 를 1 늘려요. OLED 셋째 줄에 \"SAVE \" + 아낀 비율(100 - total // count) + \"%\" 를 적어요"
        hint: 평균은 `total // count` 예요. 글자와 숫자를 이으려면 숫자를 `str()` 로 글자로 바꿔 합쳐요
        code: mission_street_lamp.py
        rules:
          - codeMatches: '^total = 0$'
            fail: 반복이 시작되기 전에 total 은 얼마에서 출발해야 할까요? 반복 안에서 0 으로 정하면 어떻게 될까요?
          - codeMatches: '^\s+total = total \+ \w+$'
            fail: 밤새 쓴 밝기를 모으려면, 반복할 때마다 total 에 무엇을 더해야 할까요?
          - codeMatches: '^\s+count = count \+ 1$'
            fail: 평균을 내려면 몇 번 더했는지도 알아야 하지 않을까요?
          - codeMatches: 'oled\.text\(.*100 - total // count'
            fail: 100 % 로 켰을 때와 비교해 몇 % 를 아꼈는지 화면에서 볼 수 있나요? 평균은 어떻게 구하나요?
        answerCode: extra_energy.py

      - id: debug
        type: debug
        title: 디버깅 — 가로등이 이상해요
        minutes: 6
        scene:
          image: images/out-of-range.svg
          caption: 잰 범위 밖의 값이 들어오면 단계가 −1 이나 4 가 될 수 있어요
        body: |
          고장 난 가로등 세 개가 있어요. 빨간 글씨가 뜨면 단계가 **정수인지**부터, 에러 없이 엉뚱한 글자가 뜨면 **단계 숫자가 0~3 안인지**부터, 밝기가 거꾸로면 **밝기 식의 방향**부터 봐요.

          하나 더: 아두이노처럼 코드로 `map(값, 3500, 500, 0, 3)` 이라고 쓰면, 파이썬은 전혀 다른 일을 하는 내장 `map` 을 불러 `TypeError` 가 나요. 그래서 블록 이름이 **범위 바꾸기**예요. 변수나 함수 이름도 `map` 으로 짓지 말아요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: "단계가 1.5 처럼 소수로 찍히더니 빨간 글씨 TypeError 가 떠요"
            code: |
              from machine import Pin, SoftI2C, ADC
              import ssd1306
              import time

              light = ADC(Pin(36))
              light.atten(ADC.ATTN_11DB)
              light.width(ADC.WIDTH_12BIT)
              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              names = ["DARK", "DIM", "MEDIUM", "BRIGHT"]
              while True:
                  level = ((light.read() - 3500) * (3 - 0) / (500 - 3500) + 0)
                  print(level)
                  oled.fill(0)
                  oled.text(names[level], 0, 0)
                  oled.show()
                  time.sleep(0.5)
            question: names 의 1.5 번째 글자가 있을까요? 단계를 구하는 나누기는 `/` 일까요, `//` 일까요? 두 나누기는 무엇이 다른가요?
            rules:
              - codeMatches: '^\s+level = (.*//|int\()'
                fail: 단계가 아직 소수로 나오지 않나요? 소수점 아래를 버리는 나누기는 무엇이었나요?
          - title: 손으로 꽉 덮으면 DARK 가 아니라 BRIGHT 가 떠요
            code: |
              from machine import Pin, SoftI2C, ADC
              import ssd1306
              import time

              light = ADC(Pin(36))
              light.atten(ADC.ATTN_11DB)
              light.width(ADC.WIDTH_12BIT)
              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              names = ["DARK", "DIM", "MEDIUM", "BRIGHT"]
              while True:
                  level = ((light.read() - 3500) * (3 - 0) // (500 - 3500) + 0)
                  print(level)
                  oled.fill(0)
                  oled.text(names[level], 0, 0)
                  oled.show()
                  time.sleep(0.5)
            question: 잴 때보다 더 꽉 덮어 값이 3800 이 되면 단계는 얼마일까요? 출력 칸의 숫자를 보세요. 파이썬에서 names 의 −1 번째는 무엇일까요? 반대로 훨씬 밝으면 어떻게 될까요?
            rules:
              - codeMatches: 'min\(max\(level, 0\), 3\)|max\(min\(level, 3\), 0\)'
                fail: 단계가 0 보다 작거나 3 보다 크면 어떻게 해야 할까요? 두 수 중 큰 수 · 작은 수를 고르는 블록으로 가둘 수 있을까요?
          - title: 밝은 창가에서 LED 가 가장 밝고, 손으로 덮으면 꺼져요
            code: |
              from machine import Pin, PWM, ADC
              import time

              light = ADC(Pin(36))
              light.atten(ADC.ATTN_11DB)
              light.width(ADC.WIDTH_12BIT)
              led = PWM(Pin(26))
              led.freq(1000)

              while True:
                  level = ((light.read() - 3500) * (3 - 0) // (500 - 3500) + 0)
                  power = ((level - 0) * (100 - 0) // (3 - 0) + 0)
                  print(level, power)
                  led.duty(int(power * 1023 / 100))
                  time.sleep(0.5)
            question: 단계 0(DARK)일 때 power 는 얼마가 나오나요? 단계 3 이면요? 가로등은 어두울수록 어떻게 되어야 할까요? 범위 바꾸기의 마지막 두 칸을 보세요
            rules:
              - codeMatches: '\(0 - 100\)|\(3 - level\)|\[100, |100 - level'
                fail: 단계 0 일 때 밝기가 100 이 되나요? 단계가 커질수록 밝기는 작아지나요?

