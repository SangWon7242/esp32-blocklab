# 교과 융합 트랙 F7 · 밝기 단계 가로등 — 원본: 아두이노 기본 W04(조도 센서 · map 0~3 · DARK/DIM/MEDIUM/BRIGHT · 범위별 분기). S11(14-light-sensor)의 세 구간을 4단계 글자(OLED) + PWM 밝기 + 에너지 계산으로 넓힘. 형식 설명은 src/track/README.md
# 미션은 통합 평가형(codeMatches 규칙 여러 개): 학생마다 잰 값(3500 · 500 자리)이 달라도 통과하게 숫자는 묻지 않는다
id: 34-street-lamp
order: 34
track: fusion
label: F7
prerequisites: [14-light-sensor, 02-breathing-led, 21-oled]
subjects: [과학, 사회, 수학]
sdg: [7, 11]
sessions: 1
teacherNotes: |
  **핀** 포토레지스터와 10kΩ 저항 사이(빛 값)는 **36번**(조도 센서 블록의 기본 핀)이에요. ESP32 Plus 는 아래 줄 io36, 기본 보드는 VP 핀이에요. S11(14장)은 마이크 자리와 겹치지 않게 34번을 썼지만, 이 챕터에는 마이크가 없어요. 14장 배선 그대로 온 모둠은 초록 선 하나만 36번으로 옮기거나, 코드의 핀 번호를 34 로 바꿔도 돼요(둘 다 입력 전용 ADC 핀). 밝기 LED 26번, OLED SCL 22 · SDA 21.

  **값의 방향은 측정 먼저** 밝을수록 값이 커지는지 작아지는지는 배선마다 달라요. 이 챕터 배선(3V3 — 10kΩ — 36번 — 포토레지스터 — GND)은 14장처럼 **어두울수록 값이 커져요**. 그래서 코드에 가렸을 때 3500, 비췄을 때 500 을 넣었어요. 범위 바꾸기의 **첫 칸에 가렸을 때 값, 둘째 칸에 비췄을 때 값**을 넣으면 방향과 상관없이 0 이 DARK, 3 이 BRIGHT 가 돼요. 실행 단계에서 반 전체가 먼저 값을 재게 하세요.

  **경계값은 예시** 3500 · 500 은 예시 값이에요(실측 아님). 단계 경계 활동지를 쓰면 좋아요: 손으로 가렸을 때 · 교실 불빛 · 창가 · 휴대폰 손전등 값을 표로 적고, 가림~비춤 사이를 셋으로 나눈 경계(2500 · 1500 자리)를 계산해 봐요. 미션 판정은 숫자를 묻지 않으므로(codeMatches) 자기 측정값으로 바꿔도 통과해요.

  **`//` 와 BRIGHT** 나머지를 버리는 나누기라서 3 단계는 비췄을 때 값과 **같거나 더 밝을 때만** 나와요(원리 그림의 마지막 점). 원본 W04 의 map 0~3 도 같은 성질이에요. 네 단계를 같은 폭으로 나누고 싶은 모둠에게는 심화로 "0~4 로 바꾼 뒤 3 으로 자르기"를 권해 보세요.

  **map 이름** 아두이노의 `map()` 을 코드로 그대로 쓰면 파이썬은 전혀 다른 일을 하는 내장 `map` 을 불러 `TypeError` 가 나요. 그래서 블록 이름이 **범위 바꾸기**예요. 변수나 함수 이름을 `map` 으로 짓는 것도 내장 map 을 덮어쓰므로 피하게 하세요(디버깅 안내 글).

  **음수 번째** `names[-1]` 은 오류 없이 맨 끝 글자(BRIGHT)를 꺼내요. 그래서 측정보다 더 어두우면 에러 없이 엉뚱한 글자가 떠요(디버깅 증상 2). 범위 밖은 큰 수/작은 수 블록으로 `min(max(level, 0), 3)` 처럼 가둬요.

  **안전** 10kΩ 저항이 꽂힌 + 줄은 **3V3** 에 이어요(5V 에 이으면 신호가 3.3V 를 넘어 ADC 핀이 상할 수 있어요). LED 에는 220Ω 저항을 꼭. 휴대폰 손전등은 눈에 비추지 않게 하세요.

  **메이킹** 종이컵을 갓으로, 박스지를 기둥으로 써서 가로등 모형을 만들어요. 조도 센서는 **갓 위**에 붙여 LED 빛을 직접 받지 않게 해요. LED 빛이 센서로 들어가면 "밝다 → 끔 → 어둡다 → 켬" 이 되풀이되며 깜빡여요(좋은 토론거리예요).

  - 1차시(45분): 문제 만나기 ~ 성찰. 추가 미션(에너지 계산, 5분)은 먼저 끝낸 모둠용이에요. 시간이 모자라면 디버깅 증상 3 과 설계를 다음 시간 시작 활동으로 써요
  - 교과 연결: 과학(빛과 에너지 · 광전도 — 빛을 받으면 저항이 작아지는 물질), 수학(비례식과 일차함수 그래프 — 범위 바꾸기 식을 좌표평면에 그리기, 백분율), 사회(에너지 절약 · 스마트 가로등 — 사람이나 차가 없을 때 밝기를 줄이는 가로등 사례 찾아보기)
title: 밝기 단계 가로등
subtitle: 어두운 만큼만 밝히는 스마트 가로등
summary: |
  해 질 녘과 한밤중은 어둡기가 달라요. 그런데 가로등이 밤새 **100 %** 로 켜져 있다면 전기가 아깝지 않을까요?
  조도 센서 값을 **범위 바꾸기**로 0~3 **단계**로 나누고, 단계마다 OLED 에 **DARK · DIM · MEDIUM · BRIGHT** 를 띄우고, 어두울수록 LED 를 더 밝게 켜는 **스마트 가로등**을 만들어요. 센서 하나, 화면 하나, 불빛 하나를 한 기계로 묶어요.
