wiring:
  image: images/wiring-breadboard.svg
  caption: "브레드보드는 보드 아래에 두어요. 아래 줄 3V3 → + 줄, 아래 줄 GND → − 줄. + 줄 → 20번 줄 → 10kΩ 저항 → 23번 줄 ← 36번(아래 줄 io36), 포토레지스터는 23번 줄과 25번 줄 사이, 25번 줄 → − 줄. LED: 26번(위 줄 io26) → 보드 바깥으로 돌아 6번 줄 → 220Ω 저항 → 10번 줄 긴 다리(+), 짧은 다리(−) 11번 줄 → − 줄. OLED GND · VCC · SDA · SCL → I2C 묶음 첫 줄 GND · 5V · SDA · SCL 에 F-F 듀폰선으로 바로"
  captionDevkit: "브레드보드는 보드 위에 두어요. 3V3(아래 줄) → 보드 바깥으로 돌아 + 줄, GND → − 줄. + 줄 → 16번 줄 → 10kΩ 저항 → 20번 줄 ← VP(36), 포토레지스터는 20번 줄과 22번 줄 사이, 22번 줄 → − 줄. LED 는 1장과 같은 자리: D26 → 11번 줄 → 220Ω 저항 → 6번 줄 긴 다리(+), 짧은 다리(−) 5번 줄 → − 줄. OLED 는 보드 아래: SDA → D21, SCL → D22, GND → GND(아래 줄), VCC → 보드 바깥으로 돌아 VIN"
principle:
  image: images/level-graph.svg
  body: |
    조도 센서의 포토레지스터는 **광전도** 물질로 만들어요. 빛을 받으면 물질 속에 움직일 수 있는 전자가 늘어나 **저항이 작아지고**, 어두우면 저항이 커져요. 포토레지스터를 10kΩ 저항과 이어 두면(3V3 — 10kΩ — 36번 — 포토레지스터 — GND) 어두울수록 36번 전압이 올라가요. 보드는 그 전압을 **0~4095** 숫자로 읽어서, 어두울수록 값이 커져요.

    숫자를 단계로 바꾸는 것은 수학의 **비례식**이에요. 가렸을 때 값(3500)을 0, 비췄을 때 값(500)을 3 에 두고 그 사이를 똑같은 비율로 나누면 그래프의 점선처럼 곧은 직선이 돼요. 블록의 **범위 바꾸기**가 이 계산을 해요.

    - `//` 는 나머지를 버리는 나누기라서 1.5 는 1 이 돼요. 그래서 단계는 소수 없이 **계단**처럼 0 · 1 · 2 · 3 으로만 나와요
    - 단계가 정수여야 리스트에서 0 번째 · 1 번째 글자를 꺼낼 수 있어요
    - 3500 · 500 은 예시예요. 내 교실에서 **먼저 재고** 그 값으로 바꿔요
goals:
  content: 조도 센서 값을 범위 바꾸기로 0~3 단계로 나누고, 단계마다 OLED 글자와 LED 밝기를 다르게 하는 가로등을 만든다
  thinking: 센서 값과 단계 사이의 비례 관계를 식과 그래프로 설명하고, 어두운 만큼만 밝히면 에너지를 얼마나 아끼는지 따져 본다
successCriteria:
  - 손으로 가렸을 때와 손전등을 비췄을 때 값을 재고, 그 두 값으로 범위 바꾸기의 칸을 채울 수 있다
  - 나누기 / 와 // 의 차이를 말하고, 단계가 정수여야 하는 까닭을 설명할 수 있다
  - 단계에 따라 OLED 글자와 LED 밝기가 함께 바뀌는 가로등을 블록으로 만들 수 있다
  - 측정한 범위 밖의 값이 들어올 때 생기는 문제를 찾고, 단계를 0~3 안에 가둘 수 있다
  - 밤새 100 % 로 켤 때와 단계별로 켤 때 쓰는 전기를 비교해 말할 수 있다
parts:
  - id: part1
    title: 빛의 세기를 네 단계로 나눠 가로등 만들기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 얼마나 어두운지 어떻게 알까?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 해 질 녘에는 조금만, 한밤중에는 환하게. 가로등이 어둡기를 네 단계로 알아본다면?
        body: |
          지난번 가로등은 켜거나 끄거나 둘 중 하나였어요. 하지만 해 질 녘 **조금 어두울 때**와 한밤중 **아주 어두울 때**는 필요한 밝기가 달라요.

          가로등은 밤새 켜져 있어서 도시가 쓰는 전기에서 적지 않은 몫을 차지해요. 그래서 필요한 만큼만 밝히는 **스마트 가로등**이 늘고 있어요(SDG 7 모두를 위한 깨끗한 에너지, SDG 11 지속 가능한 도시). 코드를 보기 전에 내 생각부터 적어 봐요.
        todo:
          - 준비물(포토레지스터, 10kΩ 저항, LED, 220Ω 저항, OLED, 브레드보드, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 가로등은 해 질 녘 "조금 어두울 때"와 한밤중 "아주 어두울 때"를 어떻게 구분할 수 있을까요?
          - 가로등을 밤새 100 % 로 켜 두면 전기는 얼마나 들까요? 어두운 정도에 맞춰 밝기를 줄이면 무엇이 달라질까요?
          - 가로등 기둥에 작은 화면이 있다면, 지금 어둡기를 어떤 글자로 알려 주면 좋을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서 · 화면 · 불빛 묶기
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 조도 센서로 알고, 단계로 정하고, OLED 와 LED 로 움직여요
        body: |
          오늘 기계에는 부품이 셋이에요. **조도 센서**가 알려 주는 숫자를 **단계**로 바꾸고, 그 단계 하나로 **OLED 글자**와 **LED 밝기**를 함께 정해요.

          보드는 "조금 어둡다"는 말을 몰라요. 어디부터 어디까지가 한 단계인지 사람이 숫자로 정해 줘야 해요. 부품마다 세 칸에 하나씩 적어 보세요.
        todo:
          - "**알아야 할 것**: 센서가 주는 값의 범위, 가렸을 때와 비췄을 때 값"
          - "**정해야 할 것**: 단계를 몇 개로, 단계마다 어떤 글자와 몇 % 밝기로 할지"
          - "**해야 할 것**: 센서 · 화면 · LED 가 되풀이할 일"
        answer:
          know: ["조도 센서 36번, 밝기 LED 26번, OLED SCL 22 · SDA 21", "센서 값은 0~4095", "손으로 가렸을 때 값과 손전등을 비췄을 때 값 (직접 재기)", "가리면 값이 커지는지 작아지는지"]
          decide: ["단계는 0~3 네 개 (가림 → 0, 비춤 → 3)", "단계마다 글자: 0 DARK · 1 DIM · 2 MEDIUM · 3 BRIGHT", "단계마다 LED 밝기: 100 · 66 · 33 · 0 %", "몇 초마다 잴지"]
          act: ["빛 값 읽기", "범위 바꾸기로 값을 단계로 바꾸기", "OLED 를 지우고 단계 글자 적고 내보내기", "단계에 맞게 LED 밝기 정하기", "끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 손으로 가리면 몇 단계?
        minutes: 3
        scene:
          image: images/level-graph.svg
          caption: 가렸을 때 3500 은 0, 비췄을 때 500 은 3. 그 사이 값은 몇 단계가 될까요?
        body: |
          활동 칸의 코드는 빛 값을 읽고, **범위 바꾸기**로 0~3 단계로 바꿔 둘 다 출력해요. 아직 실행하지 않아요.

          범위 바꾸기 칸에는 가렸을 때 값 3500 과 비췄을 때 값 500 이 들어 있어요(예시 값). 그림의 계단을 보며 내 예측을 먼저 적어요. 틀려도 괜찮아요.
        todo:
          - 코드를 한 줄씩 소리 내어 읽기
          - 빛 값을 단계로 바꾸는 줄 찾기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_light_level.py
        blanks:
          - q: 손으로 센서를 꽉 가리면 단계는 몇이 나올까요?
          - q: 휴대폰 손전등을 바짝 비추면 단계는 몇이 나올까요?
          - q: 교실 불빛 아래에서는 몇 단계쯤일까요? 그렇게 생각한 까닭은요?

      - id: run
        type: run
        title: 복사 · 실행 — 빛 값을 재고 단계로
        minutes: 6
        scene:
          image: images/wiring-breadboard.svg
          caption: "포토레지스터와 10kΩ 사이 → 36번(아래 줄 io36), LED → 26번, OLED → I2C 묶음에 바로. + 줄은 3V3"
          captionDevkit: "포토레지스터와 10kΩ 사이 → VP(36), LED → D26, OLED SDA → D21 · SCL → D22. + 줄은 3V3"
        body: |
          **USB 를 뺀 채로** **부품과 배선**의 배선도를 보고 부품을 모두 꽂아요. 이번 실행은 포토레지스터만 쓰지만, LED 와 OLED 도 지금 꽂아 두면 미션에서 바로 쓸 수 있어요. 10kΩ 저항이 꽂힌 + 줄은 꼭 **3V3** 에 이어요.

          실행한 뒤 센서를 **손으로 꽉 가렸을 때**와 **손전등을 비췄을 때** 값을 공책에 적어요. 그 두 숫자로 범위 바꾸기의 3500 과 500 을 바꾸고 다시 실행해서, 가리면 0 · 비추면 3 이 나오는지 확인해요.
        todo:
          - "**부품과 배선**대로 포토레지스터 · 10kΩ 저항 · LED · OLED 꽂기"
          - "**실행** 누르고 가렸을 때 값 · 비췄을 때 값을 공책에 적기"
          - 범위 바꾸기의 두 숫자를 내 값으로 바꿔 다시 실행하기
        code: step1_light_level.py
        expected: 코드를 실행하면 0.5초마다 `빛 값 단계` 두 숫자가 한 줄씩 나와요. 손으로 가리면 단계가 0 쪽으로, 손전등을 비추면 3 쪽으로 바뀌어요.
        codeNotes:
          - { line: 1, note: "핀을 다루는 `Pin` 과 전압을 숫자로 읽는 `ADC` 기능을 가져와요" }
          - { line: 4, note: "36번 핀을 조도 센서 입력으로 준비하고 이름을 `light` 로 붙여요 (4~6번 줄)" }
          - { line: 6, note: "값을 **0~4095** 숫자로 받게 정해요" }
          - { line: 9, note: "지금 빛 값을 읽어 `value` 에 담아요" }
          - { line: 10, note: "**범위 바꾸기**: 3500~500 을 0~3 으로. `//` 라서 단계는 늘 정수예요" }
          - { line: 11, note: "빛 값과 단계를 한 줄에 함께 찍어요" }
          - { line: 12, note: "0.5초 기다렸다가 다시 재요" }

