          오늘은 센서 값을 단계로 바꾸고, 단계 하나로 화면과 불빛을 함께 움직였어요. 먼저 코드 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요.

          수학 시간처럼 공책에 빛 값과 단계를 표로 적고, 가로축 빛 값 · 세로축 단계로 그래프를 그려 계단 모양을 확인해 보세요. 가로등 하나가 100 W 이고 밤 12시간 가운데 4시간을 MEDIUM(33 %)으로 켰다면 100 % 로 켤 때보다 몇 Wh 를 아꼈는지도 계산해 봐요.
