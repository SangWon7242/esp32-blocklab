  <circle cx="330" cy="170" r="38" fill="var(--muted)" fill-opacity="0.5" stroke-width="3"/>
  <path d="M357 197 L388 228" stroke-width="7"/>
  <circle cx="458" cy="110" r="13" fill="#4562f5" stroke="none"/>
  <text x="458" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">1</text>
  <text x="480" y="111" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">깃발의 길 따라가기</text>
  <text x="480" y="132" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.75" stroke="none">핸들러에서 올리고, 반복에서 내려요</text>
  <circle cx="458" cy="188" r="13" fill="#4562f5" stroke="none"/>
  <text x="458" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">2</text>
  <text x="480" y="189" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">상태 번호 세기</text>
  <text x="480" y="210" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.75" stroke="none">0 → 1 → 2 → 0 을 손가락으로</text>
  <circle cx="458" cy="266" r="13" fill="#4562f5" stroke="none"/>
  <text x="458" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">3</text>
  <text x="480" y="267" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">줄 번호 누르기</text>
  <text x="480" y="288" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.75" stroke="none">답은 코드 안에 있어요</text>
