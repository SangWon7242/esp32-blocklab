  <text x="24" y="304" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">0 이 10번쯤 → 10/30 = 1/3 (매번 꼭 10번은 아니에요)</text>
  <text x="330" y="70" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">속력 = 거리 ÷ 시간</text>
