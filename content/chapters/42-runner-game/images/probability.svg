  <text x="330" y="152" text-anchor="start" font-size="13" font-weight="600" fill="currentColor" stroke="none">한 프레임(0.1초)에 한 칸 = 8픽셀</text>
  <text x="330" y="174" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">1초면 10칸 = 80픽셀</text>
  <text x="330" y="196" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">15번 칸 → 1번 칸: 14칸 = 1.4초</text>
