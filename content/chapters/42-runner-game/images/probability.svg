  <text x="330" y="258" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">0.1초 → 0.05초: 같은 거리를 반만에 → 2배 빠름</text>
  <text x="330" y="280" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">점수가 오를수록 간격을 줄이면 점점 어려워져요</text>
  <text x="330" y="304" text-anchor="start" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8" stroke="none">표로 적어 보기: 간격(초) · 1초에 가는 칸 · 반응할 시간</text>
