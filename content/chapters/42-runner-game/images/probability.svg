<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rgp-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rgp-title">수학으로 보기: random.randint(0, 2) 는 0, 1, 2 세 갈래가 똑같이 나와 0(벽돌)이 나올 확률은 1/3 이다. 30번 해 보면 0 이 10번쯤 나온다. 속력은 거리 나누기 시간: 한 프레임(0.1초)에 벽돌이 한 칸(8픽셀) 움직여 1초면 80픽셀, 15번 칸에서 1번 칸까지 14칸은 1.4초다. 프레임 간격을 0.05초로 줄이면 2배 빠르다</title>
  <defs><marker id="rgp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <text x="24" y="34" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">수학으로 보기: 확률 1/3, 속력</text>
  <rect x="48.0" y="59.5" width="164.1" height="21" rx="10.5" fill="var(--card)" stroke-width="1.5" stroke="#f4af18"/><text x="130.0" y="74.7" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">random.randint(0, 2)</text>
  <path d="M130 82 L60 112" stroke="currentColor" stroke-width="2" marker-end="url(#rgp-arrow)"/>
  <rect x="38" y="114" width="44" height="36" rx="8" fill="var(--card)" stroke="#e03131" stroke-width="2"/>
  <text x="60" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">0</text>
