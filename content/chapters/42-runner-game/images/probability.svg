  <rect x="108" y="114" width="44" height="36" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="2"/>
  <text x="130" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">1</text>
  <path d="M130 82 L200 112" stroke="currentColor" stroke-width="2" marker-end="url(#rgp-arrow)"/>
  <rect x="178" y="114" width="44" height="36" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="2"/>
  <text x="200" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">2</text>
  <text x="60" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#e03131" stroke="none">벽돌</text>
  <text x="165" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" fill-opacity="0.8" stroke="none">빈 칸</text>
  <text x="130" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">세 갈래가 똑같이 나와요 → 벽돌 확률 1/3</text>
  <text x="24" y="236" text-anchor="start" font-size="13" font-weight="700" fill="currentColor" stroke="none">30번 해 보면 (예시)</text>
