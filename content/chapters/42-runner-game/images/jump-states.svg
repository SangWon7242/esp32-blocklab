<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rgj-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rgj-title">점프 상태 번호: 0 은 땅(y 40), 버튼을 누르면 1(y 32), 다음 프레임에 2(y 24), 그다음 프레임에 다시 0 이다. 충돌은 bricks[1] == 1 and jump == 0, 즉 디콘 칸(1번)에 벽돌이 있고 땅에 있을 때만이며, 공중(1 이나 2)이면 부딪히지 않는다. 디콘 y 는 40 − jump × 8</title>
  <defs><marker id="rgj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <text x="24" y="34" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">점프 상태 번호 0 · 1 · 2 와 충돌 조건</text>
  <rect x="24" y="70" width="148" height="84" rx="8" fill="#1d4ed8"/>
  <rect x="34" y="80" width="128" height="64" rx="2" fill="#0b1b4d" stroke="none"/>
  <g fill="#7dd3fc" stroke="none">
  <rect x="34" y="136" width="128" height="1"/>
  <rect x="42" y="128" width="8" height="8"/>
  <rect x="42" y="120" width="8" height="12"/>
  <rect x="42" y="132" width="3" height="4"/>
  <rect x="47" y="123" width="2" height="2" fill="#0b1b4d"/>
  </g>
  <circle cx="98" cy="60" r="13" fill="#e03131" stroke="none"/>
  <text x="98" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">0</text>
  <text x="98" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.85" stroke="none">땅 (y 40)</text>
  <rect x="216" y="70" width="148" height="84" rx="8" fill="#1d4ed8"/>
  <rect x="226" y="80" width="128" height="64" rx="2" fill="#0b1b4d" stroke="none"/>
  <g fill="#7dd3fc" stroke="none">
  <rect x="226" y="136" width="128" height="1"/>
  <rect x="234" y="128" width="8" height="8"/>
  <rect x="234" y="112" width="8" height="12"/>
  <rect x="239" y="124" width="3" height="4"/>
  <rect x="239" y="115" width="2" height="2" fill="#0b1b4d"/>
  </g>
  <circle cx="290" cy="60" r="13" fill="#4562f5" stroke="none"/>
  <text x="290" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">1</text>
  <text x="290" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.85" stroke="none">공중 (y 32)</text>
  <rect x="408" y="70" width="148" height="84" rx="8" fill="#1d4ed8"/>
  <rect x="418" y="80" width="128" height="64" rx="2" fill="#0b1b4d" stroke="none"/>
  <g fill="#7dd3fc" stroke="none">
  <rect x="418" y="136" width="128" height="1"/>
  <rect x="426" y="128" width="8" height="8"/>
  <rect x="426" y="104" width="8" height="12"/>
  <rect x="426" y="116" width="3" height="4"/>
  <rect x="431" y="107" width="2" height="2" fill="#0b1b4d"/>
  </g>
  <circle cx="482" cy="60" r="13" fill="#4562f5" stroke="none"/>
  <text x="482" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">2</text>
  <text x="482" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.85" stroke="none">공중 (y 24)</text>
  <path d="M172 112 H214" stroke="currentColor" stroke-width="2" marker-end="url(#rgj-arrow)"/>
  <text x="193" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8" stroke="none">누름</text>
  <path d="M364 112 H406" stroke="currentColor" stroke-width="2" marker-end="url(#rgj-arrow)"/>
  <text x="385" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8" stroke="none">다음</text>
  <path d="M482 154 V190 H98 V156" stroke="currentColor" stroke-width="2" marker-end="url(#rgj-arrow)"/>
  <text x="290" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8" stroke="none">다음 프레임 → 다시 0 (땅)</text>
  <rect x="24" y="214" width="592" height="54" rx="10" fill="var(--muted)"/>
  <text x="40" y="236" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">충돌 =</text>
  <rect x="93.3" y="230.5" width="113.4" height="21" rx="10.5" fill="var(--card)" stroke-width="1.5" stroke="#e03131"/><text x="150.0" y="245.7" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">bricks[1] == 1</text>
  <text x="230" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4562f5" stroke="none">and</text>
  <rect x="262.8" y="230.5" width="74.4" height="21" rx="10.5" fill="var(--card)" stroke-width="1.5" stroke="#e03131"/><text x="300.0" y="245.7" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">jump == 0</text>
  <text x="372" y="246" text-anchor="start" font-size="13" font-weight="600" fill="currentColor" stroke="none">→ 1번 칸에 벽돌이 있고 땅에 있을 때만</text>
  <text x="40" y="262" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.8" stroke="none">상태 1 이나 2 (공중)이면 같은 칸이어도 부딪히지 않아요</text>
  <text x="24" y="300" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">디콘 y = 40 − jump × 8</text>
  <text x="24" y="322" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">상태 0: 40,  상태 1: 32,  상태 2: 24 — 몸 12 + 다리 4 = 16픽셀, 땅은 y 56</text>
  <text x="24" y="344" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.85" stroke="none">눌린 깃발은 땅(0)에 있을 때만 1 로 바꿔요. 공중에서 누른 것은 무시</text>
</svg>
