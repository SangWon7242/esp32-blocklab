        body: |
          먼저 끝낸 사람을 위한 미션이에요. **수동 부저**(25번)로 점프할 때 높은 음(880 Hz)을 0.03초, 부딪힐 때 낮은 음(220 Hz)을 0.5초 울려요. **가변저항**(39번)으로 프레임 간격을 정해요. 다이얼 값 0 ~ 4095 를 **범위 바꾸기** 블록으로 160 ~ 60 ms 로 바꿔 기다려요. 돌릴수록 빨라져요.

          소리를 울리는 동안도 시간이 흘러요. 점프 소리를 길게 하면 프레임이 늦어지니 아주 짧게 해요. 가변저항은 USB 를 뺀 채 배선 그림처럼 꽂고, 가운데 다리가 39번과 이어졌는지 확인해요.
