      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 6
        scene:
          image: images/game-loop.svg
          caption: 입력 → 상태 → 판정 → 그리기 → 기다리기. 이 한 바퀴가 모든 게임의 뼈대예요
        body: |
          세 시간 동안 깃발 · 벽돌 리스트 · 점프 상태 번호로 게임을 완성했어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 충돌 조각 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요. 수학 시간에는 프레임 간격 0.1 · 0.08 · 0.05초일 때 1초에 지나가는 칸 수를 표로 적고 반비례를 찾아보자. 체육 시간에는 친구 다섯 명의 점수와 S21 에서 잰 반응 시간(ms)을 나란히 적어 관계를 찾아보자. 미술 시간에는 8×16 모눈에 내 캐릭터의 달리기 두 장을 그려 보자.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 "깃발 → 점프 상태 → 충돌" 순서를 설명하기
        lineExplain: reflect_collision.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 핸들러가 깃발만 올리고 반복이 내리는 까닭을 짝에게 설명한다면 어떻게 말할까요? 반복이 내리지 않았을 때 어떤 일이 생겼나요?
          - 벽돌 확률(1/3)과 프레임 간격(0.1초)을 바꾸면 게임의 어려움이 어떻게 달라질까요? 내가 고른 값과 그 이유는?
          - "다음엔 여기부터 본다: 한 줄로"

