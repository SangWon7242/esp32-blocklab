          - 점프 시작 자리에 880 Hz 0.03초, 충돌 자리에 220 Hz 0.5초 소리 넣기
          - 다이얼 값을 160 ~ 60 ms 로 바꿔 기다리고 **판정** 누르기
        instructions: "미션 코드에 더하세요. 수동 부저를 25번에 beeper 이름으로, 가변저항을 39번에 knob 이름으로 준비해요. 점프를 1 로 바꾼 바로 뒤에 beeper 로 880 Hz 음을 0.03초 울리고, 충돌해서 GAME OVER 를 내보낸 뒤 220 Hz 음을 0.5초 울리고 1.5초 더 기다려요. 반복 끝의 기다리기는 knob 값(0 ~ 4095)을 160 ~ 60 으로 바꾼 wait 만큼 ms 로 기다려요"
        hint: "소리 블록은 4줄 꼴이에요: beeper.freq(880) · beeper.duty(512) · time.sleep(0.03) · beeper.duty(0). 범위 바꾸기: wait = ((knob.read() - 0) * (60 - 160) // (4095 - 0) + 160) 다음 time.sleep_ms(wait)"
