# 교과 융합 F15 · 달리는 디콘 — OLED 점프 게임. 원본: 아두이노 기본 W11 런닝맨 게임(16×2 LCD) + 심화 W03 달리기 게임. 축소안: 벽돌 리스트 한 줄(16칸) + 점프 상태 번호 3개(땅 0 / 공중 1·2). 형식 설명은 src/track/README.md
# 버튼 14(점프 · 인터럽트 깃발) + OLED(SCL 22 · SDA 21). 선택: 가변저항 39(속도) · 수동 부저 25(효과음, ESP32 Plus 에 io15 가 없어 15에서 옮김) — 추가 미션에서만
id: 42-runner-game
order: 42
track: fusion
label: F15
prerequisites: [21-oled, 23-button-king, 24-interrupt]
subjects: [정보, 미술, 체육, 수학]
sdg: [3]
sessions: 3
teacherNotes: |
  **차시 배분(3차시)** 1부(문제 만나기 ~ 읽기 체크 1, 약 40분): 배선 · 인터럽트 깃발 · 대기 화면. 2부(실행 2 ~ 읽기 체크 3, 약 40분): 벽돌 리스트 · 점프 상태. 3부(미션 ~ 성찰, 약 45분): 충돌 · 게임 오버 · 디버깅 · 설계. 추가 미션(효과음 · 속도 다이얼)은 먼저 끝낸 학생용이에요.

  **숫자는 모두 예시예요.** 한 프레임 `100` ms, 벽돌 확률 `1/3`(`randint(0, 2) == 0`), 디콘 칸 `1`, 점수 `distance // 8`, 공중 2프레임은 원본 게임을 축소한 값이에요. 반 수준에 맞춰 바꾸되, 미션 판정은 지시의 글자 그대로(`bricks[1] == 1 and jump == 0`, `distance // 8`)여야 통과하니 판정을 받은 뒤 바꾸게 하세요. 어려워하면 프레임을 `150`~`200` ms 로 늦추거나, `if jump > 2:` 를 `if jump > 3:` 으로 바꿔 공중을 3프레임으로 늘려 주세요(점프 한 번에 반응할 수 있는 시간이 0.2초 → 0.3초).

  **그리기 함수는 교사가 줘도 돼요.** `draw_hero(y)` 는 디콘을 그리는 함수(몸 8×12 + 다리 3×4, 거리가 짝수 · 홀수일 때 다리 자리를 바꿔 달리는 것처럼)예요. 학생이 직접 짜지 않아도 되지만, 블록으로 접히는 꼴(채운 네모 · 만약 · 나머지 연산)로 그대로 주세요. 미술 시간과 이으면 8×16 모눈에 자기 캐릭터 두 장을 디자인해 좌표로 옮겨 볼 수 있어요.

  - **배선** USB 를 뺀 채로. OLED 는 GND · VCC · SCL · SDA 네 핀(모듈에 적힌 글자를 꼭 읽기). ESP32 Plus 는 I2C 묶음(GND · 5V · SDA · SCL)에 F-F 듀폰선으로 바로, 기본 보드는 GND · SDA(21) · SCL(22) 는 바로, VCC 는 브레드보드 + 줄(3V3). 버튼은 가운데 홈에 걸쳐 꽂고 한쪽 다리 → 14번, 대각선 다리 → − 줄(풀업이라 누르면 0). 줄 번호는 보드마다 달라서 배선도 아래 표를 따라요. `ssd1306.py` 는 실행할 때 블록랩이 함께 올려요.
  - **인터럽트 복습(S21)** 핸들러 `on_press` 는 `global pressed` 뒤에 `pressed = True` 만 해요. 반복이 깃발을 보고 내려요(`pressed = False`). 내리지 않으면 디버깅 증상 3(점프 두 번)이 나요. 버튼 떨림으로 핸들러가 두 번 불려도 깃발은 한 번만 올라가므로 이 방식이 떨림에도 강해요.
  - **게임 멈추기** 끝없는 반복이라 블록랩의 **정지**로 멈춰요. 화면이 GAME OVER 에서 멈춘 듯 보이면 2초 기다리는 중이에요.
  - **3부 미션(통합 평가)** 판정 목록 일곱 개가 체크리스트예요(깃발 핸들러 · 깃발 내리기 · 벽돌 이동 · 충돌 and 조건 · GAME OVER 화면 · 점수 ÷ 8 · 새 게임 초기화). 실행 3 코드가 미리 깔려 있고, 학생은 충돌 → 게임 오버 → 대기 화면 → 새 게임 초기화를 더해요.
  - **메이킹** 박스지로 게임기 케이스를 만들고 버튼 구멍 · 화면 창을 뚫어 꾸며요(미술). 호일 패드(F9)로 버튼을 대신해도 돼요.
  - **안전** 특별한 위험은 없지만 OLED 핀 순서가 다른 모듈(VCC · GND 가 바뀐 것)이 있어 글자를 읽고 꽂게 하세요. 눈이 아프지 않게 20분마다 화면에서 눈을 떼고 멀리 보기.

  **교과 연결**
  - 정보: 게임 루프(입력 → 상태 → 판정 → 그리기 → 기다리기), 상태 번호(0 · 1 · 2)로 움직임 표현, 리스트로 벽돌 줄 표현(`pop(0)` · `append`), 충돌 판정(`and`), 난수, 인터럽트와 깃발.
  - 수학: 확률 — `randint(0, 2)` 세 가지 가운데 0 은 1/3, `randint(0, 3)` 이면 1/4(디버깅 증상 2). 30번 · 300번 시험해 상대도수 표 만들기. 속력 = 거리 ÷ 시간(한 프레임에 8픽셀 → 1초에 80픽셀), 프레임 간격과 속력의 반비례(설계 단계).
  - 미술: 스프라이트 애니메이션 — 그림 두 장을 번갈아 보여 주면 달리는 것처럼 보여요(잔상). 8×16 모눈 캐릭터 디자인.
  - 체육: 반응 속도 — 벽돌이 1번 칸에 오기 0.2초 안에 눌러야 해요. 친구들 점수와 S21 추가 미션의 반응 시간(ms)을 비교해 보기. 눈과 손의 협응.
  - 사회 · 도덕(선택): 원작 이야기 — 놀림받은 친구를 위해 디콘이 달려요. 게임의 시작 · 끝 화면에 넣을 이야기를 한 줄로 쓰고, 누구나 할 수 있는 게임(버튼 하나)이 왜 좋은지 이야기해요(SDG 3 건강과 웰빙, 모두가 즐기는 놀이).
title: 달리는 디콘 — OLED 점프 게임
subtitle: 버튼 하나, 깃발 하나, 벽돌 리스트 한 줄
summary: |
  OLED 화면에서 디콘이 달려요. 벽돌이 한 칸씩 다가오고, 버튼을 누르면 디콘이 점프해 벽돌을 넘어요. 부딪히면 GAME OVER, 점수는 달린 거리 ÷ 8.
  **인터럽트 깃발**(S21)로 버튼을 놓치지 않고, **벽돌 리스트 16칸**을 한 칸씩 옮기고, **점프 상태 번호 0 · 1 · 2** 로 움직임을 만들어요. 3차시 동안 게임을 한 조각씩 완성해요.
