        optional: true
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "선택 부품을 이어요: 수동 부저 + → io25, − → − 줄. 가변저항 가운데 → 아래 줄 io39, 양 끝 → + 줄 · − 줄"
