  - { name: 수동 부저 (선택), note: "추가 미션의 점프 · 충돌 소리. 초록 판이 보이는 쪽, + 다리 → 25번" }
  - { name: F-F 듀폰선 4가닥, board: plus, note: "양쪽 끝이 구멍인 선. OLED 네 핀 → I2C 묶음 GND · 5V · SDA · SCL" }
  - { name: M-F 듀폰선 3가닥, board: plus, note: "보드 3V3 · GND · io14 → 브레드보드. 선택 부품은 2가닥 더(io25 · io39)" }
  - { name: F-F 듀폰선 3가닥, board: devkit, note: "양쪽 끝이 구멍인 선. OLED GND · SDA · SCL → GND · D21 · D22" }
