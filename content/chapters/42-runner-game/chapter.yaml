            fail: 점프가 시작되는 바로 그 자리에서 높은 음이 나나요? 어느 줄 다음에 소리 블록을 두어야 할까요?
          - codeMatches: 'beeper\.freq\(220\)'
            fail: 부딪혔을 때 낮은 음(220 Hz)이 나나요?
          - codeMatches: 'knob\.read\(\) - 0\) \* \(60 - 160\) // \(4095 - 0\) \+ 160'
