wiring:
  image: images/wiring-breadboard.svg
  caption: "OLED 는 F-F 듀폰선으로 I2C 묶음 첫 줄 GND · 5V · SDA · SCL 에 바로. 브레드보드는 보드 아래: 아래 줄 3V3 → 위 + 줄, GND → 위 − 줄, 위 − 줄과 아래 − 줄은 점퍼로. 버튼은 가운데 홈에 걸쳐 12 · 14번 줄: io14 → 12번 줄, 대각선 14번 줄 → 아래 − 줄. 선택 부품은 추가 미션에서: 수동 부저 6 · 8번 줄(+ → io25), 가변저항 23 · 24 · 25번 줄(가운데 → 아래 줄 io39)"
  captionDevkit: "브레드보드는 보드 위: 3V3 → + 줄, GND → − 줄, 위 − 줄과 아래 − 줄은 점퍼로. 버튼은 가운데 홈에 걸쳐 8 · 10번 줄: D14 → 8번 줄, 대각선 10번 줄 → 위 − 줄. OLED GND → GND · SDA → D21 · SCL → D22 는 F-F 로 바로, VCC → + 줄. 선택 부품은 추가 미션에서: 수동 부저 12 · 14번 줄(+ → D25), 가변저항 18 · 19 · 20번 줄(가운데 → VN)"
principle:
  image: images/game-loop.svg
  body: |
    **움직이는 것처럼 보이는 까닭(과학 · 미술)** 화면의 그림은 한 장씩 멈춰 있어요. 그런데 0.1초마다 조금씩 다른 그림으로 바꾸면 우리 눈은 앞 그림의 **잔상**이 남아 있어서 이어진 움직임으로 봐요. 영화 · 만화 · 게임이 모두 이 원리예요. 디콘의 다리 두 장을 번갈아 그리면 달리는 것처럼 보여요.

    **게임 루프(정보)** 게임은 "깃발 보기 → 상태 바꾸기 → 충돌 판정 → 그리기 → 0.1초 기다리기"를 끝없이 되풀이해요. 한 바퀴가 **한 프레임**이에요. 벽돌은 리스트 16칸으로 두고 매 프레임 `pop(0)` 으로 한 칸씩 다가오게 해요. 점프는 상태 번호 `0`(땅) · `1` · `2`(공중)로 표현하고, 충돌은 **디콘 칸에 벽돌이 있고 땅에 있을 때**만이에요.

    **속력(수학)** 한 프레임에 한 칸(8픽셀)씩 움직이니 속력은 1초에 80픽셀이에요. 프레임 간격을 줄이면 같은 거리를 더 짧은 시간에 가니 빨라져요. 간격과 속력은 **반비례**예요.
goals:
  content: 인터럽트 깃발로 버튼 입력을 받고, 벽돌 리스트와 점프 상태 번호로 움직임 · 충돌 · 점수를 만들어 OLED 점프 게임을 완성한다
  thinking: 게임을 "입력 → 상태 → 판정 → 그리기" 프레임 단위로 나누어 설계하고, 확률 · 속력 · 반응 시간을 숫자로 바꿔 어려움을 조절한다
successCriteria:
  - 핸들러는 깃발만 올리고 반복이 깃발을 보고 내리는 까닭을 설명할 수 있다
  - 리스트의 0번 칸을 지우고 맨 뒤에 넣으면 벽돌이 한 칸 다가온다는 것을 그림으로 설명할 수 있다
  - 점프 상태 0 · 1 · 2 와 충돌 조건 `bricks[1] == 1 and jump == 0` 을 코드로 짤 수 있다
  - 벽돌 확률 1/3 과 프레임 간격이 게임의 어려움을 어떻게 바꾸는지 말할 수 있다
parts:
  - id: part1
    title: 1부 · 깃발로 시작하는 대기 화면
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 버튼 하나로 하는 게임
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 디콘이 달리고, 벽돌이 다가오고, 버튼을 누르면 점프. 화면은 0.1초마다 새로 그려요
        body: |
          컴퓨터 게임의 첫 모습은 버튼 하나로 하는 점프 게임이었어요. 버튼 하나면 손을 쓰기 어려운 친구도, 할머니도 함께 할 수 있어요. 모두가 즐겁게 몸과 머리를 쓰는 놀이는 유엔 지속가능발전목표 **SDG 3**(건강과 웰빙)과도 이어져요.

          오늘부터 세 시간 동안 OLED 화면에서 달리는 **디콘** 게임을 만들어요. 그런데 보드는 한 줄씩 차례로 실행하죠. 반복이 그림을 그리는 사이에 누른 버튼은 어떻게 될까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(OLED, 버튼, 선)을 책상에 꺼내 놓고 S21 의 깃발 코드를 떠올리기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 내가 아는 점프 게임에서 "부딪혔다"는 순간이 언제인지 떠올리기
        questions:
          - 버튼 하나로 하는 게임은 "언제 눌렀는지"를 어떻게 놓치지 않을까요? S21 에서 배운 것 가운데 쓸 수 있는 것은 무엇일까요?
          - 화면 속 벽돌은 어떻게 움직이는 것처럼 보일까요? 그림을 몇 번이나 다시 그려야 할까요?
          - 디콘이 벽돌에 "부딪혔다"는 것을 보드는 무엇과 무엇을 비교해 알 수 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 8
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          게임기를 부품마다 나눠 생각해 봐요. **버튼**은 "눌렸다"는 깃발을, **보드**는 벽돌 자리와 디콘의 높이를, **OLED** 는 매 프레임 새 그림을 맡아요.

          보드는 "저기 저 벽돌"을 몰라요. 벽돌 자리를 **리스트 16칸**(0 ~ 15번)에 1 과 0 으로 적고, 디콘은 늘 **1번 칸**에 두면 숫자로 비교할 수 있어요. 점프도 "뜨고 있다"가 아니라 상태 번호 **0 · 1 · 2** 로 적어요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요. 수학 시간에는 "세 가지 가운데 하나"가 왜 1/3 인지 주사위로 확인해 보자.
        todo:
          - "**알아야 할 것**: 깃발 · 벽돌 자리 · 디콘 높이처럼 보드가 기억해야 할 것 적기"
          - "**정해야 할 것**: 점프 중인가 · 부딪혔나 · 다음 벽돌은 언제 같은 기준 적기"
          - "**해야 할 것**: OLED 와 보드가 매 프레임 하는 일 적기"
        answer:
