<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="irp-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="irp-title">폴링과 인터럽트 비교: LED 를 2초 켜고 2초 끄는 반복이 4초에 한 번만 버튼을 확인하면, 1초쯤에 0.5초 누른 버튼은 놓친다. 인터럽트는 누르는 순간 on_press 함수가 바로 실행된다</title>
  <defs><marker id="irp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <text x="24" y="38" font-size="15" font-weight="700" fill="currentColor" stroke="none">LED 가 2초씩 켜지고 꺼지는 동안, 버튼을 0.5초 누르면?</text>
  <text x="24" y="98" font-size="15" font-weight="700" fill="currentColor" stroke="none">if 로 확인</text>
  <text x="24" y="118" font-size="13" fill="currentColor" stroke="none" fill-opacity="0.7">4초에 한 번만</text>
  <rect x="120" y="80" width="120" height="22" rx="4" fill="#ffd43b" fill-opacity="0.75" stroke-width="1.5"/>
  <rect x="240" y="80" width="120" height="22" rx="4" fill="var(--muted)" stroke-width="1.5"/>
