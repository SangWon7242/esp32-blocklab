  <text x="180" y="220" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">LED 켜짐</text>
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">꺼짐</text>
  <path d="M120 238 H604" stroke-width="1.5"/>
