  <text x="180" y="96" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">LED 켜짐</text>
  <text x="300" y="96" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">꺼짐</text>
  <path d="M120 114 H604" stroke-width="1.5"/>
  <circle cx="360" cy="114" r="7" fill="#4562f5" stroke="none"/>
