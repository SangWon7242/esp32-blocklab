  <text x="560" y="134" font-size="12" fill="#4562f5" stroke="none" font-weight="700">확인</text>
  <rect x="180" y="124" width="30" height="12" rx="3" fill="#2f9e44" stroke="none"/>
  <text x="195" y="154" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">누름</text>
