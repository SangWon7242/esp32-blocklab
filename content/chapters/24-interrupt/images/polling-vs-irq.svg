  <text x="24" y="242" font-size="13" fill="currentColor" stroke="none" fill-opacity="0.7">누르는 순간</text>
  <rect x="120" y="204" width="120" height="22" rx="4" fill="#ffd43b" fill-opacity="0.75" stroke-width="1.5"/>
