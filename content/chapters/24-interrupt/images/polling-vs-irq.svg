  <text x="24" y="324" font-size="14" fill="currentColor" stroke="none">반복은 쉬는 동안 버튼을 못 봐요.</text>
  <text x="24" y="346" font-size="14" fill="currentColor" stroke="none">인터럽트는 보드가 하던 일을 잠깐 멈추고 함수를 먼저 실행해요.</text>
