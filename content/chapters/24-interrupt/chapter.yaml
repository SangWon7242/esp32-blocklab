# 센서 트랙 S21 · 버튼이 끼어들기 — 인터럽트. 원본: 아두이노 기본 W10(attachInterrupt, 깜박이는 동안 늦게 반응하는 버튼, 인터럽트 플래그). 형식 설명은 src/track/README.md
id: 24-interrupt
order: 24
track: sensor
label: S21
prerequisites: [11-button-touch, 23-button-king]
subjects: [정보, 과학]
sessions: 1
teacherNotes: |
  **핸들러는 짧게.** 인터럽트 함수(핸들러)는 하던 일을 멈추고 끼어드는 함수라, 안에서는 깃발 세우기·숫자 올리기처럼 금방 끝나는 일만 하게 지도합니다. `time.sleep` 은 쓰지 않고(검사 주의 `irq-handler-sleep`), `print` 도 실제 작품에서는 피하는 것이 좋습니다. 실행 2의 `print` 는 "누르는 순간 바로 불린다"를 눈으로 보려는 **관찰용**입니다. ESP32 MicroPython 의 핸들러는 소프트 인터럽트라 sleep 이 보드를 완전히 멈추지는 않지만, 수업 규칙으로 금지합니다.

  **버튼 떨림(바운스).** 버튼 안의 금속 접점이 닿는 순간 수 ms 동안 튀어서 1 → 0 이 여러 번 생깁니다. 그래서 한 번 눌렀는데 핸들러가 두세 번 불릴 수 있습니다(실행 2에서 먼저 보이면 "디버깅에서 다룬다"고만 말해 주세요). 디버깅 증상 3과 설계 단계에서 다시 만납니다. 무시 시간 **200 ms 는 예시값**입니다. 버튼에 따라 50~300 ms 사이에서 조절해 보게 하세요. 너무 길면 빠르게 연타한 누름까지 빠집니다.

  - LED 는 **2번 핀**입니다. 보드에 따라 2번에 붙은 작은 파란 LED 가 같이 깜박입니다(정상).
  - 실행 1은 일부러 **4초에 한 번만** 버튼을 봅니다. 짧게 누르면 거의 놓치고, 꾹 누르고 있어야 늦게 찍히는 것을 반 전체가 확인하게 하세요.
  - 코드로 쓸 때 `handler=on_press()` 처럼 괄호를 붙이면 그 자리에서 함수가 한 번 실행되고, 돌려준 값(`None`)이 핸들러로 등록됩니다. 블록은 함수 이름 칸에 이름만 적으므로 이 실수가 생기지 않지만, 디버깅 단계 안내 글에서 말로 짚어 줍니다(블록으로 접히지 않는 꼴이라 증상 코드로는 넣지 않았습니다).
  - 핸들러에서 바깥 변수를 바꾸려면 **전역 변수 쓰기** 블록(`global`)이 필요합니다. 빠뜨리면 검사가 주의(`global-missing`)를 주고, 보드에서는 `UnboundLocalError` 가 납니다.
  - 시간: 필수 단계 합 45분(1차시). 추가 미션(반응 시간 재기)은 먼저 끝낸 학생용입니다.
  - 융합: 정보(이벤트·인터럽트, 폴링과 비교), 과학(사람의 반응 시간 — 추가 미션에서 ms 단위로 재어 반 평균 비교).
title: 버튼이 끼어들기 — 인터럽트
subtitle: 쉬는 중에도 놓치지 않는 버튼
summary: |
  LED 가 2초 동안 쉬고 있을 때 누른 버튼은 왜 무시될까요? 반복이 `sleep` 하는 동안에는 버튼을 볼 수 없기 때문이에요.
  오늘은 버튼이 눌리는 **순간** 보드가 하던 일을 잠깐 멈추고 함수를 먼저 실행하는 **인터럽트**를 써요. 함수는 **깃발**만 세우고, 오래 걸리는 일은 반복이 맡는 방법도 배워요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 버튼 · LED 자리는 S8 과 같아요 }
  - { name: 버튼(푸시 버튼), note: 다리가 네 개. 가운데 홈에 걸쳐 꽂아요 }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 점퍼선(M-M), note: "5개 (14번 1, 버튼 → − 줄 1, 2번 1, LED → − 줄 1, − 줄 → GND 1)" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "버튼은 가운데 홈에 걸쳐 24 · 26번 줄에 꽂고, 14번 핀 → 24번 줄(버튼 한쪽), 대각선 반대쪽 26번 줄 → − 줄. LED 는 2번 핀 → 7번 줄 → 220Ω 저항 → 12번 줄의 긴 다리(+), 짧은 다리(−) 13번 줄 → − 줄. − 줄 하나를 GND 에 이어요"
principle:
  image: images/polling-vs-irq.svg
  body: |
    지금까지는 반복 안에서 `if` 로 버튼을 **직접 들여다봤어요**(폴링). 그런데 반복이 `time.sleep(2)` 로 쉬는 동안에는 아무것도 볼 수 없어서, 그사이에 짧게 누른 버튼은 놓쳐요.

    **인터럽트**는 거꾸로예요. 버튼 핀 값이 1 에서 0 으로 **떨어지는 순간**(`Pin.IRQ_FALLING`) 보드가 하던 일을 잠깐 멈추고, 미리 정해 둔 함수(핸들러)를 먼저 실행한 뒤 하던 일로 돌아가요. 핸들러는 짧아야 해서, 보통 **깃발 변수**만 세우고 오래 걸리는 일은 반복에게 맡겨요.
goals:
  content: 버튼 인터럽트로 누르는 순간 함수를 실행하고, 깃발 변수로 반복과 일을 나눈다
  thinking: 반복이 쉬는 동안 입력을 놓치는 까닭을 예측하고, "직접 확인하기"와 "알려 주면 하기"를 비교한다
successCriteria:
  - 반복 안의 `if` 확인이 왜 늦거나 놓치는지 시간 그림을 짚으며 설명할 수 있다
  - 버튼 인터럽트 블록과 매개변수가 하나인 함수로 누르는 순간 반응하게 할 수 있다
  - 핸들러는 깃발만 세우고, 반복이 깃발을 보고 일한 뒤 내리게 나눌 수 있다
parts:
  - id: part1
    title: 기다리지 않는 버튼
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 쉬는 사이에 누른 버튼
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — LED 가 깜박이며 쉬는 중에도, 버튼을 누르는 순간 보드가 알아차리게 해요
        body: |
          S8 에서는 반복 안에서 0.1초마다 버튼을 확인했어요. 그런데 반복이 LED 를 2초 켜고 2초 끄며 **쉬고 있다면** 어떻게 될까요?

          게임을 하다가 엄마가 부르면 게임을 잠깐 멈추고 대답하죠. 보드에게도 그런 방법이 있을까요? 코드를 보기 전에 내 생각부터 적어 봐요.
        todo:
          - 준비물(버튼, LED, 저항, 점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
        questions:
          - LED 가 2초 동안 쉬고 있는 사이에 누른 버튼은 왜 무시될까요?
          - 반복이 쉬는 시간을 짧게 줄이면 문제가 풀릴까요? 그러면 무엇을 잃을까요?
          - 하던 일을 하다가 "부르면 바로 대답하는" 일이 생활 속에서 또 무엇이 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 3
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "LED 는 계속 깜박이면서, 버튼을 누르는 순간 바로 반응하기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 한 줄씩 차례로 실행한다는 것을 떠올려요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. "누르는 순간"은 핀 값이 어떻게 바뀌는 때일까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 미리 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 기준이나 순간 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["버튼이 14번, LED 가 2번 핀에 꽂혀 있다", "풀업 버튼은 떼면 1, 누르면 0 이다", "sleep 하는 동안에는 다음 줄로 가지 않는다"]
          decide: ["어느 순간에 반응할지 (1 → 0 으로 떨어지는 순간)", "눌렸을 때 실행할 함수 이름", "깜박이는 시간 (2초)"]
          act: ["LED 를 2초씩 켜고 끄기를 반복하기", "버튼이 눌리는 순간 함수를 먼저 실행하기", "함수가 끝나면 하던 깜박이기로 돌아가기"]

      - id: predict
        type: predict
        title: 예측하기 — 언제 "눌렸다!" 가 찍힐까?
        minutes: 3
        scene:
          image: images/polling-vs-irq.svg
          caption: "if 로 확인 줄을 먼저 봐요. 반복은 켜고 2초, 끄고 2초를 쉰 뒤에야 버튼을 한 번 봐요"
        body: |
          아직 실행하지 않아요. 이 코드는 LED 를 2초 켜고, 2초 끈 **다음에** 버튼을 한 번 확인해요.

          `time.sleep(2)` 줄에 있는 동안 보드는 그 줄에서 기다리기만 해요. 손가락으로 줄을 따라가며 시간을 세어 보고, 빈칸에 내 예측을 적어요.
        todo:
          - 반복 한 바퀴에 몇 초 쉬는지 더해 보기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_polling.py
        blanks:
          - q: LED 가 켜져 있는 동안 버튼을 잠깐(0.5초) 눌렀다 떼면, 출력 창에 "눌렸다!" 가 찍힐까요?
          - q: 반복 한 바퀴는 몇 초 걸릴까요?
            unit: 초
          - q: 버튼을 꾹 누르고 있으면, 가장 늦을 때 몇 초 뒤에야 "눌렸다!" 가 찍힐까요?
            unit: 초

      - id: run
        type: run
        title: 복사 · 실행 — if 로 확인하는 버튼
        minutes: 5
        scene:
          image: images/wiring-breadboard.svg
          caption: "버튼은 가운데 홈에 걸쳐 꽂고, 14번 선과 − 줄 선은 대각선 다리에. LED 는 2번 핀 → 저항 → 긴 다리"
        body: |
          **브레드보드**에 버튼과 LED 를 꽂아요. 버튼 자리는 S8 과 같고, LED 는 **2번** 핀에 이어요.

          실행한 뒤 두 가지를 해 봐요. 먼저 LED 가 켜져 있을 때 버튼을 **짧게** 눌렀다 떼 보고, 다음엔 **꾹 누른 채로** 기다려 봐요. 예측과 같은가요?
        todo:
          - USB 를 뺀 채 그림대로 버튼 · LED · 저항 · 선 꽂기
          - "**보드 연결** → **실행** 누르기"
          - 짧게 누를 때와 꾹 누를 때 출력 창을 예측과 비교하기
        code: step1_polling.py
        expected: 코드를 실행하면 2번 핀의 LED 가 2초 켜지고 2초 꺼지기를 되풀이해요. 버튼을 짧게 눌렀다 떼면 대부분 아무것도 찍히지 않고, 꾹 누르고 있으면 LED 가 꺼진 2초가 끝날 때에야 "눌렸다!" 가 늦게 찍혀요.
        codeNotes:
          - { line: 4, note: "14번 핀을 풀업 입력으로 준비해요. 떼면 1, 누르면 0" }
          - { line: 5, note: "2번 핀은 LED 를 켜고 끄는 출력 핀이에요" }
          - { line: 8, note: "LED 를 켜요" }
          - { line: 9, note: "2초 동안 이 줄에서 기다려요. 그동안 버튼은 아무도 보지 않아요" }
          - { line: 10, note: "LED 를 꺼요" }
          - { line: 11, note: "또 2초 동안 기다려요" }
          - { line: 12, note: "이제야 버튼 값을 한 번 봐요. 지금 0 이면(누르고 있으면) 13번 줄을 해요" }
          - { line: 13, note: "출력 창에 \"눌렸다!\" 를 찍어요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 늦는 버튼
        minutes: 3
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          `time.sleep` 이 **두 번** 나와요. 둘 다 끝나야 버튼을 보는 줄에 닿아요.

          손가락으로 한 줄씩 짚으며 시간을 세어 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - 반복 한 바퀴에서 버튼을 보는 순간이 언제인지 찾기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_polling.py
        questions:
          - { kind: number, q: "버튼 값은 몇 초에 한 번 확인할까요?", answer: 4, hint: "한 바퀴에서 쉬는 줄을 모두 더해 봐요" }
          - { kind: choice, q: "LED 가 켜진 지 1초 때 버튼을 0.5초 눌렀다 뗐어요. 출력 창은?", options: ["바로 \"눌렸다!\" 가 찍힌다", "몇 초 뒤에 \"눌렸다!\" 가 찍힌다", "아무것도 찍히지 않는다"], answer: 2, hint: "버튼을 보는 순간에도 손가락이 버튼 위에 있나요?" }
          - { kind: line, q: "버튼 값을 확인하는 줄의 줄 번호를 클릭하세요", answer: 12 }
        codeNotes:
          - { line: 4, note: "풀업이라 떼면 1, 누르면 0 이에요" }
          - { line: 7, note: "`while True:` 안에 들여 쓴 줄들이 한 바퀴예요" }
          - { line: 9, note: "이 줄에서 2초 동안 기다려요" }
          - { line: 11, note: "이 줄에서도 2초 동안 기다려요" }

      - id: run2
        type: run
        title: 실행 2 — 인터럽트로 바꾸기
        minutes: 5
        scene:
          image: images/polling-vs-irq.svg
          caption: "인터럽트 줄: 누르는 순간 on_press 를 바로 실행해요"
        body: |
          이번엔 반복 안에서 버튼을 보지 않아요. 대신 **버튼이 눌렸을 때 함수 실행하기** 블록으로 버튼과 함수 `on_press` 를 이어 둬요. 버튼 값이 1 에서 0 으로 떨어지는 순간, 보드가 깜박이기를 잠깐 멈추고 `on_press` 를 먼저 실행해요.

          함수 괄호 안의 `pin` 은 보드가 "어느 핀이 불렀는지" 넣어 주는 자리예요. 이번엔 LED 가 켜져 있을 때도, 꺼져 있을 때도 짧게 눌러 봐요.
        todo:
          - 배선은 그대로 두고 코드만 바꿔 실행하기
          - LED 가 켜져 있을 때와 꺼져 있을 때 각각 짧게 눌러 보기
          - 실행 1과 무엇이 달라졌는지 공책에 한 줄 쓰기
        code: step2_irq.py
        expected: 코드를 실행하면 LED 는 실행 1처럼 2초씩 깜박여요. 그런데 언제 누르든 누르는 순간 바로 출력 창에 "눌렸다!" 가 찍혀요. 한 번 눌렀는데 두세 번 찍힐 때도 있어요(디버깅에서 다뤄요).
        codeNotes:
          - { line: 4, note: "버튼 준비는 실행 1과 같아요" }
