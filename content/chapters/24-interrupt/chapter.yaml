      - id: mission
        type: mission
        title: 미션 — 깃발만 세우는 핸들러
        minutes: 6
        scene:
          image: images/flag-handler.svg
          caption: "함수는 깃발 pressed 만 올리고 바로 끝. 반복이 깃발을 보고 LED 를 바꾼 뒤 내려요"
        body: |
          이번엔 버튼을 누를 때마다 LED 가 **켜짐 · 꺼짐으로 바뀌게** 해요. 그런데 LED 를 바꾸는 일까지 함수 안에 넣지 않아요. 끼어드는 함수는 **짧을수록** 좋거든요.

          함수는 깃발 변수 `pressed` 를 `True` 로 올리기만 하고, 반복이 깃발을 보고 LED 를 바꾼 다음 깃발을 내려요. 함수 안에서 바깥 변수 `pressed` 를 바꾸려면 **전역 변수 쓰기** 블록이 먼저 필요해요.
        todo:
          - 함수 안을 "전역 변수 pressed 쓰기 → pressed 를 True 로" 두 블록으로 바꾸기
          - 시작할 때 pressed 를 False 로 정하고, 반복을 깃발 보기로 바꾸기
          - 실행해 누를 때마다 LED 가 바뀌는지 본 뒤 **판정** 누르기
        instructions: "함수 on_press 는 전역 변수 pressed 를 True 로 바꾸기만 하게 해 주세요. 시작할 때 pressed 는 False 예요. 반복에서는 깜박이기 대신, pressed 가 참이면 LED 가 꺼져 있을 때(값 0) 켜고 아니면 끈 뒤 pressed 를 False 로 내려요. 반복 끝에서는 0.05초 쉬어요"
        hint: "함수 몸통: 전역 변수 pressed 쓰기 → pressed 를 True 로 정하기. 반복 몸통: 만약 pressed 이면 → (만약 LED 값이 0 이면 켜기, 아니면 끄기) → pressed 를 False 로. 그 뒤 0.05초 기다리기"
        code: step2_irq.py
        rules:
          - codeMatches: '^pressed = False$'
            fail: 프로그램이 시작할 때 깃발은 올라가 있나요, 내려가 있나요? 반복이 깃발을 처음 볼 때 pressed 는 무엇이어야 할까요?
          - codeMatches: '^def on_press\(\w+\):\n\s+global pressed\n\s+pressed\s*=\s*True(\n\S|(?![\s\S]))'
            fail: 함수 on_press 안에는 어떤 줄이 몇 개 있나요? 깃발을 올리는 일 말고 LED 를 바꾸거나 기다리는 일이 들어 있지 않나요?
          - codeMatches: '^\s+if pressed\s*:'
            fail: 반복은 깃발이 올라갔는지 어떻게 확인하나요?
          - codeMatches: 'if led\.value\(\)\s*==\s*0\s*:\n\s+led\.value\(1\)\n\s+else:\n\s+led\.value\(0\)|if led\.value\(\)\s*==\s*1\s*:\n\s+led\.value\(0\)\n\s+else:\n\s+led\.value\(1\)|led\.value\((1 - |not )led\.value\(\)\)'
            fail: LED 가 꺼져 있을 때와 켜져 있을 때 각각 무엇을 해야 하나요? 지금 LED 가 켜져 있는지는 무엇으로 알 수 있나요?
          - codeMatches: '^\s{8,}pressed\s*=\s*False$'
            fail: LED 를 바꾼 뒤 깃발은 어떻게 되나요? 다음 누름을 기다리려면 반복이 깃발에 무엇을 해야 할까요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*time\.sleep\(2\))'
            fail: 반복 안에 깜박이던 줄(켜기 → 2초 → 끄기 → 2초)이 아직 남아 있지 않나요?
          - codeMatches: '^    time\.sleep\(0\.05\)$'
            fail: 반복 끝에서 쉬는 시간은 지시와 같나요? 그 줄은 반복의 어느 자리에 있나요?
        answerCode: mission_flag.py

      - id: extra
        type: mission
        title: 추가 미션 — 반응 시간 재기
        optional: true
        minutes: 5
        scene:
          image: images/polling-vs-irq.svg
          caption: 인터럽트는 누르는 순간을 놓치지 않으니, 시간을 재기에도 알맞아요
        body: |
          먼저 끝낸 사람을 위한 미션이에요. LED 가 켜지는 순간부터 내가 버튼을 누르기까지 몇 ms 걸리는지 재 봐요. 사람의 반응 시간은 보통 0.2초(200 ms) 안팎이에요. 나는 얼마일까요?

          LED 를 켠 순간의 시각을 `start` 에 기억해 두고, 함수 안에서 **지난 시간** 블록으로 재요. 처음 누른 것만 재야 떨림이나 두 번 누름에 속지 않아요.
        todo:
          - LED 를 켠 순간 시각을 start 에 담기
          - 함수 안에서 start 부터 지난 시간을 reaction 에 담고, 반복에서 찍기
          - 다섯 번 재서 가장 빠른 기록을 짝과 비교하고 **판정** 누르기
        instructions: "반복에서 3초 쉰 뒤 reaction 을 0 으로 하고, LED 를 켜고 그 순간 시각을 start 에 담아요. 2초 뒤 LED 를 끄고 reaction 을 찍어요. 함수 on_press 는 reaction 이 0 일 때만 start 부터 지난 시간(ms)을 reaction 에 담아요"
        hint: 함수 몸통은 전역 변수 reaction 쓰기 → 만약 reaction 이 0 이면 → reaction 을 "start 부터 지난 시간" 으로. 시작할 때 start 와 reaction 은 0 이에요
        code: mission_flag.py
        rules:
          - codeMatches: '^\s+\w+ = time\.ticks_ms\(\)$'
            fail: LED 가 켜진 그 순간의 시각을 기억해 두었나요? 무엇부터 지난 시간을 재야 할까요?
          - codeMatches: 'time\.ticks_diff\(time\.ticks_ms\(\), \w+\)'
            fail: 누른 순간, 기억해 둔 시각부터 얼마나 지났는지 재는 블록을 썼나요?
          - codeMatches: '^\s+global \w+$'
            fail: 함수 안에서 잰 값을 반복이 찍으려면, 그 변수는 함수 안에만 있으면 될까요?
          - codeMatches: '^\s+print\(\w+\)$'
            fail: 잰 반응 시간을 출력 창에서 볼 수 있나요?
        answerCode: extra_reaction.py

      - id: debug
        type: debug
        title: 디버깅 — 끼어들지 못하는 버튼
        minutes: 6
        scene:
          image: images/bounce.svg
          caption: "한 번 눌러도 접점이 튀어서 핀 값은 여러 번 떨어져요. 떨어질 때마다 함수가 불려요"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 빨간 글씨가 뜨면 함수 이름과 괄호부터, 에러 없이 여러 번 불리면 버튼 떨림부터 봐요.

          하나 더 알아 둘 것: 코드로 쓸 때 `handler=on_press()` 처럼 이름 뒤에 괄호를 붙이면, 그 줄에서 함수가 **한 번 바로 실행**되고 돌려준 값(`None`)이 이어져서 누를 때는 아무 일도 없어요. 블록은 함수 이름 칸에 이름만 적으니 걱정 없어요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: "버튼을 누르면 빨간 글씨로 TypeError: function takes 0 positional arguments but 1 were given 이 떠요"
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)


              def on_press():
                  print("눌렸다!")


              button.irq(trigger=Pin.IRQ_FALLING, handler=on_press)
              while True:
                  time.sleep(1)
            question: 보드는 핸들러를 부를 때 무엇을 하나 넣어 줄까요? 이 함수의 괄호 안에는 그것을 받을 자리가 있나요?
            rules:
              - codeMatches: '^def on_press\(\w+\):$'
                fail: 에러 글의 "1 were given" 은 보드가 몇 개를 넣어 줬다는 뜻일까요? 함수 괄호 안 자리 수와 맞나요?
          - title: "실행하자마자 빨간 글씨로 NameError: name 'on_click' isn't defined 가 떠요"
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)


              def on_press(pin):
                  print("눌렸다!")


              button.irq(trigger=Pin.IRQ_FALLING, handler=on_click)
              while True:
                  time.sleep(1)
            question: 버튼에 이어 준 함수 이름과, 실제로 만든 함수 이름을 글자 하나하나 비교해 보세요.
            rules:
              - codeMatches: '^def (\w+)\(\w+\):[\s\S]*handler=\1\)'
                fail: 인터럽트 블록의 함수 이름 칸과 함수 블록의 이름이 같은가요?
          - title: 한 번 눌렀는데 "눌렸다!" 가 두세 번 찍혀요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)


              def on_press(pin):
                  print("눌렸다!")


              button.irq(trigger=Pin.IRQ_FALLING, handler=on_press)
              while True:
                  time.sleep(1)
            question: 장면 그림처럼 한 번 누를 때 핀 값이 몇 번 떨어지나요? 처음 불린 때부터 아주 짧은 시간 안에 다시 불리면 어떻게 하면 될까요?
            rules:
              - codeMatches: 'time\.ticks_diff\(time\.ticks_ms\(\), \w+\)\s*>=?\s*\d+'
                fail: 지난번에 불린 때부터 몇 ms 지났는지 재고 있나요? 그 시간이 짧으면 무시하나요?
              - codeMatches: '^\s+\w+ = time\.ticks_ms\(\)$'
                fail: 진짜로 센 다음에 "지금 시각"을 기억해 두나요? 기억하지 않으면 다음엔 무엇과 비교할까요?
              - codeMatches: '^\s+global \w+$'
                fail: 함수 안에서 바깥 변수(지난번 시각)를 바꾸려면 무엇이 먼저 필요할까요?

      - id: design
        type: design
        title: 설계 — 몇 번 눌렸을까?
        minutes: 5
        scene:
          image: images/flag-handler.svg
          caption: 깃발 대신 숫자를 올려요. 함수는 1 올리기만, 반복은 1초마다 찍기만
