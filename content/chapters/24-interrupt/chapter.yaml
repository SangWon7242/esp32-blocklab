          - { line: 9, note: "함수가 하는 일: 출력 창에 \"눌렸다!\" 를 찍어요 (관찰용)" }
          - { line: 12, note: "버튼 값이 1 에서 0 으로 떨어지는 순간(`Pin.IRQ_FALLING`) `on_press` 를 실행하라고 이어 둬요" }
          - { line: 13, note: "반복은 버튼을 보지 않고 깜박이기만 해요 (14~17번 줄)" }

      - id: readcheck2
