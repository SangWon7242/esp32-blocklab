            blank: { answer: 0 }
          - text: 버튼이 눌렸을 때 on_press 를 실행하게 잇는다
          - text: 계속 반복한다
          - text: "  ↳ count 를 출력 창에 찍는다"
          - text: "  ↳ __초 쉰다"
            blank: { answer: 1 }
        translation:
