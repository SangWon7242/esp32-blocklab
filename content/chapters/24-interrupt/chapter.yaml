        targetCode: design_count.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 직접 들여다보기(폴링)와 알려 주면 하기(인터럽트). 언제 무엇을 쓸까요?
