        minutes: 6
        scene:
          image: images/adc-scale.svg
          caption: 늘 느낌표면 기준값의 자를, 값이 안 바뀌면 핀 번호와 WiFi 를, OSError 면 DHT11 을 재는 간격을 봐요
        body: |
          고장 난 상황판 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 늘 느낌표가 보이면 기준값이 어느 자(0~1023 / 0~4095)에 맞는지, WiFi 를 켠 뒤 아날로그 값이 안 바뀌면 핀 번호를, `OSError` 가 나면 DHT11 을 얼마나 자주 재는지 봐요.

          `from blocklab_net import *` 는 그대로 두고 준비 줄과 `while True:` 아래 몇 줄만 보면 돼요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: "교실이 어두워도 밝아도 빛 값 옆에 늘 느낌표가 찍혀요"
            code: |
              from machine import Pin, ADC
              import time

              light = ADC(Pin(34))
              light.atten(ADC.ATTN_11DB)
              light.width(ADC.WIDTH_12BIT)

              limit = 500
              last = time.ticks_ms()
              while True:
                  if time.ticks_diff(time.ticks_ms(), last) >= 2000:
                      last = time.ticks_ms()
                      if light.read() > limit:
                          print("L: " + str(light.read()) + " !")
                      else:
                          print("L: " + str(light.read()))
                  time.sleep(0.1)
            question: 출력을 보니 평소 빛 값이 1500쯤이고 손전등을 비춰도 900 아래로는 안 내려가요. 기준 500 은 아두이노의 0~1023 자에서 가져온 숫자예요. ESP32 의 0~4095 자에서 같은 자리는 몇쯤일까요? (500 × 4095 ÷ 1023)
            rules:
              - codeMatches: 'limit\s*=\s*[1-3]\d{3}'
                fail: 기준이 ESP32 의 자(0~4095)에 맞나요? 평소 값(천몇백)과 손으로 가렸을 때 값 사이의 네 자리 숫자여야 해요
          - title: "WiFi 를 켠 뒤로 폰 페이지의 빛 값이 항상 같은 숫자예요. 손으로 가려도 안 바뀌어요"
            code: |
              from machine import Pin, ADC
              from blocklab_net import *

              light = ADC(Pin(25))
              light.atten(ADC.ATTN_11DB)
              light.width(ADC.WIDTH_12BIT)

              ip = wifi_connect("MyWiFi", "12345678")
              server = web_start(80)

              while True:
                  conn, path, query = web_accept(server)
                  web_send(conn, web_page("Sensor Board", "", "L: " + str(light.read()), 2))
            question: 검사 칸의 주의 글을 읽어 봐요. WiFi 를 켜면 ESP32 는 어느 핀들의 아날로그 값을 못 읽나요? 조도 센서를 어느 핀(32~39)으로 옮기고 코드의 숫자를 바꿔야 할까요?
            rules:
              - codeMatches: 'light\s*=\s*ADC\(Pin\(3[2-9]\)\)'
                fail: 조도 센서 핀이 WiFi 와 함께 쓸 수 있는 32~39번인가요? 25번은 WiFi 를 켜면 아날로그 값을 못 읽어요
          - title: "몇 초 못 가서 OSError: [Errno 116] ETIMEDOUT 이 나며 멈춰요"
            code: |
              from machine import Pin
              import time
              import dht

              dht11 = dht.DHT11(Pin(13))

              while True:
                  dht11.measure()
                  t = dht11.temperature()
                  h = dht11.humidity()
                  print("T: " + str(t) + " H: " + str(h))
                  time.sleep(0.1)
            question: 이 코드는 DHT11 에게 얼마나 자주 재 달라고 하나요? DHT11 은 1초에 한 번보다 자주 부르면 답을 못 해요. 기다리는 시간을 늘리거나, 1부처럼 지난 시간이 2000 이상일 때만 재게 하려면 어디를 고칠까요?
            rules:
              - codeMatches: '(time\.sleep\((?:[2-9]|[1-9]\d+)(?:\.\d+)?\)|time\.ticks_diff\(time\.ticks_ms\(\),\s*last\)\s*>=\s*[2-9]\d{3}\s*:\n\s+last\s*=\s*time\.ticks_ms\(\)\n\s+dht11\.measure\(\))'
                fail: DHT11 을 2초에 한 번만 재나요? 기다리기를 2초 이상으로 늘리거나, last 부터 지난 시간이 2000 이상일 때만 measure 를 부르게 해요

