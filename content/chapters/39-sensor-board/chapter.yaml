      - id: problem
        type: problem
        title: 문제 만나기 — 교실 밖에서도 교실을 볼 수 있을까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 센서 여섯 개의 값이 ESP32 로 모여 OLED 두 페이지와 폰의 표에 보여요
        body: |
          교실이 너무 덥거나, 너무 어둡거나, 너무 시끄러우면 공부가 잘 안 돼요. 그런데 교실의 온도 · 밝기 · 소음을 **숫자로** 재 본 적이 있나요? 더 좋은 배움터를 만들려면 먼저 재야 해요. 오늘 만들 상황판은 센서 여섯 개로 교실을 재서 OLED 와 폰에 보여 줘요.

          값이 여섯이라 작은 OLED 한 화면에 다 안 들어가요. 두 페이지로 나눠 3초마다 번갈아 보여 주려고 해요. 그런데 `time.sleep(3)` 으로 3초 기다리는 동안 폰이 "값 보여 줘" 하고 물으면 어떻게 될까요? 코드를 보기 전에 질문마다 내 생각을 적어 봐요.
        todo:
          - 준비물(ESP32 보드, OLED, 포토레지스터 · 가변저항 · 틸트 스위치 · 10kΩ 저항 2개, 소리 · DHT11 · PIR 모듈, 브레드보드, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장씩 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 교실의 온도 · 밝기 · 소음 가운데 공부에 가장 크게 영향을 주는 것은 무엇이라고 생각하나요? 그것을 어떤 센서로 잴 수 있을까요?
          - 보드가 3초 동안 멈춰서(sleep) 기다리는 사이에 폰이 값을 물어보면 폰 화면은 어떻게 될까요?
          - 교실 밖에 있는 선생님 폰에 교실 값이 보이려면 보드와 폰 사이에 무엇이 필요할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 움직여야 할 것 순서로 센서마다 나눠요
        body: |
          상황판에는 입력이 여섯(빛 · 소리 · 손잡이 · 온습도 · 기울어짐 · 사람), 출력이 둘(OLED · 폰 화면)이에요. 센서가 **알아내고**, 사람이 **읽는 주기와 기준을 정해 주면**, 화면이 **움직여요**. 센서마다 어느 칸에 들어갈지 생각하며 나눠 봐요.

          - **알아야 할 것**: 센서 여섯이 각각 알려 주는 값과 그 범위
          - **정해야 할 것**: 몇 초마다 읽을지, 기준값, 페이지를 바꾸는 시간
          - **움직여야 할 것**: OLED 두 페이지, 폰의 표가 보여 줄 것

          과학 시간에 배운 감각 기관을 떠올려 센서 여섯을 눈 · 귀 · 피부 · 몸의 균형 가운데 어디에 짝지을지 짝과 이야기해 봐요.
        todo:
          - "**알아야 할 것**: 센서 여섯이 알아내는 값을 하나씩 적기"
          - "**정해야 할 것**: 읽는 주기 · 기준값 · 페이지 바꾸는 시간 적기"
          - "**움직여야 할 것**: OLED 두 페이지와 폰 표가 보여 줄 것 적기"
        answer:
          know: ["조도 값(0~4095, 34번)과 소리 값(0~4095, 35번) — 아날로그", "가변저항 값(0~4095, 39번) — 돌린 정도", "DHT11 온도(℃) · 습도(%) — 13번, 재기 전에 measure 부탁, 2초에 한 번", "틸트 값(기울면 1, 14번)과 PIR 값(움직임이 보이면 1, 23번) — 디지털", "WiFi 를 쓰면 아날로그는 32~39번 핀"]
          decide: ["읽는 주기: 2초마다(지난 시간 ≥ 2000ms)", "기준값: 아두이노 0~1023 의 500 → ESP32 0~4095 의 약 2000(비례식)", "페이지 바꾸는 시간: 3초(지난 시간 ≥ 3000ms), 멈추기(sleep) 로 기다리지 않기", "페이지 1 은 빛 · 소리 · 손잡이, 페이지 2 는 온도 · 습도 · 틸트 · PIR"]
          act: ["OLED 페이지 1 · 2 를 3초마다 번갈아 그리기", "기준을 넘은 값 옆에 느낌표(!) 보이기", "폰 페이지에 L · S · T · H 값 표 보내기(2초마다 새로고침)", "앱이 읽을 /data(온도 · 습도) · /light(빛) JSON 주소 열기"]

      - id: predict
        type: predict
        title: 예측하기 — 멈추기와 지난 시간 재기
        minutes: 4
        scene:
          image: images/delay-vs-ticks.svg
          caption: sleep(3) 은 3초 동안 아무것도 못 해요. 지난 시간을 재면 0.1초마다 한 바퀴 돌며 3000 이 된 순간에만 페이지를 바꿔요
        body: |
          활동 칸의 코드는 센서 여섯을 준비하고, `show_page` 함수로 OLED 에 페이지 1 또는 2 를 그려요. 반복 안에는 `time.sleep(3)` 이 없어요. 대신 `time.ticks_ms()` 로 잰 시각을 `last` · `start` 에 담아 두고, **지난 시간**이 2000 을 넘으면 값을 새로 재고, 3000 을 넘으면 페이지를 바꿔요. 아직 실행하지 않아요.

          코드를 한 줄씩 읽고, 어떤 순서로 무엇이 보일지 먼저 적어 봐요. **내 예측을 먼저 적는 것**이 중요해요.
        todo:
          - "`show_page` 함수에서 페이지 1 과 페이지 2 에 그리는 값 읽기"
          - "`while True:` 아래에서 2000 과 3000 이 쓰인 줄 찾기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_board_oled.py
        blanks:
          - q: 실행하면 OLED 에 처음 보이는 페이지는 1 일까요, 2 일까요? 몇 초 뒤에 바뀔까요? 코드의 어느 줄을 보고 알았나요?
          - q: 반복 맨 끝의 `time.sleep(0.1)` 을 `time.sleep(3)` 으로 바꾸면 출력과 페이지 바꾸기는 어떻게 달라질까요?
          - q: 온습도는 2초마다 새로 재는데 빛 · 소리 값은 그릴 때마다 읽어요. 왜 DHT11 만 2초 간격을 둘까요?

      - id: run
        type: run
        title: 복사 · 실행 — 여섯 값을 OLED 두 페이지로
        minutes: 10
        scene:
          image: images/wiring-breadboard.svg
          caption: "OLED → 위 한 줄 SCL · SDA · 5V · GND, DHT11 → io13 기둥. 브레드보드: 포토레지스터 19번 줄 ← io34, 가변저항 24번 줄 ← io39, 틸트 스위치 28번 줄 ← io14. 소리 S → io35 줄 S, PIR S → io23. + 줄 3V3, − 줄 GND"
          captionDevkit: "DHT11 S → D13, 소리 S → D35, PIR S → D23. 브레드보드: 틸트 스위치 11번 줄 ← D14, 포토레지스터 21번 줄 ← D34, 가변저항 26번 줄 ← VN(39). OLED → GND · D21 · D22, VCC → + 줄. + 줄 3V3, − 줄 GND"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 브레드보드 + 줄(3V3) · − 줄(GND)을 먼저 보드와 이어요. 그다음 브레드보드에 맨 부품 셋(포토레지스터 · 가변저항 · 틸트 스위치, 10kΩ 저항과 함께)을 꽂고, OLED 와 모듈 셋(소리 · DHT11 · PIR)을 이어요. 그림 아래 연결 표를 한 줄씩 짚으며 꽂으면 빠뜨리지 않아요. 아날로그 셋(조도 34 · 소리 35 · 가변저항 39)은 2부에서 WiFi 와 함께 쓸 수 있는 **32~39번** 핀이에요.

          실행되면 출력 칸에 두 줄(빛 · 소리 · 손잡이 / 온도 · 습도 · 틸트 · PIR)이 2초마다 찍히고, OLED 는 3초마다 페이지 1 과 2 를 번갈아 보여 줘요. **평소 빛 값과 손으로 가렸을 때 값, 조용할 때와 박수 쳤을 때 소리 값**을 공책에 적어 두세요. 미션과 디버깅에서 기준값을 정할 때 써요.
        todo:
          - "**부품과 배선**대로 + 줄 · − 줄, 맨 부품 셋, OLED, 모듈 셋 꽂기"
          - "**보드 연결** → **실행** 누르기"
          - 평소 · 가렸을 때 빛 값, 조용할 때 · 박수 소리 값, 손잡이를 끝까지 돌렸을 때 값을 공책에 적기
        code: step1_board_oled.py
        expected: "코드를 실행하면 출력 칸에 `L: 1234 S: 300 K: 2048` 과 `T: 25 H: 40 TILT: 0 PIR: 0` 두 줄이 2초마다 찍혀요. OLED 에는 페이지 1(L · S · K)이 보이다가 3초 뒤 페이지 2(T · H · TILT · PIR)로 바뀌고, 다시 3초 뒤 페이지 1 로 돌아와요. 손으로 조도 센서를 가리면 L 값이, 박수를 치면 S 값이, 손잡이를 돌리면 K 값이 바뀌어요."
        codeNotes:
          - { line: 1, note: "핀 · I2C · 아날로그(ADC) 기능을 가져와요. OLED 는 `ssd1306`, 온습도는 `dht`" }
          - { line: 6, note: "34번 핀에 조도 센서(포토레지스터와 10kΩ 사이 줄)를 준비해요 (6~8번 줄). 2부에서 WiFi 와 함께 쓸 수 있는 32~39번 가운데 골랐어요" }
          - { line: 9, note: "35번 소리 센서, 12번 줄은 39번 가변저항. 셋 다 0~4095 로 읽어요" }
          - { line: 15, note: "13번 DHT11, 14번 틸트, 23번 PIR, 21 · 22번 OLED 를 준비해요 (15~19번 줄)" }
          - { line: 22, note: "페이지 번호 `n` 과 온도 `t` · 습도 `h` 를 받아 OLED 에 그리는 함수예요. 반복 안에서 불러요" }
          - { line: 25, note: "페이지 1: 빛 · 소리 · 손잡이 값을 글로 이어 세 줄에 써요 (25~27번 줄)" }
          - { line: 29, note: "페이지 2: 온도 · 습도 · 틸트 · PIR 네 줄 (29~32번 줄)" }
          - { line: 36, note: "처음 한 번 재 두어요. 그래야 첫 페이지 2 에 온도가 보여요" }
          - { line: 39, note: "지금 시각(ms)을 `last` 와 `start` 에 담아요 — 지난 시간을 재는 출발점" }
          - { line: 43, note: "`last` 부터 지난 시간이 2000ms 를 넘으면 온습도를 새로 재고 여섯 값을 찍어요. 그리고 `last` 를 다시 지금으로" }
          - { line: 50, note: "`start` 부터 3000ms 가 지났으면 페이지를 바꿔요 (50~56번 줄). 멈추지 않고 지난 시간만 봐요" }
          - { line: 57, note: "0.1초만 쉬어요. 3초 멈추면 폰의 요청에 답하지 못해요" }

