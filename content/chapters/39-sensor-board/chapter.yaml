      - id: mission
        type: mission
        title: 통합 미션 — 기준을 넘으면 느낌표
        minutes: 10
        scene:
          image: images/adc-scale.svg
          caption: 아두이노 0~1023 의 500 은 ESP32 0~4095 에서 약 2000 이에요. 기준을 넘으면 값 옆에 느낌표를 보여요
        body: |
          원본 수업의 앱은 값이 기준 500 을 넘으면 칸을 빨갛게 칠했어요. 우리 OLED 는 색이 없으니 값 옆에 **느낌표**를 그려요. 그런데 ESP32 의 자는 0~4095 라 500 을 그대로 쓰면 늘 느낌표가 보여요. 비례식으로 기준을 옮겨 `limit` 변수에 담고, 빛과 소리 값이 `limit` 를 넘으면 그 줄 끝(x 112)에 `!` 를 써요.

          미션은 기능 체크리스트로 판정해요. 기준을 더하면서 페이지를 지난 시간으로 바꾸는 꼴이 그대로 잘 있는지도 함께 봐요. 판정에서 걸린 항목은 되묻는 질문을 읽고 그 부분만 고쳐요.
        todo:
          - "`limit` 변수를 만들고 비례식으로 옮긴 기준(1000~3999 사이, 예 2000)을 담기"
          - "`show_page` 의 페이지 1 에서 빛 값 · 소리 값이 `limit` 를 넘으면 `oled.text(\"!\", 112, 줄)` 더하기"
          - 실행해서 박수를 칠 때 S 줄에 느낌표가 보이는지 확인하고 **판정** 누르기
        instructions: "실행 1 코드에 기준값을 더해 상황판을 완성하세요. 체크리스트: (1) 기준값 변수 limit 를 만들고 ESP32 자(0~4095)에 맞게 옮긴 값(1000~3999)을 담기 (2) 페이지는 멈추기(sleep) 가 아니라 start 부터 지난 시간이 3000 이상일 때 바꾸고 그 순간 start 를 다시 재기 (3) 페이지 1 에서 빛 값이 limit 보다 크면 느낌표, 소리 값이 limit 보다 크면 느낌표를 그 줄에 쓰기 (4) 2초마다 여섯 값을 찍는 print 줄은 그대로 두기"
        hint: "변수 블록으로 limit 를 정해요(준비 줄 아래, 반복 위). show_page 함수 안 페이지 1 의 L 줄 아래에 '만약 light.read() > limit 이면 oled.text(\"!\", 112, 0)' 을, S 줄 아래에 '만약 sound.read() > limit 이면 oled.text(\"!\", 112, 16)' 을 넣어요. 비교 블록의 오른쪽 칸에는 숫자 대신 변수 limit 를 끼워요"
        code: step1_board_oled.py
        rules:
          - codeMatches: 'limit\s*=\s*[1-3]\d{3}'
            fail: (1) 기준값 변수 limit 가 있나요? ESP32 의 자는 0~4095 예요. 아두이노의 500 은 이 자에서 어디쯤일까요? (비례식)
          - codeMatches: 'if\s+time\.ticks_diff\(time\.ticks_ms\(\),\s*start\)\s*>=\s*\d+\s*:\n\s+start\s*=\s*time\.ticks_ms\(\)'
            fail: (2) 페이지는 멈추기(sleep) 가 아니라 start 부터 지난 시간을 비교해 바꾸나요? 바꾼 순간에 start 를 다시 지금 시각으로 두나요?
          - codeMatches: 'if\s+light\.read\(\)\s*>\s*limit\s*:\n\s+oled\.text\("!",\s*\d+,\s*\d+\)'
            fail: (3) 빛 값이 기준을 넘으면 페이지 1 에 느낌표가 보이나요? 비교의 오른쪽에 숫자 대신 변수 limit 를 썼나요?
