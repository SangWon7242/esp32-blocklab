          caption: 화면 설계 → 약속표 → 프롬프트 → AI 결과 붙여넣기 · 검사 → 보드에 저장 → 읽기 체크
        body: |
          이제 내 폰 앱을 만들어요. 먼저 화면에 **보여 줄 값**, **누를 버튼**, **바뀌는 모습**을 설계 칸에 적어요. 약속표에는 실행 3 코드가 내는 주소 넷이 있어요: 읽기 `/data`(temp, hum) · `/light`(light), 명령 `/cmd?page=1` · `/cmd?page=2`.

          프롬프트를 복사해 AI 에 넣고, 돌아온 HTML 을 그대로 붙여 **검사**를 눌러요. 외부 스크립트 · 절대 주소가 섞이면 검사가 알려 주니 AI 에게 "외부 라이브러리 없이, 상대 주소로" 라고 다시 부탁해요. 통과하면 보드에 `index.html` 로 저장하고 폰에서 `/` 를 열어요.

          원본 수업의 앱처럼 기준을 넘은 칸을 빨갛게 하고 싶다면 바뀌는 모습 칸에 "빛 2000 넘으면 칸을 빨강" 처럼 적어요. 기준은 1부에서 정한 내 교실 값으로 바꿔도 돼요.
        todo:
          - 설계 칸 세 개에 한 줄씩 적고 프롬프트 복사하기
          - AI 가 준 HTML 을 붙여 넣고 **검사** 통과시키기 (걸리면 AI 에게 고쳐 달라고 하기)
          - 보드에 저장한 뒤 폰에서 열어 보고, 읽기 체크에 답하기
        api:
          - { path: "/data", method: "읽기", fields: ["temp", "hum"], note: "2초마다 읽기. temp 는 온도(℃), hum 은 습도(%) 숫자" }
          - { path: "/light", method: "읽기", fields: ["light"], note: "2초마다 읽기. light 는 빛 값 0~4095 숫자" }
          - { path: "/cmd?page=1", method: "명령", note: "OLED 페이지 1(빛 · 소리 · 손잡이) 보이기" }
          - { path: "/cmd?page=2", method: "명령", note: "OLED 페이지 2(온도 · 습도 · 틸트 · PIR) 보이기" }
        design:
          show: ["온도", "습도", "빛"]
          buttons: ["페이지 1", "페이지 2"]
          changes: ["빛 2000 넘으면 칸을 빨강"]
        promptTemplate: |
          ESP32 주소 {{ip}} 에서 {{data}} 를 2초마다 읽어 {{show}} 을(를) 폰 화면에 표로 크게 보여 주고,
          버튼 {{buttons}} 을(를) 누르면 {{commands}} 를 요청하는 한 파일짜리 HTML 을 만들어 줘.
          {{changes}} 처럼 값이 기준을 넘으면 그 칸의 배경색을 바꿔 줘.
          외부 라이브러리 · 외부 스크립트 · 절대 주소 없이, 폰 화면에 맞게.
        checks:
          maxBytes: 12000
          mustUse: ["page=1", "page=2"]
        readcheck:
          - { kind: choice, q: "/data 에서 값을 가져오는 줄에 쓰인 것은?", options: ["fetch", "print", "import"], answer: 0, hint: "주소에 요청을 보내 답을 받는 자바스크립트 함수" }
          - { kind: choice, q: "/light 가 주는 JSON 에서 빛 값의 이름(키)은?", options: ["light", "temp", "page"], answer: 0, hint: "약속표의 /light 줄 fields" }
          - { kind: text, q: "빛 값이 기준을 넘으면 칸 색을 바꾸는 줄을 찾아 적어 보세요. AI 결과에 틀린 곳이 있었다면 어떻게 찾았나요?" }

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 4
        scene:
          image: images/senses-sensors.svg
          caption: 눈 · 귀 · 피부가 자극을 신경으로 보내듯, 센서는 자극을 전기 신호와 숫자로 보드에 보내요
        body: |
          오늘은 센서 여섯을 묶어 OLED 두 페이지와 폰 상황판으로 교실을 재는 상황판을 만들었어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          활동 칸의 짧은 코드(빛 값과 기준 비교) 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요.

          과학 시간처럼 센서 여섯을 사람의 감각 기관(눈 · 귀 · 피부 · 몸의 균형)과 표로 짝지어 보세요. 수학 시간에는 평소 · 가렸을 때 · 가장 밝을 때 빛 값 셋을 적고 0~4095 자에서 각각 몇 퍼센트인지 비례식으로 구해 보세요.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 상황판 한 바퀴를 설명하기
        lineExplain: reflect_ticks.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 3초 멈추기(sleep) 대신 지난 시간을 재서 페이지를 바꾼 까닭을 폰의 요청이라는 말을 넣어 설명해 보세요. 기준 500 이 우리 보드에서 약 2000 이 된 까닭도 한 줄로.
          - AI 가 만든 앱 코드에서 틀렸거나 검사에 걸린 곳이 있었나요? 어떻게 찾았고 어떻게 고쳤나요?
          - "다음엔 여기부터 본다: 한 줄로"
