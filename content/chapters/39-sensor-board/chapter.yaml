wiring:
  image: images/wiring-breadboard.svg
  caption: "OLED GND · VCC · SCL · SDA → 위 한 줄 GND · 5V · SCL · SDA, DHT11 G · V · S → io13 기둥 G · V · S 에 F-F 듀폰선으로 바로. 브레드보드는 보드 아래: 아래 줄 3V3 → + 줄, GND → − 줄. 포토레지스터: + 줄 → 16번 줄 → 10kΩ → 19번 줄(← io34) → 포토레지스터 → 21번 줄 → − 줄. 가변저항 23 · 24 · 25번 줄(가운데 24 ← io39, 23 → − 줄, 25 → + 줄). 틸트 스위치: + 줄 → 31번 줄 → 10kΩ → 28번 줄(← io14, 보드 바깥 길) → 틸트 스위치 → 26번 줄 → − 줄. 소리 센서 V · G → + − 줄, S → ANALOG io35 줄 S. PIR V · G → + − 줄, S → 보드 바깥 길로 위 한 줄 io23 (WiFi 를 쓰니 아날로그는 32~39번)"
  captionDevkit: "브레드보드는 보드 위: 3V3 → 보드 바깥 길로 + 줄, 위 줄 GND → − 줄. DHT11 S → D13, 소리 센서 S → D35 에 바로, V · G 는 + − 줄. PIR V · G → + − 줄 끝, S → 보드 바깥 길로 D23. 틸트 스위치: + 줄 → 8번 줄 → 10kΩ → 11번 줄(← D14) → 틸트 스위치 → 13번 줄 → − 줄. 포토레지스터: + 줄 → 18번 줄 → 10kΩ → 21번 줄(← D34) → 포토레지스터 → 23번 줄 → − 줄. 가변저항 25 · 26 · 27번 줄(가운데 26 ← VN(39), 25 → − 줄, 27 → + 줄). OLED 는 보드 아래: GND · SDA · SCL → 아래 줄 GND · D21 · D22, VCC → 보드 바깥 길로 + 줄"
principle:
  image: images/senses-sensors.svg
  body: |
    사람은 **눈 · 귀 · 피부** 같은 감각 기관으로 빛 · 소리 · 온도 같은 **자극**을 받아 신경으로 뇌에 보내요. 보드의 센서도 같은 일을 해요. 조도 센서는 빛의 세기를, 소리 센서는 소리의 크기를, DHT11 은 온도와 습기를 **전기 신호**로 바꾸고, ESP32 는 그 신호를 **0~4095** 숫자로 읽어요(아날로그). 틸트 · PIR 은 0 과 1 만 알려 줘요(디지털).

    아두이노의 자는 0~1023, ESP32 의 자는 0~4095 라 같은 밝기라도 숫자가 네 배쯤 커요. 그래서 원본 수업의 기준 500 은 비례식으로 **약 2000** 으로 옮겨요. 기준을 넘었는지는 부등호(`>`)로 물어요.

    여섯 값을 한 화면에 다 쓰기엔 OLED 가 작아요. 그래서 두 페이지로 나누고, 3초 **멈추는** 대신 **지난 시간을 재서** 페이지를 바꿔요. 멈추지 않아야 폰의 요청에도 바로 답할 수 있어요.
goals:
  content: 조도 · 소리 · 가변저항 · DHT11 · 틸트 · PIR 여섯 입력을 지난 시간 비교로 2초마다 읽어 OLED 두 페이지에 번갈아 보여 주고, WiFi 웹서버로 폰에 값 표와 JSON 을 보내며 폰 명령으로 OLED 페이지를 바꾼다
  thinking: 상황판을 알아야 할 것 · 정해야 할 것 · 움직여야 할 것으로 나누고, 멈추기(sleep) 대신 지난 시간을 재는 까닭과 0~1023 기준을 0~4095 로 옮기는 비례식을 코드와 숫자로 설명한다
successCriteria:
  - 여섯 센서가 사람의 어느 감각 기관과 짝인지, 아날로그(0~4095)와 디지털(0 · 1)의 차이가 무엇인지 말할 수 있다
  - 3초 멈추기 대신 지난 시간 비교로 페이지를 바꾸면 무엇이 좋아지는지(폰 요청에 바로 답) 설명할 수 있다
  - 기준 500 이 ESP32 에서 약 2000 이 되는 까닭을 비례식으로 쓰고, 기준을 넘으면 느낌표가 보이게 코드를 고칠 수 있다
  - 폰 브라우저로 상황판 표를 열어 값을 읽고, /data 의 JSON 과 페이지의 차이를 말할 수 있다
  - AI 가 만든 앱 코드에서 /data · /light · /cmd?page=1 을 쓰는 줄을 찾고 틀린 곳을 검사로 잡을 수 있다
