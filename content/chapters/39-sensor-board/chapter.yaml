# 교과 융합 트랙 F12 · 우리 반 센서 상황판 — 원본: 아두이노 심화 W02(센서 값 확인 앱: 센서 7개를 LCD 두 화면과 앱으로, delay 대신 millis, 임계값 빨간 칸, 감지 알림 숙제), 센서 트랙 S10(13-clap-dial) · S11(14-light-sensor) · S12(15-temp-humidity) · S13(16-tilt-pir) · S22(25-web-led) · S23(26-web-sensors). 형식 설명은 src/track/README.md
id: 39-sensor-board
order: 39
track: fusion
label: F12
prerequisites: [13-clap-dial, 14-light-sensor, 15-temp-humidity, 16-tilt-pir, 25-web-led, 26-web-sensors]
subjects: [과학, 수학, 정보]
sdg: [4, 11]
sessions: 2
teacherNotes: |
  **핀 번호** 조도(포토레지스터와 10kΩ 사이 줄) **34번**, 소리 S **35번**, 가변저항 가운데 다리 **39번** — 2부에서 WiFi 를 켜면 ADC2 쪽 핀(0 · 2 · 4 · 12~15 · 25~27)은 아날로그 값을 못 읽으므로 1부부터 32~39 가운데 골랐다(디버깅 증상 2). DHT11 S 13번(S12 와 같음), 틸트 스위치 14번(S13 과 같음), PIR S 23번(S13 과 같음), OLED SCL 22 · SDA 21(S18 과 같음). 일곱 장치의 핀이 겹치지 않는다.

  **부품과 두 보드** 소리 센서 · DHT11 · PIR 은 모듈(핀 G · V · S), 포토레지스터 · 틸트 스위치 · 가변저항은 브레드보드에 꽂는 맨 부품이다(포토레지스터 · 틸트 스위치는 10kΩ 저항과 함께). ESP32 Plus 확장 보드는 브레드보드를 보드 아래에 두고 OLED · DHT11 은 보드 핀에 바로, 소리 센서 S 는 ANALOG 묶음 io35 줄 S 에, PIR S 는 위 한 줄 io23 에 꽂는다(두 모듈의 V · G 는 브레드보드 + − 줄, 3V3). 기본 보드(DevKit)는 브레드보드를 보드 위에 두고 모듈 S 선만 보드에 바로, OLED 는 보드 아래 아래 줄 핀에 꽂는다. 선이 많으니 그림 아래 연결 표를 한 줄씩 짚으며 꽂게 한다.

  **기준값은 예시** 기준 2000 은 예시다. 원본(아두이노)은 0~1023 자에서 500 을 썼고, ESP32 는 0~4095 자라 같은 자리는 500 × 4095 ÷ 1023 ≈ 2000 이다(수학 비례식, 원리 그림 adc-scale). 1차시 실행에서 평소 빛 값 · 손으로 가렸을 때 값, 조용할 때 소리 값 · 박수 쳤을 때 값을 공책에 적고 그 **둘 사이**로 기준을 다시 정하게 한다. 미션 · 디버깅 판정은 기준이 1000~3999 면 통과하므로 교실에서 정한 값으로 바꿔도 된다. 포토레지스터는 3V3 — 10kΩ — 34번 — 포토레지스터 — GND 순서로 꽂아 **어두울수록 값이 커지게** 했다(미션의 느낌표는 "기준보다 크면" = 어두울 때, S11 과 같은 방향). 포토레지스터와 10kΩ 의 자리를 바꿔 꽂으면 밝을수록 커지니 실행 1 에서 손으로 가렸을 때 값이 커지는지 확인한다.

  **DHT11** `measure()` 는 1초에 한 번보다 자주 부르면 `OSError: [Errno 116] ETIMEDOUT` 이 난다(디버깅 증상 3). 1부 코드는 지난 시간이 2000ms 넘을 때만 재고, 2부는 요청이 올 때 같은 조건으로 잰다. 값은 정수 · 오차 ±2℃.

  **PIR** 켠 뒤 30~60초는 값이 제멋대로 나온다. 시야가 넓어 다른 모둠의 움직임도 잡으니 센서를 벽 쪽으로 돌리거나 종이컵 고깔로 시야를 좁힌다. 틸트 스위치는 3V3 — 10kΩ — 14번 — 틸트 스위치 — GND (풀업)로 꽂아 기울면 1 이다(S13 과 같음). 바로 세웠을 때 1 이 나오면 10kΩ 과 틸트 스위치 자리가 바뀐 것이다.

  **sleep 과 지난 시간** 1부의 핵심은 `time.sleep(3)` 대신 `time.ticks_ms()` 와 지난 시간 비교로 페이지를 바꾸는 것이다. 예측 단계 그림(delay-vs-ticks)으로 "3초 멈추는 동안 폰의 요청은 기다린다" 를 먼저 이야기한다. 2부 코드는 `web_accept` 에서 폰 요청을 기다리므로 **폰이 페이지를 읽을 때(2초마다)만 한 바퀴** 돈다 — OLED 도 그때 바뀐다. 폰 페이지를 닫으면 상황판이 멈춘다는 점을 학생과 이야기해 볼 거리다. 새로고침을 2초보다 짧게 하면 보드가 답을 다 못 보내 느려진다(원본 수업의 주의와 같음).

  **WiFi** 2부 코드의 `"MyWiFi"` · `"12345678"` 을 교실 공유기 이름 · 비밀번호로 바꾼다. 학교 WiFi 가 폰 ↔ 보드 통신을 막으면 WiFi 준비 블록을 **공유기 모드**(`ip = wifi_ap("ESP32-LAB", "12345678")`)로 바꾸고 폰을 그 WiFi 에 붙인다. 보드가 출력하는 `IP: 192.168.x.x` 를 폰 브라우저 주소창에 친다. 폰 브라우저에 `주소/data` 를 치면 JSON 글이 그대로 보여 "앱이 읽는 글" 을 눈으로 확인할 수 있다.

  **앱 만들기(AI)** 학생 AI 계정 · 연령 정책에 따라 교사가 프롬프트를 복사해 AI 에 넣고 결과를 보여 주는 시연으로 바꿀 수 있다. AI 결과에 외부 CDN · 스크립트 · 보드 IP 를 박은 절대 주소가 섞이면 붙여넣기 검사가 걸러 준다. 보드 저장은 보드가 없어도 건너뛸 수 있다(미리 보기로 모양만 확인). 보드에 `index.html` 을 저장한 뒤에는 실행 3 코드(`step3_app_server.py`)가 돌아야 `/` 에서 앱이 열린다.

  **교과 · 단원 연결**

  - 과학: 감각 기관과 자극의 전달(눈 · 귀 · 피부 ↔ 조도 · 소리 · 온습도 센서), 빛의 세기와 소리의 크기, 자극을 전기 신호로 바꾸기
  - 수학: 비례식(0~1023 → 0~4095, 500 → 약 2000), 부등호로 기준 정하기, 하루 측정값을 표와 꺾은선그래프로
  - 정보: 데이터 형식(사람이 보는 페이지 HTML 과 앱이 읽는 JSON), 데이터 수집과 주기(2초)
  - SDG 4(양질의 교육) · SDG 11(지속가능한 도시와 공동체): 교실 환경(밝기 · 소음 · 온습도)을 재서 더 좋은 배움터 만들기

  **활동** 하루 동안(아침 · 점심 · 하교) 교실 온도 · 빛 값을 폰 상황판에서 읽어 표에 적고 꺾은선그래프를 그린다(과학 탐구 보고서). 소리 값은 쉬는 시간과 수업 시간을 비교해 "우리 반 소음 기준" 을 수학 시간에 정한다.

  **메이킹** 박스지로 작은 교실 모형을 만들어 조도 센서는 "창가", 소리 센서는 "교탁 앞", PIR 은 "출입문" 에 붙인다. OLED 는 "교실 안 게시판", 폰은 "복도의 선생님" 역할이다. 종이컵 고깔로 PIR 시야를 좁힌다.

  **차시 나누기**

  - 1차시: 문제 · 조건 분석 · 예측(멈추기와 지난 시간) · 실행 1(OLED 두 페이지) · 읽기 체크 1 · 통합 미션(기준 넘으면 느낌표)
  - 2차시: 실행 2(폰 상황판 + JSON) · 읽기 체크 2 · 디버깅 · 설계(감지 배너) · 실행 3(앱용 서버) · 앱 만들기 · 성찰
  - 시간이 모자라면 디버깅 증상 3 과 설계를 앱 만들기 뒤로 미루거나 숙제로 돌린다
title: 우리 반 센서 상황판
subtitle: 센서 여섯 개를 OLED 두 페이지와 폰 상황판으로 한눈에 보기
summary: |
  교실 밖에서도 교실의 온도 · 밝기 · 소음을 한눈에 볼 수 있을까요? 오늘은 **조도 · 소리 · 가변저항 · DHT11 · 틸트 · PIR** 여섯 입력을 2초마다 읽어 **OLED 두 페이지**에 번갈아 보여 줘요. 3초 멈추기 대신 **지난 시간을 재서** 페이지를 바꾸는 것이 핵심이에요.
  2부에서는 **WiFi 웹서버**로 폰에 값 표를 보내고, 앱이 읽을 **JSON** 주소를 열어요. 마지막에는 AI 와 함께 기준을 넘은 칸이 빨개지는 내 폰 앱을 만들어 보드에 올려요.
