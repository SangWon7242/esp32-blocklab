    <text x="352" y="118">S: 2300 !</text>
    <text x="352" y="136">K: 2048</text>
  </g>
  <text x="401" y="166" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">OLED 페이지 1</text>
  <rect x="342" y="232" width="118" height="80" rx="6" fill="#0b1b4d" stroke="#1d4ed8" stroke-width="2.5"/>
  <g fill="#7dd3fc" stroke="none" font-size="12" font-family="ui-monospace, monospace">
