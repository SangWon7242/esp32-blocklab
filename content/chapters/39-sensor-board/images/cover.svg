    <rect x="564" y="246" width="34" height="18" rx="4" fill="#4562f5" fill-opacity="0.85"/>
    <text x="581" y="259" fill="#ffffff" text-anchor="middle" font-size="9" font-weight="700">page=2</text>
  </g>
  <text x="562" y="326" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">폰 브라우저 (2초마다 새로)</text>
