    <rect x="526" y="160" width="72" height="22" rx="4" fill="#e03131" fill-opacity="0.85"/>
    <text x="532" y="175" fill="#ffffff" font-weight="700">S: 2300 !</text>
    <rect x="526" y="186" width="72" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <text x="532" y="201">T: 25C</text>
    <rect x="526" y="212" width="72" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <text x="532" y="227">H: 40%</text>
    <rect x="526" y="246" width="34" height="18" rx="4" fill="#4562f5" fill-opacity="0.85"/>
