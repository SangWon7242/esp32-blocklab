  <text x="485" y="178" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">WiFi</text>
  <rect x="508" y="92" width="108" height="212" rx="14" fill="var(--card)" stroke-width="2.5"/>
  <rect x="520" y="110" width="84" height="176" rx="4" fill="var(--muted)"/>
  <circle cx="562" cy="298" r="3" fill="currentColor" stroke="none"/>
  <g stroke="none" fill="currentColor" font-size="11" font-weight="700">
    <text x="526" y="126">Sensor Board</text>
  </g>
  <g stroke="none" font-size="11" fill="currentColor">
    <rect x="526" y="134" width="72" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
