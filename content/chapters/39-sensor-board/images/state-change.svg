<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sb-state-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sb-state-title">상태 변화 감지: PIR 값이 0 0 1 1 1 0 0 1 1 로 바뀔 때, 값이 1 일 때마다 알리면 다섯 번 알리지만, 이전 값이 0 이고 지금 값이 1 인 순간(0 → 1)에만 알리면 두 번만 배너가 뜬다. 이전 값을 변수 last 에 기억해 둔다</title>
  <defs>
    <marker id="sb-state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="16" font-weight="700" fill="currentColor" stroke="none">바뀐 순간만 잡기 — 이전 값과 지금 값</text>
  <!-- 요청 순서 -->
  <g stroke="none" fill="currentColor" font-size="12" text-anchor="middle" fill-opacity="0.75">
    <text x="24" y="70" text-anchor="start">요청</text>
    <text x="130" y="70">1</text><text x="185" y="70">2</text><text x="240" y="70">3</text><text x="295" y="70">4</text><text x="350" y="70">5</text><text x="405" y="70">6</text><text x="460" y="70">7</text><text x="515" y="70">8</text><text x="570" y="70">9</text>
  </g>
  <!-- PIR 신호 -->
  <text x="24" y="112" font-size="13" font-weight="700" fill="currentColor" stroke="none">PIR 값</text>
  <path d="M110 128 H212 V92 H377 V128 H487 V92 H596" stroke="#c92a2a" stroke-width="3"/>
  <g stroke="none" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">
    <text x="130" y="146">0</text><text x="185" y="146">0</text><text x="240" y="146">1</text><text x="295" y="146">1</text><text x="350" y="146">1</text><text x="405" y="146">0</text><text x="460" y="146">0</text><text x="515" y="146">1</text><text x="570" y="146">1</text>
  </g>
  <!-- 매번 1이면 -->
  <text x="24" y="190" font-size="13" font-weight="700" fill="currentColor" stroke="none">값이 1 이면</text>
  <text x="24" y="206" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">알리기</text>
  <g stroke="none" fill="#e03131" fill-opacity="0.8">
    <rect x="222" y="178" width="36" height="22" rx="5"/><rect x="277" y="178" width="36" height="22" rx="5"/><rect x="332" y="178" width="36" height="22" rx="5"/>
    <rect x="497" y="178" width="36" height="22" rx="5"/><rect x="552" y="178" width="36" height="22" rx="5"/>
  </g>
  <g stroke="none" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">
    <text x="240" y="193">알림</text><text x="295" y="193">알림</text><text x="350" y="193">알림</text><text x="515" y="193">알림</text><text x="570" y="193">알림</text>
  </g>
  <text x="606" y="194" font-size="12" font-weight="700" fill="#e03131" stroke="none" text-anchor="end"></text>
  <text x="130" y="226" font-size="12" fill="currentColor" fill-opacity="0.8" stroke="none">→ 사람이 서 있는 동안 계속 울려요 (5번)</text>
  <!-- 0→1 일 때만 -->
  <text x="24" y="264" font-size="13" font-weight="700" fill="currentColor" stroke="none">0 → 1 로</text>
  <text x="24" y="280" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">바뀔 때만</text>
  <g stroke="none" fill="#2f9e44" fill-opacity="0.85">
    <rect x="212" y="252" width="56" height="22" rx="5"/>
    <rect x="487" y="252" width="56" height="22" rx="5"/>
  </g>
  <g stroke="none" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">
    <text x="240" y="267">DETECTED</text><text x="515" y="267">DETECTED</text>
  </g>
  <text x="130" y="300" font-size="12" fill="currentColor" fill-opacity="0.8" stroke="none">→ 들어오는 순간에만 배너 (2번)</text>
  <!-- 변수 표 -->
  <rect x="24" y="314" width="592" height="34" rx="8" fill="var(--card)"/>
  <g stroke="none" fill="currentColor" font-size="12" font-family="ui-monospace, monospace">
    <text x="36" y="336">now = pir.value()   if now == 1 and last == 0: banner = "DETECTED"   last = now</text>
  </g>
</svg>
