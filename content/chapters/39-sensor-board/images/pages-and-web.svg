<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sb-web-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sb-web-title">같은 값을 세 가지로 보여 주기: OLED 페이지 1(빛 · 소리 · 손잡이)과 페이지 2(온도 · 습도 · 틸트 · PIR), 폰 브라우저의 값 페이지(2초마다 새로고침, page=1 · page=2 버튼), 그리고 /data 주소가 주는 JSON 글 {"temp": 25, "hum": 40}</title>
  <defs>
    <marker id="sb-web-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- OLED 두 페이지 -->
  <text x="24" y="34" font-size="14" font-weight="700" fill="currentColor" stroke="none">OLED — 한 번에 한 페이지</text>
  <rect x="24" y="48" width="150" height="76" rx="6" fill="#0b1b4d" stroke="#1d4ed8" stroke-width="2.5"/>
  <g fill="#7dd3fc" stroke="none" font-size="12" font-family="ui-monospace, monospace">
    <text x="34" y="68">L: 1234</text>
    <text x="34" y="86">S: 300</text>
    <text x="34" y="104">K: 2048</text>
  </g>
  <text x="99" y="142" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">페이지 1</text>
  <path d="M99 150 V166" stroke-opacity="0.6" marker-end="url(#sb-web-arrow)"/>
  <text x="110" y="162" font-size="11" fill="currentColor" fill-opacity="0.75" stroke="none">3초마다 / 버튼으로</text>
  <rect x="24" y="172" width="150" height="92" rx="6" fill="#0b1b4d" stroke="#1d4ed8" stroke-width="2.5"/>
  <g fill="#7dd3fc" stroke="none" font-size="12" font-family="ui-monospace, monospace">
    <text x="34" y="192">T: 25C</text>
    <text x="34" y="210">H: 40%</text>
    <text x="34" y="228">TILT: 0</text>
    <text x="34" y="246">PIR: 1</text>
  </g>
  <text x="99" y="282" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">페이지 2</text>
  <!-- 폰 페이지 -->
  <text x="222" y="34" font-size="14" font-weight="700" fill="currentColor" stroke="none">폰 브라우저 — 주소 /</text>
  <rect x="222" y="48" width="150" height="250" rx="14" fill="var(--card)" stroke-width="2.5"/>
  <rect x="234" y="64" width="126" height="212" rx="4" fill="var(--muted)"/>
  <g stroke="none" fill="currentColor" font-size="12">
    <text x="242" y="82" font-weight="700">Sensor Board</text>
    <rect x="242" y="92" width="52" height="20" rx="4" fill="#4562f5" fill-opacity="0.85"/>
    <text x="268" y="106" fill="#ffffff" text-anchor="middle" font-size="10" font-weight="700">page=1</text>
    <rect x="300" y="92" width="52" height="20" rx="4" fill="#4562f5" fill-opacity="0.85"/>
    <text x="326" y="106" fill="#ffffff" text-anchor="middle" font-size="10" font-weight="700">page=2</text>
    <rect x="242" y="120" width="110" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <text x="248" y="135">L: 1234</text>
    <rect x="242" y="148" width="110" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <text x="248" y="163">S: 300</text>
    <rect x="242" y="176" width="110" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <text x="248" y="191">T: 25C</text>
    <rect x="242" y="204" width="110" height="22" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <text x="248" y="219">H: 40%</text>
    <text x="297" y="262" text-anchor="middle" font-size="11" fill-opacity="0.7">2초마다 새로 읽음</text>
  </g>
  <circle cx="297" cy="288" r="3" fill="currentColor" stroke="none"/>
  <!-- JSON -->
  <text x="412" y="34" font-size="14" font-weight="700" fill="currentColor" stroke="none">앱이 읽는 글 — 주소 /data</text>
  <rect x="412" y="48" width="204" height="86" rx="10" fill="var(--card)"/>
  <g stroke="none" fill="currentColor" font-size="13" font-family="ui-monospace, monospace">
    <text x="426" y="76">{"temp": 25,</text>
    <text x="426" y="98">"hum": 40}</text>
  </g>
  <text x="426" y="124" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">JSON: 이름과 값을 짝지은 글</text>
  <rect x="412" y="150" width="204" height="60" rx="10" fill="var(--card)"/>
  <g stroke="none" fill="currentColor" font-size="13" font-family="ui-monospace, monospace">
    <text x="426" y="176">/light → {"light": 1234}</text>
  </g>
  <text x="426" y="198" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">주소마다 다른 답</text>
  <rect x="412" y="226" width="204" height="72" rx="10" fill="var(--card)"/>
  <g stroke="none" fill="currentColor" font-size="12">
    <text x="426" y="250" font-weight="700">/cmd?page=2 → OK</text>
    <text x="426" y="270">명령: 질의 page 의 값을 보고</text>
    <text x="426" y="288">OLED 페이지를 바꿔요</text>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">사람이 보는 페이지(HTML)와 앱이 읽는 글(JSON)은 같은 값을 다른 모양으로 담아요</text>
</svg>
