# 교과 융합 트랙 F16 · 병아리 키우기 (OLED 다마고치) — 원본: 아두이노 기본 W06 병아리 게임(You Like Chick?: 자석 센서로 시작, 온습도 + 기울기 or 적외선으로 상태 BLANK · SMILE · BAD, LCD 사용자 문자, 숙제 "효과음 넣기"), 센서 트랙 S12(15-temp-humidity) · S13(16-tilt-pir) · S18(21-oled) · F6(33-room-climate). 형식 설명은 src/track/README.md
# 자석 센서 시작 조건은 버튼(27번)으로, 적외선 반사 센서는 PIR(23번)로, LCD 사용자 문자는 OLED 의 rect · fill_rect · line 얼굴로 바꿨다
id: 43-chick
order: 43
track: fusion
label: F16
prerequisites: [15-temp-humidity, 16-tilt-pir, 21-oled, 33-room-climate]
subjects: [과학, 기술가정, 미술]
sdg: [15]
sessions: 2
teacherNotes: |
  **핀 번호** DHT11 S 13번(S12 와 같음), 틸트 S 14번, PIR S 23번(S13 과 같음), OLED SCL 22 · SDA 21(S18), 시작 **버튼 27번**(S8 의 14번은 틸트가 쓰므로 옮김), 수동 부저 15번(S9). 여섯 장치의 핀이 겹치지 않는다. F6 을 한 모둠은 DHT11 S 선을 4번에서 13번으로 되돌려 꽂게 한다.

  **원본과 다른 점** 원본 W06 은 "자석 센서 값이 0 이 되면 시작"이었다. 키트에 자석 센서가 없고 "정확히 0" 조건은 센서 편차에 약하므로 **버튼을 누르면 시작**으로 바꿨다. 적외선 반사 센서(놀아 주기)는 **PIR(사람이 다가옴)** 로, LCD 사용자 문자는 OLED 에 rect · fill_rect · line 으로 그리는 얼굴로 바꿨다. OLED 글자는 영문만 되므로 화면 글은 `You Like Chick?` · `PRESS START` · `S: SMILE` 처럼 영어다.

  **기준값은 예시** 알맞은 범위 20~28℃ · 40~70% 는 **예시**다(실제 병아리 사육 적정 온도는 첫 주 32~35℃ 로 훨씬 높다 — 과학 시간에 "왜 우리 교실 기준과 다를까"를 이야기할 거리). 1차시 실행에서 교실 온도 · 습도를 공책에 적고, 교실 값이 범위 밖이면 판정을 받은 뒤 범위를 "지금 값 ±2" 로 고쳐 SMILE 과 BAD 를 모두 보게 한다(미션 · 디버깅 판정은 지시의 숫자 그대로). 손으로 센서를 감싸고 입김을 불면 습도가 70 을 넘어 BAD 가 된다.

  **센서 성질** PIR 은 켠 뒤 30~60초 예열이 필요하고 교실에서는 다른 모둠의 움직임도 잡는다(S13 과 같음, 종이컵 고깔로 시야를 좁힌다). 틸트 모듈은 흔들면 1 이지만 반대인 모듈이 있으니 출력으로 먼저 확인한다. `pir.value() == 1` 과 `tilt.value() == 1` 은 글자가 같은 코드라 블록 화면에서는 둘 다 "기울었는가" 블록으로 보인다. DHT11 은 2초보다 자주 재면 `OSError` 가 난다. 보드에 `ssd1306.py` 가 있어야 화면이 켜진다. 1부(실행 1 · 미션)는 DHT11 · 버튼 · OLED 만 꽂아도 되고, 틸트 · PIR · 부저는 2부에서 더 꽂아도 된다.

  **효과음** 수동 부저(초록 판)를 쓴다. 능동 부저(검은 스티커)를 꽂았으면 `beeper.freq()` 가 소용없고 켜는 동안 한 음만 난다. 2부 추가 미션(상태마다 다른 음)은 선택이다.

  **교과 · 단원 연결**

  - 과학: 동물의 생활과 환경(적정 온도 · 습도, 변온 · 정온 동물), 열과 적외선(PIR 은 몸에서 나오는 적외선의 변화를 느낀다), 생물과 환경의 관계
  - 기술가정: 반려동물 · 가축의 사육 환경과 책임, 생활 속 자동화 기기
  - 미술: 128 × 64 점 화면에 표정 도트 디자인(모눈종이에 먼저 그리고 좌표로 옮기기)
  - SDG 15(육상 생태계 보호): 동물이 살기 좋은 환경을 수치로 살피고 돌보기

  **안전과 메이킹** 배선은 늘 USB 를 뺀 채로 한다. 박스지로 병아리 집(OLED 창, PIR 구멍, 버튼 자리)을 접어 붙이고, DHT11 은 상자 밖 공기가 통하는 곳에 둔다. 틸트 모듈은 집 바닥에 붙여 집을 살살 흔들면 1 이 되게 한다. 종이컵을 거꾸로 세워 OLED 받침으로 써도 좋다.

  - 1차시: 문제 만나기 ~ 미션(시작 버튼 · 온습도 · 상태 글자)
  - 2차시: 실행 2 · 읽기 체크 2(얼굴 · 놀아 주기 · 효과음) · (추가 미션) · 디버깅 · 설계(배고픔 수치) · 성찰
  - 시간이 모자라면 추가 미션은 건너뛰고 디버깅 증상 3 을 다음 시간으로 미룬다
title: 병아리 키우기
subtitle: 춥다 · 덥다 · 심심하다를 얼굴과 소리로 알려 주는 OLED 다마고치
summary: |
  병아리는 말을 못 해요. 춥거나 덥거나 심심해도 "삐약" 뿐이에요. 오늘은 **DHT11** 로 온도 · 습도를 재고, **틸트 스위치**와 **PIR 센서**로 놀아 주는지 알아채서, **OLED 화면**에 병아리 얼굴과 수치를 보여 주는 다마고치를 만들어요.
  1부에서는 버튼으로 시작해 온습도와 상태 글자를 띄우고, 2부에서는 함수로 얼굴을 그리고 상태가 바뀔 때 **부저**가 한 번 울리게 해요. 동물이 살기 좋은 환경을 숫자로 살피는 연습이기도 해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 온습도 센서(DHT11 모듈), note: "다리 3개: S(신호) · +(3V3) · −(GND). S 는 13번 핀으로" }
  - { name: 틸트 스위치 모듈, note: "다리 3개: S · + · −. S 는 14번. 흔들면 안에서 구슬이 굴러요" }
  - { name: PIR 센서(인체감지) 모듈, note: "다리 3개: S · + · −. S 는 23번. 둥근 렌즈가 앞을 봐요" }
  - { name: OLED 화면 (128×64), note: "핀 4개: GND · VCC · SCL(22) · SDA(21). 보드에 ssd1306.py 를 먼저 올려 두기" }
  - { name: 버튼(택트 스위치), note: "다리 4개. 가운데 홈에 걸쳐 꽂고 한쪽은 27번, 반대쪽은 − 줄" }
  - { name: 수동 부저(초록 판), note: "+ 다리는 15번, − 다리는 − 줄. 음 높이를 바꿀 수 있는 부저" }
  - { name: 브레드보드, note: "위쪽 + 줄(3V3)과 − 줄(GND)을 여섯 부품이 함께 써요" }
  - { name: M-F 듀폰선, note: "9가닥. 보드 핀(3V3 · GND · 22 · 21 · 13 · 14 · 23 · 27 · 15) → 브레드보드" }
  - { name: 점퍼선(M-M), note: "10개. 브레드보드 안에서 + 줄 · − 줄로 (OLED 2, DHT11 2, 틸트 2, PIR 2, 버튼 1, 부저 1)" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "위쪽 + 줄 ← 3V3, − 줄 ← GND. OLED(2~5번 줄: GND · VCC · SCL · SDA): GND → − 줄, VCC → + 줄, SCL ← 22, SDA ← 21. DHT11(8~10번 줄: S · + · −): S ← 13, + → + 줄, − → − 줄. 틸트 모듈(13~15번 줄): S ← 14, + → + 줄, − → − 줄. PIR 모듈(18~20번 줄): S ← 23, + → + 줄, − → − 줄. 버튼은 가운데 홈에 걸쳐 23 · 25번 줄에: 23번 줄 j 칸 ← 27, 25번 줄 c 칸 → − 줄. 수동 부저(28 · 30번 줄): + 다리 28번 줄 ← 15, − 다리 30번 줄 → − 줄"
principle:
  image: images/chick-states.svg
  body: |
    동물마다 **살기 좋은 온도와 습도**가 있어요. 병아리는 스스로 체온을 지키는 힘이 약해서 어미 품(약 32~35℃)처럼 따뜻해야 하고, 너무 습하면 병에 걸리기 쉬워요. 그래서 사육장은 온도계와 습도계를 보며 돌봐요. 이 챕터의 20~28℃ · 40~70% 는 **교실에서 시험하기 위한 예시 범위**예요.

    병아리의 기분은 세 가지 **상태**로 나타내요. 온도나 습도가 범위 밖이면 `BAD`, 둘 다 알맞으면 `BLANK`, 알맞은 데다 집을 흔들어 주거나(틸트) 사람이 다가오면(PIR) `SMILE` 이에요. **PIR 센서**는 사람 몸에서 나오는 **적외선(열)** 의 변화를 느껴서 "놀아 주러 왔다"를 알아채요.

    화면에는 상태 글자와 수치, 그리고 **얼굴**을 그려요. 얼굴은 128 × 64 점 화면에 네모 · 채운 네모 · 선으로 그리는 **도트 디자인**이에요. 상태가 **바뀌는 순간**에만 부저가 한 번 울리도록, 바로 전 상태를 `prev` 에 기억해 두고 비교해요.
goals:
  content: DHT11 · 틸트 · PIR 세 센서의 값을 범위 판단과 and · or 로 묶어 병아리 상태 세 가지를 정하고, 매개변수를 받는 함수로 OLED 에 얼굴을 그리며, 상태가 바뀔 때만 부저를 울린다
  thinking: 센서 여러 개를 알아야 · 정해야 · 움직여야 로 나누고, "상태" 라는 변수 하나로 기계의 기분을 정리한 뒤 바뀐 순간을 잡아내는 방법(이전 값 기억)을 설명한다
successCriteria:
  - 병아리에게 알맞은 온도 · 습도 범위가 왜 필요한지 말하고, 교실에서 잰 값으로 범위를 고칠 수 있다
  - 두 범위 판단을 and 로, 틸트와 PIR 을 or 로 묶어 SMILE · BLANK · BAD 세 상태를 정할 수 있다
  - 상태 글자를 매개변수로 받는 함수로 얼굴을 다르게 그릴 수 있다
  - 바로 전 상태를 기억해 두고 비교해서, 상태가 바뀌는 순간에만 소리가 나게 할 수 있다
parts:
  - id: part1
    title: 1부 · 시작 버튼과 온습도 화면
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 병아리는 말을 못 해요
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 춥다 · 덥다 · 심심하다를 병아리 대신 화면이 알려 주면 어떨까요?
        body: |
          병아리는 말을 못 해요. 춥거나 덥거나 심심해도 "삐약" 뿐이에요. 사람이 매번 온도계를 보고 손을 대 보지 않으면 병아리가 힘든 줄 몰라요. 동물이 살기 좋은 환경을 지켜 주는 것은 생태계를 돌보는 첫걸음이에요.

          오늘은 센서로 병아리의 환경을 재고, 화면의 **얼굴**과 **소리**로 기분을 알려 주는 다마고치를 만들어요. 코드를 보기 전에 질문마다 내 생각을 한두 문장으로 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, DHT11, 틸트 모듈, PIR 모듈, OLED, 버튼, 수동 부저, 브레드보드, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장씩 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 병아리가 춥거나 더운 것을 기계가 알아채려면 무엇을 재야 할까요? 그 값이 얼마일 때 "알맞다"고 할까요?
          - 병아리가 심심한 것은 어떻게 알 수 있을까요? 누가 놀아 주러 왔다는 것을 센서로 어떻게 알아챌까요?
          - 병아리의 기분을 화면 하나로 한눈에 알려 주려면 무엇을 보여 주면 좋을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별 세 칸 보드
        minutes: 6
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          다마고치에는 장치가 여섯이에요. 센서 셋(DHT11 · 틸트 · PIR)이 **알아내고**, 사람이 **시작 여부와 범위, 상태 세 가지를 정해 주면**, 화면과 부저가 **움직여요**. 센서마다 어느 칸에 들어갈지 생각하며 나눠 봐요.

          - **알아야 할 것**: DHT11 의 온도 · 습도, 틸트가 흔들렸는지, PIR 에 사람이 왔는지, 버튼이 눌렸는지
          - **정해야 할 것**: 시작은 언제, 알맞은 범위는 얼마부터 얼마까지, 상태는 몇 가지
          - **해야 할 것**: 얼굴 · 수치 · 소리

          과학 시간에는 동물마다 알맞은 온도가 왜 다른지(정온 동물 · 변온 동물, 새끼와 어른) 조사해서 표로 적어 보고, 그 표에서 우리 병아리의 범위를 골라 보세요.
        todo:
          - "**알아야 할 것**: 센서 셋과 버튼이 알아내는 값 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 것(시작 · 범위 · 상태) 적기"
          - "**해야 할 것**: 화면과 부저가 할 일을 하나씩 적기"
        answer:
          know: ["DHT11 이 잰 온도(℃)와 습도(%)", "틸트 스위치 값(흔들면 1)과 PIR 값(사람이 움직이면 1)", "버튼이 눌렸는지(누르면 0)", "DHT11 13, 틸트 14, PIR 23, 버튼 27, OLED 22 · 21, 부저 15"]
          decide: ["언제 시작할지 (버튼을 누르면)", "알맞은 온도 범위 (예: 20~28℃)와 습도 범위 (예: 40~70%)", "상태 세 가지 (BLANK · SMILE · BAD)와 각각의 조건", "몇 초마다 잴지 (예: 2초)"]
          act: ["시작 전에는 대기 화면 보여 주기", "온도 · 습도 · 상태 글자를 화면에 적기", "상태에 맞는 얼굴 그리기", "상태가 바뀌면 부저 한 번 울리기"]

      - id: predict
        type: predict
        title: 예측하기 — 버튼을 누르기 전과 후
        minutes: 4
        scene:
          image: images/chick-states.svg
          caption: 시작 전에는 대기 화면, 시작 뒤에는 온도와 습도. 그 사이를 가르는 것이 `started` 예요
        body: |
          활동 칸의 코드는 처음에 `You Like Chick?` 대기 화면을 띄우고, 버튼을 누르면 `started` 가 `True` 가 되어 그때부터 2초마다 온도와 습도를 화면에 적어요. 아직 실행하지 않아요.

          `started` 는 처음에 `False` 예요. 반복 안에서 `if started:` 는 "시작했나요?" 라고 묻는 거예요. 코드를 한 줄씩 읽고 무엇이 보일지 먼저 적어 봐요. **내 예측을 먼저 적는 것**이 중요해요.
        todo:
          - 코드를 위에서부터 한 줄씩 소리 내어 읽기
          - "`started` 가 나오는 줄 세 개 찾기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_wait_start.py
        blanks:
