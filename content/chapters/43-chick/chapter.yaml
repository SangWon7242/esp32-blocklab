          - ["지금 시각을 last 에", "last = time.ticks_ms()"]
          - ["food 를 1 올리고 최대 10", "food = min(food + 1, 10)"]
          - ["last 부터 10000 ms 지났으면", "if time.ticks_diff(time.ticks_ms(), last) > 10000:"]
          - ["food 를 1 내리고 최소 0", "food = max(food - 1, 0)"]
          - ["먹이 막대 그리기", "oled.fill_rect(0, 20, food * 12, 12, 1)"]
