      - id: debug
        type: debug
        title: 디버깅 — 병아리가 이상해요
        minutes: 9
        scene:
          image: images/state-change.svg
          caption: 시작이 안 되면 변수가 어디서 바뀌는지, 상태가 엉뚱하면 and · or 묶음을, 깜박이면 다시 그리는 때를 봐요
        body: |
          고장 난 병아리 세 마리가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 버튼을 눌러도 시작이 안 되면 `started` 를 바꾸는 곳, 온습도가 나쁜데도 웃으면 조건의 `and` · `or`, 화면이 깜박이면 화면을 다시 그리는 때를 봐요.

          셋 다 빨간 글씨(에러)는 뜨지 않아요. 에러 없이 이상하게만 구는 버그가 더 찾기 어려워요. 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: "버튼을 누르면 start! 는 찍히는데, playing 은 끝내 안 찍혀요"
            code: |
              from machine import Pin
              import time

              button = Pin(27, Pin.IN, Pin.PULL_UP)


              def start_game():
                  started = True
                  print("start!")


              started = False
              while True:
                  if button.value() == 0:
                      start_game()
                  if started:
                      print("playing")
                  time.sleep(0.1)
            question: "함수 안에서 started = True 라고 썼는데, 함수 밖의 started 는 왜 그대로 False 일까요? 함수 안에서 바꾼 변수와 밖의 변수가 같은 변수일까요? 밖의 변수를 바꾸려면 함수에게 먼저 무엇을 알려 줘야 할까요?"
            rules:
              - codeMatches: 'def start_game\(\):\n\s+global started\n\s+started = True'
                fail: 함수 안에서 바깥 변수를 바꾸려면 먼저 "이 이름은 바깥 것" 이라고 알려 줘야 해요. 변수 꾸러미에서 그 블록을 찾아 함수 맨 위에 넣었나요?
          - title: "온도가 31도라 BAD 여야 하는데, 사람이 다가가면 SMILE 로 웃어요"
            code: |
              from machine import Pin
              import time
              import dht

              dht11 = dht.DHT11(Pin(13))
              tilt = Pin(14, Pin.IN)
              pir = Pin(23, Pin.IN)

              state = "BLANK"
              while True:
                  dht11.measure()
                  t = dht11.temperature()
                  h = dht11.humidity()
                  ok = 20 <= t <= 28 and 40 <= h <= 70
                  if ok and tilt.value() == 1 or pir.value() == 1:
                      state = "SMILE"
                  elif ok:
                      state = "BLANK"
                  else:
                      state = "BAD"
                  print(state)
                  time.sleep(2)
            question: "ok 가 거짓인데 어떻게 SMILE 이 될까요? and 와 or 가 한 줄에 있으면 파이썬은 어느 것을 먼저 묶을까요? 'ok 이고 (틸트 또는 PIR)' 이 되려면 무엇으로 묶어야 할까요?"
            rules:
              - codeMatches: 'if ok and \((tilt|pir)\.value\(\) == 1 or (tilt|pir)\.value\(\) == 1\):'
                fail: 틸트 or PIR 을 한 덩어리로 먼저 묶으려면 어떤 블록으로 감싸야 할까요? 괄호 블록을 찾아봤나요?
          - title: "화면이 자꾸 깜박거려서 글자를 읽기 힘들어요"
            code: |
              from machine import Pin, SoftI2C
              import ssd1306
              import time

              tilt = Pin(14, Pin.IN)
              pir = Pin(23, Pin.IN)
              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              state = "BLANK"
              prev = "BLANK"
              while True:
                  if tilt.value() == 1 or pir.value() == 1:
                      state = "SMILE"
                  else:
                      state = "BLANK"
                  oled.fill(0)
                  oled.text("S: " + state, 0, 0)
                  oled.show()
                  time.sleep(0.05)
            question: "0.05초마다 지우고 다시 내보내면 화면은 어떻게 보일까요? 상태가 그대로일 때도 다시 그릴 필요가 있을까요? prev 가 준비되어 있는데 쓰이지 않아요. 언제만 다시 그리면 될까요?"
            rules:
              - codeMatches: 'if (state != prev|prev != state):\n[\s\S]*?oled\.fill\(0\)[\s\S]*?oled\.show\(\)[\s\S]*?prev = state'
                fail: 화면은 상태가 바뀐 순간에만 다시 그리면 돼요. 바로 전 상태와 비교하는 if 안에 지우기 · 적기 · 내보내기를 넣고, 그 뒤에 지금 상태를 기억해 두었나요?

      - id: design
        type: design
        title: 설계 — 배고픔 수치 더하기
        minutes: 9
        scene:
          image: images/face-grid.svg
          caption: 이번에는 화면에 먹이 막대를 그려요. 시간이 지나면 줄고, 버튼을 누르면 먹이를 줘요
        body: |
          진짜 다마고치는 **배고픔**이 있어요. 먹이 수치 `food` 가 10초마다 1 씩 줄고, 버튼을 누르면 1 씩 늘어요(최대 10). 화면에는 `FOOD: 5` 와 먹이 막대(너비 `food * 12`)를 그리고, 3 보다 작으면 `HUNGRY!` 를 적어요. 센서 없이 **버튼과 OLED** 만으로 처음부터 설계해요.

          "10초가 지났는지" 는 S13 복도 등처럼 `last` 에 시각을 담아 두고 **지난 시간** 블록으로 재요. 먼저 우리말 설계도의 빈칸을 채우고, 번역표로 우리말 한 줄이 어떤 코드가 되는지 짝지어 봐요. 그다음 섞인 블록을 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 우리말 한 줄이 어떤 코드가 되는지 짝지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 버튼을 __번 핀에, OLED 화면을 준비한다
            blank: { answer: 27 }
          - text: 먹이 수치 food 를 __ 로 시작한다
            blank: { answer: 5 }
          - text: 화면을 지우고 FEED ME 를 적어 내보내고 1초 기다린다
          - text: 지금 시각을 last 에 담는다
          - text: 끝없이 되풀이한다
          - text: "  ↳ 버튼이 눌렸으면 food 를 1 올리고(최대 __) 0.3초 기다린다"
            blank: { answer: 10 }
          - text: "  ↳ last 부터 __ ms 가 지났으면 food 를 1 내리고(최소 0) last 를 지금 시각으로"
            blank: { answer: 10000 }
          - text: "  ↳ 화면을 지우고 FOOD: 와 food 를 적고, 너비 food × 12 의 먹이 막대를 그린다"
          - text: "  ↳ food 가 __ 보다 작으면 HUNGRY! 를 적는다"
            blank: { answer: 3 }
          - text: "  ↳ 화면에 내보내고 0.1초 기다린다"
        translation:
