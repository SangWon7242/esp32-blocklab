      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 6
        scene:
          image: images/cover.svg
          caption: 센서 셋과 상태 변수 하나로 병아리의 기분을 보여 줬어요. 이 생각을 또 어디에 쓸 수 있을까요?
        body: |
          오늘은 센서 셋의 값을 범위 판단과 and · or 로 묶어 **상태** 하나로 정리하고, 함수로 얼굴을 그리고, 바로 전 상태와 비교해 바뀐 순간에만 소리를 냈어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          코드 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요.

          과학 시간에는 병아리 · 햄스터 · 금붕어 · 거북이처럼 기르는 동물의 알맞은 온도와 습도를 조사해 표로 적고, 우리 교실 값과 비교해 어떤 동물을 교실에서 기를 수 있을지 이야기해 보세요. 미술 시간에는 모눈종이 128 × 64 칸에 나만의 병아리 표정(놀람 · 졸림)을 그리고 네모 · 선의 좌표로 옮겨 `draw_face` 에 갈래를 하나 더해 봐요.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 상태가 정해지는 순서를 설명하기
        lineExplain: step1_wait_start.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 알맞은 범위 20~28℃ · 40~70% 를 우리 교실 값에 맞게 바꾼다면 몇으로 하고 싶나요? 진짜 병아리에게 알맞은 온도와는 왜 다를까요?
          - 상태가 바뀌는 순간에만 소리를 내려고 prev 를 썼어요. 이 방법을 또 어디에 쓸 수 있을까요? (예를 하나 적어 보세요)
          - "다음엔 여기부터 본다: 한 줄로"
