  - id: part2
    title: 2부 · 버튼으로 LED 움직이기
    steps:
      - id: run2
        type: run
        title: 실행 2 — 질의 led 로 켜고 끄기
        minutes: 8
        scene:
          image: images/phone-page.svg
          caption: led=on 을 누르면 주소가 /cmd?led=on 으로 바뀌어요. 보드는 질의 led 의 값을 읽어요
        body: |
          1부에서는 버튼을 눌러도 LED 가 그대로였어요. 보드가 요청을 받기만 하고 **질의를 읽지 않았기** 때문이에요.

          이번엔 요청 받기 다음에 `if` 두 개를 넣어요. 질의 `led` 가 `on` 이면 켜고, `off` 면 꺼요. `query.get("led", "")` 는 주소에 `led` 가 없으면 빈 글을 줘서, 처음 주소를 열 때는 둘 다 거짓이에요.
        todo:
          - WiFi 이름과 비밀번호를 1부처럼 고치고 실행하기
          - 폰에서 led=on, led=off 를 번갈아 누르며 LED 보기
          - 주소 창에 직접 `/cmd?led=on` 을 적어 열어도 켜지는지 해 보기
        code: step2_web_led.py
        expected: 폰에서 `led=on` 을 누르면 LED 가 켜지고, `led=off` 를 누르면 꺼져요. 버튼을 누를 때마다 페이지가 다시 떠요. 주소 창에 `/cmd?led=on` 을 직접 적어 열어도 켜져요.
        codeNotes:
          - { line: 11, note: "요청을 받아 `path` 와 `query` 에 담아요. 1부와 같아요" }
          - { line: 12, note: "질의 `led` 의 값이 `on` 과 같은지 물어요. 주소에 `led` 가 없으면 빈 글이라 거짓" }
          - { line: 13, note: "LED 를 켜요" }
          - { line: 14, note: "질의 `led` 의 값이 `off` 와 같은지 물어요" }
          - { line: 15, note: "LED 를 꺼요" }
          - { line: 16, note: "어느 쪽이든 끝에 페이지로 한 번 답해요. 그래야 폰이 기다리지 않아요" }

      - id: readcheck2
        type: readcheck
        title: 읽기 체크 — 한 바퀴에 한 번
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 요청 하나가 들어왔을 때 어느 줄을 지나가는지 따라가며 읽어요
        body: |
          1부 코드와 다른 곳은 `if` 두 줄과 그 안의 LED 줄뿐이에요. 요청 하나에 보드가 지나가는 줄을 따라가 보세요.

          `/cmd?led=off` 가 왔을 때와 그냥 `/` 가 왔을 때 각각 어느 줄이 참인지 생각하며 답해요.
        todo:
          - "주소가 `/cmd?led=off` 일 때 참이 되는 `if` 찾기"
          - 한 바퀴에 페이지를 몇 번 보내는지 세기
          - 세 문제에 답하고 **확인** 누르기
        code: step2_web_led.py
        questions:
          - { kind: choice, q: "폰이 처음 주소(192.168.0.5)만 열었을 때 LED 는?", options: ["켜진다", "꺼진다", "그대로다"], answer: 2, hint: "질의에 led 가 없으면 query.get 은 무엇을 주나요?" }
          - { kind: number, q: "반복 한 바퀴에 페이지로 답하는 횟수는?", answer: 1 }
          - { kind: line, q: "질의 led 의 값이 on 인지 묻는 줄의 줄 번호를 클릭하세요", answer: 12 }
        codeNotes:
          - { line: 11, note: "요청 하나를 받아요. 폰이 안 오면 여기서 기다려요" }
          - { line: 13, note: "조건이 참일 때 LED 를 켜요" }
          - { line: 15, note: "조건이 참일 때 LED 를 꺼요" }
          - { line: 16, note: "`if` 밖, 반복의 맨 끝에 있어요" }

      - id: mission
        type: mission
        title: 미션 — 1부 코드로 폰 스위치 완성하기
        minutes: 10
        scene:
          image: images/phone-page.svg
          caption: 버튼을 누르면 LED 가 바뀌고, 페이지에 지금 보낸 명령(on · off)이 보여야 해요
        body: |
          활동 칸에는 **1부 코드**가 깔려 있어요. 실행 2 를 보지 말고, 폰 버튼으로 LED 를 켜고 끄게 직접 만들어요. 그리고 하나 더, 페이지의 **값 칸**에 지금 받은 질의 값(`on` 또는 `off`)이 보이게 해요.

          요청 받기는 어디에 있어야 다음 손님도 받을까요? 페이지 응답은 몇 번 보내야 폰이 기다리지 않을까요? 블록이든 코드든 편한 쪽에서 고쳐요.
        todo:
          - 요청 받기 다음에 질의 `led` 가 `on` 이면 켜고 `off` 면 끄는 조건 넣기
          - 페이지 응답의 값 칸에 질의 `led` 의 값을 넣기
          - 실행해 폰으로 확인한 뒤 **판정** 누르기
        instructions: 1부 코드에서 시작해, 폰의 led=on · led=off 버튼으로 LED 를 켜고 끄게 하세요. 페이지 응답의 값 칸에는 지금 받은 질의 led 의 값이 보여야 해요. 요청 받기는 반복 안에, 페이지 응답은 반복 끝에 한 번만
        hint: 통신 꾸러미의 "질의 led 이 on 인가" 블록을 만약 블록에 끼우고 안에 LED 켜기를 넣어요. 끄기도 같은 모양으로 하나 더. 값 칸에는 "질의 값 led" 블록을 끼워요
        code: step1_web_page.py
        rules:
          - codeMatches: '^\s+conn, path, query = web_accept\(server\)$'
            fail: 요청 받기가 반복 안에 있나요? 반복 밖에 있으면 손님을 몇 번 받을 수 있을까요?
          - codeMatches: 'query\.get\("led", ""\) == "on":\n\s+led\.value\(1\)'
            fail: 질의 led 의 값이 on 일 때 LED 를 켜고 있나요? 비교하는 글자가 버튼 글과 똑같은가요?
          - codeMatches: 'query\.get\("led", ""\) == "off":\n\s+led\.value\(0\)'
            fail: 질의 led 의 값이 off 일 때 LED 를 끄고 있나요? 켜기와 끄기 조건이 각각 있나요?
          - codeMatches: '^    web_send\(conn, web_page\('
            fail: 페이지 응답이 반복의 맨 끝, if 밖에 있나요? if 안에만 있으면 조건이 거짓일 때 폰은 무엇을 기다릴까요?
          - codeMatches: 'web_page\("[^"]*", "[^"]*led=on[^"]*led=off[^"]*", query\.get\("led", ""\), \d+\)'
            fail: 버튼 글에 led=on 과 led=off 가 있고, 값 칸에 질의 led 의 값이 들어 있나요? 값 칸은 글을 받는 칸이에요
        answerCode: mission_led_state.py

      - id: debug
        type: debug
        title: 디버깅 — 기다리는 폰, 한 번만 되는 보드
        minutes: 8
        scene:
          image: images/request-response.svg
          caption: "한 바퀴 네 칸을 떠올려요: 받기 → 읽기 → 움직이기 → 한 번 답하기. 어느 칸이 빠졌을까요?"
        body: |
          고장 난 코드 세 개가 있어요. 셋 다 빨간 글씨(에러)는 안 나요. 폰 화면이 어떻게 되는지, 몇 번째 손님부터 안 되는지가 단서예요.

          바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 폰이 끝없이 기다리면 응답을, 두 번째부터 안 되면 받기의 위치를, 켜지지 않으면 비교하는 글자를 봐요. `from blocklab_net import *` 와 위쪽 준비 줄은 그대로 두고 맨 아래 열 줄만 고치면 돼요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 버튼을 누르면 켜지는데, 처음 주소만 열면 폰이 빙글빙글 돌며 끝없이 기다려요
            code: |
              from machine import Pin
              from blocklab_net import *

              led = Pin(2, Pin.OUT)

              ip = wifi_connect("MyWiFi", "12345678")
              server = web_start(80)

              print(ip)
              while True:
                  conn, path, query = web_accept(server)
                  if query.get("led", "") == "on":
                      led.value(1)
                      web_send(conn, web_page("LED", "led=on,led=off", "", 0))
                  if query.get("led", "") == "off":
                      led.value(0)
                      web_send(conn, web_page("LED", "led=on,led=off", "", 0))
            question: 처음 주소(질의 없음)가 왔을 때 두 if 는 각각 참일까요, 거짓일까요? 그때 보드는 폰에게 무엇을 보내나요?
            rules:
              - codeMatches: '^    web_send\(conn, web_page\('
                fail: 어떤 요청이 와도 답이 가려면 페이지 응답이 어디에 있어야 할까요? if 안에 둔 응답은 조건이 거짓이면 어떻게 되나요?
          - title: 폰으로 한 번은 켜지는데, 두 번째 버튼부터는 아무리 눌러도 안 돼요
            code: |
              from machine import Pin
              from blocklab_net import *

              led = Pin(2, Pin.OUT)

              ip = wifi_connect("MyWiFi", "12345678")
              server = web_start(80)

              print(ip)
              conn, path, query = web_accept(server)
              while True:
                  if query.get("led", "") == "on":
                      led.value(1)
                  if query.get("led", "") == "off":
                      led.value(0)
                  web_send(conn, web_page("LED", "led=on,led=off", "", 0))
            question: 요청 받기가 반복 밖에 있으면 손님을 몇 번 받나요? 검사 창의 주의 글도 읽어 보세요.
            rules:
              - codeMatches: '^\s+conn, path, query = web_accept\(server\)$'
                fail: 두 번째 손님을 받으려면 요청 받기가 어디에 있어야 할까요? 반복이 한 바퀴 돌 때마다 무엇을 해야 하나요?
          - title: 페이지는 잘 뜨고 led=off 는 되는데, led=on 을 눌러도 LED 가 안 켜져요
            code: |
              from machine import Pin
              from blocklab_net import *

              led = Pin(2, Pin.OUT)

              ip = wifi_connect("MyWiFi", "12345678")
              server = web_start(80)

              print(ip)
              while True:
                  conn, path, query = web_accept(server)
                  if query.get("led", "") == "ON":
                      led.value(1)
                  if query.get("led", "") == "off":
                      led.value(0)
                  web_send(conn, web_page("LED", "led=on,led=off", "", 0))
            question: 버튼을 누르면 폰이 보내는 질의는 led=on 이에요. 코드가 비교하는 글자와 한 글자씩 맞춰 보세요.
            rules:
              - codeMatches: 'query\.get\("led", ""\) == "on":\n\s+led\.value\(1\)'
                fail: 컴퓨터는 on 과 ON 을 같은 글로 볼까요? 버튼 글과 비교하는 글이 똑같은가요?

      - id: design
        type: design
        title: 설계 — 깜박 버튼 더하기
        minutes: 8
        scene:
          image: images/url-anatomy.svg
          caption: 버튼 글에 led=blink 를 더하면 폰이 /cmd?led=blink 를 보내요. 보드는 값이 blink 일 때 할 일을 정해요
        body: |
          버튼이 둘뿐이면 심심해요. 세 번째 버튼 `led=blink` 를 더해, 누르면 LED 가 **세 번 깜박**이게 설계해요. 약속은 간단해요. 버튼 글에 `led=blink` 를 더하고, 질의 `led` 가 `blink` 일 때 할 일을 `if` 하나로 더해요.

          깜박임은 켜고 0.3초, 끄고 0.3초를 세 번 되풀이해요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요. 반복 안쪽은 이미 이어져 있어요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "세 번 되풀이한다"가 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: LED 핀 __번을 준비하고, WiFi 에 연결해 웹서버를 연다
            blank: { answer: 2 }
          - text: 시작할 때 LED 를 끄고, 출력 창에 http:// 와 IP 주소를 이어 찍는다
          - text: 계속 반복한다
          - text: "  ↳ 요청을 받는다"
          - text: "  ↳ 질의 led 가 on 이면 켜고, off 면 끈다"
          - text: "  ↳ 질의 led 가 __ 이면 아래를 한다"
            blank: { answer: blink }
          - text: "    ↳ __번 되풀이: 켜고 0.3초, 끄고 0.3초"
            blank: { answer: 3 }
          - text: "  ↳ 버튼 셋(led=on,led=off,led=blink)과 질의 값이 든 페이지로 한 번 답한다"
        translation:
          - ["WiFi 에 연결한다", 'ip = wifi_connect("MyWiFi", "12345678")']
          - ["http:// 와 IP 를 이어 찍는다", 'print("http://" + ip)']
          - ["요청을 받는다", "conn, path, query = web_accept(server)"]
          - ["질의 led 가 blink 이면", 'if query.get("led", "") == "blink":']
          - ["세 번 되풀이한다", "for i in range(3):"]
          - ["페이지로 답한다", 'web_send(conn, web_page("LED", "led=on,led=off,led=blink", query.get("led", ""), 0))']
        targetCode: design_blink.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 선 대신 주소로. 폰과 보드가 약속만 맞으면 무엇이든 시킬 수 있어요
        body: |
          오늘은 보드가 처음으로 **폰의 말**을 알아들었어요. 선이 아니라 WiFi 와 주소 한 줄로요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 미션 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고(`wifi_connect` 같은 라이브러리 함수는 몸통을 몰라도 돼요), 네 칸에 오늘 있었던 일을 솔직하게 적어요. 다 쓰면 짝에게 1분 동안 설명해 보세요.
        todo:
          - 반복 안의 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 설명하기
        lineExplain: mission_led_state.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요? (WiFi 연결, IP 주소, 버튼 중 무엇이었나요?)
          - 요청과 응답을 손님과 가게에 빗대어 내 말로 설명해 보세요. 주소 /cmd?led=on 에서 경로와 질의는 각각 무엇인가요?
          - 페이지 응답을 반복 끝에 한 번만 두는 까닭은 무엇인가요? if 안에만 두면 폰은 어떻게 되나요?
          - "다음엔 여기부터 본다: 한 줄로"
