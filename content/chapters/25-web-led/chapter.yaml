# 챕터 25 · 폰으로 켜는 LED — 웹서버. 원본: 아두이노 심화 W01(블루투스 앱 → 웹서버로 대체), Keyestudio KS5020 2-2-05·07. 형식 설명은 src/track/README.md
id: 25-web-led
order: 25
track: sensor
label: S22
prerequisites: [01-led, 11-button-touch]
subjects: [정보, 과학]
sessions: 2
teacherNotes: |
  **WiFi 이름과 비밀번호는 예시입니다.** 코드의 `"MyWiFi"` · `"12345678"` 을 교실 공유기 이름과 비밀번호로 바꾸게 해 주세요(WiFi 준비 블록의 두 칸). 폰과 보드가 **같은 WiFi** 에 붙어 있어야 폰이 보드를 찾습니다. 학교 WiFi 가 기기끼리의 통신을 막거나 비밀번호를 줄 수 없으면 **공유기 모드** 블록(`WiFi 공유기 모드 시작하기`, 코드 `ip = wifi_ap("ESP32-LAB", "12345678")`)으로 바꾸면 보드가 직접 WiFi 를 만듭니다. 그때는 폰의 WiFi 목록에서 `ESP32-LAB` 에 붙고 주소 `192.168.4.1` 을 엽니다(모둠마다 이름을 다르게).

  - **IP 주소는 출력 창에서 읽습니다.** `IP: 192.168.0.5` 처럼 찍힌 숫자 넷을 폰 주소 창에 그대로 넣습니다(`http://` 로, `https` 아님). 연결이 안 되면 출력 창에 IP 가 찍혔는지부터 봅니다.
  - **응답은 반복 한 바퀴에 한 번**만 보냅니다. 응답 블록을 두 번 두면 두 번째는 닫힌 연결에 보내 오류가 납니다. 응답을 `if` 안에만 두면 조건이 거짓일 때 폰이 끝없이 기다립니다(디버깅 1).
  - **버튼 글 `led=on,led=off` 는 약속입니다.** 버튼을 누르면 폰이 `/cmd?led=on` 을 요청하고, 보드는 질의 `led` 의 값을 봅니다. 대소문자가 다르면(`ON`) 비교가 거짓이 됩니다(디버깅 3).
  - WiFi 를 쓰는 동안 ADC2 쪽 핀(0 · 2 · 4 · 12~15 · 25~27)은 아날로그 값을 못 읽습니다. 다음 챕터(S23)에서 센서를 더할 때 아날로그는 **32~39번 핀**을 씁니다(검사가 알려 줍니다).
  - 2번 핀은 많은 ESP32 보드에서 보드에 달린 파란 LED 와도 이어져 있어, 배선이 틀려도 보드의 작은 LED 로 동작을 확인할 수 있습니다.
  - 교과 연결: 정보(요청과 응답, 주소의 구조, 약속(프로토콜)), 과학(전파로 전달되는 신호). 역할극(한 명은 폰, 한 명은 보드 — 주소 쪽지를 건네고 페이지 쪽지로 답하기)이 요청·응답을 몸으로 익히는 데 좋습니다.
title: 폰으로 켜는 LED — 웹서버
subtitle: 선 없이, 앱 설치 없이, 주소 한 줄로
summary: |
  지금까지 LED 는 보드에 꽂힌 버튼으로만 켰어요. 오늘은 **내 폰**으로 켜요. 보드가 WiFi 에 붙어 **작은 웹서버**가 되면, 폰 브라우저에서 보드의 주소를 열어 버튼을 누를 수 있어요.
  폰이 보내는 주소 한 줄(`/cmd?led=on`)을 보드가 읽어 LED 를 켜고, 버튼이 든 페이지로 답하는 **요청 → 응답** 약속을 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결. WiFi 가 들어 있어요 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판 }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: M-F 듀폰선 2가닥, note: "한쪽은 구멍, 한쪽은 핀. 보드의 2번 핀과 GND 핀에 씌우고 핀 끝은 브레드보드에" }
  - { name: 점퍼선(M-M) 1가닥, note: "LED 짧은 다리 줄 → 브레드보드 − 줄" }
  - { name: 스마트폰, note: 보드와 같은 WiFi 에 붙여요. 브라우저만 있으면 돼요 }
  - { name: WiFi 공유기, note: 이름과 비밀번호를 알아야 해요. 안 되면 보드가 공유기가 되는 공유기 모드로 }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "2번 핀이 ANALOG 묶음 맨 아래 줄(io2)에 있어서 브레드보드는 보드 아래에 둬요. io2 의 S 핀 → 3번 줄 → 220Ω 저항 → 7번 줄의 LED 긴 다리(+), 짧은 다리(−)는 8번 줄 → 점퍼선 → − 줄 → 보드 아래 줄 GND. 1장과 같은 회로에서 핀만 2번이에요. 폰은 선 없이 WiFi 로 보드에 요청을 보내요"
  captionDevkit: "D2 가 보드 아래 줄에 있어서 브레드보드는 보드 아래에 둬요. D2 → 6번 줄 → 220Ω 저항 → 10번 줄의 LED 긴 다리(+), 짧은 다리(−)는 11번 줄 → 점퍼선 → − 줄 → 아래 줄 GND. 1장과 같은 회로에서 핀만 2번이에요. 폰은 선 없이 WiFi 로 보드에 요청을 보내요"
principle:
  image: images/request-response.svg
  body: |
    폰 브라우저는 **손님**, 보드의 웹서버는 **가게**예요. 손님은 가게의 **IP 주소**(공유기가 준 숫자 넷)로 주소 한 줄을 보내는데, 이것이 **요청**이에요. 가게는 요청을 받아 일을 하고, 글(페이지)로 답하는데, 이것이 **응답**이에요.

    주소 `http://192.168.0.5/cmd?led=on` 에서 물음표 앞 `/cmd` 가 **경로**(어떤 일), 물음표 뒤 `led=on` 이 **질의**(이름=값)예요. 보드는 반복 한 바퀴마다 요청 하나를 받아 `path` 와 `query` 에 담고, 질의 `led` 가 `on` 이면 LED 를 켠 뒤 버튼 페이지로 한 번 답해요. 폰과 보드가 **같은 WiFi** 에 있어야 주소로 찾아갈 수 있어요.
goals:
  content: 보드를 WiFi 에 연결해 웹서버를 열고, 폰 브라우저의 버튼이 보내는 요청(경로 · 질의)을 읽어 LED 를 켜고 끈다
  thinking: 폰과 보드가 주고받을 약속(주소)을 먼저 정하고, "받기 → 읽기 → 움직이기 → 한 번 답하기" 의 한 바퀴로 통신을 설계한다
successCriteria:
  - 출력 창의 IP 주소를 폰 주소 창에 넣어 보드가 보낸 버튼 페이지를 열 수 있다
  - 주소에서 경로(path)와 질의(query)를 가리키고, 질의 led 의 값으로 LED 를 켜고 끌 수 있다
  - 요청 받기는 반복 안에, 페이지 응답은 반복 끝에 한 번만 두는 까닭을 설명할 수 있다
parts:
  - id: part1
    title: 1부 · 폰에 버튼 페이지 띄우기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 집에 두고 온 전등을 폰으로 끄려면?
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 폰 브라우저의 버튼을 누르면 WiFi 를 건너 보드의 LED 가 켜져요
        body: |
          집을 나왔는데 전등을 켜 두고 온 것 같아요. 요즘은 폰 화면의 버튼 하나로 집의 전등을 끌 수 있어요. 폰과 전등은 선으로 이어져 있지 않은데, 어떻게 폰의 말을 알아들을까요?

          오늘은 보드를 작은 **웹서버**로 만들어 폰으로 LED 를 켜요. 코드를 보기 전에 폰과 보드가 무엇을 주고받아야 할지 내 생각부터 적어 봐요. 정답은 없어요.
        todo:
          - 준비물(LED, 저항, 듀폰선 · 점퍼선)을 책상에 꺼내 놓고, 교실 WiFi 이름을 확인하기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 폰으로 조종하는 물건을 하나 떠올려 함께 쓰기
        questions:
          - 집에 두고 온 전등을 폰으로 끌 수 있는 건 어떤 약속 덕분일까요? 폰과 전등 사이에 무엇이 있을까요?
          - 폰과 보드는 무슨 말을 주고받을까요? 폰이 보내는 말과 보드가 돌려주는 말은 어떻게 다를까요?
          - 교실에 보드가 스무 개 있어요. 내 폰의 요청이 내 보드로만 가려면 무엇이 있어야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "폰으로 LED 켜기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 폰 화면을 보지 못하고, 폰이 보낸 **주소 한 줄**만 읽을 수 있어요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. "켜라는 말을 주소에 어떻게 적을까"도 사람이 정해야 하는 약속이에요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 미리 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 폰과 보드가 미리 맞춰야 하는 약속 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["WiFi 이름과 비밀번호, 보드가 받은 IP 주소", "주소에서 물음표 앞은 경로, 뒤는 질의(이름=값)", "폰과 보드가 같은 WiFi 에 있어야 한다"]
          decide: ["켜기는 /cmd?led=on, 끄기는 /cmd?led=off 로 약속", "페이지 제목과 버튼 글(led=on,led=off)", "웹서버 포트 번호(80)"]
          act: ["요청이 올 때까지 기다렸다가 받기", "질의 led 가 on 이면 LED 켜고 off 면 끄기", "버튼이 든 페이지로 한 번 답하고, 다시 기다리기"]

      - id: predict
        type: predict
        title: 예측하기 — 버튼을 누르면 켜질까?
        minutes: 5
        scene:
          image: images/url-anatomy.svg
          caption: "주소 한 줄의 네 조각: 약속 이름 · IP 주소 · 경로(/cmd) · 질의(led=on)"
        body: |
          아직 실행하지 않아요. 둘째 줄 `from blocklab_net import *` 는 WiFi 와 웹서버 함수(`wifi_connect` · `web_start` · `web_accept` · `web_send` · `web_page`)가 든 **blocklab_net 라이브러리**를 가져오는 한 줄이에요. 보드에 저장하면 그 파일이 자동으로 같이 올라가요. 읽을 곳은 `ip = ...` 부터예요.

          `web_accept(server)` 는 폰이 올 때까지 기다렸다가 경로를 `path`, 질의를 `query` 에 담아요. 그 아래 줄은 제목 "LED" 와 버튼 두 개가 든 페이지로 답해요. 그림을 보며 빈칸에 내 예측을 적어요.
        todo:
          - "`ip = wifi_connect(...)` 부터 아래로 한 줄씩 읽기"
          - 그림에서 경로와 질의가 주소의 어느 조각인지 손가락으로 짚기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_web_page.py
        blanks:
          - q: 실행하면 출력 창에 가장 먼저 무엇이 찍힐까요? 그 값은 어디에 쓸까요?
          - q: 폰 브라우저에 그 주소를 넣고 열면 화면에 무엇이 보일까요?
          - q: 폰에서 led=on 버튼을 누르면 LED 가 켜질까요? 코드에서 LED 를 켜는 줄을 찾아 보고 답해요.

      - id: run
        type: run
        title: 복사 · 실행 — 폰에 버튼 페이지 띄우기
        minutes: 10
        scene:
          image: images/phone-page.svg
          caption: 출력 창에 찍힌 IP 를 폰 주소 창에 넣으면 제목 LED 와 버튼 두 개가 보여요
        body: |
          먼저 **브레드보드**에 LED 를 꽂아요. 2번 핀 → 220Ω 저항 → 긴 다리(+), 짧은 다리(−) → − 줄 → GND. 자리는 **부품과 배선**의 그림과 아래 표처럼 해요. 그다음 코드의 `"MyWiFi"` 와 `"12345678"` 을 교실 WiFi 이름과 비밀번호로 바꿔요.

          실행하면 보드가 WiFi 에 붙을 때까지 잠시 기다렸다가 출력 창에 `IP: 192.168.0.5` 처럼 주소를 찍어요. 폰을 **같은 WiFi** 에 붙이고 브라우저 주소 창에 그 숫자를 넣어 열어 보세요.
        todo:
          - USB 를 뺀 채 그림대로 LED · 저항 · 선 꽂기
          - WiFi 이름과 비밀번호를 고치고 **보드 연결** → **실행** 누르기
          - 출력 창의 IP 를 폰 주소 창에 넣어 열고, 버튼을 눌러 보며 예측과 비교하기
        code: step1_web_page.py
        expected: 코드를 실행하면 출력 창에 `IP:` 와 숫자 넷이 찍혀요. 폰 브라우저에 그 주소를 넣으면 제목 **LED** 와 버튼 `led=on` · `led=off` 가 보이고, 버튼을 누르면 주소 창이 `/cmd?led=on` 으로 바뀌며 같은 페이지가 다시 떠요. LED 는 아직 켜지지 않아요.
        codeNotes:
          - { line: 2, note: "WiFi 와 웹서버 함수(`wifi_connect` · `web_start` · `web_accept` · `web_send` · `web_page`)가 든 blocklab_net 라이브러리를 가져와요. 보드에 저장하면 자동으로 같이 올라가요" }
          - { line: 4, note: "2번 핀은 LED 를 켜고 끄는 출력 핀이에요. 1장과 같은 준비 줄" }
          - { line: 6, note: "WiFi 에 연결하고 받은 IP 주소를 `ip` 에 담아요. 이름과 비밀번호를 교실 것으로. 공유기에 붙을 때까지 기다리는 일은 라이브러리 함수가 해요" }
          - { line: 7, note: "80번 포트로 웹서버를 열어요. 폰 브라우저는 포트를 안 적으면 80번으로 와요" }
          - { line: 9, note: "IP 주소를 출력 창에 찍어요. 이 숫자를 폰 주소 창에 넣어요" }
          - { line: 11, note: "폰이 요청을 보낼 때까지 기다렸다가 받아요. 손님이 보낸 주소 한 줄을 물음표 앞(`path`)과 뒤(`query`)로 나눠 줘요. 반복 안에 있어야 다음 손님도 받아요" }
          - { line: 12, note: "제목 LED, 버튼 두 개, 값 없음, 새로고침 0 인 페이지로 답하고 연결을 닫아요. 버튼을 누르면 `/cmd?버튼글` 로 가요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 요청 받기
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요. ip = 로 시작하는 줄부터 보면 돼요
        body: |
          `ip = ...` 부터 읽어요. `wifi_connect` 같은 함수는 라이브러리 안에 들어 있어서 몸통은 여기서 안 봐도 돼요. 보드는 **기다리기 → 받기 → 답하기**를 한 바퀴로 되풀이해요.

          손가락으로 한 줄씩 짚으며 따라가 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - 폰이 아직 안 왔을 때 보드가 멈춰 기다리는 줄 찾기
          - 주소 `/cmd?led=on` 에서 `path` 와 `query` 에 담기는 조각 나누기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_web_page.py
        questions:
          - { kind: choice, q: "주소 /cmd?led=on 에서 led=on 은 무엇인가요?", options: ["경로(path)", "질의(query)", "IP 주소"], answer: 1, hint: "물음표 앞인가요, 뒤인가요?" }
          - { kind: line, q: "폰이 올 때까지 기다렸다가 요청을 받는 줄의 줄 번호를 클릭하세요", answer: 11 }
          - { kind: line, q: "IP 주소를 출력 창에 찍는 줄의 줄 번호를 클릭하세요", answer: 9, hint: "폰 주소 창에 넣을 숫자가 어디서 나오나요?" }
        codeNotes:
          - { line: 6, note: "WiFi 에 붙고 IP 주소를 `ip` 에 담아요" }
          - { line: 10, note: "`while True:` 아래 들여 쓴 줄들이 한 바퀴예요" }
          - { line: 11, note: "요청 하나를 받아 `conn`(연결) · `path` · `query` 에 담아요" }
