<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="wlc-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="wlc-title">폰으로 켜는 LED 표지: 폰 브라우저의 켜기·끄기 버튼을 누르면 WiFi 공유기를 거쳐 ESP32 웹서버에 요청이 가고, 보드가 LED 를 켠 뒤 페이지로 답한다</title>
  <defs><marker id="wlc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <rect x="62" y="56" width="124" height="236" rx="16" fill="var(--card)" stroke-width="2.5"/>
