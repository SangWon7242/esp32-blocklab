<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="wlr-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="wlr-title">요청과 응답: 손님(폰)이 같은 WiFi 의 공유기를 거쳐 가게(ESP32 웹서버)의 IP 주소로 요청을 보내면, 보드가 요청 받기로 경로와 질의를 읽고 LED 를 움직인 뒤 페이지로 응답한다</title>
  <defs><marker id="wlr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <rect x="40" y="86" width="150" height="120" rx="12" fill="var(--card)" stroke-width="2"/>
  <rect x="62" y="100" width="36" height="62" rx="6" fill="var(--muted)" stroke-width="1.5"/>
  <rect x="68" y="108" width="24" height="40" rx="2" fill="var(--card)" stroke="none"/>
  <text x="140" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">폰</text>
  <text x="140" y="146" text-anchor="middle" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">손님</text>
  <text x="115" y="190" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">같은 WiFi 에 붙어 있어요</text>
  <rect x="262" y="118" width="116" height="56" rx="10" fill="var(--card)" stroke-width="2"/>
  <path d="M284 118 V96 M356 118 V96" stroke-width="2.5"/>
  <circle cx="292" cy="146" r="4" fill="#0f7c8c" stroke="none"/>
  <circle cx="308" cy="146" r="4" fill="#0f7c8c" stroke="none"/>
  <text x="320" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">WiFi 공유기</text>
  <text x="320" y="214" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">둘에게 각각 IP 주소를 줘요</text>
  <rect x="450" y="86" width="150" height="120" rx="12" fill="var(--card)" stroke-width="2"/>
  <rect x="470" y="104" width="70" height="52" rx="4" fill="var(--muted)"/>
  <text x="505" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">ESP32</text>
  <text x="570" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">가게</text>
  <text x="570" y="146" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">웹서버</text>
  <rect x="462" y="166" width="126" height="22" rx="11" fill="#0f7c8c" stroke="none"/>
  <text x="525" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" stroke="none">IP 192.168.0.5</text>
  <path d="M192 112 H258" stroke-width="2.5" marker-end="url(#wlr-arrow)"/>
  <path d="M382 112 H446" stroke-width="2.5" marker-end="url(#wlr-arrow)"/>
  <text x="320" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">요청: 주소 한 줄을 보내요</text>
  <rect x="190" y="70" width="260" height="24" rx="12" fill="var(--muted)" stroke-width="1.5"/>
  <text x="320" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">http://192.168.0.5/cmd?led=on</text>
  <path d="M446 232 H382" stroke="#0f7c8c" stroke-width="2.5" marker-end="url(#wlr-arrow)"/>
  <path d="M258 232 H192" stroke="#0f7c8c" stroke-width="2.5" marker-end="url(#wlr-arrow)"/>
  <rect x="262" y="218" width="116" height="28" rx="14" fill="var(--muted)" stroke-width="1.5"/>
  <text x="320" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">응답: 페이지(HTML)</text>
  <text x="320" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">보드가 하는 일 (반복 한 바퀴)</text>
  <g font-size="13" fill="currentColor" stroke="none" text-anchor="middle">
  <rect x="44" y="292" width="130" height="40" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
  <text x="109" y="310" font-weight="700">1 요청 받기</text>
  <text x="109" y="326" font-size="11.5" fill-opacity="0.75">손님이 올 때까지 기다려요</text>
  <rect x="192" y="292" width="130" height="40" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
  <text x="257" y="310" font-weight="700">2 경로·질의 읽기</text>
  <text x="257" y="326" font-size="11.5" fill-opacity="0.75">/cmd 와 led=on</text>
  <rect x="340" y="292" width="130" height="40" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
  <text x="405" y="310" font-weight="700">3 LED 움직이기</text>
  <text x="405" y="326" font-size="11.5" fill-opacity="0.75">on 이면 켜고 off 면 꺼요</text>
  <rect x="488" y="292" width="112" height="40" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
  <text x="544" y="310" font-weight="700">4 응답하기</text>
  <text x="544" y="326" font-size="11.5" fill-opacity="0.75">페이지 한 번, 닫기</text>
  </g>
  <path d="M176 312 H188 M324 312 H336 M472 312 H484" stroke-width="2" marker-end="url(#wlr-arrow)"/>
</svg>
