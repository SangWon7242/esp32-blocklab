          - { line: 12, note: "5장의 색 도우미. 세 숫자(0~255)로 RGB 를 켜요" }
          - { line: 18, note: "WiFi 에 연결하고 받은 IP 주소를 `ip` 에 담아요. 이름과 비밀번호를 교실 것으로" }
