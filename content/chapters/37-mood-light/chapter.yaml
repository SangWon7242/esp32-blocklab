      - id: mission
        type: mission
        title: 미션 — 모드 버튼으로 끄기 → 손잡이 → 내 색
        minutes: 10
        scene:
          image: images/mode-cycle.svg
          caption: 버튼 한 번에 다음 모드로. 모드 0 끄기 · 1 손잡이 색 · 2 내가 고른 색. 3 이 되면 다시 0
        body: |
          활동 칸에는 **1부 코드**가 깔려 있어요. 여기에 **모드 버튼**(14번)을 더해요. 변수 `mode` 를 0 으로 시작하고, 버튼을 누를 때마다 1 씩 키워요. 2 다음은 다시 0 이어야 하니 3 이 되면 0 으로 되돌려요.

          모드 0 이면 세 숫자를 모두 0 으로 꺼요. 모드 1 이면 1부처럼 손잡이 값으로 색을 골라요(이 사다리를 `knob_color` 라는 **함수**로 묶으면 깔끔해요). 모드 2 는 내가 고른 **감정 색** 하나를 세 숫자로 켜요. 버튼을 한 번 눌렀는데 모드가 두 번 바뀌면, 누른 뒤 잠깐 기다리는 줄이 있는지 봐요. 판정 목록을 하나씩 채워 가요.
        todo:
          - 버튼 준비(14번, 이름 `button`)와 `mode = 0` 을 반복 밖에 두기
          - 누르면 `mode` 1 키우고 3 이면 0 으로, 잠깐 기다리기 · 모드 0 끄기 · 1 손잡이 색 · 2 내 색
          - 실행해 버튼을 네 번 눌러 보며 확인한 뒤 **판정** 누르기
        instructions: "1부 코드에서 시작해 모드 버튼(14번, 이름 button)을 더하세요. (1) mode 는 0 으로 시작 (2) 버튼을 누르면 mode 를 1 키우고, 3 이 되면 0 으로 되돌리기, 그 뒤 0.3초쯤 기다리기 (3) mode 0 이면 set_color(0, 0, 0) 으로 끄기 (4) mode 1 이면 손잡이 값으로 다섯 색 고르기 (5) mode 2 이면 내가 고른 색 하나를 세 숫자로 켜기 (0, 0, 0 은 안 돼요)"
        hint: "버튼 준비 블록(14번, button). 손잡이 색 사다리는 함수 블록 knob_color 로 묶어요. 반복 안: 만약 button.value() == 0 → mode 를 1 만큼 바꾸기 → 만약 mode == 3 → mode 를 0 으로 → 0.3초 기다리기. 그 아래 만약 mode == 0 → RGB 끄기 / 아니면 만약 mode == 1 → knob_color() / 아니면 → RGB 색 정하기(내 색). 끝에 50 ms 기다리기"
        code: step1_knob_colors.py
        rules:
          - pinIs: { name: button, pin: 14 }
            fail: 모드 버튼은 몇 번 핀에 이었나요? 버튼 준비에 이름 button 과 핀 14 가 있나요?
          - codeMatches: 'if button\.value\(\) == 0:\n\s+mode (= mode \+ 1|\+= 1)$'
            fail: 버튼을 누르면(값 0) 모드가 1 커지나요? 누름을 묻는 조건 바로 아래에 모드를 키우는 줄이 있나요?
          - codeMatches: '(if mode (== 3|> 2|>= 3):\n\s+mode = 0|mode = \(mode \+ 1\) % 3|mode % 3)'
            fail: 모드가 2 다음에는 어디로 가야 할까요? 3 이 되면 되돌리는 줄이 있나요? 없으면 모드는 4, 5 로 계속 커져요
          - codeMatches: 'if button\.value\(\) == 0:\n(?:\s+\S[^\n]*\n)*?\s+time\.sleep\(0?\.\d+\)'
            fail: 버튼을 한 번 눌렀는데 모드가 두세 번 바뀌지 않나요? 누른 뒤 잠깐(0.3초쯤) 기다리는 줄이 조건 안에 있나요?
          - codeMatches: 'if mode == 0:\n\s+set_color\(0, 0, 0\)'
            fail: 모드 0 에서 LED 가 꺼지나요? 세 숫자가 모두 0 이어야 꺼져요
          - codeMatches: 'mode == 1:\n\s+(knob_color\(\)|\w+ = knob\.read\(\))'
            fail: 모드 1 에서 손잡이 값을 읽어 색을 고르나요? 손잡이 사다리를 함수로 묶어 부르거나, 손잡이 값을 읽는 줄이 그 안에 있나요?
          - codeMatches: 'mode == 1:[\s\S]*?\n    (else|elif mode == 2):\n        set_color\((?!0, 0, 0\))\d+, \d+, \d+\)'
            fail: 모드 2 에서 내가 고른 감정 색이 켜지나요? 세 숫자가 모두 0 이면 꺼진 것과 같아요
        answerCode: mission_mode.py

  - id: part2
    title: 2부 · 폰으로 색 고르고 앱 만들기
    steps:
      - id: run2
        type: run
        title: 실행 2 — 폰 버튼으로 색 바꾸기
        minutes: 7
        scene:
