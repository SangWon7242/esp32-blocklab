      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 구간 사다리
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요. 위에서부터 차례로 묻는 사다리를 따라가요
