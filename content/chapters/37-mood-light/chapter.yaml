      - id: app
        type: app
        title: 폰 앱 만들기 — AI 와 함께 색 고르기 앱
        minutes: 20
        scene:
          image: images/web-flow.svg
          caption: 화면 설계 → 약속표 → 프롬프트 → AI 결과 붙여넣기 · 검사 → 보드에 저장 → 읽기 체크
        body: |
          25장 페이지는 버튼 글이 `c=red` 처럼 보여 친구에게 주기엔 멋이 없어요. 이제 **내 폰 앱**을 만들어요. 먼저 화면에 **보여 줄 값** · **누를 버튼** · **바뀌는 모습**을 설계 칸에 적어요. 약속표에는 설계 코드가 내는 주소가 있어요: 읽기 `/data`(mode, c), 명령 `/cmd?c=red` 처럼 색 이름 하나.

          프롬프트를 복사해 AI 에 넣고, 돌아온 HTML 을 그대로 붙여 **검사**를 눌러요. 외부 스크립트 · 절대 주소가 섞이면 검사가 알려 주니 AI 에게 "외부 라이브러리 없이, 상대 주소로" 라고 다시 부탁해요. 통과하면 설계 코드를 보드에서 실행한 채 `index.html` 로 저장하고, 폰에서 보드 주소 `/` 를 다시 열어요.

          미술 시간의 색과 감정 표를 떠올려 봐요. 버튼 글을 "빨강" 대신 "힘내" · "차분" 처럼 감정으로 적고, 고른 색이 폰 배경에도 그대로 번지게 부탁할 수 있어요.
        todo:
          - 설계 칸 세 개에 한 줄씩 적고 프롬프트 복사하기
          - AI 가 준 HTML 을 붙여 넣고 **검사** 통과시키기 (걸리면 AI 에게 고쳐 달라고 하기)
          - 보드에 저장한 뒤 폰에서 열어 보고, 읽기 체크에 답하기
        api:
          - { path: "/data", method: "읽기", fields: ["mode", "c"], note: "2초마다 읽기. mode 는 0(끄기) · 1(손잡이) · 2(고른 색) 숫자, c 는 off · knob · red · green · blue 가운데 하나(글)" }
          - { path: "/cmd?c=red", method: "명령", note: "빨강 켜기" }
          - { path: "/cmd?c=green", method: "명령", note: "초록 켜기" }
          - { path: "/cmd?c=blue", method: "명령", note: "파랑 켜기" }
          - { path: "/cmd?c=knob", method: "명령", note: "손잡이 색 모드로" }
          - { path: "/cmd?c=off", method: "명령", note: "끄기" }
        design:
          show: ["지금 색", "모드"]
          buttons: ["빨강", "초록", "파랑", "끄기"]
          changes: ["고른 색으로 배경 바꾸기", "모드 0 이면 어둡게"]
        promptTemplate: |
          ESP32 주소 {{ip}} 에서 {{data}} 를 2초마다 읽어 {{show}} 을(를) 폰 화면에 크게 보여 주고,
          버튼 {{buttons}} 을(를) 누르면 {{commands}} 를 요청하는 한 파일짜리 HTML 을 만들어 줘.
          {{changes}} 처럼 c 값에 따라 화면 배경색을 바꿔 줘. 버튼은 손가락으로 누르기 좋게 크게.
          외부 라이브러리 · 외부 스크립트 · 절대 주소 없이, 폰 화면에 맞게.
        checks:
          maxBytes: 12000
          mustUse: ["c=red", "c=off"]
        readcheck:
          - { kind: choice, q: "/data 에서 값을 가져오는 줄에 쓰인 것은?", options: ["fetch", "print", "import"], answer: 0, hint: "주소에 요청을 보내 답을 받는 자바스크립트 함수" }
          - { kind: choice, q: "끄기 버튼을 누르면 어느 주소로 요청을 보내야 하나요?", options: ["/cmd?c=off", "/data", "/index.html"], answer: 0, hint: "약속표의 명령 주소" }
          - { kind: text, q: "c 가 blue 일 때 배경색을 바꾸는 줄을 찾아 적어 보세요. AI 결과에 틀린 곳이 있었다면 어떻게 찾았나요?" }

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 5
        scene:
          image: images/colour-mixing.svg
          caption: 빨강과 노랑 사이의 주황은 세 숫자로 얼마일까요? 두 색에서 다른 숫자는 하나뿐이에요
        body: |
          오늘은 손잡이 · 버튼 · 폰 세 입력을 **모드**라는 숫자 하나로 정리해 RGB LED 하나를 다루었고, AI 와 함께 폰 앱까지 만들었어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 모드 순환 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요. 미술 시간에는 다섯 감정과 다섯 색을 짝지은 팔레트를 그리고 그 색을 세 숫자로 적어 보자. 수학 시간에는 `#ff8800` 같은 16진수 색 다섯 개를 10진수 세 숫자로 바꾸는 표를 만들어 보자.
