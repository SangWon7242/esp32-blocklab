          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 모드가 0 → 1 → 2 → 0 으로 도는 까닭을 설명하기
        lineExplain: reflect_mode.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 손잡이 · 버튼 · 폰이 한 LED 를 두고 다투지 않게 모드를 둔 까닭은 무엇일까요? 모드가 없으면 어떤 일이 생길까요?
          - AI 가 만든 앱에서 틀린 곳이나 약속과 다른 곳을 어떻게 찾았나요? 검사가 걸러 준 것과 내가 직접 찾은 것을 나눠 적어요
          - "다음엔 여기부터 본다: 한 줄로"
