          - 주소 창에 직접 `/cmd?c=green` 을 적어 열어도 바뀌는지 해 보기
        code: step2_web_color.py
        expected: 폰 브라우저에 보드 주소를 넣으면 제목 **Mood Light** 와 버튼 `c=red` · `c=green` · `c=blue` · `c=off` 네 개가 보여요. 버튼을 누르면 주소가 `/cmd?c=red` 처럼 바뀌며 종이컵이 그 색으로 켜지고, 페이지 아래에 지금 보낸 글(`red`)이 보여요. `c=off` 를 누르면 꺼져요.
        codeNotes:
