      - id: design
        type: design
        title: 설계 — 켠 뒤 10분이 지나면 저절로 꺼지는 무드등
        minutes: 6
        scene:
          image: images/cover.svg
          caption: "손잡이 · 버튼 대신 폰이 모드를 바꿔요: c=off 끄기, c=knob 손잡이 색, 그 밖의 c 는 그 색. 켠 뒤 10분이 지나면 모드 0"
        body: |
          친구가 잠든 뒤에도 무드등이 밤새 켜져 있으면 전기가 아깝죠. 켠 뒤 **10분**이 지나면 저절로 꺼지는 **수면 타이머**를 더해요. 켠 시각을 `start` 에 담아 두고, 바퀴마다 `start` 부터 지난 시간(ms)이 600000 을 넘으면 모드를 0 으로 돌려요.

          이번 코드는 폰이 모드까지 바꿔요. 질의 `c` 가 `off` 면 모드 0, `knob` 이면 모드 1(손잡이 색), 다른 글이면 모드 2 와 그 색이에요. 경로 `/data` 에는 지금 모드와 색을 JSON 으로, `/cmd` 에는 글 `OK` 로, 그 밖(`/`)에는 다음 단계에서 만들 `index.html` 파일로 답해요. 설계도의 빈칸을 채우고, 섞인 블록을 설계도 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "start 부터 지난 시간" 이 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: RGB(27 · 25 · 26), 가변저항 __번, WiFi 연결, 웹서버(80)를 준비한다
            blank: { answer: 39 }
          - text: "함수 knob_color: 손잡이 값을 다섯 구간으로 나눠 색을 켠다"
          - text: "함수 web_color(name): red · green · blue 글에 맞는 색을 켠다"
          - text: 모드를 __ 으로, 색 이름을 off 로 정한다
            blank: { answer: 0 }
          - text: 켠 시각 start 에 지금 시각을 담고, IP 주소를 찍는다
          - text: 계속 반복한다
          - text: "  ↳ 요청을 받고 질의 c 의 값을 꺼낸다"
          - text: "  ↳ c 가 off 면 모드 0, knob 이면 모드 __ 과 start 다시 담기, 다른 글이면 모드 2 와 그 색"
            blank: { answer: 1 }
          - text: "  ↳ start 부터 지난 시간이 __ 분(600000 ms)을 넘으면 모드 0, 색 off"
            blank: { answer: 10 }
          - text: "  ↳ 모드 0 이면 끄기, 1 이면 knob_color, 아니면 web_color(색)"
          - text: "  ↳ 경로가 /data 면 mode 와 c 를 JSON 으로, /cmd 면 OK 로, 아니면 __ 파일로 답한다"
            blank: { answer: index.html }
        translation:
          - ["지금 시각을 담는다", "start = time.ticks_ms()"]
          - ["start 부터 지난 시간(ms)", "time.ticks_diff(time.ticks_ms(), start)"]
          - ["10분", "600000"]
          - ["질의 c 의 값", 'query.get("c", "")']
          - ["경로가 /data 인가", 'path == "/data"']
          - ["글 OK 로 답한다", 'web_send(conn, "OK")']
          - ["파일로 답한다", 'web_send_file(conn, "index.html")']
