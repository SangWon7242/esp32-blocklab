          - { line: 24, note: "질의 `c` 의 값을 꺼내 `c` 에 담아요. 주소에 `c` 가 없으면 빈 글" }
          - { line: 25, note: "`c` 가 `red` 와 같으면 빨강. 버튼 글과 글자가 똑같아야 해요" }
