          - { line: 15, note: "`set_color(r, g, b)`: 0~255 세 숫자를 PWM 세기 0~1023 으로 바꿔 세 핀에 보내는 도우미" }
          - { line: 22, note: "손잡이 값을 읽어 `value` 에 담아요. 0~4095" }
          - { line: 23, note: "800 보다 작으면 빨강. 0~799 구간이에요" }
          - { line: 25, note: "`elif`: 앞 조건이 거짓일 때만 물어요. 800~1599 초록" }
          - { line: 31, note: "`else`: 위의 네 조건이 모두 거짓이면(3200 이상) 흰색" }
