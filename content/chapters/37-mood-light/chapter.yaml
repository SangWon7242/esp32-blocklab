          caption: 폰이 /cmd?c=blue 를 보내면 보드는 질의 c 의 값 blue 를 읽어 파랑을 켜고 페이지로 답해요
        body: |
          이번엔 25장의 **웹서버**를 붙여요. 둘째 줄 `from blocklab_net import *` 가 WiFi 와 웹서버 함수(`wifi_connect` · `web_start` · `web_accept` · `web_send` · `web_page`)가 든 **blocklab_net 라이브러리**를 가져와요. 보드에 저장하면 자동으로 같이 올라가요. 읽을 곳은 `ip = ...` 부터예요. `"MyWiFi"` 와 `"12345678"` 을 교실 WiFi 로 고쳐요.

          페이지의 버튼 글 `c=red,c=green,c=blue,c=off` 가 **약속**이에요. 빨강 버튼을 누르면 폰이 `/cmd?c=red` 를 보내고, 보드는 질의 `c` 의 값 `red` 를 읽어 `set_color(255, 0, 0)` 을 켜요. 폰 앱에서는 이 색을 `#ff0000` 이라고 적는데, `ff` 가 16진수 255 예요.
        todo:
          - WiFi 이름과 비밀번호를 고치고 **실행**, 출력 창의 IP 를 폰 주소 창에 넣기
