          바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 모드가 커지기만 하면 되돌리기를, 색이 한쪽에 몰리면 경계 숫자를, 폰 버튼이 안 먹으면 비교하는 글자를 봐요. 셋째 코드의 `set_color` 함수는 그대로 두고 맨 아래만 고치면 돼요.
