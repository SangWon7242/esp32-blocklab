      - id: run
        type: run
        title: 복사 · 실행 — 손잡이로 다섯 색 고르기
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "RGB LED 는 5장과 같은 핀(io27 · io25 · io26), 가변저항 가운데 다리는 아래 줄 io39, 버튼은 io14. 오늘은 버튼까지 함께 꽂아 두어요"
          captionDevkit: "RGB LED 는 5장과 같은 핀(D27 · D25 · D26), 가변저항 가운데 다리는 VN(39), 버튼은 D14. 오늘은 버튼까지 함께 꽂아 두어요"
        body: |
