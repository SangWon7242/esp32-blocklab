          실행한 뒤 종이컵을 씌우고 손잡이를 천천히 끝에서 끝까지 돌려 보세요. 색이 몇 번 바뀌나요? 바뀌는 순간 손잡이를 아주 조금만 움직이면 어떻게 되나요?
        todo:
          - "**부품과 배선**대로 RGB LED · 저항 3 · 가변저항 · 버튼 꽂기"
          - "**보드 연결** → **실행**, 종이컵을 씌우고 손잡이를 끝에서 끝까지 돌리기"
          - 색이 바뀌는 순간의 손잡이 위치를 공책에 표시하기
        code: step1_knob_colors.py
        expected: 코드를 실행하고 손잡이를 한쪽 끝에서 다른 끝으로 천천히 돌리면 **빨강 → 초록 → 파랑 → 보라 → 흰색** 순서로 다섯 색이 차례로 바뀌어요. 경계에서는 손잡이가 조금만 떨려도 두 색이 번갈아 보여요.
        codeNotes:
