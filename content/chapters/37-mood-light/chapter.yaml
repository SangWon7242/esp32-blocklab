wiring:
  image: images/wiring-breadboard.svg
  caption: "RGB LED 다리를 d 칸 19 · 21 · 23 · 25번 줄에(빨강 · 가장 긴 다리 − · 초록 · 파랑). 세 색 줄마다 220Ω 저항이 가운데 홈을 건너고 io27 → 19번 줄, io25 → 23번 줄, io26 → 25번 줄, 21번 줄 → 위 − 줄. 버튼은 가운데 홈에 걸쳐 15 · 17번 줄: io14 → 17번 줄, 대각선 다리 15번 줄 → 위 − 줄. 위쪽 GND → 아래 − 줄, 두 − 줄은 점퍼로. 가변저항은 f 칸 2 · 3 · 4번 줄: 가운데 3번 줄 ← 아래 줄 io39, 4번 줄 ← 아래 줄 3V3 (두 선은 보드 바깥으로 돌아), 2번 줄 → 아래 − 줄"
  captionDevkit: "RGB LED 다리를 d 칸 9 · 11 · 13 · 15번 줄에(빨강 · 가장 긴 다리 − · 초록 · 파랑). 세 색 줄마다 220Ω 저항이 가운데 홈을 건너고 D27 → 9번 줄, D25 → 13번 줄, D26 → 15번 줄, 11번 줄 → 위 − 줄. 버튼은 가운데 홈에 걸쳐 6 · 8번 줄: D14 → 8번 줄, 대각선 다리 6번 줄 → 위 − 줄. GND → 아래 − 줄, 3V3 → 보드 바깥으로 돌아 아래 + 줄, 두 − 줄은 점퍼로. 가변저항은 f 칸 17 · 18 · 19번 줄: 가운데 18번 줄 ← VN(39), 17번 줄 → + 줄, 19번 줄 → − 줄"
principle:
  image: images/colour-mixing.svg
  body: |
    **빛의 삼원색(과학)** 빨강 · 초록 · 파랑 빛을 겹치면 **더 밝은 새 색**이 돼요. 물감과 달리 빛은 더할수록 밝아져서 **가산 혼합**이라고 해요. 빨강 + 초록 = 노랑, 초록 + 파랑 = 하늘, 빨강 + 파랑 = 보라, 셋 다 가득이면 흰색이에요. RGB LED 안의 작은 LED 세 개가 종이컵 안에서 섞여 한 색으로 보여요.

    **색을 숫자로(수학)** 코드는 색을 `set_color(빨강, 초록, 파랑)` 세 숫자(0~255)로 적어요. 폰 앱은 같은 색을 `#ff8800` 처럼 **16진수** 두 자리씩 적어요. `ff` 는 15 × 16 + 15 = 255, `88` 은 8 × 16 + 8 = 136 이에요. 손잡이 값 0~4095 를 **다섯 구간**으로 나누는 것도 수학이에요. 원래 표(0~1023)의 경계 200 · 400 · 600 · 800 에 4 를 곱하면 우리 보드의 경계 800 · 1600 · 2400 · 3200 이 돼요.

    **잠과 빛** 잠들기 전의 **파란빛**은 몸에게 "아직 낮이야" 라고 말해 잠을 쫓고, **붉고 어두운 빛**은 잠을 도와요. 그래서 수면 무드등은 색을 고를 수 있어야 하고, 켠 뒤 저절로 꺼지는 **타이머**가 있으면 에너지도 아껴요(SDG 11).
goals:
  content: 가변저항 값을 다섯 구간으로 나눠 RGB 색을 고르고, 버튼으로 모드(0 끄기 · 1 손잡이 · 2 고른 색)를 순환시키고, 웹 요청의 질의 값으로 색을 바꾸는 무드등을 만든다
  thinking: 하나의 장치를 입력(손잡이 · 버튼 · 폰) · 상태(모드) · 출력(RGB)으로 나눠 설계하고, 숫자 범위(0~1023 → 0~4095, 10진수 ↔ 16진수)가 바뀌어도 규칙을 옮길 수 있다
successCriteria:
  - 빨강 255 와 초록 255 를 섞으면 어떤 색이 되는지 말하고, 색 하나를 세 숫자로 적을 수 있다
  - 손잡이 값 0~4095 를 다섯 구간으로 나누는 경계를 계산하고 if · elif 사다리로 적을 수 있다
  - 버튼을 누를 때마다 모드가 0 → 1 → 2 → 0 으로 돌아가는 코드를 짜고, 되돌리기가 빠지면 어떤 일이 생기는지 설명할 수 있다
  - 폰이 보내는 질의 c 의 값으로 색을 바꾸고, 약속표의 주소를 AI 프롬프트에 그대로 쓸 수 있다
parts:
  - id: part1
    title: 1부 · 손잡이와 버튼으로 색 고르기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 잠들기 힘든 친구에게 어떤 빛을 선물할까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 종이컵 안에서 빛이 섞여요. 손잡이로, 버튼으로, 폰으로 색을 고르고 10분 뒤엔 저절로 꺼지는 무드등
        body: |
          밤에 잠이 잘 안 온다는 친구가 있어요. 방 불을 다 켜면 눈부시고, 다 끄면 무서워요. 은은한 **무드등** 하나면 어떨까요? 조명 하나만 바꿔도 방 분위기가 달라지고, 잠들기 전 어떤 색의 빛을 보느냐가 잠에도 영향을 준다고 해요.

          필요한 만큼만 켜고 잠들면 저절로 꺼지는 조명은 전기도 아껴요. 이건 유엔 지속가능발전목표 **SDG 11**(지속가능한 도시와 공동체)과도 이어져요. 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없어요.
        todo:
          - 준비물(RGB LED, 저항 3개, 가변저항, 버튼, 종이컵, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 잠들기 전에 보고 싶은 색을 하나 고르고 그 까닭도 적기
        questions:
          - 빨강 빛 255 와 초록 빛 255 를 한 곳에 겹치면 무슨 색으로 보일까요? 물감을 섞을 때와 같을까요?
          - 손잡이를 돌려 다섯 색 가운데 하나를 고르게 하려면, 손잡이 값(0~4095)을 어떻게 나누면 좋을까요?
          - 폰 화면에서 "파랑" 버튼을 누르면 그 색이 그대로 보드에 나오게 하려면, 폰과 보드는 무엇을 약속해야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          무드등은 입력이 셋이에요. **손잡이**(가변저항)는 0~4095 값을, **버튼**은 눌림을, **폰 앱**은 질의 `c` 의 글을 보내요. 출력은 **RGB LED** 하나예요. 셋이 한 LED 를 두고 다투지 않게 "지금 누구 말을 들을지" 를 정하는 숫자가 **모드**예요.

          세 칸에 각각 한 가지 이상 적어 보세요. 다섯 색을 어떤 구간에 둘지, 모드 숫자에 무엇을 짝지을지는 사람이 정하는 약속이에요. 미술 시간에 만든 색과 감정 표가 있다면 그 다섯 색을 구간에 배치해 보자. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 읽어야 하는 값 세 가지 적기"
          - "**정해야 할 것**: 색 구간 · 모드 숫자 · 폰과의 약속 적기"
          - "**해야 할 것**: RGB LED 가 실제로 하는 일 적기"
        answer:
          know: ["손잡이 값 0~4095", "버튼이 눌렸는지(누르면 0)", "폰이 보낸 질의 c 의 글(red · green · blue · off)", "지금 모드가 몇인지"]
          decide: ["다섯 색 구간: 0~799 빨강, 800~1599 초록, 1600~2399 파랑, 2400~3199 보라, 3200~4095 흰색", "모드 0 끄기 · 1 손잡이 색 · 2 고른 색, 버튼마다 0 → 1 → 2 → 0", "폰 버튼 글은 c=red, c=green, c=blue, c=off", "켠 뒤 몇 분 지나면 저절로 끌지(예: 10분)"]
          act: ["세 숫자(빨강 · 초록 · 파랑 0~255)로 RGB LED 색 켜기", "모드 0 이면 세 숫자 모두 0 으로 끄기", "모드 1 이면 손잡이 값을 읽어 구간에 맞는 색 켜기", "질의 c 를 읽어 그 색 켜고 페이지로 답하기"]

      - id: predict
        type: predict
