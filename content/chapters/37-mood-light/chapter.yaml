# 교과 융합 F10 · 감성 스마트 무드등 — 원본: 아두이노 심화 W07 스마트 컬러 무드등, 마이크로비트 심화 W05 무드등(SDG 11). 형식 설명은 src/track/README.md
# RGB LED(27·25·26, 공통 음극) + 가변저항(39) + 모드 버튼(14) + WiFi 웹서버. 2부 끝에 app 단계(AI 로 폰 앱 만들기). 아날로그는 WiFi 때문에 32~39 번 핀
id: 37-mood-light
order: 37
track: fusion
label: F10
prerequisites: [05-rgb-led, 13-clap-dial, 25-web-led]
subjects: [미술, 과학, 수학]
sdg: [11]
sessions: 2
teacherNotes: |
  **RGB LED 를 맨눈으로 오래 보지 않게 해 주세요.** 흰색(255, 255, 255)은 꽤 눈부십니다. 처음부터 **종이컵**을 거꾸로 씌워 덮개로 쓰면 눈도 보호되고 빛이 컵 안에서 섞여 무드등답게 보입니다. 종이컵에 한지 · 색종이 · 형광펜으로 꾸미기는 미술 시간과 연결됩니다.

  - **공통 음극 · 공통 양극** 키트의 RGB LED 는 가장 긴 다리가 GND(공통 음극)입니다. 다른 RGB LED 를 쓰면 공통 양극일 수 있는데, 그때는 긴 다리를 3V3 에 잇고 색이 **반대로**(255 가 꺼짐, 0 이 가장 밝음) 나옵니다. 색이 거꾸로 나오면 이것부터 봅니다.
  - **구간 경계는 예시입니다.** 코드의 800 · 1600 · 2400 · 3200 은 0~4095 를 다섯 칸으로 나눈 값일 뿐이에요. 가변저항을 끝까지 돌려도 4095 가 안 나오거나 0 아래로 안 내려가는 보드가 있으니, 1부 실행에서 손잡이 양 끝 값을 출력해 보고 경계를 고치게 해도 좋습니다. 경계값에서는 손잡이가 조금만 떨려도 색이 번갈아 바뀝니다(정상).
  - **색 범위 활동지(미술 · 수학)** 색과 감정을 짝지은 표(예: 빨강 힘 · 초록 안정 · 파랑 차분 · 보라 신비 · 흰색 집중)를 먼저 만들고, 그 다섯 색을 손잡이 구간에 배치하게 하면 1부 미션의 색 숫자가 학생마다 달라집니다. 판정은 세 숫자가 모두 0 만 아니면 통과합니다.
  - **16진수(수학)** 폰 앱의 색은 `#ff8800` 처럼 16진수 두 자리씩 빨강 · 초록 · 파랑입니다. `ff` = 255, `88` = 136, `00` = 0. 2부 실행 뒤 "16진수 ↔ 10진수" 변환 표를 채우는 활동을 넣을 수 있습니다(16 × 앞자리 + 뒷자리).
  - **WiFi** 코드의 `"MyWiFi"` · `"12345678"` 은 예시입니다. 폰과 보드가 같은 WiFi 에 있어야 하고, 학교 WiFi 가 막혀 있으면 공유기 모드 블록(`ip = wifi_ap("ESP32-LAB", "12345678")`)으로 바꾸고 폰을 그 WiFi 에 붙여 `192.168.4.1` 을 엽니다. WiFi 를 쓰는 동안 아날로그는 32~39 번 핀만 됩니다(가변저항이 39 번인 까닭).
  - **수면 타이머(설계)** 보드는 요청이 올 때만 반복 한 바퀴를 돌아 시간을 확인합니다. 폰 앱이 2초마다 `/data` 를 읽어 주면 그때마다 확인하고, 앱을 닫아 두면 다음 요청이 올 때 꺼집니다. 10분은 `600000` ms 로, 시험할 때는 `10000`(10초)으로 줄여 보게 하세요.
  - **앱 단계(2부 끝, 20분)** 학생 AI 계정 · 연령 정책이 걸리면 교사가 프롬프트를 넣어 시연하고 결과 HTML 을 나눠 줘도 됩니다. AI 결과에 외부 CDN · 글꼴 · 절대 주소가 섞이면 검사가 걸러 주니 "외부 라이브러리 없이, 상대 주소로" 라고 다시 부탁하게 합니다. 보드에 `index.html` 을 저장한 뒤 폰에서 보드 주소 `/` 를 다시 열면 내 앱이 나옵니다.
  - **차시 나누기** 1부(문제 만나기 ~ 미션, 약 35분): 손잡이 색 · 모드 버튼. 2부(실행 2 ~ 성찰, 약 50분): 폰으로 색 고르기 · 디버깅 · 수면 타이머 설계 · 앱 만들기.

  **교과 연결**
  - 미술: 색과 감정(색채 심리), 조명 디자인 — 종이컵 꾸미기, 나만의 다섯 색 팔레트 정하기.
  - 과학: 빛의 삼원색과 가산 혼합(빨강 + 초록 = 노랑, 셋 다 = 흰색), 수면과 빛 — 잠들기 전 파란빛은 잠을 쫓고 붉고 어두운 빛이 잠에 좋다는 연구를 소개합니다.
  - 수학: 0~4095 를 다섯 구간으로 나누기(원본 0~1023 표의 경계 × 4, 비례), 16진수 ↔ 10진수.
  - 사회(SDG 11): 필요한 만큼만 켜고 저절로 꺼지는 조명 — 에너지 절약과 빛 공해.
title: 감성 스마트 무드등
subtitle: 손잡이로, 버튼으로, 폰으로 고르는 나만의 빛
summary: |
  잠들기 힘든 친구에게 **빛 하나**를 선물해요. 5장의 RGB LED 에 **가변저항**(손잡이)과 **모드 버튼**을 붙여 손잡이로 다섯 색을 고르고, 버튼으로 끄기 → 손잡이 색 → 내가 고른 색 모드를 돌려요.
  2부에서는 25장의 **웹서버**를 붙여 폰 버튼으로 색을 바꾸고, 켠 뒤 10분이 지나면 저절로 꺼지는 **수면 타이머**를 설계해요. 마지막엔 AI 와 함께 내 폰 앱도 만들어요.
