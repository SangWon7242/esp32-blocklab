<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="mlw-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="mlw-title">브레드보드 배선도: ESP32 GND 는 검은 선 두 개로 위쪽 − 줄과 아래쪽 − 줄, 3V3 은 빨간 선으로 아래쪽 + 줄. RGB LED 다리 4개는 d 칸 14·16·18·20번 줄(빨강 · GND 가장 긴 다리 · 초록 · 파랑), 세 색 줄마다 220Ω 저항이 가운데 홈을 건너고 27번 → 14번 줄, 25번 → 18번 줄, 26번 → 20번 줄, 가장 긴 다리(16번 줄)는 위쪽 − 줄. 가변저항은 23·24·25번 줄 f 칸: 23번 → 아래쪽 − 줄, 가운데 24번 → 보라 선 → 39번, 25번 → 아래쪽 + 줄. 버튼은 가운데 홈에 걸쳐 28·30번 줄: 14번 → 초록 선 → 28번 줄 b 칸, 대각선 다리 30번 줄 j 칸 → 아래쪽 − 줄</title>
