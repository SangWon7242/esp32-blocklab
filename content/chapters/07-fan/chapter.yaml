# 챕터 7 · 작은 선풍기 — 수업 코드 저장소 07_작은선풍기. 형식 설명은 src/track/README.md
id: 07-fan
order: 7
track: sensor
label: S7
sessions: 2
title: 작은 선풍기
summary: |
  130 모터에 팬 날개를 끼워 **앞으로 · 뒤로 · 정지**하는 작은 선풍기를 만들어요. 모터에는 선이 두 가닥(IN+, IN−) 들어가고, 두 핀에 보내는 **0과 1의 조합**이 도는 방향을 정해요.
  자주 쓰는 동작에는 `forward()` · `backward()` · `stop()` 처럼 **이름(함수)** 을 붙여, 이름만 불러서 선풍기를 움직여 봐요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 130 모터 모듈, note: "작은 보드에 모터가 붙어 있어요. 핀 4개: G · V · IN+ · IN−" }
  - { name: 팬 날개, note: 배선이 모두 끝난 뒤에 모터 축에 끼워요 }
  - { name: 배터리 홀더 (AA 6개), board: plus, note: 건전지 6개는 따로 준비. 보드의 외부 전원 단자에 꽂아요 }
  - { name: F-F 듀폰선 4가닥, note: "양쪽 끝이 구멍인 선. 모듈 핀(G · V · IN+ · IN−)과 보드 핀에 바로 씌워요. 브레드보드는 안 써요" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-motor.svg
  caption: "브레드보드 없이 보드 위쪽 한 줄에 바로 꽂아요. 모터 모듈 G → GND, V → 5V, IN+ → 13(motor1a), IN− → 12(motor1b). AA 6개를 넣은 배터리 홀더는 보드의 외부 전원 단자에 꽂아요. 팬 날개는 배선이 끝난 뒤에 끼워요"
  captionDevkit: "보드 위 줄에 바로 꽂아요. 모터 모듈 G → GND, V → VIN, IN+ → D13(motor1a), IN− → D12(motor1b). 기본 보드에는 외부 전원 단자가 없어 USB 전원으로 돌려요. 보드가 저절로 다시 시작되면 다른 USB 포트에 꽂아 봐요. 팬 날개는 배선이 끝난 뒤에 끼워요"
principle:
  image: images/direction-table.svg
  body: |
    130 모터 모듈에는 모터를 돌려 주는 도우미 칩(HR1124S)이 들어 있어요. 모터는 전기를 많이(200mA까지) 써서 ESP32 핀이 직접 돌릴 수 없고, 핀은 칩에게 **어느 쪽으로 돌지** 신호만 보내요.

    - 모터는 두 끝에 전압을 걸면 돌고, 전압의 방향을 바꾸면 도는 방향도 바뀌어요
    - IN+ 1 · IN− 0 이면 앞으로, IN+ 0 · IN− 1 이면 뒤로, 둘 다 0 이면 멈춰요
    - 0과 1 대신 **PWM** 으로 세기(0~1023)를 보내면 빠르기도 바꿀 수 있어요
goals:
  content: 두 핀(13 · 12번)의 값 조합으로 130 모터를 앞으로 · 뒤로 · 정지시키고, 자주 쓰는 동작에 이름(함수)을 붙여 부른다
  thinking: 되풀이되는 동작 묶음을 찾아 이름을 붙이고, "무엇을 할지"와 "몇 번 할지"를 나누어 생각한다
successCriteria:
  - 두 핀의 값 1 · 0, 0 · 1, 0 · 0 이 각각 앞으로 · 뒤로 · 정지가 된다는 것을 표로 말할 수 있다
  - forward() · backward() · stop() · test() 가 무엇을 하는지 내 말로 설명할 수 있다
  - 다섯 번 반복을 끝없는 반복으로 바꿔 멈추지 않는 선풍기를 만들 수 있다
  - 팬 날개는 배선이 끝난 뒤에 끼우고, 도는 날개에 손가락 · 머리카락이 닿지 않게 지킬 수 있다
parts:
  - id: part1
    title: 앞뒤로 도는 선풍기 만들기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 모터는 어떻게 방향을 바꿀까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 코드로 팬을 앞으로 돌리고, 멈추고, 뒤로 돌리기
        body: |
          지금까지는 LED를 **켜기 · 끄기** 두 가지로 다뤘어요. 오늘 만들 선풍기는 **앞으로 돌기 · 뒤로 돌기 · 멈추기** 세 가지가 필요해요.

          모터에는 신호선이 **두 가닥**(IN+, IN−) 들어가요. 핀 하나는 0 아니면 1인데, 어떻게 세 가지를 나타낼 수 있을까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, 130 모터 모듈, 팬 날개, 듀폰선)을 책상에 꺼내 놓기
          - 모터 모듈의 핀 4개(G · V · IN+ · IN−) 이름을 찾아 읽기
          - 질문마다 내 생각을 한두 문장으로 쓰기
        questions:
          - 핀 하나에는 0 아니면 1만 보낼 수 있어요. 핀 두 개(IN+, IN−)라면 0과 1을 몇 가지로 조합할 수 있을까요? 그중 어느 조합이 앞으로, 뒤로, 정지가 될 것 같나요?
          - "\"앞으로 5초 → 멈춤 → 뒤로 5초 → 멈춤\"을 여러 번 시키려면 같은 줄을 몇 번이나 써야 할까요? 더 짧게 쓸 방법은 없을까요?"
          - LED는 USB 선만으로 켤 수 있었어요. 모터는 LED보다 전기를 훨씬 많이 써요. USB 선 하나로 모자라면 어떤 일이 생길까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "선풍기 돌리기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "앞으로"라는 말을 몰라요. **두 핀에 보내는 값**만 알아들어요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 방향 말고도 **시간**과 **횟수**도 누군가 정해야 하지 않을까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 시작 전에 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 방향 · 시간 · 횟수 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["IN+ 는 13번(motor1a), IN− 는 12번(motor1b) 핀에 이어져 있다는 것", "두 핀 값의 조합이 도는 방향을 정한다는 것"]
          decide: ["어느 방향으로 돌릴지", "몇 초 돌리고 몇 초 쉴지", "몇 번 되풀이할지"]
          act: ["두 핀에 값 보내기 (앞으로 · 뒤로 · 정지)", "자주 쓰는 동작에 이름(함수)을 붙여 부르기", "한 묶음을 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 두 핀의 조합
        minutes: 5
        scene:
          image: images/direction-table.svg
          caption: "IN+ 1 · IN− 0 이면 앞으로, IN+ 0 · IN− 1 이면 뒤로, 둘 다 0 이면 정지"
        body: |
          활동 칸의 코드는 아직 실행하지 않아요. `def forward():` 는 "앞으로"라는 **이름**을 붙인 동작 묶음이에요. 그 아래 들여 쓴 두 줄이 묶음 안의 일이고, 맨 아래에서 `forward()` 처럼 이름을 부르면 그때 그 일을 해요.

          그림의 표와 코드의 세 함수를 짝지어 보고, 맨 아래 세 줄을 실행하면 모터가 어떻게 될지 빈칸에 적어요.
        todo:
          - 표의 세 줄과 코드의 `forward` · `backward` · `stop` 을 짝짓기
          - 맨 아래 세 줄(이름을 부르는 곳)을 손가락으로 짚어 읽기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_direction.py
        blanks:
          - q: 실행하면 모터는 어느 쪽으로 몇 초 돌고, 그다음에는 어떻게 될까요?
          - q: 맨 아래 forward() 를 backward() 로 바꾸면 무엇이 달라질까요?
          - q: 두 핀에 모두 1을 보내면 모터는 어떻게 될까요? 그렇게 생각한 이유도 써 봐요

      - id: run
        type: run
        title: 복사 · 실행 — 앞으로 돌려 보기
        minutes: 8
        scene:
          image: images/safety.svg
          caption: 전원을 뺀 채 배선 → 팬 날개 → 그다음 전원. 도는 날개에 손 · 머리카락이 닿지 않게
        body: |
          먼저 **안전 약속**부터 지켜요. 전원(USB, 배터리 홀더를 쓰면 그것도)을 뺀 채로 선 4가닥을 잇고, **팬 날개는 배선이 모두 끝난 뒤에** 끼워요. 배선 중에 날개가 돌면 다칠 수 있어요.

          아래 **부품과 배선**을 열어 F-F 듀폰선으로 G → GND, V → 5V(기본 보드는 `VIN`), IN+ → 13번, IN− → 12번으로 이어요. 어디에 꽂는지는 배선 그림과 아래 표를 보세요. LED는 10mA면 되지만 130 모터는 200mA까지 써서, USB만으로는 모자라 보드가 저절로 다시 시작될 수 있어요. 그래서 보드에 **외부 전원 단자**가 있으면 AA 6개 배터리 홀더를 꽂아요. 실행한 뒤 예측과 같았는지 보세요.
        todo:
          - 전원을 뺀 채 F-F 듀폰선 4가닥 잇기 (G · V · IN+ · IN−)
          - 팬 날개 끼우고, 외부 전원 단자가 있는 보드면 배터리 홀더 꽂기
          - "**보드 연결** → **실행** 누르고, 날개 앞을 비운 채 몇 초 도는지 세기"
        code: step1_direction.py
        expected: 코드를 실행하면 팬이 3초 동안 앞으로 돌다가 멈추고, 프로그램이 끝나요.
        codeNotes:
          - { line: 4, note: "13번 핀(IN+)을 내보내는 핀으로 정하고 `motor1a` 라고 이름 붙여요" }
          - { line: 5, note: "12번 핀(IN−)을 내보내는 핀으로 정하고 `motor1b` 라고 이름 붙여요" }
          - { line: 8, note: "`def forward():` 로 \"앞으로\" 라는 이름의 동작 묶음을 만들어요. 만들기만 하고 아직 실행하지는 않아요" }
          - { line: 9, note: "IN+ 에 1, 다음 줄에서 IN− 에 0 을 보내면 앞으로 돌아요" }
          - { line: 13, note: "`backward()` 는 두 값을 서로 바꿔 보내서 뒤로 돌아요" }
          - { line: 18, note: "`stop()` 은 두 핀에 모두 0 을 보내 멈춰요" }
          - { line: 23, note: "`forward()` 처럼 이름을 부르면 그때 묶음 안의 두 줄이 실행돼요" }
          - { line: 24, note: "`time.sleep(3)`: 3초 동안 앞으로 도는 상태 그대로 기다려요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 방향을 정하는 함수
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          이번 코드에는 이름 붙인 동작이 세 개 있어요. 세 함수는 모두 **두 줄**로 되어 있고, 다른 점은 두 핀에 보내는 **값**뿐이에요.

          손가락으로 한 줄씩 짚으며 세 함수를 나란히 비교해 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - "`forward()` 와 `backward()` 의 두 줄을 나란히 비교하기"
          - 맨 아래에서 몇 초 기다리는지 찾기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_direction.py
        codeNotes:
          - { line: 4, note: "13번 핀(IN+)을 내보내는 핀으로 정하고 `motor1a` 라고 이름 붙여요" }
          - { line: 5, note: "12번 핀(IN−)을 내보내는 핀으로 정하고 `motor1b` 라고 이름 붙여요" }
          - { line: 8, note: "`def forward():` 로 \"앞으로\" 라는 이름의 동작 묶음을 만들어요" }
          - { line: 9, note: "`motor1a.value(1)`: IN+ 쪽에 1(HIGH)을 보내요" }
          - { line: 18, note: "`stop()` 은 두 핀에 모두 0 을 보내 멈춰요" }
          - { line: 23, note: "맨 아래에서 이름을 부를 때 비로소 묶음 안의 줄이 실행돼요" }
        questions:
          - { kind: number, q: "실행하면 모터가 앞으로 도는 시간은 몇 초인가요?", answer: 3 }
          - { kind: choice, q: "backward() 는 forward() 와 무엇이 다른가요?", options: ["두 핀의 값을 서로 바꿨다", "두 핀에 모두 1을 보낸다", "다른 핀 번호를 쓴다"], answer: 0, hint: "각 함수 안의 motor1a, motor1b 값을 차례로 읽어 보세요" }
          - { kind: line, q: "뒤로 돌 때 IN− 쪽(motor1b)에 1을 보내는 줄의 줄 번호를 클릭하세요", answer: 15 }

      - id: run2
        type: run
        title: 복사 · 실행 — 순서를 묶어 다섯 번
        minutes: 6
        scene:
          image: images/sequence.svg
          caption: "test() 한 묶음: 앞으로 5초 → 정지 2초 → 뒤로 5초 → 정지 2초"
        body: |
          이번 코드에는 함수가 하나 더 생겼어요. `test()` 는 **앞으로 → 정지 → 뒤로 → 정지**를 한 묶음으로 담은 이름이에요. 함수 안에서 다른 함수 이름을 불러도 돼요.

          맨 아래 `for i in range(5):` 가 `test()` 를 몇 번 부를지 정해요. 실행하고, 묶음이 몇 번 되풀이된 뒤 선풍기가 어떻게 되는지 끝까지 지켜보세요.
        todo:
          - 날개 앞을 비우고 **실행** 누르기
          - 앞으로 · 뒤로가 몇 번 되풀이되는지 손가락으로 세기
          - 다 끝난 뒤 선풍기가 어떤 상태인지 보기
        code: step2_sequence.py
        expected: 코드를 실행하면 앞으로 5초 → 정지 2초 → 뒤로 5초 → 정지 2초를 한 묶음으로 다섯 번 되풀이한 뒤, 팬이 멈춘 채로 끝나요.
        codeNotes:
          - { line: 23, note: "`def test():` 로 앞으로 → 정지 → 뒤로 → 정지를 한 묶음으로 담아요" }
          - { line: 24, note: "함수 안에서 다른 함수 `forward()` 를 불러도 돼요" }
          - { line: 25, note: "`time.sleep(5)`: 앞으로 도는 상태로 5초 기다려요" }
          - { line: 26, note: "`stop()` 으로 멈추고, 다음 줄에서 2초 쉬어요" }
          - { line: 28, note: "`backward()` 로 뒤로 돌아요" }
          - { line: 34, note: "`for i in range(5):` 아래 줄을 다섯 번 되풀이해요" }
          - { line: 35, note: "`test()` 를 부를 때마다 묶음 안의 24~31번 줄이 차례로 실행돼요" }

      - id: readcheck2
        type: readcheck
        title: 읽기 체크 — 묶음과 횟수
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          `test()` 안은 "무엇을 할지", 맨 아래 `for` 줄은 "몇 번 할지"를 맡아요. 두 곳을 나누어 읽으면 코드가 훨씬 쉬워져요.

          `test()` 안의 기다리는 시간을 모두 더해 보고, 마지막에 부르는 함수가 무엇인지 보세요. 답을 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - "`test()` 안의 `time.sleep(...)` 숫자를 모두 더하기"
          - "`test()` 의 마지막 두 줄이 무엇인지 보기"
          - 세 문제에 답하고 **확인** 누르기
        code: step2_sequence.py
        codeNotes:
          - { line: 8, note: "`forward()`: IN+ 1 · IN− 0 으로 앞으로" }
          - { line: 13, note: "`backward()`: IN+ 0 · IN− 1 로 뒤로" }
          - { line: 18, note: "`stop()`: 둘 다 0 으로 정지" }
