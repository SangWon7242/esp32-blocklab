      - id: mission
        type: mission
        title: 미션 — 끝나지 않는 선풍기
        minutes: 6
        scene:
          image: images/sequence.svg
          caption: 묶음 안은 그대로 두고, 묶음 밖의 "몇 번"만 바꿔요
        body: |
          지금 선풍기는 다섯 번 돌고 나면 멈춰 버려요. 진짜 선풍기라면 내가 끌 때까지 계속 돌아야겠죠? **멈출 때까지 계속 도는** 선풍기로 바꿔 봐요.

          `test()` 안은 고칠 필요가 없어요. 몇 번 되풀이할지 정하는 곳만 보면 돼요. 바꾼 뒤 실행해서 다섯 번이 지나도 계속 도는지 보고, 위쪽 **멈춤**으로 멈춘 다음 **판정**을 눌러요.
        todo:
          - 몇 번 되풀이할지 정하는 줄 찾기
          - 횟수 없이 계속 되풀이하는 반복으로 바꾸기
          - 실행해서 확인하고 **멈춤** → **판정** 누르기
        instructions: test() 가 다섯 번으로 끝나지 않고, 멈출 때까지 계속 되풀이되게 바꿔 주세요
        hint: 다섯 번을 정하는 줄은 어디에 있나요? 1장에서 LED를 끝없이 깜빡이게 할 때 쓴 반복을 떠올려 보세요
        code: step2_sequence.py
        rules:
          - codeMatches: '^while True\s*:\n +test\(\)'
            fail: test() 를 횟수 없이 계속 되풀이하는 반복이 있나요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*for \w+ in range\([^)]*\)\s*:\n +test\(\))'
            fail: 선풍기가 아직 정해진 횟수만큼만 돌고 끝나는 반복이 남아 있지 않나요?
          - codeMatches: 'def test\(\)\s*:\n( +)forward\(\)\n\1time\.sleep\(5(?:\.0)?\)\n\1stop\(\)\n\1time\.sleep\(2(?:\.0)?\)\n\1backward\(\)\n\1time\.sleep\(5(?:\.0)?\)\n\1stop\(\)\n\1time\.sleep\(2(?:\.0)?\)'
            fail: test() 안은 그대로 두었나요?
        answerCode: mission_forever.py

      - id: extra1
        type: mission
        title: 추가 미션 ① — 한 방향으로만
        optional: true
        minutes: 4
        scene:
          image: images/sequence.svg
          caption: 묶음에서 "뒤로 5초" 칸이 없어지면 선풍기는 어떻게 돌까요?
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 진짜 선풍기는 뒤로 돌지 않아요. **한 방향으로만** 돌고 쉬기를 되풀이하게 해 봐요.

          `test()` 안에서 어느 줄들을 지우면 될까요? 뒤로 도는 일과 그 뒤에 기다리는 시간은 몇 줄일까요?
        todo:
          - "`test()` 안에서 뒤로 도는 부분 찾기"
          - 그 부분을 지우고 앞으로 5초 → 정지 2초만 남기기
          - 실행해 보고 **판정** 누르기
        instructions: test() 안에서 뒤로 도는 부분을 지워, 앞으로 5초 돌고 2초 쉬기만 계속 되풀이하게 해 주세요
        code: mission_forever.py
        rules:
          - codeMatches: 'def test\(\)\s*:\n( +)forward\(\)\n\1time\.sleep\(5(?:\.0)?\)\n\1stop\(\)\n\1time\.sleep\(2(?:\.0)?\)(?:\n(?!\1)|(?![\s\S]))'
            fail: test() 안에 앞으로 돌기 · 기다리기 · 멈추기 · 기다리기 네 줄만 남아 있나요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*^ +backward\(\))'
            fail: test() 안에 뒤로 도는 부분이 남아 있지 않나요?
          - codeMatches: '^while True\s*:\n +test\(\)'
            fail: 계속 되풀이하는 반복은 그대로인가요?
        answerCode: extra1_one_way.py

      - id: extra2
        type: mission
        title: 추가 미션 ② — 바람 세기 바꾸기
        optional: true
        minutes: 7
        scene:
          image: images/direction-table.svg
          caption: IN+ 에 1 대신 "얼마나 세게"를 보내면 어떻게 될까요?
        body: |
          2장의 숨쉬는 LED를 떠올려 봐요. **PWM** 으로 LED 밝기를 0~1023 사이로 바꿨지요? IN+ 를 PWM 핀으로 만들면 모터의 **바람 세기**도 바꿀 수 있어요.

          IN− 는 0으로 고정해서 한 방향으로만 돌게 하고, IN+ 의 세기를 **약한 바람**과 **센 바람** 두 가지로 바꿔 가며 계속 되풀이해 봐요.
        todo:
          - "13번 핀을 PWM 으로 준비하기 (`motor1a = PWM(Pin(13))` 다음 줄에 `motor1a.freq(1000)`)"
          - IN− 는 0으로 고정하고, 세기 두 가지를 3초씩 번갈아 보내기
          - 실행해서 바람 세기가 바뀌는지 보고 **판정** 누르기
        instructions: IN+ 를 PWM 으로 바꿔, 약한 바람과 센 바람을 번갈아 계속 내도록 해 주세요 (IN− 는 0으로 고정)
        hint: 2장에서 밝기를 정할 때 쓴 duty(...) 를 떠올려 보세요. 약한 바람과 센 바람은 숫자가 달라야 해요
        code: extra1_one_way.py
        rules:
          - codeMatches: 'PWM\(\s*Pin\(\s*13\s*\)'
            fail: IN+ 쪽(13번) 핀을 세기를 바꿀 수 있는 PWM 핀으로 준비했나요?
          - codeMatches: '^ +(?:motor1a\.duty|forward)\(\s*([1-9]\d*)\s*\)[\s\S]*^ +(?:motor1a\.duty|forward)\(\s*(?!\1\s*\))[1-9]\d*\s*\)'
            fail: 약한 바람과 센 바람, 세기를 두 가지로 다르게 정했나요?
          - codeMatches: '^while True:'
            fail: 바람 세기를 한 번만 바꾸고 끝나지 않나요? 계속 되풀이하게 했나요?
        answerCode: extra2_pwm_speed.py

      - id: design
