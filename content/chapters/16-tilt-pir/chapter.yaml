        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 처음에만 이상하면 센서의 성질(예열)을, 거꾸로 움직이면 조건의 숫자를, 한 번만 움직이면 반복을 의심해 봐요.

          셋 다 빨간 글씨(에러)는 뜨지 않아요. 공책에 적어 둔 내 측정값을 옆에 두고 시작해요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 실행하자마자 아무도 없는데 LED 가 켜졌다 꺼졌다 해요 (조금 지나면 괜찮아져요)
            code: |
              from machine import Pin
              import time

              pir = Pin(23, Pin.IN)
              led = Pin(26, Pin.OUT)

              while True:
                  if pir.value() == 1:
                      led.value(1)
                      time.sleep(5)
                      led.value(0)
                  time.sleep(0.1)
            question: PIR 센서는 켠 바로 뒤에 어떤 시간이 필요하다고 했나요? 원리 그림 아래 그래프의 회색 칸을 떠올려 보세요. 반복이 시작되기 전에 무엇을 해 주어야 할까요?
            rules:
              - codeMatches: '^time\.sleep\(([3-9]\d|\d{3,})\)$'
                fail: 센서가 자리를 잡을 시간을 주었나요? 반복이 시작되기 전에 몇 초쯤 기다려야 할까요?
          - title: 세워 두면 경보가 울리고, 눕히면 조용해져요
            code: |
              from machine import Pin
              import time

              tilt = Pin(14, Pin.IN)
              buzzer = Pin(15, Pin.OUT)

              while True:
                  if tilt.value() == 0:
                      buzzer.value(1)
                  else:
                      buzzer.value(0)
                  time.sleep(0.1)
            question: 실행 1에서 세웠을 때와 눕혔을 때 출력 칸의 값은 각각 몇이었나요? 조건이 묻는 숫자와 짝지어 보세요.
            rules:
              - codeMatches: 'if tilt\.value\(\) == 1:\n\s+buzzer\.value\(1\)|if tilt\.value\(\) == 0:\n\s+buzzer\.value\(0\)'
                fail: 넘어졌을 때 내 모듈의 값은 몇이었나요? 그때 조건이 참이 되고, 부저가 켜지나요?
          - title: 눕혀 둔 채로 실행하면 한 번 삐 울리고, 그 뒤로는 아무리 눕혀도 조용해요
            code: |
              from machine import Pin
              import time

              tilt = Pin(14, Pin.IN)
              buzzer = Pin(15, Pin.OUT)

              time.sleep(1)
              if tilt.value() == 1:
                  buzzer.value(1)
                  time.sleep(0.5)
                  buzzer.value(0)
            question: 이 코드는 틸트 값을 몇 번 읽나요? 실행 1의 코드와 비교해서 빠진 것을 찾아보세요.
            rules:
              - codeMatches: 'while True:\n\s+if tilt\.value\(\) == 1:'
                fail: 틸트 값을 묻는 줄은 몇 번 실행되나요? 계속 지켜보게 하려면 무엇으로 감싸야 할까요?

