          부저를 켜기만 하면 "삐—" 하고 계속 울려요. "삐삐" 끊어지게 울리려면 켜기와 끄기 사이에 무엇이 필요할까요? 그리고 바로 세웠을 때 부저가 켜진 채로 남지 않게 하려면 어느 갈림길에 무엇을 넣어야 할까요?
