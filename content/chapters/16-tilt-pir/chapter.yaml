# 센서 트랙 S13 · 기울기와 사람 감지 — 원본: 아두이노 기본 W05(기울기 스위치 경보기), 마이크로비트 심화 W02(스마트 지팡이의 넘어짐 감지 → 틸트로 대체), Keyestudio 2-3-15 Tilt Switch · 2-3-16 Human Nearby or Not. 형식 설명은 src/track/README.md
id: 16-tilt-pir
order: 16
track: sensor
label: S13
prerequisites: [11-button-touch, 12-melody-buzzer]
subjects: [과학, 사회]
sdg: [3]
sessions: 2
teacherNotes: |
  **핀** 틸트 스위치 S 는 14번, PIR 센서 S 는 23번(계획 11 핀 표), 능동 부저는 15번(S9 와 같음, 블록 기본값), LED 는 26번이에요. Keyestudio 2-3-15 · 2-3-16 은 둘 다 14번을 쓰지만 이 챕터는 한 보드에 같이 꽂으므로 PIR 을 23번으로 옮겼어요. 모듈 핀이 브레드보드에 잘 안 맞으면 M-F 듀폰선으로 ESP32 에 바로 이어도 됩니다.

  **틸트 방향** 코드는 Keyestudio 튜토리얼처럼 **기울면 1** 인 모듈을 기준으로 썼어요. 낱개 틸트 스위치 + 10kΩ(튜토리얼 회로)나 다른 모듈은 반대일 수 있으니 실행 1(모듈 눕혀 보기)에서 반 전체가 방향을 꼭 확인해요. 반대인 모둠은 `== 0` 으로 바꾸게 하고(디버깅 증상 2), 미션 판정은 지시 그대로라 판정 뒤에 자기 모듈에 맞게 바꿔 보게 해요.

  **PIR 예열과 감도** 켠 뒤 30~60초는 값이 제멋대로 나와요(디버깅 증상 1). 모듈에 감도 · 유지 시간 가변저항이 있으면 유지 시간을 가장 짧게 돌려 두세요. 감지 거리가 5m 안팎, 시야가 100° 넘게 넓어서 교실에서는 다른 모둠의 움직임도 잡아요. 센서를 벽 쪽으로 향하게 하거나 종이컵 고깔을 씌워 시야를 좁히면 실험이 쉬워져요.

  **예시 값** 예열 30초, LED 5초, 지난 시간 5000ms, 경보 0.2초는 모두 예시 값이에요(실측 아님). 판정은 지시의 숫자 그대로라 판정 뒤에 바꿔 보게 해요.

  **블록 화면** `pir.value() == 1` 과 `tilt.value() == 1` 은 글자가 같은 코드라서, 코드를 블록으로 바꾸면 PIR 조건도 "기울었는가" 블록으로 보여요. 도구 상자의 "사람이 있는가" 블록을 써도 코드는 똑같아요. 학생이 물으면 "블록 이름만 다르고 보드가 하는 일은 같다"고 안내해 주세요.

  - 1차시: 문제 만나기 ~ 실행 2 · 읽기 체크 2 (틸트 값 확인, PIR 복도 등)
  - 2차시: 미션(넘어짐 경보기) · 디버깅 · 설계(마지막으로 본 뒤 5초) · 성찰
  - 융합: 과학(중력과 구슬, 몸에서 나오는 적외선 · 열), 사회(혼자 사는 어르신 낙상 알림, 공동 주택 복도 · 계단의 센서 등과 에너지 절약). 원본 W05 의 기울기 경보, 마이크로비트 W02 의 "지팡이를 놓치면 경보"(가속도 → 틸트)는 F5 스마트 지팡이로 이어져요
  - 낙상 이야기를 할 때 특정 학생의 가족 이야기를 말하게 하지 않아요
title: 기울기와 사람 감지
subtitle: 넘어지면 울리는 경보기와 사람이 오면 켜지는 복도 등
summary: |
  **틸트 스위치**는 기울었는지, **PIR 센서**는 사람이 움직였는지를 `0` 과 `1` 로 알려 줘요. 버튼처럼 값을 읽기만 하면 돼요.
  모듈을 눕혀 LED 를 켜 보고, 사람이 오면 LED 가 5초 켜지는 복도 등을 만든 뒤, 마지막에는 넘어지면 부저가 삐삐 울리고 바로 세우면 멈추는 **넘어짐 경보기**를 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 틸트 스위치 모듈, note: "다리 3개: S(신호) · + · −. 흔들면 안에서 구슬이 달그락거려요" }
  - { name: PIR 센서(인체감지) 모듈, note: "다리 3개: S · + · −. 둥근 흰 렌즈가 앞을 봐요. 렌즈를 누르거나 빼지 않기" }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 능동 부저, note: "검은 스티커(+ 표시)가 붙은 부저. S9 에서 쓴 것" }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. LED 자리는 1 · 2장과 같아요 }
  - { name: 점퍼선(M-M), note: "13개 (틸트 3, PIR 3, 부저 2, LED 2, 3V3 · GND 3)" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "틸트 스위치 모듈 S · + · − 는 e 칸 17 · 18 · 19번 줄, PIR 모듈 S · + · − 는 e 칸 25 · 26 · 27번 줄에 꽂아요. 14번 → 17번 줄(틸트 S), 23번 → 25번 줄(PIR S), 두 모듈의 + → + 줄 → 3V3, − → − 줄 → GND. 능동 부저는 + 다리를 21번 줄(15번 핀과 이어요), − 다리를 23번 줄 → 아래 − 줄 → GND. LED 는 1 · 2장과 같은 자리: 26번 → 7번 줄 → 220Ω 저항 → 12번 줄 긴 다리, 13번 줄 짧은 다리 → − 줄"
principle:
  image: images/tilt-ball.svg
  body: |
    **틸트 스위치** 안에는 작은 **금속 구슬**이 들어 있어요. 바로 서 있으면 구슬이 아래로 내려와 두 다리를 이어 주고, 기울이면 구슬이 굴러가 다리가 떨어져요. 이 모듈은 S8 의 풀업 버튼처럼 **이어지면 0, 떨어지면 1** 을 줘서 **기울면 1** 이에요. 옛날에는 구슬 대신 **수은** 방울을 썼는데, 몸에 해로워서 지금은 거의 쓰지 않아요.

    **PIR 센서**(인체감지 센서)는 사람이나 동물의 몸에서 나오는 눈에 보이지 않는 **적외선(열)** 을 느껴요. 둥근 렌즈가 앞을 여러 칸으로 나눠 보기 때문에, 사람이 칸 사이를 **움직여** 적외선이 바뀌면 S 값이 `1` 이 되고 몇 초 머물러요. 열이 바뀌지 않는 벽이나 의자는 늘 0 이고, 사람도 오래 가만히 있으면 0 으로 돌아갈 수 있어요.

    - PIR 센서는 켜고 나서 **30초쯤 예열**이 필요해요. 그동안은 값이 제멋대로 나와요
    - 두 센서 모두 0 과 1 이 반대인 모듈이 있어요. 코드를 쓰기 전에 **먼저 값을 출력**해서 확인해요
goals:
  content: 틸트 스위치와 PIR 센서의 값(0 · 1)을 읽어, 기울면 경보를 울리고 사람이 오면 LED 를 정한 시간 동안 켠다
  thinking: 센서가 무엇이 바뀔 때 값을 바꾸는지 설명하고, 방향 · 예열 같은 센서의 성질을 코드에 반영한다
successCriteria:
  - 틸트 스위치 안의 구슬이 어떻게 0 과 1 을 만드는지 원리 그림을 짚으며 설명할 수 있다
  - 출력 칸에서 내 틸트 모듈이 기울 때 0 인지 1 인지 확인하고, 그에 맞게 조건을 쓸 수 있다
  - PIR 센서에 예열 시간이 왜 필요한지 말하고, 사람이 오면 LED 를 5초 켜는 코드를 읽을 수 있다
  - 기울면 부저가 삐삐 울리고 바로 세우면 멈추는 넘어짐 경보기를 만들 수 있다
  - 넘어짐 알림과 사람 감지 등이 생활의 안전과 에너지 절약에 어떻게 쓰이는지 예를 들 수 있다
parts:
  - id: part1
    title: 넘어짐과 사람을 알아채기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 기계는 넘어진 걸, 사람을 어떻게 알까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 넘어진 지팡이가 삐삐 울리고, 사람이 걸어오면 복도 등이 켜져요. 아무도 버튼을 누르지 않았는데요
        body: |
          혼자 사는 어르신이 넘어지거나 지팡이를 놓치면, 그 사실을 누군가 빨리 알아야 해요. 아파트 복도나 계단의 등은 사람이 지나가면 저절로 켜지고요.

          두 기계 모두 버튼을 누르는 사람이 없어요. 기계는 "넘어졌다", "사람이 왔다"는 것을 어떻게 알아챌까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(틸트 스위치 모듈, PIR 센서 모듈, LED, 저항, 능동 부저, 브레드보드, 점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 어르신이 넘어지거나 자전거가 쓰러지면 기계가 알려 줄 수 있으면 좋겠어요. 기계는 "넘어졌다"는 것을 어떻게 알 수 있을까요?
          - 복도 등은 사람이 지나가면 켜져요. 등은 사람을 어떻게 알아볼까요? 사람과 의자는 무엇이 다를까요?
          - 사람이 지나간 뒤에도 복도 등이 계속 켜져 있으면 무엇이 문제일까요? 언제 꺼지는 것이 좋을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "넘어지면 경보", "사람이 오면 켜기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 넘어진 모습이나 사람을 눈으로 보지 못하고, 핀의 값 `0` 과 `1` 만 읽을 수 있어요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. "몇 초 동안 켜 둘까"도 사람이 정해 줘야 하는 일일까요?
        todo:
          - "**알아야 할 것**: 보드가 미리 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 시간이나 숫자 적기"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["틸트 스위치는 14번, PIR 센서는 23번, LED 는 26번 핀에 꽂혀 있다", "틸트는 기울면 1, 바로 서면 0 이다 (내 모듈에서 확인)", "PIR 은 사람이 움직이면 1 이고, 켜고 30초쯤은 예열한다"]
          decide: ["사람이 온 뒤 LED 를 몇 초 켜 둘지 (5초)", "경보를 얼마나 빠르게 삐삐 울릴지", "얼마나 자주 값을 확인할지"]
          act: ["센서 값을 계속 읽기", "1 이면 LED 를 켜거나 경보 울리기", "0 이면 끄고, 이 일을 끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 눕히면 몇이 나올까?
        minutes: 4
        scene:
          image: images/tilt-ball.svg
          caption: 바로 서면 구슬이 다리를 잇고(0), 기울이면 구슬이 굴러가 다리가 떨어져요(1)
        body: |
          아직 실행하지 않아요. 활동 칸의 코드는 틸트 스위치 값을 0.1초마다 찍고, 그 값이 `1` 이면 LED 를 켜요. S8 버튼 코드와 모양이 아주 비슷해요.

          그림의 구슬을 떠올리며, 모듈을 세워 두었을 때와 눕혔을 때 무슨 일이 일어날지 빈칸에 내 예측을 적어요.
        todo:
          - S8 버튼 코드와 다른 줄을 찾아보기
          - "`if tilt.value() == 1:` 이 무엇을 묻는지 읽기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_tilt.py
        blanks:
          - q: 모듈을 바로 세워 두었을 때 출력 칸에 찍힐 숫자는 무엇일까요?
          - q: 모듈을 옆으로 눕히면 LED 는 어떻게 될까요?
          - q: 1초 동안 값은 몇 번 찍힐까요?
            unit: 번

      - id: run
        type: run
        title: 복사 · 실행 — 기울이면 LED
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "틸트 모듈 S · + · − 는 e 칸 17 · 18 · 19번 줄. 14번 → S, + → + 줄 → 3V3, − → − 줄 → GND"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 꽂아요. 오늘 쓸 부품(틸트 · PIR · 부저 · LED)을 지금 한꺼번에 꽂아 두면 다음 단계에서 바로 쓸 수 있어요. 모듈마다 다리 이름(S · + · −)이 적혀 있으니 꼭 확인해요.

          실행한 뒤 브레드보드를 통째로 천천히 기울이거나 틸트 모듈만 살짝 눕혀 보세요. 출력 칸의 숫자가 언제 바뀌는지, **세웠을 때 값과 눕혔을 때 값**을 공책에 적어 두세요. 예측과 반대라면 내 모듈은 방향이 반대인 거예요.
        todo:
          - "**부품과 배선**대로 모듈 두 개 · 부저 · LED 꽂기"
          - "**보드 연결** → **실행** 누르기"
          - 세웠을 때 값과 눕혔을 때 값을 공책에 적기
        code: step1_tilt.py
        expected: 코드를 실행하면 출력 칸에 0 이 0.1초마다 찍혀요. 틸트 모듈을 옆으로 눕히면 1 이 찍히고 LED 가 켜지며, 다시 세우면 0 으로 돌아가고 LED 가 꺼져요.
        codeNotes:
          - { line: 4, note: "14번 핀을 입력(`Pin.IN`)으로 준비하고 이름을 `tilt` 로 붙여요. 기울면 1 이에요" }
          - { line: 5, note: "26번 핀은 LED 를 켜고 끄는 출력 핀이에요" }
          - { line: 7, note: "아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 8, note: "`tilt.value()` 로 지금 틸트 값(0 또는 1)을 읽어 출력 칸에 찍어요" }
          - { line: 9, note: "값이 1 이면(기울었으면) 바로 아래 줄을 해요" }
          - { line: 10, note: "LED 를 켜요" }
          - { line: 11, note: "1 이 아니면(바로 서 있으면) LED 를 꺼요 (11~12번 줄)" }
          - { line: 13, note: "0.1초 쉬고 다시 처음으로. 1초에 10번 확인해요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 1 — 틸트
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          `tilt.value()` 가 **두 번** 나와요. 한 번은 값을 찍고, 한 번은 `if` 로 값을 물어봐요.

          모듈을 세웠을 때와 눕혔을 때 각각 어느 줄을 지나가는지 손가락으로 짚으며 따라가 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
