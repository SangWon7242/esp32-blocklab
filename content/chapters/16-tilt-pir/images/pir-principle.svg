<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="tp-pir-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="tp-pir-title">인체감지(PIR) 센서의 원리. 사람의 몸은 눈에 보이지 않는 적외선(열)을 내보낸다. 센서의 둥근 렌즈는 앞을 여러 칸으로 나눠 보고, 사람이 칸과 칸 사이를 움직여 적외선이 바뀌면 S 값이 1이 되어 몇 초 동안 머문다. 움직임이 없으면 0으로 돌아간다. 켠 뒤 처음 30초쯤은 예열 시간이라 값이 제멋대로 나올 수 있다</title>
  <rect x="16" y="16" width="608" height="196" rx="14" fill="var(--card)" stroke-width="1.8"/>
  <!-- 감지 칸 (부채꼴) -->
  <g stroke="none" fill="#1971c2" fill-opacity="0.13">
    <path d="M520 112 L40 40 L40 72 Z"/>
    <path d="M520 112 L40 104 L40 136 Z"/>
    <path d="M520 112 L40 168 L40 198 Z"/>
  </g>
  <g stroke="#1971c2" stroke-width="1" stroke-opacity="0.45">
    <path d="M520 112 L40 40 M520 112 L40 72 M520 112 L40 104 M520 112 L40 136 M520 112 L40 168 M520 112 L40 198"/>
  </g>
  <!-- 사람 -->
  <circle cx="204" cy="88" r="13" fill="#e9c6a6" stroke-width="2"/>
  <path d="M204 103 V146 M204 146 L190 186 M204 146 L220 184 M204 112 L186 134 M204 112 L224 128" stroke-width="5"/>
  <g stroke="#e03131" stroke-width="2.2">
    <path d="M232 92 q6 -5 0 -10 q-6 -5 0 -10"/>
    <path d="M244 100 q6 -5 0 -10 q-6 -5 0 -10"/>
    <path d="M256 108 q6 -5 0 -10 q-6 -5 0 -10"/>
  </g>
  <path d="M150 200 H262 M254 194 L262 200 L254 206" stroke-width="2.5"/>
  <text x="56" y="205" font-size="13" font-weight="600" fill="currentColor" stroke="none">칸을 건너가요</text>
  <rect x="274" y="56" width="152" height="24" rx="12" fill="var(--card)" stroke-width="1.5"/>
  <text x="350" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">몸에서 나오는 적외선(열)</text>
  <!-- 센서 -->
  <rect x="524" y="88" width="48" height="48" rx="4" fill="#1971c2" fill-opacity="0.3" stroke-width="1.8"/>
  <path d="M524 92 A22 22 0 0 0 524 132" fill="var(--card)" stroke-width="1.8"/>
  <path d="M514 98 L518 112 L514 126" stroke-width="1" stroke-opacity="0.5"/>
  <text x="548" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">PIR 센서</text>
  <text x="548" y="176" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">둥근 렌즈가</text>
  <text x="548" y="192" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">앞을 칸으로 나눠요</text>
  <!-- 아래: 시간에 따른 S 값 -->
  <text x="24" y="246" font-size="13" font-weight="700" fill="currentColor" stroke="none">S 값</text>
  <text x="34" y="268" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">1</text>
  <text x="34" y="306" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">0</text>
  <rect x="56" y="232" width="128" height="84" rx="6" fill="currentColor" fill-opacity="0.08" stroke="none"/>
  <path d="M56 302 H70 V264 H84 V302 H112 V264 H120 V302 H150 V264 H164 V302 H184" stroke="#868e96" stroke-width="2.5"/>
  <path d="M184 302 H300 V264 H420 V302 H608" stroke="#2f9e44" stroke-width="3"/>
  <path d="M56 324 H612 M604 319 L612 324 L604 329" stroke-width="1.5"/>
  <text x="120" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">켜고 30초: 예열(제멋대로)</text>
  <text x="360" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">사람이 움직이면 1, 몇 초 머물러요</text>
  <text x="514" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">아무도 없으면 0</text>
  <text x="590" y="344" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">시간</text>
</svg>
