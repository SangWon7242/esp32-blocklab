<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="tp-cover-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="tp-cover-title">두 장면. 왼쪽: 바닥에 넘어진 지팡이에 붙은 틸트 스위치가 기울어진 것을 알아채고 부저가 삐삐 울린다. 오른쪽: 어두운 복도 천장의 인체감지(PIR) 센서가 걸어오는 사람을 알아채고 천장 등이 켜진다</title>
  <rect x="0" y="0" width="640" height="360" fill="var(--muted)" stroke="none"/>
  <!-- 왼쪽: 넘어짐 알림 -->
  <rect x="16" y="16" width="296" height="328" rx="14" fill="var(--card)" stroke-width="1.8"/>
  <text x="36" y="48" font-size="18" font-weight="700" fill="currentColor" stroke="none">넘어지면 알려요</text>
  <text x="36" y="72" font-size="13" fill="currentColor" fill-opacity="0.7" stroke="none">기계는 넘어진 걸 어떻게 알까요?</text>
  <path d="M28 300 H300" stroke-width="2.5"/>
  <rect x="28" y="300" width="272" height="34" fill="currentColor" fill-opacity="0.08" stroke="none"/>
  <!-- 서 있던 자리 (점선) -->
  <path d="M96 296 V128 Q96 112 112 112 H126" stroke-dasharray="6 6" stroke-opacity="0.35" stroke-width="4"/>
  <!-- 넘어진 지팡이 -->
  <path d="M84 292 L250 262 Q264 259 268 272 L270 280" stroke-width="7"/>
  <path d="M84 292 L250 262" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 12"/>
  <!-- 틸트 스위치 -->
  <g transform="rotate(-10 168 268)">
    <rect x="150" y="252" width="36" height="20" rx="3" fill="#2f9e44" fill-opacity="0.55" stroke-width="1.6"/>
    <rect x="159" y="257" width="18" height="9" rx="4.5" fill="var(--card)" stroke-width="1.3"/>
    <circle cx="173" cy="261.5" r="2.6" fill="currentColor" stroke="none"/>
  </g>
  <!-- 부저와 소리 -->
  <circle cx="214" cy="244" r="12" fill="#343a40" stroke-width="1.5"/>
  <circle cx="214" cy="244" r="2.5" fill="var(--muted)" stroke="none"/>
  <g stroke="#e03131" stroke-width="3">
    <path d="M232 228 Q240 236 232 246"/>
    <path d="M242 220 Q256 236 242 254"/>
    <path d="M252 212 Q272 236 252 262"/>
  </g>
  <text x="226" y="200" font-size="18" font-weight="700" fill="#e03131" stroke="none">삐삐!</text>
  <path d="M168 248 L150 196" stroke-width="1.5"/>
  <rect x="88" y="174" width="104" height="24" rx="12" fill="var(--card)" stroke-width="1.5"/>
  <text x="140" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">틸트 스위치</text>
  <!-- 오른쪽: 복도 등 -->
  <rect x="328" y="16" width="296" height="328" rx="14" fill="currentColor" fill-opacity="0.1" stroke-width="1.8"/>
  <text x="348" y="48" font-size="18" font-weight="700" fill="currentColor" stroke="none">사람이 오면 켜져요</text>
  <text x="348" y="72" font-size="13" fill="currentColor" fill-opacity="0.7" stroke="none">복도 등은 사람을 어떻게 알아볼까요?</text>
  <path d="M340 96 H612" stroke-width="2.5"/>
  <path d="M340 300 H612" stroke-width="2.5"/>
  <!-- 천장 등 빛 -->
  <path d="M520 108 L440 300 H612 V250 Z" fill="#f4af18" fill-opacity="0.3" stroke="none"/>
  <path d="M500 96 V102 H540 V96" fill="var(--card)" stroke-width="2"/>
  <ellipse cx="520" cy="106" rx="22" ry="6" fill="#f4af18" stroke-width="1.8"/>
  <!-- PIR 센서와 감지 범위 -->
  <rect x="384" y="96" width="30" height="10" rx="2" fill="#1971c2" fill-opacity="0.5" stroke-width="1.5"/>
  <path d="M388 106 A11 11 0 0 0 410 106" fill="var(--card)" stroke-width="1.5"/>
  <path d="M399 118 L352 296 M399 118 L470 296" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <path d="M399 118 L376 296 M399 118 L400 296 M399 118 L424 296 M399 118 L447 296" stroke="#1971c2" stroke-width="1" stroke-opacity="0.35"/>
  <path d="M414 108 L452 140" stroke-width="1.5"/>
  <rect x="440" y="140" width="80" height="24" rx="12" fill="var(--card)" stroke-width="1.5"/>
  <text x="480" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">PIR 센서</text>
  <!-- 걸어오는 사람 -->
  <circle cx="420" cy="196" r="14" fill="#e9c6a6" stroke-width="2"/>
  <path d="M420 212 V256 M420 256 L404 296 M420 256 L438 296 M420 222 L400 246 M420 222 L442 240" stroke-width="6"/>
  <g stroke="#e03131" stroke-width="2" stroke-opacity="0.75">
    <path d="M444 186 q5 -5 0 -10 q-5 -5 0 -10"/>
    <path d="M454 192 q5 -5 0 -10 q-5 -5 0 -10"/>
  </g>
  <path d="M376 316 H456 M448 310 L456 316 L448 322" stroke-width="2"/>
  <text x="466" y="321" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">걸어오는 중</text>
</svg>
