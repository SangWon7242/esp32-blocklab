          - 소리 나는 부저를 준비하고 당첨 · 꽝에 서로 다른 음 넣기
          - 실행해 보고 **판정** 누르기
        instructions: 25번 핀의 수동 부저로 당첨이면 높은 음, 꽝이면 낮은 음을 울려 주세요
        code: step2_hammer.py
        rules:
