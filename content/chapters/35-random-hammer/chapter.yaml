      - id: mission
        type: mission
        title: 미션 — 세 번만 치는 망치 (통합 평가)
        minutes: 10
        scene:
          image: images/game-flow.svg
          caption: 흐름은 그대로 두고, 친 횟수를 세는 곳과 3번이 되면 멈추는 조건을 더해요
        body: |
          지금 망치는 끝없이 칠 수 있어요. 한 사람이 **세 번까지만** 칠 수 있게 바꿔 봐요. 몇 번 쳤는지 보드가 기억하려면 무엇이 필요할까요? 그 변수는 반복 밖과 안 중 어디서 0 으로 시작해야 할까요?

          판정은 기능 네 가지를 하나씩 봐요: ① 손이 20cm 안일 때만 치기 ② 1~2 중 뽑기 ③ 당첨 90° · 꽝 50° · 1초 뒤 180° ④ `count` 로 3번 제한. 화면에 몇 번째인지 띄우면 더 좋아요.
        todo:
          - 친 횟수를 셀 변수 `count` 를 반복 밖에 만들기
          - 칠 때마다 `count` 를 1 늘리고, 3번이 되면 더 치지 않게 조건 더하기
          - 실행해서 네 번째에는 망치가 안 움직이는지 보고 **판정** 누르기
        instructions: 손이 20cm 안에 있고 버튼을 눌렀을 때만, 세 번까지만 망치를 치게 바꿔 주세요. 1~2 뽑기, 당첨 90° · 꽝 50°, 1초 뒤 180° 복귀는 그대로 지키고, 친 횟수는 count 변수로 세요
        hint: "`count = 0` 을 반복 앞에 두고, 바깥 if 조건 끝에 `and count < 3` 을 더한 뒤, if 안 첫 줄에서 `count = count + 1` 로 늘려요. 화면에 `str(count) + \" / 3\"` 을 띄우면 몇 번째인지 보여요"
        code: step2_hammer.py
        rules:
          - codeMatches: '(get_distance\(\)|\b\w+) (<= 20|< 21)\b'
            fail: 손이 망치 아래에 있는지는 무엇으로 알 수 있나요? 몇 cm 안쪽일 때만 쳐야 했나요?
          - codeMatches: 'random\.randint\(1, 2\)'
            fail: 당첨과 꽝이 반반이 되려면 몇부터 몇 사이에서 뽑아야 할까요?
          - codeMatches: '^(?=[\s\S]*\.duty_u16\(1638 \+ 90 \* 6462 // 180\))(?=[\s\S]*\.duty_u16\(1638 \+ 50 \* 6462 // 180\))(?=[\s\S]*\.duty_u16\(1638 \+ 180 \* 6462 // 180\))'
            fail: 당첨, 꽝, 기다리기 때 망치는 각각 몇 도였나요? 세 각도가 모두 코드에 남아 있나요?
          - codeMatches: '^(?=[\s\S]*^count = 0$)(?=[\s\S]*\bcount (< 3|<= 2)\b)(?=[\s\S]*^\s+count (= count \+ 1|\+= 1)$)'
            fail: 몇 번 쳤는지 기억하는 count 가 반복 밖에서 0 으로 시작하나요? 칠 때마다 1씩 늘어나나요? 3번이 되면 더는 치지 않게 묻는 곳이 있나요?
        answerCode: mission_three_tries.py

      - id: extra
        type: mission
        title: 추가 미션 — 당첨 소리, 꽝 소리
        optional: true
        minutes: 5
        scene:
