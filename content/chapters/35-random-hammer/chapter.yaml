# 챕터 35 · 복불복 랜덤 망치 — 교과 융합 F8. 원본: 아두이노 심화 W05 랜덤 망치 게임(앱·블루투스는 버리고 버튼 + 출력 창/OLED 로 완결). 형식 설명은 src/track/README.md
# 미션은 통합 평가형: 기능마다 codeMatches 규칙 하나(거리 20 이하, 1~2 뽑기, 90·50·180 각도, count 로 3번 제한)
id: 35-random-hammer
order: 35
track: fusion
label: F8
prerequisites: [17-ultrasonic, 18-servo, 11-button-touch]   # 먼저 할 챕터 (안내만)
subjects: [수학, 과학, 체육]
sessions: 2
teacherNotes: |
  **교과 연결**
  - 수학: 확률(경우의 수 2 가지 중 1 → 1/2, 3 가지 중 1 → 1/3), 상대도수(당첨 횟수 ÷ 전체 횟수)와 기록표, 큰 수의 법칙. 1부 연습 미션에서 모둠마다 20번, 시간이 되면 50번을 눌러 기록표에 적게 하고, 칠판에 반 전체 합계를 모아 상대도수가 0.5 에 가까워지는지 함께 봅니다(중1 자료의 정리와 해석, 중2 확률 단원과 연결).
  - 과학: 소리의 속력 약 340 m/s, 거리 = 속력 × 시간. 초음파는 손까지 **갔다가 돌아온** 시간을 재므로 절반만 씁니다(디버깅 2).
  - 체육(반응): 짝이 손을 넣고 다른 사람이 버튼을 누르면, 망치가 움직이는 순간 손을 빼는 반응 놀이로 바꿀 수 있습니다. 종이컵 망치만 쓰고, 꽝 각도(50°)는 손에 살짝 닿을 만큼만 맞춰 주세요.
  - 미술·실과(메이킹): 나무젓가락 끝에 종이컵을 거꾸로 붙여 망치를 만들고, 젓가락을 서보 혼(팔)에 테이프나 케이블 타이로 묶습니다. 서보는 박스지 받침(약 10cm 높이) 위에 옆으로 눕혀 붙이고, 초음파 센서는 받침 앞 책상에 손 쪽을 보게 둡니다.

  **각도 맞추기** 서보는 준비 줄에서 한 번 0° 로 갔다가 반복에 들어가면 180° 로 올라갑니다. 혼을 끼우는 방향에 따라 180° 가 "위로 선" 자리가 되도록 맞추고, 90° 는 손 위에서 멈추고 50° 는 손(종이컵)에 닿게 받침 높이로 조절하세요. 90 · 50 · 180 과 기준 20cm 는 **예시 값**이에요. 모둠 기계에 맞게 바꿔도 미션 판정은 이 세 각도와 20 을 보므로, 바꾸면 그 모둠은 판정 규칙 대신 선생님이 확인합니다.

  **측정값 안내** 초음파는 3cm 보다 가까우면 값이 튀고, 손바닥을 센서에 나란히 펴야 잘 잡힙니다. 손을 5~20cm 에 두게 하세요. 출력 창 거리를 자로 잰 값과 한 번 비교하게 하면 디버깅 2 를 빨리 찾습니다.

  **안전·전원**
  - 서보는 전류를 많이 써서 USB 전원만으로는 ESP32 가 다시 켜지는(리셋) 일이 생깁니다. 망치가 움직일 때 출력 창이 끊기고 처음부터 다시 찍히면 전원 부족이에요. 서보 빨강 선은 **5V 외부 전원**(건전지 팩·전원 모듈)에 잇고 GND 는 보드와 함께 묶으세요.
  - 배선은 USB 를 뺀 채로. 서보 혼을 손으로 억지로 돌리지 않게 합니다.
  - 망치는 종이컵·나무젓가락만. 쇠붙이·무거운 것을 달지 않습니다.

  **시간** 1부(문제 ~ 연습 미션 35분) / 2부(완성 기계 ~ 성찰 45분, 추가 미션 5분). 1부 끝에 공작(망치 만들기)을 숙제나 미술 시간으로 돌려도 됩니다. 원본 W05 의 앱(시작·종료·망치 버튼)은 버튼 하나와 OLED 화면으로 바꾸었고, 웹 앱 버전은 앱 단계 챕터에서 다룹니다.
title: 복불복 랜덤 망치
subtitle: 운에 맡기는 기계는 정말 공평할까?
summary: |
  점심 메뉴를 못 고를 때, 가위바위보 대신 **망치에게** 맡겨 볼까요? 손을 센서 앞에 넣고 버튼을 누르면 보드가 1 과 2 중 하나를 뽑아, 1 이면 망치가 손 위에서 멈추고(당첨) 2 면 손까지 내려와요(꽝).
  1부에서 **무작위 수**를 뽑아 기록표에 적으며 정말 반반인지 확인하고, 2부에서 초음파 센서 · 서보 망치 · OLED 화면을 묶어 기계를 완성해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 버튼(푸시 버튼), note: 다리가 네 개. 브레드보드 가운데 홈에 걸쳐 꽂아요 }
  - { name: HC-SR04 초음파 센서, note: "핀 4개: VCC · Trig · Echo · GND" }
  - { name: 서보 모터(SG90), note: "망치를 움직여요. 갈색 GND · 빨강 5V · 주황 신호(4번)" }
  - { name: OLED 화면 (128×64), note: "2부에서 WIN · FAIL 을 띄워요. 핀 4개: GND · VCC · SCL · SDA" }
  - { name: 브레드보드, board: plus, note: "버튼만 꽂아요. 초음파 · OLED · 서보는 보드에 바로" }
  - { name: F-F 듀폰선 8가닥, board: plus, note: "양쪽 끝이 구멍인 선. 초음파 4 · OLED 4 핀을 보드 핀에 바로. 서보는 플러그째 ANALOG io4 줄에" }
  - { name: M-F 듀폰선 2가닥, board: plus, note: "구멍 쪽은 보드 io14 · io14 기둥 G, 핀 쪽은 버튼 두 다리 줄에" }
  - { name: 브레드보드, board: devkit, note: "+ 줄은 VIN(5V), − 줄은 GND. 초음파와 서보가 나눠 쓰고, 버튼도 꽂아요" }
  - { name: F-F 듀폰선 6가닥, board: devkit, note: "초음파 Trig · Echo, OLED 네 핀을 보드 핀에 바로" }
  - { name: M-F 듀폰선 6가닥, board: devkit, note: "VIN · GND · 초음파 VCC · GND → + − 줄, D14 → 버튼, D4 → 서보 주황" }
  - { name: 점퍼선(M-M) 3가닥, board: devkit, note: "서보 빨강 · 갈색 → + − 줄, 버튼 대각선 다리 → − 줄" }
  - { name: 종이컵 · 나무젓가락 · 테이프 · 박스지, note: "망치와 서보 받침을 만들어요. 종이컵을 젓가락 끝에 거꾸로 붙이면 망치" }
  - { name: (추가 미션) 수동 부저, board: plus, note: "브레드보드에 꽂고 + 다리 줄 → io25, − 다리 줄 → io25 기둥 G (M-F 2가닥 더)" }
  - { name: (추가 미션) 수동 부저, board: devkit, note: "브레드보드에 꽂고 + 다리 줄 → D25, − 다리 줄 → − 줄 (M-F 1 · 점퍼선 1 더)" }
  - { name: USB 선, note: 배선할 때는 빼 두기. 서보가 많으면 5V 외부 전원도 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "초음파 · OLED · 서보는 보드에 바로 꽂아요. 초음파 VCC → 5V · GND → GND · Trig → io13 · Echo → io12 (위쪽 한 줄), OLED GND · VCC · SDA · SCL → I2C 묶음 GND · 5V · SDA · SCL, 서보 플러그 → ANALOG io4 줄 (갈색 G · 빨강 V · 주황 S). 버튼만 브레드보드 가운데 홈에 걸쳐 2 · 4번 줄에: io14 → 4번 줄, 대각선 다리 2번 줄 → io14 기둥 G"
  captionDevkit: "보드 VIN(5V) · GND 를 브레드보드 + − 줄에 잇고, 초음파 VCC · 서보 빨강은 + 줄, 초음파 GND · 서보 갈색은 − 줄에. 초음파 Trig → D13 · Echo → D12, 서보 주황 → D4. 버튼은 가운데 홈에 걸쳐 8 · 10번 줄: D14 → 8번 줄, 대각선 다리 10번 줄 → − 줄. OLED VCC → 3V3 · GND → GND · SDA → D21 · SCL → D22"
principle:
  image: images/relative-frequency.svg
  body: |
    **확률** `random.randint(1, 2)` 는 1 과 2 를 똑같은 기회로 골라요. 두 가지 중 하나이니 당첨(1)이 나올 확률은 **1/2** 이에요. 그런데 10번만 해 보면 7번 당첨처럼 치우칠 수 있어요. 횟수를 수십, 수백 번으로 늘리면 **당첨 횟수 ÷ 전체 횟수(상대도수)** 가 1/2 에 점점 가까워지는데, 이것을 **큰 수의 법칙**이라고 해요.

    **소리의 속력** 초음파는 1초에 약 340m 를 가요. 손까지 갔다가 **돌아온** 시간을 재므로, 그 절반에 속력을 곱해야 손까지의 거리예요(거리 = 속력 × 시간). 그래서 `get_distance()` 안에서 시간을 2 로 나눠요.
goals:
  content: 버튼을 누르면 무작위 수(1~2)를 뽑고, 손이 20cm 안에 있을 때만 서보 망치를 당첨 90° · 꽝 50° 로 움직였다가 180° 로 되돌린다
  thinking: 여러 센서를 "알아야 · 정해야 · 움직여야" 로 묶어 기계 흐름을 설계하고, 기록표로 확률과 상대도수를 비교한다
successCriteria:
  - 기록표에 20번 결과를 적고, 상대도수를 구해 1/2 과 비교해 설명할 수 있다
  - 거리 · 버튼 두 조건이 모두 참일 때만 망치가 움직이게 할 수 있다
  - 망치를 180° 로 되돌리는 줄이 어디에 있어야 하는지 설명할 수 있다
  - 당첨 확률을 1/3 로 바꾸는 흐름을 우리말 설계도로 쓰고 코드로 옮길 수 있다
parts:
  - id: part1
    title: 1부 · 운에 맡기는 버튼 (확률)
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 운에 맡기면 정말 공평할까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 손을 넣고 버튼을 누르면 망치가 당첨(90°)에서 멈출까, 꽝(50°)까지 내려올까?
        body: |
          점심 메뉴나 발표 순서를 못 정할 때 우리는 가위바위보, 사다리 타기, 제비뽑기로 **운에 맡겨요**. 모두가 결과를 받아들이려면 누구에게나 기회가 **똑같아야** 해요.

          오늘은 손을 넣으면 망치가 운에 따라 멈추거나 내려치는 "복불복 망치"를 만들어요. 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없어요.
        todo:
          - 준비물(버튼, 초음파 센서, 서보, OLED, 종이컵 · 나무젓가락)을 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
        questions:
          - 점심 메뉴를 못 고를 때, 공정하게 운에 맡기는 기계를 만들 수 있을까요? "공정하다"는 무슨 뜻일까요?
          - 당첨과 꽝이 반반인 기계로 20번 하면 당첨은 꼭 10번 나올까요?
          - 손이 망치 아래에 있는지 기계는 어떻게 알 수 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서 묶기 세 칸
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 움직여야 할 것. 센서마다 나눠 적어요
        body: |
          이 기계는 부품이 넷이에요. **초음파 센서**와 **버튼**은 알아차리고, **서보**와 **화면**은 움직이고 보여 줘요. 그 사이에서 "몇 cm 안이면 손으로 볼지", "몇 도까지 내려칠지"는 사람이 정해 줘야 해요.

          활동 칸의 세 칸에 센서별로 하나 이상 적어 보세요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 초음파 센서와 버튼이 알려 주는 것 적기"
          - "**정해야 할 것**: 거리 기준, 뽑을 수의 범위, 당첨 · 꽝 각도 적기"
          - "**움직여야 할 것**: 서보 · 화면 · 소리가 할 일 적기"
        answer:
          know: ["손이 센서에서 몇 cm 떨어져 있는지 (20cm 이하면 손이 있다)", "버튼이 눌렸는지 (풀업이라 누르면 0)"]
          decide: ["1~2 중 무작위로 뽑기 (1 = 당첨, 2 = 꽝)", "당첨이면 90°, 꽝이면 50° 까지", "1초 뒤 180° 로 되돌리기", "몇 번까지 칠 수 있게 할지"]
          act: ["서보 망치를 정한 각도로 움직이기", "화면에 WIN 또는 FAIL 띄우기 (출력 창에 글 찍기)", "당첨 · 꽝 소리 내기 (부저)"]

      - id: predict
        type: predict
        title: 예측하기 — 20번 하면 당첨은 몇 번?
        minutes: 5
        scene:
          image: images/relative-frequency.svg
          caption: 적게 하면 들쭉날쭉, 많이 하면 1/2 쪽으로. 내 예측은?
        body: |
          아직 실행하지 않아요. `random.randint(1, 2)` 는 1 부터 2 까지 정수 중 하나를 **아무렇게나** 골라요. 끝의 수 2 도 나올 수 있어요.

          코드를 따라 읽고, 버튼을 누를 때마다 무엇이 찍힐지 생각해 빈칸에 내 예측을 적어요. 20번 중 당첨 횟수는 숫자 하나로 적어요.
        todo:
          - "`if button.value() == 0:` 이 무엇을 묻는지 읽기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_random.py
        blanks:
          - q: 버튼을 누르지 않고 가만히 두면 출력 창에는 무엇이 찍힐까요?
          - q: 버튼을 20번 누르면 1 은 몇 번쯤 나올까요?
            unit: 번
          - q: 이 코드에서 3 이 찍힐 수 있을까요? 왜 그렇게 생각하나요?

      - id: run
        type: run
        title: 복사 · 실행 — 버튼으로 수 뽑기
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "1부에서는 버튼만 써요: 버튼을 가운데 홈에 걸쳐 2 · 4번 줄에 꽂고 io14 → 4번 줄, 대각선 다리 2번 줄 → io14 기둥 G"
          captionDevkit: "1부에서는 버튼만 써요: 버튼을 가운데 홈에 걸쳐 8 · 10번 줄에 꽂고 D14 → 8번 줄, 대각선 다리 10번 줄 → − 줄, 보드 GND → − 줄"
        body: |
          1부에서는 **버튼만** 꽂아요. 버튼을 가운데 홈에 걸쳐 꽂고, 한쪽 다리 줄은 **14번** 핀에, 대각선 반대쪽 다리 줄은 **GND** 에 이어요. 배선 그림과 아래 표처럼 꽂으면 돼요. 나머지 부품은 2부에서 꽂아도 돼요.

          실행한 뒤 버튼을 한 번씩 눌러 출력 창에 찍히는 수를 보세요. 1 이 나오면 당첨, 2 가 나오면 꽝이라고 정해요.
        todo:
          - USB 를 뺀 채 버튼을 꽂고 14번 · GND 선 잇기
          - "**보드 연결** → **실행** 누르기"
          - 버튼을 10번 눌러 보고 1 과 2 가 몇 번씩 나왔는지 세기
        code: step1_random.py
