            fail: 부저는 몇 번 핀에 꽂았나요? 소리 나는 부저를 그 핀에 준비했나요?
          - codeMatches: '\.duty\(512\)[\s\S]*\.duty\(512\)'
            fail: 당첨일 때와 꽝일 때 모두 소리가 나나요? 두 자리에 음을 하나씩 넣었나요?
        answerCode: extra_sound.py

      - id: debug
        type: debug
        title: 디버깅 — 이상한 망치 세 대
        minutes: 8
        scene:
          image: images/game-flow.svg
          caption: 증상을 보고 흐름 그림에서 어느 칸이 문제인지 먼저 짚어요
        body: |
          고장 난 망치 코드 세 개예요. 셋 다 빨간 글씨(에러)는 뜨지 않아요. 바로 고치지 말고 **증상을 보고 흐름 그림의 어느 칸**이 문제인지 먼저 정해요.

          들여쓰기 한 칸, 숫자 하나가 기계를 바꿔요. 최소 4분은 혼자 해 봐요. 망치가 움직일 때 출력 창이 끊기고 처음부터 다시 찍히면 코드가 아니라 서보 전원 부족이니 선생님께 알려요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 처음 켜면 망치가 0° 쪽에 누워 있어요. 한 번 치기 전에는 올라오지 않아요
            code: |
              from machine import Pin, PWM
              import time
              import random

              trig = Pin(13, Pin.OUT)
              echo = Pin(12, Pin.IN)
              servo = PWM(Pin(4))
              servo.freq(50)
              servo.duty_u16(1638)
              button = Pin(14, Pin.IN, Pin.PULL_UP)


              def get_distance():
                  trig.value(1)
                  time.sleep_us(10)
                  trig.value(0)
                  while not echo.value():
                      pass
                  start = time.ticks_us()
                  while echo.value():
                      pass
                  stop = time.ticks_us()
                  t = time.ticks_diff(stop, start) // 2
                  return int(340 * t // 10000)


              time.sleep(2)
              while True:
                  d = get_distance()
                  if button.value() == 0 and d <= 20:
                      num = random.randint(1, 2)
                      if num == 1:
                          print("WIN")
                          servo.duty_u16(1638 + 90 * 6462 // 180)
                      elif num == 2:
                          print("FAIL")
                          servo.duty_u16(1638 + 50 * 6462 // 180)
                      time.sleep(1)
                      servo.duty_u16(1638 + 180 * 6462 // 180)
                  time.sleep_ms(100)
