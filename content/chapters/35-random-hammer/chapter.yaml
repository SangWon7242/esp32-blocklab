          caption: 당첨은 높은 소리, 꽝은 낮은 소리로
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 수동 부저를 브레드보드에 꽂고 + 다리 줄을 **25번**에, − 다리 줄을 **GND** 에 이어요(준비물 칸의 수동 부저 설명처럼). 당첨이면 높은 소리, 꽝이면 낮은 소리가 나게 해 봐요.

          S9 멜로디 챕터의 "Hz 음을 초 울리기" 블록을 쓰면 돼요. 몇 Hz 가 높은 소리였나요?
        todo:
