<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rhw-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rhw-title">브레드보드 배선도: ESP32 5V → 위 + 줄, GND → 위 − 줄. 초음파 센서는 M-F 듀폰선으로 VCC → + 줄, Trig → 5번 줄 a 칸, Echo → 6번 줄 a 칸, GND → − 줄. OLED 는 GND → − 줄, VCC → + 줄, SCL → 15번 줄 a 칸, SDA → 16번 줄 a 칸. 서보 플러그는 점퍼선으로 갈색 → − 줄, 빨강 → + 줄, 주황 → 22번 줄 a 칸. 버튼은 가운데 홈에 걸쳐 25번 · 27번 줄에, 27번 줄 b 칸 → − 줄. ESP32 13번 → 5번 줄 e 칸, 12번 → 6번 줄 e 칸, 22번 → 15번 줄 e 칸, 21번 → 16번 줄 e 칸, 4번 → 22번 줄 e 칸, 14번 → 25번 줄 j 칸</title>
