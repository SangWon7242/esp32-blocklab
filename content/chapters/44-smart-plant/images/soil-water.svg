<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sp-soil-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sp-soil-title">흙 속 물과 전기: 마른 흙에서는 두 탐침 사이로 전기가 잘 안 통해 값이 작고(약 900), 촉촉한 흙에서는 물이 길이 되어 전기가 잘 통해 값이 크다(약 2500). 0~4095 자를 구간으로 나눠 1500 보다 작으면 마름(물 주기), 크면 촉촉(그대로). 수위 센서는 500 보다 작으면 빈 통(펌프 멈춤)</title>
  <text x="24" y="32" font-size="16" font-weight="700" fill="currentColor" stroke="none">흙 속 물이 전기의 길이 돼요</text>

  <!-- 마른 흙 -->
  <rect x="24" y="56" width="180" height="128" rx="8" fill="#e9c891" stroke="#a07d4a"/>
  <g fill="#c4a06a" stroke="none"><circle cx="44" cy="150" r="6"/><circle cx="76" cy="166" r="5"/><circle cx="150" cy="160" r="7"/><circle cx="182" cy="140" r="5"/><circle cx="60" cy="110" r="4"/></g>
  <path d="M90 40 V150 M138 40 V150" stroke="#d4a72c" stroke-width="8"/>
  <path d="M100 120 h8 M120 120 h8" stroke="#e03131" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="114" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">마른 흙</text>
  <text x="114" y="224" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">전기가 잘 안 통해요 → 값 작음</text>

  <!-- 촉촉한 흙 -->
  <rect x="236" y="56" width="180" height="128" rx="8" fill="#8b5a2b" stroke="#5c3d1e"/>
  <g fill="#74c0fc" stroke="none" opacity="0.85"><circle cx="262" cy="150" r="7"/><circle cx="300" cy="120" r="6"/><circle cx="330" cy="160" r="8"/><circle cx="380" cy="130" r="6"/><circle cx="356" cy="96" r="5"/><circle cx="276" cy="96" r="5"/></g>
  <path d="M302 40 V150 M350 40 V150" stroke="#d4a72c" stroke-width="8"/>
  <path d="M308 110 H344 M308 128 H344" stroke="#ffd43b" stroke-width="4"/>
  <path d="M338 104 l6 6 -6 6 M338 122 l6 6 -6 6" stroke="#ffd43b" stroke-width="3"/>
  <text x="326" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">촉촉한 흙</text>
  <text x="326" y="224" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">물이 길이 돼요 → 값 큼</text>

  <!-- 뿌리로 물이 올라간다 -->
  <rect x="440" y="56" width="176" height="168" rx="10" fill="var(--card)"/>
  <path d="M528 160 V96" stroke="#2f9e44" stroke-width="4"/>
  <path d="M528 116 C508 108 498 92 502 78 C518 82 528 96 528 112 Z" fill="#69db7c" stroke="#2f9e44"/>
  <path d="M528 104 C548 96 558 80 554 66 C538 70 528 84 528 100 Z" fill="#69db7c" stroke="#2f9e44"/>
  <path d="M528 160 l-14 22 M528 160 l14 22 M528 160 V188" stroke="#8b5a2b" stroke-width="2.5"/>
  <path d="M548 186 V130" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M542 138 l6 -8 6 8" stroke="#1c7ed6" stroke-width="2"/>
  <text x="528" y="210" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">뿌리가 물을 빨아올려요</text>

  <!-- 0~4095 자를 구간으로 -->
  <text x="24" y="262" font-size="13" font-weight="700" fill="currentColor" stroke="none">흙 값</text>
  <rect x="80" y="248" width="180" height="24" rx="4" fill="#ffc9c9" stroke="none"/>
  <rect x="260" y="248" width="230" height="24" rx="0" fill="#d3f9d8" stroke="none"/>
  <rect x="490" y="248" width="126" height="24" rx="4" fill="#a5d8ff" stroke="none"/>
  <g font-size="13" font-weight="700" fill="#212529" stroke="none" text-anchor="middle">
    <text x="170" y="265">마름 → 물 주기</text>
    <text x="375" y="265">촉촉 → 그대로</text>
    <text x="553" y="265">물에 잠김</text>
  </g>
  <path d="M260 242 V278" stroke="#e03131" stroke-width="3"/>
  <g font-size="12" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="80" y="292">0</text><text x="260" y="292" fill="#e03131" font-weight="700">기준 1500</text><text x="616" y="292">4095</text>
  </g>
  <text x="24" y="330" font-size="13" font-weight="700" fill="currentColor" stroke="none">물통 값</text>
  <rect x="80" y="316" width="64" height="24" rx="4" fill="#ffc9c9" stroke="none"/>
  <rect x="144" y="316" width="472" height="24" rx="4" fill="#a5d8ff" stroke="none"/>
  <g font-size="13" font-weight="700" fill="#212529" stroke="none" text-anchor="middle">
    <text x="112" y="333">빈 통</text>
    <text x="380" y="333">물 있음 → 펌프를 돌려도 돼요</text>
  </g>
  <path d="M144 310 V346" stroke="#e03131" stroke-width="3"/>
  <text x="150" y="304" font-size="12" font-weight="700" fill="#e03131" stroke="none">500</text>
</svg>
