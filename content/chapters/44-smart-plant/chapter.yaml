      - id: app
        type: app
        title: 폰 앱 만들기 — AI 와 함께 내 화분 앱
        minutes: 20
        scene:
          image: images/cover.svg
          caption: 화면 설계 → 약속표 → 프롬프트 → AI 결과 붙여넣기 · 검사 → 보드에 저장 → 읽기 체크
        body: |
          이제 내 화분 앱을 만들어요. 먼저 화면에 **보여 줄 값**, **누를 버튼**, **바뀌는 모습**을 설계 칸에 적어요. 약속표에는 실행 4 코드가 내는 주소 둘이 있어요: 읽기 `/data`(soil, water), 명령 `/cmd?pump=on`.

          프롬프트를 복사해 AI 에 넣고, 돌아온 HTML 을 그대로 붙여 **검사**를 눌러요. 외부 스크립트 · 절대 주소가 섞이면 검사가 알려 주니 AI 에게 "외부 라이브러리 없이, 상대 주소로" 라고 다시 부탁해요. 통과하면 보드에 `index.html` 로 저장하고 폰에서 `/` 를 열어요.

          바뀌는 모습 칸에는 "물통 500 아래면 '물통을 채워요' 빨간 글" 처럼 사람에게 알릴 것을 적어요. 기준은 1부에서 잰 내 화분 값으로 바꿔도 돼요.
        todo:
          - 설계 칸 세 개에 한 줄씩 적고 프롬프트 복사하기
          - AI 가 준 HTML 을 붙여 넣고 **검사** 통과시키기 (걸리면 AI 에게 고쳐 달라고 하기)
          - 보드에 저장한 뒤 폰에서 열어 보고, 읽기 체크에 답하기
        api:
          - { path: "/data", method: "읽기", fields: ["soil", "water"], note: "2초마다 읽기. soil 은 흙 값, water 는 물통 값(0~4095 숫자, 클수록 촉촉 · 물이 많음)" }
          - { path: "/cmd?pump=on", method: "명령", note: "펌프를 1초 켜서 물 주기 (물통이 비었으면 안 켜져요)" }
        design:
          show: ["흙 값", "물통 값"]
          buttons: ["물 주기"]
          changes: ["흙 1500 아래면 '목말라요' 노란 칸", "물통 500 아래면 '물통을 채워요' 빨간 글"]
        promptTemplate: |
          ESP32 주소 {{ip}} 에서 {{data}} 를 2초마다 읽어 {{show}} 을(를) 폰 화면에 크게 보여 주고,
          버튼 {{buttons}} 을(를) 누르면 {{commands}} 를 요청하는 한 파일짜리 HTML 을 만들어 줘.
          {{changes}} 처럼 값이 기준보다 작으면 알림 글과 색을 바꿔 줘.
          외부 라이브러리 · 외부 스크립트 · 절대 주소 없이, 폰 화면에 맞게.
        checks:
          maxBytes: 12000
          mustUse: ["pump=on"]
        readcheck:
          - { kind: choice, q: "/data 에서 값을 가져오는 줄에 쓰인 것은?", options: ["fetch", "print", "import"], answer: 0, hint: "주소에 요청을 보내 답을 받는 자바스크립트 함수" }
          - { kind: choice, q: "/data 가 주는 JSON 에서 물통 값의 이름(키)은?", options: ["water", "soil", "pump"], answer: 0, hint: "약속표의 /data 줄 fields" }
          - { kind: text, q: "물통 값이 기준보다 작을 때 알림 글을 바꾸는 줄을 찾아 적어 보세요. AI 결과에 틀린 곳이 있었다면 어떻게 찾았나요?" }

      - id: reflect
        type: reflect
