# 교과 융합 트랙 F17 · 스마트 화분 — 흙이 마르면 스스로 물 주기. 토양 수분 센서(34) · 수위 센서(35) · 릴레이(26) + 미니 워터 펌프(5V) · OLED(I2C 21 · 22) · 폰 앱(WiFi).
# 센서 트랙 S10(13-clap-dial, 아날로그 값) · S18(21-oled) · S22(25-web-led) · S23(26-web-sensors), 융합 F12(39-sensor-board, WiFi 앱 · OLED) 의 코드 꼴을 묶었다. 형식 설명은 src/track/README.md
id: 44-smart-plant
order: 44
track: fusion
label: F17
prerequisites: [13-clap-dial, 21-oled, 25-web-led, 26-web-sensors, 39-sensor-board]
subjects: [과학, 실과]
sdg: [2, 6, 12]
sessions: 2
teacherNotes: |
  **핀 번호** 토양 수분 센서 S **34번**, 수위 센서 S **35번**, 릴레이 S **26번**, OLED SCL 22 · SDA 21(S18 과 같음). 2부에서 WiFi 를 켜면 ADC2 쪽 핀(0 · 2 · 4 · 12~15 · 25~27)은 아날로그 값을 못 읽으므로 두 센서는 1부부터 ADC1(32~39)에 꽂는다(디버깅 증상 2). 26번은 ADC2 지만 릴레이처럼 켜고 끄는 출력이라 WiFi 와 함께 써도 된다. 두 보드(Plus · DevKit) 모두 같은 번호다.

  **부품과 두 보드** 두 센서는 V 를 **3V3** 에 꽂는다. 5V 를 주면 흙이 아주 젖었을 때 34 · 35번에 3.3V 넘게 들어갈 수 있다. 릴레이 · 펌프 · OLED 는 5V. ESP32 Plus 확장 보드는 OLED 를 위 한 줄 SCL · SDA · 5V · GND 에, 릴레이 G · V · S 를 io26 기둥에 바로 꽂고(선은 기둥 옆 틈으로 들어와 핀 높이에서 옆으로), 릴레이 COM → 아래 줄 VIN, 두 센서 S → 아래 줄 io34 · io35, 두 센서 V · G 와 펌프 − 는 보드 아래 + − 줄 띠(3V3 · GND)에 꽂는다. 기본 보드(DevKit)는 보드 위에 + − 줄 띠를 둘 둔다 — 5V 띠(VIN · GND)는 릴레이 V · G · COM 과 펌프 − 와 OLED VCC, 3V3 띠는 두 센서 V · G. 두 띠의 − 줄은 점퍼로 잇는다. 펌프 빨강 선은 릴레이 **NO** 에, 검정 선은 GND 에 — 펌프 선은 나사 단자에 끝을 넣고 드라이버로 조인다(핀을 단 펌프는 브레드보드에 바로).

  **물과 전기 안전** 물통과 화분은 보드 · 브레드보드에서 **한 뼘 이상 떨어진 자리**(쟁반 위)에 두고, 보드는 물통보다 높은 곳에 둔다. 펌프는 **물통 안에 잠긴 채로만** 돌린다(물 밖에서 돌리면 금방 망가진다 — 미션의 NO WATER 가 이것을 막는다). 수위 센서는 줄무늬 판만 물에 넣고 핀 쪽은 마르게, 토양 수분 센서도 두 갈래 다리만 흙에 꽂는다. 배선을 바꿀 때는 USB 를 뺀다. 물을 쏟으면 USB 부터 빼고 닦은 뒤 완전히 마르면 다시 켠다. 호스 끝은 화분 흙 위에 테이프로 고정해 물이 튀지 않게 한다.

  **펌프 전원** 미니 워터 펌프(3~5V, 100~200mA)는 USB 의 5V 로 돌릴 수 있다. 펌프가 도는 순간 보드가 다시 켜지면(Brownout) 짧고 굵은 USB 선으로 바꾸거나, 5V 와 GND 사이에 100µF 커패시터를 단다(「왜 그럴까」 카드). 펌프를 따로 건전지로 돌릴 때는 건전지 − 와 보드 GND 를 잇고, **USB 와 건전지를 함께 보드 5V 에 넣지 않는다**. 릴레이 모듈은 5V 용(SRD-05VDC)이다 — 26번의 3.3V 신호로 대부분 잘 붙지만 철컥 소리가 안 나면 릴레이 V 가 5V 인지 확인한다.

  **기준값은 예시** 마름 기준 1500 · 빈 통 기준 500 은 예시다. 흙 종류 · 센서마다 값이 다르므로 1차시 실행에서 마른 흙 · 물을 준 흙 · 물컵에 담갔을 때 흙 값과, 빈 통 · 반쯤 · 가득일 때 물통 값을 공책에 적고 그 **사이**로 다시 정한다. 미션 판정은 기준 숫자를 보지 않으므로(두 자리~네 자리) 교실에서 정한 값으로 바꿔도 된다. 흙 센서 값은 물을 준 뒤 몇 초~몇십 초 걸려 오르므로 "조금 주고 기다렸다 다시 재기"(설계)를 꼭 짚는다. 토양 수분 센서 다리는 전기가 흐르면서 조금씩 삭으니 수업이 끝나면 흙에서 빼 둔다.

  **web_accept 와 펌프** 2부 코드는 `web_accept` 에서 폰 요청을 기다리므로 **폰이 /data 를 읽을 때(2초마다)만 한 바퀴** 돈다. 그래서 펌프를 켠 채로 기다리면 폰을 닫는 순간 펌프가 멈추지 않는다(디버깅 증상 3). 2부 코드는 펌프를 늘 **1초만 켰다 끄는** 꼴로 쓴다. 폰을 닫으면 자동 물 주기도 멈추므로, 수업 뒤 교실에 화분을 두고 쓸 때는 1부 미션 코드(WiFi 없음)를 보드에 `main.py` 로 저장한다.

  **WiFi** 2부 코드의 `"MyWiFi"` · `"12345678"` 을 교실 공유기 이름 · 비밀번호로 바꾼다. 학교 WiFi 가 폰 ↔ 보드 통신을 막으면 WiFi 준비 블록을 **공유기 모드**(`ip = wifi_ap("ESP32-PLANT", "12345678")`)로 바꾸고 폰을 그 WiFi 에 붙인다. 보드가 출력하는 `IP: 192.168.x.x` 를 폰 브라우저 주소창에 친다. `주소/data` 를 치면 JSON 글이 그대로 보인다.

  **앱 만들기(AI)** 학생 AI 계정 · 연령 정책에 따라 교사가 프롬프트를 복사해 AI 에 넣고 결과를 보여 주는 시연으로 바꿀 수 있다. AI 결과에 외부 CDN · 스크립트 · 보드 IP 를 박은 절대 주소가 섞이면 붙여넣기 검사가 걸러 준다. 보드에 `index.html` 을 저장한 뒤에는 실행 4 코드(`step4_app_server.py`)가 돌아야 `/` 에서 앱이 열린다. 폰은 보드와 같은 WiFi 또는 보드의 공유기 모드에 붙인다.

  **교과 · 단원 연결**

  - 과학: 식물의 생활(뿌리 · 줄기 · 잎과 물의 이동, 증산), 물의 상태와 흙 속 물, 전기 회로(물이 있으면 전기가 잘 통한다 · 전자석)
  - 실과: 식물 가꾸기(물 주기 · 화분 관리), 생활 속 자동화 기기 만들기
  - 수학: 측정값을 표로 정리하고 구간(마름 · 촉촉 · 물에 잠김)으로 나누기, 하루 동안의 흙 값 꺾은선그래프
  - SDG 2(기아 종식 — 스마트 농업) · SDG 6(깨끗한 물 — 물 아껴 쓰기) · SDG 12(책임 있는 소비): 필요할 때 필요한 만큼만 물 주기

  **활동** 같은 화분 둘을 두고 하나는 정해진 시간마다 사람이 물을 주고, 하나는 스마트 화분이 준다. 일주일 동안 쓴 물의 양(물통 눈금)과 식물 키를 표에 적어 비교한다. 쉬는 시간마다 흙 값을 폰에서 읽어 꺾은선그래프로 그리면 흙이 마르는 빠르기가 보인다.

  **메이킹** 페트병을 잘라 물통을 만들고, 종이컵 · 요구르트 병에 흙을 담아 화분으로 쓴다. 호스는 빨대에 끼워 화분 가장자리에 고정한다. 보드와 브레드보드는 박스지 상자 위(물보다 높은 곳)에 붙인다.

  **차시 나누기**

  - 1차시: 문제 · 조건 분석 · 예측 · 실행 1(흙 · 물통 값을 OLED 로) · 읽기 체크 1 · 실행 2(릴레이와 펌프) · 통합 미션(물이 없으면 멈추고 알리기)
  - 2차시: 실행 3(폰 화분 페이지) · 읽기 체크 2 · 디버깅 · 설계(조금 주고 기다리기) · 실행 4(앱용 서버) · 앱 만들기 · 성찰
  - 시간이 모자라면 디버깅 증상 3 과 설계를 앱 만들기 뒤로 미루거나 숙제로 돌린다
title: 스마트 화분
subtitle: 흙이 마르면 스스로 물 주기 — 토양 수분 · 수위 센서, 릴레이와 펌프, OLED 와 폰 앱
summary: |
  화분 흙이 마르면 식물이 시들어요. 누가 대신 흙을 살펴보고 물을 줄 수 있을까요? 오늘은 **토양 수분 센서**로 흙이 촉촉한지 재고, 마르면 **릴레이**로 **미니 워터 펌프**를 켜서 물통의 물을 화분에 줘요. **수위 센서**가 물통이 빈 것을 알아채면 펌프를 멈추고 OLED 로 알려요.
  2부에서는 **WiFi** 로 폰에서 흙 값 · 물통 값을 보고 물 주기 버튼을 눌러요. 마지막에는 AI 와 함께 "목말라요" 를 보여 주는 내 화분 앱을 만들어 보드에 올려요.
