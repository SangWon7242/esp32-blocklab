  captionDevkit: "보드 위에 + − 줄 띠 둘: 5V 띠(VIN → + 줄, 위 줄 GND → − 줄), 3V3 띠(3V3 → + 줄), 두 띠 − 줄은 점퍼. 릴레이 G · V → 5V 띠, S → D26, COM → 5V 띠 + 줄, NO → 펌프 빨강(+), 펌프 검정(−) → 5V 띠 − 줄. 수위 센서 S → D35, 토양 수분 센서 S → D34, 두 센서 V · G → 3V3 띠. OLED 는 보드 아래: GND · SDA · SCL → 아래 줄 GND · D21 · D22, VCC → 보드 바깥 길로 5V 띠 + 줄"
  captionExpansion: "JUMP 점퍼는 5V 쪽 (릴레이가 V 줄 5V 를 써요). 두 센서 G · V → 왼쪽 위 전원 헤더 GND · 3V (3V 핀은 점퍼와 상관없이 3.3V), 토양 수분 센서 S → P34 칸 S, 수위 센서 S → P35 칸 S. 릴레이 G · V · S → P26 칸 G · V · S, COM ← 위 줄 5V 칸 S, NO → 펌프 빨강(+), 펌프 검정(−) → 위 줄 GND 칸 S. OLED 네 핀 → I2C 헤더 GND · VCC · D21 · D22"
principle:
  image: images/soil-water.svg
  body: |
    식물은 **뿌리**로 흙 속 물을 빨아올려 줄기를 거쳐 잎까지 보내요(물의 이동). 흙이 마르면 뿌리가 물을 얻지 못해 잎이 시들어요. 토양 수분 센서는 흙에 꽂은 **두 갈래 다리** 사이로 전기를 흘려 봐요. 물은 전기의 길이 되므로 흙이 **촉촉할수록 전기가 잘 통하고**(저항이 작고) 값이 커져요. 수위 센서도 같은 원리로, 줄무늬 판이 물에 많이 잠길수록 값이 커져요.

    보드는 그 전기를 **0~4095** 숫자로 읽어요. 이 숫자 자를 **구간**으로 나누면(마름 · 촉촉 · 물에 잠김) 기준값 하나로 "물을 줄까?" 를 정할 수 있어요. 흙 값이 1500 보다 작으면 마름, 물통 값이 500 보다 작으면 빈 통처럼요.

    펌프는 보드 핀의 작은 전기(3.3V)로는 돌지 않아요. **릴레이**는 작은 전기로 안의 **전자석**을 켜서 쇠 스위치를 철컥 붙이고, 그 스위치가 5V 의 큰 전기를 펌프에 이어 줘요(실행 2 의 릴레이 그림).
why: [motor-capacitor, wifi-capacitor]
goals:
  content: 토양 수분 센서와 수위 센서 값을 0~4095 로 읽어 OLED 에 보이고, 흙이 마르면 릴레이로 펌프를 켜되 물통이 비면 멈추고 알리며, WiFi 웹서버로 폰에 값을 보내고 폰 명령으로 물을 준다
  thinking: 화분을 알아야 할 것 · 정해야 할 것 · 움직여야 할 것으로 나누고, 아날로그 값의 구간을 기준값으로 나누는 까닭과 펌프를 조금 주고 기다리는 까닭을 코드와 숫자로 설명한다
successCriteria:
  - 흙이 촉촉할수록 토양 수분 센서 값이 커지는 까닭을 물과 전기의 길로 설명할 수 있다
  - 내 화분의 마른 흙 · 촉촉한 흙 값을 재서 마름 기준값을 정하고, 그보다 작으면 펌프가 켜지게 코드를 고칠 수 있다
  - 릴레이가 보드의 작은 전기로 펌프의 큰 전기를 켜는 원리를 COM · NO 로 말할 수 있다
  - 물통이 비면 펌프를 멈추고 NO WATER 를 알리도록 if · elif · else 의 차례를 정할 수 있다
  - 폰 브라우저로 화분 페이지를 열어 값을 읽고, AI 가 만든 앱에서 /data 와 /cmd?pump=on 을 쓰는 줄을 찾을 수 있다
parts:
  - id: part1
    title: 1부 · 흙을 재고 물을 주는 화분
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 화분은 누가 돌볼까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 토양 수분 센서가 흙이 마른 것을 알아채면 릴레이가 펌프를 켜서 물통의 물을 화분에 줘요
        body: |
          교실 화분은 주말이나 방학이 지나면 흙이 바싹 말라 시들어 있곤 해요. 그렇다고 날마다 물을 듬뿍 주면 뿌리가 썩고 물도 낭비돼요. 세계의 농장에서도 **필요할 때 필요한 만큼만** 물을 주는 스마트 농업으로 물을 아끼고 있어요.

          오늘 만들 스마트 화분은 흙이 마른 것을 스스로 알아채고 물을 줘요. 물통이 비면 펌프를 멈추고 사람에게 알려요. 코드를 보기 전에 질문마다 내 생각을 적어 봐요.
        todo:
          - 준비물(ESP32 보드, OLED, 토양 수분 · 수위 센서, 릴레이, 펌프와 호스, 물통 · 화분, 브레드보드, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장씩 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 흙이 말랐는지 사람은 어떻게 알아내나요? 기계는 무엇으로 알아낼 수 있을까요?
          - 물을 언제, 얼마나 주면 좋을까요? 너무 많이 주면 어떤 일이 생길까요?
          - 물통의 물이 다 떨어졌는데 펌프가 계속 돌면 어떻게 될까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 움직여야 할 것 순서로 센서마다 나눠요
        body: |
          스마트 화분에는 입력이 둘(흙 · 물통), 출력이 셋(펌프 · OLED · 폰 화면)이에요. 센서가 **알아내고**, 사람이 **기준을 정해 주면**, 펌프와 화면이 **움직여요**. 센서마다 어느 칸에 들어갈지 생각하며 나눠 봐요.

          - **알아야 할 것**: 두 센서가 알려 주는 값과 그 범위
          - **정해야 할 것**: 마름 기준, 빈 통 기준, 물을 주는 시간
          - **움직여야 할 것**: 펌프, OLED, 폰 화면이 할 일

          과학 시간에 배운 식물의 물의 이동을 떠올려 봐요. 뿌리가 물을 빨아들이는 데 시간이 걸리듯, 흙 값도 물을 준 뒤 천천히 올라요. 물을 한 번에 얼마나 줄지 짝과 이야기해 봐요.
        todo:
          - "**알아야 할 것**: 두 센서가 알아내는 값과 범위를 적기"
          - "**정해야 할 것**: 마름 기준 · 빈 통 기준 · 물 주는 시간 적기"
          - "**움직여야 할 것**: 펌프 · OLED · 폰 화면이 할 일 적기"
        answer:
          know: ["흙 값(0~4095, 34번) — 촉촉할수록 커요", "물통 값(0~4095, 35번) — 물이 많을수록 커요", "WiFi 를 쓰면 아날로그는 32~39번 핀"]
          decide: ["마름 기준: 흙 값이 1500 보다 작으면 마름(내 화분에서 재서 다시 정하기)", "빈 통 기준: 물통 값이 500 보다 작으면 물 없음", "물 주는 시간: 1초 주고 흙에 스며들 때까지 기다리기", "몇 초마다 잴지: 1초"]
          act: ["릴레이(26번)로 펌프 켜고 끄기", "OLED 에 SOIL · WATER · 상태(DRY · OK · NO WATER) 보이기", "물통이 비면 펌프를 멈추고 알리기", "폰 화면에 값과 물 주기 버튼"]

      - id: predict
        type: predict
        title: 예측하기 — 흙 값과 물통 값
        minutes: 3
        scene:
          image: images/soil-water.svg
          caption: 마른 흙은 전기가 잘 안 통해 값이 작고, 촉촉한 흙은 물이 길이 되어 값이 커요
        body: |
          활동 칸의 코드는 토양 수분 센서(34번)와 수위 센서(35번)를 준비하고, 1초마다 두 값을 읽어 출력 칸과 OLED 에 보여 줘요. 아직 실행하지 않아요.

          코드를 한 줄씩 읽고, 흙에 물을 주거나 수위 센서를 물에 담그면 숫자가 어떻게 바뀔지 먼저 적어 봐요. **내 예측을 먼저 적는 것**이 중요해요.
        todo:
          - "`while True:` 아래에서 두 값을 읽는 줄 찾기"
          - OLED 에 쓰는 두 줄 찾기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_soil_oled.py
        blanks:
          - q: 흙에 물을 주면 SOIL 값은 커질까요, 작아질까요? 코드의 어느 줄을 보고 알았나요?
          - q: 수위 센서를 물통에 더 깊이 담그면 WATER 값은 어떻게 될까요?
          - q: OLED 의 두 숫자는 몇 초마다 바뀔까요?

      - id: run
        type: run
        title: 복사 · 실행 — 흙 값과 물통 값을 OLED 로
        minutes: 7
        scene:
          image: images/wiring-breadboard.svg
          caption: "1부 실행 1 에서는 OLED 와 두 센서만 먼저 꽂아요. 토양 수분 S → 아래 줄 io34, 수위 S → io35, 두 센서 V · G → + − 줄(3V3)"
          captionDevkit: "1부 실행 1 에서는 OLED 와 두 센서만 먼저 꽂아요. 수위 S → D35, 토양 수분 S → D34, 두 센서 V · G → 3V3 띠"
          captionExpansion: "1부 실행 1 에서는 OLED 와 두 센서만 먼저 꽂아요. 토양 수분 S → P34 칸 S, 수위 S → P35 칸 S, 두 센서 G · V → 전원 헤더 GND · 3V(3.3V)"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 OLED 와 두 센서를 먼저 꽂아요. 두 센서의 V 는 **3V3** 이에요. 릴레이와 펌프는 실행 2 에서 꽂아요. 두 센서 S 는 2부에서 WiFi 와 함께 쓸 수 있는 **32~39번** 핀이에요.

          실행되면 1초마다 출력 칸과 OLED 에 SOIL · WATER 값이 보여요. **마른 흙 · 물을 준 흙 · 물컵에 담갔을 때** 흙 값과, **빈 통 · 반쯤 · 가득일 때** 물통 값을 공책에 표로 적어 두세요. 미션에서 기준값을 정할 때 써요.
        todo:
          - "**부품과 배선**대로 OLED 와 두 센서 꽂기 (V 는 3V3)"
          - "**보드 연결** → **실행** 누르기"
          - 흙 값 셋 · 물통 값 셋을 공책 표에 적기
        code: step1_soil_oled.py
        expected: "코드를 실행하면 출력 칸에 `SOIL: 1234 WATER: 2880` 같은 줄이 1초마다 찍히고, OLED 에 `SOIL: 1234` 와 `WATER: 2880` 두 줄이 보여요. 토양 수분 센서를 젖은 흙에 꽂으면 SOIL 값이, 수위 센서를 물에 깊이 담그면 WATER 값이 커져요."
        codeNotes:
          - { line: 1, note: "핀 · I2C · 아날로그(ADC) 기능을 가져와요. OLED 는 `ssd1306`" }
          - { line: 5, note: "34번 핀에 토양 수분 센서를 준비해요 (5~7번 줄). 0~4095 로 읽어요" }
          - { line: 8, note: "35번 핀에 수위 센서를 준비해요 (8~10번 줄)" }
          - { line: 11, note: "21 · 22번에 OLED 를 준비해요 (11~12번 줄)" }
          - { line: 15, note: "흙 값을 읽어 `s` 에 담아요. 촉촉할수록 커요" }
          - { line: 16, note: "물통 값을 읽어 `w` 에 담아요. 물이 많을수록 커요" }
          - { line: 18, note: "OLED 를 지우고 두 값을 두 줄에 써요 (18~21번 줄)" }
          - { line: 22, note: "1초 쉬고 다시 재요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 1
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          반복 안에서 두 값을 읽어 `s` 와 `w` 에 담고, 그 값을 출력 칸과 OLED 에 써요. 줄 끝 주석에도 힌트가 있어요.

          답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - 준비 줄(5~12번 줄)에서 핀 번호 넷 찾기
          - "`oled.text` 줄 둘 찾기"
          - 세 문제에 답하고 **확인** 누르기
        code: step1_soil_oled.py
        questions:
          - { kind: number, q: "두 값을 몇 초마다 새로 읽나요?", answer: 1, hint: "반복 맨 끝에서 쉬는 줄의 숫자" }
          - { kind: choice, q: "흙이 촉촉해지면 흙 값 s 는?", options: ["커져요", "작아져요", "그대로예요"], answer: 0, hint: "s 를 읽는 줄의 주석" }
          - { kind: line, q: "OLED 에 물통 값을 쓰는 줄의 번호를 클릭하세요", answer: 20 }
        codeNotes:
          - { line: 15, note: "흙 값을 읽는 줄" }
          - { line: 17, note: "출력 칸에 두 값을 찍어요" }
          - { line: 21, note: "OLED 에 그린 것을 보여 줘요" }

      - id: run2
        type: run
        title: 복사 · 실행 2 — 릴레이와 펌프로 물 주기
        minutes: 7
        scene:
          image: images/relay-switch.svg
          caption: 26번이 1 이면 릴레이 안 전자석이 스위치를 당겨 COM 과 NO 가 붙고, 5V 가 펌프로 흘러요
        body: |
          이제 **릴레이**와 **펌프**를 꽂아요. 릴레이 입력 G · V · S 는 보드에(S 는 26번), 나사 단자 **COM** 은 5V(VIN)에, **NO** 는 펌프 빨강 선에, 펌프 검정 선은 GND 에 이어요. 펌프는 **물을 담은 물통 안**에 넣고, 호스 끝은 화분 흙 위에 고정해요.

          이번 코드는 흙 값 `s` 가 기준 1500 보다 작으면 OLED 에 DRY 를 쓰고 `relay.value(1)` 로 펌프를 켜요. 아니면 OK 를 쓰고 펌프를 꺼요. 마른 흙에 센서를 꽂으면 릴레이가 **철컥** 소리를 내며 붙고 물이 나와요. 1500 은 예시니 공책에 적은 내 화분 값 사이로 바꿔요.
        todo:
          - "**부품과 배선**대로 릴레이 · 펌프 꽂기 (펌프는 물통 안, 보드는 물에서 멀리)"
          - "**실행** 누르고 마른 흙 · 젖은 흙에 센서를 옮겨 꽂아 보기"
          - 펌프가 켜질 때 OLED 글자와 릴레이 불빛 확인하기
        code: step2_relay_pump.py
        expected: "코드를 실행하면 OLED 에 SOIL · WATER 값과 세 번째 줄 `DRY` 또는 `OK` 가 보여요. 흙 값이 1500 보다 작으면 `DRY` 가 보이고 릴레이가 철컥 붙으며 빨간 불이 켜지고 펌프가 물을 뿜어요. 흙이 젖어 값이 1500 을 넘으면 `OK` 로 바뀌고 펌프가 멈춰요."
        codeNotes:
          - { line: 11, note: "26번 핀을 내보내는(출력) 핀으로 정하고 `relay` 라고 이름 붙여요. 1 이면 펌프가 돌아요" }
          - { line: 22, note: "흙 값이 기준 1500 보다 작으면(말랐으면) 펌프를 켜요 (22~24번 줄)" }
          - { line: 25, note: "아니면(촉촉하면) OK 를 쓰고 펌프를 꺼요 (25~27번 줄)" }
          - { line: 29, note: "1초 쉬고 다시 재요. 그동안 펌프는 켜 둔 그대로예요" }

      - id: mission
        type: mission
        title: 통합 미션 — 물이 없으면 멈추고 알리기
        minutes: 10
        scene:
          image: images/soil-water.svg
          caption: 물통 값이 500 보다 작으면 빈 통이에요. 이때는 흙이 말라도 펌프를 켜지 않고 NO WATER 를 보여요
        body: |
          실행 2 의 화분은 물통이 비어도 흙이 마르면 펌프를 돌려요. 물 없이 도는 펌프는 금방 망가져요. 그래서 **물통 검사를 먼저** 하고, 물이 있을 때만 흙을 봐요. `if` · `elif` · `else` 세 갈래로 나누면 돼요.

          미션은 기능 체크리스트로 판정해요. 판정에서 걸린 항목은 되묻는 질문을 읽고 그 부분만 고쳐요. 수위 센서를 물 밖으로 꺼내 NO WATER 가 보이는지 꼭 시험해 봐요.
        todo:
          - "물통 값 `w` 가 기준(예 500)보다 작으면 `NO WATER` 를 쓰고 펌프를 끄는 `if` 를 맨 앞에 넣기"
          - "흙이 마른 것은 그 다음 `elif` 로, 둘 다 아니면 `else` 로"
          - 수위 센서를 물에서 꺼내 펌프가 멈추는지 확인하고 **채점하기** 누르기
