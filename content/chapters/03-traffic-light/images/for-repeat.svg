<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="inherit">
  <title>for 반복 개념도: 노란불 깜빡임 네 줄을 세 번 붙여 쓰면 12줄이 되지만, 반복 블록으로 묶으면 네 줄을 한 번만 쓰고 몇 번 할지는 숫자 하나로 정한다</title>
  <!-- 지금: 붙여 쓰기 -->
  <text x="160" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">지금: 같은 4줄을 붙여 쓰기</text>
  <g stroke="none">
    <rect x="60" y="52" width="200" height="80" rx="8" fill="#f2c200" fill-opacity="0.22"/>
    <rect x="60" y="142" width="200" height="80" rx="8" fill="#f2c200" fill-opacity="0.22"/>
    <rect x="60" y="232" width="200" height="80" rx="8" fill="#f2c200" fill-opacity="0.22"/>
  </g>
  <g fill="currentColor" stroke="none" opacity="0.32">
    <rect x="74" y="62" width="120" height="9" rx="4.5"/><rect x="74" y="80" width="80" height="9" rx="4.5"/><rect x="74" y="98" width="120" height="9" rx="4.5"/><rect x="74" y="116" width="80" height="9" rx="4.5"/>
    <rect x="74" y="152" width="120" height="9" rx="4.5"/><rect x="74" y="170" width="80" height="9" rx="4.5"/><rect x="74" y="188" width="120" height="9" rx="4.5"/><rect x="74" y="206" width="80" height="9" rx="4.5"/>
    <rect x="74" y="242" width="120" height="9" rx="4.5"/><rect x="74" y="260" width="80" height="9" rx="4.5"/><rect x="74" y="278" width="120" height="9" rx="4.5"/><rect x="74" y="296" width="80" height="9" rx="4.5"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="end" fill="currentColor" stroke="none">
    <text x="250" y="97">깜빡 1</text><text x="250" y="187">깜빡 2</text><text x="250" y="277">깜빡 3</text>
  </g>
  <text x="160" y="340" text-anchor="middle" font-size="14" fill="currentColor" stroke="none" opacity="0.8">4줄 × 3번 = 12줄</text>
  <!-- 가운데 화살표 -->
  <path d="M290 182 H346"/>
  <path d="M338 174 L348 182 L338 190"/>
  <text x="318" y="168" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">묶기</text>
  <!-- 묶으면: 반복 블록 -->
  <text x="472" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">묶으면: 4줄을 한 번만</text>
  <path d="M380 112 V250 H580 V272 H372 Q 364 272 364 264 V96 Q 364 88 372 88 H580 V112 Z" fill="#f4af18" fill-opacity="0.35" stroke-width="2"/>
  <text x="378" y="106" font-size="15" font-weight="700" fill="currentColor" stroke="none">?번 반복하기</text>
  <rect x="396" y="124" width="170" height="114" rx="8" fill="#f2c200" fill-opacity="0.22" stroke="none"/>
  <g fill="currentColor" stroke="none" opacity="0.32">
    <rect x="410" y="136" width="120" height="9" rx="4.5"/><rect x="410" y="162" width="80" height="9" rx="4.5"/><rect x="410" y="188" width="120" height="9" rx="4.5"/><rect x="410" y="214" width="80" height="9" rx="4.5"/>
  </g>
  <text x="480" y="300" text-anchor="middle" font-size="14" fill="currentColor" stroke="none" opacity="0.8">몇 번 할지는 숫자 하나로</text>
  <text x="480" y="322" text-anchor="middle" font-size="14" fill="currentColor" stroke="none" opacity="0.8">안쪽 줄은 한 칸 더 들여쓰기</text>
</svg>
