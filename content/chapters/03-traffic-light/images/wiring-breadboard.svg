  <title id="tlw-title">신호등 브레드보드 배선도: ESP32 13번 핀(파란 선) → 220Ω 저항 → 빨강 LED 긴 다리, 14번 핀(노란 선) → 220Ω 저항 → 노랑 LED 긴 다리, 16번 핀(초록 선) → 220Ω 저항 → 초록 LED 긴 다리. 세 LED 의 짧은 다리는 모두 검은 선으로 아래쪽 − 줄에 잇고, − 줄은 ESP32 GND 에 연결</title>
