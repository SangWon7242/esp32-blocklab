# 센서 트랙 S19 · RFID 카드 읽기 — 08(F1 출입 통제)의 1부(카드 번호 읽기·목록 비교)를 센서 트랙으로 뗀 챕터. Keyestudio KS5020 RFID 프로젝트 구조(13.56 MHz, UID 4바이트). 형식 설명은 src/track/README.md
# 미션 판정은 카드 번호를 \d+ 로 보아 학생마다 카드 번호(0~255 숫자 넷)가 달라도 통과한다. 목록 꼴·in 질문·OPEN/DENY·uid·0.5초 자리를 규칙 하나씩으로 본다
id: 22-rfid
order: 22
track: sensor
label: S19
prerequisites: [01-led]
subjects: [사회, 정보]
sessions: 1
teacherNotes: |
  **카드 번호 먼저** 미션 전에 학생이 실행(step1)으로 **자기 카드(또는 열쇠고리 태그) 번호를 먼저 읽어 공책에 적게** 하세요. 코드의 `[180, 180, 170, 219]` · `[231, 185, 101, 101]` 은 예시 번호예요. 미션 판정은 숫자 차이를 255 까지 봐주므로 자기 번호로 바꿔도 통과해요. 카드가 한 장뿐인 모둠은 두 번째 칸에 예시 번호를 그대로 두고, 숫자 하나를 일부러 바꿔 DENY 를 시험하게 해요.

  **배선** RFID SDA → 21, SCL → 22, G → GND, V → 5V. F1(08 출입 통제)과 같은 자리라 다음 챕터에서 그대로 서보만 더하면 돼요. 라이브러리 세 파일(`mfrc522_i2c.py` · `mfrc522_config.py` · `soft_iic.py`)은 실행할 때 블록랩이 함께 올려요. ImportError 가 뜨면 보드 파일 목록부터 봐요.

  **읽히는 거리** 카드는 리더 위 1~3 cm. 금속 책상 위나 휴대폰 케이스 안의 카드는 잘 안 읽힐 수 있어요. 카드를 대고 있으면 같은 번호가 여러 번 찍히기도 해요(디버깅 증상 3: 읽은 뒤 1초 기다리기).

  **기준값은 예시** 반복의 `0.5`초, 읽은 뒤 `1`초, 설계의 `0.1`초는 예시 값이에요. 교실에서 카드를 떼는 데 걸리는 시간을 재 보고 바꿔도 돼요.

  - 설계의 LED 는 2번 핀이에요. 보드에 따라 2번에 붙은 작은 LED 가 같이 켜질 수 있어요(정상)
  - 사회(출입·보안·개인정보): 카드 번호(UID)는 누구나 읽을 수 있고 복제도 쉬워서, 실제 출입문은 번호만 믿지 않고 암호 인증을 더 써요. 학생 카드 번호는 공책에만 적고 사진으로 올리지 않게 해요
  - 정보(리스트 비교): `==` 는 카드 한 장, `in` 은 목록 전체와 비교해요. F1 에서 같은 목록으로 서보 문을 열어요
title: RFID 카드 읽기
subtitle: 대기만 해도 읽히는 카드 번호
summary: |
  교통카드는 지갑 속에 넣은 채로 대기만 해도 "삑" 하고 읽혀요. 오늘은 **RFID 리더**로 카드마다 다른 **번호(숫자 4개)** 를 읽어 보고,
  그 번호가 **들여보낼 카드 목록** 안에 있으면 `OPEN`, 없으면 `DENY` 를 출력해요. 마지막에는 등록된 카드일 때만 LED 를 켜는 장치를 설계해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: RFID RC522 모듈, note: "I2C 방식. 핀 4개: SDA → 21 · SCL → 22 · G → GND · V → 5V" }
  - { name: IC 카드 또는 열쇠고리 태그, note: 카드마다 번호가 달라요. 짝과 한 장씩 }
  - { name: 브레드보드, note: "+ 줄(5V)·− 줄(GND)을 RFID 와 LED 가 함께 써요" }
  - { name: F-F 듀폰선, note: "2개. 양쪽 끝이 구멍인 선. RFID SDA · SCL 을 보드 21 · 22번 핀에 바로 이을 때" }
  - { name: M-F 듀폰선, note: "5개. 한쪽은 핀, 한쪽은 구멍인 선. RFID G · V 와 보드 5V · GND 를 브레드보드 − 줄 · + 줄에, 보드 2번을 7번 줄에 꽂을 때" }
  - { name: 점퍼선(M-M), note: "1개. LED 짧은 다리 줄(13번) → − 줄" }
  - { name: (설계) 빨강 LED 1개 · 220Ω 저항 1개, note: "2번 → 7번 줄 → 저항 → 12번 줄 LED 긴 다리, 짧은 다리 13번 줄 → − 줄" }
  - { name: USB 선, note: 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "RFID 모듈은 브레드보드 밖에: SDA → 21번 · SCL → 22번(F-F 선), G → − 줄 · V → + 줄(M-F 선). + 줄은 ESP32 5V, − 줄은 GND. (설계) 2번 → 7번 줄 → 220Ω 저항 → 12번 줄 LED 긴 다리, 짧은 다리 13번 줄 → − 줄"
principle:
  image: images/rf-principle.svg
  body: |
    RFID 리더는 안테나 코일로 **13.56 MHz** 전파를 계속 내보내요. 카드 안에는 건전지가 없지만, 카드 속 얇은 **코일 안테나**가 그 전파에서 전기를 얻어 칩을 깨우고, 칩에 새겨진 **번호(UID)** 를 같은 전파에 실어 돌려보내요. 그래서 지갑 속 교통카드도 몇 cm 안에만 오면 읽혀요.

    - 이 카드의 번호는 0~255 숫자 **4개**, 곧 **4바이트**예요. 카드마다 다르게 만들어져 나와요
    - 리더는 SCL(22번) · SDA(21번) 두 선으로 보드에 번호를 전해요. `0x28` 은 리더의 주소(이름표)예요
    - 번호를 **읽는 일**과 들여보낼지 **정하는 일**은 따로예요. 정하는 기준(카드 목록)은 사람이 코드에 적어요
goals:
  content: RFID 리더로 카드 번호(숫자 4개)를 읽고, 들여보낼 카드 목록과 in 으로 비교해 OPEN · DENY 를 출력한다
  thinking: 카드 번호를 "읽는 일"과 "들여보낼지 정하는 일"을 나누고, 정하는 기준(목록)을 사람이 정해야 하는 이유를 설명한다
successCriteria:
  - 건전지 없는 카드가 리더와 번호를 주고받는 방법을 전파 · 코일로 설명할 수 있다
  - 내 카드 번호를 읽어 적고, 그 번호가 숫자 몇 개로 되어 있는지 말할 수 있다
  - 카드 목록을 [[…], […]] 꼴로 만들고 in 으로 비교해 OPEN · DENY 를 출력할 수 있다
  - 카드 번호만으로 출입을 정할 때 생길 수 있는 보안 · 개인정보 문제를 한 가지 말할 수 있다
parts:
  - id: part1
    title: 카드 번호 읽고 목록과 비교하기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 교통카드는 왜 대기만 해도 읽힐까?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 카드를 리더 가까이 대기만 했는데 출력 칸에 숫자 4개가 찍혀요
        body: |
          버스에 타면서 지갑째 카드를 대도 "삑" 하고 요금이 나가요. 카드를 꽂지도 않았고, 카드에는 건전지도 없어요.

          리더는 카드에서 무엇을 알아낼까요? 아직 코드도 부품도 없어요. 활동 칸의 질문에 **내 생각을 한두 문장**으로 적어 보세요. 틀려도 괜찮아요.
        todo:
          - 준비물(RFID 모듈, 카드, 선, 브레드보드)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장씩 적기
          - 다 적으면 **완료** 누르기
        questions:
          - 교통카드는 지갑 속에 넣은 채로 대기만 해도 읽혀요. 건전지도 없는 카드가 어떻게 리더와 이야기할까요?
          - 카드마다 다른 번호는 카드의 어디에 있을까요? 그 번호는 바뀔 수 있을까요?
          - 출입문이 "들여보낼 카드"를 알아보려면 무엇을 미리 정해 두어야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "등록된 카드면 OPEN" 을 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "등록된 카드"라는 말을 몰라요. 리더가 읽은 **숫자 4개**와 사람이 적어 둔 **번호 목록**을 비교할 뿐이에요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 번호를 읽는 일과 들여보낼지 정하는 일을 나눠 생각하면 쉬워요.
        todo:
          - "**알아야 할 것**: 보드가 바깥에서 알아내야 하는 것 적기"
          - "**정해야 할 것**: 사람이 미리 정해 둬야 하는 것 적기"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["카드가 리더에 닿았는지", "그 카드의 번호(숫자 4개)", "리더가 몇 번 핀에 이어졌는지 (SCL 22번, SDA 21번)"]
          decide: ["들여보낼 카드 번호 목록", "몇 초마다 카드를 볼지"]
          act: ["카드 번호 읽기", "번호가 목록 안에 있는지 비교하기", "OPEN 또는 DENY 출력하기", "이것을 끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 카드를 대면 무엇이 찍힐까?
        minutes: 3
        scene:
          image: images/rf-principle.svg
          caption: 리더의 전파에서 전기를 얻은 카드가 번호를 돌려줘요. 그러면 출력 칸에는 무엇이 찍힐까요?
        body: |
          활동 칸의 코드는 카드가 오면 번호를 출력하기만 해요. 아직 실행하지 않아요.

          `card_present()` 는 "카드가 왔고 번호까지 읽었는지", `card_uid()` 는 "읽은 번호"를 알려 줘요. 둘 다 **RFID 준비하기** 블록이 함께 만들어 주는 함수예요. 그림을 보고 내 예측을 먼저 적어요.
        todo:
          - 코드를 위에서부터 한 줄씩 소리 내어 읽기
          - "`if card_present():` 아래 줄이 언제 실행될지 생각하기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_read_uid.py
        blanks:
          - q: 카드를 대면 출력 칸에 숫자가 몇 개 찍힐까요?
            unit: 개
          - q: 카드를 대지 않을 때는 출력 칸에 무엇이 나올까요?
          - q: 짝의 카드를 대면 내 카드와 같은 숫자가 나올까요? 왜 그렇게 생각하나요?

      - id: run
        type: run
        title: 복사 · 실행 — 내 카드 번호 읽기
        minutes: 7
        scene:
          image: images/wiring-breadboard.svg
          caption: "지금은 RFID 만: SDA → 21번 · SCL → 22번, G → − 줄 · V → + 줄. + 줄은 5V, − 줄은 GND"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 RFID 모듈을 이어요. SDA · SCL 은 F-F 선으로 보드 21 · 22번에 바로, G · V 는 M-F 선으로 브레드보드 − 줄 · + 줄에 꽂아요. LED 는 설계 단계에서 꽂아도 돼요.

          RFID 는 혼자 말하지 못해서 **라이브러리 파일 3개**가 보드에 있어야 해요. 실행하면 블록랩이 함께 올려 줘요. 카드를 리더 위 1~3 cm 에 대 보고, 찍힌 숫자를 **공책에 꼭 적어 두세요.** 미션에서 쓸 내 카드 번호예요.
        todo:
          - USB 를 뺀 채 RFID 4선(SDA · SCL · G · V) 잇기
          - "**보드 연결** → **실행** 누르고 내 카드와 짝의 카드를 대 보기"
          - 찍힌 두 카드 번호를 공책에 적고 예측과 비교하기
        code: step1_read_uid.py
        expected: 코드를 실행하고 카드를 리더에 대면 출력 칸에 `[180, 180, 170, 219]` 처럼 숫자 4개가 든 목록이 찍혀요. 카드마다 숫자가 다르고, 카드를 대지 않을 때는 아무것도 찍히지 않아요.
        codeNotes:
          - { line: 2, note: "RFID 라이브러리(`mfrc522_i2c.py`)에서 `mfrc522` 를 가져와요" }
          - { line: 4, note: "SCL 22번 · SDA 21번 · 주소 `0x28` 로 리더를 준비하고 `rc522` 라고 이름 붙여요" }
          - { line: 5, note: "`PCD_Init()`: 리더를 켜고 카드를 읽을 준비를 해요" }
          - { line: 9, note: "새 카드가 왔고(`and`) 번호까지 읽었을 때만 참을 돌려줘요" }
          - { line: 13, note: "읽어 둔 번호 4개를 목록으로 꺼내 돌려줘요" }
          - { line: 16, note: "아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 17, note: "`card_present()` 가 참일 때, 곧 카드가 닿았을 때만 아래 줄을 실행해요" }
          - { line: 18, note: "`print(card_uid())`: 읽은 번호를 출력 칸에 찍어요" }
          - { line: 19, note: "0.5초 쉬었다가 다시 카드가 왔는지 봐요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          방금 실행한 코드를 **준비하는 줄**(4~5번 줄), **함수 두 개**, **되풀이하는 줄**로 나눠 읽어요. 복사한 코드를 설명할 수 없으면 다음으로 넘어가지 않는 게 오늘의 약속이에요.

          답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - "`rc522 = mfrc522(...)` 괄호 안 숫자 셋을 짚으며 읽기"
          - 카드가 없을 때 반복 한 바퀴가 어디를 지나가는지 따라가기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_read_uid.py
        questions:
          - { kind: number, q: "RFID 의 SDA 선은 보드의 몇 번 핀에 꽂아야 하나요?", answer: 21, hint: "괄호 안 순서는 (SCL 핀, SDA 핀, 주소)예요" }
          - { kind: choice, q: "카드를 대지 않았을 때 반복 한 바퀴에서 일어나는 일은?", options: ["빈 목록 [] 을 출력한다", "아무것도 출력하지 않고 0.5초 기다린다", "반복을 멈추고 끝난다"], answer: 1, hint: "if 의 질문이 거짓이면 들여 쓴 줄을 건너뛰어요" }
          - { kind: line, q: "카드 번호를 출력 칸에 보여 주는 줄의 번호를 클릭하세요", answer: 18 }
        codeNotes:
          - { line: 4, note: "리더를 준비해요. 괄호 안 순서는 (SCL 핀, SDA 핀, 주소)" }
          - { line: 9, note: "카드가 왔는지와 번호를 읽었는지, 두 가지를 모두 물어요" }
          - { line: 13, note: "읽어 둔 번호를 꺼내요" }
          - { line: 17, note: "카드가 닿았을 때만 들여 쓴 줄로 들어가요" }

      - id: mission
        type: mission
        title: 미션 — 목록에 있으면 OPEN, 없으면 DENY
        minutes: 8
        scene:
          image: images/uid-list.svg
          caption: 읽은 번호가 목록의 한 칸과 똑같으면 OPEN, 같은 칸이 없으면 DENY
        body: |
          이제 읽은 번호로 **들여보낼지 정해** 봐요. 카드 한 장이라면 `==` 로 비교하면 되지만, 친구가 늘어날 때마다 비교를 하나씩 더할 수는 없어요.

          대신 **들여보낼 카드 목록** `allowed` 를 만들고 "이 번호가 목록 **안에** 있니?"라고 물어요. 목록의 한 칸이 카드 **한 장의 번호(숫자 넷)** 예요. 공책에 적은 내 카드와 짝의 카드 번호를 넣어 보세요.
        todo:
          - 반복 앞에 카드 두 장이 든 목록 `allowed` 만들기
          - 읽은 번호를 `uid` 에 담아 출력하고, 목록 안에 있는지 묻는 갈림길 넣기
          - 실행해서 두 카드와 모르는 카드를 대 보고 **판정** 누르기
        instructions: "카드 번호를 읽어 uid 에 담고 출력한 뒤, 들여보낼 카드 목록 allowed 안에 있으면 \"OPEN\", 없으면 \"DENY\" 를 출력하세요. allowed 는 반복을 시작하기 전에 만들고, 카드 두 장의 번호(내 카드와 짝의 카드. 짝 카드가 없으면 예시 번호 [231, 185, 101, 101])를 넣어요. 0.5초 기다리기는 지금 자리에 그대로 둬요"
        hint: "목록 안에 목록이에요: [[숫자 4개], [숫자 4개]]. 판단 블록 중 \"…에 …이 들어 있는가\" 를 쓰면 `uid in allowed` 가 돼요"
        code: step1_read_uid.py
        rules:
          - codeMatches: '^allowed = \[\[\d+, \d+, \d+, \d+\], \[\d+, \d+, \d+, \d+\]\]'
            fail: allowed 의 한 칸이 카드 한 장(숫자 넷)인가요? 카드 두 장이면 칸은 몇 개여야 할까요?
          - codeMatches: 'print\("OPEN"\)\n\s*else:\n\s*print\("DENY"\)'
            fail: 목록에 있을 때와 없을 때 각각 무엇을 출력하나요? 글자는 대문자 그대로인가요?
          - codeMatches: '^\s+uid\s*=\s*card_uid\(\)$[\s\S]*?^\s+print\(uid\)$'
            fail: 읽은 번호를 uid 라는 이름에 담았나요? 담은 번호를 출력 칸에 보여 주나요?
          - codeMatches: '^\s+if uid in allowed\s*:'
            fail: 목록 안에 있는지 묻는 줄에서 무엇이 무엇 안에 있는지 묻나요? 담은 이름과 목록 이름이 그대로인가요?
          - codeMatches: '^allowed\s*=[\s\S]*^while True:'
            fail: allowed 목록은 반복이 시작되기 전에 한 번만 만들었나요?
          - codeMatches: '^    time\.sleep\(0\.5\)$'
            fail: 0.5초 기다리는 줄은 처음 자리 그대로 있나요? 카드가 없을 때도 그 줄을 지나가나요?
        answerCode: mission_open_deny.py

      - id: debug
        type: debug
        title: 디버깅 — 카드 리더가 이상해요
        minutes: 7
        scene:
          image: images/rf-principle.svg
          caption: "[] 만 쏟아지면 카드를 읽게 시켰는지부터, 내 카드인데 DENY 면 목록의 꼴부터, 여러 번 찍히면 기다리기부터 봐요"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 셋 다 빨간 에러 글씨 없이 이상하게만 굴어요. 그래서 출력 칸에 찍힌 것을 꼼꼼히 봐야 해요.

          공책에 적어 둔 내 카드 번호를 옆에 두고 시작해요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 카드를 대도 반응이 없고, 출력 칸에 [] 만 쉴 새 없이 쏟아져요
            code: |
              from mfrc522_i2c import mfrc522

              rc522 = mfrc522(22, 21, 0x28)
              rc522.PCD_Init()


              def card_present():
                  return rc522.PICC_IsNewCardPresent() and rc522.PICC_ReadCardSerial()


              def card_uid():
                  return rc522.uid.uidByte[0:rc522.uid.size]


              while True:
                  print(card_uid())
            question: card_uid() 는 번호를 새로 읽는 함수일까요, 읽어 둔 번호를 꺼내기만 하는 함수일까요? 카드를 읽으라고 시키는 블록은 어디 있나요? 반복은 한 바퀴마다 쉬어 가나요?
            rules:
              - codeMatches: '^\s+if card_present\(\):'
                fail: 번호를 꺼내기 전에 카드가 왔는지(번호를 읽었는지) 먼저 묻고 있나요?
              - codeMatches: '^\s+time\.sleep\('
                fail: 반복 한 바퀴마다 쉬는 틈이 있나요? 쉬지 않으면 출력 칸은 어떻게 될까요?
          - title: 공책에 적은 내 카드 번호를 그대로 넣었는데 DENY 만 나와요
            code: |
              import time
              from mfrc522_i2c import mfrc522

              rc522 = mfrc522(22, 21, 0x28)
              rc522.PCD_Init()


              def card_present():
                  return rc522.PICC_IsNewCardPresent() and rc522.PICC_ReadCardSerial()


              def card_uid():
                  return rc522.uid.uidByte[0:rc522.uid.size]


              allowed = ["180, 180, 170, 219", "231, 185, 101, 101"]
              while True:
                  if card_present():
                      uid = card_uid()
                      print(uid)
                      if uid in allowed:
                          print("OPEN")
                      else:
                          print("DENY")
                  time.sleep(0.5)
            question: 출력 칸에 찍힌 uid 는 대괄호 안에 숫자 넷이었어요. allowed 의 한 칸 한 칸은 무엇으로 감싸여 있나요? 숫자 넷이 든 목록과 따옴표로 감싼 글자 한 줄은 같은 값일까요?
            rules:
              - codeMatches: '^allowed = \[\[\d+, \d+, \d+, \d+\]'
                fail: allowed 의 한 칸이 숫자 넷이 든 목록인가요, 따옴표로 감싼 글자인가요?
          - title: 카드를 한 번 댔을 뿐인데 OPEN 이 여러 번 찍혀요
            code: |
              import time
              from mfrc522_i2c import mfrc522

              rc522 = mfrc522(22, 21, 0x28)
              rc522.PCD_Init()


              def card_present():
                  return rc522.PICC_IsNewCardPresent() and rc522.PICC_ReadCardSerial()


              def card_uid():
                  return rc522.uid.uidByte[0:rc522.uid.size]


              allowed = [[180, 180, 170, 219], [231, 185, 101, 101]]
              while True:
                  if card_present():
                      uid = card_uid()
                      print(uid)
                      if uid in allowed:
                          print("OPEN")
                      else:
                          print("DENY")
                  time.sleep(0.5)
            question: 카드를 대고 떼는 데 1~2초쯤 걸려요. 그동안 반복은 몇 바퀴 돌까요? 카드를 읽고 출력한 뒤, 어디에서 잠깐 기다리면 같은 카드를 또 읽지 않을까요?
            rules:
              - codeMatches: '^ {8}time\.sleep\((1|2|1\.\d+)\)$'
                fail: 카드를 읽은 뒤(카드가 있을 때 들어가는 덩어리 안, OPEN · DENY 갈림길 다음)에 기다리는 줄이 있나요? 몇 초면 카드를 뗄 수 있을까요?

      - id: design
        type: design
        title: 설계 — 등록된 카드면 LED 1초
        minutes: 6
        scene:
          image: images/breadboard-basics.svg
          caption: "LED 는 브레드보드에: 2번 → 7번 줄 → 220Ω 저항 → 12번 줄 긴 다리, 13번 줄 짧은 다리 → − 줄"
        body: |
          출력 칸의 OPEN 은 화면을 보는 사람만 알 수 있어요. 이번에는 등록된 카드를 대면 **LED 가 1초 켜졌다 꺼지게** 설계해요. 문 옆의 초록 불처럼요. 코드를 쓰기 전에 **우리말로 먼저!**

          USB 를 뺀 채 **부품과 배선**대로 2번 핀에 LED 와 저항을 꽂아요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "목록 안에 있으면"이 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: LED 를 __번 핀에 준비한다
            blank: { answer: 2 }
          - text: RFID 리더를 준비한다 (SCL 22번, SDA 21번)
          - text: 들여보낼 카드 번호를 __ 에 담는다
            blank: { answer: 목록(allowed) }
          - text: 끝없이 되풀이한다
          - text: "  ↳ 만약 카드가 리더에 닿았으면"
          - text: "    ↳ 만약 그 카드 번호가 목록 안에 있으면"
          - text: "      ↳ LED 를 켜고 __초 기다린 뒤 끈다"
            blank: { answer: 1 }
          - text: "  ↳ __초 쉬었다가 다시 본다"
            blank: { answer: 0.1 }
        translation:
          - ["LED 준비 (2번)", "led = Pin(2, Pin.OUT)"]
          - ["RFID 리더 준비", "rc522 = mfrc522(22, 21, 0x28) · card_present() · card_uid()"]
          - ["카드가 리더에 닿았으면", "if card_present():"]
          - ["카드 번호가 목록 안에 있으면", "if card_uid() in allowed:"]
          - ["LED 켜기 · 끄기", "led.value(1) · led.value(0)"]
          - ["초 기다린다", "time.sleep(초)"]
        targetCode: design_led.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 카드 번호를 읽고 목록과 비교했어요. 우리 생활의 어떤 카드가 같은 일을 할까요?
        body: |
          오늘은 건전지 없는 카드의 번호를 읽고, 사람이 정한 목록과 비교해 들여보낼지 정했어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 미션 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 솔직하게 적어요. 다 쓰면 짝에게 1분 동안 설명해 보세요.
