<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rfp-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rfp-title">RFID 원리: 리더의 안테나 코일이 13.56 MHz 전파를 보내면, 건전지 없는 카드의 코일 안테나가 그 전파에서 전기를 얻어 칩을 깨운다. 칩은 카드 번호(UID)를 전파에 실어 돌려보낸다. 카드 번호는 0~255 숫자 4개, 곧 4바이트다</title>
  <defs>
    <marker id="rfp-arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#e03131" stroke-width="2"/>
    </marker>
    <marker id="rfp-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2f9e44" stroke-width="2"/>
    </marker>
  </defs>
  <!-- 리더 -->
  <rect x="24" y="44" width="170" height="170" rx="10" fill="#1d4ed8"/>
  <rect x="40" y="60" width="138" height="120" rx="16" stroke="#bfdbfe" stroke-width="2.5"/>
  <rect x="54" y="74" width="110" height="92" rx="12" stroke="#bfdbfe" stroke-width="2.5"/>
  <rect x="68" y="88" width="82" height="64" rx="8" stroke="#bfdbfe" stroke-width="2.5"/>
  <text x="109" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" stroke="none">안테나 코일</text>
  <text x="109" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" stroke="none">리더</text>
  <!-- 전파 -->
  <g stroke="#4562f5" stroke-width="3">
    <path d="M206 96 A24 33 0 0 1 206 162"/>
    <path d="M222 82 A36 47 0 0 1 222 176" stroke-opacity="0.7"/>
    <path d="M238 68 A48 61 0 0 1 238 190" stroke-opacity="0.45"/>
  </g>
  <text x="236" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#4562f5" stroke="none">13.56 MHz 전파</text>
  <!-- 카드 -->
  <rect x="408" y="66" width="208" height="140" rx="12" fill="#f4af18" fill-opacity="0.25" stroke="#f4af18" stroke-width="2.5"/>
  <rect x="422" y="78" width="180" height="116" rx="10" stroke-width="2"/>
  <rect x="434" y="90" width="156" height="92" rx="8" stroke-width="2"/>
  <rect x="482" y="115" width="60" height="42" rx="4" fill="var(--card)" stroke-width="2"/>
  <path d="M482 127 h-8 M482 145 h-8 M542 127 h8 M542 145 h8" stroke-width="2"/>
  <text x="512" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">칩</text>
  <text x="512" y="228" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">카드: 건전지 없음, 코일 + 칩</text>
  <!-- 주고받기 -->
  <path d="M300 98 H396" stroke="#e03131" stroke-width="3" marker-end="url(#rfp-arrow-a)"/>
  <text x="348" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#e03131" stroke="none">① 전기를 줘요</text>
  <path d="M396 162 H300" stroke="#2f9e44" stroke-width="3" marker-end="url(#rfp-arrow-b)"/>
  <text x="348" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44" stroke="none">② 번호를 돌려줘요</text>
  <!-- UID -->
  <text x="40" y="274" font-size="15" font-weight="700" fill="currentColor" stroke="none">카드 번호(UID)</text>
  <g font-size="16" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">
    <rect x="170" y="252" width="70" height="36" rx="6" fill="var(--muted)" stroke="currentColor" stroke-width="1.5"/>
    <text x="205" y="276">180</text>
    <rect x="248" y="252" width="70" height="36" rx="6" fill="var(--muted)" stroke="currentColor" stroke-width="1.5"/>
    <text x="283" y="276">180</text>
    <rect x="326" y="252" width="70" height="36" rx="6" fill="var(--muted)" stroke="currentColor" stroke-width="1.5"/>
    <text x="361" y="276">170</text>
    <rect x="404" y="252" width="70" height="36" rx="6" fill="var(--muted)" stroke="currentColor" stroke-width="1.5"/>
    <text x="439" y="276">219</text>
  </g>
  <text x="488" y="276" font-size="14" fill="currentColor" stroke="none">= 4바이트</text>
  <text x="322" y="318" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">한 칸은 0~255 숫자 하나 (1바이트). 카드마다 달라요</text>
</svg>
