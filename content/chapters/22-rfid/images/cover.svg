<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rfc-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rfc-title">손에 든 카드를 RFID 리더 가까이 대자 리더에서 전파가 퍼지고, 카드는 건전지 없이 깨어나 번호를 돌려준다. 노트북 출력 칸에 카드 번호 숫자 4개 [180, 180, 170, 219] 가 찍힌다</title>
  <path d="M20 318 H620"/>
  <!-- 리더 -->
  <rect x="70" y="150" width="190" height="130" rx="10" fill="#1d4ed8"/>
  <rect x="92" y="166" width="120" height="84" rx="14" stroke="#bfdbfe" stroke-width="2.5"/>
  <rect x="104" y="178" width="96" height="60" rx="10" stroke="#bfdbfe" stroke-width="2.5"/>
  <rect x="116" y="190" width="72" height="36" rx="6" stroke="#bfdbfe" stroke-width="2.5"/>
  <circle cx="236" cy="180" r="6" fill="#2f9e44" stroke="#ffffff" stroke-width="1.5"/>
  <text x="165" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">RFID 리더</text>
  <rect x="96" y="280" width="138" height="38" fill="var(--muted)"/>
  <!-- 전파 -->
  <g stroke="#4562f5" stroke-width="3">
    <path d="M128 138 A40 22 0 0 1 204 138"/>
    <path d="M112 118 A58 32 0 0 1 220 118"/>
    <path d="M96 98 A76 42 0 0 1 236 98" stroke-opacity="0.55"/>
  </g>
  <!-- 손과 카드 -->
  <rect x="122" y="40" width="96" height="58" rx="8" fill="#f4af18"/>
  <rect x="134" y="52" width="26" height="20" rx="3" fill="#ffffff" fill-opacity="0.7" stroke-width="1.5"/>
  <path d="M184 56 h20 M184 66 h20 M184 76 h14" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M212 50 C230 44 250 48 264 60 L300 80 L288 104 L258 94 C246 108 226 112 210 102 C204 96 206 86 214 82 C206 76 204 60 212 50 Z" fill="var(--card)" stroke-width="2.5"/>
  <path d="M214 82 C222 80 232 82 238 88" stroke-width="2"/>
  <text x="300" y="66" font-size="14" fill="currentColor" stroke="none">대기만 해도 읽혀요</text>
  <!-- 노트북 출력 -->
  <rect x="340" y="120" width="250" height="160" rx="10" fill="var(--card)"/>
  <path d="M340 148 H590"/>
  <circle cx="358" cy="134" r="4" fill="var(--muted)"/>
  <circle cx="372" cy="134" r="4" fill="var(--muted)"/>
  <text x="400" y="139" font-size="13" fill="currentColor" fill-opacity="0.7" stroke="none">출력 칸</text>
  <g font-size="15" fill="currentColor" stroke="none">
    <text x="358" y="182">[180, 180, 170, 219]</text>
    <text x="358" y="210" fill-opacity="0.45">[180, 180, 170, 219]</text>
  </g>
  <rect x="352" y="226" width="226" height="40" rx="6" fill="var(--muted)" stroke="none"/>
  <text x="465" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">카드 번호 = 숫자 4개</text>
  <path d="M310 290 H590 L604 318 H296 Z" fill="var(--muted)"/>
  <path d="M262 214 H330 M322 207 L330 214 L322 221" stroke="#4562f5" stroke-width="2.5"/>
</svg>
