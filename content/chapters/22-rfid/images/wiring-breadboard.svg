<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rfw-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rfw-title">브레드보드 배선도: RFID RC522 모듈은 브레드보드 밖에 두고 F-F 듀폰선으로 SDA → ESP32 21번(초록), SCL → 22번(노랑)에 바로 잇는다. 모듈 G 는 M-F 듀폰선으로 브레드보드 − 줄, V 는 + 줄. + 줄은 빨간 선으로 ESP32 5V, − 줄은 검은 선으로 GND. 설계 단계 LED: ESP32 2번 파란 선 → 7번 줄 → 220Ω 저항 → 12번 줄 LED 긴 다리(+), 짧은 다리(−) 13번 줄 → − 줄</title>
