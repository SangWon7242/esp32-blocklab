  <title id="rgbw-title">브레드보드 배선도: RGB LED 다리 4개를 d 칸 14·16·18·20번 줄에 꽂는다(빨강 · GND 가장 긴 다리 · 초록 · 파랑). 빨강·초록·파랑 다리 줄마다 220Ω 저항이 가운데 홈을 건너 g 칸으로. ESP32 27번 노란 선 → 14번 줄, 25번 초록 선 → 18번 줄, 26번 파란 선 → 20번 줄. GND 다리 줄(16번)은 검은 선으로 위쪽 − 줄, − 줄은 검은 선으로 ESP32 GND</title>
