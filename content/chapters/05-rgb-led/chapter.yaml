      - id: extra1
        type: mission
        title: 추가 미션 1 — 내가 좋아하는 색 3가지
        optional: true
        minutes: 6
        scene:
          image: images/colour-mixing.svg
          caption: 내가 고른 색도 빨강·초록·파랑 세 숫자로 나타낼 수 있어요
        body: |
          그림판의 **색 편집**을 열면 고른 색의 빨강·초록·파랑(R·G·B) 값이 0~255 숫자로 나와요. 내가 좋아하는 색 세 가지의 숫자를 찾아 적어 봐요.

          그 세 색을 1초씩 차례로 보여 주도록 바꿔 보세요. 화면에서 본 색과 LED 색이 조금 다르게 보인다면, 왜 그럴까요?
        todo:
          - 그림판 색 편집에서 좋아하는 색 3가지의 R·G·B 숫자 찾아 적기
          - 반복 안을 색 3가지 × 1초로 바꾸기
          - 실행해서 색을 확인하고 **판정** 누르기
        instructions: 내가 좋아하는 색 세 가지를 1초씩 차례로 계속 보여 주세요
        code: step1_rgb_colors.py
        rules:
          - codeMatches: '(?:\n +set_color\([^\n]*\n +time\.sleep\(1\)){3}'
