      - id: mission
        type: mission
        title: 미션 — 4자리 비밀번호
        minutes: 10
        scene:
          image: images/password-list.svg
          caption: 누른 키를 리스트에 하나씩 모으고, 네 개가 되면 정답과 비교한 뒤 비워요
        body: |
          키는 한 번에 **하나씩** 들어와요. 네 자리를 한꺼번에 비교하려면 누른 키를 **리스트**에 모아 두어야 해요. 키패드가 주는 키는 숫자가 아니라 **글자**(`"5"`)예요.

          네 개가 모이면 정답 리스트와 비교해 맞으면 `OK`, 틀리면 `NO` 를 찍어요. 그다음 시도는 어떻게 받을까요? 키를 꾹 누르면 같은 키가 여러 번 들어가던 것도 떠올려 봐요. 블록이든 코드든 편한 쪽에서 고쳐요.
        todo:
          - 반복 밖에 정답 리스트와 누른 키를 모을 빈 리스트 만들기
          - 키가 눌리면 리스트에 넣고 잠깐 쉬기
          - 네 개가 모이면 비교해 OK / NO 를 찍고 리스트 비우기, 실행해 본 뒤 **판정** 누르기
        instructions: 키패드로 네 자리를 누르면 정답 비밀번호와 비교해, 같으면 출력 창에 OK, 다르면 NO 를 찍어 주세요. 비교한 뒤에는 다음 시도를 받을 수 있어야 해요
        hint: 정답 리스트 answer 와 빈 리스트 keys 를 반복 밖에 만들어요. 키가 눌리면 keys 에 넣고 0.3초 쉬어요. keys 의 길이가 4 가 되면 keys 와 answer 가 같은지 비교해 OK 나 NO 를 찍고, keys 를 다시 빈 리스트로 만들어요
        code: step1_keypad.py
        rules:
          - codeMatches: '^\w+ = \["[^"]+", "[^"]+", "[^"]+", "[^"]+"\]$'
            fail: 정답 비밀번호 네 자리를 담아 둔 리스트가 있나요? 키패드가 주는 키는 숫자일까요, 글자일까요?
          - codeMatches: '^\w+ = \[\]$'
            fail: 누른 키를 모아 둘 빈 리스트를 반복 밖에서 만들었나요? 반복 안에서 만들면 바퀴마다 어떻게 될까요?
          - codeMatches: '^\s+\w+\.append\(\w+\)$'
            fail: 키가 눌렸을 때 그 키를 리스트에 넣고 있나요? 어느 if 안에 넣어야 할까요?
          - codeMatches: '^\s+if len\(\w+\) (==|>=) 4:$'
            fail: 키가 몇 개 모였는지 언제 확인하나요? 네 개가 모이기 전에 비교하면 어떻게 될까요?
          - codeMatches: '^\s+if \w+ == \w+:$'
            fail: 모은 리스트와 정답 리스트를 통째로 비교하는 곳이 있나요?
          - codeMatches: 'print\("OK"\)[\s\S]*print\("NO"\)|print\("NO"\)[\s\S]*print\("OK"\)'
            fail: 맞으면 무엇을, 틀리면 무엇을 출력 창에 찍기로 했나요? 글자를 그대로 썼는지 보세요.
          - codeMatches: '^ {8,}\w+ = \[\]$|^\s+\w+\.clear\(\)$'
            fail: 한 번 비교한 뒤 모은 키는 어떻게 되나요? 두 번째 시도에서 리스트에는 몇 개가 들어 있을까요?
          - codeMatches: '^\s+time\.sleep\((0\.[2-9]\d*|[1-9](\.\d+)?)\)$|while keypad\.scan\(\)'
            fail: 키를 0.3초 꾹 누르고 있으면 반복은 몇 바퀴 돌까요? 그동안 같은 키가 리스트에 몇 번 들어갈까요?
        answerCode: mission_password.py

      - id: debug
        type: debug
        title: 디버깅 — 이상한 금고 세 개
        minutes: 8
        scene:
          image: images/keypad-matrix.svg
          caption: "증상부터 봐요: 같은 키가 여러 번? 두 번째부터 틀림? 안 눌렀는데 찍힘? 열 핀의 풀다운도 다시 봐요"
        body: |
          고장 난 금고 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 값이 제멋대로면 준비 줄과 배선부터, 횟수가 이상하면 반복 안을 봐요.

          셋 다 빨간 글씨(에러)는 뜨지 않아요. 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 키를 한 번 눌렀는데 같은 키가 여러 번 들어가요
            code: |
              import time
              from keypad import KeyPad

              keypad = KeyPad(26, 25, 17, 16, 27, 14, 12, 13)

              keys = []
              while True:
                  key = keypad.scan()
                  if key:
                      print(key)
                      keys.append(key)
                  time.sleep(0.05)
            question: 손가락이 키에 닿아 있는 0.3초 동안 반복은 몇 바퀴 돌까요? 그때마다 무엇을 하나요?
            rules:
              - codeMatches: '^\s+time\.sleep\((0\.[2-9]\d*|[1-9](\.\d+)?)\)$|while keypad\.scan\(\)'
                fail: 키를 받은 뒤 바로 다음 바퀴로 가면 손가락은 아직 키 위에 있지 않을까요? 한 번 받은 뒤 무엇을 기다려야 할까요?
          - title: 처음엔 OK 가 나왔는데, 그다음부터는 키 하나만 눌러도 NO 가 나와요
            code: |
              import time
              from keypad import KeyPad

              keypad = KeyPad(26, 25, 17, 16, 27, 14, 12, 13)

              answer = ["2", "0", "2", "6"]
              keys = []
              while True:
                  key = keypad.scan()
                  if key:
                      keys.append(key)
                      time.sleep(0.3)
                  if len(keys) >= 4:
                      if keys == answer:
                          print("OK")
                      else:
                          print("NO")
                  time.sleep(0.1)
            question: 첫 번째 비교가 끝난 뒤 리스트에는 몇 개가 남아 있나요? 다섯 번째 키를 누르면 리스트는 몇 칸이 될까요?
            rules:
              - codeMatches: '^ {8,}\w+ = \[\]$|^\s+\w+\.clear\(\)$'
                fail: 비교가 끝난 뒤에도 지난번 키가 리스트에 남아 있지 않나요? 비교한 다음 무엇을 해야 할까요?
          - title: 아무 키도 안 눌렀는데 키가 제멋대로 찍혀요
            code: |
              import time
              from keypad import KeyPad

              keypad = KeyPad(26, 25, 17, 16, 34, 35, 36, 39)

              while True:
                  key = keypad.scan()
                  if key:
                      print(key)
                  time.sleep(0.1)
            question: 열 핀 네 개는 몇 번인가요? 원리 그림에서 열 핀이 안 누를 때 0 을 지키려면 무엇이 필요했나요? 그 핀들에도 있을까요?
            rules:
              - codeMatches: 'KeyPad\(\d+, \d+, \d+, \d+, (?!3[4-9]\b)\d+, (?!3[4-9]\b)\d+, (?!3[4-9]\b)\d+, (?!3[4-9]\b)\d+\)'
                fail: 열 핀 가운데 안쪽 풀다운 저항이 없는 핀이 남아 있지 않나요? 선을 옮길 핀 번호와 준비 줄의 번호가 같은지도 보세요.

  - id: part2
    title: 2부 · IR 리모컨
    steps:
      - id: run2
        type: run
        title: 실행 2 — 리모컨 값 재기
        minutes: 8
        scene:
          image: images/ir-signal.svg
          caption: 리모컨이 보낸 안 보이는 빛을 수신기가 0 · 1 신호로 바꾸고, 라이브러리가 16진수 글자로 만들어요
        body: |
          IR 수신기를 브레드보드에 꽂아요. 둥근 머리를 보며 다리 셋(**OUT · G · V**)을 서로 다른 번호 줄에 꽂고, OUT 줄 → **5번** 핀, G 줄 → GND, V 줄 → **3V3** 으로 이어요. 줄 번호는 **부품과 배선**의 배선 그림과 아래 표를 봐요. 키패드는 꽂아 둔 채로 괜찮아요.

          실행한 뒤 리모컨을 수신기에 겨누고 버튼을 짧게 눌러요. 버튼마다 어떤 값이 나오는지 공책에 표로 적어 두세요. 설계 단계에서 이 값을 써요.
        todo:
          - USB 를 뺀 채 IR 수신기와 선 3개를 배선도대로 꽂기
          - 실행하고 버튼 다섯 개 이상을 눌러 값을 공책에 적기
          - 같은 버튼을 두 번 눌러 값이 같은지 확인하기
        code: step2_ir.py
        expected: 코드를 실행하고 리모컨 버튼을 짧게 누르면, 1초쯤 뒤 출력 창에 `0xff6897` 처럼 `0x` 로 시작하는 값이 찍혀요. 버튼마다 다른 값이 나오고, 누르지 않으면 아무것도 찍히지 않아요.
        codeNotes:
          - { line: 2, note: "IR 라이브러리에서 `irGetCMD` 를 가져와요" }
          - { line: 4, note: "5번 핀에 IR 수신기를 준비해요. 이름은 `ir`" }
          - { line: 6, note: "아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 7, note: "`ir.ir_read()` 로 받은 값을 `value` 에 담아요. 신호가 끝나고 조금 조용해야 값을 주고, 받은 게 없으면 `None`" }
          - { line: 8, note: "`value` 에 값이 있을 때만 바로 다음 줄을 해요" }
          - { line: 9, note: "받은 값을 출력 창에 찍어요" }
          - { line: 10, note: "0.1초 쉬고 다시" }

      - id: readcheck2
        type: readcheck
        title: 읽기 체크 — IR 리모컨
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 키패드 코드와 무엇이 같고 무엇이 다른지 비교하며 읽어요
        body: |
          키패드 코드와 모양이 거의 같아요. 다른 점은 준비 줄과 값을 읽는 줄, 그리고 값이 키 하나가 아니라 `0x` 로 시작하는 **긴 글자**라는 것이에요.

          공책에 적어 둔 값을 떠올리며 답해요.
        todo:
          - 키패드 코드와 다른 줄을 찾아 표시하기
          - 세 문제에 답하고 **확인** 누르기
        code: step2_ir.py
        questions:
          - { kind: choice, q: "리모컨 버튼을 누르지 않을 때 value 에 담기는 것은?", options: ["0", "None (없음)", "\"0x0\""], answer: 1 }
          - { kind: choice, q: "출력 창에 0xff02fd 처럼 찍히는 값은 어떤 꼴인가요?", options: ["버튼에 적힌 숫자", "16진수로 쓴 글자(문자열)", "켜짐 · 꺼짐"], answer: 1, hint: "앞에 0x 가 붙어 있어요" }
          - { kind: line, q: "IR 수신기를 준비하는 줄의 줄 번호를 클릭하세요", answer: 4 }
        codeNotes:
          - { line: 2, note: "IR 라이브러리를 가져와요" }
          - { line: 6, note: "`while True:` 아래 들여 쓴 줄들이 한 바퀴예요" }
          - { line: 9, note: "받은 값을 출력 창에 찍어요" }
          - { line: 10, note: "0.1초 쉬고 다시 처음으로" }

      - id: design
        type: design
        title: 설계 — 리모컨으로 켜는 전등
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "LED 는 io2(ANALOG S) → 6번 줄 → 220Ω 저항 → 11번 줄 긴 다리, 12번 줄 짧은 다리 → 아래 줄 GND. IR 수신기는 그대로"
          captionDevkit: "LED 는 D2 → 9번 줄 → 220Ω 저항 → 3번 줄 긴 다리, 2번 줄 짧은 다리 → 위 줄 GND(보드 왼쪽 바깥으로 돌아서). IR 수신기는 그대로"
        body: |
          이번엔 리모컨으로 LED 를 켜고 끄는 전등을 설계해요. **OK 버튼**(예: `"0xff02fd"`)을 누르면 켜고, **다른 버튼**을 누르면 꺼요.

          아무것도 안 받은 `None` 은 "다른 버튼" 이 아니에요. `else` 로 끄면 0.1초 만에 꺼지니, "값이 있을 때만" 끄는 `elif value:` 를 써요. 판정을 받은 뒤에는 OK 값을 내 리모컨 값으로 바꿔 실행해 봐요.
        todo:
          - 2번 핀에 220Ω 저항과 LED 꽂기
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: IR 수신기 핀 __번과 LED 핀 2번을 준비한다
            blank: { answer: 5 }
          - text: 계속 반복한다
          - text: "  ↳ 리모컨 값을 읽어 value 에 담는다"
          - text: "  ↳ value 가 OK 버튼 값이면 LED 를 __"
            blank: { answer: 켠다 }
          - text: "  ↳ 아니고 value 에 다른 값이 있으면 LED 를 끈다 (아무것도 안 받았으면 그대로)"
          - text: "  ↳ __초 쉰다"
            blank: { answer: 0.1 }
        translation:
          - ["IR 수신기를 준비한다", "ir = irGetCMD(5)"]
          - ["리모컨 값을 읽어 담는다", "value = ir.ir_read()"]
          - ["값이 OK 버튼 값이면", "if value == \"0xff02fd\":"]
          - ["아니고 값이 있으면", "elif value:"]
          - ["LED 를 켠다 · 끈다", "led.value(1) · led.value(0)"]
        targetCode: design_ir_led.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 키패드는 핀 8개로 키 16개, 리모컨은 빛 한 줄기로 버튼 여러 개. 적은 것으로 많은 것을 알아내요
        body: |
          오늘은 키를 리스트에 **모으고**, 한꺼번에 **비교하고**, 다시 **비웠어요**. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 미션 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요. 다 쓰면 짝에게 1분 동안 설명해 보세요.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 설명하기
        lineExplain: mission_password.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 키패드는 핀 8개로 키 16개를 어떻게 읽을까요? 원리 그림을 떠올리며 내 말로 설명해 보세요.
          - "4자리 비밀번호는 16 × 16 × 16 × 16 = 65,536가지예요. 더 안전하게 하려면 무엇을 바꿀 수 있을까요?"
          - "다음엔 여기부터 본다: 한 줄로"
