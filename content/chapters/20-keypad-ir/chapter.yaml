# 챕터 20 · 키패드와 IR 리모컨 — 원본: 아두이노 기본 W08(2x2 키패드 → 4x4, 이중 잠금), Keyestudio 2-3-26 IR Receiver · 2-3-27 4X4 Key Pad. 형식 설명은 src/track/README.md
id: 20-keypad-ir
order: 20
track: sensor
label: S17
prerequisites: [11-button-touch]
subjects: [정보, 수학]
sessions: 2
teacherNotes: |
  **리모컨 버튼 값은 키트마다 다를 수 있어요.** 실행 2에서 먼저 출력 창으로 내 리모컨의 버튼 값을 재고 공책에 적게 해 주세요. 설계 단계의 `0xff02fd`(키트 리모컨 OK 버튼의 예) 는 예시 값이라, 조립 판정을 받은 뒤 학생이 적어 둔 값으로 바꿔 실행하면 됩니다. 비밀번호 `2026`, 키 사이 쉬는 시간 0.3초도 예시입니다(미션 판정은 네 자리 글자 리스트면 통과).

  - **키패드 핀 8개 배선**: 커넥터 1번 칸이 행 1(26번)이에요. 키패드를 뒤집어 꽂으면 키가 엉뚱하게(예: 1 을 눌렀는데 D) 나옵니다. 사진을 찍어 두고 한 줄씩 짚으며 꽂게 해 주세요. 키패드는 브레드보드에 꽂지 않고 M-F 듀폰선(수 쪽은 커넥터, 암 쪽은 보드 핀)으로 보드 핀에 바로 잇습니다. 커넥터 칸 순서와 보드 핀 순서가 서로 반대라 배선 그림에서 선이 계단처럼 엇갈려 보여요. 연결 표를 한 줄씩 짚게 해 주세요.
  - **12번 핀은 부팅에 영향을 주는 핀**입니다. 업로드나 리셋이 안 되면 키패드 선을 잠시 빼고 리셋한 뒤 다시 꽂습니다.
  - **GPIO 34~39** 는 입력 전용이고 안쪽 풀업·풀다운 저항이 없어요(디버깅 3). 열 핀으로 쓰면 값이 떠다니고, 출력 창에 `GPIO number error` 같은 줄이 보일 수 있습니다.
  - 라이브러리 `keypad.scan()` 은 10ms 안에 다시 부르면 `None` 을 줍니다. "손 뗄 때까지 기다리기"(`while keypad.scan():`)로 고치는 학생에게는 그 반복 안에 꼭 쉬기를 넣게 해 주세요. 수업 파일은 키트 튜토리얼처럼 누른 뒤 0.3초 쉬기로 풉니다(아주 길게 누르면 다시 들어감).
  - `ir.ir_read()` 는 한 번 부를 때 0.2초 기다리고, 신호가 끝나고 0.8초쯤 조용해야 값을 내놓습니다. 버튼을 누르고 1초쯤 뒤에 찍히는 것이 정상입니다. 리모컨의 투명 절연 띠를 먼저 빼 주세요.
  - IR 수신기: 키트 튜토리얼 배선에는 OUT(S) 과 V(+) 사이 10kΩ 풀업 저항이 있지만, 라이브러리가 안쪽 풀업을 켜므로 이 챕터 배선도에서는 뺐습니다. 키트대로 끼워도 됩니다.
  - `None` 을 비교하는 블록이 없어서 수업 파일은 `if key:`(값이 있으면 참) 꼴을 씁니다. 키 `"0"` 도 글자라서 참입니다.
  - 교과 연결: 수학(경우의 수 — 키 16개 4자리 16 × 16 × 16 × 16 = 65,536, 숫자만 쓰면 10 × 10 × 10 × 10 = 10,000), 정보(리스트 비교, 모으기 → 비교 → 비우기 상태), 사회(보안과 개인정보). 원본 W08 의 조이스틱 패턴 · 초음파 · 서보 이중 잠금은 교과 융합 트랙으로 미룹니다.
title: 키패드와 IR 리모컨
summary: |
  카드를 잃어버려도 열 수 있는 문, 손이 닿지 않아도 켜지는 전등. 오늘은 **키패드**로 누른 키를 읽어 **4자리 비밀번호** 문을 만들고, **IR 리모컨**의 버튼 값을 읽어 멀리서 LED 를 켜요.
  누른 키를 **리스트**에 모아 정답과 한꺼번에 비교하고, 비교한 뒤에는 비우는 방법도 배워요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 4×4 박막 키패드, note: "키 16개. 끝의 구멍 8개짜리 커넥터는 1번 칸부터 행 1~4, 열 1~4" }
  - { name: IR 리모컨, note: 배터리 칸의 투명 절연 띠를 먼저 빼요 }
  - { name: IR 수신기(VS1838B), note: "다리 3개: 둥근 머리를 보고 OUT(S) · G(−) · V(+) 차례. V 는 3V3. 키트의 10kΩ 저항은 이번엔 없어도 돼요" }
  - { name: 빨강 LED, note: "긴 다리가 +. 설계 단계에서 써요" }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 브레드보드, note: "IR 수신기와 LED 를 꽂는 판. 키패드는 꽂지 않고 선으로 보드에 바로 이어요" }
  - { name: M-F 듀폰선 13가닥, note: "한쪽은 핀, 한쪽은 구멍인 선. 키패드 커넥터 → 보드 핀 8, 보드 핀 → 브레드보드: IR 수신기 3, (설계) LED 2" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "키패드 커넥터 1~8번 칸 → 위쪽 한 줄 io26 · io25 · io17 · io16(행) · io27 · io14 · io12 · io13(열), M-F 선 8가닥으로 바로. 보드 아래 브레드보드: IR 수신기 OUT · G · V 는 2 · 3 · 4번 줄 — OUT → io5(보드 왼쪽 바깥으로 돌아서), G → ANALOG io2 줄 G, V → 아래 줄 3V3. LED(설계): io2(ANALOG S) → 6번 줄 → 220Ω 저항 → 11번 줄 긴 다리, 12번 줄 짧은 다리 → 아래 줄 GND"
  captionDevkit: "키패드 커넥터 1~8번 칸 → D26 · D25 · TX2(17) · RX2(16)(행) · D27 · D14 · D12 · D13(열), M-F 선 8가닥으로 바로 (TX2 · RX2 는 아래 줄). 보드 아래 브레드보드: IR 수신기 V · G · OUT 은 5 · 6 · 7번 줄 — V → 3V3, G → 아래 줄 GND, OUT → D5. LED(설계): D2 → 9번 줄 → 220Ω 저항 → 3번 줄 긴 다리, 2번 줄 짧은 다리 → 위 줄 GND(보드 왼쪽 바깥으로 돌아서)"
principle:
  image: images/keypad-matrix.svg
  body: |
    **키패드**는 키 16개를 가로 **행 선** 4개와 세로 **열 선** 4개가 만나는 자리에 둔 판이에요. 보드는 행을 하나씩 켜고(1), 그때 1 이 들어온 열을 찾아요. 행 2 를 켰을 때 열 2 에 1 이 오면 눌린 키는 `5`. 그래서 핀 **8개**로 키 **16개**를 읽어요. `keypad.scan()` 은 눌린 키를 글자(`"5"`)로 주고, 안 눌렸으면 `None`(없음)을 줘요.

    열 핀은 안쪽 **풀다운** 저항이 붙잡아 줘서 안 누르면 `0` 이에요. GPIO 34~39번에는 이 저항이 없어서 열 핀으로 쓰면 값이 떠다녀요.

    **IR 리모컨**은 버튼을 누르면 눈에 안 보이는 빛(적외선)을 1초에 38,000번 깜빡이며 보내요. IR 수신기가 그 깜빡임을 켜짐 · 쉼 신호로 바꾸면, 라이브러리가 쉬는 시간의 길이로 0 · 1 을 32개 읽어 `0xff02fd` 같은 **16진수 글자** 하나로 만들어 줘요. 버튼마다 글자가 달라요.
goals:
  content: 4×4 키패드와 IR 리모컨의 값을 읽고, 누른 키를 리스트에 모아 비밀번호와 비교하며, 리모컨 값으로 LED 를 켜고 끈다
  thinking: 행 · 열을 차례로 살피는 방법으로 적은 핀으로 많은 키를 읽는 원리를 설명하고, 입력을 "모으기 → 비교 → 비우기" 상태로 다룬다
successCriteria:
  - 키패드가 핀 8개로 키 16개를 읽는 방법을 원리 그림을 짚으며 설명할 수 있다
  - 누른 키 네 개를 리스트에 모아 정답 리스트와 비교하고, 비교한 뒤 리스트를 비울 수 있다
  - 내 리모컨의 버튼 값을 출력 창에서 재고, 그 값으로 LED 를 켜고 끌 수 있다
  - 4자리 비밀번호가 몇 가지인지 곱셈으로 셀 수 있다
parts:
  - id: part1
    title: 1부 · 키패드 비밀번호
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 카드를 잃어버리면?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 번호로 여는 문과, 손이 닿지 않아도 켜지는 전등
        body: |
          카드만 대면 열리는 문은 편해요. 그런데 카드를 잃어버리면 주운 사람도 열 수 있고, 나는 들어갈 수가 없어요.

          그래서 많은 문이 **비밀번호**를 함께 써요. 비밀번호는 몇 가지나 만들 수 있을까요? 그리고 TV 리모컨은 선도 없는데 TV 는 어떻게 알아들을까요? 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없어요.
        todo:
          - 준비물(키패드, 리모컨, IR 수신기, 듀폰선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 생활 속에서 번호나 리모컨으로 쓰는 물건을 하나 떠올려 함께 쓰기
        questions:
          - 카드만 있으면 누구나 열 수 있는 문이 있어요. 카드를 잃어버리면 어떻게 될까요? 카드 대신 무엇으로 문을 열 수 있을까요?
          - 키가 16개인 키패드로 네 자리 비밀번호를 만들면 몇 가지나 될까요? 어림해 보고, 셈하는 방법도 적어 보세요.
          - TV 리모컨은 선이 없어요. TV 는 내가 어떤 버튼을 눌렀는지 어떻게 알까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "비밀번호가 맞으면 OK" 를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 키를 눈으로 보지 못하고, 라이브러리가 알려 주는 **키 값**만 받아요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 키를 한 번에 하나씩 받는데, 네 개를 어떻게 한꺼번에 비교할까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 미리 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 기준이나 숫자 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["키패드는 행 핀 4개(26 · 25 · 17 · 16)와 열 핀 4개(27 · 14 · 12 · 13)에 이어져 있다", "keypad.scan() 은 눌린 키를 글자로 주고, 안 눌렸으면 None 을 준다", "리모컨은 버튼마다 다른 값을 보낸다"]
          decide: ["비밀번호 네 자리 (예: 2026)", "키가 몇 개 모이면 비교할지 (4개)", "한 번 누른 키를 한 번만 받는 방법 (잠깐 쉬기)"]
          act: ["눌린 키를 계속 읽어 리스트에 모으기", "4개가 모이면 정답과 비교해 OK / NO 찍기", "비교한 뒤 리스트를 비우고 다시 받기"]

      - id: predict
        type: predict
        title: 예측하기 — 무엇이 찍힐까?
        minutes: 4
        scene:
          image: images/keypad-matrix.svg
          caption: 행을 하나씩 켜고, 1 이 들어온 열을 찾아요. 행 2 와 열 2 가 만나면 키 5
        body: |
          아직 실행하지 않아요. `keypad.scan()` 은 지금 눌린 키를 알려 주는데, 아무것도 안 눌렸으면 `None`(없음)을 줘요. `if key:` 는 "키가 있으면" 이라는 뜻이에요. `None` 은 없음이라 거짓이 돼요.

          그림과 코드를 따라가며 빈칸에 내 예측을 적어요.
        todo:
          - 그림에서 키 5 를 눌렀을 때 이어지는 행과 열을 손가락으로 짚기
          - "`if key:` 가 무엇을 묻는지 읽기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_keypad.py
        blanks:
          - q: 아무 키도 누르지 않을 때 출력 창에는 무엇이 찍힐까요?
          - q: 5 키를 1초 동안 꾹 누르고 있으면 5 가 몇 번쯤 찍힐까요?
            unit: 번
          - q: 키 16개를 읽는 데 보드 핀이 몇 개 쓰일까요?
            unit: 개

      - id: run
        type: run
        title: 복사 · 실행 — 누른 키 읽기
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "키패드 커넥터 1~8번 칸 → io26 · io25 · io17 · io16 · io27 · io14 · io12 · io13 (위쪽 한 줄). 브레드보드 없이 M-F 선으로 바로"
          captionDevkit: "키패드 커넥터 1~8번 칸 → D26 · D25 · TX2(17) · RX2(16) · D27 · D14 · D12 · D13. 브레드보드 없이 M-F 선으로 바로"
        body: |
          키패드 끝의 커넥터에 M-F 듀폰선 8개를 꽂고, 1번 칸부터 차례로 보드의 **26 · 25 · 17 · 16 · 27 · 14 · 12 · 13**번 핀에 이어요. 앞의 넷은 행, 뒤의 넷은 열이에요. 보드의 핀 순서가 커넥터 순서와 달라서 선이 엇갈려요. 한 칸만 어긋나도 엉뚱한 키가 나오니 배선 그림과 아래 표를 한 줄씩 짚으며 꽂아요.

          키패드 라이브러리(`keypad.py`)는 블록랩이 보드에 알아서 올려 줘요. 실행한 뒤 여러 키를 눌러 보고, 한 키를 꾹 누르고도 있어 보세요.
        todo:
          - USB 를 뺀 채 키패드 선 8개를 그림대로 꽂기
          - "**보드 연결** → **실행** 누르기"
          - 키를 하나씩 눌러 보고, 한 키를 꾹 누른 채 출력 창을 예측과 비교하기
        code: step1_keypad.py
        expected: 코드를 실행하면 출력 창은 조용히 기다려요. 키를 누르면 그 키(`1`, `5`, `A`, `#` …)가 찍히고, 꾹 누르고 있으면 같은 키가 0.1초마다 여러 번 찍혀요.
        codeNotes:
          - { line: 2, note: "키패드 라이브러리에서 `KeyPad` 를 가져와요" }
          - { line: 4, note: "행 핀 4개(26 · 25 · 17 · 16)와 열 핀 4개(27 · 14 · 12 · 13)로 키패드를 준비해요. 이름은 `keypad`" }
          - { line: 6, note: "아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 7, note: "`keypad.scan()` 으로 지금 눌린 키를 읽어 `key` 에 담아요. 안 눌렸으면 `None`" }
          - { line: 8, note: "`key` 에 값이 있을 때만(눌렸을 때만) 바로 다음 줄을 해요" }
          - { line: 9, note: "눌린 키를 출력 창에 찍어요" }
          - { line: 10, note: "0.1초 쉬고 다시. 그래서 1초에 10번 키패드를 살펴요" }

      - id: readcheck
        type: readcheck
