<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ki-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ki-title">IR 원리: 리모컨 버튼을 누르면 앞쪽 LED 가 눈에 안 보이는 빛(적외선)을 1초에 38,000번 깜빡이며 보낸다. IR 수신기는 깜빡임 묶음을 켜짐 · 쉼 신호로 바꾸고, 쉬는 시간이 짧으면 0, 길면 1 이다. 0 · 1 32개를 모아 16진수 글자 하나로 만든다. 버튼마다 다른 글자가 나온다</title>
  <text x="24" y="40" font-size="18" font-weight="700" fill="currentColor" stroke="none">버튼 하나 = 0 · 1 서른두 개</text>
