  <text x="523.0" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#e03131" stroke="none">1</text>
  <text x="556" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">…</text>
  <text x="284" y="196" font-size="13" font-weight="600" fill="currentColor" stroke="none">쉬는 시간이 짧으면 0, 길면 1</text>
  <path d="M444 216 V238" stroke-width="2"/><path d="M438 230 L444 238 L450 230" stroke-width="2"/>
  <rect x="270" y="246" width="350" height="92" rx="12" fill="var(--card)" stroke-width="2"/>
  <text x="284" y="272" font-size="13" font-weight="700" fill="currentColor" stroke="none">0 · 1 32개를 모아 16진수 글자로</text>
  <rect x="284" y="284" width="118" height="40" rx="8" fill="#1e1e1e" stroke="none"/>
  <text x="343" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#69db7c" stroke="none">0xff02fd</text>
  <text x="414" y="300" font-size="13" font-weight="600" fill="currentColor" stroke="none">버튼마다 다른 글자</text>
  <text x="414" y="320" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">안 누르면 None</text>
  <text x="24" y="290" font-size="13" font-weight="700" fill="currentColor" stroke="none">IR = 적외선(Infrared)</text>
  <text x="24" y="310" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">눈에 안 보이는 빛을</text>
  <text x="24" y="330" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">1초에 38,000번 깜빡여요</text>
</svg>
