  <path d="M189 108 V132" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="234" y="70" width="34" height="34" rx="6" fill="#f59f00" stroke-width="2"/>
  <text x="251" y="93" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">2</text>
  <path d="M274 87 H290" stroke-width="2"/><path d="M285 82 L290 87 L285 92" stroke-width="2"/>
  <path d="M251 108 V132" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="296" y="70" width="34" height="34" rx="6" fill="#f59f00" stroke-width="2"/>
  <text x="313" y="93" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">6</text>
  <path d="M313 108 V132" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="24" y="160" font-size="14" font-weight="700" fill="currentColor" stroke="none">모은 키</text>
  <rect x="104" y="136" width="46" height="40" rx="6" fill="var(--card)" stroke-width="2"/>
  <text x="127" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"2"</text>
  <text x="127" y="192" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.6" stroke="none">1번째</text>
  <rect x="166" y="136" width="46" height="40" rx="6" fill="var(--card)" stroke-width="2"/>
  <text x="189" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"0"</text>
  <text x="189" y="192" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.6" stroke="none">2번째</text>
  <rect x="228" y="136" width="46" height="40" rx="6" fill="var(--card)" stroke-width="2"/>
  <text x="251" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"2"</text>
  <text x="251" y="192" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.6" stroke="none">3번째</text>
  <rect x="290" y="136" width="46" height="40" rx="6" fill="var(--card)" stroke-width="2"/>
  <text x="313" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"6"</text>
  <text x="313" y="192" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.6" stroke="none">4번째</text>
  <text x="360" y="162" font-size="13" font-weight="600" fill="currentColor" stroke="none">4개가 모이면</text>
  <text x="24" y="236" font-size="14" font-weight="700" fill="currentColor" stroke="none">정답</text>
  <rect x="104" y="212" width="46" height="40" rx="6" fill="var(--muted)" stroke-width="2"/>
  <text x="127" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"2"</text>
  <rect x="166" y="212" width="46" height="40" rx="6" fill="var(--muted)" stroke-width="2"/>
  <text x="189" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"0"</text>
  <rect x="228" y="212" width="46" height="40" rx="6" fill="var(--muted)" stroke-width="2"/>
  <text x="251" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"2"</text>
  <rect x="290" y="212" width="46" height="40" rx="6" fill="var(--muted)" stroke-width="2"/>
  <text x="313" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">"6"</text>
  <path d="M354 176 C380 190 380 210 354 226" stroke="#4562f5" stroke-width="2.5"/>
  <text x="382" y="201" font-size="13" font-weight="700" fill="#4562f5" stroke="none">칸마다 같은가?</text>
  <rect x="500" y="150" width="56" height="30" rx="15" fill="#2f9e44" stroke="none"/>
  <text x="528" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">OK</text>
  <rect x="500" y="200" width="56" height="30" rx="15" fill="#e03131" stroke="none"/>
  <text x="528" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">NO</text>
  <text x="566" y="170" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">같음</text>
  <text x="566" y="220" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">다름</text>
  <path d="M482 190 L496 168 M482 202 L496 214" stroke-width="2"/>
  <rect x="104" y="268" width="232" height="34" rx="8" fill="none" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="220" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">비교한 뒤 비우기 → 다음 시도</text>
  <rect x="372" y="262" width="248" height="78" rx="12" fill="var(--muted)" stroke="none"/>
  <text x="386" y="286" font-size="14" font-weight="700" fill="currentColor" stroke="none">몇 가지나 될까?</text>
  <text x="386" y="308" font-size="14" font-weight="600" fill="currentColor" stroke="none">16 × 16 × 16 × 16</text>
  <text x="386" y="328" font-size="14" font-weight="600" fill="currentColor" stroke="none">= 65,536가지</text>
