<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="kp-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="kp-title">비밀번호 미션: 누른 키 2 · 0 · 2 · 6 이 하나씩 빈 리스트 칸에 모인다. 네 개가 모이면 정답 리스트와 칸마다 비교해 같으면 OK, 다르면 NO 를 찍고, 리스트를 다시 비워 다음 시도를 받는다. 경우의 수: 키 16개로 4자리면 16 × 16 × 16 × 16 = 65,536가지</title>
  <text x="24" y="40" font-size="18" font-weight="700" fill="currentColor" stroke="none">누른 키를 모아서 한꺼번에 비교</text>
