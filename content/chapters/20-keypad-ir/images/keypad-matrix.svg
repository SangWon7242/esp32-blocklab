<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="km-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="km-title">키패드 원리: 키 16개가 가로 행 선 4개(26 · 25 · 17 · 16)와 세로 열 선 4개(27 · 14 · 12 · 13)가 만나는 자리에 있다. 보드는 행을 하나씩 켜고(1), 키가 눌리면 그 행과 열이 이어져 열 핀에 1 이 들어온다. 행 2 를 켰을 때 열 2 에 1 이 들어오면 눌린 키는 5. 열 핀은 풀다운이라 안 누르면 0. 핀 8개로 키 16개를 읽는다</title>
