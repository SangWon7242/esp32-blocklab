  <text x="438" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" stroke="none">1</text>
  <text x="458" y="104" font-size="15" font-weight="700" fill="currentColor" stroke="none">행을 하나씩 켜요</text>
  <text x="458" y="125" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">26 → 25 → 17 → 16 차례로</text>
  <circle cx="438" cy="169" r="12" fill="#4562f5" stroke="none"/>
  <text x="438" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" stroke="none">2</text>
  <text x="458" y="174" font-size="15" font-weight="700" fill="currentColor" stroke="none">눌린 키가 길을 이어요</text>
  <text x="458" y="195" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">5 를 누르면 행2 와 열2</text>
  <circle cx="438" cy="239" r="12" fill="#4562f5" stroke="none"/>
  <text x="438" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" stroke="none">3</text>
