# 챕터 11 · 버튼과 터치 — 입력. 원본: 아두이노 기본 W01(버튼·터치 미션), Keyestudio 2-3-14 Button. 형식 설명은 src/track/README.md
id: 11-button-touch
order: 11
track: sensor
label: S8
prerequisites: [01-led]
subjects: [과학, 정보]
sessions: 2
teacherNotes: |
  **터치 값은 보드마다 달라요.** 호일 크기, 선 길이, 손의 습기에 따라 손 뗀 값이 300~900 까지 달라집니다. 실행 2에서 먼저 출력 창의 값을 보고 기준(300)을 고치게 해 주세요. 설계 단계는 이 문제를 "시작할 때 스스로 기준 정하기"로 풉니다.

  - 버튼은 **대각선** 다리를 씁니다. 같은 쪽 두 다리에 선을 꽂으면 늘 이어져 있어 계속 0 이 나옵니다(디버깅 단계 그림 참고).
  - 토글에서 가끔 한 번 누름에 두 번 바뀌는 것은 버튼 떨림(채터링)입니다. 반복 끝의 `time.sleep(0.05)` 가 줄여 줍니다.
  - 원본 W01 의 "누를 때마다 색 바꾸기"(count) 는 함수 안에서 전역 변수를 바꾸는 꼴이라 블록으로 왕복되지 않습니다. 이 챕터는 반복 안에서 상태 변수를 바꾸는 꼴만 씁니다.
  - 교과 연결: 과학(전기 회로, 도체·부도체 — 호일·동전·연필심·종이·플라스틱을 패드로 바꿔 값 비교), 정보(디지털 0/1, 조건문, 상태).
title: 버튼과 터치 — 입력
summary: |
  지금까지는 보드가 LED 에게 **시키기만**(출력) 했어요. 오늘은 보드가 **알아차리는**(입력) 쪽이에요.
  버튼을 누르면 핀 값이 `0` 이 되고, 호일을 만지면 터치 값이 **작아져요**. 그 값을 `if` 로 보고 LED 를 켜고 끄다가, 마지막엔 누를 때마다 켜짐·꺼짐이 바뀌는 스위치를 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 납땜 없이 빼고 꽂을 수 있어요 }
  - { name: 버튼(푸시 버튼), note: 다리가 네 개. 가운데 홈에 걸쳐 꽂아요 }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: M-F 듀폰선 4가닥, note: "한쪽은 구멍, 한쪽은 핀. 보드의 14번 · 26번 · GND 핀 → 브레드보드, 4번 핀 → 악어 클립 (추가 미션은 27번에 하나 더)" }
  - { name: 점퍼선(M-M) 3가닥, note: "버튼 대각선 다리 줄 → 위 − 줄, LED 짧은 다리 줄 → 아래 − 줄, 위 − 줄 ↔ 아래 − 줄" }
  - { name: 호일 + 악어 클립, note: "손바닥만 한 쿠킹 호일 한 장. 4번 핀 선의 핀 끝을 클립으로 집어 터치 패드로 써요 (추가 미션은 한 장 더)" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "버튼은 가운데 홈에 걸쳐 15 · 17번 줄에 꽂고, io14 → 15번 줄(버튼 한쪽), 대각선 반대쪽 17번 줄 → 위 − 줄. LED 는 io26 → 21번 줄 → 220Ω 저항 → 25번 줄의 긴 다리(+), 짧은 다리(−) 26번 줄 → 아래 − 줄. 보드 GND → 아래 − 줄, 위 − 줄과 아래 − 줄은 점퍼선으로. ANALOG 묶음 io4 의 S 핀에 꽂은 선은 악어 클립으로 호일에 이어요"
  captionDevkit: "버튼은 가운데 홈에 걸쳐 7 · 9번 줄에 꽂고, D14 → 7번 줄(버튼 한쪽), 대각선 반대쪽 9번 줄 → 위 − 줄. LED 는 D26 → 11번 줄 → 220Ω 저항 → 15번 줄의 긴 다리(+), 짧은 다리(−) 16번 줄 → 아래 − 줄. 보드 GND → 아래 − 줄, 위 − 줄과 아래 − 줄은 점퍼선으로. 아래 줄 D4 에 꽂은 선은 악어 클립으로 호일에 이어요"
principle:
  image: images/pullup-principle.svg
  body: |
    버튼은 눌렀을 때만 두 쪽 다리를 이어 주는 **작은 문**이에요. 보드는 핀에 들어온 전기가 3.3V 쪽이면 `1`, GND 쪽이면 `0` 으로 읽어요.

    그런데 손을 떼면 핀이 어디에도 이어져 있지 않아 값이 **떠다녀요**(0 과 1 이 제멋대로). 그래서 핀을 저항으로 3.3V 쪽에 살짝 이어 두는데, 이것이 **풀업**이에요. **손을 떼면 1**, 누르면 핀이 GND 와 바로 이어져 `0`. 거꾸로 GND 쪽에 이어 두면 **풀다운**(떼면 0, 누르면 1)이에요. ESP32 에는 풀업 저항이 안에 들어 있어서 `Pin.PULL_UP` 한 마디면 켜져요.

    **터치**는 누르는 부품 없이 핀 하나로 해요. 몸은 전기를 조금 담는 그릇이라, 4번 핀에 이은 호일을 만지면 `touch.read()` 값이 **작아져요**. 값이 기준(예: 300)보다 작으면 "만졌다"고 봐요.
goals:
  content: 풀업 버튼과 내장 터치 패드의 값을 읽어, 눌렀을 때 · 만졌을 때 LED 를 켜고 끈다
  thinking: 입력 값(0/1, 숫자)을 조건으로 바꾸고, "누르고 있는 동안"과 "누른 순간"을 구분해 상태를 기억한다
successCriteria:
  - 풀업 버튼이 왜 누르면 0 인지 원리 그림을 짚으며 설명할 수 있다
  - 출력 창의 터치 값을 보고 내 패드에 맞는 기준을 정할 수 있다
  - 상태 변수로 누를 때마다 켜짐 · 꺼짐을 바꾸고, 한 번 누름이 한 번만 세어지게 할 수 있다
parts:
  - id: part1
    title: 버튼과 터치로 LED 켜기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 보드는 "눌렸다"를 어떻게 알까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 버튼을 누르거나 호일을 만지면 보드가 알아차리고 LED 를 켜요
        body: |
          지금까지 보드는 LED 에게 "켜", "꺼" 하고 **시키기만** 했어요. 오늘은 반대로 보드가 바깥에서 일어난 일을 **알아차려야** 해요.

          엘리베이터 버튼, 스마트폰 화면처럼 우리 둘레에는 누르거나 만지면 알아차리는 물건이 많아요. 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없고, 틀려도 괜찮아요.
        todo:
          - 준비물(버튼, LED, 저항, 호일, 듀폰선 · 점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 생활 속에서 "누르면 알아차리는" 물건을 하나 떠올려 함께 쓰기
        questions:
          - 엘리베이터 버튼은 누르는 순간 불이 들어와요. 보드는 "눌렸다"는 걸 어떻게 알까요?
          - 버튼은 눌렀을 때만 전기가 지나가는 문이에요. 손을 뗐을 때 핀이 어디에도 이어져 있지 않으면 보드는 무엇을 읽을까요?
          - 스마트폰 화면은 꾹 누르지 않고 손가락을 대기만 해도 알아차려요. 무엇이 달라져서 알 수 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "버튼을 누르면 LED 켜기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 버튼을 눈으로 보지 못하고, 핀의 **값(숫자)**만 읽을 수 있어요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. "몇이면 눌린 것으로 볼까"도 무언가를 정하는 일일까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 미리 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 기준이나 숫자 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["버튼이 14번, LED 가 26번 핀에 꽂혀 있다", "풀업 버튼은 떼면 1, 누르면 0 이 된다", "터치 값은 몸이 닿으면 작아진다"]
          decide: ["몇이면 눌린 것으로 볼지 (0)", "터치 값이 몇보다 작으면 만진 것으로 볼지", "얼마나 자주 확인할지"]
          act: ["버튼 값을 계속 읽기", "눌렸으면 LED 켜기, 아니면 끄기", "이 일을 계속 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 누르면 0, 떼면 1?
        minutes: 5
        scene:
          image: images/pullup-principle.svg
          caption: "풀업: 손을 떼면 3.3V 쪽으로 끌어올려져 1, 누르면 GND 와 바로 이어져 0"
        body: |
          아직 실행하지 않아요. `Pin(14, Pin.IN, Pin.PULL_UP)` 은 14번 핀을 **입력**으로 쓰고, 안에 든 **풀업** 저항을 켜는 줄이에요.

          `button.value()` 는 지금 핀의 값(0 또는 1)을 읽어요. 그림을 보며 손을 뗐을 때와 눌렀을 때 값이 몇일지 생각하고, 코드를 따라가며 빈칸에 내 예측을 적어요.
        todo:
          - 그림 세 칸에서 핀이 어디에 이어지는지 손가락으로 따라가기
          - "`if button.value() == 0:` 이 무엇을 묻는지 읽기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_button_led.py
        blanks:
          - q: 버튼을 누르지 않았을 때 출력 창에 찍힐 숫자는 무엇일까요?
          - q: 버튼을 누르고 있는 동안 LED 는 어떻게 될까요?
          - q: 0.1초마다 한 번씩 값을 찍으면, 1초에 몇 번 찍힐까요?
            unit: 번

      - id: run
        type: run
        title: 복사 · 실행 — 버튼으로 LED 켜기
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "버튼은 가운데 홈에 걸쳐 꽂고, 14번 선과 − 줄 선은 대각선 다리에. LED 는 io26 → 저항 → 긴 다리, 짧은 다리 → − 줄"
          captionDevkit: "버튼은 가운데 홈에 걸쳐 꽂고, 14번 선과 − 줄 선은 대각선 다리에. LED 는 D26 → 저항 → 긴 다리, 짧은 다리 → − 줄"
        body: |
          이제 **브레드보드**에 버튼과 LED 를 꽂아요. 버튼은 **가운데 홈에 걸쳐** 꽂아야 해요. 14번 핀은 버튼의 한쪽 다리 줄에, 그 **대각선 반대쪽** 다리 줄은 − 줄에 이어요.

          LED 는 1장과 같은 회로예요: 26번 핀 → 220Ω 저항 → 긴 다리(+), 짧은 다리(−) → − 줄. 줄 번호는 배선 그림과 아래 표를 봐요. 실행한 뒤 버튼을 눌렀다 떼며 출력 창의 숫자가 어떻게 바뀌는지 보세요.
        todo:
          - USB 를 뺀 채 그림대로 버튼 · LED · 저항 · 선 꽂기
          - "**보드 연결** → **실행** 누르기"
          - 버튼을 눌렀다 떼며 출력 창 숫자와 LED 를 예측과 비교하기
        code: step1_button_led.py
        expected: 코드를 실행하면 출력 창에 1 이 계속 찍혀요. 버튼을 누르고 있는 동안에는 0 이 찍히고 LED 가 켜지며, 손을 떼면 다시 1 이 찍히고 LED 가 꺼져요.
        codeNotes:
          - { line: 4, note: "14번 핀을 입력(`Pin.IN`)으로 준비하고 안쪽 풀업 저항(`Pin.PULL_UP`)을 켜요. 이름은 `button`" }
          - { line: 5, note: "26번 핀은 LED 를 켜고 끄는 출력 핀이에요" }
          - { line: 7, note: "아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 8, note: "`button.value()` 로 지금 버튼 값(0 또는 1)을 읽어 출력 창에 찍어요" }
          - { line: 9, note: "값이 0 이면(눌렸으면) 바로 아래 줄을 해요" }
          - { line: 10, note: "LED 를 켜요" }
          - { line: 11, note: "0 이 아니면(손을 뗐으면) LED 를 꺼요 (11~12번 줄)" }
          - { line: 13, note: "0.1초 쉬고 다시 처음으로. 그래서 버튼을 1초에 10번 확인해요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 버튼
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          `button.value()` 가 **두 번** 나와요. 한 번은 값을 찍고, 한 번은 `if` 로 값을 물어봐요.

          손가락으로 한 줄씩 짚으며 따라가 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - 버튼을 눌렀을 때와 뗐을 때 각각 어느 줄을 지나가는지 따라가기
          - 한 바퀴에 몇 초 쉬는지 찾기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_button_led.py
        questions:
          - { kind: choice, q: "버튼을 누르고 있을 때 출력 창에 찍히는 숫자는?", options: ["0", "1"], answer: 0, hint: "4번 줄의 풀업을 떠올려요" }
          - { kind: number, q: "1초 동안 버튼 값은 몇 번 찍힐까요?", answer: 10, hint: "한 바퀴에 몇 초 쉬나요?" }
          - { kind: line, q: "버튼이 눌렸는지 묻는 줄의 줄 번호를 클릭하세요", answer: 9 }
        codeNotes:
          - { line: 4, note: "`Pin.PULL_UP` 이 있어서 손을 떼면 1, 누르면 0 이에요" }
          - { line: 7, note: "`while True:` 아래 들여 쓴 줄들이 한 바퀴예요" }
          - { line: 8, note: "지금 값을 읽어 출력 창에 찍어요" }
          - { line: 10, note: "조건이 참일 때 LED 를 켜요" }
          - { line: 12, note: "조건이 거짓일 때 LED 를 꺼요" }

      - id: run2
        type: run
        title: 실행 2 — 호일 터치 패드
        minutes: 8
        scene:
          image: images/touch-principle.svg
          caption: 몸이 닿으면 터치 값이 줄어요. 기준보다 작으면 만진 것
        body: |
          ESP32 에는 **터치 센서**가 들어 있어요. 4번 핀에 M-F 듀폰선의 구멍 쪽을 씌우고 핀 끝을 악어 클립으로 **호일**에 집으면, 호일이 터치 패드가 돼요.

          먼저 손을 떼고 출력 창의 값을 보고, 다음엔 호일을 만지고 값을 보세요. 둘이 얼마나 다른가요? 내 패드에서 300 이 좋은 기준인지 생각해 봐요.
        todo:
          - 4번 핀 선을 악어 클립으로 호일에 집기 (버튼 · LED 는 그대로)
          - 실행하고, 손을 뗐을 때와 만졌을 때 값을 하나씩 공책에 적기
          - 값이 기준에 안 맞으면 `300` 을 내 값에 맞게 바꿔 다시 실행하기
        code: step2_touch.py
