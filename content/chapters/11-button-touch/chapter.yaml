      - id: mission
        type: mission
        title: 미션 — 누를 때마다 켜짐 · 꺼짐
        minutes: 8
        scene:
          image: images/toggle-state.svg
          caption: "꺼짐(state = 0) 에서 누르면 켜짐(state = 1), 켜짐에서 누르면 꺼짐. 길게 눌러도 한 번만 바뀌어요"
        body: |
          지금 LED 는 **누르고 있는 동안만** 켜져요. 방 전등 스위치처럼 **한 번 누르면 켜진 채로**, 다시 누르면 꺼지게 바꿔 봐요.

          그러려면 보드가 "지금 LED 가 켜져 있나, 꺼져 있나"를 **기억**해야 해요. 그리고 누르고 있는 0.3초 동안 반복은 몇 바퀴 돌까요? 그때마다 바뀌면 어떻게 될까요? 블록이든 코드든 편한 쪽에서 고쳐요.
        todo:
          - "지금 상태를 기억할 변수(예: `state`)를 반복 밖에 만들기"
          - 눌렸을 때 상태를 바꾸고 LED 를 그 상태로 만들기
          - 손을 뗄 때까지 기다리는 곳을 넣고, 실행해 본 뒤 **판정** 누르기
        instructions: 버튼을 한 번 누르면 LED 가 켜진 채로 있고, 다시 누르면 꺼지게 바꿔 주세요. 버튼을 길게 누르고 있어도 한 번만 바뀌어야 해요
        hint: 상태 변수 state 를 0(꺼짐)으로 시작해요. 눌렸을 때 state 가 0 이면 1 로 바꾸고 LED 를 켜고, 아니면 0 으로 바꾸고 LED 를 꺼요. 그다음 버튼 값이 0 인 동안 기다리는 작은 반복을 넣어요
        code: step1_button_led.py
        rules:
          # 블록 모양 규칙(blocks). 상태 변수 이름은 보지 않는다(state 가 아니어도 됨)
          - blocks: { type: variables_set, inputs: { VALUE: { type: math_number, fields: { NUM: 0 } } }, inside: top }
            fail: 시작할 때 "지금은 꺼져 있다"를 기억해 두는 변수가 있나요? 반복 안에서 정하면 바퀴마다 처음으로 돌아가지 않을까요?
          - blocks: { type: variables_set, inside: loop }
            fail: 누를 때마다 상태 변수의 값이 바뀌나요? 꺼짐에서 누르면 무엇이 되고, 켜짐에서 누르면 무엇이 될까요?
          # 손을 뗄 때까지 기다리는 작은 반복: 바깥 반복 안의 while (button.value() == 0 → dev_button_pressed, not button.value() → until esp_pin_read 두 꼴이라 조건은 보지 않는다)
          - blocks: { type: controls_whileUntil, inside: loop }
            fail: 버튼을 0.3초 누르고 있으면 바깥 반복은 몇 바퀴 돌까요? 그동안 상태는 몇 번 바뀔까요? 손을 뗄 때까지 기다리는 곳이 있나요?
        answerCode: mission_toggle.py

      - id: extra
        type: mission
        title: 추가 미션 — 두 건반 터치 악기
        optional: true
        minutes: 5
        scene:
          image: images/touch-principle.svg
          caption: 호일 한 장이 건반 하나. 두 장이면 두 건반
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 호일을 한 장 더 준비해 **27번** 핀에 이어요. 4번 호일을 만지면 출력 창에 "도", 27번 호일을 만지면 "레" 가 찍히게 해 봐요.

          터치 패드가 둘이면 이름도 둘이 필요해요. S9 멜로디 챕터에서 부저를 배우면 진짜 소리로 바꿀 수 있어요.
        todo:
          - 27번 핀에 M-F 듀폰선 + 악어 클립 + 호일 하나 더 잇기
          - 터치 패드 두 개를 준비하고, 만진 패드마다 다른 말 찍기
          - 실행해 보고 **판정** 누르기
        instructions: 4번 호일을 만지면 "도", 27번 호일을 만지면 "레" 를 출력 창에 찍어 주세요
        code: step2_touch.py
        rules:
          - codeMatches: 'TouchPad\(Pin\(\d+\)\)[\s\S]*TouchPad\(Pin\(\d+\)\)'
            fail: 터치 패드가 두 개 준비되어 있나요? 핀 번호는 각각 몇 번인가요?
          - codeMatches: 'print\("도"\)[\s\S]*print\("레"\)|print\("레"\)[\s\S]*print\("도"\)'
            fail: 패드마다 다른 말을 찍고 있나요? 무엇을 찍기로 했나요?
        answerCode: extra_touch_keys.py

      - id: debug
        type: debug
        title: 디버깅 — 이상한 버튼 세 개
        minutes: 7
        scene:
          image: images/breadboard-basics.svg
          caption: "배선부터: 버튼이 가운데 홈에 걸쳐 있나요? 같은 번호 다섯 칸은 이어지고, 홈 건너편은 안 이어져요"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 값이 이상하면 배선과 준비 줄부터, 동작이 거꾸로면 조건부터 봐요.

          셋 다 빨간 글씨(에러)는 뜨지 않아요. 에러 없이 이상하게만 구는 버그가 더 찾기 어려워요. 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 버튼을 안 눌러도 0 과 1 이 제멋대로 나와요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN)

              while True:
                  print(button.value())
                  time.sleep(0.1)
            question: 손을 뗐을 때 14번 핀은 무엇에 이어져 있나요? 원리 그림의 세 칸 중 이 코드는 어느 칸일까요?
            rules:
              - codeMatches: 'Pin\(14, Pin\.IN, Pin\.PULL_UP\)'
                fail: 준비 줄을 원리 그림의 "손을 뗐을 때" 칸과 비교해 보세요. 핀을 1 쪽으로 붙잡아 주는 것이 있나요?
          - title: 누르지 않으면 켜지고, 누르면 꺼져요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)
              led = Pin(26, Pin.OUT)

              while True:
                  if button.value() == 1:
                      led.value(1)
                  else:
                      led.value(0)
                  time.sleep(0.1)
            question: 풀업 버튼은 눌렀을 때 값이 몇이었나요? 조건이 묻는 숫자와 비교해 보세요.
            rules:
              - codeMatches: 'button\.value\(\) == 0:\n\s+led\.value\(1\)|button\.value\(\) == 1:\n\s+led\.value\(0\)'
                fail: 버튼을 눌렀을 때 조건은 참일까요, 거짓일까요? 그때 LED 에게 무엇을 시키나요?
          - title: 한 번 눌렀는데 켜졌다 꺼졌다 제멋대로예요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)
              led = Pin(26, Pin.OUT)

              state = 0
              while True:
                  if button.value() == 0:
                      if state == 0:
                          state = 1
                          led.value(1)
                      else:
                          state = 0
                          led.value(0)
                  time.sleep(0.05)
            question: 손가락이 버튼에 닿아 있는 0.3초 동안 바깥 반복은 몇 바퀴 돌까요? 그때마다 상태는 어떻게 되나요?
            rules:
              - codeMatches: 'while (\w+\.value\(\) == 0|not \w+\.value\(\)):'
                fail: 버튼을 누르고 있는 동안에도 반복은 계속 돌아요. 손을 뗄 때까지 기다리는 곳이 있나요?

      - id: design
        type: design
        title: 설계 — 기준을 스스로 정하는 터치
        minutes: 7
        scene:
          image: images/touch-principle.svg
          caption: 손 뗀 값은 패드마다 달라요. 시작할 때 재서, 그 절반을 기준으로
        body: |
          실행 2에서는 기준을 300 으로 정해 두었어요. 그런데 호일 크기나 선 길이가 바뀌면 손 뗀 값도 달라져서 300 이 안 맞을 수 있어요.

          이번엔 보드가 **스스로 기준을 정하게** 설계해요. 시작할 때 손을 뗀 채로 터치 값을 한 번 재서 `base` 에 담고, 그 **절반**을 기준 `limit` 으로 써요. `//` 는 나눈 몫(정수)을 구하는 기호예요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "한 번 재서 담는다"가 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 터치 핀 __번과 LED 핀 26번을 준비한다
            blank: { answer: 4 }
          - text: 손을 뗀 채로 터치 값을 한 번 재서 base 에 담는다
          - text: base 를 출력 창에 찍어 본다
          - text: 기준 limit 은 base 를 __(으)로 나눈 몫으로 정한다
            blank: { answer: 2 }
          - text: 계속 반복한다
          - text: "  ↳ 터치 값이 limit 보다 작으면 LED 를 켜고, 아니면 끈다"
          - text: "  ↳ __초 쉰다"
            blank: { answer: 0.1 }
        translation:
          - ["터치 핀을 준비한다", "touch = TouchPad(Pin(4))"]
          - ["터치 값을 한 번 재서 담는다", "base = touch.read()"]
          - ["나눈 몫으로 정한다", "limit = base // 2"]
          - ["터치 값이 기준보다 작으면", "if touch.read() < limit:"]
          - ["계속 반복한다", "while True:"]
        targetCode: design_touch_auto.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 5
        scene:
