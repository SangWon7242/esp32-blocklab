<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="bpu-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="bpu-title">풀업 버튼의 원리 세 칸. 손을 뗐을 때: 14번 핀이 풀업 저항을 거쳐 3.3V 에 이어져 값이 1. 눌렀을 때: 버튼이 핀을 GND 에 바로 이어 값이 0. 풀업이 없으면: 손을 뗐을 때 핀이 어디에도 안 이어져 0 과 1 이 제멋대로 나온다</title>
