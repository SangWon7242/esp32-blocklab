<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="btt-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="btt-title">누를 때마다 켜짐과 꺼짐이 바뀌는 상태 그림: 꺼짐(state = 0) 에서 누르면 켜짐(state = 1), 켜짐에서 누르면 꺼짐. 아래 시간표: 버튼을 세 번 누르면 LED 가 켜짐, 꺼짐, 켜짐. 길게 눌러도 한 번 누름은 한 번만 바뀐다</title>
  <defs><marker id="btt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <circle cx="180" cy="96" r="54" fill="var(--muted)" stroke-width="2.5"/>
  <text x="180" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" stroke="none">꺼짐</text>
  <text x="180" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">state = 0</text>
  <circle cx="460" cy="96" r="54" fill="#ffd43b" stroke-width="2.5"/>
  <text x="460" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1e1e" stroke="none">켜짐</text>
  <text x="460" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1e1e" stroke="none">state = 1</text>
  <path d="M232 76 Q320 26 408 76" stroke-width="2.5" marker-end="url(#btt-arrow)"/>
  <path d="M408 118 Q320 168 232 118" stroke-width="2.5" marker-end="url(#btt-arrow)"/>
  <rect x="301.3" y="33.5" width="37.5" height="21" rx="10.5" fill="var(--card)" stroke-width="1.5"/><text x="320.0" y="48.7" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">누름</text>
  <rect x="301.3" y="137.5" width="37.5" height="21" rx="10.5" fill="var(--card)" stroke-width="1.5"/><text x="320.0" y="152.7" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">누름</text>
  <text x="96" y="222" text-anchor="end" font-size="14" font-weight="700" fill="currentColor" stroke="none">버튼</text>
  <text x="96" y="290" text-anchor="end" font-size="14" font-weight="700" fill="currentColor" stroke="none">LED</text>
  <path d="M110 236 H610 M110 304 H610" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="150" y="206" width="60" height="30" rx="4" fill="#4562f5" fill-opacity="0.8" stroke="none"/>
  <text x="180.0" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" stroke="none">누름</text>
  <rect x="300" y="206" width="80" height="30" rx="4" fill="#4562f5" fill-opacity="0.8" stroke="none"/>
  <text x="340.0" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" stroke="none">누름</text>
  <rect x="470" y="206" width="50" height="30" rx="4" fill="#4562f5" fill-opacity="0.8" stroke="none"/>
  <text x="495.0" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" stroke="none">누름</text>
  <rect x="150" y="274" width="150" height="30" rx="4" fill="#ffd43b" stroke="none"/>
  <text x="225.0" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e" stroke="none">켜짐</text>
  <rect x="470" y="274" width="140" height="30" rx="4" fill="#ffd43b" stroke="none"/>
  <text x="540.0" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e" stroke="none">켜짐</text>
  <text x="385" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none" fill-opacity="0.6">꺼짐</text>
  <text x="340" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">길게 누르고 있어도 한 번 누름 = 한 번만 바뀜 (손을 뗄 때까지 기다리기)</text>
</svg>
