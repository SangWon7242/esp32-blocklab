# 교과 융합 F9 · 기억력 게임 — 원본: 마이크로비트 심화 W06 메모리 게임(SDG 3). 형식 설명은 src/track/README.md
# 터치 패드 3개(32·33·27) + 시작 버튼(14) + OLED(SCL 22 · SDA 21). 리스트 첫 챕터: 만들기·맨 뒤에 넣기·길이·칸 번호(0부터)·비우기
id: 36-memory-game
order: 36
track: fusion
label: F9
prerequisites: [11-button-touch, 21-oled]
subjects: [정보, 수학, 보건]
sdg: [3]
sessions: 2
teacherNotes: |
  **터치 기준값은 예시예요.** 코드의 `300` 은 보드 · 호일 크기 · 선 길이 · 손의 습기에 따라 맞지 않을 수 있어요. 1부 미션 1에서 세 패드의 **손 뗀 값과 만진 값**을 먼저 출력해 공책에 적고, 두 값 사이(대개 손 뗀 값의 절반쯤)로 `300` 을 고치게 해 주세요. 같은 반이라도 자리마다 달라요. 패드끼리 값이 많이 다르면 기준을 패드마다 따로 써도 돼요.

  **메이킹(1부 시작 10분)** 박스지를 손바닥 크기로 잘라 쿠킹 호일을 감싸 붙이고, 패드에 `a` · `b` · `c` 를 크게 적어요. 악어 클립은 호일 가장자리를 집고, 클립 다른 쪽은 32 · 33 · 27번 핀에 꽂은 M-F 듀폰선의 핀 끝을 집어요. 세 패드는 손가락 두 개 너비 이상 떨어뜨려야 서로 값이 섞이지 않아요.

  - **안전** 호일 가장자리는 종이처럼 베일 수 있어요. 가장자리를 박스지 뒤로 접어 테이프로 감싸게 해 주세요. 호일이 보드 핀이나 브레드보드 금속에 닿으면 합선이 나니 패드는 보드에서 떨어뜨려 둡니다.
  - **방향어 대신 a · b · c** 패드 이름과 화면 글자는 `a`/`A` · `b`/`B` · `c`/`C` 로만 씁니다(원본의 동 · 서 · 북 화살표 대신). 번호는 리스트 칸 번호와 같게 a 0 · b 1 · c 2 예요.
  - **2차시 나누기** 1부(문제 만나기 ~ 미션 1, 40분): 메이킹 · 리스트 만들기 · 패드 값 재기. 2부(실행 2 ~ 성찰, 45분): 입력 받기 · 비교 미션 · 디버깅 · 설계.
  - **점수** 이 챕터의 점수는 "넘긴 단계 수"(OK 를 받을 때마다 1)예요. 문제 수 − 3 과 같아요. 다른 셈법을 쓰려면 미션 판정 전에 반 전체가 정해 두세요.
  - **확장** 미션 뒤에 `answer == problem` 한 줄 비교(파이썬은 길이와 칸을 한꺼번에 봐 줌)를 보여 주세요. 먼저 끝낸 학생은 수동 부저(25번)로 패드마다 다른 소리를 넣거나(S9), 틀리기 전까지 걸린 시간을 재 보게 합니다(S20).
  - **흔한 막힘** 같은 글자가 이어 나오면 구별이 안 됨(보여 준 뒤 0.2초 비우기가 있는 까닭), 한 번 만졌는데 두 번 들어감(손을 뗄 때까지 기다리기), 2단계부터 늘 END(입력 리스트 비우기 · 맞은 개수 0 으로 되돌리기 — 디버깅 증상 2 · 3).

  **교과 연결**
  - 정보: 리스트(만들기 · 맨 뒤에 넣기 · 길이 · 칸 번호 0부터 · 비우기), 두 리스트 비교 알고리즘(길이 → 칸), 함수로 묶기.
  - 수학: 경우의 수. 글자 3개가 n 개 이어지면 3 × 3 × … = 3ⁿ 가지(3개 27, 4개 81, 5개 243). 성찰 단계 표를 수학 시간 활동으로.
  - 보건 · 사회: 치매 예방과 두뇌 자극 활동(SDG 3 건강과 웰빙), 세대 공감 — 가족과 게임하고 점수 · 소감 기록하기.
  - 과학: 정전식 터치와 전기 전도. 몸과 호일은 전기를 통하는 물체라 만지면 터치 값이 줄어요. 종이 · 플라스틱 · 연필심으로 패드를 바꿔 값을 비교해 볼 수 있어요.
title: 기억력 게임기
subtitle: 리스트 두 개를 비교하는 두뇌 게임
summary: |
  할머니가 요즘 자꾸 깜빡깜빡 잊으신대요. 머리를 쓰는 **기억력 게임기**를 만들어 드리면 어떨까요? OLED 화면에 글자가 하나씩 지나가면, 그 순서대로 **호일 패드 a · b · c** 를 만져요.
  보드는 낸 문제와 내가 만진 순서를 **리스트** 두 개에 담아 두고, **길이**부터 **칸마다** 비교해요. 다 맞으면 문제가 하나씩 늘어나고, 틀리면 점수를 보여 주고 끝나요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 마이크로 USB 선으로 노트북과 연결 }
  - { name: 브레드보드, note: "버튼만 꽂아요. OLED 는 보드에 바로" }
  - { name: OLED 화면 (128×64), note: "I2C 방식. 핀 4개: GND · VCC · SCL · SDA (모듈에 적힌 글자를 읽기)" }
  - { name: 버튼(푸시 버튼), note: "게임 시작 버튼(2부 설계). 다리 넷을 가운데 홈에 걸쳐 꽂아요" }
  - { name: 쿠킹 호일 + 박스지, note: "손바닥 크기 패드 3장. 호일을 박스지에 감싸 붙이고 a · b · c 라고 적어요" }
  - { name: 악어 클립 선, note: "3개. 한쪽은 호일 가장자리, 한쪽은 M-F 듀폰선의 핀 끝을 집어요" }
  - { name: F-F 듀폰선 4가닥, note: "양쪽 끝이 구멍인 선. OLED 네 핀을 보드 핀에 바로" }
  - { name: M-F 듀폰선 5가닥, note: "구멍 쪽은 보드 핀. 14번 · GND → 버튼 두 다리 줄, 32 · 33 · 27번 → 악어 클립" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "OLED GND · VCC · SDA · SCL → I2C 묶음 GND · 5V · SDA · SCL (F-F 로 바로). 버튼은 브레드보드 가운데 홈에 걸쳐 4 · 6번 줄: io14 → 6번 줄, 위쪽 GND → 대각선 다리 4번 줄. 호일 패드 a ← 아래 줄 io32, b ← 아래 줄 io33, c ← 위쪽 io27 (M-F 선 끝을 악어 클립으로)"
  captionDevkit: "OLED VCC → 3V3 · GND → GND · SDA → D21 · SCL → D22 (F-F 로 바로). 버튼은 브레드보드 가운데 홈에 걸쳐 2 · 4번 줄: D14 → 4번 줄, GND → 대각선 다리 2번 줄. 호일 패드 a ← D32, b ← D33, c ← D27 (M-F 선 끝을 악어 클립으로)"
principle:
  image: images/list-compare.svg
  body: |
    **터치 패드(과학)** 우리 몸과 호일은 전기가 잘 통하는 물체예요. 호일을 만지면 몸이 전기를 조금 담아 가서, 보드가 재는 **터치 값이 작아져요**. 값이 기준(예: 300)보다 작으면 "만졌다"고 봐요. 그래서 버튼 없이 호일 한 장이 스위치가 돼요.

    **리스트(정보)** 리스트는 값 여러 개를 **차례대로** 담는 상자 줄이에요. 칸 번호는 **0 부터** 세요. 보드가 낸 문제는 `problem`, 내가 만진 순서는 `answer` 리스트에 담아요.

    - 두 리스트가 같은지 보려면 먼저 **길이**(`len`)를 비교해요. 길이가 다르면 볼 것도 없이 달라요
    - 길이가 같으면 **같은 번호 칸끼리** 하나씩 비교해 맞은 개수를 세요. 맞은 개수가 길이와 같으면 두 리스트는 같아요
goals:
  content: 문제 리스트와 입력 리스트를 만들어 터치 패드로 입력을 받고, 길이 → 칸 순서로 비교해 단계가 늘어나는 기억력 게임을 완성한다
  thinking: 게임을 "보여 주기 → 입력 → 비교 → 다음 단계/끝" 덩어리로 나누고, 두 리스트가 같다는 규칙을 스스로 정해 코드로 옮긴다
successCriteria:
  - 리스트 칸 번호가 0 부터라는 것을 알고, names[n] 이 어떤 글자를 꺼내는지 말할 수 있다
  - 출력한 터치 값을 보고 내 패드에 맞는 기준을 정할 수 있다
  - 두 리스트를 길이 → 같은 번호 칸 순서로 비교해 맞은 개수를 세는 코드를 짤 수 있다
  - 단계가 바뀔 때 입력 리스트와 맞은 개수를 왜 비워야 하는지 설명할 수 있다
parts:
  - id: part1
    title: 1부 · 문제 리스트 만들고 보여 주기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 할머니를 위한 게임기
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 화면에 지나간 글자를 기억했다가, 그 순서대로 호일 패드 a · b · c 를 만져요
        body: |
          할머니가 요즘 깜빡깜빡 잊으신대요. 나이가 들수록 기억력이 줄어드는 건 흔한 일이지만, 머리를 꾸준히 쓰는 놀이는 뇌에 좋은 자극이 된다고 해요. 모두가 건강하게 사는 것은 유엔 지속가능발전목표 **SDG 3**(건강과 웰빙)이기도 해요.

          그래서 화면에 글자가 하나씩 지나가면 그 순서를 기억해 똑같이 누르는 **기억력 게임기**를 만들어 드리려고 해요. 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(OLED, 버튼, 호일, 박스지, 악어 클립, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 가족 가운데 이 게임을 같이 해 보고 싶은 사람을 한 명 떠올리기
        questions:
          - 할머니가 "A, C, B" 를 보고 순서대로 눌렀어요. 보드는 맞았는지 어떻게 알 수 있을까요? 보드가 기억해 두어야 할 것은 무엇일까요?
          - 단계마다 글자가 하나씩 늘어난다면, 보드는 늘어나는 글자들을 어디에 어떻게 담아 두면 좋을까요?
          - 할머니가 쓰기 편한 게임기가 되려면 화면 · 패드 · 속도를 어떻게 하면 좋을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 7
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          게임기를 부품마다 나눠 생각해 봐요. **터치 패드**는 누가 무엇을 만졌는지, **OLED** 는 무엇을 보여 줄지, **보드**는 무엇을 기억하고 비교할지 맡아요.

          보드는 "저기 저 패드" 같은 말을 몰라요. 패드에 **a · b · c** 이름을 붙이고, 리스트 칸 번호처럼 **0 · 1 · 2** 로 정해 두면 숫자로 기억할 수 있어요. 두 순서가 "같다"는 건 정확히 무엇이 같다는 뜻일까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 문제 순서 · 내가 만진 순서처럼 보드가 기억해야 할 것 적기"
          - "**정해야 할 것**: 패드 번호, 같다고 볼 규칙, 터치 기준 같은 것 적기"
          - "**해야 할 것**: OLED 와 보드가 차례대로 하는 일 적기"
        answer:
          know: ["문제 리스트 — 보드가 낸 글자 순서", "입력 리스트 — 내가 만진 패드 순서", "두 리스트의 길이(개수)", "리스트 칸 번호는 0 부터 센다"]
          decide: ["패드 a · b · c 를 0 · 1 · 2 번호로 정하기", "같다고 볼 규칙: 길이가 같고, 같은 번호 칸이 모두 같다", "터치 값이 몇보다 작으면 만진 것으로 볼지 (예: 300)", "글자 하나를 보여 줄 시간 (예: 0.5초)"]
          act: ["OLED 에 문제 글자를 하나씩 보여 주기", "만진 패드 번호를 입력 리스트에 넣기", "다 맞으면 OK 를 띄우고 문제를 하나 더하기", "틀리면 END 와 점수를 보여 주고 끝내기"]

      - id: predict
        type: predict
        title: 예측하기 — 리스트에 무엇이 담길까?
        minutes: 5
        scene:
          image: images/list-compare.svg
          caption: 리스트는 차례대로 담는 상자 줄이에요. 칸 번호는 0, 1, 2 … 로 0 부터 세요
        body: |
          아직 실행하지 않아요. `problem = []` 는 **빈 리스트**를 만들고, `problem.append(값)` 은 그 값을 리스트 **맨 뒤에** 넣어요. `random.randint(0, 2)` 는 0 · 1 · 2 가운데 하나를 아무렇게나 골라요.

          `for n in problem:` 은 리스트에서 앞에서부터 하나씩 꺼내 `n` 에 담아요. `names[n]` 은 `names` 리스트의 `n` 번 칸 글자예요. 코드를 따라가며 빈칸에 내 예측을 적어요.
        todo:
          - "`names` 리스트의 칸 번호와 글자를 짝지어 보기"
          - 두 반복이 각각 무엇을 하는지 한 줄씩 말해 보기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_problem_list.py
        blanks:
          - q: 출력 창에 찍히는 problem 은 어떤 모양일까요? 예를 하나 적어 보세요
          - q: problem 이 [1, 1, 0] 이면 화면에 어떤 글자가 차례로 뜰까요?
          - q: 글자 하나를 보여 주고 비우기까지 0.7초라면, 글자 세 개를 다 보여 주는 데 몇 초쯤 걸릴까요?
            unit: 초

      - id: run
        type: run
        title: 복사 · 실행 — 문제 글자 보여 주기
        minutes: 9
        scene:
          image: images/wiring-breadboard.svg
          caption: "오늘은 OLED 네 핀만 먼저 이어요: GND · VCC · SDA · SCL → I2C 묶음 GND · 5V · SDA · SCL"
          captionDevkit: "오늘은 OLED 네 핀만 먼저 이어요: VCC → 3V3 · GND → GND · SDA → D21 · SCL → D22"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 OLED 를 먼저 이어요. 버튼과 호일 패드는 뒤에서 이어도 돼요. OLED 라이브러리(`ssd1306.py`)는 **실행**을 누르면 블록랩이 함께 올려 줘요.

          실행할 때마다 글자 순서가 바뀌나요? 출력 창에 찍힌 리스트와 화면에 지나간 글자를 견주어 보세요. 같은 글자가 두 번 이어 나올 때도 알아볼 수 있나요?
        todo:
          - "**부품과 배선**대로 OLED 네 핀 잇기"
          - "**보드 연결** → **실행**을 세 번 눌러 보기"
          - 출력 창의 리스트와 화면 글자 순서를 공책에 나란히 적기
        code: step1_problem_list.py
