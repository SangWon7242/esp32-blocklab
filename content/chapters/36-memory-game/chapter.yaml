            rules:
              - codeMatches: 'for \w+ in range\((0, )?len\(\w+\)\):'
                fail: 리스트 첫 칸의 번호는 몇 번이었나요? 반복이 그 칸부터 마지막 칸까지 모두 보나요?
          - title: 1단계는 OK 인데, 2단계에서 패드 하나만 만져도 바로 비교해요
            code: |
              import random

              problem = [0, 2, 1]
              answer = [0, 2, 1]
              correct = 0
              for i in range(len(problem)):
                  if answer[i] == problem[i]:
                      correct += 1
              if correct == len(problem):
                  print("OK")
                  problem.append(random.randint(0, 2))
              print(problem)
              print(answer)
            question: OK 가 난 뒤 출력 창의 두 리스트 길이는 각각 몇인가요? 2단계에서 패드를 한 번 더 만지면 입력 리스트의 길이는 몇이 될까요?
            rules:
              - codeMatches: 'if \w+ == len\(\w+\):[\s\S]*(answer\.clear\(\)|answer = \[\])'
                fail: OK 가 난 뒤 입력 리스트에는 무엇이 남아 있나요? 다음 단계를 시작하기 전에 할 일이 있지 않을까요?
          - title: 두 번째 판도 똑같이 다 맞혔는데 END 가 나와요
            code: |
              problem = [0, 2, 1]
              answer = [0, 2, 1]
              correct = 0
              for game in range(2):
                  for i in range(len(problem)):
                      if answer[i] == problem[i]:
                          correct += 1
                  print(correct)
                  if correct == len(problem):
                      print("OK")
                  else:
                      print("END")
            question: 출력 창에 찍힌 맞은 개수는 판마다 몇인가요? 두 번째 판을 시작할 때 맞은 개수는 몇에서 출발하나요?
            rules:
              - codeMatches: '^ +correct = 0$'
                fail: 두 번째 판을 시작할 때 맞은 개수는 몇이어야 하나요? 0 으로 되돌리는 줄이 판마다 실행되나요?

      - id: design
        type: design
        title: 설계 — 시작 버튼이 있는 게임기 전체 흐름
        minutes: 7
        scene:
          image: images/game-flow.svg
          caption: 시작 → 보여 주기 → 입력 → 비교 → 다음 단계 또는 끝. 다음 단계는 다시 보여 주기로 돌아가요
        body: |
          할머니가 언제든 시작할 수 있게 **시작 버튼**(14번)을 달아요. 버튼을 누를 때까지 화면에 `PRESS START` 를 띄우고 기다리다가, 누르면 게임이 시작돼요. 끝나면 END 밑에 `SCORE` 와 점수를 함께 보여 줘요.

          게임기 전체를 우리말 설계도로 먼저 써 봐요. 두 함수(보여 주기 · 입력 받기)는 미리 만들어 두었고, 시작 블록 안의 순서를 맞추면 돼요. 빈칸을 채우고, 섞인 블록을 설계도 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "누를 때까지 기다린다"가 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 시작 버튼 __번, OLED, 터치 패드 a · b · c 를 준비한다
            blank: { answer: 14 }
          - text: "함수 show_problem: 문제 글자를 하나씩 보여 준다"
          - text: "함수 pick(n): n 을 입력 리스트에 넣고 글자를 띄운다"
          - text: 글자 리스트, 빈 문제 리스트, 빈 입력 리스트를 만든다
          - text: 점수를 __ 으로 정한다
            blank: { answer: 0 }
          - text: 화면에 PRESS START 를 띄운다
          - text: 시작 버튼을 누를 때까지 기다린다
          - text: 0~2 하나를 문제 리스트에 넣기를 __번 한다
            blank: { answer: 3 }
          - text: 문제를 보여 준다
          - text: 계속 반복한다
          - text: "  ↳ 만진 패드 번호로 pick 을 부른다"
          - text: "  ↳ 두 리스트의 __ 가 같으면 칸마다 비교한다"
            blank: { answer: 길이 }
          - text: "  ↳ 다 맞으면 OK · 점수 1 · 비우기 · 문제 1개 추가"
          - text: "  ↳ 아니면 END 와 SCORE 를 띄우고 멈춘다"
        translation:
          - ["빈 리스트를 만든다", "problem = []"]
          - ["맨 뒤에 넣는다", "problem.append(random.randint(0, 2))"]
          - ["리스트의 길이", "len(problem)"]
          - ["i 번 칸", "problem[i]"]
          - ["입력 리스트를 비운다", "answer.clear()"]
          - ["버튼을 누를 때까지 기다린다", "while button.value() == 1:"]
          - ["반복을 멈춘다", "break"]
        targetCode: design_memory_game.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 5
        scene:
          image: images/cases-table.svg
          caption: 글자가 하나 늘면 나올 수 있는 문제는 몇 배가 될까요? 3개면 27가지예요. 4개, 5개는 몇 가지일까요?
        body: |
          오늘은 리스트 두 개를 만들고, 길이 → 칸 순서로 비교해 게임을 완성했어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 비교 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요. 수학 시간에는 글자 수가 3, 4, 5 개일 때 나올 수 있는 문제가 몇 가지인지 표로 적고 규칙을 찾아보자. 집에서는 할머니 · 할아버지와 게임을 해 보고 서로의 점수와 소감을 기록해 보자.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 두 리스트 비교 순서를 설명하기
        lineExplain: reflect_compare.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 두 리스트가 같은지 볼 때 왜 길이부터 비교할까요? 길이를 보지 않고 칸부터 비교하면 어떤 일이 생길까요?
          - 할머니께 이 게임기를 드린다면 무엇을 바꾸고 싶나요? (글자 크기, 보여 주는 속도, 소리, 패드 크기 등)
          - "다음엔 여기부터 본다: 한 줄로"
