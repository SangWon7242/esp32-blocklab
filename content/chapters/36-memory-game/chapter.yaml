          - 같은 번호 칸끼리 비교해 맞은 개수를 세고, OK · END 두 갈래 만들기
          - 실행해서 두 단계 이상 해 본 뒤 **판정** 누르기
        instructions: "입력이 문제만큼 모이면 두 리스트를 비교하세요. (1) 길이가 같을 때만 비교하기 (2) 맞은 개수 correct 를 0 으로 정하고, 같은 번호 칸(answer[i] 와 problem[i])이 같으면 1 더하기 (3) 맞은 개수가 문제 길이와 같으면 화면에 OK, 점수 score 1 올리기, 문제 하나 더 넣고 다시 보여 주기. 아니면 화면에 END 와 점수를 띄우고 멈추기 (4) 다음 단계 전에 입력 리스트 비우기. score 는 반복 밖에서 0 으로 시작해요"
