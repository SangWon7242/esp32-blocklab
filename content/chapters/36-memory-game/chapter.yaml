          caption: "길이가 같은지 먼저, 그다음 0번 · 1번 · 2번 칸끼리 하나씩. 맞은 개수가 길이와 같으면 OK"
        body: |
          이제 게임을 완성해요. 입력이 문제만큼 모이면 지금은 리스트를 찍고 멈추기만 해요. 그 자리에서 **두 리스트를 비교**해야 해요. 길이가 같은지 먼저 묻고, 같은 번호 칸끼리 비교해 **맞은 개수**를 세요.

          다 맞았으면 OK 를 띄우고 점수를 올리고, 문제를 하나 늘려 다음 단계로 가요. 틀렸으면 END 와 점수를 보여 주고 끝내요. 다음 단계에서 `answer` 와 맞은 개수는 어떻게 되어 있어야 할까요? 판정 목록의 항목을 하나씩 채워 가요.

          다 되면 확장으로 하나 더: 파이썬은 `answer == problem` 한 줄로도 두 리스트를 비교해요. 길이와 칸을 한꺼번에 봐 주는데, 그 속에서 일어나는 일이 바로 오늘 직접 짠 비교예요.
