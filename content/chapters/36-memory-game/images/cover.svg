<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="mgc-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="mgc-title">기억력 게임기 표지: OLED 화면에 문제 글자가 A, C, B 차례로 하나씩 지나가고, 그 순서를 기억해 호일 패드 a · b · c 를 똑같이 만진다. 다 맞으면 OK 와 함께 글자가 하나 늘고, 틀리면 END 와 점수가 뜬다</title>
