  <text x="515.0" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">?</text>
  <text x="330" y="334" font-size="13" fill="currentColor" stroke="none">게임은 3개에서 시작해요. 4개, 5개면 몇 가지일까요?</text>
