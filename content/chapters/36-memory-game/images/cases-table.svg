<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="mgct-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="mgct-title">경우의 수: 첫 글자는 A · B · C 세 가지, 글자 두 개면 갈래가 3 × 3 = 9 가지로 나뉜다. 표: 글자 1개 3가지, 2개 9가지, 3개 27가지, 4개와 5개는 물음표로 비워 두고 규칙을 찾게 한다</title>
  <text x="32" y="38" font-size="16" font-weight="700" fill="currentColor" stroke="none">글자가 하나 늘면 문제는 몇 가지?</text>
