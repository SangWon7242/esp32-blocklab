# 챕터 10 · 다가가면 열리는 자동문 — 교사용 지도안(110분)·학생용 트랙 진행표의 표현 그대로. 형식 설명은 src/track/README.md
id: 10-auto-door
order: 10
track: fusion
label: F3
prerequisites: [17-ultrasonic, 18-servo, 21-oled]   # 먼저 할 챕터 (안내만). 아직 없는 챕터는 목록에서 "준비 중"
subjects: [과학, 수학]
sdg: [11]
sessions: 2
title: 다가가면 열리는 자동문
summary: |
  백화점 입구에 다가가면 손을 대지 않아도 문이 스르륵 열려요. 오늘은 **초음파 센서**로 거리를 재고, 가까우면 **서보 모터(문)** 를 열고 **OLED 화면**에 알려 주는 자동문을 만들어요.
  1부에서 센서로 거리 재기를 익히고, 2부에서 문과 화면을 붙여요. 코드는 복사해도 되지만, **복사한 코드를 설명할 수 없으면 다음으로 넘어가지 않아요.**
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 마이크로 USB 선으로 PC 와 연결 }
  - { name: HC-SR04 초음파 센서, note: "핀 4개를 F-F 듀폰선으로 보드 위쪽 5V · GND · 13 · 12 에 바로. USB 를 뺀 채, GND 선부터" }
  - { name: 서보 모터, note: "문 역할. 플러그를 ANALOG 묶음 io4 줄에 그대로 꽂기 (갈색 G · 빨강 V · 주황 S)" }
  - { name: OLED 0.96" (SSD1306), note: "SDA 21 · SCL 22. 보드에 ssd1306.py 를 먼저 올려 두기" }
  - { name: F-F 듀폰선 8가닥, note: "양쪽 끝이 구멍인 선. 모듈 핀과 보드 핀에 바로 씌워요 (초음파 4 · OLED 4)" }
  - { name: (추가 미션) 브레드보드 · LED · 220Ω 저항 · 점퍼선(M-M), note: "LED 는 저항이 필요해서 브레드보드에 꽂아요. 챕터 1 배선과 같아요" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring: { image: images/wiring-door.svg, caption: "브레드보드 없이 보드에 바로 꽂아요. 초음파 VCC → 5V · GND → GND · Trig → 13 · Echo → 12 (위쪽 한 줄), OLED GND · VCC · SDA · SCL → I2C 묶음 GND · 5V · SDA · SCL, 서보 플러그 → ANALOG io4 줄 (갈색 G · 빨강 V · 주황 S)" }
principle:
  image: images/ultrasonic-principle.svg
  body: |
    초음파 센서는 사람 귀에 들리지 않는 높은 소리(40kHz)를 쏘고, 물체에 부딪혀 돌아오는 **메아리**를 들어요. 박쥐가 길을 찾는 방법과 같아요.

    - **Trig** 핀에 10마이크로초 동안 1(HIGH)을 주면 센서가 소리를 쏘아요
    - **Echo** 핀은 소리가 갔다가 돌아올 때까지 1 로 켜져 있어요. 그 시간이 **왕복 시간**이에요
    - 소리는 1초에 약 340m 를 가요. 왕복 시간의 **절반**에 소리 빠르기를 곱하면 물체까지의 거리가 나와요 (거리 = 340 × 시간 ÷ 2)
goals:
  content: 초음파로 잰 거리를 if 로 판단해 서보(문)와 OLED(화면)를 함께 제어한다
  thinking: 문제를 세 덩어리로 분해하고, 실행 결과를 미리 예측하고, 증상에서 원인을 역추적한다
successCriteria:
  - 센서가 거리를 어떻게 재는지 내 말로 설명할 수 있다
  - 문이 열리는 기준 숫자를 내가 정하고 그 이유를 말할 수 있다
  - 오류가 났을 때 어디부터 봐야 할지 안다
parts:
  - id: part1
    title: 1부 · 초음파 센서 익히기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 백화점 문은 어떻게 알까?
        minutes: 4
        scene: { image: images/cover.svg, caption: "문에는 눈이 없어요. 그런데 어떻게 사람이 온 걸 알까요?" }
        body: |
          백화점 입구로 걸어가면 손을 대지 않아도 문이 스르륵 열려요. 그런데 문에는 눈이 없죠. 문은 **무엇으로** 사람이 왔다는 걸 알까요?

          아직 코드도 부품도 없어요. 활동 칸의 세 질문에 **내 생각을 한두 문장**으로 적어 보세요. 정답은 없고, 틀려도 괜찮아요.
        todo:
          - 세 질문에 내 생각을 한두 문장씩 적기
          - 숫자를 묻는 질문에는 **숫자와 그 이유**를 함께 적기
          - 다 적으면 **완료** 누르기
        questions:
          - 문은 무엇을 '보고' 사람이 왔다고 판단할까요? 눈이 없다면 무엇으로 보죠?
          - 몇 cm 까지 가까이 가야 열려야 할까요? 그 숫자는 누가, 무엇을 생각해서 정하죠?
          - 사람이 지나간 뒤에 문은 언제 닫혀야 할까요? 몇 초쯤 열어 두면 좋을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 6
        scene: { image: images/three-boxes.svg, caption: "알아야 할 것 · 정해야 할 것 · 해야 할 것" }
        body: |
          자동문이 하는 일을 **세 덩어리**로 나눠 봐요. 부품 이름은 몰라도 괜찮아요. "무엇을" 알고, 정하고, 해야 하는지만 적어요.

          - **알아야 할 것**: 문이 바깥에서 알아내야 하는 것
          - **정해야 할 것**: 사람(우리)이 미리 정해 줘야 하는 숫자
          - **해야 할 것**: 문이 실제로 하는 행동

          "거리"만 알면 정말 충분할까요? 또 알아야 할 게 있는지도 생각해 봐요.
        todo:
          - 세 칸에 각각 하나 이상 적기
          - 예시 답을 열어 내 답에도 있는 항목에 체크하기
          - 빠진 것이 있으면 내 칸에 덧붙이기
        answer:
          know: ["앞에 무언가 있는지", "그것이 몇 cm 떨어져 있는지"]
          decide: ["몇 cm부터 열 것인지", "몇 초 동안 열어 둘 것인지"]
          act: ["문을 여닫는 것", "지금 상태를 알려 주는 것"]

      - id: predict
        type: predict
        title: 예측하기 — 실행 전 3문항
        minutes: 4
        scene: { image: images/ultrasonic-principle.svg, caption: "trig 가 소리를 쏘고, 벽에 부딪혀 돌아온 메아리를 echo 가 들어요" }
        body: |
          초음파 센서는 박쥐처럼 **소리를 쏘고, 벽에 부딪혀 돌아오는 메아리**를 들어요. 소리가 갔다 오는 데 걸린 시간의 **절반**에 소리 빠르기를 곱하면 거리가 나와요.

          아직 실행하지 마세요. `step1_distance.py` 를 돌리면 창에 어떤 숫자가 찍힐지 **먼저 예측**해 적어요. 왜 그렇게 생각했는지 근거도 한 문장 떠올려 보세요. 틀린 예측도 좋은 예측이에요.
        todo:
          - 그림을 보고 센서가 거리를 재는 방법을 내 말로 말해 보기
          - 세 경우의 숫자를 cm 로 예측해 적기
          - 예측마다 근거를 한 문장씩 생각해 두기
        code: step1_distance.py
        blanks:
          - q: 센서 앞 1m 쯤 떨어진 벽을 향하면? (cm)
          - q: 손바닥으로 센서를 완전히 덮으면? (cm)
          - q: 창문 밖 허공을 향하면? (cm)

      - id: run1
        type: run
        title: 복사 · 실행 — 거리 재기
        minutes: 5
        scene: { image: images/wiring-ultrasonic.svg, caption: "보드 위쪽 한 줄의 글자를 읽어요: 5V · GND 옆에 18 19 23 5 13 12. 센서 핀 4개를 F-F 듀폰선으로 바로 씌워요" }
        body: |
          이제 센서를 보드에 **바로** 이어요. 브레드보드는 쓰지 않아요. F-F 듀폰선(양쪽 끝이 구멍인 선) 4가닥으로 센서 핀과 보드 위쪽 한 줄의 핀을 짝지어요: VCC → `5V`, GND → `GND`, Trig → `13`, Echo → `12`. 보드 핀 위에 적힌 글자를 손가락으로 짚으며 찾아요.

          **USB 를 뺀 상태에서** 꽂고, **GND 선을 가장 먼저** 꽂아요. 다 꽂으면 짝에게 "검사관"이 되어 달라고 해요.

          실행한 뒤에는 손을 센서 앞에서 앞뒤로 움직여 보세요. 창에 찍히는 숫자가 따라 바뀌나요? 아까 적은 예측과 비교해 봐요.
        todo:
          - USB 를 뺀 채 F-F 듀폰선 4가닥으로 VCC → 5V · GND → GND · Trig → 13 · Echo → 12 잇기
          - "**보드 연결** → **실행** 누르기"
          - 손을 움직이며 숫자를 보고, 예측과 비교하기
        code: step1_distance.py
        expected: 코드를 실행하면 2초 뒤부터 창에 `23 cm` 처럼 센서 앞 물체까지의 거리가 0.5초마다 한 줄씩 찍히고, 손을 가까이 대면 숫자가 작아져요.
        codeNotes:
          - { line: 4, note: "13번 핀(Trig)을 내보내는 핀으로 정하고 `trig` 라고 이름 붙여요" }
          - { line: 5, note: "12번 핀(Echo)을 받아들이는(입력) 핀으로 정하고 `echo` 라고 이름 붙여요" }
          - { line: 9, note: "Trig 에 1 을 주고 10마이크로초 뒤 0 으로 돌리면 센서가 소리를 쏘아요" }
          - { line: 14, note: "Echo 가 1 이 된 순간의 시각(마이크로초)을 `start` 에 적어 둬요" }
          - { line: 17, note: "Echo 가 0 으로 돌아온 순간의 시각을 `stop` 에 적어 둬요" }
          - { line: 18, note: "`ticks_diff` 로 두 시각의 차이(왕복 시간)를 구하고 `// 2` 로 절반만 남겨요" }
          - { line: 19, note: "소리 빠르기 340m/s 를 곱하고 단위를 바꿔 cm 로 돌려줘요" }
          - { line: 25, note: "거리를 재서 숫자와 `cm` 를 창에 찍어요" }

      - id: readcheck1
        type: readcheck
        title: 읽기 체크 ①
        minutes: 5
        scene: { image: images/wiring-ultrasonic.svg, caption: "코드의 핀 번호와 실제 선을 짝지어 읽어 봐요" }
        body: |
          방금 실행한 `step1_distance.py` 를 **위에서 아래로 손가락으로 짚으며** 읽어요. 복사한 코드를 "이게 무슨 뜻인지" 말할 수 없으면 다음으로 넘어가지 않는 게 오늘의 약속이에요.

          답을 **공책에 먼저 적은 뒤** 확인을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - "`trig` · `echo` 줄과 `get_distance` 함수를 한 줄씩 읽기"
          - 세 문항에 답하고 **확인** 누르기
          - 틀린 문항은 그 줄을 다시 읽고 고치기
        code: step1_distance.py
        codeNotes:
          - { line: 8, note: "`def get_distance():` 거리를 재서 cm 로 알려 주는 함수를 만들어요" }
          - { line: 12, note: "`while not echo.value(): pass` Echo 가 1 이 될 때까지 아무것도 안 하고 기다려요" }
          - { line: 19, note: "소리 빠르기 340m/s 를 곱하고 단위를 바꿔 cm 로 돌려줘요" }
          - { line: 22, note: "센서가 깨어날 시간 2초를 기다려요" }
          - { line: 25, note: "거리를 재서 숫자와 `cm` 를 창에 찍어요" }
        questions:
          - { kind: choice, q: "소리를 쏘는 핀은 둘 중 어느 것인가요? (몇 번 핀인지도 코드에서 찾아보세요)", options: ["trig", "echo"], answer: 0, hint: "trig 는 trigger(방아쇠)" }
          - { kind: number, q: "get_distance 함수 안에서 시간을 적어 두는 줄은 몇 개인가요?", answer: 2 }
          - { kind: number, q: "t = time.ticks_diff(stop, start) // 2 줄에서 // 2 를 지우면 찍히는 숫자는 지금의 몇 배가 될까요?", answer: 2 }

      - id: mission1
        type: mission
        title: 연습 미션 — if 로 판단하기
        minutes: 7
        scene: { image: images/threshold.svg, caption: "기준선 15 cm: 이보다 가까울 때만 다르게 행동해요" }
        body: |
          지금 코드는 거리를 숫자로 찍기만 해요. 이제 컴퓨터가 **판단**하게 해 봐요: 15cm 보다 가까우면 창에 `가까워요!` 도 함께 찍는 거예요. 아직 문도 화면도 없이 `print` 로만 연습해요.

          잰 거리를 `d` 라는 이름에 담아 두면 판단하기 쉬워요. `print` 를 `if` 안에 넣는 것과 밖에 두는 건 뭐가 다를까요? 정답 파일은 먼저 보지 마세요.
        todo:
          - 잰 거리를 `d` 에 담기
          - 15cm 보다 가까울 때 `가까워요!` 를 찍는 두 줄 추가하기
          - "**판정** 누르고, 실행해서 손을 15cm 안에 넣어 보기"
        instructions: 15cm보다 가까워지면 창에 '가까워요!' 라고 찍어 주세요. 거리 숫자는 계속 찍고, 가까울 때만 한 줄을 더 찍어요
        code: step1_distance.py
        hint: "if d < 15: 아래 줄은 한 칸 더 들여쓰기"
        rules:
          - codeMatches: "if d < 15:"
            fail: 거리를 판단하는 if 줄이 있나요? 15보다 작을 때예요
          - codeMatches: 'print\("가까워요!"\)'
            fail: 가까울 때 찍을 말이 '가까워요!' 인가요?
        answerCode: practice_near.py

      - id: debug1
        type: debug
        title: 디버깅 미션 ①
        minutes: 6
        scene: { image: images/debug-flow.svg, caption: "증상을 보고 어디부터 볼지 먼저 정해요" }
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 숫자 문제면 배선부터, 에러가 뜨면 빨간 글씨의 줄 번호부터 봐요.

          셋 중 **에러 메시지가 뜨는 것**은 어느 것일까요? 나머지 둘은 왜 에러 없이 이상하게만 굴까요? 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 숫자가 계속 0만 나와요
            code: "trig = Pin(12, Pin.OUT)\necho = Pin(13, Pin.IN)"
            question: 숫자 문제는 배선부터 봐요. 소리를 쏘는 선과 듣는 선이 실제로 몇 번에 꽂혀 있는지, 코드의 번호와 짝지어 보세요. 어디가 바뀌었나요?
            rules:
              - codeMatches: 'trig = Pin\(13'
                fail: 쏘는 선과 듣는 선, 어느 쪽이 13번이죠?
          - title: 빨간 글씨로 IndentationError 가 떠요
            code: "if d < 15:\nprint(\"가까워요!\")"
            question: 빨간 글씨가 몇 번째 줄이라고 하나요? 그 줄이 if 안에 있으려면 무엇이 빠졌나요?
            rules:
              - codeMatches: "    print"
                fail: 에러가 몇 번째 줄이라고 하나요?
          - title: 에러는 없는데 10초에 한 번만 재요
            code: |
              from machine import Pin
              import time

              trig = Pin(13, Pin.OUT)

              trig.value(1)
              time.sleep(10)
              trig.value(0)
            question: 소리는 아주 잠깐만 쏘아야 해요. 기다리는 시간을 정하는 줄에서 무엇이 잘못됐나요?
            rules:
              - codeMatches: 'sleep_us\(10\)'
                fail: _us 가 붙고 안 붙고가 뭘 바꿀까요?

  - id: part2
    title: 2부 · 자동문 만들기
    steps:
      - id: design
        type: design
        title: 설계 — 우리말로 먼저 쓰기
        minutes: 5
