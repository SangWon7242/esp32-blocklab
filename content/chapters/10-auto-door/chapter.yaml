      - id: run2
        type: run
        title: 복사 · 실행 — 완성 코드
        minutes: 4
        scene: { image: images/wiring-door.svg, caption: "서보 플러그 → ANALOG io4 줄(갈색 G · 빨강 V · 주황 S), OLED → I2C 묶음(GND · 5V · SDA · SCL). 핀이 겹치지 않는지 확인!" }
        body: |
          이제 서보(문)와 OLED(화면)를 더 연결해요. 이번에도 **USB 를 뺀 채로**, 브레드보드 없이 보드에 바로 꽂아요. 서보는 세 색 선이 모인 **플러그**를 ANALOG 묶음의 `4` 줄에 그대로 꽂아요. 갈색이 `G`, 빨강이 `V`, 주황이 `S` 쪽이에요. OLED 는 F-F 듀폰선 4가닥으로 **I2C 묶음**에 이어요: GND → `GND`, VCC → `5V`, SDA → `SDA`(21번), SCL → `SCL`(22번). 핀이 겹치지 않는지 짝과 확인해요.

          완성 코드 `step3_auto_door.py` 를 실행하고 손을 센서 앞 15cm 안으로 넣어 보세요. 화면이 `DOOR OPEN` 으로 바뀌고, 문이 열렸다가 잠시 뒤 닫히나요? 화면이 아예 안 켜지면 보드에 `ssd1306.py` 가 있는지 확인해요.
        todo:
          - USB 를 뺀 채 서보 플러그를 io4 줄에, OLED 를 I2C 묶음에 꽂기
          - "**실행** 누르고 손을 15cm 안에 넣어 보기"
          - 화면 글씨가 바뀌고 문이 열렸다 닫히는지 보기
        code: step3_auto_door.py
        expected: 코드를 실행하면 화면에 `AUTO DOOR` / `Come closer` 가 떠요. 손을 센서 앞 15cm 안에 넣으면 화면이 `DOOR OPEN` 과 거리로 바뀌며 문(서보)이 열리고, 잠시 뒤 `DOOR CLOSE` / `Bye~` 와 함께 닫힌 다음 대기 화면으로 돌아가요.
        codeNotes:
          - { line: 8, note: "4번 핀의 서보를 문으로 써요 (50Hz, 처음엔 닫기)" }
          - { line: 12, note: "OLED 화면이 쓸 두 선(SCL 22번, SDA 21번)을 정해요" }
          - { line: 16, note: "`def get_distance():` 1부에서 만든 거리 재는 함수 그대로예요" }
          - { line: 30, note: "`def show(a, b):` 화면을 지우고 두 줄을 띄우는 함수예요" }
          - { line: 38, note: "처음 대기 화면을 띄워요" }
          - { line: 41, note: "거리를 재서 `d` 에 담아요" }
          - { line: 42, note: "`if d < 15:` 15cm 보다 가까울 때만 아래 들여 쓴 줄들을 실행해요" }
          - { line: 44, note: "`duty_u16(8100)`: 문을 열어요" }

