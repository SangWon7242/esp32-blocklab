          1부의 "가까우면 알려 주기"를 떠올려 보세요. 이번에는 알려 주는 대신 **문을 열었다가, 기다렸다가, 닫으면** 돼요. 정답은 하나가 아니에요. 빈칸을 채운 뒤 번역표를 보며 블록을 순서대로 조립해요.
