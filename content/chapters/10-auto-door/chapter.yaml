        body: |
          먼저 끝낸 사람을 위한 디버깅이에요. 화면 문제는 `oled` 줄부터 봐요.

          `oled.text(...)` 로 글씨를 적었는데 화면은 그대로예요. 공책에 적어 두는 것과 친구에게 **보여 주는 것**은 같은 일일까요?
