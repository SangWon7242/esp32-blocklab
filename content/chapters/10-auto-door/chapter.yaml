      - id: extra
        type: mission
        title: 추가 미션 — 문이 열리면 LED도 켜기
        optional: true
        scene: { image: images/servo-door.svg, caption: "문을 여는 줄 옆에 LED 켜기, 닫는 줄 옆에 LED 끄기" }
        body: |
          진짜 자동문에는 "열리는 중" 표시등이 달려 있기도 해요. 문이 열리면 **LED 도 같이 켜고**, 문이 닫히면 끄도록 고쳐 보세요.

          LED 는 `26`번 핀에 연결해요: 26번 → 220Ω 저항 → LED 긴 다리, 짧은 다리 → 브레드보드 − 줄(GND). 챕터 1 배선과 같아요.

          더 해 보기: 사람이 25cm 밖으로 나갈 때까지 문을 열어 두려면 어떻게 바꿔야 할까요? 15cm 바로 근처에 서 있으면 문이 왜 덜덜 떨릴까요?
        todo:
          - LED 를 26번 핀에 연결하기
          - LED 핀을 만들고, 열 때 켜고 닫을 때 끄기
          - "**판정** 누르기"
        instructions: 문이 열리면 LED도 같이 켜고, 문이 닫히면 꺼 주세요 (LED 는 26번 핀)
        code: step3_auto_door.py
        rules:
          - codeMatches: 'led\.value\(1\)[\s\S]*led\.value\(0\)'
            fail: LED를 켜는 줄과 끄는 줄이 모두 들어갔나요?
          - pinIs: { name: led, pin: 26 }
            fail: LED 는 몇 번 핀에 꽂았나요? 그 핀을 led 라는 이름으로 준비했나요?
        answerCode: extra1_led.py

