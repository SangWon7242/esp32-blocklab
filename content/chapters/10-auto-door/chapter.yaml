            code: |
              from machine import Pin, SoftI2C
              import ssd1306

              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)


              def show(a, b):
                  oled.fill(0)
                  oled.text(a, 0, 20)
                  oled.text(b, 0, 36)


              show("AUTO DOOR", "Come closer")
            question: 적어 두는 것과 보여 주는 것은 같나요? 완성 코드의 show 함수와 비교하면 무엇이 빠졌나요?
            rules:
              - codeMatches: 'oled.show\(\)'
