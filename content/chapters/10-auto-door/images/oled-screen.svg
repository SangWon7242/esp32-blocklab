<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="os-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="os-title">OLED 대기 화면 비교: 지금은 AUTO DOOR 와 Come closer 만 보이고, 미션을 끝내면 둘째 줄에 지금 거리(예: 23 cm)가 보인다</title>
  <defs>
    <marker id="os-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="currentColor" stroke-width="2"/>
    </marker>
  </defs>
  <!-- 지금 -->
  <text x="160" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">지금</text>
  <rect x="40" y="76" width="240" height="170" rx="12" fill="var(--card)"/>
  <rect x="58" y="94" width="204" height="120" rx="4" fill="#1d4ed8"/>
  <text x="76" y="140" font-size="16" font-weight="700" fill="#ffffff" stroke="none">AUTO DOOR</text>
  <text x="76" y="176" font-size="16" fill="#ffffff" stroke="none">Come closer</text>
  <!-- 화살표 -->
  <path d="M296 160 H344" stroke-width="2.5" marker-end="url(#os-arrow)"/>
  <!-- 미션 뒤 -->
  <text x="480" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">미션 뒤</text>
  <rect x="360" y="76" width="240" height="170" rx="12" fill="var(--card)"/>
  <rect x="378" y="94" width="204" height="120" rx="4" fill="#1d4ed8"/>
  <text x="396" y="140" font-size="16" font-weight="700" fill="#ffffff" stroke="none">AUTO DOOR</text>
  <text x="396" y="176" font-size="16" fill="#ffffff" stroke="none">23 cm</text>
  <path d="M452 196 H508" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="320" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">대기 화면 둘째 줄에 지금 거리가 보이게</text>
  <text x="320" y="320" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">손을 움직이면 숫자가 따라 바뀌어요</text>
</svg>
