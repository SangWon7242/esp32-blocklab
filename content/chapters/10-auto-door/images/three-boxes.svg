<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="tb-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="tb-title">자동문이 하는 일을 세 칸으로 나누는 보드: 알아야 할 것, 정해야 할 것, 해야 할 것</title>
  <text x="320" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">자동문을 세 덩어리로 나눠요</text>
  <!-- 칸 1: 알아야 할 것 (눈) -->
  <rect x="24" y="68" width="184" height="236" rx="12" fill="var(--card)"/>
  <rect x="24" y="68" width="184" height="10" rx="5" fill="#5b9a1a" stroke="none"/>
  <path d="M76 140 Q116 104 156 140 Q116 176 76 140 Z"/>
  <circle cx="116" cy="140" r="12" fill="#5b9a1a"/>
  <text x="116" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">알아야 할 것</text>
  <text x="116" y="236" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">문이 알아내야</text>
  <text x="116" y="256" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">하는 것은?</text>
  <!-- 칸 2: 정해야 할 것 (자) -->
  <rect x="228" y="68" width="184" height="236" rx="12" fill="var(--card)"/>
  <rect x="228" y="68" width="184" height="10" rx="5" fill="#f4af18" stroke="none"/>
  <rect x="262" y="124" width="116" height="34" rx="4" fill="#f4af18" fill-opacity="0.25"/>
  <path d="M282 124 V138 M302 124 V134 M322 124 V138 M342 124 V134 M362 124 V138"/>
  <text x="320" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">정해야 할 것</text>
  <text x="320" y="236" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">우리가 미리 정할</text>
  <text x="320" y="256" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">숫자는?</text>
  <!-- 칸 3: 해야 할 것 (화살표) -->
  <rect x="432" y="68" width="184" height="236" rx="12" fill="var(--card)"/>
  <rect x="432" y="68" width="184" height="10" rx="5" fill="#c92a2a" stroke="none"/>
  <rect x="486" y="112" width="34" height="56" rx="2" fill="var(--muted)"/>
  <rect x="528" y="112" width="34" height="56" rx="2" fill="var(--muted)"/>
  <path d="M500 140 H476 M484 133 L476 140 L484 147 M548 140 H572 M564 133 L572 140 L564 147" stroke="#c92a2a" stroke-width="2.5"/>
  <text x="524" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">해야 할 것</text>
  <text x="524" y="236" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">문이 실제로</text>
  <text x="524" y="256" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">하는 행동은?</text>
  <text x="320" y="340" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">부품 이름은 몰라도 괜찮아요. "무엇을" 만 적어요</text>
</svg>
