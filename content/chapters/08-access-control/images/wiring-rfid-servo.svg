  <title id="ar-title">RFID 와 서보 브레드보드 배선도: RFID 모듈 SDA 는 21번, SCL 은 22번, G 는 − 줄, V 는 + 줄. 서보 모터 주황 신호선은 4번, 빨강은 + 줄, 갈색은 − 줄. 브레드보드 + 줄은 ESP32 5V, − 줄은 ESP32 GND. 미션용 LED: 26번에서 220옴 저항을 거쳐 LED 긴 다리, 짧은 다리는 − 줄</title>
