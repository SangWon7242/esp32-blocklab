<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="asg-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="asg-title">서보 차단기 문: duty_u16(1638) 이면 서보 팔이 누워 길을 막은 닫힌 자리(0도), duty_u16(8100) 이면 팔이 돌아 올라가 길이 열린 자리</title>
  <defs>
    <marker id="asg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#c92a2a" stroke-width="2"/>
    </marker>
  </defs>
  <path d="M20 260 H300 M340 260 H620"/>
  <!-- 닫힘 -->
  <rect x="48" y="196" width="44" height="64" rx="4" fill="var(--card)"/>
  <rect x="40" y="160" width="60" height="44" rx="6" fill="#c92a2a"/>
  <rect x="70" y="174" width="210" height="14" rx="4" fill="var(--card)"/>
  <path d="M110 174 v14 M150 174 v14 M190 174 v14 M230 174 v14 M270 174 v14" stroke="#c92a2a" stroke-width="7"/>
  <circle cx="70" cy="181" r="8" fill="var(--card)"/>
  <text x="200" y="160" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">팔이 누워 길을 막아요 (0°)</text>
  <text x="160" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">닫힌 자리</text>
  <text x="160" y="322" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">duty_u16(1638)</text>
  <!-- 가운데 화살표 -->
  <path d="M302 110 H338 M328 102 L338 110 L328 118" stroke-width="2.5"/>
  <!-- 열림 -->
  <rect x="368" y="196" width="44" height="64" rx="4" fill="var(--card)"/>
  <rect x="360" y="160" width="60" height="44" rx="6" fill="#c92a2a"/>
  <rect x="390" y="174" width="210" height="14" rx="4" stroke-dasharray="6 6" opacity="0.45"/>
  <g transform="rotate(-80 390 181)">
    <rect x="390" y="174" width="150" height="14" rx="4" fill="var(--card)"/>
    <path d="M430 174 v14 M470 174 v14 M510 174 v14" stroke="#c92a2a" stroke-width="7"/>
  </g>
  <circle cx="390" cy="181" r="8" fill="var(--card)"/>
  <path d="M590 166 A190 190 0 0 0 440 40" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#asg-arrow)"/>
  <text x="505" y="226" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">팔이 돌아 올라가요</text>
  <text x="480" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">열린 자리</text>
  <text x="480" y="322" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">duty_u16(8100)</text>
  <text x="320" y="352" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">duty_u16 안의 숫자 하나로 서보 팔의 자리가 바뀌어요</text>
</svg>
