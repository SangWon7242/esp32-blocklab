# 챕터 8 · 스마트 출입 통제 시스템 — 수업 저장소 08_출입통제. 형식 설명은 src/track/README.md
# 미션 판정의 codeEquals 는 tolerance 255: 학생마다 카드 번호(0~255 숫자 넷)가 달라도 통과하게. 핀·켜고 끄기는 따로 규칙으로 본다
id: 08-access-control
order: 8
title: 스마트 출입 통제 시스템
summary: |
  학교 출입문에 카드를 갖다 대면 "삑" 하고 문이 열려요. 오늘은 **RFID 리더**로 카드 번호를 읽고, 그 번호가 **들여보낼 카드 목록**에 있을 때만 **서보 모터(문)** 를 여는 출입 통제 장치를 만들어요.
  1부에서 카드 읽기와 서보 움직이기를 따로 익히고, 2부에서 둘을 합쳐 완성해요. 복사한 코드를 설명할 수 없으면 다음으로 넘어가지 않아요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: RFID RC522 모듈, note: "I2C 방식. 핀 4개: SDA → 21 · SCL → 22 · G → GND · V → 5V" }
  - { name: IC 카드 또는 열쇠고리 태그, note: 카드마다 번호가 달라요 }
  - { name: 서보 모터, note: "문 역할. 주황 신호선 → 4 · 빨강 → 5V · 갈색 → GND" }
  - { name: 브레드보드, note: "+ 줄(5V)·− 줄(GND)을 RFID 와 서보가 함께 쓰고, 미션 LED 도 여기에 꽂아요" }
  - { name: 점퍼선, note: "F-F 듀폰선(모듈 ↔ 보드) 여러 가닥, 브레드보드에 꽂을 때는 M-F" }
  - { name: (미션) 빨강 LED 1개 · 220Ω 저항 1개, note: "26번 → 저항 → LED 긴 다리, 짧은 다리 → − 줄" }
  - { name: USB 선, note: 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-rfid-servo.svg
  caption: "RFID SDA → 21 · SCL → 22 · G → − 줄 · V → + 줄. 서보 주황 → 4 · 빨강 → + 줄 · 갈색 → − 줄. + 줄은 ESP32 5V, − 줄은 GND. (미션) 26번 → 220Ω → LED 긴 다리, 짧은 다리 → − 줄"
goals:
  content: RFID 로 읽은 카드 번호를 등록 목록과 if·in 으로 비교해, 그 결과에 따라 서보(문)와 LED 를 제어한다
  thinking: 큰 장치를 부품별로 나눠 따로 시험한 뒤 합치고, "같은가"를 판단하는 기준(목록)을 사람이 정한다
successCriteria:
  - 내 카드 번호를 읽어 적고, 그 번호가 숫자 몇 개로 되어 있는지 말할 수 있다
  - "== 로 한 장을 비교하는 것과 목록과 in 으로 여러 장을 비교하는 것의 차이를 설명할 수 있다"
  - 문이 안 열릴 때 배선 · 라이브러리 · 번호 목록 중 어디부터 볼지 안다
parts:
  - id: part1
    title: 1부 · 카드 읽기와 서보 시험
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 문은 카드를 어떻게 알아볼까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 카드를 리더에 대면 문(차단기)이 올라가요. 문은 카드에서 무엇을 알아낼까요?
        body: |
          학교나 아파트 출입문은 열쇠 대신 **카드**를 갖다 대기만 하면 열려요. 그런데 아무 카드나 대도 열리면 안 되겠죠?

          아직 코드도 부품도 없어요. 활동 칸의 세 질문에 **내 생각을 한두 문장**으로 적어 보세요. 정답은 없고, 틀려도 괜찮아요.
        todo:
          - 준비물(RFID 모듈, 카드, 서보, 선)을 책상에 꺼내 놓기
          - 세 질문에 내 생각을 한두 문장씩 적기
          - 다 적으면 **완료** 누르기
        questions:
          - 카드를 리더에 대면 문은 카드에서 무엇을 알아낼까요? 카드마다 무엇이 다를까요?
          - 문은 "들여보내도 되는 카드"를 어떻게 알고 있을까요? 누가, 어디에 정해 두어야 할까요?
          - 들여보낼 친구가 한 명 더 생기면 무엇을 바꿔야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          출입문이 하는 일을 **세 덩어리**로 나눠 봐요. 부품 이름은 몰라도 괜찮아요. "무엇을" 알고, 정하고, 해야 하는지만 적어요.

          카드 번호를 읽기만 하면 끝일까요? 그 번호를 **무엇과 비교**해야 문을 열지 말지 정할 수 있을지도 생각해 봐요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 문이 바깥에서 알아내야 하는 것 적기"
          - "**정해야 할 것**: 사람(우리)이 미리 정해 둬야 하는 것 적기"
          - "**해야 할 것**: 문이 실제로 하는 행동 적기"
        answer:
          know: ["카드가 리더에 닿았는지", "그 카드의 번호(UID)"]
          decide: ["들여보낼 카드 번호 목록", "문이 닫힌 자리와 열린 자리", "문을 얼마나 열어 둘지"]
          act: ["카드 번호를 읽기", "번호가 목록에 있는지 비교하기", "문(서보)을 열거나 닫아 두기"]

      - id: predict
        type: predict
        title: 예측하기 — 카드를 대면 무엇이 찍힐까?
        minutes: 5
        scene:
          image: images/i2c-lines.svg
          caption: "RFID 리더는 SCL(22번)·SDA(21번) 두 선으로 보드와 말을 주고받아요. 0x28 은 리더의 이름표(주소)예요"
        body: |
          RFID 리더는 카드가 가까이 오면 카드 안의 **번호(UID)** 를 읽어요. 보드와는 **선 두 개**(SCL·SDA)로 이야기하고, `0x28` 이라는 이름표로 "너한테 하는 말이야"를 구분해요.

          아직 실행하지 마세요. `step1_read_uid.py` 를 돌리고 카드를 대면 창에 무엇이 찍힐지 **먼저 예측**해 적어요. `if` 가 두 번 겹쳐 있는 것도 눈여겨보세요.
        todo:
          - 그림을 보고 SCL·SDA 가 각각 몇 번 핀인지 코드에서 찾기
          - 세 빈칸에 내 예측 쓰기
          - 예측마다 근거를 한 문장씩 생각해 두기
        code: step1_read_uid.py
        blanks:
          - q: 카드를 대면 창에 숫자가 몇 개 찍힐까요?
            unit: 개
          - q: 카드를 떼지 않고 계속 대고 있으면 번호가 몇 번 찍힐까요?
            unit: 번
          - q: 짝의 카드를 대면 내 카드와 같은 숫자가 나올까요? 왜 그렇게 생각하나요?

      - id: run1
        type: run
        title: 복사 · 실행 — 내 카드 번호 읽기
        minutes: 8
        scene:
          image: images/wiring-rfid-servo.svg
          caption: "지금은 RFID 만: SDA → 21 · SCL → 22 · G → − 줄 · V → + 줄. + 줄은 5V, − 줄은 GND 에 이어요"
        body: |
          **USB 를 뺀 채로** RFID 모듈을 연결해요. SDA → 21번, SCL → 22번, G → GND(− 줄), V → 5V(+ 줄). 브레드보드의 + 줄은 ESP32 5V, − 줄은 GND 에 이어 두면 2부에서 서보도 같이 써요.

          RFID 는 혼자 말하지 못해서 **라이브러리 파일 3개**(`mfrc522_i2c.py` · `mfrc522_config.py` · `soft_iic.py`)가 보드에 있어야 해요. 실행하면 블록랩이 함께 올려 줘요.

          실행하고 카드를 대 보세요. 찍힌 숫자를 **공책에 꼭 적어 두세요.** 2부에서 "내 카드"로 등록할 번호예요.
        todo:
          - USB 를 뺀 채 RFID 4선(SDA · SCL · G · V) 연결하기
          - "**보드 연결** → **실행** 누르고 카드를 대 보기"
          - 찍힌 내 카드 번호를 공책에 적고, 예측과 비교하기
        code: step1_read_uid.py

      - id: readcheck1
        type: readcheck
        title: 읽기 체크 ①
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          방금 실행한 `step1_read_uid.py` 를 **위에서 아래로 손가락으로 짚으며** 읽어요. 복사한 코드를 "이게 무슨 뜻인지" 말할 수 없으면 다음으로 넘어가지 않는 게 오늘의 약속이에요.

          답을 **공책에 먼저 적은 뒤** 확인을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - "`scl` · `sda` 줄과 `while True:` 아래를 한 줄씩 읽기"
          - 세 문제에 답하고 **확인** 누르기
          - 틀린 문항은 그 줄을 다시 읽고 고치기
        code: step1_read_uid.py
        questions:
          - { kind: number, q: "RFID 의 데이터선(SDA)은 몇 번 핀에 이어야 하나요? 코드에서 찾아보세요", answer: 21 }
          - { kind: number, q: "카드 번호가 찍히려면 if 를 몇 번 통과해야 하나요?", answer: 2, hint: "카드가 왔는지, 번호를 읽었는지" }
          - { kind: line, q: "카드 번호를 창에 보여 주는 줄의 줄 번호를 클릭하세요", answer: 17 }

      - id: run2
        type: run
        title: 복사 · 실행 — 서보로 문 움직여 보기
        minutes: 6
        scene:
          image: images/servo-gate.svg
          caption: "duty_u16(1638) 은 팔이 누운 닫힌 자리, duty_u16(8100) 은 팔이 선 열린 자리"
        body: |
          이번에는 문 역할을 할 **서보 모터**만 따로 시험해요. 큰 장치는 부품마다 따로 확인한 뒤에 합쳐야, 고장 났을 때 어디가 문제인지 찾기 쉬워요.

          USB 를 뺀 채 서보를 연결해요: 주황 신호선 → 4번, 빨강 → + 줄(5V), 갈색 → − 줄(GND). 실행하면 2초마다 닫힌 자리와 열린 자리를 오가요. 팔(혼)이 **닫힌 자리에서 문을 막는 방향**이 되도록 끼워 두세요.
        todo:
          - USB 를 뺀 채 서보 3선(주황 · 빨강 · 갈색) 연결하기
          - "**실행** 누르고 팔이 2초마다 움직이는지 보기"
          - 닫힌 자리에서 팔이 문을 막도록 혼을 다시 끼우기
        code: step2_servo_test.py

  - id: part2
    title: 2부 · 출입 통제 완성
    steps:
      - id: run3
        type: run
        title: 복사 · 실행 — 내 카드로만 열리는 문
        minutes: 7
        scene:
          image: images/wiring-rfid-servo.svg
          caption: "RFID 와 서보가 브레드보드의 + 줄(5V)·− 줄(GND)을 함께 써요. 서보 신호는 4번, RFID 는 21·22번"
        body: |
          이제 1부의 두 코드를 합쳐요. `step3_access_control.py` 는 카드 번호를 읽어 `uid1` 과 **같으면** 문을 열고, 다르면 닫아 둬요.

          실행하기 전에 `uid1 = [180, 180, 170, 219]` 의 네 숫자를 **1부에서 적은 내 카드 번호**로 바꿔요. 그다음 내 카드와 짝의 카드를 번갈아 대 보세요. 카드를 한 번 댄 뒤에는 **떼었다가 다시** 대야 또 읽혀요.
        todo:
          - "`uid1` 의 숫자 네 개를 내 카드 번호로 바꾸기"
          - "**실행** 누르고 내 카드 → 짝의 카드 순서로 대 보기"
          - 어느 카드에서 문이 열리고 닫히는지 보기
        code: step3_access_control.py

      - id: readcheck2
        type: readcheck
        title: 읽기 체크 ②
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 비교하는 줄과 그 아래 들여 쓴 줄들을 손가락으로 짚어 봐요
        body: |
          이번에는 완성 코드에서 **판단하는 부분**을 읽어요. 읽은 번호는 `uid`, 내가 등록한 번호는 `uid1` 이에요. 둘을 비교한 결과에 따라 어떤 줄이 실행되는지 따라가 보세요.

          답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - "`if uid == uid1:` 과 `else:` 아래 줄을 짚으며 읽기"
          - 세 문제에 답하고 **확인** 누르기
        code: step3_access_control.py
        questions:
          - { kind: line, q: "읽은 카드 번호와 등록한 번호를 비교하는 줄의 줄 번호를 클릭하세요", answer: 26 }
          - { kind: choice, q: "등록하지 않은 카드를 대면 서보는 어느 자리로 가나요?", options: ["열린 자리 (8100)", "닫힌 자리 (1638)", "어느 쪽으로도 신호를 보내지 않는다"], answer: 1 }
          - { kind: number, q: "등록된 카드를 대면 문을 연 뒤 몇 초 동안 기다렸다가 다음 카드를 보나요?", answer: 1 }

      - id: mission1
        type: mission
        title: 미션 ① — 카드가 늘어나도 괜찮게
        minutes: 8
        scene:
          image: images/uid-compare.svg
          caption: 읽은 번호가 목록 안에 있으면 열림, 없으면 닫힘. 목록에 줄만 더하면 카드가 늘어나요
        body: |
          지금은 `uid1` 한 장만 비교해요. 친구 카드를 더하려면 `uid2`, `uid3` 을 만들고 `or` 로 이어 붙여야 할까요? 열 명이면요?

          대신 **들여보낼 카드 목록** `allowed` 를 만들고, `in` 으로 "목록 안에 있니?"를 물어봐요. 목록 안의 한 칸이 카드 **한 장의 번호(숫자 넷)** 예요. 카드가 한 장이어도 시험할 수 있어요: 목록의 숫자 하나를 일부러 틀리게 바꾸면 내 카드로도 안 열려야 해요.
        todo:
          - "`uid1` 줄을 카드 목록 `allowed` 로 바꾸고, 비교를 `in` 으로 바꾸기"
          - "준비 줄 정리: `rc522 = mfrc522(22, 21, 0x28)` 한 줄로, 버전 확인 줄은 지우기"
          - 실행해서 내 카드로 열리는지 보고 **판정** 누르기
        instructions: |
          카드 한 장(uid1)과 == 로 비교하던 것을, 들여보낼 카드 목록 allowed 와 in 으로 바꿔 주세요. 목록에는 지금은 내 카드 한 장만 넣어요 (번호는 내 카드 번호여도 괜찮아요).
          준비 줄도 정리해요: addr · scl · sda 세 줄 대신 rc522 = mfrc522(22, 21, 0x28) 처럼 숫자를 바로 넣고, 확인이 끝난 버전 확인 줄(ShowReaderDetails)은 지워요
        hint: 목록 안에 목록이에요. 카드 한 장이 [숫자, 숫자, 숫자, 숫자] 라면, 카드들의 목록은 그 바깥을 [ ] 로 한 번 더 감싸요
        code: step3_access_control.py
        rules:
          - codeMatches: '^allowed = \[\['
            fail: allowed 목록이 있나요? 목록의 한 칸이 카드 한 장의 번호(숫자 넷)가 되려면 괄호가 몇 겹이어야 할까요?
          - codeMatches: 'if uid in allowed:'
            fail: 읽은 번호가 목록 "안에" 있는지 묻는 비교로 바꿨나요?
          - codeEquals: { file: mission_allowed_list.py, tolerance: 255 }
            fail: 남은 곳이 있어요. uid1 줄은 지웠나요? 준비 줄(addr · scl · sda, 버전 확인)도 정리했나요?
        answerCode: mission_allowed_list.py

      - id: mission2
        type: mission
        title: 미션 ② — 문이 열리면 불도 켜지게
        minutes: 8
        scene:
          image: images/breadboard-basics.svg
          caption: "LED 는 브레드보드에: 26번 → 220Ω 저항 → LED 긴 다리, 짧은 다리 → − 줄. 같은 번호의 다섯 칸은 이어져 있어요"
        body: |
          **조립 + 코드 미션**이에요. 문이 열려 있는 동안 **빨강 LED** 가 켜지게 해 봐요. 배선은 1장과 같아요: 26번 → 220Ω 저항 → LED 긴 다리, 짧은 다리 → 브레드보드 − 줄(GND).

          코드는 미션 ① 을 마친 코드에서 시작해요. LED 를 준비하는 줄, 처음에 꺼 두는 줄, 열 때 켜는 줄, 닫을 때 끄는 줄이 필요해요. 각각 어느 줄 **바로 아래**에 두면 좋을까요?
        todo:
          - USB 를 뺀 채 LED · 저항을 브레드보드에 꽂고 26번과 − 줄에 잇기
          - LED 핀을 준비하고, 처음엔 끄고, 열 때 켜고, 닫을 때 끄기
          - 실행해서 내 카드를 대 보고 **판정** 누르기
        instructions: |
          문이 열려 있는 동안 LED 가 켜지게 해 주세요 (LED 는 26번 핀, 이름은 led).
          LED 준비 줄은 서보 준비 바로 아래, 처음에 끄는 줄은 문을 닫아 두는 줄 바로 아래, 켜고 끄는 줄은 각각 문을 열고 닫는 줄 바로 아래에 둬요
        hint: "led = Pin(26, Pin.OUT) 로 준비하고, led.value(1) 은 켜기, led.value(0) 은 끄기예요"
        code: mission_allowed_list.py
        rules:
          - pinIs: { name: led, pin: 26 }
            fail: LED 핀을 준비했나요? 몇 번 핀에 꽂았는지 다시 보세요
          - codeMatches: 'duty_u16\(8100\)\n\s*led\.value\(1\)'
            fail: 문을 여는 줄 바로 아래에서 LED 를 켜나요?
          - codeMatches: '^ +servoPin\.duty_u16\(1638\)\n\s*led\.value\(0\)'
            fail: 모르는 카드라 문을 닫을 때 LED 도 끄나요?
          - codeEquals: { file: mission_led.py, tolerance: 255 }
            fail: 남은 곳이 있어요. 처음에 LED 를 꺼 두는 줄이 있나요? 줄들이 설명한 자리에 있나요?
        answerCode: mission_led.py

      - id: debug
        type: debug
        title: 디버깅 미션 — 문이 안 열려요
        minutes: 7
        scene:
          image: images/i2c-lines.svg
          caption: "숫자가 안 찍히면 선(SCL·SDA)부터, 빨간 글씨면 import 줄부터, 내 카드인데 안 열리면 번호 목록부터"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 카드를 대도 아무것도 안 찍히면 배선부터, 빨간 글씨가 뜨면 그 줄부터, 찍히는데 안 열리면 비교하는 목록부터 봐요.

          셋 중 **에러 메시지가 뜨는 것**은 어느 것일까요? 나머지 둘은 왜 에러 없이 이상하게만 굴까요? 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 카드를 대도 창에 아무것도 안 찍혀요
            code: "scl = 21\nsda = 22\nrc522 = mfrc522(scl, sda, addr)"
            question: 선 두 개가 실제로 몇 번 핀에 꽂혀 있는지, 코드의 번호와 짝지어 보세요. 신호선(SCL)과 데이터선(SDA) 중 무엇이 바뀌었나요?
            rules:
              - codeMatches: '^scl = 22'
                fail: SCL 선은 보드의 몇 번 핀에 꽂았나요?
              - codeMatches: '^sda = 21'
                fail: SDA 선은 보드의 몇 번 핀에 꽂았나요?
          - title: "실행하자마자 빨간 글씨로 ImportError: no module named 'mfrc522' 가 떠요"
            code: "from mfrc522 import mfrc522"
            question: 보드에 올라간 RFID 설명서(라이브러리) 파일의 이름은 무엇이었나요? import 줄의 이름과 같은가요? 라이브러리 파일 3개가 한 세트라는 것도 떠올려 보세요
            rules:
              - codeMatches: '^from mfrc522_i2c import mfrc522'
                fail: 파일 이름 mfrc522_i2c.py 와 import 줄의 이름이 같나요?
          - title: 번호는 찍히는데, 내 카드를 대도 문이 안 열려요
            code: "allowed = [180, 180, 170, 219]\nif uid in allowed:\n    servoPin.duty_u16(8100)"
            question: "uid 는 숫자 넷이 든 목록 하나예요. 지금 allowed 안의 한 칸 한 칸은 무엇인가요? 그중에 [180, 180, 170, 219] 와 똑같은 칸이 있나요?"
            rules:
              - codeMatches: '^allowed = \[\[\d+, \d+, \d+, \d+\]'
                fail: allowed 의 한 칸이 카드 한 장(숫자 넷)이 되었나요?

      - id: design
        type: design
        title: 설계 — 우리말로 먼저 쓰기
        minutes: 6
        scene:
          image: images/servo-gate.svg
          caption: 문을 열었다가, 기다렸다가, 저절로 닫기 — 이 순서를 우리말로 먼저 써요
        body: |
          진짜 출입문은 사람이 지나가면 **저절로 닫혀요.** 등록된 카드를 대면 문을 열고, 3초 뒤 저절로 닫는 출입문을 설계해요. 코드를 쓰기 전에 **우리말로 먼저!**

          블록 **RFID 준비하기** 는 카드가 왔는지 보는 `card_present()` 와 번호를 꺼내는 `card_uid()` 를 함께 만들어 줘요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "목록에 있으면"이 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 문(서보)을 닫힌 채로 준비하고, RFID 리더를 준비한다
          - text: 들여보낼 카드 번호를 __ 에 담는다
            blank: { answer: 목록(allowed) }
          - text: 계속 반복한다
          - text: 만약 카드가 __ 에 닿으면
            blank: { answer: 리더(RFID) }
          - text: 만약 그 카드 번호가 목록 안에 있으면
          - text: 문을 __
            blank: { answer: 연다 }
          - text: __ 초 기다린다
            blank: { answer: "3" }
          - text: 문을 __
            blank: { answer: 닫는다 }
          - text: 0.1 초 쉬었다가 다시 본다
        translation:
          - ["카드가 리더에 있는가", "card_present()"]
          - ["카드 번호", "card_uid()"]
          - ["목록 안에 있으면", "if card_uid() in allowed:"]
          - ["문을 연다", "servo.duty_u16(8100)"]
          - ["문을 닫는다", "servo.duty_u16(1638)"]
          - ["기다린다", "time.sleep(초)"]
        targetCode: design_access.py

      - id: extra
        type: mission
        title: 추가 미션 — 댈 때마다 열고 닫기
        optional: true
        minutes: 7
        scene:
          image: images/servo-gate.svg
          caption: 닫혀 있으면 열고, 열려 있으면 닫고. 지금 어느 쪽인지 기억할 이름이 필요해요
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 같은 카드를 **다시 대면 문이 닫히게** 해 봐요. 전등 스위치처럼 댈 때마다 열림 ↔ 닫힘이 바뀌는 거예요.

          그런데 보드는 문이 지금 열려 있는지 기억하지 못해요. **기억할 이름** `is_open` 을 하나 만들고(처음엔 `False`), 문을 열 때와 닫을 때마다 바꿔 적어 두면 어떨까요?
        todo:
          - "`allowed` 줄 바로 아래에 `is_open = False` 만들기"
          - 등록된 카드면 is_open 을 보고 열거나 닫고, 그때마다 is_open 바꾸기
          - 실행해서 같은 카드를 두 번 대 보고 **판정** 누르기
        instructions: |
          같은 카드를 다시 대면 문이 닫히게 해 주세요. allowed 줄 바로 아래에 is_open = False 를 두고, 등록된 카드면 열려 있었을 때는 닫고(is_open = False), 닫혀 있었을 때는 열고(is_open = True), 그다음 1초 기다려요.
          모르는 카드일 때의 else 덩어리와 print 줄은 지워요
        hint: "if uid in allowed: 안에 if is_open: / else: 가 하나 더 들어가요"
        code: mission_allowed_list.py
        rules:
          - codeMatches: '^is_open = False'
            fail: 문이 열려 있는지 기억할 이름을 처음에 무엇으로 정해 두었나요?
          - codeMatches: 'if is_open:'
            fail: 문을 열지 닫을지 정하려면 무엇을 먼저 물어봐야 할까요?
          - codeMatches: 'is_open = True'
            fail: 문을 연 뒤에 열렸다는 것을 기억해 두었나요?
          - codeEquals: { file: extra2_toggle.py, tolerance: 255 }
            fail: 지우기로 한 줄(else 덩어리, print)이 남아 있지 않나요? 1초 기다리는 줄은 어디에 있어야 할까요?
        answerCode: extra2_toggle.py

