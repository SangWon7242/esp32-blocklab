          - "== 로 한 장을 비교하는 것과 목록과 in 으로 비교하는 것은 무엇이 다른가요? 카드가 30장이면요?"
          - 이 출입 통제 장치를 학교 어디에 달면 좋을까요? 누구의 카드를 등록하고, 무엇을 더 바꿔야 할까요?
          - "다음엔 여기부터 본다: 한 줄로"
