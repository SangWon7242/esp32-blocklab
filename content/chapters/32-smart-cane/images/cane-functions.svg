<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="scf-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="scf-title">함수로 나눈 지팡이: 계속 반복 상자 안에서 거리 확인 함수, 빛 확인 함수, 기울기 확인 함수를 차례로 부르고 0.1초 쉰다. 거리 확인은 가까우면 삐, 빛 확인은 어두우면 LED, 기울기 확인은 누우면 알림을 맡는다</title>
  <defs>
    <marker id="scf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <text x="32" y="40" font-size="15" font-weight="700" fill="currentColor" stroke="none">일을 셋으로 나누고, 반복에서 차례로 부르기</text>
  <!-- 반복 상자 -->
  <rect x="32" y="64" width="232" height="264" rx="12" fill="var(--card)"/>
  <text x="48" y="92" font-size="14" font-weight="700" fill="currentColor" stroke="none">계속 반복</text>
  <path d="M32 104 H264" stroke-opacity="0.4"/>
  <g font-size="13" fill="currentColor" stroke="none">
    <rect x="52" y="120" width="192" height="36" rx="8" fill="#1971c2" fill-opacity="0.16"/>
    <text x="64" y="143">1  거리 확인 부르기</text>
    <rect x="52" y="172" width="192" height="36" rx="8" fill="#f59f00" fill-opacity="0.2"/>
    <text x="64" y="195">2  빛 확인 부르기</text>
    <rect x="52" y="224" width="192" height="36" rx="8" fill="#2f9e44" fill-opacity="0.18"/>
    <text x="64" y="247">3  기울기 확인 부르기</text>
    <text x="64" y="300" fill-opacity="0.75">0.1초 쉬고 처음으로</text>
  </g>
  <path d="M40 284 V312 H24 V76 H40" stroke-opacity="0.5" marker-end="url(#scf-arrow)"/>
  <!-- 함수 상자 -->
  <g stroke-width="1.5">
    <rect x="336" y="64" width="272" height="76" rx="10" fill="#1971c2" fill-opacity="0.12"/>
    <rect x="336" y="158" width="272" height="76" rx="10" fill="#f59f00" fill-opacity="0.14"/>
    <rect x="336" y="252" width="272" height="76" rx="10" fill="#2f9e44" fill-opacity="0.12"/>
  </g>
  <g font-size="13" fill="currentColor" stroke="none">
    <text x="352" y="90" font-weight="700">거리 확인</text>
    <text x="352" y="114">앞에 무엇이 가까이 있으면</text>
    <text x="352" y="130">부저로 삐</text>
    <text x="352" y="184" font-weight="700">빛 확인</text>
    <text x="352" y="208">어두우면</text>
    <text x="352" y="224">LED 로 남에게 알리기</text>
    <text x="352" y="278" font-weight="700">기울기 확인</text>
    <text x="352" y="302">지팡이가 누우면</text>
    <text x="352" y="318">알림</text>
  </g>
  <path d="M244 138 H328" marker-end="url(#scf-arrow)"/>
  <path d="M244 190 C290 190 290 196 328 196" marker-end="url(#scf-arrow)"/>
  <path d="M244 242 C290 242 290 290 328 290" marker-end="url(#scf-arrow)"/>
  <path d="M244 132 C286 132 290 102 328 102" stroke-opacity="0"/>
</svg>
