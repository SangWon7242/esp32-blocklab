<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sct-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sct-title">지팡이의 세 감각. 초음파: 소리를 쏘고 벽에서 돌아온 메아리까지 걸린 시간으로 거리를 잰다(거리 = 340 × 시간 ÷ 2). 조도 센서: 이 회로는 밝으면 값이 작고 어두우면 값이 크다(0~4095). 틸트 스위치: 서 있으면 구슬이 두 다리를 이어 0, 누우면 구슬이 굴러가 1</title>
  <defs>
    <marker id="sct-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="var(--card)" stroke-width="1.5">
    <rect x="16" y="56" width="196" height="284" rx="12"/>
    <rect x="222" y="56" width="196" height="284" rx="12"/>
    <rect x="428" y="56" width="196" height="284" rx="12"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">
    <text x="114" y="84">초음파 · 거리</text>
    <text x="320" y="84">조도 센서 · 빛</text>
    <text x="526" y="84">틸트 · 기울기</text>
  </g>
  <!-- 1 초음파 -->
  <rect x="32" y="130" width="40" height="56" rx="4" fill="#2f9e44" fill-opacity="0.22"/>
  <circle cx="52" cy="146" r="9" fill="var(--card)" stroke-width="1.5"/>
  <circle cx="52" cy="170" r="9" fill="var(--card)" stroke-width="1.5"/>
  <rect x="176" y="112" width="20" height="96" rx="2" fill="var(--muted)"/>
  <text x="186" y="226" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">벽</text>
  <path d="M80 144 H168" stroke="#1971c2" stroke-dasharray="6 5" marker-end="url(#sct-arrow)"/>
  <path d="M168 172 H82" stroke="#1971c2" stroke-dasharray="2 5" marker-end="url(#sct-arrow)"/>
  <text x="124" y="136" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">쏜다</text>
  <text x="124" y="192" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">메아리</text>
  <g font-size="12" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="114" y="252">소리는 1초에 약 340m</text>
    <text x="114" y="274">갔다 온 시간의 절반 ×</text>
    <text x="114" y="292">소리 빠르기 = 거리</text>
    <text x="114" y="322" font-weight="700">거리 = 340 × 시간 ÷ 2</text>
  </g>
  <!-- 2 조도 -->
  <circle cx="262" cy="134" r="14" fill="#f59f00" fill-opacity="0.35"/>
  <path d="M262 110 V102 M262 166 V158 M238 134 H230 M294 134 H286 M245 117 L240 112 M279 117 L284 112 M245 151 L240 156 M279 151 L284 156" stroke="#f59f00"/>
  <text x="262" y="186" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">밝음</text>
  <path d="M380 122 A16 16 0 1 0 392 150 A13 13 0 1 1 380 122 Z" fill="currentColor" fill-opacity="0.35"/>
  <text x="380" y="186" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">어두움</text>
  <rect x="242" y="206" width="156" height="18" rx="9" fill="var(--muted)"/>
  <rect x="242" y="206" width="40" height="18" rx="9" fill="#f59f00" fill-opacity="0.5" stroke="none"/>
  <rect x="242" y="236" width="156" height="18" rx="9" fill="var(--muted)"/>
  <rect x="242" y="236" width="132" height="18" rx="9" fill="currentColor" fill-opacity="0.35" stroke="none"/>
  <g font-size="12" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="320" y="276">0 ············ 4095</text>
    <text x="320" y="300">이 회로는 어두울수록</text>
    <text x="320" y="318">값이 커져요</text>
  </g>
  <!-- 3 틸트 -->
  <rect x="456" y="112" width="30" height="72" rx="15" fill="var(--muted)"/>
  <circle cx="471" cy="168" r="10" fill="#2f9e44" fill-opacity="0.6"/>
  <path d="M464 184 V200 M478 184 V200" stroke-width="2.5"/>
  <text x="471" y="222" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">서 있음 → 0</text>
  <rect x="520" y="146" width="80" height="30" rx="15" fill="var(--muted)"/>
  <circle cx="586" cy="161" r="10" fill="#2f9e44" fill-opacity="0.6"/>
  <path d="M520 155 H506 M520 167 H506" stroke-width="2.5"/>
  <text x="560" y="222" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">누움 → 1</text>
  <g font-size="12" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="526" y="262">안의 금속 구슬이</text>
    <text x="526" y="280">다리를 잇거나 떨어져</text>
    <text x="526" y="300">0 과 1 을 만들어요</text>
  </g>
</svg>
