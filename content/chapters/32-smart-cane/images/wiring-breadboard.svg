<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sc-wiring-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sc-wiring-title">브레드보드 배선도: 위쪽 칸(a~e)에 초음파 센서(1~4번 줄: VCC · Trig · Echo · GND), 수동 부저(+ 다리 7번 줄, − 다리 9번 줄), 조도 센서 모듈(17 · 18 · 19번 줄: S · + · −), 틸트 스위치 모듈(24 · 25 · 26번 줄: S · + · −)을 꽂는다. ESP32 5V → 1번 줄(VCC), 13번 → 2번 줄(Trig), 12번 → 3번 줄(Echo), 15번 → 7번 줄(부저 +), 36번 → 17번 줄(조도 S), 14번 → 24번 줄(틸트 S). 초음파 GND · 부저 − · 두 모듈의 − 는 위 − 줄, 두 모듈의 + 는 위 + 줄. 아래 + 줄은 3V3, 아래 − 줄은 GND 에 잇고, 오른쪽 끝에서 위아래 + 줄끼리 · − 줄끼리 잇는다. LED는 1 · 2장과 같은 자리: 26번 → 7번 줄(j) → 220Ω 저항 → 12번 줄 긴 다리, 13번 줄 짧은 다리 → 아래 − 줄</title>
