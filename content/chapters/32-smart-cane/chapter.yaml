# 교과 융합 F5 · 스마트 지팡이 — 원본: 마이크로비트 심화 W02 시각장애인을 위한 스마트 지팡이(SDG 10). 형식 설명은 src/track/README.md
id: 32-smart-cane
order: 32
track: fusion
label: F5
prerequisites: [12-melody-buzzer, 14-light-sensor, 16-tilt-pir, 17-ultrasonic]   # 먼저 할 챕터 (안내만)
subjects: [과학, 수학, 사회, 도덕]
sdg: [10]
sessions: 2
teacherNotes: |
  **교과 · 단원 연결**
  - 과학: 소리의 성질(소리는 물체에 부딪혀 되돌아온다 · 소리의 높낮이), 빛과 그림자(빛의 세기). 초음파 반사는 원리 카드와 예측하기에서 다룬다
  - 수학: 비례(거리와 삐 간격 표 → 거리가 2배면 간격도 2배, 간격 = 거리 × 10). 성찰 단계에서 표를 그리게 한다
  - 사회 · 도덕: 장애 이해와 인권, 보조 기기가 왜 필요한지(SDG 10 불평등 해소). 흰 지팡이가 왜 흰색인지 함께 이야기한다

  **도입(안대 체험)** 짝과 둘이서, 한 사람은 안대를 하고 다른 사람이 팔꿈치를 잡아 안전하게 이끌며 교실 안 짧은 길을 걷는다. 체험 뒤 "걸을 때 어떤 정보가 필요했나"를 공책에 쓰고, 그것을 세 칸 보드의 **알아야 할 것**으로 옮긴다. 책상 모서리 · 문턱 같은 위험한 곳은 미리 치워 둔다.

  **진지하게 다루기** 원본 노트처럼 장애를 놀림거리나 장난으로 다루지 않게 한다. 체험은 "불편함 흉내"가 아니라 "어떤 정보가 필요한지 알아보기"라고 미리 말한다. 반에 시각장애가 있거나 가족이 있는 학생이 있으면 체험 방식을 미리 상의한다.

  **측정값 안내**
  - 30cm 는 예시 기준이다. 걸음 빠르기 · 지팡이 길이에 따라 모둠이 정해도 된다
  - 빛 기준 2500 도 예시다. 이 챕터는 S11 처럼 3V3 — 10kΩ — 36번 — 포토레지스터 — GND 로 꽂아 **어두울수록 값이 커진다**. 실행 2에서 손으로 가렸을 때 · 폈을 때 값을 재고 그 사이로 기준을 정하게 한다(디버깅 증상 3 의 `10` 은 마이크로비트 빛 값 0~255 에서 온 숫자). 10kΩ 저항과 포토레지스터 자리를 바꿔 꽂으면 값이 반대로 움직이니, 이상하면 배선도와 먼저 비교하게 한다
  - 틸트 스위치는 S13 처럼 10kΩ 풀업(3V3 — 10kΩ — 14번 — 틸트 스위치 — GND)이라 **누우면 1** 이다. 서 있으면 구슬이 두 다리를 이어 14번이 GND 와 이어진다

  **핀** 초음파 Trig 13 · Echo 12(S14 · F3 과 같음), 수동 부저 25(S9 와 같음. ESP32 Plus 확장 보드에는 io15 가 없다), LED 26, 포토레지스터와 10kΩ 사이 36(Plus 는 아래 줄 io36, 기본 보드는 VP. S11 은 34 를 썼지만 이 챕터에는 마이크가 없어 36 을 쓴다. 둘 다 입력 전용 ADC 핀이라 어느 쪽이든 된다), 틸트 14(S13). 초음파 VCC 만 5V, 브레드보드 + 줄은 3V3 이다(포토레지스터 회로에 5V 를 주면 ADC 에 3.3V 넘는 전압이 들어갈 수 있다).

  **한 반복에 여러 기능** 거리 함수 안의 기다림과 빛 함수의 깜빡임 시간이 더해져서, 어두울 때는 같은 거리에서도 삐 간격이 조금 길어진다(원본 노트에도 있는 현상). 고장이 아니라 "한 반복에 일을 여러 개 넣으면 생기는 일"로 설명하면 좋다.

  **메이킹 · 안전**
  - 박스지를 세 겹으로 접어 막대를 만들고 테이프로 감는다. 초음파 센서는 막대 끝에서 앞쪽 약간 아래를 보게 붙이고, 막대 끝은 테이프를 여러 번 감아 날카롭지 않게 한다
  - 들고 다닐 때는 USB 를 빼고 **보조배터리 또는 배터리 홀더**로 전원을 준다. 배터리 · 브레드보드는 고무줄이나 테이프로 막대에 단단히 고정한다
  - 지팡이를 휘두르거나 친구를 겨누지 않는다. 시험은 정해진 길에서 천천히 걷는다

  - 1차시: 문제 만나기(안대 체험 포함) ~ 읽기 체크 1 (물체 감지 지팡이)
  - 2차시: 실행 2 ~ 성찰 (함수 셋으로 나누기, 통합 미션, 디버깅, 설계). 메이킹은 남는 시간 또는 다음 시간에
title: 스마트 지팡이
subtitle: 거리 · 빛 · 기울기를 알려 주는 흰 지팡이
summary: |
  앞이 보이지 않는 사람은 **흰 지팡이**로 바닥과 앞을 더듬으며 걸어요. 오늘은 그 지팡이에 센서를 달아, 가까운 물체를 **삐 소리**로, 어두운 밤에는 **LED**로, 지팡이를 놓치면 **경보음**으로 알려 주는 스마트 지팡이를 만들어요.
  1부에서 초음파 센서와 부저로 물체 감지를 만들고, 2부에서 조도 센서 · 틸트 스위치를 더해 일을 **함수 셋**으로 나눠요.
cover: images/cover.svg
