wiring:
  image: images/wiring-breadboard.svg
  caption: "초음파 VCC · GND · Trig · Echo → 위 줄 5V · GND · io13 · io12 에 F-F 듀폰선으로 바로. 브레드보드는 보드 아래에 두어요: 아래 줄 3V3 → + 줄, 아래 줄 GND → − 줄. 위 줄 io26 · io25 · io14 는 보드 바깥으로 돌아 내려와요. io26 → 2번 줄 → 220Ω → 6번 줄 LED 긴 다리, 짧은 다리 7번 줄 → − 줄. io25 → 9번 줄 수동 부저 + 다리, − 다리 11번 줄 → − 줄. io14 → 15번 줄: 10kΩ 저항 15~20번 줄(20번 → + 줄), 틸트 스위치 13 · 15번 줄(13번 → − 줄). 36번(아래 줄 io36) → 26번 줄: 10kΩ 저항 23~26번 줄(23번 → + 줄), 포토레지스터 26 · 28번 줄(28번 → − 줄)"
  captionDevkit: "초음파 VCC · GND · Trig · Echo → VIN · GND · D13 · D12 에 F-F 듀폰선으로 바로. 브레드보드는 보드 위에 두어요: 3V3 · GND(아래 줄) → 보드 바깥으로 돌아 + 줄 · − 줄. D14 → 8번 줄: 10kΩ 저항 4~8번 줄(4번 → + 줄), 틸트 스위치 8 · 10번 줄(10번 → − 줄). D26 → 11번 줄 → 220Ω → 15번 줄 LED 긴 다리, 짧은 다리 16번 줄 → − 줄. D25 → 18번 줄 수동 부저 + 다리, − 다리 20번 줄 → − 줄. VP(36) → 26번 줄: 10kΩ 저항 22~26번 줄(22번 → + 줄), 포토레지스터 26 · 28번 줄(28번 → − 줄)"
principle:
  image: images/three-senses.svg
  body: |
    스마트 지팡이는 세 가지 감각을 써요.

    - **초음파(소리의 반사)**: 소리는 물체에 부딪히면 되돌아와요. 박쥐처럼 사람 귀에 들리지 않는 높은 소리를 쏘고 **메아리**가 돌아올 때까지 걸린 시간을 재면, 소리 빠르기(1초에 약 340m)로 거리를 알 수 있어요 (거리 = 340 × 시간 ÷ 2)
    - **빛의 세기**: 포토레지스터(조도 센서)는 빛을 받으면 저항이 작아지고 어두우면 커져요. 3V3 — 10kΩ — 36번 — 포토레지스터 — GND 로 꽂으면 **어두울수록 값이 커져요**(0~4095)
    - **기울기**: 틸트 스위치 안의 금속 구슬이 두 다리를 잇거나 떨어져요. 10kΩ 저항이 14번을 3V3 쪽으로 끌어올려 두어서, 지팡이가 서 있으면(구슬이 두 다리를 이어 GND 와 연결) `0`, 누우면 `1` 을 줘요

    소리의 **높낮이**는 1초에 몇 번 떨리는지(Hz)로 정해져요. 가까운 물체는 880 Hz, 지팡이를 놓쳤을 때는 더 높은 음으로 울리면 귀로도 둘을 구분할 수 있어요.
goals:
  content: 초음파 · 조도 · 틸트 센서 값을 판단해 부저와 LED 로 알리고, 세 기능을 함수로 나눠 반복에서 부른다
  thinking: 사용자에게 필요한 정보에서 출발해 문제를 센서별로 나누고, 거리와 소리 간격의 비례 관계를 코드로 옮긴다
successCriteria:
  - 초음파 센서가 메아리로 거리를 재는 방법을 내 말로 설명할 수 있다
  - 30cm 안에 물체가 있으면 삐 소리가 나고, 가까울수록 간격이 짧아지게 할 수 있다
  - 내가 잰 빛 값으로 기준을 정해 어두우면 LED 를 깜빡이게 할 수 있다
  - 세 기능을 함수로 나누고, 함수는 만들기만 해서는 실행되지 않는다는 것을 설명할 수 있다
  - 이 지팡이가 누구의 어떤 불편을 줄여 주는지 말할 수 있다
parts:
  - id: part1
    title: 1부 · 물체를 알려 주는 지팡이
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 지팡이는 무엇을 알려 줘야 할까?
        minutes: 6
        scene: { image: images/cover.svg, caption: "흰 지팡이 끝의 센서가 앞의 기둥을 먼저 알아채요" }
        body: |
          세상에는 앞이 보이지 않아 **흰 지팡이**로 바닥을 더듬으며 걷는 사람들이 있어요. 지팡이가 닿지 않는 높이의 기둥이나 표지판에는 부딪히기 쉬워요. 누구나 길을 안전하게 걸을 수 있게 돕는 것은 유엔 지속가능발전목표 **SDG 10(불평등 해소)** 과도 이어져요.

          짝과 함께 안대를 하고 교실 안 짧은 길을 걸어 본 뒤, 걸을 때 **어떤 정보가 필요했는지** 떠올려 봐요. 장난이 아니라 그 사람의 입장이 되어 보는 활동이에요. 활동 칸의 세 질문에 내 생각을 적어요.
        todo:
          - 짝과 안대 체험을 하고, 필요했던 정보를 공책에 적기
          - 세 질문에 내 생각을 한두 문장씩 적기
          - 다 적으면 **완료** 누르기
        questions:
          - 앞이 보이지 않는 친구가 길에서 기둥에 부딪히지 않게 하려면 지팡이가 무엇을 알려 줘야 할까요?
          - 물체가 가까워질수록 알림은 어떻게 달라지면 좋을까요? 왜 그렇게 생각하나요?
          - 어두운 밤에는 지팡이를 든 사람을 다른 사람(자전거 · 자동차)이 잘 못 볼 수 있어요. 지팡이가 무엇을 더 해 주면 좋을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별 세 칸 보드
        minutes: 7
        scene: { image: images/three-boxes.svg, caption: "알아야 할 것 · 정해야 할 것 · 움직여야 할 것" }
        body: |
          지팡이가 하는 일을 **센서별로** 나눠 봐요. 앞의 물체, 주변의 밝기, 지팡이의 자세를 각각 무엇으로 알고, 어떤 기준으로 판단하고, 어떻게 알려 줄지 세 칸에 적어요.

          - **알아야 할 것**: 지팡이가 바깥에서 알아내야 하는 것 (센서마다 하나)
          - **정해야 할 것**: 사람이 미리 정해 줘야 하는 기준
          - **움직여야 할 것**: 지팡이가 실제로 하는 행동

          안대 체험에서 적은 "필요했던 정보"를 알아야 할 칸으로 옮겨 보세요. 사용자가 귀로 듣는 정보와 다른 사람이 눈으로 보는 정보는 누구를 위한 것인지도 나눠 생각해 봐요.
        todo:
          - 세 칸에 센서마다 하나씩 적기
          - 예시 답을 열어 내 답과 비교하기
          - 빠진 것을 내 칸에 덧붙이기
        answer:
          know: ["앞 물체까지의 거리 (초음파)", "주변 빛 값 (조도 센서)", "지팡이가 기울었는지 (틸트 스위치)"]
          decide: ["몇 cm 안이면 알릴지 (30cm)", "어둡다고 볼 빛 기준 (교실에서 재서 정하기)", "누운 것으로 볼 값 (1)"]
          act: ["가까울수록 빠르게 삐 소리", "어두우면 LED 깜빡", "지팡이가 누우면 높은 경보음"]

      - id: predict
        type: predict
        title: 예측하기 — 언제 삐 소리가 날까?
        minutes: 5
        scene: { image: images/three-senses.svg, caption: "초음파는 소리를 쏘고 메아리가 돌아오는 시간으로 거리를 재요" }
        body: |
          1부 코드는 초음파 센서로 거리를 재서, **30cm 보다 가까우면** 부저로 짧게 삐 소리를 내요. S14 에서 만든 `get_distance` 함수를 그대로 써요.

          아직 실행하지 마세요. 코드를 읽고 세 경우에 어떻게 될지 먼저 적어요. 왜 그렇게 생각했는지 근거도 한 문장 떠올려 보세요.
        todo:
          - 거리를 재는 줄과 30 이 적힌 줄 찾기
