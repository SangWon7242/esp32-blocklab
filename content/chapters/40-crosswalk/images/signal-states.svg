<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="cws-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="cws-title">상태 그림: 거리 10cm 를 기준으로 기계가 두 상태를 오간다. 가깝다(d &lt; 10cm)는 초록불 · 1000 Hz 소리 · 차단기 90도, 멀다(d ≥ 10cm)는 빨간불 · 조용 · 차단기 0도. 아래 거리 축의 10cm 에 기준선이 있다</title>
  <defs>
    <marker id="cws-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <text x="320" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">거리 하나로 상태 둘</text>
  <!-- 가깝다 -->
  <rect x="36" y="52" width="250" height="222" rx="12" fill="var(--card)"/>
  <rect x="36" y="52" width="250" height="34" rx="12" fill="#2f9e44" fill-opacity="0.18" stroke="none"/>
  <text x="161" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">가깝다 · d &lt; 10cm</text>
  <rect x="62" y="100" width="28" height="60" rx="6" fill="#343a40" stroke-width="1.5"/>
  <circle cx="76" cy="116" r="9" fill="#e03131" fill-opacity="0.2" stroke="none"/>
  <circle cx="76" cy="144" r="12" fill="#2f9e44" fill-opacity="0.3" stroke="none"/>
  <circle cx="76" cy="144" r="9" fill="#2f9e44" stroke="none"/>
  <text x="112" y="136" font-size="14" font-weight="700" fill="currentColor" stroke="none">초록불</text>
  <path d="M62 196 H74 L90 184 V220 L74 208 H62 Z" fill="var(--muted)" stroke-width="1.5"/>
  <path d="M100 194 A12 12 0 0 1 100 210" stroke="#9c36b5"/>
  <path d="M110 188 A20 20 0 0 1 110 216" stroke="#9c36b5"/>
  <text x="124" y="207" font-size="14" font-weight="700" fill="currentColor" stroke="none">1000 Hz 소리</text>
  <rect x="72" y="232" width="8" height="30" rx="2" fill="var(--muted)"/>
  <path d="M76 234 V196" stroke="#e03131" stroke-width="6"/>
  <path d="M76 234 V196" stroke="var(--card)" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="112" y="254" font-size="14" font-weight="700" fill="currentColor" stroke="none">차단기 90도</text>
  <!-- 멀다 -->
  <rect x="354" y="52" width="250" height="222" rx="12" fill="var(--card)"/>
  <rect x="354" y="52" width="250" height="34" rx="12" fill="#e03131" fill-opacity="0.16" stroke="none"/>
  <text x="479" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">멀다 · d ≥ 10cm</text>
  <rect x="380" y="100" width="28" height="60" rx="6" fill="#343a40" stroke-width="1.5"/>
  <circle cx="394" cy="116" r="12" fill="#e03131" fill-opacity="0.3" stroke="none"/>
  <circle cx="394" cy="116" r="9" fill="#e03131" stroke="none"/>
  <circle cx="394" cy="144" r="9" fill="#2f9e44" fill-opacity="0.2" stroke="none"/>
  <text x="430" y="136" font-size="14" font-weight="700" fill="currentColor" stroke="none">빨간불</text>
  <path d="M380 196 H392 L408 184 V220 L392 208 H380 Z" fill="var(--muted)" stroke-width="1.5"/>
  <path d="M416 190 L440 214 M440 190 L416 214" stroke="#e03131" stroke-width="2.5"/>
  <text x="454" y="207" font-size="14" font-weight="700" fill="currentColor" stroke="none">조용</text>
  <rect x="384" y="232" width="8" height="30" rx="2" fill="var(--muted)"/>
  <path d="M388 236 H440" stroke="#e03131" stroke-width="6"/>
  <path d="M388 236 H440" stroke="var(--card)" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="454" y="254" font-size="14" font-weight="700" fill="currentColor" stroke="none">차단기 0도</text>
  <!-- 오가는 화살표 -->
  <path d="M296 150 H344" marker-end="url(#cws-arrow)" stroke-opacity="0.7"/>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">멀어지면</text>
  <path d="M344 190 H296" marker-end="url(#cws-arrow)" stroke-opacity="0.7"/>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">가까워지면</text>
  <!-- 거리 축 -->
  <path d="M60 318 H580" marker-end="url(#cws-arrow)"/>
  <path d="M60 312 V324 M320 306 V330" stroke-width="2.5"/>
  <text x="60" y="344" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">0cm</text>
  <text x="320" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">10cm 기준</text>
  <text x="580" y="344" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">거리 d</text>
  <text x="190" y="304" text-anchor="middle" font-size="12" fill="#2f9e44" stroke="none">가깝다</text>
  <text x="450" y="304" text-anchor="middle" font-size="12" fill="#e03131" stroke="none">멀다</text>
</svg>
