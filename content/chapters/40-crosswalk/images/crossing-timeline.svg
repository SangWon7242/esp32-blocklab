<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="cwt-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="cwt-title">한 번 건너기 시간표: 0초에 초록불이 켜지고 차단기가 90도로 올라가며 소리가 난다. 초록 5초 뒤 0.5초씩 세 번 깜박이고(3초), 8초에 빨간불이 켜지며 차단기가 0도로 내려온다. 한 번 건너는 데 5 + 3 = 8초</title>
  <defs>
    <marker id="cwt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <text x="36" y="40" font-size="16" font-weight="700" fill="currentColor" stroke="none">한 번 건너기 순서</text>
  <text x="36" y="62" font-size="13" fill="currentColor" fill-opacity="0.7" stroke="none">초록 5초 → 깜박 3초 → 빨강</text>
  <!-- 사건 -->
  <path d="M60 100 V150" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <text x="60" y="92" font-size="12" fill="currentColor" stroke="none">초록불 · 차단기 90도 · 소리</text>
  <path d="M508 100 V150" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <text x="508" y="92" text-anchor="end" font-size="12" fill="currentColor" stroke="none">빨간불 · 차단기 0도</text>
  <!-- 막대 -->
  <rect x="60" y="150" width="280" height="56" rx="4" fill="#2f9e44" fill-opacity="0.75" stroke-width="1.5"/>
  <text x="200" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">초록 5초</text>
  <rect x="340" y="150" width="28" height="56" fill="var(--muted)" stroke-width="1.5"/>
  <rect x="368" y="150" width="28" height="56" fill="#2f9e44" fill-opacity="0.75" stroke-width="1.5"/>
  <rect x="396" y="150" width="28" height="56" fill="var(--muted)" stroke-width="1.5"/>
  <rect x="424" y="150" width="28" height="56" fill="#2f9e44" fill-opacity="0.75" stroke-width="1.5"/>
  <rect x="452" y="150" width="28" height="56" fill="var(--muted)" stroke-width="1.5"/>
  <rect x="480" y="150" width="28" height="56" fill="#2f9e44" fill-opacity="0.75" stroke-width="1.5"/>
  <rect x="508" y="150" width="56" height="56" rx="4" fill="#e03131" fill-opacity="0.8" stroke-width="1.5"/>
  <text x="536" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" stroke="none">빨강</text>
  <path d="M340 222 H508" stroke-opacity="0.6"/>
  <path d="M340 216 V228 M508 216 V228" stroke-opacity="0.6"/>
  <text x="424" y="244" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">깜박 3초 = 끄고 0.5초 · 켜고 0.5초 × 3번</text>
  <!-- 시간 축 -->
  <path d="M60 272 H590" marker-end="url(#cwt-arrow)"/>
  <g stroke-opacity="0.8">
    <path d="M60 266 V278 M116 266 V278 M172 266 V278 M228 266 V278 M284 266 V278 M340 266 V278 M396 266 V278 M452 266 V278 M508 266 V278 M564 266 V278"/>
  </g>
  <g font-size="12" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="60" y="296">0</text><text x="116" y="296">1</text><text x="172" y="296">2</text><text x="228" y="296">3</text><text x="284" y="296">4</text>
    <text x="340" y="296">5</text><text x="396" y="296">6</text><text x="452" y="296">7</text><text x="508" y="296">8</text><text x="564" y="296">9</text>
    <text x="596" y="296">초</text>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">한 번 건너는 데 5 + 3 = 8초. 우리 학교 앞 횡단보도의 초록불은 몇 초일까요?</text>
</svg>
