<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="cw-wiring-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="cw-wiring-title">브레드보드 배선도: 위쪽 칸(a~e)에 초음파 센서(1~4번 줄: VCC · Trig · Echo · GND), 수동 부저(+ 다리 7번 줄, − 다리 9번 줄), RGB LED(d 칸 14 · 16 · 18 · 20번 줄: 빨강 · GND · 초록 · 파랑, 빨강·초록·파랑 줄은 220Ω 저항이 가운데 홈을 건너 g 칸으로)를 꽂는다. ESP32 5V → 위 + 줄, GND → 위 − 줄, 13번 → 2번 줄(Trig), 12번 → 3번 줄(Echo), 15번 → 7번 줄(부저 +), 4번 → 26번 줄(서보 신호), 27번 → 14번 줄(j), 25번 → 18번 줄(i), 26번 → 20번 줄(h). 초음파 VCC(1번 줄)는 위 + 줄, 초음파 GND(4번 줄) · 부저 −(9번 줄) · RGB GND(16번 줄)는 위 − 줄. 서보 플러그는 점퍼선 셋으로: 주황(S) → 26번 줄, 빨강(V) → 위 + 줄, 갈색(G) → 위 − 줄</title>
