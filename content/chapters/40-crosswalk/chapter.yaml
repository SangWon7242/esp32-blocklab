      - id: design
        type: design
        title: 설계 — 초록 5초 뒤 깜박이며 빨강
        minutes: 4
        scene:
          image: images/crossing-timeline.svg
          caption: 한 번 건너기 시간표 — 초록 5초, 깜박 3초(끄고 0.5초 · 켜고 0.5초 × 3번), 그다음 빨강과 차단기 0도. 모두 8초
        body: |
          진짜 횡단보도의 초록불은 계속 켜져 있지 않아요. 몇 초 뒤 **깜박**이며 "곧 빨강"을 알리고, 그다음 빨강으로 바뀌어요. 이번에는 보행자가 왔을 때 **한 번 건너기** 순서를 우리말로 먼저 설계해요: 초록불 · 차단기 90도 · 소리 → 5초 → 깜박 3번 → 빨간불 · 차단기 0도.

          깜박은 S3 신호등처럼 `for i in range(3):` 안에서 불을 끄고 0.5초, 켜고 0.5초예요. 이 순서는 센서 없이 한 번만 실행되는 코드라서 섞인 블록이 적어요. 완성 뒤 미션 코드의 if 갈래에 넣으면 진짜 신호등이 돼요. 우리 학교 앞 횡단보도의 초록불 시간을 재어 5 + 3 = 8초와 비교해 보세요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "깜박 3번"이 어떤 코드가 되는지 짝지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: RGB(27 · 25 · 26) · 부저(16) · 서보(4)를 준비한다
          - text: 초록불을 켠다 (빨강 0, 초록 255, 파랑 0)
          - text: 차단기를 __도로 올린다
            blank: { answer: 90 }
          - text: 1000Hz 소리를 0.3초 울린다
          - text: __초 기다린다 (건너는 시간)
            blank: { answer: 5 }
          - text: __번 되풀이한다
            blank: { answer: 3 }
          - text: "  ↳ 불을 모두 끄고 0.5초 기다린다"
          - text: "  ↳ 초록불을 켜고 __초 기다린다"
            blank: { answer: 0.5 }
          - text: 빨간불을 켠다 (빨강 255, 초록 0, 파랑 0)
          - text: 차단기를 __도로 내린다
            blank: { answer: 0 }
        translation:
          - ["RGB · 부저 · 서보 준비", "red·green·blue = PWM(...) · def set_color / beeper = PWM(Pin(16)) / servo = PWM(Pin(4))"]
          - ["초록불 / 빨간불 / 모두 끄기", "set_color(0, 255, 0) / set_color(255, 0, 0) / set_color(0, 0, 0)"]
          - ["차단기를 N도로", "servo.duty_u16(1638 + N * 6462 // 180)"]
          - ["1000Hz 소리를 0.3초", "beeper.freq(1000) · beeper.duty(512) · time.sleep(0.3) · beeper.duty(0)"]
          - ["N번 되풀이한다", "for i in range(N):"]
          - ["초 기다린다", "time.sleep(초)"]
        targetCode: design_crossing.py

      - id: reflect
        type: reflect
        title: 성찰 — 1분 설명과 오늘 한 생각
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 장치 넷을 한 보드에 묶어 사람을 알아보는 신호등을 만들었어요. 이 기계를 1분 동안 설명할 수 있나요?
