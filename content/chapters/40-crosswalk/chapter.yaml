teacherNotes: |
  **통합 평가 챕터예요.** 새 장치는 없고, S3 · S5 · S9 · S14 · S15 에서 익힌 장치 넷을 한 보드에 묶어요. 원본(아두이노 기본 W09 중간평가)의 이론 문항은 예측 · 읽기 체크 두 곳으로, 실습 2(보행자 신호등)는 미션으로 옮겼어요. 원본에는 배점 · 통과 기준이 없어서 **배점은 선생님이 정하세요.**

  **평가 기준표(예시)** 미션 판정 5개 + 1분 설명 1개 = 6칸. 판정 5개는 블록랩이 자동으로 되묻고, 1분 설명은 성찰 단계에서 짝에게 하게 한 뒤 선생님이 확인합니다.
  1. 거리 출력: 잰 거리 `d` 를 `cm` 와 함께 창에 찍는다
  2. 10cm 기준 분기: `if d < 10:` 로 가깝다 · 멀다를 가른다
  3. 초록 · 빨강 전환: 가까우면 `set_color(0, 255, 0)`, 멀면 `set_color(255, 0, 0)`
  4. 소리: 가까우면 1000Hz 를 0.3초 울리고(`duty(512)`), 멀면 `beeper.duty(0)` 으로 멈춘다
  5. 차단기: 가까우면 90도, 멀면 0도(`duty_u16(1638 + 각도 * 6462 // 180)`)
  6. 1분 설명: 완성 코드를 위에서부터 짝에게 설명한다(S14 의 340 · 2 · 10000, S15 의 1638 · 6462 가 무엇인지 말하면 통과)

  **기준값은 예시예요.** 원본의 10cm 를 그대로 썼어요. 센서 바로 앞 10cm 는 손을 대 보기엔 좁으니, 미션 판정을 통과한 뒤 20~30cm 로 바꿔 "진짜 횡단보도라면 몇 m 가 맞을까"를 이야기하세요. 초록 5초 · 깜박 3초(설계 단계)도 예시입니다.

  - **핀 자리** RGB 빨강 27 · 초록 25 · 파랑 26(S5 자리), 수동 부저 16, 초음파 Trig 13 · Echo 12(S14), 서보 4(S15). 핀이 겹치지 않아요. 부저는 S9 에서 25번이었지만 여기서는 25번을 RGB 초록이 쓰고, ESP32 Plus 확장 보드에는 io15 가 없어 **16번**으로 옮겼어요(기본 보드에서는 RX2 라고 적힌 핀). PWM 진동수는 RGB 1000Hz · 부저 440/1000Hz · 서보 50Hz 셋이라 ESP32 PWM 타이머(4개) 안에 들어와요.
  - **전원 · 안전** 초음파 VCC 와 서보 빨강 선은 꼭 **5V** 에 꽂게 하세요(3V3 이면 값이 튀거나 팔이 떨려요). ESP32 Plus 확장 보드는 초음파를 위 한 줄 5V 에, 서보 플러그를 ANALOG io4 줄에 바로 꽂고, 기본 보드(DevKit)는 5V 핀이 VIN 하나라 VIN · 초음파 VCC · 서보 빨강을 브레드보드 + 줄에 모아요. 서보가 움직일 때 보드가 다시 켜지면 USB 선을 바꾸거나 서보 전원을 따로 줍니다. 배선은 USB 를 뺀 채, GND 선부터.
  - **두 보드** 초음파는 두 보드 모두 F-F 듀폰선으로 보드에 바로(Trig · Echo), RGB LED · 저항 · 부저는 브레드보드에 꽂아요. 브레드보드 열 번호는 보드마다 달라서 그림 아래 설명을 따라요.
  - **RGB 색 순서** 가장 긴 다리가 GND, 순서는 빨강 · GND · 초록 · 파랑(S5). 초록과 빨강이 바뀌어 보이면 25 · 27 선이 바뀐 거예요.
  - **멈춘 것처럼 보일 때** Echo 선이 빠지면 `while not echo.value():` 에서 끝없이 기다려요(S14 디버깅 1). 정지 버튼을 누르고 선을 확인합니다.
  - **메이킹** 종이컵이나 박스지로 신호등 기둥(RGB LED 를 컵 안에)과 차단기 팔(서보 혼에 빨대 · 막대)을 만들어 횡단보도 모형을 꾸미면 평가 발표가 재미있어져요.
  - **디버깅 2개** 증상 1은 비교 방향이 반대(`d > 10`), 증상 2는 else 쪽에 서보를 0도로 되돌리는 줄이 없어요. 둘 다 빨간 글씨(에러)는 뜨지 않고 움직임만 이상해요.

  **교과 연결**
  - 사회(교통 안전 · 보행 신호): 횡단보도 보행 신호의 뜻(초록 · 깜박이는 초록 · 빨강), 어린이 보호구역, 사람을 알아보는 스마트 횡단보도(SDG 11 안전한 도시).
  - 수학(시간 · 거리 기준): 우리 학교 앞 횡단보도의 초록불 시간을 재서 설계 단계의 5 + 3 = 8초와 비교하기, 횡단보도 길이 ÷ 걷는 속력(초속 약 1m)으로 필요한 시간 계산하기, "10cm 안에" 같은 기준값을 범위(부등호)로 적기.
title: 보행자 신호등
subtitle: 사람을 알아보는 횡단보도 — 통합 평가
summary: |
  어떤 횡단보도는 사람이 다가오면 스스로 초록불을 켜고 "건너세요" 소리를 내요. 오늘은 지금까지 익힌 장치 넷 — **초음파 센서**(거리), **RGB LED**(신호등 색), **수동 부저**(소리), **서보 모터**(차단기) — 를 한 보드에 묶어 그 신호등을 만들어요.
  새로 배우는 장치는 없어요. 대신 **기능 5개**를 하나씩 채워 가는 통합 평가예요. 완성한 코드를 1분 동안 설명할 수 있으면 통과예요.
