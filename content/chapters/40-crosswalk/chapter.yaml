principle:
  image: images/signal-states.svg
  body: |
    이 기계는 **거리 하나**로 **상태 둘**을 오가요. 초음파 센서가 40kHz 소리를 쏘고 메아리가 돌아온 시간에 소리 빠르기(1초에 340m)를 곱해 거리를 재요. 그 거리가 **10cm 보다 작으면** "가깝다", 아니면 "멀다"예요.

    가깝다 상태에서는 RGB LED 의 초록 불을 켜고(`set_color(0, 255, 0)`), 수동 부저의 떨림을 1초에 1000번(1000Hz)으로 정해 울리고, 서보에 1초 50번 보내는 신호의 켜진 길이를 늘려 팔을 90도로 돌려요. 멀다 상태에서는 빨강 불, 조용, 0도예요.

    - 신호등 색은 빛의 세기 세 개(빨강 · 초록 · 파랑, 0~255)를 섞어 만들어요. 오늘은 빨강과 초록만 써요
    - 소리의 높이는 떨림의 빠르기(Hz)예요. `duty(512)` 가 소리를 켜고 `duty(0)` 이 꺼요
    - 서보 각도는 `1638 + 각도 * 6462 // 180` 으로 0~180도를 신호 길이 1638~8100 으로 바꿔요
goals:
  content: 초음파 거리 · RGB 색 · 부저 소리 · 서보 각도 코드를 한 프로그램에 묶고, 10cm 기준으로 두 상태(초록 · 소리 · 90도 / 빨강 · 조용 · 0도)를 오가게 한다
  thinking: 큰 기계를 "알아야 · 정해야 · 움직여야" 로 나누어 기능 5개 체크리스트로 만들고, 완성 코드를 1분 동안 설명하며 스스로 평가한다
successCriteria:
  - 핀 표를 보고 장치 넷이 각각 몇 번 핀에 꽂혔는지, 준비하는 줄의 숫자와 짝지어 말할 수 있다
  - 10cm 기준으로 초록 · 빨강, 소리 켬 · 멈춤, 차단기 90도 · 0도 가 모두 바뀌는 프로그램을 완성할 수 있다
  - 비교 방향이 반대이거나 되돌리는 줄이 빠졌을 때 증상만 보고 어디부터 볼지 안다
  - 완성 코드를 위에서부터 1분 동안 짝에게 설명할 수 있다
parts:
  - id: part1
    title: 사람을 알아보는 신호등 만들기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 신호등이 사람을 알아본다면?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 횡단보도 앞 기둥의 초음파 센서가 보행자를 알아채면 초록불 · 소리 · 차단기가 함께 움직여요
        body: |
          횡단보도 신호등은 아무도 없어도 정해진 시간마다 바뀌어요. 그래서 밤에는 차가 빈 횡단보도 앞에서 기다리고, 사람은 급해도 초록불을 기다려요. 사람이 **가까이 왔을 때만** 초록불을 켜 주는 신호등이 있다면 어떨까요? 모두에게 안전한 길을 만드는 일은 유엔 지속가능발전목표 **SDG 11**(안전한 도시)이기도 해요.

          오늘은 새 장치를 배우지 않아요. 지금까지 익힌 초음파 센서 · RGB LED · 수동 부저 · 서보 모터를 **하나로 묶어** 사람을 알아보는 신호등을 만들어요. "가까이"는 몇 cm 부터일까요? 코드를 보기 전에 내 생각부터 적어 봐요.
        todo:
          - 준비물(초음파 센서, RGB LED, 저항 3개, 수동 부저, 서보, 브레드보드, 듀폰선 · 점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 신호등이 "사람이 가까이 왔다"는 것을 알아채려면 무엇을 재야 할까요? 지금까지 쓴 장치 가운데 무엇이 그 일을 할 수 있나요?
          - 원본 과제는 "10cm 안에 오면 초록불"이에요. 진짜 횡단보도라면 몇 m 가 알맞을까요? 왜 그렇게 생각하나요?
          - 사람이 가까이 왔을 때 신호등이 해 줄 일을 세 가지 적어 보세요. (색, 소리, 그리고?)

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것(거리) → 정해야 할 것(기준) → 움직여야 할 것(색 · 소리 · 차단기) 순서로 나눠요
        body: |
          장치가 넷이라 복잡해 보이지만, 나누면 간단해요. **알아야 할 것**은 하나(보행자까지의 거리), **정해야 할 것**은 숫자 몇 개(기준 거리, 소리 높이, 각도), **움직여야 할 것**은 셋(색, 소리, 차단기)이에요.

          보드는 "가깝다"는 말을 몰라요. 센서가 준 **거리 숫자**를 사람이 정한 **기준 숫자**와 비교할 뿐이에요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.

          우리 학교 앞 횡단보도에서 "가깝다"고 볼 거리를 걸음 수로 재어 m 로 바꿔 보고, 초록불이 켜져 있는 시간을 초시계로 재어 표에 적어 두면 설계 단계에서 비교할 수 있어요.
        todo:
          - "**알아야 할 것**: 보드가 센서로 알아내야 하는 것 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기 (몇 cm, 몇 Hz, 몇 도)"
          - "**움직여야 할 것**: 가까울 때 · 멀 때 장치마다 하는 일 적기"
        answer:
          know: ["보행자까지의 거리 d (초음파 Trig 13 · Echo 12)", "장치 넷이 꽂힌 핀 (RGB 27 · 25 · 26, 부저 16, 서보 4)"]
          decide: ["가깝다고 볼 기준 거리 (원본: 10cm)", "건너라는 소리의 높이와 길이 (1000Hz, 0.3초)", "차단기 각도 (올림 90도, 내림 0도)", "몇 초마다 다시 잴지 (0.3초)"]
          act: ["거리를 재서 출력하기", "가까우면 초록불 · 소리 · 차단기 90도", "멀면 빨간불 · 조용 · 차단기 0도", "이것을 끝없이 되풀이하기"]

