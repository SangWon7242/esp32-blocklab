# 교과 융합 F13 · 보행자 신호등 (통합 평가) — 원본: 아두이노 기본 W09 중간평가 실습 2(보행자가 가까이 오면 초록불 + 소리 + 차단기, 멀면 빨간불 + 차단기 내려옴) + 이론 문항을 읽기 체크로. 형식 설명은 src/track/README.md
# 장치 4개: RGB LED(27 · 25 · 26, 신호등 빨강/초록), 수동 부저 16(ESP32 Plus 에 io15 가 없어 15에서 옮김), 초음파 Trig 13 / Echo 12, 서보 4(차단기 0도/90도). 미션은 기능 체크리스트 codeMatches 5개(각각 되묻기), 1분 설명은 성찰에서 자기 점검.
