<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ls-wiring-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ls-wiring-title">브레드보드 배선도: 조도 센서 모듈의 다리 셋(S · + · −)을 e 칸 25·26·27번 줄에 꽂는다. ESP32 34번 초록 선 → 25번 줄(S), 26번 줄(+) → 빨간 선으로 + 줄 → ESP32 3V3, 27번 줄(−) → 검은 선으로 − 줄 → ESP32 GND. LED는 2장과 같은 자리: ESP32 26번 노란 선 → 7번 줄 → 220Ω 저항 → 12번 줄 LED 긴 다리(+), 짧은 다리(−) 13번 줄 → − 줄 → GND</title>
