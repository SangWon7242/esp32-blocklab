<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ls-cover-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ls-cover-title">해가 진 저녁 거리. 가로등 머리에 붙은 조도 센서가 어두워진 것을 알아채고 가로등이 스스로 켜져 길을 비춘다. 하늘에는 달, 지평선에는 막 넘어간 해, 뒤에는 건물들</title>
  <rect x="0" y="0" width="640" height="360" fill="var(--muted)" stroke="none"/>
  <rect x="0" y="0" width="640" height="300" fill="#1971c2" fill-opacity="0.16" stroke="none"/>
  <!-- 지는 해 -->
  <path d="M60 300 A46 46 0 0 1 152 300 Z" fill="#f08c00" fill-opacity="0.55" stroke="none"/>
  <!-- 달과 별 -->
  <path d="M386 50 A22 22 0 1 0 396 88 A17 17 0 1 1 386 50 Z" fill="#f4af18" fill-opacity="0.85" stroke="none"/>
  <g fill="currentColor" stroke="none" fill-opacity="0.45">
    <circle cx="470" cy="40" r="2"/><circle cx="510" cy="96" r="1.6"/><circle cx="604" cy="118" r="1.8"/><circle cx="340" cy="126" r="1.6"/>
  </g>
  <!-- 건물 -->
  <g fill="currentColor" fill-opacity="0.13" stroke="none">
    <rect x="170" y="170" width="70" height="130"/>
    <rect x="248" y="128" width="58" height="172"/>
    <rect x="530" y="190" width="80" height="110"/>
  </g>
  <g fill="#f4af18" fill-opacity="0.75" stroke="none">
    <rect x="184" y="186" width="12" height="14"/><rect x="214" y="216" width="12" height="14"/>
    <rect x="262" y="146" width="12" height="14"/><rect x="284" y="200" width="12" height="14"/>
    <rect x="548" y="206" width="12" height="14"/>
  </g>
  <!-- 길 -->
  <path d="M0 300 H640" stroke-width="2.5"/>
  <rect x="0" y="300" width="640" height="60" fill="currentColor" fill-opacity="0.08" stroke="none"/>
  <!-- 가로등 빛 -->
  <path d="M452 124 L360 300 H560 Z" fill="#f4af18" fill-opacity="0.28" stroke="none"/>
  <ellipse cx="460" cy="302" rx="100" ry="10" fill="#f4af18" fill-opacity="0.35" stroke="none"/>
  <!-- 가로등 -->
  <path d="M400 300 V96 Q400 82 414 82 H452" stroke-width="5"/>
  <path d="M432 82 H476 L466 120 H442 Z" fill="var(--card)" stroke-width="2.5"/>
  <ellipse cx="454" cy="122" rx="14" ry="5" fill="#f4af18" stroke-width="1.8"/>
  <path d="M388 300 H412" stroke-width="5"/>
  <!-- 조도 센서 -->
  <rect x="456" y="68" width="16" height="12" rx="2" fill="#2f9e44" fill-opacity="0.6" stroke-width="1.5"/>
  <circle cx="464" cy="66" r="4" fill="#f4e3b0" stroke-width="1.3"/>
  <path d="M474 66 L512 50" stroke-width="1.5"/>
  <rect x="512" y="38" width="84" height="24" rx="12" fill="var(--card)" stroke-width="1.5"/>
  <text x="554" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">조도 센서</text>
  <!-- 생각 말풍선 -->
  <rect x="28" y="28" width="300" height="76" rx="14" fill="var(--card)" stroke-width="1.8"/>
  <text x="48" y="58" font-size="18" font-weight="700" fill="currentColor" stroke="none">어두워지면 스스로 켜져요</text>
  <text x="48" y="86" font-size="14" fill="currentColor" fill-opacity="0.75" stroke="none">가로등은 어두워진 걸 어떻게 알까요?</text>
</svg>
