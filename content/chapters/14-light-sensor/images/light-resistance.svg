<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ls-res-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ls-res-title">빛과 저항. 밝을 때는 포토레지스터의 저항이 작아지고(1kΩ쯤), 손으로 가려 어두울 때는 저항이 아주 커진다(1MΩ 넘게). 저항이 바뀌면 34번 핀의 전압이 바뀌고, 보드가 읽는 값(0~4095)도 바뀐다. 값이 커질지 작아질지는 모듈마다 다르니 먼저 출력해 본다</title>
  <!-- 밝을 때 -->
  <rect x="20" y="16" width="290" height="226" rx="14" fill="var(--card)" stroke-width="1.8"/>
  <text x="40" y="46" font-size="17" font-weight="700" fill="currentColor" stroke="none">밝을 때</text>
  <circle cx="92" cy="106" r="22" fill="#f4af18" stroke="none"/>
  <g stroke="#f4af18" stroke-width="3">
    <path d="M92 70 V62"/><path d="M92 150 V142"/><path d="M56 106 H48"/><path d="M136 106 H128"/>
    <path d="M67 81 L61 75"/><path d="M117 131 L123 137"/><path d="M117 81 L123 75"/><path d="M67 131 L61 137"/>
  </g>
  <g stroke="#f4af18" stroke-width="2.5" stroke-dasharray="6 6">
    <path d="M122 118 L190 150"/><path d="M112 132 L184 162"/><path d="M128 102 L196 138"/>
  </g>
  <circle cx="222" cy="160" r="26" fill="#f4e3b0" stroke-width="2"/>
  <path d="M206 154 h6 v12 h6 v-12 h6 v12 h6 v-12 h4" stroke="#c92a2a" stroke-width="2"/>
  <text x="165" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">저항이 작아져요</text>
  <text x="165" y="232" text-anchor="middle" font-size="13" fill="currentColor" fill-opacity="0.7" stroke="none">1kΩ쯤 · 전기가 잘 흘러요</text>
  <!-- 어두울 때 -->
  <rect x="330" y="16" width="290" height="226" rx="14" fill="currentColor" fill-opacity="0.08" stroke-width="1.8"/>
  <text x="350" y="46" font-size="17" font-weight="700" fill="currentColor" stroke="none">어두울 때 (손으로 가리기)</text>
  <circle cx="474" cy="160" r="26" fill="#f4e3b0" stroke-width="2"/>
  <path d="M458 154 h6 v12 h6 v-12 h6 v12 h6 v-12 h4" stroke="#c92a2a" stroke-width="2"/>
  <!-- 손 -->
  <g fill="#e9c6a6" stroke-width="2">
    <rect x="432" y="80" width="18" height="60" rx="9"/>
    <rect x="452" y="70" width="18" height="70" rx="9"/>
    <rect x="472" y="74" width="18" height="66" rx="9"/>
    <rect x="492" y="86" width="18" height="56" rx="9"/>
    <rect x="428" y="118" width="86" height="54" rx="16"/>
  </g>
  <path d="M434 124 H508" stroke="#e9c6a6" stroke-width="6"/>
  <text x="474" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">저항이 아주 커져요</text>
  <text x="474" y="232" text-anchor="middle" font-size="13" fill="currentColor" fill-opacity="0.7" stroke="none">1MΩ 넘게 · 전기가 잘 안 흘러요</text>
  <!-- 아래: 저항 → 전압 → 값 -->
  <g font-size="14" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="100" y="286">저항이 바뀌면</text>
    <text x="300" y="286">34번 핀 전압이 바뀌고</text>
    <text x="520" y="286">값(0~4095)이 바뀌어요</text>
  </g>
  <path d="M176 281 H206 M200 276 L206 281 L200 286" stroke-width="2"/>
  <path d="M394 281 H424 M418 276 L424 281 L418 286" stroke-width="2"/>
  <rect x="96" y="304" width="448" height="40" rx="20" fill="#4562f5" fill-opacity="0.14" stroke="#4562f5" stroke-width="1.5"/>
  <text x="320" y="329" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" stroke="none">값이 커질지 작아질지는 모듈마다 달라요 → 먼저 출력해서 확인</text>
</svg>
