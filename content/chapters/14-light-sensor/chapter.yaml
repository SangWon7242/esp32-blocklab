          caption: 값 막대를 1000 과 2500 에서 잘라 세 구간으로. 구간마다 LED가 하는 일이 달라요
        body: |
          진짜 가로등은 해 질 녘에 미리 준비하기도 해요. 이번에는 갈림길을 **세 개**로 늘려 봐요. 지금 코드는 갈림길이 둘(if · else)이에요. 둘 사이에 갈림길 하나를 더 넣으려면 무엇이 필요할까요?

          "보통"은 **두 숫자 사이**에 있는 값이에요. 판단 블록 중에 "사이에 있는가"를 묻는 블록을 찾아 써 보세요.
        todo:
          - 세 구간의 경계 숫자(1000, 2500)와 구간마다 할 일을 그림에서 확인하기
          - if 와 else 사이에 갈림길 하나 더 넣기
          - 실행해서 가리는 정도에 따라 글자와 LED가 바뀌는지 보고 **판정** 누르기
        instructions: "센서 값을 세 구간으로 나눠 다르게 움직이게 하세요. 값이 2500 보다 크면 \"어두움\" 출력 + LED 켜기, 1000 이상 2500 이하이면 \"보통\" 출력 + LED를 켜고 0.2초 뒤 끄기(깜빡), 그 밖이면 \"밝음\" 출력 + LED 끄기. 값 출력과 0.5초 기다리기는 지금처럼 남겨 두세요"
        hint: 갈림길 사이에는 `elif` 가 들어가요. "보통" 조건은 `1000 <= value <= 2500` 처럼 두 숫자 사이를 묻는 꼴로 써요. 깜빡은 켜기 → 기다리기 → 끄기 세 줄이에요
        code: step2_night_led.py
        rules:
          - codeMatches: '^\s+elif '
            fail: 갈림길이 세 개라면 if 와 else 사이에 무엇이 하나 더 필요할까요?
          - useBlock: ["judge_between"]
            fail: "\"보통\"은 1000 과 2500 사이의 값이에요. 두 숫자 사이에 있는지 한 번에 묻는 판단 블록이 있었나요?"
          - codeEquals: { file: mission_three_levels.py }
            fail: 구간마다 출력하는 글자와 LED가 하는 일이 지시와 같나요? 보통일 때 LED는 몇 초 켜져 있나요? 경계 숫자 1000 과 2500 은 그대로인가요?
