# 센서 트랙 S11 · 밝기 센서 — 원본: 아두이노 기본 W04(조도 센서·범위별 분기·밝기 단계 가로등), Keyestudio 2-3-18 Light Intensity Detection. 형식 설명은 src/track/README.md
id: 14-light-sensor
order: 14
track: sensor
label: S11
prerequisites: [13-clap-dial]
subjects: [과학, 사회]
sdg: [7]
sessions: 2
teacherNotes: |
  **핀** 조도 센서 S 는 34번(계획 11 핀 표). Keyestudio 2-3-18 은 낱개 포토레지스터 + 10kΩ 저항을 36번에 잇지만, 36번은 S10 마이크 자리라 34번으로 옮겼다. 34번은 입력 전용 ADC 핀이라 센서에 알맞다.

  **값의 방향** 이 챕터 코드는 Keyestudio 회로처럼 **어두울수록 값이 커지는** 배선을 기준으로 썼다. 모듈에 따라 반대일 수 있으므로 1차시 첫 실행(손으로 가리기)에서 반 전체가 방향을 꼭 확인한다. 반대인 모둠은 비교 부호를 바꾸게 하고(디버깅 증상 3), 미션 판정은 지시의 숫자 그대로라 판정 뒤에 자기 숫자로 바꿔 보게 한다.

  **기준값** 원본 W04 는 단계 경계값을 학생이 정하는 과정이 없었다. 실행 1에서 가렸을 때·폈을 때 값을 공책에 적고, 그 사이에서 기준을 고르는 과정을 꼭 거친다(디버깅 증상 1).

  - 1차시: 문제 만나기 ~ 실행 2 · 읽기 체크 2 (값 재기, 자동 가로등)
  - 2차시: 미션(세 구간) · 디버깅 · 설계(범위 바꾸기로 밝기 조절) · 성찰
  - 융합: 과학(빛의 세기, 광전도), 사회(에너지 절약 가로등). 원본의 map() 은 파이썬 내장 map 과 이름이 겹치므로 블록의 **범위 바꾸기**를 쓴다
title: 밝기 센서
subtitle: 어두워지면 스스로 켜지는 가로등
summary: |
  가로등은 사람이 스위치를 누르지 않아도 저녁이 되면 켜져요. 그 비밀은 빛의 세기에 따라 저항이 바뀌는 **조도 센서**(포토레지스터)예요.
  센서 값을 0~4095 숫자로 읽어 보고, **기준값**보다 어두우면 LED를 켜는 자동 가로등을 만들어요. 마지막에는 밝음 · 보통 · 어두움 **세 구간**으로 나눠 다르게 움직이게 해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 조도 센서(포토레지스터 모듈), note: "다리 3개: S(신호) · +(3.3V) · −(GND)" }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. LED 자리는 1·2장과 같아요 }
  - { name: 점퍼선(M-M), note: "8개 (센서 3, + 줄·− 줄을 보드에 2, 26번 1, LED − 줄 1, − 줄 → GND 1)" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "조도 센서 모듈의 다리 셋을 e 칸 25·26·27번 줄에(S · + · −). 34번 → 25번 줄(S), 26번 줄(+) → + 줄 → 3V3, 27번 줄(−) → − 줄 → GND. LED는 2장과 같은 자리: 26번 → 7번 줄 → 220Ω 저항 → 12번 줄의 긴 다리(+), 짧은 다리(−)는 13번 줄 → − 줄 → GND"
principle:
  image: images/light-resistance.svg
  body: |
    조도 센서 안에는 **포토레지스터**라는 부품이 있어요. 빛을 받으면 전기가 잘 흐르게 바뀌는 물질로 만들어서, **밝으면 저항이 작아지고**(1kΩ쯤) **어두우면 저항이 아주 커져요**(1MΩ 넘게).

    모듈 안에는 고정 저항이 하나 더 들어 있어요. 두 저항이 3.3V 를 나눠 가지므로, 포토레지스터의 저항이 바뀌면 S 다리(34번 핀)의 **전압**이 바뀌어요. 보드는 그 전압을 **0~4095** 숫자로 읽어요.

    - 낱개 포토레지스터를 쓸 때는 10kΩ 저항을 함께 이어야 해요 (Keyestudio 설명서의 회로)
    - 밝을 때 값이 **커질지 작아질지는 모듈과 배선마다 달라요.** 그래서 코드를 쓰기 전에 **먼저 값을 출력**해서 손으로 가려 보고 방향부터 확인해요
    - 이 챕터의 코드는 **어두울수록 값이 커지는** 모듈을 기준으로 썼어요
goals:
  content: 조도 센서 값을 0~4095 숫자로 읽고, 교실에서 잰 값으로 기준을 정해 어두우면 LED를 켜고, 값을 세 구간으로 나눠 다르게 움직이게 한다
  thinking: 밝기를 숫자로 바꿔 생각하고, 기준값을 '느낌'이 아니라 측정한 값으로 정하는 이유를 설명한다
successCriteria:
  - 손으로 가렸을 때 내 센서 값이 커지는지 작아지는지 말할 수 있다
  - 가렸을 때 값과 폈을 때 값을 재고, 그 사이에서 기준값을 골라 이유를 말할 수 있다
  - if · elif · else 로 밝음 · 보통 · 어두움 세 구간을 나눠 다르게 움직이게 할 수 있다
  - 가로등이 밝기에 따라 스스로 켜지고 꺼지면 에너지를 어떻게 아끼는지 설명할 수 있다
parts:
  - id: part1
    title: 빛의 세기 재고 가로등 만들기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 가로등은 어두워진 걸 어떻게 알까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 해가 지면 가로등이 스스로 켜져요. 아무도 스위치를 누르지 않았는데요
        body: |
          저녁이 되면 거리의 가로등이 하나둘 켜져요. 그런데 가로등마다 스위치를 누르는 사람은 없어요. 낮에는 다시 저절로 꺼지고요.

          가로등은 "어두워졌다"는 것을 어떻게 알아챌까요? 그리고 해 질 녘 **조금 어두울 때**와 한밤중 **아주 어두울 때**는 어떻게 구분할까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, 조도 센서 모듈, LED, 저항, 브레드보드, 점퍼선, USB 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 가로등은 사람이 스위치를 누르지 않아도 저녁이 되면 켜져요. 가로등은 어두워진 것을 어떻게 알까요?
          - 해 질 녘 "조금 어두울 때"와 한밤중 "아주 어두울 때"를 기계가 구분하려면 무엇이 필요할까요?
          - 낮에도 켜져 있는 가로등이 있다면 무엇이 문제일까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "어두우면 켜기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "어둡다"는 말을 몰라요. 센서가 주는 **숫자**와 사람이 정한 **기준 숫자**를 비교할 뿐이에요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 기준 숫자는 누가, 어떻게 정해야 할지도 생각해 봐요.
        todo:
          - "**알아야 할 것**: 보드가 시작 전에 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기 (어디부터 어둡다고 할까요?)"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["조도 센서 S 선이 몇 번 핀인지 (34번)", "센서 값이 어디부터 어디까지인지 (0~4095)", "가렸을 때 값이 커지는지 작아지는지"]
          decide: ["어둡다고 볼 기준 값 (교실에서 재고 정하기)", "몇 초마다 잴지"]
          act: ["밝기 값 읽기", "값을 기준과 비교하기", "어두우면 LED 켜고 밝으면 끄기", "이것을 끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 손으로 가리면?
        minutes: 4
        scene:
          image: images/light-resistance.svg
          caption: 빛을 받으면 저항이 작아지고, 가리면 저항이 커져요. 그러면 보드가 읽는 숫자는 어떻게 될까요?
        body: |
          활동 칸의 코드는 센서 값을 0.5초마다 한 번씩 출력하기만 해요. 아직 실행하지 않아요.

          그림처럼 손으로 가리면 포토레지스터의 저항이 커져요. 그럼 화면의 숫자는 커질까요, 작아질까요? 모듈마다 다를 수 있으니 정답을 맞히기보다 **내 예측을 먼저 적는 것**이 중요해요.
        todo:
          - 코드를 위에서부터 한 줄씩 소리 내어 읽기
          - 값을 출력하는 줄과 기다리는 줄 찾기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_light_value.py
        blanks:
          - q: 실행하면 화면(출력 칸)에 무엇이 나올까요?
          - q: 손으로 센서를 가리면 숫자는 커질까요, 작아질까요?
          - q: 교실 불빛 아래에서 숫자는 0~4095 가운데 대략 얼마쯤일까요?

      - id: run
        type: run
        title: 복사 · 실행 — 밝기를 숫자로
        minutes: 7
        scene:
          image: images/wiring-breadboard.svg
          caption: "센서 다리 셋: 25번 줄(S) ← 34번, 26번 줄(+) → + 줄 → 3V3, 27번 줄(−) → − 줄 → GND"
        body: |
          **USB를 뺀 채로** 안내 칸의 **부품과 배선**의 배선도를 보고 조도 센서를 꽂아요. 다리 이름(S · + · −)이 모듈에 적혀 있어요. + 와 − 가 바뀌면 값이 이상하게 나오니 꼭 확인해요. LED도 지금 같이 꽂아 두면 다음 실행에서 바로 쓸 수 있어요.

          실행한 뒤 센서를 **손으로 가렸다가 떼어** 보세요. 숫자가 어느 쪽으로 움직이는지, 가렸을 때와 폈을 때 숫자가 각각 얼마인지 **공책에 적어** 두세요. 다음 단계에서 이 숫자로 기준을 정해요.
        todo:
          - "**부품과 배선**대로 센서(S · + · −)와 LED 꽂기"
          - "**보드 연결** → **실행** 누르기"
          - 가렸을 때 값과 폈을 때 값을 공책에 적기
        code: step1_light_value.py
        expected: 코드를 실행하면 출력 칸에 0~4095 사이 숫자가 0.5초마다 한 줄씩 나와요. 손으로 센서를 가리면 숫자가 크게 바뀌고, 손을 떼면 원래 숫자 가까이로 돌아와요.
        codeNotes:
          - { line: 1, note: "핀을 다루는 `Pin` 과 전압을 숫자로 읽는 `ADC` 기능을 가져와요" }
          - { line: 4, note: "34번 핀을 아날로그 입력(ADC)으로 준비하고 이름을 `light` 로 붙여요" }
          - { line: 5, note: "0~3.3V 를 모두 잴 수 있게 정해요 (`ATTN_11DB`)" }
          - { line: 6, note: "값을 12비트, 곧 **0~4095** 숫자로 받게 정해요" }
          - { line: 8, note: "아래 들여 쓴 두 줄을 끝없이 되풀이해요" }
          - { line: 9, note: "`light.read()` 로 지금 밝기 값을 읽어 바로 출력해요" }
          - { line: 10, note: "0.5초 기다려요. 숫자가 너무 빨리 올라가지 않게 해요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 1
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          눈으로 본 숫자가 코드의 어디에서 나왔는지 확인해요. 준비하는 세 줄과 되풀이하는 두 줄로 나눠서 읽으면 쉬워요.

          답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - 준비하는 세 줄(`light` 로 시작)을 찾기
          - "`while True:` 아래 두 줄이 하는 일 말해 보기"
          - 세 문제에 답하고 **확인** 누르기
        code: step1_light_value.py
        questions:
          - { kind: number, q: "센서 값으로 나올 수 있는 가장 큰 숫자는?", answer: 4095, hint: "줄 끝 설명(주석)에 범위가 적혀 있어요" }
          - { kind: choice, q: "조도 센서의 S 선은 몇 번 핀에 꽂아야 하나요?", options: ["26번", "34번", "36번"], answer: 1, hint: "ADC(Pin(...)) 괄호 안 숫자를 봐요" }
          - { kind: line, q: "센서의 지금 밝기 값을 읽는 줄의 번호를 클릭하세요", answer: 9 }
        codeNotes:
          - { line: 4, note: "34번 핀을 아날로그 입력으로 준비해요" }
          - { line: 6, note: "값의 범위를 0~4095 로 정해요" }
          - { line: 9, note: "`light.read()` 가 지금 밝기 값을 숫자로 돌려줘요" }
          - { line: 10, note: "0.5초마다 한 번씩 읽어요" }

      - id: run2
        type: run
        title: 복사 · 실행 2 — 어두우면 켜지는 가로등
        minutes: 7
        scene:
          image: images/breadboard-basics.svg
          caption: "LED 자리는 2장과 같아요: 26번 → 7번 줄 → 저항 → 12번 줄 긴 다리, 13번 줄 짧은 다리 → − 줄"
        body: |
          이번 코드는 읽은 값을 `value` 에 담고, **기준값 2500** 과 비교해요. 이 모듈은 어두울수록 값이 커지므로 `value > 2500` 이면 "어둡다"고 보고 LED를 켜요.

          실행한 뒤 센서를 가렸다 떼며 LED가 켜지고 꺼지는지 보세요. 잘 안 된다면 공책에 적은 내 숫자와 2500 을 비교해 보고, **내 교실에 맞는 기준값**으로 바꿔 다시 실행해요.
        todo:
          - LED가 26번(긴 다리 쪽 저항)과 − 줄(짧은 다리)에 꽂혀 있는지 확인하기
          - "**실행** 누르고 센서를 가렸다 떼어 보기"
          - 공책에 적은 숫자를 보고 기준값 2500 이 우리 교실에 맞는지 따져 보기
        code: step2_night_led.py
        expected: 코드를 실행하면 출력 칸에 밝기 값이 0.5초마다 나와요. 손으로 센서를 가려 값이 2500 보다 커지면 LED가 켜지고, 손을 떼면 LED가 꺼져요.
        codeNotes:
          - { line: 4, note: "조도 센서를 34번 핀에 준비해요 (4~6번 줄, 실행 1과 같아요)" }
          - { line: 7, note: "26번 핀을 내보내는(출력) 핀으로 정하고 이름을 `led` 로 붙여요" }
          - { line: 10, note: "밝기 값을 한 번 읽어 `value` 에 담아요. 아래 줄들은 이 숫자 하나로 판단해요" }
          - { line: 12, note: "`value` 가 **기준값 2500** 보다 크면(= 어두우면) 바로 아래 줄을 실행해요" }
          - { line: 13, note: "LED를 켜요" }
          - { line: 14, note: "그렇지 않으면(2500 이하 = 밝으면) 아래 줄을 실행해요" }
          - { line: 15, note: "LED를 꺼요" }
          - { line: 16, note: "0.5초마다 다시 재고 판단해요" }

