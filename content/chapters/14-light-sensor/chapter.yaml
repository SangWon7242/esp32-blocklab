      - id: debug
        type: debug
        title: 디버깅 — 가로등이 이상해요
        minutes: 7
        scene:
          image: images/wiring-breadboard.svg
          caption: 숫자가 이상하면 배선부터, 켜지고 꺼지는 때가 이상하면 기준값과 부등호부터 봐요
        body: |
          고장 난 가로등 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 값이 아예 안 움직이면 배선부터, 값은 움직이는데 LED가 엉뚱하면 기준값과 부등호부터 봐요.

          공책에 적어 둔 내 측정값(가렸을 때 · 폈을 때)을 옆에 두고 시작해요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 손으로 꽉 가려도 LED가 켜지지 않아요
            code: "if value > 4000:\n    led.value(1)\nelse:\n    led.value(0)"
            question: 가렸을 때 출력 칸의 숫자는 얼마였나요? 그 숫자가 4000 보다 큰가요? 기준값은 무엇을 보고 정해야 할까요?
            rules:
              - codeMatches: 'if value > ([1-9]\d{2}|[1-3]\d{3}):'
                fail: 가렸을 때 값과 폈을 때 값을 재 봤나요? 기준은 그 두 숫자 사이 어디쯤이어야 할까요?
          - title: 값이 0 근처에서 꿈쩍도 안 해요
            code: "light = ADC(Pin(35))\nlight.atten(ADC.ATTN_11DB)\nlight.width(ADC.WIDTH_12BIT)"
            question: 센서의 S 선은 실제로 몇 번 핀에 꽂혀 있나요? 코드의 번호와 짝지어 보세요. 번호가 맞는데도 그대로라면 + 선과 − 선이 바뀌지 않았는지, 낱개 포토레지스터라면 10kΩ 저항을 함께 이었는지도 보세요
            rules:
              - codeMatches: 'ADC\(Pin\(34\)\)'
                fail: 배선도에서 S 선은 몇 번 핀으로 가나요? 코드의 숫자와 같나요?
          - title: 밝을 때 켜지고, 가리면 꺼져요
            code: "if value < 2500:\n    led.value(1)\nelse:\n    led.value(0)"
            question: 이 센서는 가리면 값이 커졌나요, 작아졌나요? 어두울 때 참이 되려면 부등호는 어느 쪽을 향해야 할까요?
            rules:
              - codeMatches: 'if value > \d+:'
                fail: 가렸을 때 값은 기준보다 클까요, 작을까요? 그때 참이 되는 부등호는 무엇일까요?

      - id: design
        type: design
        title: 설계 — 어두울수록 더 밝게
        minutes: 8
        scene:
          image: images/three-levels.svg
          caption: 세 구간 대신, 값 막대 전체를 LED 밝기 0~100 % 로 이어서 바꾸면 어떨까요?
        body: |
          세 구간 가로등은 밝기가 세 가지뿐이에요. 이번에는 **어두울수록 LED가 조금씩 더 밝아지게** 설계해요. 센서 값 0~4095 를 LED 밝기 0~100 % 로 바꾸는 **범위 바꾸기** 블록을 써요.

          범위 바꾸기는 `((x - 0) * (100 - 0) // (4095 - 0) + 0)` 같은 계산이 돼요. `//` 는 나머지를 버리는 나누기라서 밝기가 소수가 아닌 정수로 나와요. LED는 2장처럼 **밝기 LED**(PWM)로 준비해요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 우리말 한 줄이 어떤 코드가 되는지 짝지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 조도 센서를 __번 핀에 준비한다
            blank: { answer: 34 }
          - text: 밝기 LED를 26번 핀에 준비한다
          - text: 끝없이 되풀이한다
          - text: "  ↳ 센서 값(0~4095)을 0~__ 로 바꿔 level 에 담는다"
            blank: { answer: 100 }
          - text: "  ↳ level 을 출력한다"
          - text: "  ↳ LED 밝기를 level % 로 정한다"
          - text: "  ↳ __초 기다린다"
            blank: { answer: 0.2 }
        translation:
          - ["조도 센서 준비 (34번)", "light = ADC(Pin(34)) · atten · width 세 줄"]
          - ["밝기 LED 준비 (26번)", "led = PWM(Pin(26)) · led.freq(1000)"]
          - ["범위 바꾸기 (0~4095 → 0~100)", "((light.read() - 0) * (100 - 0) // (4095 - 0) + 0)"]
          - ["LED 밝기를 level % 로", "led.duty(int(level * 1023 / 100))"]
          - ["초 기다린다", "time.sleep(초)"]
        targetCode: design_dimmer.py

