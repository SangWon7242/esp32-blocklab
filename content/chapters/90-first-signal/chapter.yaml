# 체험 T1 · 내 손으로 만드는 신호등 — 처음 온 초등 4~6학년과 선생님이 1:1 로 하는 50분 체험. 형식 설명은 src/track/README.md
# 센서 S1(LED) · S3(신호등) · S8(버튼) 을 한 판으로 줄였다. 한 브레드보드가 세 단계로 자란다: LED 하나(13) → 신호등(13 · 14 · 16) → 보행자 버튼(25, 풀업).
# 미션은 숫자만 바꾸는 것뿐이고, 판정은 핀 번호를 보지 않는다(LED 를 다른 핀에 꽂아도 통과).
id: 90-first-signal
order: 90
track: trial
label: T1
sessions: 1
title: 내 손으로 만드는 신호등
subtitle: 처음 만나는 코딩 체험 50분
teacherNotes: |
  **처음 온 학생과 1:1 로 하는 50분 체험이에요.** 정규 과정(센서 트랙 S1 · S3 · S8)을 한 판으로 줄였어요. 학생은 코드를 새로 쓰지 않고 **숫자만 바꿔요.** 타이핑에 시간을 쓰지 않게 하려는 거예요.

  **시간 배분(예시)**
  - 0~5분 문제 만나기: 좋아하는 것 · 코딩 경험을 묻고 "신호등은 누가 켜고 끌까?" 로 시작
  - 5~17분 1단계: 내장 LED 대신 브레드보드 LED 하나를 **학생이 직접** 꽂아요(긴 다리가 +). 실행 → 미션 1(빠르게 깜빡)
  - 17~32분 2단계: LED 둘을 더 꽂아 신호등 → 미션 2(우리 동네 신호등 시간)
  - 32~45분 3단계: 버튼을 더 꽂아 보행자 신호등 → 미션 3(건너는 시간 8초)
  - 45~50분 보호자에게 시연 + 돌아보기

  **진행 요령**
  - 선생님이 대신 꽂지 않아요. 막히면 "어디까지 됐는지 같이 볼까?" 하고, 손은 학생이 움직이게 해요.
  - LED 를 일부러 거꾸로 꽂아 보게 하면(안 켜짐 → 고치기) 오래 기억해요.
  - 시간이 모자라면 3단계는 선생님이 버튼만 꽂아 주고 실행 · 미션만 해도 돼요. 돌아보기는 꼭 남겨 두세요.
  - 블록이 더 편한 학생은 편집기 위 블록 모드로 바꿔 숫자 블록만 고치게 해요.

  **준비물 확인** LED(빨강 · 노랑 · 초록)와 220Ω 저항은 예비를 하나씩 더. 버튼은 다리 4개짜리 택트 스위치. 수업 전에 보드 연결과 실행을 한 번 해 두세요.

  **핀** 빨강 13 · 노랑 14 · 초록 16 · 버튼 25. 기본 보드(DevKit)에서 16번은 아래 줄 RX2 예요. 버튼은 풀업이라 **누르면 0** 이에요.
summary: |
  손바닥만 한 작은 컴퓨터 **ESP32** 에 명령을 보내 불을 켜 봐요. 불 하나를 깜빡이는 것부터 시작해, LED 세 개로 **신호등**을 만들고, 마지막엔 **버튼**을 누르면 신호가 바뀌는 **보행자 신호등**까지 완성해요.
  코드는 처음부터 다 쓰지 않아요. 준비된 코드를 실행해 보고, **숫자를 바꿔** 내 마음대로 움직이게 해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 납땜 없이 빼고 꽂을 수 있어요 }
  - { name: "LED 3개 (빨강·노랑·초록)", note: 긴 다리가 + }
  - { name: 220Ω 저항 3개, note: "LED 마다 하나씩. 빨강-빨강-갈색 띠" }
  - { name: 버튼 1개, note: 다리 4개짜리 누름 버튼. 브레드보드 가운데 홈에 걸쳐 꽂아요 }
  - { name: M-F 듀폰선 5가닥, note: "보드의 13 · 14 · 16 · 25번 핀과 GND 핀 → 브레드보드" }
  - { name: 점퍼선(M-M) 5가닥, note: "LED 짧은 다리 줄 → − 줄(3가닥), 버튼 → 위 − 줄, 위 − 줄 ↔ 아래 − 줄" }
  - { name: 확장 보드 (38핀), board: expansion, note: "DevKit 38핀을 노란 암 헤더에 꽂아요. JUMP 점퍼는 평소 자리(V–3.3V) 그대로. 16번은 아래 줄 P16 칸이에요" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-crosswalk.svg
  caption: "다 만들면 이렇게 돼요. io13 → 6번 줄 → 220Ω → 3번 줄 빨강 LED, io14 → 13번 줄 → 220Ω → 10번 줄 노랑 LED, io16 → 21번 줄 → 220Ω → 18번 줄 초록 LED, 짧은 다리(−)는 아래 − 줄 → 보드 GND. 버튼은 가운데 홈에 걸쳐 25 · 27번 줄, io25 → 25번 줄, 27번 줄 → 위 − 줄, 위 − 줄 ↔ 아래 − 줄"
  captionDevkit: "다 만들면 이렇게 돼요. D13 → 6번 줄 → 220Ω → 3번 줄 빨강 LED, D14 → 13번 줄 → 220Ω → 10번 줄 노랑 LED, 아래 줄 RX2(16) → 보드 바깥으로 돌아 21번 줄 → 220Ω → 18번 줄 초록 LED, 짧은 다리(−)는 아래 − 줄 → 보드 GND. 버튼은 가운데 홈에 걸쳐 25 · 27번 줄, D25 → 25번 줄, 27번 줄 → 위 − 줄, 위 − 줄 ↔ 아래 − 줄"
  captionExpansion: "다 만들면 이렇게 돼요. P13 칸 S → 6번 줄 → 220Ω → 3번 줄 빨강 LED, P14 칸 S → 12번 줄 → 220Ω → 9번 줄 노랑 LED, 아래 줄 P16 칸 S → 보드 아래로 나와 오른쪽 바깥으로 돌아 24번 줄 → 220Ω → 21번 줄 초록 LED, 짧은 다리(−)는 아래 − 줄 → 위 줄 GND 칸 S. 버튼은 노랑과 초록 사이, 가운데 홈에 걸쳐 14 · 16번 줄: P25 칸 S → 14번 줄, 16번 줄 → 위 − 줄, 위 − 줄 ↔ 아래 − 줄"
principle:
  image: images/stages.svg
  body: |
    ESP32 는 **핀**으로 전기를 내보내거나 받아들여요. 핀에 LED 를 이으면 코드 한 줄로 불을 켜고 끌 수 있어요.

    - `value(1)` 은 켜기, `value(0)` 은 끄기예요
    - `time.sleep(초)` 는 그 상태 그대로 기다리기예요
    - 보드는 코드를 **위에서부터 한 줄씩 차례로** 해요. 그래서 줄의 순서가 곧 신호등의 순서예요

    버튼은 반대로 보드가 **받아들이는** 쪽이에요. 누르면 0, 떼면 1 이 들어와서, "버튼이 0 이면 신호를 바꿔라" 하고 시킬 수 있어요.
why: [led-resistor, gnd, pull-up]
goals:
  content: LED 를 켜고 끄는 코드를 실행해 보고, 숫자를 바꿔 깜빡임 · 신호 시간을 정하고, 버튼으로 신호가 바뀌게 한다
  thinking: 컴퓨터는 사람이 정한 순서와 규칙대로 움직인다는 것을 알고, 바꾸고 싶은 것을 코드의 어느 숫자가 정하는지 찾는다
successCriteria:
  - LED 의 긴 다리가 + 라는 것을 알고, 브레드보드에 LED · 저항을 꽂을 수 있다
  - 기다리기 숫자를 바꿔 깜빡이는 빠르기와 신호 시간을 바꿀 수 있다
  - 버튼을 누르면 신호가 바뀌는 까닭을 "버튼이 0 이면" 줄을 짚으며 말할 수 있다
parts:
  - id: part1
    title: 1단계 — 불 켜기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 신호등은 누가 켤까?
        scene:
          image: images/stages.svg
          caption: 오늘은 세 단계로 만들어요 — 불 하나 → 신호등 → 보행자 버튼
        body: |
          학교 앞 신호등은 사람이 옆에 서서 켜고 끄지 않아요. 그런데도 늘 **정해진 순서**대로 불이 바뀌어요.

          그 안에는 작은 컴퓨터가 들어 있어요. 오늘은 손바닥만 한 컴퓨터 **ESP32** 에게 직접 명령을 내려서 신호등을 만들어 봐요. 시작하기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 신호등은 누가, 어떻게 켜고 끌까요?
          - 컴퓨터에게 "불을 켜!" 라고 말하려면 어떻게 해야 할까요?

      - id: run1
        type: run
        title: 실행 — 불 하나 깜빡이기
        scene:
          image: images/wiring-one-led.svg
          caption: "1단계 배선: io13 → 6번 줄 → 220Ω 저항 → 3번 줄 LED 긴 다리(+), 짧은 다리(−) 2번 줄 → − 줄 → GND"
          captionExpansion: "1단계 배선: P13 칸 S → 6번 줄 → 220Ω 저항 → 3번 줄 LED 긴 다리(+), 짧은 다리(−) 2번 줄 → − 줄 → 위 줄 GND 칸 S"
        body: |
          먼저 빨강 LED 하나를 브레드보드에 꽂아요. LED 는 **긴 다리가 +** 예요. 거꾸로 꽂으면 불이 안 들어와요.

          그림대로 꽂았으면 **보드 연결** → **실행** 을 눌러요. 코드는 "켜기 → 1초 기다리기 → 끄기 → 1초 기다리기" 를 끝없이 반복해요.
        todo:
          - "그림대로 LED · 저항 · 선 꽂기 (긴 다리가 +)"
          - "**보드 연결** → **실행** 누르기"
          - 불이 1초마다 깜빡이는지 보기
        code: step1_blink.py
        expected: 빨강 LED 가 1초 켜지고 1초 꺼지기를 계속 되풀이해요.
        codeNotes:
          - { line: 4, note: "13번 핀을 LED 를 켜는 핀으로 준비하고, 이름을 `led_red` 로 붙여요" }
          - { line: 6, note: "아래 들여 쓴 4줄을 끝없이 되풀이해요" }
          - { line: 7, note: "`value(1)` 은 켜기" }
          - { line: 8, note: "1초 동안 켜진 채로 기다려요" }
          - { line: 9, note: "`value(0)` 은 끄기" }

      - id: mission1
        type: mission
        title: 미션 1 — 빠르게 깜빡이기
        scene:
          image: images/wiring-one-led.svg
          caption: 기다리는 시간을 줄이면 깜빡임이 빨라져요
        body: |
          지금은 1초마다 깜빡여요. **기다리기 숫자**를 바꾸면 빠르기가 바뀌어요.

          켜진 채로 0.2초, 꺼진 채로 0.2초 기다리게 바꿔서 **반짝반짝 빠르게** 깜빡이게 해 보세요. 바꾼 뒤 실행해 보고, 맞으면 **채점하기** 를 눌러요.
        todo:
          - "`time.sleep(1)` 두 군데 찾기"
          - 두 숫자를 모두 0.2 로 바꾸기
          - 실행해서 확인하고 **채점하기** 누르기
        instructions: |
          LED 가 **0.2초 켜지고 0.2초 꺼지기**를 계속 되풀이하게 바꾸세요.
        hint: 바꿀 곳은 "초 기다리기"(time.sleep) 두 군데예요. 1 을 0.2 로 바꿔요
        code: step1_blink.py
        rules:
          - blocks: { type: flow_wait, inputs: { SEC: { type: math_number, fields: { NUM: 0.2 } } }, after: { type: esp_pin_write, fields: { VALUE: "1" } } }
            fail: 켠 바로 다음에 기다리는 시간이 0.2초인가요?
          - blocks: { type: flow_wait, inputs: { SEC: { type: math_number, fields: { NUM: 0.2 } } }, after: { type: esp_pin_write, fields: { VALUE: "0" } } }
            fail: 끈 바로 다음에 기다리는 시간도 0.2초인가요?
          - blocks: { type: esp_pin_write, fields: { VALUE: "1" }, inside: loop }
            fail: 켜고 끄기가 끝없이 반복하는 블록 안에 그대로 들어 있나요?
        answerCode: mission1_fast_blink.py

  - id: part2
    title: 2단계 — 신호등 만들기
    steps:
      - id: run2
        type: run
        title: 실행 — 신호등 켜기
        scene:
          image: images/wiring-traffic.svg
          caption: "2단계 배선: 노랑 LED(io14 → 13번 줄)와 초록 LED(io16 → 21번 줄)를 더 꽂아요. LED 마다 저항이 하나씩"
          captionExpansion: "2단계 배선: 노랑 LED(P14 칸 S → 12번 줄)와 초록 LED(아래 줄 P16 칸 S → 보드 바깥으로 돌아 24번 줄)를 더 꽂아요. LED 마다 저항이 하나씩"
        body: |
          이번에는 노랑 · 초록 LED 를 더 꽂아 신호등을 만들어요. 빨강을 꽂은 방법과 똑같이, LED 마다 **저항을 하나씩** 달아요.

          LED 가 셋이라 이름도 셋이에요: `led_red` · `led_yellow` · `led_green`. 이름을 부르면 그 LED 하나만 켜지고 꺼져요. 실행해서 불이 바뀌는 순서를 보세요.
        todo:
          - 그림대로 노랑 · 초록 LED 와 저항, 선 더 꽂기
          - "**실행** 누르기"
          - 초록 → 노랑 → 빨강 순서로 바뀌는지 보기
        code: step2_traffic.py
        expected: 초록불 3초 → 노란불 1초 → 빨간불 3초가 차례로 켜지고, 처음부터 계속 되풀이해요.
        codeNotes:
          - { line: 4, note: "LED 마다 다른 핀, 다른 이름을 붙여요 (4~6번 줄)" }
          - { line: 9, note: "초록불만 켜요. 다른 두 LED 는 꺼진 그대로예요" }
          - { line: 10, note: "초록불이 켜져 있는 시간: 3초" }
          - { line: 13, note: "노란불이 켜져 있는 시간: 1초" }
          - { line: 16, note: "빨간불이 켜져 있는 시간: 3초. 끝나면 다시 초록불로" }

      - id: mission2
        type: mission
        title: 미션 2 — 우리 동네 신호등
        scene:
          image: images/traffic-timeline.svg
          caption: 지금은 초록 3초 · 노랑 1초 · 빨강 3초. 색마다 켜기 바로 아래 숫자가 그 불의 시간이에요
        body: |
          진짜 신호등은 3초보다 훨씬 길어요. 신호 시간을 바꿔서 **우리 동네 신호등**을 만들어 봐요.

          불을 켠 바로 다음 줄의 `time.sleep(...)` 숫자가 그 불이 켜져 있는 시간이에요. 숫자를 바꾸고 실행해서 하나, 둘 세어 보세요.
        todo:
          - 초록 · 노랑 · 빨강을 켠 바로 다음 줄 찾기
          - 숫자를 지시문대로 바꾸기
          - 실행해서 세어 보고 **채점하기** 누르기
        instructions: |
          신호 시간을 이렇게 바꾸세요.
          - 초록불: **5초** (지금 3초)
          - 노란불: **2초** (지금 1초)
          - 빨간불: **5초** (지금 3초)
        hint: 숫자 3, 1, 3 이 있는 기다리기 세 줄만 바꾸면 돼요. 순서는 그대로 두어요
        code: step2_traffic.py
        rules:
          - codeMatches: '^(led_green)\s*=\s*Pin\([\s\S]*^( +)\1\.value\(1\)\n\2time\.sleep\(5(?:\.0)?\)\n\2\1\.value\(0\)'
            fail: 초록불을 켠 바로 다음에 기다리는 시간이 5초인가요?
          - codeMatches: '^(led_yellow)\s*=\s*Pin\([\s\S]*^( +)\1\.value\(1\)\n\2time\.sleep\(2(?:\.0)?\)\n\2\1\.value\(0\)'
            fail: 노란불을 켠 바로 다음에 기다리는 시간이 2초인가요?
          - codeMatches: '^(led_red)\s*=\s*Pin\([\s\S]*^( +)\1\.value\(1\)\n\2time\.sleep\(5(?:\.0)?\)\n\2\1\.value\(0\)'
            fail: 빨간불을 켠 바로 다음에 기다리는 시간이 5초인가요?
          - order: ["led_green.value(1)", "led_yellow.value(1)", "led_red.value(1)"]
