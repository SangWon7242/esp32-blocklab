  <text x="532" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor" stroke="none">3단계</text>
  <rect x="470" y="92" width="44" height="96" rx="10" fill="var(--muted)"/>
  <circle cx="492" cy="112" r="10" fill="#e03131"/>
