  <text x="108" y="258" text-anchor="middle" font-size="19" fill="currentColor" stroke="none">깜빡이기</text>
  <path d="M198 165 H228" stroke-width="3" marker-end="url(#fs-stage-arrow)"/>
  <!-- 2단계 -->
  <rect x="236" y="40" width="168" height="250" rx="16" fill="var(--card)"/>
  <text x="320" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor" stroke="none">2단계</text>
  <rect x="290" y="92" width="60" height="120" rx="12" fill="var(--muted)"/>
  <circle cx="320" cy="116" r="14" fill="#e03131"/>
  <circle cx="320" cy="152" r="14" fill="#fab005"/>
  <circle cx="320" cy="188" r="14" fill="#2f9e44"/>
