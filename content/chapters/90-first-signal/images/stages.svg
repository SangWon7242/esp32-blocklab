<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="inherit">
  <title>오늘 만들 것 세 단계: 1단계 빨강 LED 하나 깜빡이기, 2단계 빨강·노랑·초록 신호등, 3단계 버튼을 누르면 바뀌는 보행자 신호등</title>
  <defs>
    <marker id="fs-stage-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/></marker>
  </defs>
  <!-- 1단계 -->
  <rect x="24" y="40" width="168" height="250" rx="16" fill="var(--card)"/>
  <text x="108" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor" stroke="none">1단계</text>
  <circle cx="108" cy="150" r="30" fill="#e03131"/>
  <path d="M60 150 h-14 M156 150 h14 M108 102 v-12 M74 116 l-9 -9 M142 116 l9 -9" stroke-width="3"/>
