          caption: 테두리 네모, 가운데 제목, 가로선, 안내 문구 — 화면을 꾸밀 자리를 좌표로 먼저 정해요
        body: |
          출입문을 켰을 때 처음 보이는 **시작 화면**을 설계해요. 인사를 2초 보여 준 뒤, 화면 가장자리에 **테두리 네모**를 두르고 제목 · 가로선 · 안내 문구를 그려요. 코드를 쓰기 전에 **우리말로 먼저!**

          블록 **화면에 두 줄 보여주기** 를 쓰면 `show(a, b)` 함수가 함께 만들어져요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요.
