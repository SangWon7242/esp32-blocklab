# 챕터 9 · OLED 출입 화면 — 수업 저장소 09_OLED출입화면. 형식 설명은 src/track/README.md
# 미션 판정은 codeMatches 규칙만 쓴다(정답 파일과 통째로 비교하지 않음): 학생마다 카드 번호(allowed)가 달라도, 여분의 줄이 있어도 지시한 일만 맞으면 통과한다
id: 09-oled-access
order: 9
track: fusion
label: F2
prerequisites: [08-access-control, 21-oled]   # 먼저 할 챕터 (안내만). 아직 없는 챕터는 목록에서 "준비 중"
subjects: [국어, 정보]
sessions: 2
title: OLED 출입 화면
summary: |
  8장의 출입문은 문이 열리는지 닫히는지만 보고 알 수 있었어요. 오늘은 문 옆에 작은 **OLED 화면**을 달아, 카드를 대면 "들어오세요" 인지 "모르는 카드" 인지를 **글자로** 알려 줘요.
  1부에서 화면에 글자와 도형을 그리는 법을 익히고, 2부에서 8장의 출입 통제 코드에 화면을 더해 완성해요. 복사한 코드를 설명할 수 없으면 다음으로 넘어가지 않아요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: OLED 화면 (128×64), note: "I2C 방식. 핀 4개: GND · VCC · SCL(22번) · SDA(21번)" }
  - { name: RFID RC522 모듈, note: "OLED 와 같은 SCL(22번) · SDA(21번) 두 선을 나눠 써요. 핀 4개: GND · VCC · SDA · SCL" }
  - { name: IC 카드 또는 열쇠고리 태그, note: 8장에서 적어 둔 내 카드 번호도 챙기기 }
  - { name: 서보 모터, note: "8장과 같아요. 갈색 G(−) · 빨강 V(+) · 주황 S(신호, 4번 핀)" }
  - { name: F-F 듀폰선 8가닥, board: plus, note: "양쪽 끝이 구멍인 선. RFID 4 · OLED 4, 모듈 핀과 보드 핀에 바로. 서보는 플러그째 꽂아요" }
  - { name: 브레드보드, board: devkit, note: "+ 줄(3V3)·− 줄(GND)과 세로줄 둘(SDA 줄 · SCL 줄)에 OLED · RFID 선을 모아요" }
  - { name: M-F 듀폰선 15가닥, board: devkit, note: "보드 3V3 · GND · D21 · D22 → 브레드보드 4, OLED 4 · RFID 4 → 브레드보드, 보드 VIN · GND · D4 → 서보 플러그 3" }
  - { name: USB 선, note: 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-oled-rfid.svg
  caption: "브레드보드 없이 보드에 바로 꽂아요. RFID → I2C 묶음 첫 줄(8장과 같아요), OLED GND · VCC · SDA · SCL → 보드 위쪽 한 줄의 GND · 5V · SDA · SCL(I2C 묶음과 같은 21 · 22번 선), 서보 플러그 → ANALOG io4 줄 (갈색 G · 빨강 V · 주황 S)"
  captionDevkit: "보드 아래 브레드보드에 모아요. 3V3 → + 줄, GND → − 줄, D21 → 14번 줄(SDA 줄), D22 → 9번 줄(SCL 줄). OLED · RFID 의 VCC → + 줄, GND → − 줄, SDA → 14번 줄, SCL → 9번 줄. 서보 빨강 → VIN · 갈색 → GND · 주황 → D4"
principle:
  image: images/i2c-shared.svg
  body: |
    OLED 화면은 가로 128개 · 세로 64개의 아주 작은 점이 **스스로 빛을 내는** 화면이에요. 뒤에서 비추는 불빛이 없어서, 끈 점은 완전히 까맣게 보여요.

    - 화면 안의 SSD1306 칩이 SCL · SDA **두 선(I2C)** 으로 보드의 명령을 받아요
    - `oled.text` · `oled.rect` 는 화면 칩에 보낼 그림을 보드 안에 **적어 두기**만 하고, `oled.show()` 를 불러야 한꺼번에 화면으로 보내요
    - OLED(이름표 0x3C)와 RFID(이름표 0x28)는 같은 두 선을 나눠 쓰고, **이름표(주소)** 로 누구에게 하는 말인지 구분해요
goals:
  content: OLED 화면에 글자와 도형을 좌표로 그리고, RFID 판단 결과(통과·거부)를 show 함수로 화면에 알려 준다
  thinking: 두 장치가 선 두 개를 나눠 쓸 때 주소로 구분된다는 것을 이해하고, "적어 두기"와 "보여 주기"를 나눠 생각한다
successCriteria:
  - oled.text 로 적은 글자가 oled.show() 를 불러야 화면에 나타나는 까닭을 말할 수 있다
  - (x, y) 좌표에서 x 와 y 가 각각 어느 쪽으로 커지는지 말하고, 원하는 자리에 글자를 적을 수 있다
  - 화면이 안 켜질 때 전원 · 주소 · 라이브러리 순서로 확인할 수 있다
parts:
  - id: part1
    title: 1부 · 화면에 글자와 도형 그리기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 문이 말을 할 수 있다면?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 같은 문인데 카드에 따라 화면에 다른 글자가 떠요. 화면이 없으면 무엇이 불편할까요?
        body: |
          8장의 출입문은 카드를 대면 열리거나 그대로 있었어요. 그런데 문이 안 열렸을 때, **카드가 등록이 안 된 건지 고장 난 건지** 어떻게 알 수 있을까요?

          아직 코드도 부품도 없어요. 활동 칸의 세 질문에 **내 생각을 한두 문장**으로 적어 보세요. 정답은 없고, 틀려도 괜찮아요.
        todo:
          - 준비물(OLED 화면, RFID 모듈, 카드, 서보, 선)을 책상에 꺼내 놓기
          - 세 질문에 내 생각을 한두 문장씩 적기
          - 다 적으면 **완료** 누르기
        questions:
          - 출입문에 작은 화면이 있다면 어떤 말을 보여 주면 좋을까요? 카드를 대기 전, 통과했을 때, 거부됐을 때로 나눠 생각해 봐요
          - 화면은 글자를 "어디에" 쓸지 어떻게 알까요? 공책에 글을 쓸 때와 비교해 보세요
          - RFID 와 화면이 둘 다 보드와 이야기해야 해요. 선이 모자라면 어떻게 할 수 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          화면이 달린 출입문이 하는 일을 **세 덩어리**로 나눠 봐요. 8장에서 한 일(카드 읽기, 목록과 비교, 문 열기)에 **화면에 보여 주기**가 더해졌어요.

          화면에 무엇을 보여 줄지는 **누가 정해야** 할까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 문이 바깥에서 알아내야 하는 것 적기"
          - "**정해야 할 것**: 사람(우리)이 미리 정해 둬야 하는 것 적기"
          - "**해야 할 것**: 문과 화면이 실제로 하는 행동 적기"
        answer:
          know: ["카드가 리더에 닿았는지", "그 카드의 번호(UID)", "번호가 등록 목록에 있는지"]
          decide: ["들여보낼 카드 번호 목록", "화면에 띄울 말(대기 · 통과 · 거부)", "글자를 적을 자리(x, y)", "결과를 몇 초 보여 줄지"]
          act: ["대기 화면 띄우기", "카드 번호를 읽고 목록과 비교하기", "결과를 화면에 띄우고 문을 열거나 닫아 두기", "잠시 뒤 대기 화면으로 돌아가기"]

      - id: predict
        type: predict
        title: 예측하기 — 글자는 화면 어디에 뜰까?
        minutes: 5
        scene:
          image: images/oled-grid.svg
          caption: "화면은 가로 128칸 · 세로 64칸의 점이에요. (0, 0)은 맨 위 구석이고, y 는 아래로 갈수록 커져요"
        body: |
          OLED 화면은 아주 작은 점 **128 × 64개**로 되어 있어요. `oled.text("글", x, y)` 는 (x, y) 자리부터 글자를 적어요. 글자 한 자는 점 8 × 8 크기예요.

          아직 실행하지 마세요. `step1_oled_text.py` 를 읽고 화면에 무엇이 어떻게 보일지 **먼저 예측**해 적어요. 마지막 줄 `oled.show()` 가 왜 따로 있는지도 눈여겨보세요.
        todo:
          - 그림을 보고 x 와 y 가 각각 어느 쪽으로 커지는지 확인하기
          - 세 빈칸에 내 예측 쓰기
          - 예측마다 근거를 한 문장씩 생각해 두기
        code: step1_oled_text.py
        blanks:
          - q: 화면에 글자가 몇 줄 보일까요?
            unit: 줄
          - q: "\"Ready\" 는 화면의 위 · 가운데 · 아래 중 어디쯤 보일까요? 왜 그렇게 생각하나요?"
          - q: 마지막 줄 oled.show() 를 지우고 실행하면 화면은 어떻게 될까요?

      - id: run1
        type: run
        title: 복사 · 실행 — 화면에 글자 띄우기
        minutes: 8
        scene:
          image: images/wiring-oled-rfid.svg
          caption: "8장의 RFID · 서보는 그대로 두고 OLED 4선만 새로 꽂아요: 보드 위쪽 한 줄의 GND · 5V · SDA(21번) · SCL(22번)"
          captionDevkit: "OLED 4선: VCC → + 줄 · GND → − 줄 · SDA → 14번 줄 · SCL → 9번 줄. 브레드보드의 3V3 · GND · D21 · D22 선과 RFID 선도 배선 그림처럼"
        body: |
          **USB 를 뺀 채로** OLED 를 연결해요. SCL → `22`번, SDA → `21`번, VCC · GND 는 전원으로 가요. OLED 와 RFID 는 **같은 21 · 22번 두 선**을 나눠 써요. 어디에 꽂는지는 배선 그림과 아래 표를 보세요.

          화면도 혼자서는 그림을 못 그려서 **라이브러리 파일**이 보드에 있어야 해요. 오늘 쓰는 건 모두 4개(RFID 3개 + `ssd1306.py`)예요. **보드에 저장**이나 **실행**을 누르면 블록랩이 코드의 import 줄을 보고 필요한 파일을 함께 올려 줘요.

          실행해서 화면에 글자가 뜨면 예측과 비교해 보세요. 화면이 까맣다면 먼저 **전원(VCC · GND)** 부터 확인해요.
        todo:
          - USB 를 뺀 채 OLED 4선(GND · VCC · SCL · SDA) 연결하기
          - "**보드 연결** → **실행** 누르고 화면 보기"
          - 세 줄이 어디에 떴는지 예측과 비교하기
        code: step1_oled_text.py
        expected: 코드를 실행하면 OLED 화면 맨 위에 `Hello, ESP32!`, 그 아래에 `Smart Door`, 더 아래에 `Ready` 가 한꺼번에 나타나요.
        codeNotes:
          - { line: 2, note: "OLED 라이브러리(`ssd1306.py`)를 가져와요" }
          - { line: 4, note: "SCL 22번 · SDA 21번 두 선으로 이야기할 준비를 하고 `i2c` 라고 이름 붙여요" }
          - { line: 5, note: "그 두 선에 이어진 128 × 64 화면을 `oled` 라고 이름 붙여요" }
          - { line: 7, note: "`oled.fill(0)`: 적어 둔 것을 모두 까맣게 지워요" }
          - { line: 8, note: "`oled.text(글, x, y)`: (0, 0) 자리에 글자를 적어 둬요. 아직 화면에는 안 보여요" }
          - { line: 10, note: "y 가 클수록 아래쪽이라 `Ready` 는 (0, 40) 에 적혀요" }
          - { line: 11, note: "`oled.show()`: 적어 둔 것을 한꺼번에 화면으로 보내요" }

      - id: readcheck1
        type: readcheck
        title: 읽기 체크 ①
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          방금 실행한 `step1_oled_text.py` 를 **위에서 아래로 손가락으로 짚으며** 읽어요. 복사한 코드를 "이게 무슨 뜻인지" 말할 수 없으면 다음으로 넘어가지 않는 게 오늘의 약속이에요.

          답을 **공책에 먼저 적은 뒤** 확인을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - "`oled.text` 세 줄과 마지막 줄을 한 줄씩 읽기"
          - 세 문제에 답하고 **확인** 누르기
          - 틀린 문항은 그 줄을 다시 읽고 고치기
        code: step1_oled_text.py
        codeNotes:
          - { line: 2, note: "OLED 라이브러리(`ssd1306.py`)를 가져와요" }
          - { line: 4, note: "SCL 22번 · SDA 21번 두 선으로 이야기할 준비를 하고 `i2c` 라고 이름 붙여요" }
          - { line: 5, note: "그 두 선에 이어진 128 × 64 화면을 `oled` 라고 이름 붙여요" }
          - { line: 7, note: "`oled.fill(0)`: 적어 둔 것을 모두 까맣게 지워요" }
          - { line: 10, note: "y 가 클수록 아래쪽이라 `Ready` 는 (0, 40) 에 적혀요" }
        questions:
          - { kind: choice, q: "oled.text(...) 줄이 하는 일은 무엇인가요?", options: ["화면에 바로 글자를 띄운다", "화면에 띄울 글자를 적어 둔다", "화면을 까맣게 지운다"], answer: 1, hint: "줄 끝의 설명을 읽어 보세요" }
          - { kind: number, q: "\"Smart Door\" 는 화면 맨 위에서 몇 칸 아래(y)에 적히나요?", answer: 20 }
          - { kind: line, q: "적어 둔 글자들이 화면에 나타나는 줄의 줄 번호를 클릭하세요", answer: 11 }

      - id: run2
        type: run
        title: 복사 · 실행 — 선 · 네모 그리기
        minutes: 6
        scene:
          image: images/oled-grid.svg
          caption: "도형도 글자처럼 (x, y) 자리에서 시작해요. 네모는 시작 자리와 가로 · 세로 길이로 그려요"
        body: |
          화면에는 글자 말고 **도형**도 그릴 수 있어요. `step2_oled_shapes.py` 는 `oled.line` 으로 선, `oled.rect` 로 네모 테두리, `oled.fill_rect` 로 꽉 채운 네모를 그려요. 글자처럼 도형도 적어 두었다가 `oled.show()` 로 한꺼번에 보여 줘요. 배선은 그대로예요.

          실행하기 전에 줄 끝의 설명을 읽고, 세 도형이 화면 어디쯤 생길지 손가락으로 짚어 봐요. 그다음 숫자 하나를 바꿔 다시 실행하고 무엇이 달라졌는지 보세요.
        todo:
          - "**실행** 누르고 도형 세 개가 어디에 생기는지 보기"
          - "`oled.fill_rect` 의 너비(20)를 40 으로 바꿔 다시 실행하기"
          - 달라진 점을 공책에 한 줄 적기
        code: step2_oled_shapes.py
        expected: 코드를 실행하면 화면 위쪽에 비스듬한 선이 하나 그어지고, 그 아래에 테두리만 있는 네모와 속이 꽉 찬 네모가 나란히 그려져요.
        codeNotes:
          - { line: 7, note: "`oled.fill(0)`: 먼저 화면을 까맣게 지워요" }
          - { line: 8, note: "`oled.line(x1, y1, x2, y2, 1)`: (0, 0) 에서 (127, 20) 까지 선을 그어요. 마지막 1 은 점을 켜라는 뜻" }
          - { line: 9, note: "`oled.rect(x, y, 가로, 세로, 1)`: (10, 30) 에서 시작하는 가로 50 · 세로 25 테두리 네모" }
          - { line: 10, note: "`oled.fill_rect(...)`: (70, 30) 에서 시작하는 가로 · 세로 20 인 꽉 찬 네모" }
          - { line: 11, note: "`oled.show()`: 그려 둔 도형을 한꺼번에 화면으로 보내요" }

  - id: part2
    title: 2부 · 출입 결과를 화면에
    steps:
