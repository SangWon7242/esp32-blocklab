      - id: extra
        type: mission
        title: 추가 미션 — 몇 번째 출입인지 세기
        optional: true
        minutes: 7
        scene:
          image: images/cover.svg
          caption: 문이 열릴 때마다 화면의 번호가 1, 2, 3 … 으로 늘어나요
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 문이 **몇 번 열렸는지** 세어서 화면에 함께 보여 줘요. 등록된 카드를 댈 때마다 `No. 1`, `No. 2`, … 처럼 번호가 늘어나야 해요.

          보드는 몇 번 열렸는지 저절로 기억하지 못해요. **세어 둘 이름** `count` 를 하나 만들고(처음엔 `0`), 문을 열 때마다 1 씩 더하면 어떨까요?
        todo:
          - "`allowed` 줄 바로 아래에 `count = 0` 만들기"
          - 등록된 카드면 count 에 1 을 더하고, 화면에 OPEN 과 번호 보여 주기
          - 실행해서 내 카드를 두세 번 대 보고 **판정** 누르기
        instructions: |
          문이 열린 횟수를 세어 화면에 함께 보여 주세요. allowed 줄 바로 아래에 count = 0 을 두고,
          등록된 카드일 때 맨 먼저 count = count + 1 로 하나 더한 뒤, ACCESS OK 줄 대신 show("OPEN", "No. " + str(count)) 를 띄워요. 나머지 줄은 그대로 둬요
        hint: "count = count + 1 은 지금 count 에 1 을 더한 값을 다시 count 에 적어 두라는 뜻이에요"
        code: step3_access_display.py
        rules:
          - codeMatches: '^count = 0'
            fail: 열린 횟수를 세어 둘 이름을 처음에 무엇으로 정해 두었나요?
