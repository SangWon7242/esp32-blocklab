      - id: mission
        type: mission
        title: 미션 — 닫히기까지 남은 시간 보여 주기
        minutes: 9
        scene:
          image: images/cover.svg
          caption: 문이 열려 있는 동안 화면의 숫자가 3 → 2 → 1 로 줄어들면, 언제 닫히는지 알 수 있어요
        body: |
          지금은 문이 열린 뒤 그냥 3초를 기다려요. 지나가는 사람은 문이 **언제 닫힐지** 모르죠. 열려 있는 3초 동안 화면에 **3 · 2 · 1** 을 보여 주면 어떨까요?

          `time.sleep(3)` 한 번은 1초씩 세 번 기다리는 것과 같아요. 숫자를 하나 보여 주고 1초 기다리기를 **세 번 반복**하려면 무엇을 쓰면 될까요? 숫자 `t` 를 글자와 이으려면 `str(t)` 로 글자로 바꿔야 해요.
        todo:
          - 등록된 카드일 때 문을 열고, 3 → 2 → 1 을 보여 주며 1초씩 기다린 뒤 문 닫기
          - 모르는 카드일 때는 DENIED 를 띄우고 3초 기다리기
          - 실행해서 내 카드로 숫자가 줄어드는지 보고 **판정** 누르기
        instructions: |
          문이 열려 있는 3초 동안 화면에 3 · 2 · 1 카운트다운을 보여 주세요.
          등록된 카드일 때: 문을 열고(servo.duty_u16(8100)), for t in range(3, 0, -1): 반복 안에서 show("OPEN", "Close: " + str(t)) 와 1초 기다리기를 하고, 반복이 끝나면 문을 닫아요(servo.duty_u16(1638)). ACCESS OK 줄은 지워요.
          모르는 카드일 때: show("DENIED", "Unknown card") 다음에 3초 기다려요. 문은 이미 닫혀 있으니 닫는 줄은 지워요.
          맨 아래 time.sleep(3) 줄은 지우고, 대기 화면으로 돌아가는 마지막 show 줄은 그대로 둬요
        hint: "range(3, 0, -1) 은 3 에서 시작해 1 씩 줄어들고, 0 이 되기 전에 멈춰요. 그래서 t 는 3, 2, 1 이 돼요"
        code: step3_access_display.py
        rules:
          - codeMatches: 'for t in range\(3, 0, -1\):'
            fail: 3 → 2 → 1 로 거꾸로 세는 반복이 있나요? range 에 시작 · 끝 · 몇씩 바뀌는지 세 숫자를 넣어 봐요
          - codeMatches: 'show\("OPEN", "Close: "\s*\+\s*str\(t\)\)'
            fail: '반복 안에서 남은 시간을 화면에 보여 주나요? 숫자 t 를 "Close: " 뒤에 붙이려면 무엇으로 바꿔야 할까요?'
          - codeMatches: 'str\(t\)\)\n\s+time\.sleep\(1\)'
            fail: 숫자 하나를 보여 준 뒤 얼마나 기다려야 세 번 합쳐 3초가 될까요?
          - codeMatches: 'servo\.duty_u16\(8100\)\n\s+for t in range\(3, 0, -1\):'
            fail: 카운트다운이 시작될 때 문은 이미 열려 있나요? 문을 여는 줄과 반복 줄 가운데 무엇이 먼저인가요?
          - codeMatches: '^(\s+)for t in range\(3, 0, -1\):\n(?:\1\s+.*\n)+(?:\1\S.*\n)*?\1servo\.duty_u16\(1638\)'
            fail: 반복이 모두 끝난 뒤에 문을 닫나요? 닫는 줄이 반복 안에 들어가 있으면 몇 번 닫힐까요?
          - notHas: 'show("ACCESS OK", "Door open")'
            fail: 등록된 카드일 때 화면에는 카운트다운만 보여야 해요. 예전 ACCESS OK 화면이 아직 남아 있지 않나요?
          - codeMatches: 'show\("DENIED", "Unknown card"\)\n\s+time\.sleep\(3\)'
            fail: 모르는 카드일 때 DENIED 화면은 몇 초 동안 보여야 하나요? 그만큼 기다리는 줄이 DENIED 다음에 있나요?
          - codeMatches: '^(\s+)\s+\S.*\n\1show\("Tag your", "card\.\.\."\)'
            fail: 두 갈림길이 각자 기다린 뒤에는 바로 대기 화면으로 돌아가야 해요. 맨 아래 time.sleep(3) 줄은 어떻게 했나요?
        answerCode: mission_countdown.py

      - id: debug
        type: debug
        title: 디버깅 미션 — 화면이 안 켜져요
        minutes: 7
        scene:
          image: images/i2c-shared.svg
          caption: "화면이 안 켜지면 전원(VCC · GND)부터, 그다음 이름표(주소), 그다음 라이브러리 순서로 봐요"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 화면이 까말 때는 **전원 → 주소 → 라이브러리** 순서로 보는 게 오늘의 약속이에요. 전원 선이 맞는데도 이상하면 그때 코드를 봐요.

          셋 중 **빨간 글씨가 뜨는 것**은 어느 것일까요? 나머지 둘은 왜 에러 없이 이상하게만 굴까요? 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 화면이 까만 채로예요. 빨간 글씨도 안 떠요
            code: |
              from machine import Pin, SoftI2C
              import ssd1306

              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              oled.fill(0)
              oled.text("Hello, ESP32!", 0, 0)
              oled.text("Smart Door", 0, 20)
              oled.text("Ready", 0, 40)
            question: 전원 선(VCC · GND)은 맞게 꽂았는데도 까맣다면, 적어 둔 글자를 화면에 "내보내는" 줄이 있나요? oled.text 는 무엇을 하는 줄이었나요?
            rules:
              - codeMatches: 'oled\.text\("Ready", 0, 40\)\noled\.show\(\)'
                fail: 다 적은 뒤에 화면에 나타나게 하는 줄이 있나요? 그 줄은 적는 줄들보다 앞일까요, 뒤일까요?
          - title: 화면에 "Tag your card..." 는 뜨는데, 카드를 대도 아무 일도 없어요
            code: |
              from machine import Pin, SoftI2C
              import ssd1306
              from mfrc522_i2c import mfrc522

              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)
              rc522 = mfrc522(22, 21, 0x3C)
              rc522.PCD_Init()


              def card_present():
                  return rc522.PICC_IsNewCardPresent() and rc522.PICC_ReadCardSerial()


              def card_uid():
                  return rc522.uid.uidByte[0:rc522.uid.size]


              def show(a, b):
                  oled.fill(0)
                  oled.text(a, 0, 20)
                  oled.text(b, 0, 36)
                  oled.show()


              show("Tag your", "card...")
              while True:
                  if card_present():
                      print(card_uid())
            question: 두 장치는 같은 선을 쓰고 이름표(주소)로 구분돼요. 0x3C 는 누구의 이름표였나요? 그림에서 RFID 의 이름표를 찾아보세요
            rules:
              - codeMatches: '^rc522 = mfrc522\(22, 21, 0x28\)'
                fail: RFID 를 부르는 이름표(주소)가 RFID 의 것인가요? 그림의 두 이름표를 다시 비교해 보세요
          - title: "실행하자마자 빨간 글씨로 ImportError: no module named 'oled' 가 떠요"
            code: "import oled\n\ni2c = SoftI2C(scl=Pin(22), sda=Pin(21))\noled = ssd1306.SSD1306_I2C(128, 64, i2c)"
            question: 보드에 올라가는 라이브러리 4개 중 화면용 파일의 이름은 무엇이었나요? 아래 줄에서 SSD1306_I2C 앞에 붙은 이름과 import 줄의 이름이 같나요?
            rules:
              - codeMatches: '^import ssd1306$'
                fail: 화면 설명서(라이브러리) 파일 이름과 import 줄의 이름이 같나요? 아래 줄에서 점(.) 앞에 쓴 이름을 보세요

      - id: design
