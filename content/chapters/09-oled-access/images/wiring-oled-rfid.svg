<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="wo-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="wo-title">OLED 화면과 RFID 배선도: OLED 는 브레드보드 위, RFID 는 아래에 두고, 두 부품의 SCL 선은 파란 세로줄 하나에, SDA 선은 보라 세로줄 하나에 함께 꽂는다. 파란 SCL 줄은 ESP32 22번, 보라 SDA 줄은 21번에 잇는다. OLED VCC·GND 는 위 + 줄·− 줄, RFID V·G 는 아래 + 줄·− 줄에 꽂고, 네 줄은 ESP32 5V·GND 에 잇는다. 서보 빨강은 위 + 줄, 갈색은 위 − 줄, 주황 신호선은 ESP32 4번</title>
