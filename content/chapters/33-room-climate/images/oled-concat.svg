<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rc-concat-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="rc-concat-title">OLED 화면에 두 줄 적기. 화면 y 16 자리에 T: 24C, y 32 자리에 H: 40% 가 보인다. 한 줄 글은 조각 셋을 + 로 이어 만든다: 글 "T: " 와, 숫자 t(24)를 글자로 바꾼 "24" 와, 글 "C" 를 이으면 "T: 24C". 2초마다 지우고 다시 적는다</title>
  <!-- OLED 모듈 -->
  <rect x="28" y="40" width="250" height="172" rx="10" fill="#1d4ed8" stroke-width="2"/>
  <rect x="42" y="54" width="222" height="126" rx="3" fill="#0b1b4d" stroke="none"/>
  <g font-size="17" font-weight="700" fill="#7dd3fc" stroke="none" font-family="ui-monospace, monospace">
    <text x="54" y="104">T: 24C</text>
    <text x="54" y="136">H: 40%</text>
  </g>
  <g font-size="12" fill="#7dd3fc" fill-opacity="0.75" stroke="none" text-anchor="end">
    <text x="256" y="104">y 16</text>
    <text x="256" y="136">y 32</text>
  </g>
  <text x="153" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" stroke="none">OLED 128 × 64</text>
  <text x="153" y="240" text-anchor="middle" font-size="13" fill="currentColor" fill-opacity="0.75" stroke="none">2초마다 지우고 → 적고 → 내보내기</text>
  <!-- 조각 잇기 -->
  <text x="312" y="70" font-size="15" font-weight="700" fill="currentColor" stroke="none">한 줄 = 조각 셋을 + 로 잇기</text>
  <g stroke-width="1.8">
    <rect x="312" y="88" width="64" height="34" rx="8" fill="var(--card)"/>
    <rect x="404" y="88" width="104" height="34" rx="8" fill="#f4af18" fill-opacity="0.3"/>
    <rect x="536" y="88" width="50" height="34" rx="8" fill="var(--card)"/>
  </g>
  <g font-size="15" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle" font-family="ui-monospace, monospace">
    <text x="344" y="110">"T: "</text>
    <text x="456" y="110">str(t)</text>
    <text x="561" y="110">"C"</text>
  </g>
  <g font-size="18" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="390" y="111">+</text>
    <text x="522" y="111">+</text>
  </g>
  <g font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none" text-anchor="middle">
    <text x="344" y="142">글</text>
    <text x="456" y="142">숫자 24 → 글자 "24"</text>
    <text x="561" y="142">글</text>
  </g>
  <path d="M449 156 V180" stroke-width="2"/>
  <path d="M441 172 L449 182 L457 172" stroke-width="2"/>
  <rect x="392" y="190" width="114" height="38" rx="8" fill="#00b6b1" fill-opacity="0.2" stroke-width="1.8"/>
  <text x="449" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">"T: 24C"</text>
  <!-- 블록 이름 -->
  <rect x="312" y="256" width="304" height="78" rx="10" fill="var(--muted)" stroke-width="1.5"/>
  <g font-size="13" fill="currentColor" stroke="none">
    <text x="328" y="282" font-weight="700">블록으로는</text>
    <text x="328" y="304">글자 잇기: "… 와(과) … 합치기"</text>
    <text x="328" y="324">숫자를 글자로: "… 을(를) 글자로"</text>
  </g>
</svg>
