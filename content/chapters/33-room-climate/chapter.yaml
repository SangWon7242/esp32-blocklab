# 교과 융합 트랙 F6 · 교실 온습도 알리미 — 원본: 아두이노 기본 W05(DHT11 온·습도, 교실 온습도 알리미 전환안)·W06(온습도 상태 표시), 센서 트랙 S12(15-temp-humidity 불쾌지수 식) · S18(21-oled) · S7(07-fan). 형식 설명은 src/track/README.md
id: 33-room-climate
order: 33
track: fusion
label: F6
prerequisites: [15-temp-humidity, 21-oled, 07-fan]
subjects: [과학, 수학, 기술가정]
sdg: [11, 13]
sessions: 2
teacherNotes: |
  **핀 번호** DHT11 S 는 **4번**이다. S12(15-temp-humidity)는 13번이었지만, 이 챕터는 팬(모터 모듈)이 13 · 12번을 쓰므로 DHT11 을 4번으로 옮겼다. OLED SCL 22 · SDA 21(S18), RGB LED 빨강 27 · 초록 25 · 파랑 26(S5), 모터 IN+ 13 · IN− 12(S7). 네 장치의 핀이 겹치지 않는다. S12 를 한 모둠은 DHT11 선을 13번에서 4번으로 옮겨 꽂게 한다.

  **전원과 안전** 위쪽 + 줄은 3V3(DHT11 · OLED), 모터 모듈 V 는 보드 5V 에 따로 꽂는다. USB 전원만으로 팬을 세게 돌리면 보드가 다시 시작될 수 있다. 그러면 S7 처럼 배터리 홀더를 외부 전원 단자에 꽂거나, `forward(1023)` 을 `forward(700)` 으로 낮춰 시험한다(판정은 1023 그대로도, 낮춰도 통과). 팬 날개는 배선을 모두 마치고 USB 를 뺀 상태에서 끼우고, 돌 때 손가락·머리카락·종이를 가까이 대지 않게 한다. 배선은 늘 USB 를 뺀 채로 한다.

  **측정값과 기준** 불쾌지수 단계(68 미만 쾌적 · 68~75 보통 · 75~80 높음 · 80 이상 매우 높음)는 기상청 표를 따른 **예시 기준**이고, 팬 기준 75 도 예시다. 1차시 실행에서 교실 온도 · 습도를 공책에 적고, 그 값으로 지금 불쾌지수를 손으로 계산해 보게 한다. 봄 · 가을 교실은 대개 68 아래라 RGB 가 초록, 팬은 꺼져 있다. 손으로 센서를 감싸고 입김을 불면 습도가 크게 올라 불쾌지수가 몇 단계 오른다. 그래도 75 에 닿지 않으면 판정을 받은 뒤 기준을 "지금 불쾌지수 + 2" 쯤으로 낮춰 팬이 도는 것을 확인하게 한다(미션 · 설계 판정은 지시의 숫자 그대로).

  **값의 정밀도** DHT11 은 정수만 주고 오차가 온도 ±2℃, 습도 ±5% 쯤이다. 모둠마다 1~2 다른 것은 정상이다. OLED 의 `DI:` 는 `int()` 로 소수점을 버린 값이라 계산기 값(예: 70.73)보다 작게(70) 보인다. `measure()` 를 1초보다 자주 부르면 `OSError: [Errno 116] ETIMEDOUT` 이 난다(디버깅 증상 2). 보드에 `ssd1306.py` 가 있어야 화면이 켜진다(S18 과 같음).

  **교과 · 단원 연결**

  - 과학: 습도와 증발, 이슬점, 날씨와 기상 관측(상대 습도, 체감 온도)
  - 수학: 문자와 식(식에 값 대입하기, 계산 순서와 괄호), 자료의 정리와 평균(하루 세 번 잰 값의 평균)
  - 기술가정: 쾌적한 주거 환경, 냉난방 에너지 절약, 식품 보관 온습도
  - 체육(넓히기): 불쾌지수 · 온도로 야외 활동 가능 여부 정하기
  - SDG 11(살기 좋은 도시와 공동체), SDG 13(기후 변화 대응): 냉방을 꼭 필요할 때만 켜면 에너지를 아낀다

  **메이킹** 종이컵을 거꾸로 세워 OLED 받침을 만들거나, 박스지로 "교실 기후 알림판"(OLED 창, RGB LED 구멍, 팬 자리)을 접어 붙인다. DHT11 은 상자 안에 가두지 말고 공기가 통하는 바깥에 둔다(상자 속 열 때문에 값이 오른다). 팬 둘레에는 손가락이 닿지 않게 박스지로 울타리를 친다.

  - 1차시: 문제 만나기 ~ 읽기 체크 1 (DHT11 + OLED 배선, 온도 · 습도를 화면 두 줄로)
  - 2차시: 실행 2 · 읽기 체크 2(불쾌지수와 RGB 색) · 통합 미션(팬 더하기) · 디버깅 · 설계 · 성찰
  - 시간이 모자라면 디버깅 증상 3 과 설계를 다음 시간 앞부분으로 미룬다
title: 교실 온습도 알리미
subtitle: 온도 · 습도로 불쾌지수를 계산해 화면 · 색 · 바람으로 알려 주기
summary: |
  같은 25도라도 습한 날은 더 덥고 끈적하게 느껴져요. 오늘은 **DHT11** 로 교실의 온도와 습도를 재고, **OLED 화면**에 `T: 24C` · `H: 40%` 처럼 보여 줘요.
  2부에서는 수학 식으로 **불쾌지수**를 계산해 단계마다 **RGB LED** 색을 바꾸고, 불쾌지수가 높으면 **팬(모터)**을 돌리는 알리미로 완성해요. 냉방을 꼭 필요할 때만 켜는 것도 기후를 지키는 방법이에요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 온습도 센서(DHT11 모듈), note: "다리 3개: S(신호) · +(3V3) · −(GND). S 는 4번 핀으로" }
  - { name: OLED 화면 (128×64), note: "핀 4개: GND · VCC · SCL · SDA. 보드에 ssd1306.py 를 먼저 올려 두기" }
  - { name: RGB LED, note: "다리 4개. 순서는 빨강 · GND · 초록 · 파랑, 가장 긴 다리가 GND" }
  - { name: 220Ω 저항, note: "3개. 빨강-빨강-갈색 띠. 빨강 · 초록 · 파랑 다리에 하나씩" }
  - { name: 130 모터 모듈과 팬 날개, note: "핀 4개: G · V · IN+ · IN−. 날개는 배선을 다 마친 뒤에 끼워요" }
  - { name: 브레드보드, note: "위쪽 + 줄(3V3)과 − 줄(GND)을 네 부품이 함께 써요" }
  - { name: M-F 듀폰선, note: "11가닥. 보드 핀(3V3 · GND · 22 · 21 · 4 · 27 · 25 · 26 · 5V · 13 · 12) → 브레드보드" }
  - { name: 점퍼선(M-M), note: "6개. 브레드보드 안에서 + 줄 · − 줄로 (OLED 2, DHT11 2, RGB 1, 모터 1)" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "위쪽 + 줄 ← 3V3, − 줄 ← GND. OLED(4~7번 줄: GND · VCC · SCL · SDA): GND → − 줄, VCC → + 줄, SCL ← 22, SDA ← 21. DHT11(10~12번 줄: S · + · −): S ← 4, + → + 줄, − → − 줄. RGB LED(14 · 16 · 18 · 20번 줄: 빨강 · GND · 초록 · 파랑): GND → − 줄, 빨강 · 초록 · 파랑은 220Ω 저항으로 가운데 홈을 건너 27 · 25 · 26. 모터 모듈(26~29번 줄: G · V · IN+ · IN−): G → − 줄, V ← 5V, IN+ ← 13, IN− ← 12"
principle:
  image: images/humid-heat.svg
  body: |
    몸은 땀이 **증발**할 때 피부의 열을 함께 가져가서 시원해져요. 공기 속에 물기(수증기)가 많으면, 즉 **습도**가 높으면 땀이 잘 마르지 않아 열이 빠지지 못하고 같은 온도라도 더 덥게 느껴요.

    습도(%)는 지금 공기가 그 온도에서 품을 수 있는 수증기의 최대량 가운데 얼마만큼을 품고 있는지 나타내요. 공기가 식어서 습도가 100% 가 되는 온도를 **이슬점**이라 하고, 그때부터 차가운 컵 겉면처럼 물방울이 맺혀요.

    **불쾌지수**는 온도와 습도를 한 식에 넣어 "사람이 느끼는 더위"를 숫자 하나로 나타낸 것이에요. 25℃ 라도 습도 40% 면 70.7(보통), 90% 면 76.0(높음)이에요. 알리미는 이 숫자로 색을 고르고 팬을 켤지 정해요.
goals:
  content: DHT11 로 온도 · 습도를 재서 OLED 에 표시하고, 불쾌지수를 계산해 단계별 RGB 색과 팬을 함께 제어한다
  thinking: 문제를 재기 · 계산 · 보여 주기 · 판단으로 나누고, 과학 원리(습도와 증발)와 수학 식(대입 · 계산 순서)을 코드의 판단 기준으로 옮긴다
successCriteria:
  - 같은 온도에서 습도가 높으면 더 덥게 느끼는 까닭을 증발로 설명할 수 있다
  - 숫자를 글자로 바꿔(str) 다른 글과 이어 OLED 에 두 줄로 보여 줄 수 있다
  - 불쾌지수를 식으로 계산하고, 네 단계를 if · elif · else 로 나눠 색을 고를 수 있다
  - 센서 · 화면 · LED · 팬을 한 반복 안에 묶은 알리미를 만들고, 기준값을 교실에 맞게 다시 정할 수 있다
parts:
  - id: part1
    title: 1부 · 온도와 습도를 화면에
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 몇 도부터 덥다고 할까?
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 같은 25도인데 습한 날은 왜 더 덥게 느껴질까요?
        body: |
          여름 교실에서 에어컨은 누가, 몇 도에 켜나요? 같은 25도인데도 비 오는 날에는 더 끈적하고 덥게 느껴져요. 도시가 커지고 여름이 길어지면서 냉방에 쓰는 전기도 늘고 있어요. 꼭 필요할 때만 켜려면 "덥다"를 숫자로 정해야 해요.

          오늘은 교실의 온도와 습도를 재서 알려 주는 알리미를 만들어요. 코드를 보기 전에 질문마다 내 생각을 한두 문장으로 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, DHT11, OLED, RGB LED, 저항, 모터 모듈, 브레드보드, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장씩 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 에어컨은 '덥다'를 몇 도부터라고 정해야 할까요? 그 숫자는 무엇을 생각해서 정하죠?
          - 같은 25도인데 왜 습한 날은 더 덥게 느껴질까요?
          - 교실이 덥고 습하다는 것을 친구들에게 어떤 방법으로 알려 주면 한눈에 알 수 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별 세 칸 보드
        minutes: 7
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          알리미에는 장치가 넷이에요. 센서 하나(DHT11)가 **알아내고**, 사람이 **기준을 정해 주면**, 화면 · LED · 팬 셋이 **움직여요**. 장치마다 어느 칸에 들어갈지 생각하며 나눠 봐요.

          - **알아야 할 것**: DHT11 이 재는 값, 다음에 재기까지 쉬어야 하는 시간
          - **정해야 할 것**: 쾌적한 범위, 불쾌지수 단계, 팬을 켤 기준
          - **해야 할 것**: OLED 글, RGB 색, 팬
        todo:
          - "**알아야 할 것**: 센서가 알아내는 값 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 기준 숫자 적기"
          - "**해야 할 것**: 화면 · LED · 팬이 할 일을 하나씩 적기"
        answer:
          know: ["DHT11 이 잰 온도(℃)와 습도(%)", "온도 · 습도를 꺼내기 전에 먼저 재 달라고(measure) 해야 한다는 것", "한 번 잰 뒤 1초 넘게 쉬어야 한다는 것", "DHT11 S 선 4번, OLED 22 · 21, RGB 27 · 25 · 26, 모터 13 · 12"]
          decide: ["불쾌지수 단계 경계 (68 · 75 · 80)", "팬을 켤 불쾌지수 (예: 75 이상)", "몇 초마다 잴지 (예: 2초)", "단계마다 어떤 색을 켤지 (초록 · 노랑 · 주황 · 빨강)"]
          act: ["OLED 에 온도와 습도를 두 줄로 보여 주기", "불쾌지수를 계산해 단계별 RGB 색 켜기", "불쾌지수가 기준 이상이면 팬 켜기, 아니면 멈추기", "이것을 2초마다 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 화면에 무엇이 보일까?
        minutes: 5
        scene:
          image: images/oled-concat.svg
          caption: '"T: " 와 str(t) 와 "C" 를 + 로 이으면 한 줄 글 "T: 24C" 가 돼요'
        body: |
          활동 칸의 코드는 2초마다 온도와 습도를 재서 OLED 화면에 두 줄로 적어요. 화면에는 **글자만** 적을 수 있어서, 숫자 `t` 를 `str(t)` 로 글자로 바꾼 뒤 `"T: "` 와 `"C"` 사이에 이어 붙여요. 아직 실행하지 않아요.

          코드를 한 줄씩 읽고, 화면에 어떤 글이 보일지 먼저 적어 봐요. **내 예측을 먼저 적는 것**이 중요해요.
        todo:
          - 코드를 위에서부터 한 줄씩 소리 내어 읽기
          - "`+` 로 이은 조각이 몇 개인지 세어 보기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_climate_oled.py
        blanks:
          - q: 온도가 24, 습도가 40 이면 화면 첫째 줄과 둘째 줄에 무엇이 보일까요?
          - q: 화면의 글은 몇 초마다 바뀔까요? 왜 더 자주 바꾸지 않을까요?
          - q: 센서에 입김을 불면 두 줄 가운데 어느 줄의 숫자가 더 크게 바뀔까요?

      - id: run
        type: run
        title: 복사 · 실행 — 온도와 습도를 화면에
        minutes: 15
        scene:
          image: images/wiring-breadboard.svg
          caption: "이번에는 DHT11(S ← 4)과 OLED(SCL ← 22, SDA ← 21)만 먼저 꽂아요. + 줄은 3V3, − 줄은 GND"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 먼저 위쪽 + 줄(3V3) · − 줄(GND)을 보드와 이어요. 그다음 DHT11(S · + · −)과 OLED(GND · VCC · SCL · SDA)를 꽂아요. S12 에서 13번에 꽂던 DHT11 S 선은 **4번**으로 옮겨요. 13번은 2부에서 팬이 써요.

          실행되면 화면에 보이는 온도와 습도를 **공책에 적어** 두세요. 센서를 손으로 감싸고 입김도 불어 보며 숫자가 어떻게 바뀌는지 봐요. 2부에서 이 숫자로 불쾌지수를 계산해요.
        todo:
          - "**부품과 배선**대로 + 줄 · − 줄, DHT11, OLED 꽂기 (RGB LED · 모터 모듈은 2부에서 꽂아도 돼요)"
          - "**보드 연결** → **실행** 누르기"
          - 지금 온도 · 습도와, 입김을 불었을 때 숫자를 공책에 적기
        code: step1_climate_oled.py
        expected: "코드를 실행하면 OLED 화면에 `T: 24C` 와 `H: 40%` 처럼 두 줄이 보이고, 2초마다 새 값으로 바뀌어요. 입김을 불면 둘째 줄 습도가 크게 올랐다가 천천히 돌아와요."
        codeNotes:
          - { line: 1, note: "핀을 다루는 `Pin` 과 화면 선을 다루는 `SoftI2C` 를 가져와요" }
