          - { line: 33, note: "위에서부터 차례로 물어요. 참인 첫 갈래만 실행해요" }
          - { line: 39, note: "위 질문이 모두 거짓일 때 실행해요" }

      - id: mission
        type: mission
        title: 통합 미션 — 팬까지 움직이는 알리미
        minutes: 12
        scene:
          image: images/climate-flow.svg
          caption: 재기 → 계산 → 보여 주기 → 판단 → 2초 쉬기. 판단 칸에 팬을 더해요
        body: |
          이제 알리미에 **팬(모터 모듈)**을 더해요. **USB 를 뺀 채로** 모터 모듈을 꽂아요: G → − 줄, V → 5V, IN+ → 13번, IN− → 12번. 팬 날개는 배선을 다 마친 뒤에 끼워요.

          미션은 기능 체크리스트로 판정해요. 팬을 더하면서 화면 · 색 · 측정 간격이 그대로 잘 되는지도 함께 봐요. 판정에서 걸린 항목은 되묻는 질문을 읽고 그 부분만 고쳐요.
        todo:
          - 모터 모듈을 배선도대로 꽂고, 모터 준비 블록 더하기
          - 색을 고르는 `if` 묶음 아래에 팬 판단 `if` · `else` 더하기
          - 실행해서 팬이 도는지 확인하고 **판정** 누르기
        instructions: "실행 2 코드에 팬을 더해 알리미를 완성하세요. 체크리스트: (1) 되풀이 안에서 DHT11 에 측정을 부탁하고 2초 이상 쉬기 (2) OLED 에 온도 줄과 습도 줄을 글자로 적어 내보내기 (3) 모터를 IN+ 13 · IN− 12 로 준비하고, 색을 고르는 if 묶음과 따로 if di >= 75 이면 forward(1023), 아니면 stop() (4) 불쾌지수 80 · 75 · 68 경계로 빨강 · 주황 · 노랑 · 초록 네 단계 색 켜기"
        hint: "모터 준비 블록은 DC 모터 꾸러미에 있어요(IN+ 13, IN− 12). 팬 판단은 색 if 묶음이 끝난 뒤, 기다리기 위에 새 if · else 블록으로 넣어요. 조건은 di >= 75, 참이면 '모터 앞으로', 거짓이면 '모터 정지'"
        code: step2_discomfort_rgb.py
        rules:
          - codeMatches: 'dht11\.measure\(\)[\s\S]*\n\s+time\.sleep\((?:[2-9]|[1-9]\d+)(?:\.\d+)?\)'
            fail: (1) 센서에게 재 달라고 부탁하는 줄이 되풀이 안에 있나요? 한 바퀴 끝에 몇 초 쉬나요? DHT11 이 쉬어야 하는 시간보다 넉넉한가요?
          - codeMatches: 'oled\.fill\(0\)[\s\S]*oled\.text\([^\n]*str\(t\)[^\n]*\)[\s\S]*oled\.text\([^\n]*str\(h\)[^\n]*\)[\s\S]*oled\.show\(\)'
            fail: (2) 화면에 온도 줄과 습도 줄이 차례로 보이나요? 숫자를 글자로 바꿔 이었나요? 지우기와 내보내기도 있나요?
          - pinIs: { name: motor1a, pin: 13 }
            fail: (3) 팬(모터 모듈)을 준비했나요? IN+ 선은 몇 번 핀에 꽂았나요?
          - codeMatches: '^\s+if\s+di\s*>=\s*75\s*:\n\s+forward\(\d+\)\n\s+else\s*:\n\s+stop\(\)'
            fail: (3) 불쾌지수가 몇 이상일 때 팬을 켜기로 했나요? 그보다 낮을 때 팬은 어떻게 되어야 하나요? 색을 고르는 묶음과 따로 물었나요?
          - codeMatches: 'if\s+di\s*>=\s*80\s*:\n\s+set_color\([^)]*\)\n\s+elif\s+di\s*>=\s*75\s*:\n\s+set_color\([^)]*\)\n\s+elif\s+di\s*>=\s*68\s*:\n\s+set_color\([^)]*\)\n\s+else\s*:\n\s+set_color\([^)]*\)'
            fail: (4) 불쾌지수 네 단계마다 다른 색이 켜지나요? 가장 높은 기준부터 차례로 물었나요?
        answerCode: mission_climate_fan.py

      - id: debug
        type: debug
        title: 디버깅 — 알리미가 이상해요
        minutes: 8
        scene:
          image: images/climate-flow.svg
          caption: 숫자가 그대로면 "재기" 칸을, 오류가 나면 쉬는 시간과 글 잇기를 봐요
        body: |
          고장 난 알리미 세 개가 있어요. 바로 고치지 말고 **증상을 보고 한 바퀴의 어느 칸부터 볼지** 먼저 정해요. 숫자가 꿈쩍도 안 하면 재기 칸, `OSError` 가 나면 쉬는 시간, `TypeError` 가 나면 화면에 적는 글을 봐요.

          오류 글의 마지막 줄에 오류 이름이 있어요. 그 이름을 먼저 읽어요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: "화면에 T: 0C 만 보이고, 손으로 감싸도 숫자가 바뀌지 않아요"
            code: "dht11 = dht.DHT11(Pin(4))\ni2c = SoftI2C(scl=Pin(22), sda=Pin(21))\noled = ssd1306.SSD1306_I2C(128, 64, i2c)\n\nwhile True:\n    t = dht11.temperature()\n    oled.fill(0)\n    oled.text(\"T: \" + str(t) + \"C\", 0, 16)\n    oled.show()\n    time.sleep(2)"
            question: "temperature() 는 센서에게 \"지금 재 줘\" 하고 부탁하는 줄일까요, 받아 둔 숫자를 꺼내기만 하는 줄일까요? 새로 재 달라는 부탁은 어디에 있나요?"
            rules:
              - codeMatches: 'dht11\.measure\(\)\n\s*t\s*=\s*dht11\.temperature\(\)'
                fail: 온도를 꺼내기 전에 센서가 먼저 해야 할 일은 무엇일까요? 그 줄은 몇 번째에 와야 할까요?
          - title: "몇 번 바뀌다가 OSError: [Errno 116] ETIMEDOUT 이 나며 멈춰요"
            code: "dht11 = dht.DHT11(Pin(4))\ni2c = SoftI2C(scl=Pin(22), sda=Pin(21))\noled = ssd1306.SSD1306_I2C(128, 64, i2c)\n\nwhile True:\n    dht11.measure()\n    t = dht11.temperature()\n    oled.fill(0)\n    oled.text(\"T: \" + str(t) + \"C\", 0, 16)\n    oled.show()\n    time.sleep(0.2)"
            question: 0.2초마다 재 달라고 하면 센서는 쉴 틈이 있을까요? DHT11 은 한 번 잰 뒤 얼마나 쉬어야 했나요?
            rules:
              - codeMatches: 'time\.sleep\((?:[2-9]|[1-9]\d+)(?:\.\d+)?\)'
                fail: 쉬는 시간이 센서가 한 번 잰 뒤 쉬어야 하는 시간보다 넉넉한가요? 알리미가 쓰던 간격은 몇 초였나요?
          - title: "실행하자마자 TypeError 가 나며 화면이 켜지지 않아요"
            code: "dht11 = dht.DHT11(Pin(4))\ni2c = SoftI2C(scl=Pin(22), sda=Pin(21))\noled = ssd1306.SSD1306_I2C(128, 64, i2c)\n\nwhile True:\n    dht11.measure()\n    t = dht11.temperature()\n    oled.fill(0)\n    oled.text(\"T: \" + t + \"C\", 0, 16)\n    oled.show()\n    time.sleep(2)"
            question: "\"T: \" 는 글이고 t 는 숫자예요. 글과 숫자를 + 로 바로 이을 수 있을까요? 화면에 적으려면 t 를 무엇으로 바꿔야 할까요?"
            rules:
              - codeMatches: 'oled\.text\("T: "\s*\+\s*str\(t\)\s*\+\s*"C"'
                fail: 화면에는 글자만 적을 수 있어요. 숫자 t 를 이어 붙이기 전에 어떤 블록으로 감쌌나요?

      - id: design
        type: design
        title: 설계 — 알리미 한 바퀴를 우리말로
        minutes: 8
        scene:
          image: images/climate-flow.svg
          caption: 재기 → 계산 → 보여 주기 → 판단 → 2초 쉬기. 이 순서를 우리말 설계도로 써요
        body: |
          이번에는 RGB 없이 **화면 한 줄과 팬**만 쓰는 간단한 알리미를 처음부터 설계해요. 먼저 우리말 설계도의 빈칸을 채우고, 번역표로 우리말 한 줄이 어떤 코드가 되는지 짝지어 봐요.

          그다음 섞인 블록을 설계도 순서대로 이어 붙여요. **재기 → 계산 → 보여 주기 → 판단 → 쉬기** 순서가 어긋나면 알리미가 엉뚱하게 움직여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 우리말 한 줄이 어떤 코드가 되는지 짝지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 온습도 센서를 __번 핀에 준비한다
            blank: { answer: 4 }
          - text: OLED 화면과 모터(팬)를 준비한다
          - text: 끝없이 되풀이한다
          - text: "  ↳ 센서에게 새로 재 달라고 부탁하고, 온도를 t, 습도를 h 에 담는다"
          - text: "  ↳ 불쾌지수 식으로 계산해 __ 에 담는다"
            blank: { answer: di }
          - text: "  ↳ 화면을 지우고 DI: 와 정수로 바꾼 불쾌지수를 적어 내보낸다"
