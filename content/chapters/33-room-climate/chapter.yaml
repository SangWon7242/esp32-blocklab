  - id: part2
    title: 2부 · 불쾌지수로 색과 바람 정하기
    steps:
      - id: run2
        type: run
        title: 복사 · 실행 2 — 불쾌지수와 RGB 색
        minutes: 10
        scene:
          image: images/discomfort-scale.svg
          caption: 불쾌지수 68 · 75 · 80 을 경계로 초록 · 노랑 · 주황 · 빨강을 켜요
        body: |
          **USB 를 뺀 채로** RGB LED 를 꽂아요. 다리 순서는 빨강 · GND · 초록 · 파랑이고, 가장 긴 다리(GND)는 − 줄로, 나머지 셋은 220Ω 저항을 거쳐 27 · 25 · 26번으로 가요.

          이번 코드는 S12 의 **불쾌지수 식**으로 `di` 를 계산해 화면 셋째 줄에 보여 주고, `if` · `elif` · `else` 로 네 단계 가운데 하나를 골라 색을 켜요. 공책에 적은 온도 · 습도로 불쾌지수를 손으로 계산해 화면 값과 비교해 봐요.
        todo:
          - RGB LED 와 저항 3개를 배선도대로 꽂기
          - "**실행** 누르고 화면 셋째 줄의 `DI:` 값과 LED 색 확인하기"
          - 입김을 불어 습도를 올리며 색이 바뀌는지 보기
        code: step2_discomfort_rgb.py
        expected: "코드를 실행하면 화면에 `T: 24C` · `H: 40%` · `DI: 70` 처럼 세 줄이 보이고, RGB LED 가 불쾌지수 단계 색으로 켜져요(68 미만 초록, 68~75 노랑, 75~80 주황, 80 이상 빨강). 입김을 불면 습도가 올라 색이 한 단계 바뀔 수 있어요."
        codeNotes:
          - { line: 9, note: "빨강 · 초록 · 파랑 다리를 27 · 25 · 26번 PWM 핀으로 준비해요 (9~14번 줄)" }
          - { line: 17, note: "`set_color(r, g, b)` 는 0~255 세 숫자로 색을 섞는 함수예요" }
          - { line: 27, note: "온도 `t` 와 습도 `h` 를 불쾌지수 식에 넣어 `di` 에 담아요" }
          - { line: 31, note: "`int(di)` 로 소수점을 버리고 글자로 바꿔 셋째 줄 (0, 48) 에 적어요" }
          - { line: 33, note: "가장 높은 단계부터 물어요. 80 이상이면 빨강" }
          - { line: 35, note: "앞 질문이 거짓이고 75 이상이면 주황" }
          - { line: 37, note: "앞 두 질문이 거짓이고 68 이상이면 노랑" }
          - { line: 39, note: "위 질문이 모두 거짓이면(68 미만) 초록" }
          - { line: 41, note: "2초마다 다시 재고 계산해요" }

      - id: readcheck2
        type: readcheck
        title: 읽기 체크 2
        minutes: 5
        scene:
          image: images/discomfort-scale.svg
          caption: 숫자를 if 줄에 위에서부터 넣어 보면 어느 색이 켜질지 알 수 있어요
        body: |
          `if` · `elif` · `else` 는 **위에서부터 차례로** 물어요. 참인 첫 갈래 하나만 실행하고 나머지는 건너뛰어요. 그래서 가장 높은 기준(80)부터 물어야 해요.

          불쾌지수를 하나 정해 `if` 줄부터 넣어 보며 문제를 풀어요. 계산이 필요한 문제는 공책에 식을 써요.
        todo:
