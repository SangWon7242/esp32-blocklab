        title: 미션 — 페이지와 JSON 을 함께 내는 상황판
        minutes: 10
        scene:
          image: images/page-vs-json.svg
          caption: 같은 보드가 / 에는 사람 페이지를, /data 에는 앱 데이터를 보내요. 페이지에는 밝기 값도 함께
        body: |
          1부 코드(페이지만 보내는 코드)에서 시작해요. 여기에 **앱이 읽을 주소** `/data` 를 더하고, 페이지 값 칸에 **밝기 값**도 함께 보이게 해요. 조도 센서 준비 블록을 넣고 핀을 34번으로 맞춰요.

          갈림길은 둘이에요. `/data` 면 JSON(temp, hum), 그 밖이면 페이지. 값 칸은 글 이어 붙이기라서 밝기 숫자는 **글자로** 바꿔 이어요. 새로고침은 2초 이상으로 두세요.
        todo:
          - 조도 센서 준비 블록을 34번 핀으로 더하기
          - "경로가 `/data` 면 JSON 응답(temp, hum), 아니면 페이지 응답이 되게 갈림길 만들기"
          - "페이지 값 칸 끝에 `,L: ` 과 밝기 값을 이어 붙이고 **판정** 누르기"
        instructions: "1부 코드에서 시작해요. (1) 조도 센서를 34번 핀에 준비하기 (2) 반복 안에서 요청마다 측정하기 (3) 경로가 /data 면 JSON 응답(temp: t, hum: h) (4) 그 밖이면 페이지 응답 — 값 칸은 \"T: \" + str(t) + \"C,H: \" + str(h) + \"%,L: \" + str(light.read()), 새로고침은 2초 이상"
        hint: |
          갈림길은 `if 경로가 "/data" 인가 … else …` 꼴이에요. JSON 응답 블록의 이름 칸에 temp, hum 을 쓰고 값 칸에 t, h 변수를 넣어요. 페이지 값 칸은 글 이어 붙이기 블록을 하나 더 겹쳐 `",L: "` 과 `글자로(밝기 값)` 을 더해요
        code: step1_web_page.py
        rules:
          - codeMatches: 'light = ADC\(Pin\(3[4-9]\)\)'
            fail: 조도 센서 준비 블록이 있나요? WiFi 를 켠 동안 아날로그 값을 읽을 수 있는 핀은 몇 번부터였나요?
          - codeMatches: '^\s+dht11\.measure\(\)$'
            fail: "'재 줘' 부탁(measure)은 어디에 있어야 요청마다 새 값이 나올까요? 반복 안을 다시 봐요"
          - codeMatches: '^\s+if path == "/data":$'
            fail: 앱이 읽을 주소는 무엇으로 약속했나요? 경로가 그것인지 묻는 블록이 if 에 들어 있나요?
          - codeMatches: 'web_send\(conn, "\{\\"temp\\": " \+ str\(.+\) \+ ", \\"hum\\": " \+ str\(.+\) \+ "\}", "application/json"\)'
            fail: /data 로 왔을 때 보내는 답은 페이지일까요, JSON 일까요? 이름 두 개(temp, hum)와 값(t, h)이 이 순서로 짝지어졌나요?
          - codeMatches: '^\s+else:\n\s+web_send\(conn, web_page\('
            fail: 그 밖의 경로에는 무엇으로 답해야 하나요? 한 요청에 응답은 하나라서 else 아래에만 두어야 해요
          - codeMatches: 'web_page\(".*", ".*", .+, ([2-9]|[1-9]\d)\)\)$'
            fail: 페이지가 2초마다 스스로 다시 읽히려면 페이지 응답 블록의 어느 칸을 봐야 할까요?
          - codeMatches: 'web_page\(.*,L: .*str\(light\.read\(\)\).*\)\)$'
            fail: 페이지 값 칸에 밝기 값이 들어 있나요? 쉼표로 줄을 나누고, 숫자는 글자로 바꿔 이어야 해요
