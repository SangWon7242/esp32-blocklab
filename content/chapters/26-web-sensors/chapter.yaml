          caption: 값이 이상하면 꽂은 줄과 핀 번호부터, 오류 글이 나오면 그 줄의 글과 숫자부터 봐요
        body: |
          고장 난 상황판 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 값이 안 움직이면 핀과 배선부터, 오류 글이 나오면 그 글이 가리키는 줄부터 봐요.

          검사 칸의 **주의 글**도 좋은 단서예요. 고치기 전에 한 번 읽어 보세요. 도우미 함수는 그대로 두고, 준비 줄과 `while True:` 아래 몇 줄만 고치면 돼요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 밝기 값이 0 이나 4095 에서 꿈쩍도 안 해요 (WiFi 를 켠 뒤부터)
            code: |
              from machine import Pin, ADC
              import time
              import dht
              import network
              import socket

              dht11 = dht.DHT11(Pin(13))
              light = ADC(Pin(25))
              light.atten(ADC.ATTN_11DB)
              light.width(ADC.WIDTH_12BIT)


              def wifi_connect(ssid, password):
                  wlan = network.WLAN(network.STA_IF)
                  wlan.active(True)
                  wlan.connect(ssid, password)
                  while not wlan.isconnected():
                      time.sleep(0.5)
                  print("IP:", wlan.ifconfig()[0])
                  return wlan.ifconfig()[0]


              def web_start(port):
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.bind(("", port))
                  s.listen(5)
                  return s


              def web_accept(s):
                  conn, addr = s.accept()
                  request = conn.recv(1024).decode()
                  line = request.split("\r\n")[0]
                  target = line.split(" ")[1] if " " in line else "/"
                  path, _, qs = target.partition("?")
                  query = {}
                  for part in qs.split("&"):
                      if "=" in part:
                          k, v = part.split("=", 1)
                          query[k] = v
                  return conn, path, query


              def web_send(conn, body, ctype="text/html"):
                  conn.send("HTTP/1.1 200 OK\r\n")
                  conn.send("Content-Type: " + ctype + "\r\n")
                  conn.send("Connection: close\r\n\r\n")
                  conn.sendall(body)
                  conn.close()


              def web_page(title, buttons, values, refresh):
                  html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width'>"
                  if refresh > 0:
                      html += "<meta http-equiv='refresh' content='" + str(refresh) + "'>"
                  html += "<title>" + title + "</title></head><body><h1>" + title + "</h1>"
                  for b in buttons.split(","):
                      if b:
                          html += "<p><a href='/cmd?" + b + "'><button>" + b + "</button></a></p>"
                  for v in values.split(","):
                      if v:
                          html += "<p>" + v + "</p>"
                  return html + "</body></html>"


              ip = wifi_connect("MyWiFi", "12345678")
              server = web_start(80)

              print(ip)
              while True:
                  conn, path, query = web_accept(server)
                  dht11.measure()
                  t = dht11.temperature()
                  h = dht11.humidity()
                  if path == "/data":
                      web_send(conn, "{\"temp\": " + str(t) + ", \"hum\": " + str(h) + "}", "application/json")
                  elif path == "/light":
                      web_send(conn, "{\"light\": " + str(light.read()) + "}", "application/json")
                  else:
                      web_send(conn, web_page("교실 상황판", "", "T: " + str(t) + "C,H: " + str(h) + "%", 2))
            question: WiFi 를 쓰지 않을 때는 잘 되던 센서예요. 검사 칸의 주의 글은 무엇을 알려 주나요? 조도 센서 S 선은 실제로 몇 번 핀에 꽂혀 있나요?
