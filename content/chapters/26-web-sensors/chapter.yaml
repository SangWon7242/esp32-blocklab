# 센서 트랙 S23 · 폰에서 보는 센서 값 — 원본: Keyestudio 2-2-07 Web Server(온습도 값 웹 페이지), 아두이노 심화 W02(센서 상황판), 보고서 3절 S23·9절(있는 앱 갈래 = 폰 브라우저 자동 새로고침, AI 앱 갈래는 F12 에서). 형식 설명은 src/track/README.md
id: 26-web-sensors
order: 26
track: sensor
label: S23
prerequisites: [25-web-led, 15-temp-humidity, 14-light-sensor]
subjects: [정보, 수학, 과학]
sessions: 2
teacherNotes: |
  **WiFi** 보드와 폰이 **같은 WiFi** 에 있어야 폰에서 보드 IP 가 열린다. 코드의 `MyWiFi` · `12345678` 은 교실 공유기 이름·비밀번호로 바꾼다(글 칸만 고치면 된다). 학교 WiFi 가 기기 사이 접속을 막으면(손님 격리) 폰 핫스팟을 켜고 보드와 노트북을 그 핫스팟에 붙이거나, S22 처럼 **공유기 모드** 블록(`wifi_ap`)으로 보드가 직접 WiFi 를 만들게 한다(그때 보드 IP 는 `192.168.4.1`). 비밀번호가 틀리면 `wifi_connect` 가 끝없이 기다리므로 **정지** 뒤 고치게 한다.

  **핀 번호** DHT11 S 는 13번, 조도 센서 S 는 **34번**. WiFi 를 켠 동안 ADC2 핀(0 · 2 · 4 · 12~15 · 25~27)은 아날로그 값을 읽지 못하므로 아날로그 센서는 32~39번만 쓴다(검사 `wifi-adc2` 가 주의를 띄움, 디버깅 증상 1). 36번도 된다.

  **JSON 보기** `/data` 를 폰 브라우저로 열면 `{"temp": 24, "hum": 40}` 글이 **그대로** 보인다. "앱이 읽는 데이터는 꾸밈이 없다"를 눈으로 확인하는 장면이다. 교과 융합 F12(센서 상황판, 앱 단계)에서 AI 가 만든 폰 앱이 바로 이 `/data` 를 2초마다 읽는다. 이 챕터의 "있는 앱" 갈래는 폰 브라우저의 자동 새로고침(`<meta http-equiv='refresh'>`)이다.

  **측정 간격** DHT11 은 1초보다 자주 `measure()` 하면 `OSError: [Errno 116] ETIMEDOUT` 이 난다. 요청마다 재므로 폰 하나가 2초마다 새로고침할 때는 괜찮지만, 여러 폰이 동시에 열거나 새로고침을 연타하면 오류가 날 수 있다. 그때는 새로고침을 3~5초로 늘리게 한다(판정은 2 이상이면 통과).

  **기준값** 설계의 `t > 28`(HOT)과 새로고침 2초는 **예시**다. 계절에 따라 "지금 온도 + 2" 로 바꿔 시험하게 한다. 손으로 센서를 감싸면 1~2℃, 입김을 불면 습도가 크게 오른다.

  - 1차시: 문제 만나기 ~ 읽기 체크 1 (측정 → 2초마다 새로고침되는 페이지)
  - 2차시: 실행 2 · 읽기 체크 2 (경로별 JSON) · 미션 · 디버깅 · 설계 · 성찰
  - 융합: 정보(요청과 응답, 주소 약속, 데이터 형식), 수학(값과 이름의 짝, 글 이어 붙이기), 과학(온도 · 습도 · 빛의 세기 측정)
title: 폰에서 보는 센서 값
subtitle: 사람이 보는 페이지와 앱이 읽는 JSON
summary: |
  교실에 둔 보드가 재는 온도 · 습도 · 밝기를 **집에서 폰으로** 볼 수 있을까요? WiFi 에 붙은 보드는 작은 **웹서버**가 되어, 폰이 주소를 치면 값을 보내 줘요.
  주소 끝이 `/` 이면 사람이 보는 **페이지**(2초마다 새로고침)를, `/data` 이면 앱이 읽는 **JSON** 데이터를 보내요. 같은 값을 두 가지 모습으로 내보내는 상황판을 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: WiFi 가 들어 있어요. 노트북과 USB 선으로 연결 }
  - { name: 온습도 센서(DHT11 모듈), note: "다리 3개: S(신호) · +(3.3V) · −(GND). S 는 13번" }
  - { name: 조도 센서(포토레지스터 모듈), note: "다리 3개: S(신호) · +(3.3V) · −(GND). S 는 34번" }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판 }
  - { name: 점퍼선(M-M), note: "10개 (센서 두 개 6, 3V3 · GND 를 + 줄 · − 줄에 2, 두 번째 − 줄 1, + 줄 둘 잇기 1)" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
  - { name: WiFi 공유기 또는 폰 핫스팟, note: 보드와 폰이 같은 WiFi 에 있어야 해요 }
  - { name: 스마트폰, note: 브라우저 주소창에 보드의 IP 주소를 쳐요 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "온습도 센서(DHT11)의 다리 셋은 e 줄 25·26·27번에(S · + · −): 13번 → 25번 줄(S), 26번 줄(+) → + 줄 → 3V3, 27번 줄(−) → − 줄 → GND. 조도 센서의 다리 셋은 f 줄 10·11·12번에(S · + · −): 34번 → 10번 줄(S), 11번 줄(+) → f 줄 쪽 + 줄, 12번 줄(−) → f 줄 쪽 − 줄 → GND. + 줄 둘은 빨간 선 하나로 이어요 (3V3 핀은 하나니까)"
principle:
  image: images/page-vs-json.svg
  body: |
    WiFi 에 붙은 보드는 **IP 주소**를 하나 받아요. 폰 브라우저에 그 주소를 치면 폰이 보드에게 **요청**을 보내고, 보드는 글로 **응답**해요. 보드가 손님(요청)을 기다리다 받아서 답하는 프로그램을 **웹서버**라고 해요.

    요청에는 **경로**가 들어 있어요. `192.168.0.23/data` 에서 `/data` 가 경로예요. 보드는 경로를 보고 무엇으로 답할지 골라요. 사람이 볼 `/` 에는 제목과 글자가 꾸며진 **HTML 페이지**를, 앱(프로그램)이 읽을 `/data` 에는 이름과 값만 있는 **JSON** `{"temp": 24, "hum": 40}` 을 보내요.

    - 페이지에 `<meta http-equiv='refresh' content='2'>` 가 들어 있으면 폰이 **2초마다** 같은 요청을 다시 보내요. 그래서 숫자가 스스로 바뀌어요
    - JSON 은 사람이 읽기엔 밋밋하지만, 프로그램은 `temp` 라는 이름으로 값을 바로 꺼내 쓸 수 있어요
    - **한 요청에 응답은 하나**예요. 응답을 보내면 연결이 닫히므로, 두 번 보내면 오류가 나요
goals:
  content: WiFi 에 연결한 보드를 웹서버로 만들어, 경로가 / 이면 센서 값이 든 페이지(2초마다 새로고침)로, /data 이면 JSON(temp, hum)으로 답하는 상황판을 만든다
  thinking: 같은 값을 '사람이 보는 모습'과 '앱이 읽는 모습'으로 나누어 생각하고, 요청 하나에 응답 하나를 고르는 갈림길(if · elif · else)로 설계한다
successCriteria:
  - 폰 브라우저에 보드 IP 를 쳐 온도 · 습도가 보이고, 2초마다 스스로 새로고침되게 할 수 있다
  - 주소 끝에 /data 를 치면 JSON 글이 그대로 보이는 까닭을 '페이지와 데이터의 차이'로 설명할 수 있다
  - 경로에 따라 JSON 또는 페이지 가운데 하나로만 답하는 코드를 만들 수 있다
  - WiFi 를 켠 동안 아날로그 센서를 32~39번 핀에 꽂아야 하는 까닭을 말할 수 있다
parts:
  - id: part1
    title: 1부 · 폰으로 보는 교실 상황판
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 교실 온도를 집에서 볼 수 있을까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 교실의 보드가 WiFi 로 값을 내보내고, 집에 있는 폰 화면에 교실 상황판이 보여요
        body: |
          지난 시간에는 폰으로 보드의 LED 를 켜고 껐어요. 이번에는 거꾸로, 보드가 재는 **온도 · 습도 · 밝기**를 폰으로 **보고** 싶어요. 교실에 보드를 두고 집에서 폰을 꺼내면 지금 교실이 몇 도인지 알 수 있을까요?

          그리고 폰 화면에 보이는 **페이지**와, 앱(프로그램)이 읽는 **데이터**는 같은 것일까요, 다른 것일까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, DHT11 모듈, 조도 센서 모듈, 브레드보드, 점퍼선, USB 선, 폰)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 교실에 둔 보드가 재는 온도를 집에서 폰으로 보려면 무엇이 필요할까요? 폰과 보드는 어떻게 만날까요?
          - 사람이 보는 페이지와 앱(프로그램)이 읽는 데이터는 어떻게 다를까요? 왜 따로 둘까요?
          - 폰 화면의 숫자가 2초마다 스스로 바뀌게 하려면 폰과 보드 가운데 누가 무엇을 되풀이해야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "폰으로 센서 값 보기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 손님(요청)이 올 때까지 기다리다가, 오면 **센서를 재고**, 요청의 **경로**를 보고 답을 골라 보내요.

          이번에는 **주소 약속**이 하나 더 있어요. 사람이 볼 주소와 앱이 읽을 주소를 어떻게 나눌지, JSON 의 이름은 무엇으로 할지 정해야 해요. 활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요.
        todo:
          - "**알아야 할 것**: 핀 번호, WiFi 이름과 비밀번호, 값이 어디서 오는지 적기"
          - "**정해야 할 것**: 주소 약속(/ 와 /data), 새로고침 간격, JSON 이름 적기"
          - "**해야 할 것**: 보드가 되풀이하는 일을 순서대로 적기"
        answer:
          know: ["온습도 센서 S 는 13번, 조도 센서 S 는 34번 (WiFi 와 함께 쓸 수 있는 핀)", "WiFi 이름과 비밀번호", "온도(℃) · 습도(%) · 밝기(0~4095)가 어느 센서에서 오는지"]
          decide: ["주소 약속: / 는 사람 페이지, /data 는 앱이 읽는 JSON", "페이지를 몇 초마다 새로고침할지 (2초)", "JSON 의 이름 (temp, hum)"]
          act: ["요청이 올 때까지 기다리다 받기", "받자마자 온도 · 습도 재기", "경로를 보고 JSON 또는 페이지 하나로 답하기", "이것을 끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 폰이 주소를 치면?
        minutes: 4
        scene:
          image: images/request-response.svg
          caption: 1 폰이 요청 → 2 보드가 받고 측정 → 3 경로를 보고 답 하나 → 4 폰이 보여 줘요. 페이지는 2초마다 다시 1 부터
        body: |
          활동 칸의 코드는 WiFi 에 연결하고 웹서버를 열어, 요청이 오면 온습도를 재서 **페이지**로 답해요. 코드 끝의 `while True:` 다섯 줄만 보면 흐름이 보여요. 아직 실행하지 않아요.

          `def` 로 시작하는 함수들은 준비 블록이 만들어 준 도우미예요. 읽지 않아도 돼요. 폰 브라우저에 보드 주소를 치면 무엇이 보일지, 가만히 두면 숫자가 바뀔지 **내 예측을 먼저** 적어요.
        todo:
          - "`while True:` 아래 다섯 줄을 위에서부터 소리 내어 읽기"
          - 페이지로 답하는 줄에서 제목 · 값 · 새로고침 숫자 찾기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_web_page.py
        blanks:
          - q: 실행하면 출력 칸에 먼저 무엇이 나올까요?
          - q: 폰 브라우저에 그 주소를 치면 화면에 무엇이 보일까요?
          - q: 폰을 가만히 두면 화면의 숫자는 바뀔까요, 그대로일까요? 바뀐다면 몇 초마다일까요?

      - id: run
        type: run
        title: 복사 · 실행 — 2초마다 새로고침되는 상황판
        minutes: 9
        scene:
          image: images/wiring-breadboard.svg
          caption: "DHT11 은 e 줄 25·26·27번(S ← 13번), 조도 센서는 f 줄 10·11·12번(S ← 34번). + 줄 둘은 빨간 선으로 이어요"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**대로 두 센서를 꽂아요. 조도 센서는 이번 실행에서 아직 안 쓰지만 2부에서 바로 쓰니 지금 함께 꽂아 두어요. 코드의 `MyWiFi` 와 `12345678` 을 선생님이 알려 준 WiFi 이름과 비밀번호로 **글 칸만** 바꿔요.

          실행하면 출력 칸에 `IP: 192.168.x.x` 가 나와요. 그 주소를 **같은 WiFi 에 붙은 폰**의 브라우저 주소창에 쳐요. 화면이 열리면 센서를 손으로 감싸고 2초만 기다려 봐요.
        todo:
          - "**부품과 배선**대로 DHT11(13번)과 조도 센서(34번) 꽂기"
          - WiFi 이름 · 비밀번호 글 칸을 우리 교실 것으로 바꾸고 **보드 연결** → **실행**
          - 출력 칸의 IP 주소를 폰 브라우저에 치고, 센서를 감싸며 숫자가 바뀌는지 보기
        code: step1_web_page.py
        expected: |
          출력 칸에 `IP: 192.168.x.x` 가 나와요. 폰 브라우저에 그 주소를 치면 **교실 상황판** 제목과 `T: 24C`, `H: 40%` 같은 두 줄이 보이고, 2초마다 스스로 새로고침돼요. 센서를 손으로 감싸면 다음 새로고침 때 온도 · 습도가 올라가요.
        codeNotes:
          - { line: 7, note: "13번 핀의 온습도 센서를 준비하고 이름을 `dht11` 로 붙여요" }
          - { line: 10, note: "WiFi 연결 도우미. 연결될 때까지 기다리다 받은 IP 주소를 돌려줘요 (준비 블록이 만들어요)" }
          - { line: 20, note: "웹서버 도우미. 포트로 들어오는 요청을 기다릴 소켓을 열어요" }
          - { line: 27, note: "요청 받기 도우미. 주소에서 경로(`path`)와 물음표 뒤 질의(`query`)를 꺼내요" }
          - { line: 41, note: "응답 도우미. 글을 보내고 연결을 **닫아요** (그래서 한 요청에 응답은 하나)" }
          - { line: 49, note: "페이지 도우미. 제목 · 버튼 · 값 · 새로고침으로 HTML 글을 만들어요" }
          - { line: 63, note: "WiFi `MyWiFi` 에 연결하고 IP 주소를 `ip` 에 담아요. 이 두 글 칸을 우리 교실 것으로 바꿔요" }
          - { line: 64, note: "포트 **80** 으로 웹서버를 시작해요. 브라우저는 포트를 안 써도 80 으로 찾아와요" }
