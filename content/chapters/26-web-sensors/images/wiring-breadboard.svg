<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ws-wiring-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ws-wiring-title">브레드보드 배선도: 온습도 센서(DHT11) 모듈의 다리 셋(S · + · −)을 e 줄 25·26·27번에 꽂는다. ESP32 13번 초록 선 → 25번 줄(S), 26번 줄(+) → 빨간 선으로 + 줄 → ESP32 3V3, 27번 줄(−) → 검은 선으로 − 줄 → ESP32 GND. 조도 센서 모듈의 다리 셋은 f 줄 10·11·12번에 꽂는다. ESP32 34번 파란 선 → 10번 줄(S), 11번 줄(+) → 빨간 선으로 f 줄 쪽 + 줄, 12번 줄(−) → 검은 선으로 f 줄 쪽 − 줄 → ESP32 GND. + 줄 둘은 빨간 선 하나로 잇는다</title>
