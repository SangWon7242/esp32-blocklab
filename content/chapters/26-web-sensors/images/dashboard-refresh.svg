<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ws-dash-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ws-dash-title">폰 화면 세 장이 시간 순서로 놓여 있다. 0초: T: 24C, H: 40%. 2초 뒤 센서를 손으로 감싸자 T: 25C, H: 47%. 4초 뒤 입김을 불자 T: 26C, H: 71%. 페이지가 2초마다 스스로 새로고침되어 값이 바뀐다. 아래에는 주소창에 /data 를 치면 {"temp": 26, "hum": 71} 글이 그대로 보인다는 설명</title>
  <!-- 시간 축 -->
  <path d="M60 232 H580" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M572 226 L580 232 L572 238" stroke-width="1.5" stroke-opacity="0.6"/>
  <g font-size="12" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="130" y="252">0초</text>
    <text x="320" y="252">2초 뒤 (손으로 감싸기)</text>
    <text x="510" y="252">4초 뒤 (입김 불기)</text>
  </g>
  <path d="M130 226 V238 M320 226 V238 M510 226 V238" stroke-width="1.5"/>
  <!-- 폰 1 -->
  <rect x="84" y="76" width="92" height="134" rx="12" fill="var(--card)" stroke-width="2.2"/>
  <rect x="94" y="88" width="72" height="110" rx="5" fill="#0f7c8c" fill-opacity="0.08" stroke-width="1.2"/>
  <text x="130" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none">교실 상황판</text>
  <text x="130" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#e03131" stroke="none">T: 24C</text>
  <text x="130" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#1c7ed6" stroke="none">H: 40%</text>
  <!-- 새로고침 화살 -->
  <path d="M184 138 H266" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M258 132 L266 138 L258 144" stroke-width="2"/>
  <text x="225" y="128" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">새로고침</text>
  <!-- 폰 2 -->
  <rect x="274" y="76" width="92" height="134" rx="12" fill="var(--card)" stroke-width="2.2"/>
  <rect x="284" y="88" width="72" height="110" rx="5" fill="#0f7c8c" fill-opacity="0.08" stroke-width="1.2"/>
  <text x="320" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none">교실 상황판</text>
  <text x="320" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#e03131" stroke="none">T: 25C</text>
  <text x="320" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#1c7ed6" stroke="none">H: 47%</text>
  <path d="M374 138 H456" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M448 132 L456 138 L448 144" stroke-width="2"/>
  <text x="415" y="128" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7" stroke="none">새로고침</text>
  <!-- 폰 3 -->
  <rect x="464" y="76" width="92" height="134" rx="12" fill="var(--card)" stroke-width="2.2"/>
  <rect x="474" y="88" width="72" height="110" rx="5" fill="#0f7c8c" fill-opacity="0.08" stroke-width="1.2"/>
  <text x="510" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none">교실 상황판</text>
  <text x="510" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#e03131" stroke="none">T: 26C</text>
  <text x="510" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#1c7ed6" stroke="none">H: 71%</text>
  <!-- 설명 -->
  <text x="320" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">페이지가 2초마다 스스로 새로고침돼요</text>
  <rect x="80" y="276" width="480" height="60" rx="12" fill="var(--card)" stroke="#f4af18" stroke-width="1.5"/>
  <text x="320" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">주소 끝에 /data 를 치면 꾸밈 없는 글이 그대로 보여요</text>
  <text x="320" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#b07a00" stroke="none">{"temp": 26, "hum": 71}</text>
</svg>
