<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="od-tag-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="od-tag-title">이름표 화면: 화면 가장자리를 따라 네모 테두리가 있고, 안쪽에 글 두 줄(HELLO, I AM / MINJI)과 숫자가 있다. 숫자는 0, 1, 2, 3 처럼 1초마다 1씩 커진다. 한 바퀴마다 지우기 → 테두리 · 글 · 숫자 적기 → 내보내기 → 숫자에 1 더하기 → 1초 기다리기 를 되풀이한다</title>
  <defs><marker id="od-tag-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs>
  <!-- 화면 -->
  <rect x="24" y="40" width="292" height="164" rx="10" fill="#1d4ed8"/>
  <rect x="38" y="52" width="264" height="132" rx="2" fill="#0b1b4d" stroke="none"/>
  <rect x="42" y="56" width="256" height="124" stroke="#7dd3fc" stroke-width="3"/>
  <g fill="#7dd3fc" stroke="none" font-weight="700" font-size="16">
    <text x="60" y="92" textLength="176" lengthAdjust="spacingAndGlyphs">HELLO, I AM</text>
    <text x="60" y="124" textLength="80" lengthAdjust="spacingAndGlyphs">MINJI</text>
    <text x="60" y="160" font-size="18">3</text>
  </g>
  <text x="170" y="228" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">테두리 안에 글 두 줄 + 커지는 숫자</text>
  <!-- 숫자 띠 -->
  <g font-size="14" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">
    <text x="60" y="290">0</text><text x="120" y="290">1</text><text x="180" y="290">2</text><text x="240" y="290">3</text><text x="300" y="290">…</text>
  </g>
  <path d="M70 285 H106" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M130 285 H166" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M190 285 H226" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M250 285 H286" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <text x="170" y="318" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">1초마다 1씩 커져요</text>
  <!-- 한 바퀴 -->
  <text x="476" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">한 바퀴에 하는 일</text>
  <g stroke-width="1.5">
    <rect x="380" y="80" width="192" height="34" rx="8" fill="var(--card)"/>
    <rect x="380" y="128" width="192" height="34" rx="8" fill="var(--card)"/>
    <rect x="380" y="176" width="192" height="34" rx="8" fill="var(--card)"/>
    <rect x="380" y="224" width="192" height="34" rx="8" fill="var(--card)"/>
    <rect x="380" y="272" width="192" height="34" rx="8" fill="var(--card)"/>
  </g>
  <g font-size="14" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="476" y="102">1 지우기</text>
    <text x="476" y="150">2 테두리 · 글 · 숫자 적기</text>
    <text x="476" y="198">3 내보내기</text>
    <text x="476" y="246">4 숫자에 1 더하기</text>
    <text x="476" y="294">5 1초 기다리기</text>
  </g>
  <path d="M476 114 V126" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M476 162 V174" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M476 210 V222" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M476 258 V270" stroke-width="2" marker-end="url(#od-tag-arrow)"/>
  <path d="M572 289 H604 V97 H578" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#od-tag-arrow)"/>
  <text x="476" y="336" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">5 다음에는 다시 1 로</text>
</svg>
