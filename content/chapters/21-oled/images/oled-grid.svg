<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="od-grid-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="od-grid-title">OLED 화면 좌표: 가로 128칸(x 0~127), 세로 64칸(y 0~63)이고 (0, 0)은 화면 맨 위 구석이다. x 는 화살표 쪽으로 갈수록, y 는 아래로 갈수록 커진다. 칸 하나는 점 8×8 이라 글자는 한 줄에 16자, 8줄까지 들어간다. 예: 글자 Door 를 (8, 8)에, 네모를 (8, 28)에서 가로 48·세로 24로, 선을 (64, 56)에서 (120, 28)까지 그린 모습</title>
  <defs><marker id="od-grid-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs>
  <rect x="78" y="52" width="429.6" height="224.8" rx="8" fill="var(--card)"/>
  <rect x="88" y="62" width="409.6" height="204.8" fill="#0b1b4d" stroke="none"/>
  <path d="M113.6 62 V266.8 M139.2 62 V266.8 M164.8 62 V266.8 M190.4 62 V266.8 M216.0 62 V266.8 M241.6 62 V266.8 M267.2 62 V266.8 M292.8 62 V266.8 M318.4 62 V266.8 M344.0 62 V266.8 M369.6 62 V266.8 M395.2 62 V266.8 M420.8 62 V266.8 M446.4 62 V266.8 M472.0 62 V266.8 M88 87.6 H497.6 M88 113.2 H497.6 M88 138.8 H497.6 M88 164.4 H497.6 M88 190.0 H497.6 M88 215.6 H497.6 M88 241.2 H497.6" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="1"/>
  <text x="113.6" y="110.0" font-size="27" font-weight="700" fill="#7dd3fc" stroke="none" textLength="102.4" lengthAdjust="spacingAndGlyphs">Door</text>
  <rect x="113.6" y="151.6" width="153.60000000000002" height="76.80000000000001" stroke="#7dd3fc" stroke-width="3.5"/>
  <path d="M292.8 241.2 L472.0 151.6" stroke="#7dd3fc" stroke-width="3.5"/>
  <circle cx="113.6" cy="87.6" r="4.5" fill="#ffd43b" stroke="none"/>
  <circle cx="113.6" cy="151.6" r="4.5" fill="#ffd43b" stroke="none"/>
  <circle cx="292.8" cy="241.2" r="4.5" fill="#ffd43b" stroke="none"/>
  <circle cx="472.0" cy="151.6" r="4.5" fill="#ffd43b" stroke="none"/>
  <circle cx="234.0" cy="100.4" r="10" fill="#ffd43b" stroke="none"/><text x="234.0" y="104.9" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b4d" stroke="none">1</text>
  <circle cx="283.20000000000005" cy="190.0" r="10" fill="#ffd43b" stroke="none"/><text x="283.20000000000005" y="194.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b4d" stroke="none">2</text>
  <circle cx="468.0" cy="175.6" r="10" fill="#ffd43b" stroke="none"/><text x="468.0" y="180.1" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b4d" stroke="none">3</text>
  <path d="M88 40 H497.6" marker-end="url(#od-grid-arrow)"/>
  <text x="292.8" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">x: 0 → 127 (가로 128칸)</text>
  <path d="M64 62 V266.8" marker-end="url(#od-grid-arrow)"/>
  <text transform="translate(42 164.4) rotate(90)" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">y: 0 → 63 (세로 64칸)</text>
  <text x="80" y="34" text-anchor="end" font-size="13" font-weight="700" fill="currentColor" stroke="none">(0, 0)</text>
  <g fill="currentColor" stroke="none" font-size="12.5">
  <text x="517.6" y="74" font-weight="700" font-size="14">1 글자</text>
  <text x="517.6" y="92">(8, 8) 에서 시작</text>
  <text x="517.6" y="120" font-weight="700" font-size="14">2 네모</text>
  <text x="517.6" y="138">(8, 28) 에서</text>
  <text x="517.6" y="154">가로 48 · 세로 24</text>
  <text x="517.6" y="182" font-weight="700" font-size="14">3 선</text>
  <text x="517.6" y="200">(64, 56) 에서</text>
  <text x="517.6" y="216">(120, 28) 까지</text>
  <text x="517.6" y="244" font-weight="700" font-size="14">노랑 점</text>
  <text x="517.6" y="262">(x, y) 자리</text>
  </g>
  <text x="292.8" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">칸 하나 = 점 8×8. 글자 한 자도 점 8×8 크기예요</text>
  <text x="292.8" y="324" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">그래서 한 줄에 16자(128 ÷ 8), 위아래로 8줄(64 ÷ 8)까지 들어가요</text>
</svg>
