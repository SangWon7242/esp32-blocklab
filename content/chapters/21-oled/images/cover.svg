<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="od-cover-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="od-cover-title">OLED 화면 표지: ESP32 보드에서 나온 SCL · SDA 두 선이 작은 OLED 화면으로 이어진다. 화면에는 가로 128 · 세로 64 점으로 Hello 글자와 선 · 네모로 그린 작은 집이 보인다</title>
  <!-- ESP32 -->
  <rect x="32" y="110" width="132" height="168" rx="10" fill="var(--card)"/>
  <rect x="58" y="150" width="80" height="62" rx="4" fill="var(--muted)"/>
  <path d="M64 166 h10 v-6 h10 v6 h10 v-6 h10 v6 h10" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="98" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">ESP32</text>
  <rect x="81" y="270" width="34" height="16" rx="3" fill="var(--muted)"/>
  <!-- 두 선 -->
  <path d="M164 170 C214 170 214 150 262 150" stroke="#1971c2" stroke-width="5"/>
  <path d="M164 214 C224 214 224 190 262 190" stroke="#7048e8" stroke-width="5"/>
  <g font-size="13" font-weight="700" stroke="none">
    <text x="176" y="156" fill="#1971c2">SCL</text>
    <text x="176" y="238" fill="#7048e8">SDA</text>
  </g>
  <!-- OLED 모듈 -->
  <rect x="262" y="64" width="346" height="232" rx="12" fill="#1d4ed8"/>
  <circle cx="280" cy="82" r="6" fill="var(--card)"/><circle cx="590" cy="82" r="6" fill="var(--card)"/>
  <circle cx="280" cy="278" r="6" fill="var(--card)"/><circle cx="590" cy="278" r="6" fill="var(--card)"/>
  <rect x="300" y="96" width="270" height="168" rx="4" fill="#0b1b4d" stroke="none"/>
  <g fill="#7dd3fc" stroke="none" font-weight="700">
    <text x="318" y="132" font-size="22" textLength="120" lengthAdjust="spacingAndGlyphs">Hello!</text>
    <text x="318" y="164" font-size="14" textLength="120" lengthAdjust="spacingAndGlyphs">128 x 64 dots</text>
  </g>
  <!-- 픽셀 집 -->
  <g stroke="#7dd3fc" stroke-width="3">
    <path d="M462 176 L506 140 L550 176"/>
    <rect x="470" y="176" width="72" height="72"/>
    <rect x="482" y="190" width="16" height="16"/>
  </g>
  <rect x="514" y="214" width="18" height="34" fill="#7dd3fc" stroke="none"/>
  <path d="M318 236 H440" stroke="#7dd3fc" stroke-width="3"/>
  <!-- 점 확대 -->
  <g stroke="none" fill="currentColor" opacity="0.75" font-size="13">
    <text x="435" y="320" text-anchor="middle">글자도 그림도 모두 작은 점 8192개(128 × 64)로 그려요</text>
  </g>
</svg>
