      - id: mission
        type: mission
        title: 미션 — 숫자가 커지는 이름표
        minutes: 6
        scene:
          image: images/name-tag.svg
          caption: 테두리 안에 글 두 줄, 그 아래 숫자가 1초마다 1씩 커져요. 한 바퀴마다 지우기 → 적기 → 내보내기
        body: |
          화면을 이름표로 만들어 봐요. 테두리 안에 글 두 줄을 적고, 그 아래 숫자가 **1초마다 1씩 커지게** 해요. 숫자가 바뀌려면 화면을 **되풀이해서 다시 그려야** 해요.

          한 바퀴마다 무엇을 먼저 해야 앞의 숫자가 남지 않을까요? 그림의 다섯 칸 순서를 보고 블록을 쌓아요. 숫자 `count` 를 글자로 적으려면 `str(count)` 로 바꿔야 해요.
        todo:
          - 숫자를 담을 `count` 를 0 으로 정하고, 그 아래에 끝없이 되풀이하기 넣기
          - 되풀이 안에 지우기 → 테두리 · 글 두 줄 · 숫자 적기 → 내보내기 → 1 더하기 → 1초 기다리기
          - 실행해서 숫자가 겹치지 않고 커지는지 보고 **판정** 누르기
        instructions: "화면을 숫자가 커지는 이름표로 만드세요. 준비 줄 아래에 count = 0, 그 아래 끝없이 되풀이하기. 되풀이 안 순서: 화면 지우기 → 테두리 네모 oled.rect(0, 0, 128, 64, 1) → (8, 10) 에 \"HELLO, I AM\" → (8, 26) 에 \"MINJI\" → (8, 44) 에 str(count) → 내보내기 → count 에 1 더하기(count = count + 1) → 1초 기다리기. 판정을 받은 뒤 MINJI 를 내 영어 이름으로 바꿔 보세요"
        hint: "되풀이 안 맨 처음이 `oled.fill(0)` 이어야 앞 숫자가 지워져요. 숫자는 `oled.text(str(count), 8, 44)` 처럼 글자로 바꿔 적고, 1초 기다리기를 쓰려면 맨 위에 `import time` 이 있어야 해요"
        code: step1_oled_text.py
        rules:
          - codeMatches: '^while True:'
            fail: 숫자가 1초마다 바뀌려면 화면을 몇 번 다시 그려야 할까요? 끝없이 되풀이하는 블록이 있나요?
          - codeMatches: '^\s+oled\.fill\(0\)$'
            fail: 숫자가 바뀔 때 앞 숫자는 어떻게 되나요? 되풀이 안에서 새로 적기 전에 할 일이 있나요?
          - codeMatches: 'str\(count\)'
            fail: 숫자 count 를 화면에 글자로 적으려면 무엇으로 바꿔야 할까요?
          - codeMatches: 'oled\.rect\(0, 0, 128, 64, 1\)'
            fail: 이름표 테두리가 화면 가장자리를 따라 그려지나요? 시작 자리와 가로 · 세로 길이를 화면 크기와 비교해 보세요
          - codeMatches: '^import time$'
            fail: 1초 기다리기가 쓰는 기능은 어디에서 가져오나요? 맨 위 import 줄들을 다시 보세요
          - codeMatches: '^count\s*=\s*0$'
            fail: 숫자 count 는 어디에서 0 으로 시작하나요? 되풀이 안에서 0 으로 되돌아가면 숫자가 커질 수 있을까요?
          - codeMatches: '^\s+oled\.fill\(0\)\n\s+oled\.rect\(0, 0, 128, 64, 1\)'
            fail: 되풀이 안에서 맨 먼저 할 일은 무엇인가요? 그 바로 다음에 테두리를 그리나요?
          - codeMatches: '^(?=[\s\S]*oled\.text\("HELLO, I AM",\s*8,\s*10\))(?=[\s\S]*oled\.text\("MINJI",\s*8,\s*26\))(?=[\s\S]*oled\.text\(str\(count\),\s*8,\s*44\))'
            fail: 글 두 줄과 숫자의 글자 · (x, y) 자리가 지시와 같은가요? 쉼표 뒤 숫자 둘을 지시와 하나씩 맞춰 보세요
          - codeMatches: '^\s+oled\.show\(\)\n\s+count\s*(=\s*count\s*\+\s*1|\+=\s*1)\n\s+time\.sleep\(1\)$'
            fail: 내보내기 뒤에 무엇을 하고, 그다음에 얼마나 기다리나요? 세 줄의 순서와 들여쓰기를 지시와 맞춰 보세요
        answerCode: mission_name_tag.py

      - id: debug
        type: debug
        title: 디버깅 — 화면이 이상해요
        minutes: 5
        scene:
          image: images/oled-buffer.svg
          caption: 지우기 → 적어 두기 → 내보내기 세 단계 가운데 무엇이 빠졌거나 넘쳤는지 찾아요
        body: |
          고장 난 화면 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 화면이 까말 때는 전원 선(VCC · GND)부터 보고, 전원이 맞으면 지우기 → 적기 → 내보내기 순서를 봐요.

          글이 잘릴 때는 계산이 필요해요. 화면 가로는 128 점, 글자 한 자는 8 점이에요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 글을 적었는데 화면이 까만 채로예요. 빨간 글씨도 안 떠요
            code: |
              from machine import Pin, SoftI2C
              import ssd1306

              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              oled.fill(0)
              oled.text("Hello, ESP32!", 0, 0)
              oled.text("Sensor Track", 0, 20)
              oled.text("Ready", 0, 40)
            question: 전원 선은 맞게 꽂았는데도 까맣다면, 적어 둔 글자를 화면으로 "내보내는" 줄이 있나요? oled.text 는 무엇을 하는 줄이었나요?
            rules:
              - codeMatches: 'oled\.text\("Ready", 0, 40\)\noled\.show\(\)'
                fail: 다 적은 뒤에 화면에 나타나게 하는 줄이 있나요? 그 줄은 적는 줄들보다 앞일까요, 뒤일까요?
          - title: 숫자가 커질수록 글자가 겹쳐서 뭉개져요
            code: |
              from machine import Pin, SoftI2C
              import ssd1306
              import time

              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              count = 0
              while True:
                  oled.text(str(count), 0, 0)
                  oled.show()
                  count = count + 1
                  time.sleep(1)
            question: 같은 자리에 1 을 적고, 그 위에 다시 2 를 적으면 1 의 점들은 어떻게 될까요? 새 숫자를 적기 전에 해야 할 일은 무엇일까요?
            rules:
              - codeMatches: '^\s+oled\.fill\(0\)$'
                fail: 되풀이 안에서 앞 숫자를 지우는 줄이 있나요? 지우기는 되풀이 밖에 한 번이면 될까요?
          - title: 첫 줄 글이 끝에서 잘리고, OK 는 아예 안 보여요
            code: |
              from machine import Pin, SoftI2C
              import ssd1306

              i2c = SoftI2C(scl=Pin(22), sda=Pin(21))
              oled = ssd1306.SSD1306_I2C(128, 64, i2c)

              oled.fill(0)
              oled.text("Room temperature: 25", 0, 0)
              oled.text("OK", 140, 30)
              oled.show()
            question: 화면 한 줄에는 글자가 몇 자까지 들어갈까요(128 ÷ 8)? 첫 줄은 몇 자인가요? OK 의 x 140 은 화면 가로 128 점 안에 있나요?
            rules:
              - codeMatches: '(?<![\s\S])(?![\s\S]*oled\.text\("[^"]{17,}")'
                fail: 한 줄에 글자가 몇 자까지 들어갈까요? 128 ÷ 8 을 계산해 보고, 넘치는 글은 줄이거나 두 줄로 나눠 보세요
              - codeMatches: 'oled\.text\("[^"]*25[^"]*", \d+, \d+\)'
                fail: 온도 숫자 25 도 화면에 남아 있나요?
              - codeMatches: 'oled\.text\("OK", (\d|\d\d|10\d|11[0-2]), 30\)'
                fail: OK 두 자(점 16개)가 다 보이려면 x 는 얼마까지 될 수 있을까요? 128 에서 16 을 빼 보세요

      - id: design
