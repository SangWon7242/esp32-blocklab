# 센서 트랙 S18 · OLED 화면 — 원본: 09-oled-access 1부(step1_oled_text · step2_oled_shapes)를 센서 트랙 챕터로 뗌, Keyestudio KS5020 OLED(I2C 두 선 · 128×64 점 · 글자 8×8). 형식 설명은 src/track/README.md
# 09(F2)·10(F3) 이 이 챕터를 먼저 할 챕터로 가리킨다. 09 폴더는 그대로 둔다
id: 21-oled
order: 21
track: sensor
label: S18
prerequisites: [01-led]
subjects: [수학, 미술, 국어]
sessions: 1
teacherNotes: |
  **배선** OLED 는 GND · VCC · SCL · SDA 네 핀이에요. 브레드보드 없이 F-F 듀폰선 4가닥으로 보드에 바로 이어요. ESP32 Plus 확장 보드는 I2C 묶음 첫 줄(GND · 5V · SDA · SCL), 기본 보드(DevKit)는 3V3 · GND · D21 · D22 예요. 이 모듈은 3.3~5V 를 모두 받아요. 핀 순서가 VCC · GND 로 바뀐 모듈도 있으니 모듈에 적힌 글자를 꼭 읽게 하세요.

  **라이브러리** `import ssd1306` 은 보드에 `ssd1306.py` 가 있어야 해요. 블록랩이 **보드에 저장**·**실행** 때 import 줄을 보고 함께 올려 줘요. 화면 주소는 보통 `0x3C` 예요(09장에서 RFID 와 나눠 쓸 때 다시 나와요).

  **글꼴** 내장 글꼴은 **영어 · 숫자 · 기호만** 있어요. 한글을 넣으면 빈칸이나 깨진 점으로 보여요. 미션의 이름도 영어로 쓰게 하세요.

  **숫자는 예시** 글 자리 (0, 0) · (0, 20) · (0, 40), 도형 크기, 이름표의 (8, 10) · (8, 26) · (8, 44), 집 그림 좌표는 모두 예시 값이에요. 미션 판정은 글 세 줄의 글자와 (x, y) 숫자가 지시 그대로여야 통과하므로, 판정을 받은 뒤 **자기 이름(영어)** 과 자리로 바꿔 보게 하세요.

  - 1차시: 문제 만나기 ~ 미션(45분). 시간이 모자라면 디버깅 증상 3 과 설계를 다음 시간 시작 활동으로 써요
  - 막히는 곳: `oled.show()` 를 빠뜨려 화면이 까만 경우가 가장 많아요(디버깅 증상 1). 그다음이 되풀이 안에서 지우기를 빠뜨려 숫자가 겹치는 경우예요(증상 2)
  - 융합: 수학(좌표 · 픽셀 수 128 × 64 = 8192, 한 줄 16자 = 128 ÷ 8), 미술(픽셀 아트 · 선과 네모로 그리기), 국어(짧고 분명한 안내문 쓰기 — 화면 한 줄 16자 안에)
title: OLED 화면
subtitle: 점 128 × 64 개로 글과 그림 그리기
summary: |
  지금까지 보드는 LED 불빛이나 소리로만 말했어요. 오늘은 손바닥보다 작은 **OLED 화면**을 달아 보드가 **글자와 그림**으로 말하게 해요.
  화면은 가로 128 · 세로 64 개의 점이에요. **(x, y) 좌표**로 글 세 줄을 적고, 선과 네모를 그려 본 뒤, 1초마다 숫자가 커지는 **이름표 화면**을 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: OLED 화면 (128×64), note: "I2C 방식. 핀 4개: GND · VCC · SCL · SDA (모듈에 적힌 글자를 읽기)" }
  - { name: F-F 듀폰선 4가닥, note: "양쪽 끝이 구멍인 선. OLED 핀과 보드 핀에 바로 씌워요. 브레드보드는 안 써요" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "브레드보드 없이 보드에 바로 꽂아요. OLED GND · VCC · SDA · SCL → 보드 I2C 묶음 첫 줄의 GND · 5V · SDA(21) · SCL(22)"
  captionDevkit: "브레드보드 없이 보드 아래 줄에 바로 꽂아요. OLED VCC → 3V3 · GND → GND · SDA → D21 · SCL → D22"
principle:
  image: images/oled-grid.svg
  body: |
    OLED 화면은 가로 **128개** · 세로 **64개**의 아주 작은 점이 **스스로 빛을 내는** 화면이에요. 점 하나하나를 켜고 꺼서 글자와 그림을 만들어요. 뒤에서 비추는 불이 없어서 끈 점은 완전히 까맣게 보여요.

    - 자리는 **(x, y)** 로 말해요. (0, 0)은 화면 맨 위 구석이고, x 는 가로로, **y 는 아래로 갈수록** 커져요 (x 0~127, y 0~63)
    - 글자 한 자는 점 **8 × 8** 이에요. 그래서 한 줄에 **16자**(128 ÷ 8), 위아래로 8줄까지 들어가요
    - 화면 안의 칩은 보드와 **SCL · SDA 두 선(I2C)** 으로 이야기해요. 이 챕터에서는 SCL 22번, SDA 21번이에요
    - `oled.text` · `oled.rect` 는 보드 안 그림판에 **적어 두기**만 해요. `oled.show()` 를 불러야 한꺼번에 화면으로 **내보내요**
goals:
  content: OLED 화면에 (x, y) 좌표로 글자와 선 · 네모를 그리고, 지우기 → 적기 → 내보내기 순서로 바뀌는 숫자를 화면에 보여 준다
  thinking: 화면을 점들의 좌표 평면으로 생각하고, "적어 두기"와 "내보내기"를 나눠 생각한다
successCriteria:
  - (x, y) 에서 x 와 y 가 각각 어느 쪽으로 커지는지 말하고, 원하는 자리에 글자를 적을 수 있다
  - oled.text 로 적은 글자가 oled.show() 를 불러야 화면에 나타나는 까닭을 말할 수 있다
  - 숫자가 바뀌는 화면에서 지우기 → 적기 → 내보내기 순서가 왜 필요한지 설명할 수 있다
  - 한 줄에 몇 자까지 들어가는지 계산하고, 글이 잘리지 않게 고칠 수 있다
parts:
  - id: part1
    title: 화면에 글과 그림 그리기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 기계가 글로 말하려면?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 손바닥보다 작은 화면이지만, 점 8192개로 글자도 그림도 그릴 수 있어요
        body: |
          지금까지 보드는 LED 를 켜거나 소리를 내서 말했어요. 그런데 불빛만으로는 **무엇을 말하고 싶은지** 알기 어려워요. 온도가 몇 도인지, 문이 왜 안 열리는지 같은 것들이요.

          오늘 쓸 OLED 화면은 가로 128 · 세로 64 개의 점뿐이에요. 이 점들로 글과 그림을 어떻게 그릴 수 있을까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, OLED 화면, 듀폰선, USB 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 글자가 없는 기계는 무엇을 말하고 싶은지 알 수 없어요. 우리 주변에서 작은 화면으로 글을 보여 주는 기계에는 무엇이 있나요?
          - 128 × 64 개의 점으로 글자와 그림을 그리려면, 보드에게 "어디에" 그릴지를 어떻게 알려 줄 수 있을까요?
          - 화면에 보이는 숫자가 1초마다 바뀐다면, 앞에 있던 숫자는 어떻게 해야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "화면에 글 세 줄 보여 주기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "위쪽에 적어"라는 말을 몰라요. **숫자로 된 자리**를 알려 줘야 해요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 글자 크기와 화면 크기를 알면 무엇을 계산할 수 있을지도 생각해 봐요.
        todo:
          - "**알아야 할 것**: 보드가 시작 전에 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 글과 자리 적기"
          - "**해야 할 것**: 보드가 차례대로 하는 일 적기"
        answer:
          know: ["화면이 어느 두 핀에 이어졌는지 (SCL 22번, SDA 21번)", "화면 크기 (가로 128 · 세로 64 점)", "글자 한 자의 크기 (점 8 × 8)"]
          decide: ["화면에 보여 줄 글", "글을 적을 자리 (x, y)", "선 · 네모의 시작 자리와 크기"]
          act: ["화면 지우기", "글과 도형을 적어 두기", "적어 둔 것을 화면으로 내보내기"]

      - id: predict
        type: predict
        title: 예측하기 — 글자는 화면 어디에 뜰까?
        minutes: 3
        scene:
          image: images/oled-grid.svg
          caption: "(0, 0)은 화면 맨 위 구석이에요. x 는 가로로, y 는 아래로 갈수록 커져요"
        body: |
          `oled.text("글", x, y)` 는 (x, y) 자리부터 글자를 적어요. 글자 한 자는 점 8 × 8 크기예요.

          아직 실행하지 않아요. 활동 칸의 코드를 읽고 화면에 무엇이 어떻게 보일지 **먼저 예측**해 적어요. 마지막 줄 `oled.show()` 가 왜 따로 있는지도 눈여겨보세요.
        todo:
          - 그림을 보고 x 와 y 가 각각 어느 쪽으로 커지는지 확인하기
          - "`oled.text` 세 줄의 괄호 안 숫자 읽기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_oled_text.py
        blanks:
          - q: 화면에 글자가 몇 줄 보일까요?
            unit: 줄
          - q: "\"Ready\" 는 화면의 위 · 가운데 · 아래 중 어디쯤 보일까요? 왜 그렇게 생각하나요?"
          - q: 마지막 줄 oled.show() 를 지우고 실행하면 화면은 어떻게 될까요?

      - id: run
        type: run
        title: 복사 · 실행 — 화면에 글 세 줄
        minutes: 5
        scene:
          image: images/wiring-breadboard.svg
          caption: "OLED 네 핀 → I2C 묶음 첫 줄: GND → GND · VCC → 5V · SDA → SDA(21번) · SCL → SCL(22번)"
          captionDevkit: "OLED 네 핀: VCC → 3V3 · GND → GND · SDA → D21 · SCL → D22"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**을 보고 OLED 를 F-F 듀폰선 4가닥으로 보드에 바로 이어요. SDA → `21`번, SCL → `22`번, VCC · GND 는 전원으로 가요. 모듈에 적힌 글자(GND · VCC · SCL · SDA)를 꼭 읽고 꽂아요. 전원 두 선이 바뀌면 화면이 켜지지 않아요.

          화면도 혼자서는 글자를 못 그려서 **라이브러리 파일**(`ssd1306.py`)이 보드에 있어야 해요. **실행**을 누르면 블록랩이 import 줄을 보고 함께 올려 줘요. 화면에 글이 뜨면 예측과 비교해 보세요.
        todo:
          - "**부품과 배선**대로 OLED 네 핀 잇기"
          - "**보드 연결** → **실행** 누르고 화면 보기"
          - 세 줄이 어디에 떴는지 예측과 비교하기
        code: step1_oled_text.py
        expected: 코드를 실행하면 OLED 화면 맨 위에 `Hello, ESP32!`, 그 아래에 `Sensor Track`, 더 아래에 `Ready` 가 한꺼번에 나타나요.
        codeNotes:
          - { line: 2, note: "OLED 라이브러리(`ssd1306.py`)를 가져와요" }
          - { line: 4, note: "SCL 22번 · SDA 21번 두 선으로 이야기할 준비를 하고 `i2c` 라고 이름 붙여요" }
          - { line: 5, note: "그 두 선에 이어진 128 × 64 화면을 `oled` 라고 이름 붙여요" }
          - { line: 7, note: "`oled.fill(0)`: 적어 둔 것을 모두 까맣게 지워요" }
          - { line: 8, note: "`oled.text(글, x, y)`: (0, 0) 자리에 글자를 적어 둬요. 아직 화면에는 안 보여요" }
          - { line: 10, note: "y 가 클수록 아래쪽이라 `Ready` 는 (0, 40) 에 적혀요" }
          - { line: 11, note: "`oled.show()`: 적어 둔 것을 한꺼번에 화면으로 보내요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 1
        minutes: 3
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          방금 본 글자 세 줄이 코드의 어디에서 나왔는지 확인해요. 준비하는 두 줄과 화면에 그리는 다섯 줄로 나눠서 읽으면 쉬워요.

          답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - "`oled.text` 세 줄의 괄호 안 숫자를 짚으며 읽기"
          - 세 문제에 답하고 **확인** 누르기
          - 틀린 문항은 그 줄을 다시 읽고 고치기
        code: step1_oled_text.py
        codeNotes:
          - { line: 2, note: "OLED 라이브러리(`ssd1306.py`)를 가져와요" }
          - { line: 4, note: "SCL 22번 · SDA 21번 두 선을 준비해요" }
          - { line: 5, note: "128 × 64 화면을 `oled` 라고 이름 붙여요" }
          - { line: 7, note: "적어 둔 것을 모두 지워요" }
        questions:
          - { kind: number, q: "\"Sensor Track\" 은 화면 맨 위에서 몇 점 아래(y)에 적히나요?", answer: 20 }
          - { kind: choice, q: "\"Ready\" 를 화면 더 아래쪽으로 내리려면 어느 숫자를 바꿔야 하나요?", options: ["Ready 줄의 0 (x)", "Ready 줄의 40 (y)", "SSD1306_I2C 의 64"], answer: 1, hint: "y 는 어느 쪽으로 갈수록 커졌나요?" }
          - { kind: line, q: "적어 둔 글자들이 화면에 나타나는 줄의 번호를 클릭하세요", answer: 11 }

      - id: run2
        type: run
        title: 복사 · 실행 2 — 선 · 네모 그리기
        minutes: 4
        scene:
          image: images/oled-grid.svg
          caption: "도형도 글자처럼 (x, y) 자리에서 시작해요. 네모는 시작 자리와 가로 · 세로 길이로 그려요"
        body: |
          화면에는 글자 말고 **도형**도 그릴 수 있어요. `oled.line` 은 두 점을 잇는 선, `oled.rect` 는 테두리 네모, `oled.fill_rect` 는 꽉 채운 네모예요. 도형도 적어 두었다가 `oled.show()` 로 한꺼번에 보여 줘요. 배선은 그대로예요.

          실행하기 전에 줄 끝의 설명을 읽고 세 도형이 어디쯤 생길지 손가락으로 짚어 봐요. 그다음 숫자 하나를 바꿔 다시 실행하고 무엇이 달라졌는지 보세요.
        todo:
          - "**실행** 누르고 도형 세 개가 어디에 생기는지 보기"
          - "`oled.fill_rect` 의 가로(20)를 40 으로 바꿔 다시 실행하기"
          - 달라진 점을 공책에 한 줄 적기
        code: step2_oled_shapes.py
        expected: 코드를 실행하면 화면 위쪽에 비스듬한 선이 하나 그어지고, 그 아래에 테두리만 있는 네모와 속이 꽉 찬 네모가 나란히 그려져요.
        codeNotes:
          - { line: 7, note: "`oled.fill(0)`: 먼저 화면을 까맣게 지워요" }
          - { line: 8, note: "`oled.line(x1, y1, x2, y2, 1)`: (0, 0) 에서 (127, 20) 까지 선을 그어요. 마지막 1 은 점을 켜라는 뜻" }
          - { line: 9, note: "`oled.rect(x, y, 가로, 세로, 1)`: (10, 30) 에서 시작하는 가로 50 · 세로 25 테두리 네모" }
