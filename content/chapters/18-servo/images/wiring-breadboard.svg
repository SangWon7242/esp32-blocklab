<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sv-wire-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sv-wire-title">브레드보드 배선도: ESP32 5V 는 빨간 선으로 위쪽 + 줄, GND 는 검은 선으로 위쪽 − 줄. 서보 모터 플러그에 점퍼선 3가닥: 주황 신호선 → 18번 줄 a 칸, 빨강 → 위쪽 + 줄(5V), 갈색 → 위쪽 − 줄(GND). ESP32 4번 주황 선 → 18번 줄 e 칸. 아래쪽 + 줄은 ESP32 3V3, 아래쪽 − 줄은 GND. 가변저항 다리 셋은 f 칸 24·25·26번 줄: 24번 → 아래 + 줄(3V3), 가운데 25번 → 초록 선 → 39번, 26번 → 아래 − 줄</title>
