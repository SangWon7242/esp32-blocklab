  <text x="320" y="336" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">duty_u16 는 20 ms 전체를 0~65535 로 나눈 숫자예요. 1638 ≈ 0.5 ms, 8100 ≈ 2.5 ms</text>
  <text x="320" y="354" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" stroke="none">(잘 보이도록 켜진 길이를 실제보다 길게 그렸어요)</text>
