  <path d="M472 212 A34 34 0 0 1 540 212 Z" fill="var(--muted)" stroke-width="1.5"/>
  <path d="M534.0 212.0 L540.0 212.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M506.0 184.0 L506.0 178.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M478.0 212.0 L472.0 212.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M506 212 L506.0 182.0" stroke="#2f9e44" stroke-width="5"/>
  <circle cx="506" cy="212" r="4" fill="var(--card)"/>
  <text x="560" y="204" font-size="20" font-weight="700" fill="#2f9e44" stroke="none">90°</text>
  <path d="M92 302 H100 V262 H160 V302 H260 V262 H320 V302 H412" stroke="#e8590c" stroke-width="3"/>
  <text x="20" y="280" font-size="15" font-weight="700" fill="currentColor" stroke="none">2.5 ms</text>
  <text x="20" y="300" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">duty_u16</text>
  <text x="20" y="316" font-size="13" font-weight="600" fill="currentColor" stroke="none">8100</text>
