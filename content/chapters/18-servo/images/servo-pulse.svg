  <path d="M472 302 A34 34 0 0 1 540 302 Z" fill="var(--muted)" stroke-width="1.5"/>
  <path d="M534.0 302.0 L540.0 302.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M506.0 274.0 L506.0 268.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M478.0 302.0 L472.0 302.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M506 302 L476.0 302.0" stroke="#e8590c" stroke-width="5"/>
