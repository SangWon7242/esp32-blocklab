<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sv-pulse-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sv-pulse-title">서보 신호: 보드는 20 ms 마다(1초에 50번) 신호를 보낸다. 신호가 켜진 길이가 0.5 ms(duty_u16 1638)이면 0도, 1.5 ms(4869)이면 90도, 2.5 ms(8100)이면 180도로 서보 팔이 돈다</title>
  <text x="290" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">켜진 길이가 각도를 정해요</text>
  <path d="M100 58 V50 H260 V58" stroke-opacity="0.7"/>
  <text x="180" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">20 ms (1초에 50번)</text>
  <path d="M92 122 H100 V82 H112 V122 H260 V82 H272 V122 H412" stroke="#4562f5" stroke-width="3"/>
  <text x="20" y="100" font-size="15" font-weight="700" fill="currentColor" stroke="none">0.5 ms</text>
  <text x="20" y="120" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">duty_u16</text>
  <text x="20" y="136" font-size="13" font-weight="600" fill="currentColor" stroke="none">1638</text>
