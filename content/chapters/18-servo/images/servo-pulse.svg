  <path d="M478.0 122.0 L472.0 122.0" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M506 122 L536.0 122.0" stroke="#4562f5" stroke-width="5"/>
  <circle cx="506" cy="122" r="4" fill="var(--card)"/>
  <text x="560" y="114" font-size="20" font-weight="700" fill="#4562f5" stroke="none">0°</text>
  <path d="M92 212 H100 V172 H136 V212 H260 V172 H296 V212 H412" stroke="#2f9e44" stroke-width="3"/>
  <text x="20" y="190" font-size="15" font-weight="700" fill="currentColor" stroke="none">1.5 ms</text>
  <text x="20" y="210" font-size="12" fill="currentColor" fill-opacity="0.7" stroke="none">duty_u16</text>
  <text x="20" y="226" font-size="13" font-weight="600" fill="currentColor" stroke="none">4869</text>
