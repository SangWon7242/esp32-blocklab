# 챕터 S15 · 서보 모터 — 아두이노 기본 W07(Servo, 각도, 가변저항 → 각도 map), Keyestudio 2-3-12 Servo Rotation(4번 핀, 50 Hz, 0.5~2.5 ms). 형식 설명은 src/track/README.md
# 08(출입 통제)·10(자동문)이 문으로 쓰는 서보의 기초. duty_u16(1638) = 0도(닫힌 자리), duty_u16(8100) = 180도(열린 자리) 는 그 챕터와 같은 숫자다
id: 18-servo
order: 18
track: sensor
label: S15
prerequisites: [02-breathing-led, 13-clap-dial]
subjects: [과학, 수학]
sessions: 1
teacherNotes: |
  **전원** 서보는 움직이는 순간 전기를 많이 써요(SG90 은 수백 mA). 빨강 선은 꼭 **5V** 줄에 꽂게 하세요. 3V3 에 꽂거나 USB 하나에 서보를 여러 개 달면 팔이 떨고, 보드가 다시 켜지기도 해요(전압이 잠깐 떨어지는 브라운아웃). 서보를 2개 넘게 쓸 때는 건전지 같은 따로 전원을 쓰고 GND 를 보드와 이어 주세요.

  - 브레드보드 **위 + 줄은 5V(서보), 아래 + 줄은 3V3(가변저항)** 으로 서로 달라요. 가변저항을 5V 줄에 꽂으면 39번에 3.3V 넘게 들어가니 배선 확인 때 꼭 짚어 주세요.
  - 키트 보드에 4번 핀 G·V·S 세 핀이 나란히 있으면 서보 플러그를 바로 꽂아도 돼요. 이때 V 줄 전압이 5V 인지 먼저 확인하세요.
  - `1638`(0.5 ms)~`8100`(2.5 ms)은 Keyestudio 튜토리얼 값이에요. 서보마다 끝 각도가 조금씩 달라서 0도·180도에서 "드르륵" 소리가 나면 10~170도처럼 범위를 조금 줄여 쓰게 하세요.
  - 90도에서 멈춘 뒤 팔(혼)이 곧게 서도록 다시 끼우면 8장·10장의 문을 만들 때 편해요. 혼 나사는 조이지 않아도 돼요.
  - 미션의 `((값 − 0) × (180 − 0) // (4095 − 0) + 0)` 은 13장(S10)의 밝기 조절과 같은 비례식이에요. 다이얼이 4095 까지 닿지 않으면 팔도 180도까지 못 가요. 값을 재서 범위를 맞추는 것을 확장 활동으로 쓸 수 있어요.
  - 융합: 수학(비례식·각도기), 과학(목표와 지금을 비교해 멈추는 **되먹임**: 냉장고 온도 조절, 로봇 관절). 원본 W07 숙제처럼 다음 S16(조이스틱)에서 서보를 기울인 쪽으로 움직여 볼 수 있어요.
title: 서보 모터
subtitle: 숫자 하나로 팔을 원하는 각도에
summary: |
  건널목 차단기나 8장·10장의 문은 팔이 늘 같은 자리에 **딱 멈춰요**. 이번에는 그 팔을 움직이는 **서보 모터**를 따로 익혀요.
  1초에 50번 보내는 신호의 **켜진 길이**로 0도·90도·180도를 정해 보고, 13장의 다이얼(가변저항)을 **범위 바꾸기**로 0~180도로 옮겨 다이얼을 돌리면 팔이 따라 도는 장치를 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 서보 모터(SG90), note: "선 3가닥: 주황 신호 → 4번, 빨강 → 5V, 갈색 → GND. 팔(혼)은 끼워만 두기" }
  - { name: 가변저항, note: "다리 3개. 가운데 다리가 신호(39번), 양 끝은 3V3 과 GND" }
  - { name: 브레드보드, note: "위 + 줄은 5V(서보), 아래 + 줄은 3V3(가변저항). 두 − 줄은 모두 GND" }
  - { name: 점퍼선(M-M), note: "11개 (서보 플러그에 3, 보드 핀에서 6, 가변저항에서 + 줄·− 줄로 2). 보드에 4번 G·V·S 핀이 나란히 있으면 서보 플러그는 선 없이 바로 꽂아도 돼요" }
wiring:
  image: images/wiring-breadboard.svg
  caption: "5V → 위 + 줄(빨강), GND → 위 − 줄(검정). 서보: 주황 → 18번 줄 → 4번(주황 선), 빨강 → 위 + 줄, 갈색 → 위 − 줄. 3V3 → 아래 + 줄, GND → 아래 − 줄. 가변저항 24·25·26번 줄: 24번 → 아래 + 줄, 가운데 25번 → 39번(초록), 26번 → 아래 − 줄"
principle:
  image: images/servo-pulse.svg
  body: |
    서보 모터는 계속 빙빙 도는 모터가 아니라 **정해 준 각도로 가서 멈추는** 모터예요. 안에는 모터·톱니와 함께 **작은 가변저항**이 들어 있어서 팔이 지금 몇 도인지 재요.

    - 보드는 서보에게 **1초에 50번**(20 ms 마다) 신호를 보내요 (`freq(50)`)
    - 신호 한 번이 켜져 있는 길이가 각도예요: **0.5 ms → 0도**, 1.5 ms → 90도, **2.5 ms → 180도**
    - `duty_u16` 는 20 ms 전체를 0~65535 로 나눈 숫자예요. 0.5 ms 는 약 `1638`, 2.5 ms 는 약 `8100`
    - 그래서 각도 블록은 `1638 + 각도 * 6462 // 180` 을 계산해요. 6462 는 8100 − 1638 이에요

    서보 속 회로는 **목표 각도**(신호 길이)와 **지금 각도**(속 가변저항)를 계속 비교해서, 다르면 모터를 돌리고 같아지면 멈춰요.
goals:
  content: 서보 모터에 50 Hz 신호를 보내 원하는 각도로 팔을 돌리고, 가변저항 값을 범위 바꾸기로 0~180도로 옮겨 다이얼로 서보를 움직인다
  thinking: 신호의 켜진 길이와 각도 사이의 비례 관계를 식으로 나타내고, 서보가 목표 각도에서 멈추는 까닭을 "비교하고 고치기"로 설명한다
successCriteria:
  - 서보의 세 선(주황·빨강·갈색)이 각각 어디로 가는지 말하고 바르게 꽂을 수 있다
  - 신호가 켜진 길이(0.5~2.5 ms)와 각도(0~180도)의 관계를 말할 수 있다
  - 가변저항 값 0~4095 를 각도 0~180 으로 바꾸는 블록을 만들 수 있다
  - 서보가 이상할 때 각도 범위·전원·신호 핀 중 어디부터 볼지 안다
parts:
  - id: part1
    title: 각도로 움직이는 팔
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 팔은 어떻게 정확히 90도에서 멈출까?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 차단기 팔은 0도(누운 자리)와 90도(선 자리)에서 딱 멈춰요
        body: |
          건널목 차단기는 차가 지나갈 때 팔이 곧게 서고, 기차가 오면 누워서 길을 막아요. 7장의 선풍기 모터는 계속 돌기만 했는데, 차단기 팔은 늘 **같은 자리**에 딱 멈춰요.

          8장·10장에서 문을 여닫는 부품이 바로 **서보 모터**예요. 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(서보 모터, 가변저항, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 차단기 팔은 늘 같은 자리에 멈춰요. 계속 도는 선풍기 모터와 무엇이 달라야 할까요?
          - 보드가 서보에게 "90도로 가"라고 알려 주려면 무엇을 바꿔서 보내면 될까요? 2장에서 LED 밝기를 바꾼 방법을 떠올려 보세요
          - 팔이 정확히 90도에서 멈추려면 서보는 무엇을 알고 있어야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "팔을 0도, 90도, 180도로 차례로 돌리기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "90도"라는 말을 몰라요. **신호 숫자**로 바꿔 줘야 해요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 서보 선이 어디로 가고, 서보가 어떤 신호를 받는지 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["서보 주황 신호선은 4번, 빨강은 5V, 갈색은 GND", "서보는 1초에 50번 신호를 받고, 켜진 길이로 각도를 알아요"]
          decide: ["팔을 보낼 각도 (예: 0도, 90도, 180도)", "한 자리에 머무를 시간 (예: 1초)"]
          act: ["각도를 신호 숫자(duty_u16)로 바꿔 보내기", "기다렸다가 다음 각도 보내기", "처음으로 돌아가 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 0도, 90도, 180도
        minutes: 4
        scene:
          image: images/servo-pulse.svg
          caption: 켜진 길이가 0.5 ms 면 0도, 2.5 ms 면 180도. 그 사이는 비례해서 나뉘어요
        body: |
          `servo.duty_u16(1638 + 90 * 6462 // 180)` 은 "서보 각도를 90도로" 블록이 만든 코드예요. 각도를 넣으면 신호 숫자로 바꿔 줘요.

          활동 칸의 코드는 아직 실행하지 않아요. 팔이 어떻게 움직일지 미리 적어 봐요. 계산은 공책에 해도 돼요.
        todo:
          - 코드를 한 줄씩 소리 내어 읽기
          - "`while True:` 안의 여섯 줄이 무슨 순서로 되풀이되는지 짚어 보기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_sweep.py
        blanks:
          - q: 팔은 0도, 90도, 180도에서 각각 몇 초씩 머물까요?
            unit: 초
          - q: 180도까지 간 다음, 팔은 어디로 갈까요?
          - q: 각도 칸의 90 을 45 로 바꾸면 팔은 어디쯤 멈출까요? 0도·90도 자리와 비교해 적어 보세요

      - id: run
        type: run
        title: 복사 · 실행 — 0도에서 180도까지
        minutes: 6
        scene:
          image: images/wiring-breadboard.svg
          caption: "서보 빨강은 위 + 줄(5V), 가변저항은 아래 + 줄(3V3). 서보 주황은 18번 줄을 거쳐 4번"
        body: |
          **USB 를 뺀 채로** **부품과 배선**의 배선도를 보고 오늘 쓸 부품을 모두 꽂아요. 브레드보드 **위 + 줄은 5V**, **아래 + 줄은 3V3** 이에요. 서보 빨강은 위, 가변저항은 아래로 가요.

          실행한 뒤 팔이 90도에서 곧게 서지 않으면 USB 를 빼고 팔(혼)을 살짝 뽑아 곧게 다시 끼워요. 예측과 비교해 봐요.
        todo:
          - 배선도대로 꽂고, 서보 빨강이 5V 줄에 있는지 확인하기
          - "**보드 연결** → **실행** 누르기"
          - 90도에서 팔이 곧게 서도록 혼을 다시 끼우기
        code: step1_sweep.py
        expected: 코드를 실행하면 서보 팔이 1초마다 0도 → 90도 → 180도로 돌고, 다시 0도로 돌아가 되풀이해요. 자리마다 딱 멈춰요.
        codeNotes:
          - { line: 4, note: "4번 핀을 PWM(켜진 길이를 조절하는) 핀으로 준비하고 이름을 `servo` 로 붙여요 (4~6번 줄이 블록 하나)" }
          - { line: 5, note: "`freq(50)`: 1초에 50번, 20 ms 마다 신호를 보내요" }
          - { line: 6, note: "`duty_u16(1638)`: 켜진 길이 0.5 ms. 처음엔 0도(닫힌 자리)에 둬요" }
          - { line: 9, note: "각도 0 을 신호 숫자로 바꿔 보내요: `1638 + 0 * 6462 // 180` 은 1638" }
          - { line: 10, note: "1초 동안 그 자리에 머물러요" }
          - { line: 11, note: "각도 90 을 보내요. 팔이 한가운데에서 멈춰요" }
          - { line: 13, note: "각도 180 을 보내요: `1638 + 6462` 는 8100, 켜진 길이 약 2.5 ms" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 서보 코드
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          눈으로 본 움직임을 이제 코드로 확인해요. 준비하는 세 줄과 `while True:` 안의 여섯 줄을 나눠서 읽어 봐요.

          줄마다 손가락으로 짚으며 읽고, 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - 서보를 준비하는 세 줄 찾기
          - 반복 안의 마지막 줄 다음에 무엇이 오는지 따라가 보기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_sweep.py
        questions:
          - { kind: number, q: "보드는 서보에게 1초에 몇 번 신호를 보내나요?", answer: 50 }
          - { kind: choice, q: "180도로 보내고 1초 기다린 다음, 팔은 어떻게 되나요?", options: ["180도에 그대로 멈춰 있다", "다시 0도로 간다", "90도로 간다"], answer: 1, hint: "while True: 안의 마지막 줄이 끝나면 어느 줄로 돌아가나요?" }
          - { kind: line, q: "처음 준비할 때 팔을 0도(닫힌 자리)에 두는 줄의 번호를 클릭하세요", answer: 6 }
        codeNotes:
          - { line: 4, note: "서보를 4번 핀에 준비해요 (4~6번 줄)" }
          - { line: 9, note: "각도를 신호 숫자로 바꿔 보내요" }
          - { line: 11, note: "`1638 + 90 * 6462 // 180`: 0도와 180도 사이 한가운데 숫자예요" }
          - { line: 12, note: "다음 각도까지 1초 기다려요" }

      - id: mission
        type: mission
        title: 미션 — 다이얼로 움직이는 서보
        minutes: 8
        scene:
          image: images/angle-map.svg
          caption: 0~4095 의 긴 자를 0~180 의 짧은 자로 옮겨요. 한가운데 2048 은 90도쯤이 돼요
        body: |
          굴착기 기사님은 손잡이를 조금 밀면 팔이 조금, 많이 밀면 많이 움직여요. 이번에는 **다이얼**(가변저항)을 돌린 만큼 서보 팔이 따라 돌게 해요.

          다이얼 값은 0~4095 인데 서보 각도는 0~180 이에요. 13장에서 쓴 **범위 바꾸기**로 "0~4095 에서 0~180 으로" 옮겨요. 다이얼을 천천히 돌려 팔이 따라오는지 확인하고 **판정**을 눌러요.
        todo:
          - "서보 준비 블록 **아래**에 가변저항을 39번 핀에 `knob` 이름으로 준비하기"
          - "반복 안의 각도 줄들을 지우고, 다이얼 값을 **범위 바꾸기**로 0~180 으로 바꿔 `angle` 에 담기"
          - "서보 각도를 `angle` 도로 정하고 20ms 기다린 뒤 **판정** 누르기"
        instructions: 다이얼을 돌리면 서보 팔이 따라 돌게 하세요. 서보 준비 아래에 가변저항을 39번 핀에 knob 이름으로 준비하고, 반복 안에서는 다이얼 값(0~4095)을 범위 바꾸기로 0~180 으로 바꿔 angle 에 담은 뒤, 서보 각도를 angle 도로 정하고 20밀리초 기다려요
        hint: 범위 바꾸기 블록의 네 칸에는 원래 범위의 처음·끝, 바꿀 범위의 처음·끝이 들어가요. 서보 각도 블록의 칸에는 숫자 대신 변수 angle 을 끼울 수 있어요
        code: step1_sweep.py
        rules:
          - pinIs: { name: knob, pin: 39 }
            fail: 가변저항 가운데 다리는 몇 번 핀에 꽂았나요? 그 핀을 knob 이라는 이름으로 준비했나요?
          - codeMatches: '\(\(knob\.read\(\)\s*-\s*0\)\s*\*\s*\(180\s*-\s*0\)\s*//\s*\(4095\s*-\s*0\)\s*\+\s*0\)'
            fail: 다이얼 값의 범위와 서보 각도의 범위는 각각 어디부터 어디까지인가요? 범위 바꾸기의 네 칸에 그 숫자가 들어갔나요?
          - codeMatches: '^\s+servo\.duty_u16\(1638\s*\+\s*angle\s*\*\s*6462\s*//\s*180\)$'
            fail: 바꾼 각도를 서보에게 보냈나요? 서보 각도 블록의 칸에 무엇이 들어 있나요?
          - codeMatches: '^servo\s*=\s*PWM\(Pin\(4\)\)[\s\S]*^knob\s*=\s*ADC\(Pin\(39\)\)'
            fail: 가변저항 준비와 서보 준비는 어느 순서로 있나요? 둘 다 반복 밖에 있나요?
          - codeMatches: '^\s+angle\s*=\s*.*knob\.read\(\).*\n(\s*print\(.*\)\n)*\s+servo\.duty_u16\(1638\s*\+\s*angle\b'
            fail: 다이얼 값을 바꿔 담은 이름과 서보에게 보내는 이름이 같나요? 담은 줄 바로 다음에 서보에게 보내나요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*(duty_u16\(1638\s*\+\s*\d+\s*\*|^\s+time\.sleep\(1\)))'
            fail: 반복 안에 처음 코드의 줄이 아직 남아 있지 않나요? 각도를 숫자로 정하던 줄과 1초 기다리던 줄을 찾아 보세요
          - codeMatches: '^\s+time\.sleep(_ms\(20\)|\(0?\.02\))$'
            fail: 한 바퀴마다 얼마나 기다리나요? 지시의 밀리초와 같은가요? 그 줄은 반복 안에 있나요?
        answerCode: mission_dial_servo.py

      - id: debug
        type: debug
        title: 디버깅 — 서보가 이상해요
        minutes: 7
        scene:
          image: images/breadboard-basics.svg
          caption: "+ 줄은 가로로 끝까지 이어지지만, 위쪽 + 줄(5V)과 아래쪽 + 줄(3V3)은 서로 다른 줄이에요"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 경고가 뜨면 숫자 칸부터, 떨면 전원과 기다리는 시간부터, 꼼짝 안 하면 핀 번호부터 봐요.

          셋 중 **블록에 경고가 뜨는 것**은 어느 것일까요? 나머지 둘은 왜 경고 없이 이상하게만 굴까요? 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: "블록에 \"각도는 0~180 사이여야 해요\" 경고가 뜨고, 팔이 끝에서 드르륵 떨어요"
            code: |
              from machine import Pin, PWM
              import time

              servo = PWM(Pin(4))
              servo.freq(50)
              servo.duty_u16(1638)

              while True:
                  servo.duty_u16(1638 + 0 * 6462 // 180)
                  time.sleep(1)
                  servo.duty_u16(1638 + 200 * 6462 // 180)
                  time.sleep(1)
            question: 서보 팔은 몇 도부터 몇 도까지 돌 수 있었나요? 200도를 보내면 서보 속에서 "목표"와 "지금 각도"는 언제 같아질까요?
            rules:
              - codeMatches: '(?<![\s\S])(?![\s\S]*1638\s*\+\s*(18[1-9]|19\d|[2-9]\d\d|\d{4,})\s*\*)'
                fail: 각도 칸에 넣은 숫자가 서보가 갈 수 있는 범위 안에 있나요?
              - codeMatches: '1638\s*\+\s*(1[0-7]\d|180|[1-9]\d)\s*\*\s*6462'
                fail: 팔을 크게 여는 줄까지 지우지는 않았나요? 서보가 가장 크게 돌 수 있는 각도는 몇 도예요?
          - title: USB 만 꽂았는데 팔이 드르륵 떨기만 하고, 가끔 보드가 다시 켜져요
            code: |
              from machine import Pin, PWM
              import time

              servo = PWM(Pin(4))
              servo.freq(50)
              servo.duty_u16(1638)

              while True:
                  servo.duty_u16(1638 + 0 * 6462 // 180)
                  time.sleep(0.05)
                  servo.duty_u16(1638 + 180 * 6462 // 180)
                  time.sleep(0.05)
            question: 서보 빨강 선은 위 + 줄(5V)과 아래 + 줄(3V3) 중 어디에 꽂혀 있나요? 그리고 팔이 0도에서 180도까지 가는 데 얼마나 걸릴까요? 0.05초마다 방향을 바꾸면 모터는 쉴 틈이 있을까요?
            rules:
              - codeMatches: '(?<![\s\S])(?![\s\S]*time\.sleep(\(0?\.[0-4]\d*\)|_ms\(([1-4]\d\d|\d{1,2})\)))'
                fail: 팔이 끝까지 가서 멈출 만큼 기다려 주나요? 0도에서 180도까지 가는 데 걸리는 시간을 재 보세요
              - codeMatches: 'time\.sleep'
                fail: 각도를 보낸 다음 기다리는 줄이 남아 있나요?
          - title: 에러도 경고도 없는데 서보가 꼼짝도 안 해요
            code: |
              from machine import Pin, PWM
              import time

              servo = PWM(Pin(5))
              servo.freq(50)
              servo.duty_u16(1638)

              while True:
                  servo.duty_u16(1638 + 0 * 6462 // 180)
                  time.sleep(1)
                  servo.duty_u16(1638 + 90 * 6462 // 180)
                  time.sleep(1)
            question: 보드는 코드에 적힌 핀으로 신호를 보내요. 서보 주황 선은 배선도에서 몇 번 핀으로 갔나요? 코드는 몇 번 핀으로 보내고 있나요?
            rules:
              - pinIs: { name: servo, pin: 4 }
                fail: 서보 주황 신호선은 몇 번 핀에 꽂았나요? 코드의 핀 번호와 같은가요?

