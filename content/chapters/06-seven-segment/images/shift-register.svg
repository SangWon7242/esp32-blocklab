  <title id="sgr-title">74HC595 가 일하는 순서: 1. SI 에 0 또는 1 을 올려 둔다. 2. SCK 를 한 번 올리면 칸들이 한 칸씩 밀리며 그 값이 들어간다. 이것을 8번 되풀이하면 여덟 칸이 찬다. 3. RCK 를 올리면 여덟 칸이 한꺼번에 Q0~Q7 로 나가 튜브의 막대를 켠다</title>

<text x="24.0" y="30.0" font-size="14" font-weight="700" text-anchor="start" fill="currentColor" stroke="none">보낼 숫자 3 = 0100 1111 (앞 자리부터 하나씩)</text>
