# 센서 트랙 S12 · 온습도 센서 — 원본: 아두이노 기본 W05(DHT11 온·습도, 값 없음 처리, 교실 온습도 알리미), 아두이노 심화 W02(센서 상황판의 DHT 부분), Keyestudio 2-3-24 Temperature and Humidity Detection. 형식 설명은 src/track/README.md
id: 15-temp-humidity
order: 15
track: sensor
label: S12
prerequisites: [11-button-touch, 13-clap-dial]
subjects: [과학, 수학]
sessions: 2
teacherNotes: |
  **핀 번호** DHT11 S 는 13번(Keyestudio 2-3-24 와 계획 11 핀 표), LED 는 26번. 34~39번은 입력 전용이라 DHT11 처럼 보드가 "재 줘" 신호를 보내야 하는 센서에는 쓸 수 없다(디버깅 증상 3).

  **측정 간격** MicroPython `dht` 는 `measure()` 를 1초보다 자주 부르면 `OSError: [Errno 116] ETIMEDOUT` 을 낸다. 이 챕터 코드는 모두 2초 간격이다. 원본 W05 의 "값 없음(isnan) 처리"는 MicroPython 에서 `try`/`except OSError` 에 해당하지만 블록에 try 가 없어, 이 챕터는 **간격 지키기**로 다룬다. 코드 모드에 익숙한 모둠에는 try/except 를 덧붙여 보여 줘도 좋다.

  **기준값** 실행 2의 기준 28℃ 와 설계의 불쾌지수 75 는 **예시**다. 계절·교실마다 실제 값이 다르므로, 실행 1에서 지금 교실 온도·습도를 재 공책에 적고 기준을 정하게 한다. 손으로 센서를 감싸면 온도가 1~2℃, 입김을 불면 습도가 크게 오른다. 겨울에는 28℃ 에 닿기 어려우니 "지금 온도 + 2" 같은 값으로 바꿔 시험하게 하고, 판정 뒤에 고치게 한다(미션·설계 판정은 지시의 숫자 그대로).

  **값의 정밀도** DHT11 은 정수로만 값을 주고 오차가 온도 ±2℃, 습도 ±5% 쯤이다. 옆 모둠과 1~2℃ 다른 것은 정상이다. 보드는 소수를 짧게 저장하므로 불쾌지수 끝자리가 계산기와 조금 다를 수 있다(25℃ · 50% → 71.775 근처).

  - 1차시: 문제 만나기 ~ 실행 2 · 읽기 체크 2 (온습도 재기, 더우면 켜지는 LED)
  - 2차시: 미션(불쾌지수 계산) · 디버깅 · 설계(불쾌지수 알리미) · 성찰
  - 융합: 과학(기상 관측, 습도와 체감 더위), 수학(식의 계산 순서, 대입). 불쾌지수 식과 단계(68 · 75 · 80)는 기상청 기준
  - 넓히기: OLED(S18)에 "T: 24C / H: 40%" 표시, 선풍기(S7) 켜기, 교과 융합 교실 기후 챕터(F6)로 이어진다
title: 온습도 센서
subtitle: 교실이 얼마나 덥고 축축한지 숫자로 재기
summary: |
  교실 벽의 온습도계는 지금 몇 도인지, 공기가 얼마나 축축한지 숫자로 보여 줘요. 그 속에는 온도와 습도를 함께 재는 **DHT11** 같은 센서가 들어 있어요.
  센서에게 **재 달라고 부탁**하고 온도·습도를 읽어 출력하고, 더우면 LED를 켜요. 마지막에는 온도와 습도로 **불쾌지수**를 계산하는 수학 식을 코드로 옮겨요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 온습도 센서(DHT11 모듈), note: "다리 3개: S(신호) · +(3.3V) · −(GND). 모듈 글자를 보고 꽂아요" }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. LED 자리는 1·2장과 같아요 }
  - { name: 점퍼선(M-M), note: "8개 (센서 3, + 줄·− 줄을 보드에 2, 26번 1, LED − 줄 1, − 줄 → GND 1)" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "DHT11 모듈의 다리 셋을 e 칸 25·26·27번 줄에(S · + · −). 13번 핀 → 25번 줄(S), 26번 줄(+) → + 줄 → 3V3, 27번 줄(−) → − 줄 → GND. LED는 2장과 같은 자리: 26번 핀 → 7번 줄 → 220Ω 저항 → 12번 줄의 긴 다리(+), 짧은 다리(−)는 13번 줄 → − 줄 → GND"
principle:
  image: images/dht-principle.svg
  body: |
    DHT11 안에는 소자가 둘 있어요. **습도 소자**는 공기 속 물기를 머금으면 저항이 바뀌고, **온도 소자**(서미스터)는 따뜻해지면 저항이 작아져요. 안에 든 작은 칩이 두 저항을 재서 **온도(℃)와 습도(%) 숫자**로 바꿔 둬요.

    칩은 **S 선 한 가닥**으로 보드와 주고받아요(한 선 통신, 1-wire). 보드가 선을 잠깐 낮춰 "재 줘" 하고 부르면, 센서가 대답한 뒤 습도·온도·확인 합을 **40비트**로 차례차례 보내요. 코드의 `measure()` 가 이 부탁이고, `temperature()` · `humidity()` 는 받아 둔 숫자를 꺼내기만 해요.

    - 한 번 잰 뒤에는 **1초 넘게** 쉬어야 해요. 더 자주 부르면 센서가 대답하지 못해 `OSError` 가 나요
    - 값은 정수로 나오고, 오차는 온도 ±2℃, 습도 ±5% 쯤이에요
    - 34~39번은 받기만 하는 핀이라 "재 줘" 신호를 보낼 수 없어요. 그래서 주고받을 수 있는 13번 핀을 써요
goals:
  content: DHT11 로 온도와 습도를 재 출력하고, 온도를 기준과 비교해 LED를 켜고, 온도와 습도로 불쾌지수 식을 계산하는 코드를 만든다
  thinking: 센서에게 "재 줘" 부탁(measure)과 값 꺼내기(temperature · humidity)를 나눠 생각하고, 수학 식을 계산 순서 그대로 코드로 옮긴다
successCriteria:
  - measure() 와 temperature() 가 각각 무슨 일을 하는지 내 말로 설명할 수 있다
  - DHT11 을 1초에 한 번보다 자주 읽으면 안 되는 까닭을 말할 수 있다
  - 온도가 기준 이상이면 LED를 켜고, 아니면 끄는 코드를 만들 수 있다
  - 불쾌지수 식을 괄호와 곱하기 순서에 맞게 코드로 옮겨 계산할 수 있다
parts:
  - id: part1
    title: 온도 · 습도 재고 불쾌지수 계산하기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 온도계는 숫자를 어떻게 알까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 벽의 온습도계가 28℃, 습도 70% 를 보여 줘요. 에어컨을 켤 때일까요?
        body: |
          교실 벽의 온습도계는 지금 몇 도인지, 공기가 얼마나 축축한지 숫자로 보여 줘요. 그런데 이 숫자는 한 번 바뀌면 한동안 그대로예요. 1초에 수십 번씩 바뀌지는 않아요.

          온도계는 "몇 도"라는 숫자를 어떻게 알아낼까요? 왜 1초에 한 번쯤만 숫자를 바꿀까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, DHT11 모듈, LED, 저항, 브레드보드, 점퍼선, USB 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 온도계는 지금이 몇 도인지 어떻게 숫자로 알 수 있을까요?
          - 교실 온습도계는 숫자를 1초에 한 번쯤만 바꿔요. 왜 더 자주 바꾸지 않을까요?
          - 에어컨은 '덥다'를 몇 도부터라고 정해야 할까요? 온도만 보면 충분할까요, 습도도 봐야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "더우면 알려 주기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "덥다"는 말을 몰라요. 센서에게 **재 달라고 부탁**하고, 받은 **숫자**를 사람이 정한 **기준 숫자**와 비교할 뿐이에요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 센서를 얼마나 자주 불러도 되는지도 생각해 봐요.
        todo:
          - "**알아야 할 것**: 보드가 시작 전에 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기 (몇 도부터 덥다고 할까요?)"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["DHT11 의 S 선이 몇 번 핀인지 (13번)", "온도·습도를 꺼내기 전에 먼저 재 달라고(measure) 해야 한다는 것", "한 번 잰 뒤 1초 넘게 쉬어야 한다는 것"]
          decide: ["덥다고 볼 기준 온도 (교실에서 재고 정하기, 예: 28℃)", "몇 초마다 잴지 (예: 2초)"]
          act: ["온도와 습도를 새로 재기", "값을 출력하기", "온도를 기준과 비교해 LED 켜거나 끄기", "이것을 끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 입김을 불면?
        minutes: 4
        scene:
          image: images/measure-timing.svg
          caption: 2초마다 재면 잴 때마다 새 숫자가 와요. 너무 자주 재거나, 재지 않고 읽으면 어떻게 될까요?
        body: |
          활동 칸의 코드는 2초마다 센서에게 재 달라고 부탁하고, 온도와 습도를 출력하기만 해요. 아직 실행하지 않아요.

          센서를 손으로 감싸거나 입김을 불면 숫자가 어떻게 될까요? 온도와 습도 가운데 어느 쪽이 더 크게 바뀔지도 예측해 봐요. 정답을 맞히기보다 **내 예측을 먼저 적는 것**이 중요해요.
        todo:
          - 코드를 위에서부터 한 줄씩 소리 내어 읽기
          - 재 달라고 부탁하는 줄과 값을 꺼내는 줄 찾기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_dht_print.py
        blanks:
          - q: 실행하면 출력 칸에 무엇이 몇 초마다 나올까요?
          - q: 센서에 입김을 불면 온도와 습도 가운데 어느 쪽이 더 크게 바뀔까요?
          - q: 지금 우리 교실은 몇 도, 습도 몇 % 쯤일까요?

      - id: run
        type: run
        title: 복사 · 실행 — 온도와 습도를 숫자로
        minutes: 7
        scene:
          image: images/wiring-breadboard.svg
          caption: "DHT11 다리 셋: 25번 줄(S) ← 13번 핀, 26번 줄(+) → + 줄 → 3V3, 27번 줄(−) → − 줄 → GND"
        body: |
          **USB를 뺀 채로** 안내 칸의 **부품과 배선**의 배선도를 보고 DHT11 모듈을 꽂아요. 다리 이름(S · + · −)이 모듈에 적혀 있어요. + 와 − 가 바뀌면 센서가 뜨거워질 수 있으니 꼭 확인해요. LED도 지금 같이 꽂아 두면 다음 실행에서 바로 쓸 수 있어요.

          실행한 뒤 처음 나온 온도와 습도를 **공책에 적어** 두세요. 그다음 센서를 손으로 감싸 보고, 입김도 불어 봐요. 숫자는 2초마다 바뀌어요. 다음 단계에서 이 숫자로 기준을 정해요.
        todo:
          - "**부품과 배선**대로 DHT11(S · + · −)과 LED 꽂기"
          - "**보드 연결** → **실행** 누르기"
          - 지금 온도·습도와, 손으로 감쌌을 때 · 입김을 불었을 때 숫자를 공책에 적기
        code: step1_dht_print.py
        expected: "코드를 실행하면 출력 칸에 `온도: 24` · `습도: 55` 처럼 두 줄이 2초마다 나와요. 센서를 손으로 감싸면 온도가 조금 오르고, 입김을 불면 습도가 크게 올랐다가 천천히 돌아와요."
        codeNotes:
          - { line: 1, note: "핀을 다루는 `Pin` 기능을 가져와요" }
          - { line: 3, note: "DHT 센서와 이야기하는 `dht` 기능을 가져와요" }
          - { line: 5, note: "13번 핀에 DHT11 을 준비하고 이름을 `dht11` 로 붙여요" }
          - { line: 7, note: "아래 들여 쓴 네 줄을 끝없이 되풀이해요" }
          - { line: 8, note: "`measure()` 로 센서에게 **지금 재 달라고** 부탁해요" }
          - { line: 9, note: "방금 잰 온도(℃)를 꺼내 출력해요" }
          - { line: 10, note: "방금 잰 습도(%)를 꺼내 출력해요" }
          - { line: 11, note: "2초 기다려요. 센서는 한 번 잰 뒤 1초 넘게 쉬어야 해요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 1
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          눈으로 본 숫자가 코드의 어디에서 나왔는지 확인해요. **부탁하는 줄**(재 줘)과 **꺼내는 줄**(온도, 습도)을 나눠서 읽으면 쉬워요.

          답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - 센서를 준비하는 줄(`dht11 =` 으로 시작)을 찾기
          - "`while True:` 아래 네 줄이 하는 일 말해 보기"
          - 세 문제에 답하고 **확인** 누르기
        code: step1_dht_print.py
        questions:
          - { kind: number, q: "센서에게 몇 초마다 다시 재 달라고 하나요?", answer: 2, hint: "time.sleep 괄호 안 숫자를 봐요" }
          - { kind: choice, q: "DHT11 의 S 선은 몇 번 핀에 꽂아야 하나요?", options: ["13번", "26번", "34번"], answer: 0, hint: "DHT11(Pin(...)) 괄호 안 숫자를 봐요" }
          - { kind: line, q: "센서에게 온도와 습도를 새로 재 달라고 부탁하는 줄의 번호를 클릭하세요", answer: 8 }
        codeNotes:
          - { line: 5, note: "13번 핀에 DHT11 을 준비해요" }
          - { line: 8, note: "센서에게 새로 재 달라고 부탁해요" }
          - { line: 9, note: "받아 둔 온도를 꺼내 출력해요" }
          - { line: 11, note: "다음 측정까지 기다려요" }

      - id: run2
        type: run
        title: 복사 · 실행 2 — 더우면 켜지는 LED
        minutes: 7
        scene:
          image: images/breadboard-basics.svg
          caption: "LED 자리는 2장과 같아요: 26번 핀 → 7번 줄 → 저항 → 12번 줄 긴 다리, 13번 줄 짧은 다리 → − 줄"
        body: |
          이번 코드는 잰 온도를 `t` 에 담고, **기준 온도 28** 과 비교해요. `t >= 28` 은 "t 가 28 과 같거나 큰가?"라는 질문이에요. 참이면 LED를 켜고, 아니면 꺼요.

          실행한 뒤 센서를 손으로 감싸 온도를 올려 보세요. 지금 교실 온도가 28 과 너무 멀다면 공책에 적은 숫자를 보고 **기준을 지금 온도보다 1~2 높게** 바꿔 다시 실행해요.
        todo:
