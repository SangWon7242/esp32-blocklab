      - id: mission
        type: mission
        title: 미션 — 불쾌지수 계산기
        minutes: 9
        scene:
          image: images/discomfort-index.svg
          caption: 온도와 습도를 식에 넣으면 불쾌지수가 나와요. 25℃ · 50% 이면 71.775 로 보통이에요
        body: |
          같은 28℃ 라도 습도가 높으면 더 끈적하고 덥게 느껴져요. 그래서 기상청은 온도와 습도를 함께 넣는 **불쾌지수** 식을 써요. 이번에는 이 수학 식을 코드로 옮겨 봐요.

          식의 T 는 온도, H 는 습도예요. 곱하기 `×` 는 코드에서 `*` 로 써요. **괄호 안을 먼저, 곱하기를 더하기보다 먼저** 계산하는 순서는 수학과 코드가 같아요. 그림의 계산 예로 내 코드가 맞는지 확인할 수 있어요.
        todo:
          - 그림의 식과 계산 예(25℃ · 50% → 71.775)를 공책에 따라 써 보기
          - 온도는 `t`, 습도는 `h` 에 담고 식을 계산해 `di` 에 담기
          - 실행해서 불쾌지수가 나오면 그림의 단계표와 비교하고 **판정** 누르기
        instructions: "온도를 t, 습도를 h 에 담고, 불쾌지수 = 0.81 × T + 0.01 × H × (0.99 × T − 14.3) + 46.3 을 식에 나온 순서 그대로 계산해 di 에 담은 뒤 print(\"불쾌지수:\", di) 로 출력하세요. 재 달라고 부탁하는 줄(measure)과 2초 기다리기는 그대로 두세요"
        hint: "t = dht11.temperature(), h = dht11.humidity() 두 줄을 먼저 만들어요. 식은 계산 블록을 겹쳐 만들고, (0.99 * t - 14.3) 처럼 먼저 계산할 덩어리는 괄호 블록으로 감싸요"
        code: step1_dht_print.py
        rules:
          - codeMatches: '^\s*t\s*=\s*dht11\.temperature\(\)'
            fail: 식의 T 자리에 넣을 온도는 어디에 담아 두었나요? 이름 t 를 붙여 담았나요?
          - codeMatches: '^\s*h\s*=\s*dht11\.humidity\(\)'
            fail: 식의 H 자리에 넣을 습도는 어디에 담아 두었나요? 이름 h 를 붙여 담았나요?
          - codeMatches: '0\.81\s*\*\s*t\b'
            fail: 식의 첫 덩어리 0.81 × T 는 코드로 어떻게 쓸까요? 곱하기는 어떤 기호였나요?
          - codeMatches: '0\.01\s*\*\s*h\s*\*\s*\(\s*0\.99\s*\*\s*t\s*-\s*14\.3\s*\)'
            fail: 0.99 × T − 14.3 은 먼저 계산해야 하는 덩어리예요. 괄호로 묶었나요? 그 덩어리에는 무엇과 무엇을 곱하나요?
          - codeMatches: '\+\s*46\.3\b'
            fail: 식의 맨 끝에 더하는 숫자를 빠뜨리지 않았나요?
          - codeMatches: 'print\(.*\bdi\)'
            fail: 계산한 불쾌지수 di 를 출력 칸에 보여 주는 줄이 있나요?
        answerCode: mission_discomfort.py

      - id: debug
        type: debug
        title: 디버깅 — 온습도계가 이상해요
        minutes: 7
        scene:
          image: images/measure-timing.svg
          caption: 숫자가 그대로면 "재 줘" 부탁을, 오류가 나면 기다리는 시간과 핀 번호를 봐요
        body: |
          고장 난 온습도계 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 숫자가 꿈쩍도 안 하면 "재 줘" 부탁부터, `OSError` 가 나면 기다리는 시간과 핀 번호부터 봐요.

          원리 카드의 "한 선 통신" 설명과 그림을 옆에 두고 시작해요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 숫자가 0 에서 꿈쩍도 안 해요. 손으로 감싸도 그대로예요
            code: "dht11 = dht.DHT11(Pin(13))\n\nwhile True:\n    t = dht11.temperature()\n    print(t)\n    time.sleep(2)"
            question: "temperature() 는 센서에게 \"지금 재 줘\" 하고 부탁하는 줄일까요, 받아 둔 숫자를 꺼내기만 하는 줄일까요? 새로 재 달라는 부탁은 어디에 있나요?"
            rules:
              - codeMatches: 'dht11\.measure\(\)\n\s*t\s*=\s*dht11\.temperature\(\)'
                fail: 온도를 꺼내기 전에 센서가 먼저 해야 할 일은 무엇일까요? 그 줄은 몇 번째에 와야 할까요?
          - title: "몇 번 출력하다가 OSError: [Errno 116] ETIMEDOUT 이 나며 멈춰요"
            code: "dht11 = dht.DHT11(Pin(13))\n\nwhile True:\n    dht11.measure()\n    print(dht11.temperature())\n    time.sleep(0.1)"
            question: 0.1초마다 재 달라고 하면 센서는 쉴 틈이 있을까요? DHT11 은 한 번 잰 뒤 얼마나 쉬어야 했나요?
            rules:
              - codeMatches: 'time\.sleep\([1-9]\d*(\.\d+)?\)'
                fail: 기다리는 시간이 센서가 한 번 잰 뒤 쉬어야 하는 시간보다 긴가요?
          - title: 배선을 바꿔 꽂았더니 measure() 줄에서 OSError 가 나요
            code: "dht11 = dht.DHT11(Pin(34))\n\nwhile True:\n    dht11.measure()\n    print(dht11.temperature())\n    time.sleep(2)"
            question: S11 에서 조도 센서를 꽂던 34번은 값을 받기만 하는 핀이었어요. 보드가 "재 줘" 신호를 보내야 하는 DHT11 에 맞을까요? 배선도에서 S 선은 몇 번 핀으로 가나요?
            rules:
              - pinIs: { name: dht11, pin: 13 }
                fail: 배선도에서 S 선은 몇 번 핀으로 가나요? 그 핀은 신호를 보내고 받을 수 있는 핀인가요?

      - id: design
        type: design
        title: 설계 — 불쾌지수 알리미
        minutes: 8
        scene:
          image: images/discomfort-index.svg
          caption: 불쾌지수가 75 이상이면 "높음"이에요. 그때 LED로 알려 주면 어떨까요?
        body: |
          온도만 보는 알리미는 축축한 날을 놓쳐요. 이번에는 미션에서 만든 **불쾌지수**로 판단하는 알리미를 설계해요. 불쾌지수가 **75 이상**(높음)이면 LED를 켜고, 아니면 꺼요.

          먼저 우리말 설계도의 빈칸을 채우고, 번역표로 우리말 한 줄이 어떤 코드가 되는지 짝지어 봐요. 그다음 섞인 블록을 설계도 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 우리말 한 줄이 어떤 코드가 되는지 짝지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 온습도 센서를 __번 핀에 준비한다
            blank: { answer: 13 }
          - text: LED를 26번 핀에 준비한다
          - text: 끝없이 되풀이한다
          - text: "  ↳ 센서에게 새로 재 달라고 부탁한다"
          - text: "  ↳ 온도를 t, 습도를 h 에 담는다"
          - text: "  ↳ 불쾌지수 식으로 계산해 di 에 담고 출력한다"
          - text: "  ↳ di 가 __ 이상이면 LED를 켠다"
            blank: { answer: 75 }
          - text: "  ↳ 아니면 LED를 끈다"
          - text: "  ↳ __초 기다린다"
            blank: { answer: 2 }
        translation:
          - ["온습도 센서 준비 (13번)", "dht11 = dht.DHT11(Pin(13))"]
          - ["재 달라고 부탁한다", "dht11.measure()"]
          - ["온도를 t, 습도를 h 에", "t = dht11.temperature() · h = dht11.humidity()"]
          - ["불쾌지수 식", "di = 0.81 * t + 0.01 * h * (0.99 * t - 14.3) + 46.3"]
          - ["di 가 75 이상이면", "if di >= 75:"]
          - ["초 기다린다", "time.sleep(초)"]
        targetCode: design_comfort.py

