            blank: { answer: 10000 }
          - text: i 를 0부터 1022까지 하나씩 키우며 되풀이한다
          - text: "  ↳ 세기를 i 로 정한다"
          - text: "  ↳ __밀리초 기다린다"
            blank: { answer: 1 }
          - text: i 를 0부터 1022까지 다시 하나씩 키우며 되풀이한다
          - text: "  ↳ 세기를 __ − i 로 정한다"
            blank: { answer: 1023 }
          - text: "  ↳ 1밀리초 기다린다"
        translation:
