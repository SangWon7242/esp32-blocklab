# 교과 융합 트랙 F11 · 우리 교실 재난 알리미 — 원본: 아두이노 심화 W04(재난 감지 앱: 불꽃·DHT11·기울기·버튼·부저, 상태 문자 전송과 출구 부저 명령), 센서 트랙 S9(12-melody-buzzer) · S12(15-temp-humidity) · S13(16-tilt-pir) · S22(25-web-led). 형식 설명은 src/track/README.md
id: 38-disaster-alarm
order: 38
track: fusion
label: F11
prerequisites: [12-melody-buzzer, 15-temp-humidity, 16-tilt-pir, 25-web-led]
subjects: [사회, 과학, 국어]
sdg: [11, 13]
sessions: 2
teacherNotes: |
  **핀 번호** 불꽃 센서 S 는 **34번**(WiFi 를 켜면 ADC2 쪽 핀(0 · 2 · 4 · 12~15 · 25~27)은 아날로그 값을 못 읽으므로 32~39 가운데 고른다), DHT11 S 13번(S12 와 같음), 틸트 스위치 14번(S13 과 같은 풀업 회로: 3V3 — 10kΩ — 14번 — 틸트 스위치 — GND, 기울면 1), 위치 버튼 27번(풀업, 누르면 0), 수동 부저 + 25번(S9 와 같음. ESP32 Plus 확장 보드에는 io15 가 없어 원본의 15번에서 옮겼다). 다섯 장치의 핀이 겹치지 않는다. 버튼은 14번이 아니라 27번인 것에 주의(14번은 틸트가 쓴다).

  **안전** 라이터 · 촛불은 쓰지 않는다. 불꽃 센서는 760~1100nm 적외선을 보므로 키트의 **IR 리모컨**을 센서 쪽으로 향해 누르면 값이 크게 올라 불꽃처럼 시험할 수 있다(원본 수업의 발표자 노트에도 있는 방법). 화재 조건의 온도(27)는 손으로 DHT11 을 감싸 쥐면 몇 초 뒤 올라간다. 지진은 센서가 붙은 브레드보드를 손으로 흔들거나 기울인다. 배선은 USB 를 뺀 채로 한다.

  **기준값은 예시** 불꽃 기준 1500 과 온도 기준 27 은 예시다. 1차시 실행에서 평소 불꽃 값(교실 조명 · 창가 햇빛에 따라 수십~수백), 리모컨을 비췄을 때 값(수천)을 공책에 적고, 그 **둘 사이**로 기준을 다시 정하게 한다. 창가에서 햇빛만으로 값이 많이 오르면 디버깅 증상 1 의 실제 사례가 된다. 판정(미션 · 디버깅)은 불꽃 기준이 1000 이상 네 자리면 통과하므로 교실에서 정한 값으로 바꿔도 된다.

  **DHT11** `measure()` 는 1초에 한 번보다 자주 부르면 `OSError: [Errno 116] ETIMEDOUT` 이 난다. 1부 코드는 1초마다, 2부는 요청이 올 때(폰 페이지 새로고침 2초)마다 잰다. 값은 정수 · 오차 ±2℃.

  **WiFi** 2부 코드의 `"MyWiFi"` · `"12345678"` 을 교실 공유기 이름 · 비밀번호로 바꾼다. 학교 WiFi 가 폰 ↔ 보드 통신을 막으면 WiFi 준비 블록을 **공유기 모드**(`ip = wifi_ap("ESP32-LAB", "12345678")`)로 바꾸고 폰을 그 WiFi 에 붙인다. 보드가 출력하는 IP 주소(`IP: 192.168.x.x`)를 폰 브라우저 주소창에 친다. 폰과 보드는 같은 WiFi 에 있어야 한다. 2부 코드는 `web_accept` 에서 폰 요청을 기다리므로 **폰이 페이지를 읽을 때(2초마다)만 한 바퀴** 돈다. 폰 페이지를 닫아 두면 경보음도 멈춘다는 점을 학생과 이야기해 볼 거리다.

  **앱 만들기(AI)** 학생 AI 계정 · 연령 정책에 따라 교사가 프롬프트를 복사해 AI 에 넣고 결과를 보여 주는 시연으로 바꿀 수 있다. AI 결과에 외부 CDN · 스크립트가 섞이면 붙여넣기 검사가 걸러 준다. 보드 저장은 보드가 없어도 건너뛸 수 있다(미리 보기로 모양만 확인). 보드에 `index.html` 을 저장한 뒤에는 실행 3 코드(`step3_web_app.py`)가 돌아야 `/` 에서 앱이 열린다.

  **역할극** 학생 한 명이 "교실", 한 명이 "복도의 선생님(폰)" 이 되어, 리모컨(불꽃) · 흔들기(지진) · 버튼(위치) 을 차례로 일으키고 폰 화면과 부저가 어떻게 바뀌는지 말로 보고한다. 국어와 묶어 경보 문구("FIRE" 대신 "3층 과학실 화재 — 대피") 를 짧고 분명하게 고쳐 쓰게 한다.

  **교과 · 단원 연결**

  - 사회: 자연재해와 안전(지진 · 화재 대피 절차), 우리 학교 대피 지도 만들기, 재난 문자 체계
  - 과학: 연소의 조건(탈 물질 · 산소 · 발화점 — 열이 있어야 불), 적외선(눈에 안 보이는 빛, 리모컨 · 불꽃 센서), 지진과 진동 · 진도
  - 국어: 짧고 명확한 경보 문구 쓰기, 상황 보고 말하기
  - SDG 11(안전한 도시와 공동체) · SDG 13(기후 변화 대응): 폭염 · 화재 같은 재난이 늘어나는 까닭과 조기 경보

  **메이킹** 박스지로 작은 교실 모형을 만들고 불꽃 센서를 "콘센트 자리", 틸트를 "책장 위", 위치 버튼을 "출입문 옆" 에 붙인다. 종이컵에 구멍을 내어 부저 울림통으로 쓰면 소리가 커진다. 대피 경로도를 함께 그려 "출구" 버튼이 어느 문을 가리키는지 정한다.

  **차시 나누기**

  - 1차시: 문제 · 조건 분석 · 예측 · 실행 1 · 읽기 체크 1 · 통합 미션(부저 더하기)
  - 2차시: 실행 2(폰 상태판) · 읽기 체크 2 · 디버깅 · 설계 · 실행 3(앱용 서버) · 앱 만들기 · 성찰
  - 시간이 모자라면 디버깅 증상 3 과 설계를 앱 만들기 뒤로 미루거나 숙제로 돌린다
title: 우리 교실 재난 알리미
subtitle: 불꽃 · 온도 · 흔들림 · 위치 버튼을 묶어 부저와 폰 상태판으로 알리기
summary: |
  불이 나거나 건물이 흔들릴 때, 교실에 없는 선생님 폰으로 어떻게 바로 알릴까요? 오늘은 **불꽃 센서 · DHT11 · 틸트 스위치 · 버튼** 네 입력을 읽어 **화재 > 지진 > 위치 > 평소** 순서로 상태를 정하고, 급한 상태에서는 **부저**를 울려요.
  2부에서는 **WiFi 웹서버**로 폰에 상태판 페이지를 보내고, 폰의 "출구 알리기" 버튼으로 교실 부저를 울려요. 마지막에는 AI 와 함께 내 폰 앱을 만들어 보드에 올려요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결. WiFi 가 들어 있어요 }
  - { name: 불꽃 센서 모듈, note: "핀 3개: G · V · S. 적외선을 보는 검은 센서. V 는 3V3, S 는 34번 핀으로" }
  - { name: 온습도 센서(DHT11), note: "핀 3개: G · V · S. S 는 13번 핀으로" }
  - { name: 틸트 스위치, note: "다리 2개. 안의 쇠구슬이 흔들리면 움직여요. 브레드보드에 꽂고 10kΩ 저항과 함께 14번으로" }
  - { name: 10kΩ 저항, note: "갈색-검정-주황 띠. 틸트 스위치와 14번 핀 사이 줄 → 3V3" }
  - { name: 버튼(푸시 버튼), note: 다리가 네 개. 가운데 홈에 걸쳐 꽂아요. 위치 버튼으로 써요(27번) }
  - { name: 수동 부저, note: 초록 판이 보이는 쪽. 음 높이를 정할 수 있어요. + 다리는 25번 핀으로 }
  - { name: IR 리모컨, note: 불꽃 대신 센서를 시험하는 데 써요. 라이터는 쓰지 않아요 }
  - { name: 브레드보드, note: "틸트 스위치 · 버튼 · 부저를 꽂고, + 줄(3V3) · − 줄(GND)을 함께 써요" }
  - { name: F-F 듀폰선 4가닥, board: plus, note: "DHT11 G · V · S → io13 기둥, 불꽃 센서 S → 아래 줄 io34" }
  - { name: M-F 듀폰선 7가닥, board: plus, note: "3V3 · GND · 불꽃 V · G → + − 줄, io14 · io27 · io25 → 브레드보드" }
  - { name: 점퍼선(M-M) 5가닥, board: plus, note: "10kΩ · 틸트 · 부저 − · 버튼 대각선 다리 → + − 줄, 두 − 줄 잇기" }
  - { name: F-F 듀폰선 2가닥, board: devkit, note: "DHT11 S → D13, 불꽃 센서 S → D34" }
  - { name: M-F 듀폰선 9가닥, board: devkit, note: "3V3 · GND · DHT11 V · G · 불꽃 V · G → + − 줄, D14 · D27 · D25 → 브레드보드" }
  - { name: 점퍼선(M-M) 6가닥, board: devkit, note: "10kΩ · 틸트 · 부저 − · 버튼 대각선 다리 → + − 줄, + 끼리 · − 끼리 잇기" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
  - { name: 폰 또는 태블릿, note: 2부에서 보드와 같은 WiFi 에 붙여 상태판을 열어요 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "브레드보드는 보드 아래. 아래 줄 3V3 → 위 + 줄, 아래 줄 GND → 위 − 줄, 두 − 줄은 점퍼로. DHT11 G · V · S → io13 기둥 G · V · S (F-F 로 바로). 불꽃 센서 V · G → + − 줄, S → 아래 줄 io34. 10kΩ 은 9 · 12번 줄, 틸트 스위치는 12 · 14번 줄: 9번 줄 → + 줄, 12번 줄 ← io14, 14번 줄 → − 줄. 버튼은 가운데 홈에 걸쳐 6 · 8번 줄: io27 → 6번 줄, 대각선 다리 8번 줄 → 아래 − 줄. 수동 부저 + 다리 2번 줄 ← io25, − 다리 4번 줄 → − 줄. io14 · io27 · io25 세 선은 보드 바깥으로 돌아 와요"
  captionDevkit: "브레드보드는 보드 위. GND → 아래 − 줄, 3V3 → 보드 바깥으로 돌아 아래 + 줄, 위 · 아래 + 줄끼리 · − 줄끼리 점퍼로. DHT11 V · G → 위 + − 줄, S → D13. 불꽃 센서 V · G → 아래 + − 줄, S → D34. 틸트 스위치는 6 · 8번 줄, 10kΩ 은 8 · 11번 줄: 8번 줄 ← D14, 11번 줄 → + 줄, 6번 줄 → − 줄. 버튼은 가운데 홈에 걸쳐 12 · 14번 줄: D27 → 14번 줄, 대각선 다리 12번 줄 → 위 − 줄. 수동 부저 + 다리 16번 줄 ← D25, − 다리 18번 줄 → − 줄"
principle:
  image: images/fire-two-conditions.svg
  body: |
    물질이 타려면 **탈 물질 · 산소 · 발화점 이상의 열** 세 가지가 함께 있어야 해요. 그래서 불이 나면 빛(불꽃)과 함께 **뜨거운 열**이 나요. 불꽃 센서는 눈에 안 보이는 **적외선**(760~1100nm)을 보는 눈이라, 햇빛이나 리모컨의 적외선에도 값이 올라가요. 불꽃 값 하나만 믿으면 오경보가 나기 때문에 **온도까지 함께(and)** 봐요.

    지진은 땅이 흔들리는 **진동**이에요. 틸트 스위치는 바로 서 있으면 안의 작은 쇠구슬이 두 다리를 이어 14번이 GND(0)에 붙고, 흔들리거나 기울면 구슬이 떨어져 10kΩ 저항이 3V3 쪽으로 끌어올려 1 이 돼요(16장과 같은 풀업 회로). 수동 부저는 얇은 판을 전기로 빠르게 떨게 해서(피에조 효과) 소리를 내고, 떨리는 빠르기(Hz)가 음 높이가 돼요.

    위치 버튼은 사람이 직접 누르는 입력이에요. 화재 · 지진 · 위치 가운데 **급한 것부터** 묻는 if · elif 사슬이 재난 알리미의 심장이에요.
goals:
  content: 불꽃 · 온습도 · 틸트 · 버튼 네 입력으로 우선순위 상태(FIRE · QUAKE · HERE · OK)를 정해 부저로 알리고, WiFi 웹서버로 폰에 상태판을 보내며 폰 버튼으로 부저를 울린다
  thinking: 재난 알리미를 알아야 할 것 · 정해야 할 것 · 움직여야 할 것으로 나누고, 두 조건을 and 로 묶는 까닭(오경보)과 급한 것을 먼저 묻는 까닭(우선순위)을 코드의 if · elif 순서로 설명한다
successCriteria:
  - 불꽃 값과 온도를 and 로 묶어야 오경보가 줄어드는 까닭을 연소의 조건으로 설명할 수 있다
  - if · elif · else 사슬에서 가장 급한 상태를 맨 위에 두고, 순서를 바꾸면 무엇이 가려지는지 말할 수 있다
  - 상태가 FIRE · QUAKE 일 때만 부저가 울리고 끝나면 꺼지게 코드를 고칠 수 있다
  - 폰 브라우저로 상태판을 열어 상태를 읽고, 출구 버튼으로 교실 부저를 울릴 수 있다
  - AI 가 만든 앱 코드에서 /data 와 /cmd?exit=1 을 쓰는 줄을 찾고 틀린 곳을 검사로 잡을 수 있다
parts:
  - id: part1
    title: 1부 · 재난 상태 정하기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 교실에 없는 선생님에게 어떻게 알릴까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 불이 나거나 건물이 흔들릴 때, 복도에 있는 선생님 폰에 바로 알리려면?
        body: |
          학교에서는 해마다 화재 · 지진 대피 훈련을 해요. 그런데 진짜 재난은 선생님이 교실에 없을 때 올 수도 있어요. 폭염 · 산불 같은 재난이 늘어나는 요즘, 도시와 학교를 안전하게 지키려면 **빨리 알아채고 빨리 알리는** 장치가 필요해요.

          오늘 만들 알리미는 센서 넷으로 상황을 알아채고, 부저와 폰 화면으로 알려요. 그런데 불꽃 센서에 불꽃이 보였다고 바로 "화재" 라고 해도 될까요? 코드를 보기 전에 질문마다 내 생각을 한두 문장으로 적어 봐요.
        todo:
          - 준비물(ESP32 보드, 불꽃 센서, DHT11, 틸트 스위치, 버튼, 수동 부저, 브레드보드, 선, IR 리모컨)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장씩 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 불꽃 센서에 불꽃이 보였는데 교실 온도는 낮아요. 화재일까요? 아니라면 무엇일 수 있을까요?
          - 화재와 지진이 동시에 일어났다면 선생님에게 어느 것을 먼저 알려야 할까요? 그 까닭은?
          - 교실에 없는 선생님에게 지금 상황을 알리는 방법에는 무엇이 있을까요? 폰으로 알린다면 화면에 무엇이 보여야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별 세 칸 보드
        minutes: 5
        scene:
