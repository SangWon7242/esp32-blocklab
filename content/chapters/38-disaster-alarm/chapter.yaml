            question: 출력을 보니 평소 불꽃 값이 300쯤이고 햇빛이 들면 600 까지 올라요. 기준 100 은 평소 값보다 큰가요, 작은가요? 공책에 적은 리모컨 값과 평소 값 사이 어디쯤으로 기준을 올려야 할까요?
