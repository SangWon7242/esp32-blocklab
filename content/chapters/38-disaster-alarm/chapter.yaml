        body: |
          알리미에는 입력이 넷(불꽃 · 온도 · 기울어짐 · 버튼), 출력이 둘(부저 · 폰 상태판)이에요. 센서가 **알아내고**, 사람이 **기준과 순서를 정해 주면**, 부저와 화면이 **움직여요**. 센서마다 어느 칸에 들어갈지 생각하며 나눠 봐요.

