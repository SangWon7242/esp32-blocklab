      - id: app
        type: app
        title: 폰 앱 만들기 — AI 와 함께 상태판 앱
        minutes: 20
        scene:
          image: images/alarm-web.svg
          caption: 화면 설계 → 약속표 → 프롬프트 → AI 결과 붙여넣기 · 검사 → 보드에 저장 → 읽기 체크
        body: |
          이제 내 폰 앱을 만들어요. 먼저 화면에 **보여 줄 값**, **누를 버튼**, **바뀌는 모습**을 설계 칸에 적어요. 약속표에는 실행 3 코드가 내는 주소 두 개가 있어요: 읽기 `/data`(state, temp), 명령 `/cmd?exit=1`.

          프롬프트를 복사해 AI 에 넣고, 돌아온 HTML 을 그대로 붙여 **검사**를 눌러요. 외부 스크립트 · 절대 주소가 섞이면 검사가 알려 주니 AI 에게 "외부 라이브러리 없이, 상대 주소로" 라고 다시 부탁해요. 통과하면 보드에 `index.html` 로 저장하고 폰에서 `/` 를 열어요.

          국어 시간처럼 경보 문구를 생각해 봐요. "FIRE" 보다 "화재 — 즉시 대피" 가 더 분명한가요? 바뀌는 모습 칸에 적어 AI 에게 부탁해 봐요.
        todo:
          - 설계 칸 세 개에 한 줄씩 적고 프롬프트 복사하기
          - AI 가 준 HTML 을 붙여 넣고 **검사** 통과시키기 (걸리면 AI 에게 고쳐 달라고 하기)
          - 보드에 저장한 뒤 폰에서 열어 보고, 읽기 체크에 답하기
        api:
          - { path: "/data", method: "읽기", fields: ["state", "temp"], note: "2초마다 읽기. state 는 FIRE · QUAKE · HERE · OK 가운데 하나(글), temp 는 온도(숫자)" }
          - { path: "/cmd?exit=1", method: "명령", note: "출구 알리기 — 교실 부저를 1초 울리기" }
        design:
          show: ["상태", "온도"]
          buttons: ["출구 알리기"]
          changes: ["FIRE 면 빨강, QUAKE 면 노랑", "HERE 면 파랑, OK 면 초록"]
        promptTemplate: |
          ESP32 주소 {{ip}} 에서 {{data}} 를 2초마다 읽어 {{show}} 을(를) 폰 화면에 크게 보여 주고,
          버튼 {{buttons}} 을(를) 누르면 {{commands}} 를 요청하는 한 파일짜리 HTML 을 만들어 줘.
          {{changes}} 처럼 state 값에 따라 화면 배경색과 경보 문구를 바꿔 줘. 경보 문구는 짧고 분명하게.
          외부 라이브러리 · 외부 스크립트 · 절대 주소 없이, 폰 화면에 맞게.
        checks:
          maxBytes: 12000
          mustUse: ["exit=1"]
        readcheck:
          - { kind: choice, q: "/data 에서 값을 가져오는 줄에 쓰인 것은?", options: ["fetch", "print", "import"], answer: 0, hint: "주소에 요청을 보내 답을 받는 자바스크립트 함수" }
          - { kind: choice, q: "출구 알리기 버튼을 누르면 어느 주소로 요청을 보내야 하나요?", options: ["/cmd?exit=1", "/data", "/index.html"], answer: 0, hint: "약속표의 명령 주소" }
          - { kind: text, q: "state 가 FIRE 일 때 색을 바꾸는 줄을 찾아 적어 보세요. AI 결과에 틀린 곳이 있었다면 어떻게 찾았나요?" }

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 4
        scene:
          image: images/fire-two-conditions.svg
          caption: 불꽃만으로는 화재라고 하지 않았어요. 오경보를 줄이는 것도 알리미의 중요한 일이에요
        body: |
