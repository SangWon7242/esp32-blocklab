        symptoms:
          - title: "리모컨을 누르지 않았는데 더운 날 오후 창가에서 자꾸 FIRE 가 떠요"
            code: |
              from machine import Pin, ADC
              import time
              import dht

              flame = ADC(Pin(34))
              flame.atten(ADC.ATTN_11DB)
              flame.width(ADC.WIDTH_12BIT)
              dht11 = dht.DHT11(Pin(13))

              while True:
                  dht11.measure()
                  t = dht11.temperature()
