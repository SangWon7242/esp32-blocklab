          - title: "책상을 흔들면서 리모컨을 비추고 온도도 올렸는데 QUAKE 만 뜨고 FIRE 는 안 떠요"
            code: |
              from machine import Pin, ADC
              import time
              import dht

              flame = ADC(Pin(34))
              flame.atten(ADC.ATTN_11DB)
              flame.width(ADC.WIDTH_12BIT)
              dht11 = dht.DHT11(Pin(13))
              tilt = Pin(14, Pin.IN)

              while True:
                  dht11.measure()
                  t = dht11.temperature()
                  f = flame.read()
                  if tilt.value() == 1:
                      state = "QUAKE"
                  elif f >= 1500 and t >= 27:
                      state = "FIRE"
                  else:
                      state = "OK"
                  print(state)
                  time.sleep(1)
            question: 위에서부터 차례로 물을 때 지진 칸이 먼저 참이 되면 그 아래 화재 칸은 확인할까요? 지진이 나는 동안 불도 났다면 어느 것을 먼저 알려야 하나요? 그 칸은 어디에 있어야 할까요?
            rules:
              - codeMatches: 'if\s+f\s*>=\s*\d+\s+and\s+t\s*>=\s*\d+\s*:\n\s+state\s*=\s*"FIRE"\n\s+elif\s+tilt\.value\(\)\s*==\s*1\s*:\n\s+state\s*=\s*"QUAKE"'
                fail: 화재 조건이 사슬의 맨 위 if 에 있고, 지진은 그다음 elif 인가요? 더 급한 것이 위에 있어야 가려지지 않아요
          - title: "상태가 OK 인데도 부저가 1초마다 계속 삐 울려요"
            code: |
              from machine import Pin, PWM
              import time

              tilt = Pin(14, Pin.IN)
              beeper = PWM(Pin(25))
              beeper.freq(440)
              beeper.duty(0)

              while True:
                  if tilt.value() == 1:
                      state = "QUAKE"
                  else:
                      state = "OK"
                  print(state)
                  beeper.freq(880)
                  beeper.duty(512)
                  time.sleep(0.5)
                  beeper.duty(0)
                  time.sleep(1)
            question: 부저를 울리는 네 줄(freq → duty → 기다리기 → duty 0)은 어떤 조건 안에 있나요, 아니면 매 바퀴 그냥 실행되나요? 어떤 상태일 때만 울려야 하나요?
            rules:
              - codeMatches: 'if\s+state\s*(?:==\s*"QUAKE"|!=\s*"OK")\s*:\n\s+beeper\.freq\(\d+\)\n\s+beeper\.duty\(512\)\n\s+time\.sleep\([\d.]+\)\n\s+beeper\.duty\(0\)'
                fail: 부저를 울리는 네 줄이 상태를 묻는 if 안으로 들어갔나요? OK 일 때는 울리지 않아야 해요

