<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="da-chain-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="da-chain-title">우선순위 사슬. if 불꽃 and 온도 → FIRE, elif 기울었다 → QUAKE, elif 버튼 눌림 → HERE, else → OK. 위에서부터 차례로 묻고 참인 첫 칸 하나만 실행한다. 급한 것(화재)을 가장 위에 둔다</title>
  <defs>
    <marker id="da-chain-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <text x="24" y="36" font-size="16" font-weight="700" fill="currentColor" stroke="none">위에서부터 묻고, 참인 첫 칸 하나만 실행해요</text>
  <!-- 조건 칸 넷 -->
  <g stroke-width="2">
    <rect x="40" y="60" width="300" height="48" rx="10" fill="var(--card)"/>
    <rect x="40" y="128" width="300" height="48" rx="10" fill="var(--card)"/>
    <rect x="40" y="196" width="300" height="48" rx="10" fill="var(--card)"/>
    <rect x="40" y="264" width="300" height="48" rx="10" fill="var(--card)"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="56" y="80" font-weight="700">if</text>
    <text x="80" y="80">불꽃 값 ≥ 1500 <tspan font-weight="700">and</tspan> 온도 ≥ 27</text>
    <text x="56" y="98" font-size="12" fill-opacity="0.7">가장 급한 것부터</text>
    <text x="56" y="148" font-weight="700">elif</text>
    <text x="92" y="148">틸트 스위치가 기울었다</text>
    <text x="56" y="166" font-size="12" fill-opacity="0.7">화재가 아닐 때만 물어요</text>
    <text x="56" y="216" font-weight="700">elif</text>
    <text x="92" y="216">위치 버튼이 눌렸다</text>
    <text x="56" y="234" font-size="12" fill-opacity="0.7">화재 · 지진이 아닐 때만</text>
    <text x="56" y="284" font-weight="700">else</text>
    <text x="56" y="302" font-size="12" fill-opacity="0.7">위가 모두 거짓이면</text>
  </g>
  <!-- 결과 상태 -->
  <g stroke="none">
    <rect x="400" y="60" width="130" height="48" rx="10" fill="#e03131" fill-opacity="0.85"/>
    <rect x="400" y="128" width="130" height="48" rx="10" fill="#f59f00" fill-opacity="0.85"/>
    <rect x="400" y="196" width="130" height="48" rx="10" fill="#1971c2" fill-opacity="0.8"/>
    <rect x="400" y="264" width="130" height="48" rx="10" fill="#2f9e44" fill-opacity="0.8"/>
  </g>
  <g fill="#ffffff" stroke="none" text-anchor="middle" font-size="16" font-weight="700">
    <text x="465" y="90">FIRE</text>
    <text x="465" y="158">QUAKE</text>
    <text x="465" y="226">HERE</text>
    <text x="465" y="294">OK</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="12" fill-opacity="0.75">
    <text x="542" y="88">화재</text>
    <text x="542" y="156">지진</text>
    <text x="542" y="224">위치</text>
    <text x="542" y="292">평소</text>
  </g>
  <!-- 참 화살표 -->
  <g marker-end="url(#da-chain-arrow)">
    <path d="M340 84 H392"/>
    <path d="M340 152 H392"/>
    <path d="M340 220 H392"/>
    <path d="M340 288 H392"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" fill-opacity="0.7" text-anchor="middle">
    <text x="366" y="78">참</text>
    <text x="366" y="146">참</text>
    <text x="366" y="214">참</text>
  </g>
  <!-- 거짓 화살표 (아래로) -->
  <g marker-end="url(#da-chain-arrow)" stroke-dasharray="4 4">
    <path d="M190 108 V122"/>
    <path d="M190 176 V190"/>
    <path d="M190 244 V258"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" fill-opacity="0.7">
    <text x="198" y="120">거짓</text>
    <text x="198" y="188">거짓</text>
    <text x="198" y="256">거짓</text>
  </g>
  <text x="24" y="344" font-size="12" fill="currentColor" fill-opacity="0.75" stroke="none">흔들리는 동안 불이 났다면? 지진 칸이 위에 있으면 화재를 가려 버려요. 그래서 화재가 맨 위</text>
</svg>
