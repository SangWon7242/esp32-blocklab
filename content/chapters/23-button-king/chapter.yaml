      - id: mission
        type: mission
        title: 미션 — 짧게는 빨강, 길게는 파랑
        minutes: 8
        scene:
          image: images/press-timeline.svg
          caption: "누른 시간 held 를 기준 500 ms 와 비교해요. 짧으면 빨강, 같거나 길면 파랑"
        body: |
          이제 누른 시간으로 명령을 나눠요. **500 ms 보다 짧게** 누르면 RGB LED 를 빨강으로, **500 ms 이상 길게** 누르면 파랑으로 켜요.

          먼저 RGB LED 를 쓸 준비가 필요해요. 그다음 `held` 를 구한 바로 뒤에서 기준과 비교하면 돼요. 판정이 끝나면 500 을 내가 공책에 적은 기준으로 바꿔 시험해 봐도 좋아요.
        todo:
          - "RGB LED 준비 블록을 넣고 핀(빨강 27 · 초록 25 · 파랑 26)을 배선도와 맞추기"
          - "`held` 가 500 보다 작으면 빨강, 아니면 파랑을 켜는 조건 넣기"
          - 톡 치기 · 꾹 누르기로 시험해 본 뒤 **판정** 누르기
        instructions: 버튼을 500 ms 보다 짧게 눌렀다 떼면 RGB LED 가 빨강, 500 ms 이상 길게 눌렀다 떼면 파랑으로 켜지게 바꿔 주세요. 누른 시간을 출력 창에 찍는 줄은 그대로 두어도 돼요
        hint: LED 카테고리의 RGB LED 준비 블록을 맨 위에 놓아요. held 를 구한 줄 아래에 "만약 held < 500 이면 RGB 색 빨강, 아니면 RGB 색 파랑" 을 넣어요. 빨강은 (255, 0, 0), 파랑은 (0, 0, 255) 예요
        code: step1_press_time.py
        rules:
          - codeMatches: '^red = PWM\(Pin\(27\)\)$'
            fail: RGB LED 를 쓸 준비가 되어 있나요? 빨강 · 초록 · 파랑 다리는 각각 몇 번 핀에 이어져 있나요?
          - codeMatches: '^\s+if .+ (<|<=|>|>=) 500:$'
            fail: 몇 ms 를 기준으로 짧게와 길게를 나누기로 했나요? 누른 시간을 그 기준과 비교하는 조건이 있나요?
          - codeMatches: 'if .+ <=? 500:\n\s+set_color\(255, 0, 0\)|if .+ >=? 500:\n(\s+.*\n)*?\s+else:\n\s+set_color\(255, 0, 0\)'
            fail: 500 ms 보다 짧게 눌렀을 때는 어느 갈래로 가나요? 그 갈래에서 켜는 색은 무엇인가요?
          - codeMatches: 'if .+ >=? 500:\n\s+set_color\(0, 0, 255\)|if .+ <=? 500:\n(\s+.*\n)*?\s+else:\n\s+set_color\(0, 0, 255\)'
            fail: 500 ms 이상 길게 눌렀을 때는 어느 갈래로 가나요? 그 갈래에서 켜는 색은 무엇인가요?
        answerCode: mission_short_long.py

      - id: debug
        type: debug
        title: 디버깅 — 이상한 버튼 왕 세 개
        minutes: 6
        scene:
          image: images/bounce-signal.svg
          caption: 실제 버튼은 누를 때와 뗄 때 몇 ms 동안 0 · 1 이 떨려요
        body: |
          고장 난 코드 세 개가 있어요. 셋 다 빨간 글씨(에러)는 뜨지 않고 **이상하게만** 굴어요. 바로 고치지 말고, 증상을 보고 시간표를 그려 보며 어디가 문제인지 먼저 정해요.

          시간 문제는 **언제** 재고, **언제** 판정하는지를 따라가면 보여요. 최소 3분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 두 번 톡톡 눌렀는데 "한 번" 이 두 번 찍혀요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)

              clicks = 0
              while True:
                  if button.value() == 0:
                      while button.value() == 0:
                          time.sleep(0.01)
                      time.sleep(0.05)
                      clicks = clicks + 1
                      if clicks == 1:
                          print("한 번")
                      else:
                          print("두 번")
                      clicks = 0
                  time.sleep(0.01)
            question: 첫 클릭을 떼는 순간, 두 번째 클릭이 올지 보드는 알고 있나요? 이 코드는 언제 판정하고, 그때 clicks 는 늘 몇일까요?
            rules:
              - codeMatches: '^\s+\w+ = time\.ticks_ms\(\)$'
                fail: 마지막 클릭을 뗀 시각을 어딘가에 적어 두었나요? 그래야 "그 뒤로 얼마나 지났나"를 잴 수 있어요.
              - codeMatches: 'time\.ticks_diff\(time\.ticks_ms\(\), \w+\) (>|>=) \d+'
                fail: 판정을 언제 하나요? 마지막 클릭 뒤 몇 ms 동안 조용히 기다렸다가 판정하고 있나요?
          - title: 선생님 보드는 며칠 켜 두었더니 누른 시간이 -1073741000 처럼 이상하게 나왔대요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)

              while True:
                  if button.value() == 0:
                      start = time.ticks_ms()
                      while button.value() == 0:
                          time.sleep(0.01)
                      held = time.ticks_ms() - start
                      print(held)
                  time.sleep(0.01)
            question: time.ticks_ms() 는 끝없이 커질까요? 시계가 한 바퀴 돌아 다시 0 부터 세기 시작한 직후에 "지금 − 시작" 을 하면 어떻게 될까요? 시각끼리 빼라고 따로 만든 블록은 무엇이었나요?
            rules:
              - codeMatches: '^\s+\w+ = time\.ticks_diff\(time\.ticks_ms\(\), \w+\)$'
                fail: 누른 시간을 구하는 줄이 여전히 그냥 빼기인가요? 원리 카드에서 시각끼리 뺄 때 쓴다고 한 것을 찾아보세요.
          - title: 한 번만 눌렀는데 가끔 2 가 찍혀요
            code: |
              from machine import Pin
              import time

              button = Pin(14, Pin.IN, Pin.PULL_UP)

              clicks = 0
              last = time.ticks_ms()
              while True:
                  if button.value() == 0:
                      while button.value() == 0:
                          time.sleep(0.01)
                      clicks = clicks + 1
                      last = time.ticks_ms()
                  if clicks > 0 and time.ticks_diff(time.ticks_ms(), last) > 400:
                      print(clicks)
                      clicks = 0
                  time.sleep(0.01)
            question: 손을 떼는 순간 버튼 값이 몇 ms 동안 0 · 1 로 떨리면, 바깥 반복은 다음 바퀴에서 무엇을 보게 될까요? 장면 그림의 "실제 버튼 값"을 따라가 보세요.
            rules:
              - codeMatches: '^ {4}( {4})?time\.sleep(\(0\.(0[3-9]|1)\d*\)|_ms\(([3-9]\d|1\d\d)\))$'
                fail: 손을 뗀 뒤 떨림이 끝날 때까지 기다리는 곳이 있나요? 몇 ms 쯤 기다리면 떨림이 끝날까요?

