        body: |
          미션에서는 손을 떼자마자 판정했어요. 그런데 두 번 누르기는 첫 클릭을 뗀 순간에는 알 수 없어요. 그래서 짧은 클릭은 **세어 두고**(`clicks`), 마지막 클릭 시각을 **적어 두었다가**(`last`), 400 ms 동안 조용하면 그때 판정해요.

          길게 누르기는 지금처럼 떼는 순간 바로 파랑이에요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요.
