# 센서 트랙 S20 · 시간 재기: 버튼 왕 — 원본: 아두이노 기본 W09(버튼킹 ButtonKing 라이브러리: click · doubleclick · press). MicroPython 에는 ButtonKing 이 없어 time.ticks_ms() / ticks_diff() 로 직접 만든다. 형식 설명은 src/track/README.md
id: 23-button-king
order: 23
track: sensor
label: S20
prerequisites: [11-button-touch]
subjects: [수학, 체육, 정보]
sessions: 1
teacherNotes: |
  **기준 ms 는 예시예요.** 짧게 · 길게를 나누는 `500` ms, 두 번 누르기 간격 `400` ms, 떨림을 기다리는 `50` ms 는 모두 예시값입니다. 손이 빠른 학생은 톡 쳐도 80 ms, 느린 학생은 200 ms 가 나옵니다. 실행 단계에서 "톡 치기"와 "꾹 누르기"를 세 번씩 재어 공책에 적고, 그 사이에서 **자기 기준**을 고르게 해 주세요. 미션 판정은 지시대로 500 을 보지만, 판정 뒤에 자기 숫자로 바꿔 보게 하면 좋습니다.

  **판정은 손을 떼는 순간에 해요.** 이 챕터의 코드는 모두 "눌림을 보면 시각을 적고 → 뗄 때까지 작은 반복에서 기다리고 → 떼는 순간 지금 시각과 빼서 누른 시간을 구한다"는 같은 뼈대입니다. 그래서 길게 누르기(파랑)도 **손을 뗀 뒤에** 켜집니다. 누르고 있는 동안 500 ms 가 지나자마자 켜고 싶다면(원본 ButtonKing 의 press) 기다리는 반복 안에서 `time.ticks_diff(time.ticks_ms(), start) >= 500` 을 확인하면 됩니다 — 먼저 끝낸 학생의 도전 과제로 쓰세요.

  **두 번 누르기는 기다려야 알 수 있어요.** 첫 클릭을 떼는 순간에는 두 번째 클릭이 올지 모릅니다. 그래서 클릭 수(`clicks`)와 마지막 클릭 시각(`last`)을 **반복 밖 상태 변수**로 기억해 두고, 마지막 클릭 뒤 400 ms 동안 아무 일이 없을 때 판정합니다(디버깅 증상 1, 설계). 이 챕터는 인터럽트를 쓰지 않으므로 함수 · `global` 이 필요 없습니다. 인터럽트는 S21 에서 다룹니다.

  - `time.ticks_ms()` 는 ESP32 에서 약 12.4일(2^30 ms)마다 0 으로 돌아갑니다. 그래서 시각끼리 뺄 때는 `-` 대신 `time.ticks_diff(나중, 처음)` 을 씁니다(디버깅 증상 2). 수업 중에는 재현되지 않으니 "선생님 보드 이야기"로 소개해 주세요.
  - 버튼 떨림(바운스)은 버튼마다 정도가 다릅니다. 증상 3 이 잘 안 보이면 톡톡 아주 빠르게 여러 번 눌러 보게 하세요.
  - RGB LED 배선은 S5(05-rgb-led)와 같은 자리이고, 버튼은 S8 과 같은 방법(가운데 홈에 걸치고 대각선 다리)으로 26 · 28번 줄에 꽂습니다.
  - 교과 연결: 수학(ms 단위, 1초 = 1000 ms, 측정값으로 기준 정하기, 평균), 체육(반응 속도 — 짝과 "가장 짧게 톡 치기" 겨루기), 정보(상태 변수, 시간에 따른 판정).
title: 시간 재기 — 버튼 왕
subtitle: 짧게 · 길게 · 두 번, 버튼 하나로 세 가지 명령
summary: |
  이어폰 버튼은 하나뿐인데 한 번 누르면 멈춤, 두 번 누르면 다음 곡, 길게 누르면 음성 비서가 켜져요. 보드는 이것을 **시간**으로 구분해요.
  누르기 시작한 시각과 뗀 시각을 `time.ticks_ms()` 로 적고 빼서 **누른 시간(ms)**을 재요. 그 시간으로 짧게는 빨강, 길게는 파랑을 켜고, 마지막에는 두 번 누르기(초록)까지 알아차리는 버튼 왕을 만들어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 납땜 없이 빼고 꽂을 수 있어요 }
  - { name: 버튼(푸시 버튼), note: 다리가 네 개. 가운데 홈에 걸쳐 꽂아요 }
  - { name: RGB LED, note: "다리 4개. 가장 긴 다리가 GND. 순서는 빨강 · GND · 초록 · 파랑 (S5 와 같은 자리)" }
  - { name: 220Ω 저항, note: "3개. 빨강-빨강-갈색 띠. 빨강 · 초록 · 파랑 다리에 하나씩" }
  - { name: M-F 듀폰선 5가닥, note: "한쪽은 구멍, 한쪽은 핀. 보드의 27 · 25 · 26 · 14번 핀과 GND 핀 → 브레드보드" }
  - { name: 점퍼선(M-M) 3가닥, note: "RGB 가장 긴 다리 줄 · 버튼 대각선 다리 줄 → 위 − 줄, 위 − 줄 ↔ 아래 − 줄" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "RGB LED 는 S5 와 같은 자리: 다리를 d 칸 15 · 17 · 19 · 21번 줄에(빨강 · GND · 초록 · 파랑), 저항 셋이 가운데 홈을 건너고 io27 → 15번 줄, io25 → 19번 줄, io26 → 21번 줄, 가장 긴 다리 줄(17번) → 위 − 줄. 버튼은 가운데 홈에 걸쳐 11 · 13번 줄에 꽂고 io14 → 11번 줄, 대각선 반대쪽 13번 줄 → 위 − 줄. 보드 GND → 아래 − 줄, 위 − 줄과 아래 − 줄은 점퍼선으로 이어요"
  captionDevkit: "RGB LED 는 S5 와 같은 자리: 다리를 d 칸 9 · 11 · 13 · 15번 줄에(빨강 · GND · 초록 · 파랑), 저항 셋이 가운데 홈을 건너고 D27 → 9번 줄, D25 → 13번 줄, D26 → 15번 줄, 가장 긴 다리 줄(11번) → 위 − 줄. 버튼은 가운데 홈에 걸쳐 5 · 7번 줄에 꽂고 D14 → 5번 줄, 대각선 반대쪽 7번 줄 → 위 − 줄. 보드 GND → 아래 − 줄, 위 − 줄과 아래 − 줄은 점퍼선으로 이어요"
principle:
  image: images/press-timeline.svg
  body: |
    보드 안에는 켜진 순간부터 1000분의 1초(**ms**)씩 세는 시계가 있어요. `time.ticks_ms()` 는 그 시계가 **지금 몇 ms 인지** 알려 줘요. 1초는 1000 ms 예요.

    버튼이 눌리는 순간 시계를 보고 `start` 에 적어 두고, 손을 떼는 순간 시계를 다시 봐요. **지금 − 시작**이 바로 누른 시간이에요. 시각끼리 뺄 때는 `time.ticks_diff(time.ticks_ms(), start)` 를 써요(블록: "start 부터 지난 시간 (ms)").

    누른 시간을 **기준**(예: 500 ms)과 비교하면 짧게 · 길게를 나눌 수 있어요. 두 번 누르기는 첫 클릭 뒤 조금(예: 400 ms) **기다려 봐야** 알 수 있어요.
goals:
  content: time.ticks_ms() 로 버튼을 누른 시간(ms)을 재고, 기준과 비교해 짧게 · 길게 · 두 번 누르기를 RGB LED 색으로 구분한다
  thinking: 사건(누름 · 뗌)이 일어난 시각을 적어 두고 빼서 시간을 구하며, 바로 알 수 없는 일은 상태 변수에 기억해 두었다가 나중에 판정한다
successCriteria:
  - 내 "톡 치기"와 "꾹 누르기"를 ms 로 재고, 그 값을 보고 기준을 정할 수 있다
  - 누른 시간이 500 ms 보다 짧으면 빨강, 길면 파랑을 켤 수 있다
  - 두 번 누르기를 알려면 왜 첫 클릭 뒤에 기다려야 하는지 시간표로 설명할 수 있다
parts:
  - id: part1
    title: 누른 시간으로 명령 나누기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 버튼 하나로 명령 세 개?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 짧게 한 번은 빨강, 길게는 파랑, 두 번 톡톡은 초록
        body: |
          무선 이어폰에는 버튼이 하나뿐이에요. 그런데 한 번 누르면 음악이 멈추고, 두 번 누르면 다음 곡으로 넘어가고, 길게 누르면 음성 비서가 켜져요.

          버튼은 눌렸을 때 `0`, 뗐을 때 `1` 밖에 모르는데 어떻게 세 가지를 구분할까요? 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없어요.
        todo:
          - 준비물(버튼, RGB LED, 저항, 듀폰선 · 점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 버튼 하나로 여러 일을 하는 물건을 하나 더 떠올려 쓰기
        questions:
          - 이어폰 버튼은 하나인데 한 번 · 두 번 · 길게 누르기를 어떻게 구분할까요?
          - "\"짧게\"와 \"길게\"는 몇 초쯤에서 나뉠까요? 사람마다 다를까요?"
          - 한 번 눌렀을 때, 이어폰은 두 번째 클릭이 올지 안 올지 어떻게 알 수 있을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "누른 시간으로 색 바꾸기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 버튼 값(0 · 1)과 **시계**(지금 몇 ms)만 볼 수 있어요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 시각은 언제언제 알아야 할까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 재거나 기억해야 할 시각 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 기준 ms 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["누르기 시작한 시각", "손을 뗀 시각 (누른 시간 = 뗀 시각 − 누른 시각)", "직전 클릭을 뗀 시각"]
          decide: ["몇 ms 보다 짧으면 짧게로 볼지 (예: 500 ms)", "두 클릭 사이가 몇 ms 안이면 두 번으로 볼지 (예: 400 ms)", "버튼 떨림을 몇 ms 기다릴지"]
          act: ["짧게 누르면 빨강 켜기", "길게 누르면 파랑 켜기", "두 번 누르면 초록 켜기"]

      - id: predict
        type: predict
        title: 예측하기 — 숫자는 언제 찍힐까?
        minutes: 4
        scene:
          image: images/press-timeline.svg
          caption: 누르는 순간 시각을 적고, 떼는 순간 시각에서 빼면 누른 시간
        body: |
          아직 실행하지 않아요. `time.ticks_ms()` 는 보드가 켜진 뒤 지난 시간을 ms 로 알려 줘요. 코드는 눌림을 보면 그 값을 `start` 에 적고, 손을 뗄 때까지 작은 반복에서 기다려요.

          그림의 시간표를 보며 코드를 따라가 보세요. 출력 창에 숫자가 **언제** 찍히고, **얼마쯤** 찍힐지 빈칸에 내 예측을 적어요.
        todo:
          - "`start = time.ticks_ms()` 와 `held = ...` 줄을 찾아 표시하기"
          - 버튼을 누르고 있는 동안 어느 반복이 도는지 따라가기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_press_time.py
        blanks:
          - q: 버튼을 건드리지 않으면 출력 창에는 무엇이 찍힐까요?
          - q: 숫자는 버튼을 누르는 순간, 누르고 있는 동안, 손을 뗀 순간 중 언제 찍힐까요?
          - q: 버튼을 1초쯤 꾹 눌렀다 떼면 찍히는 숫자는 대략 얼마일까요?
            unit: ms

      - id: run
        type: run
        title: 복사 · 실행 — 누른 시간 재기
        minutes: 6
        scene:
          image: images/wiring-breadboard.svg
          caption: "RGB LED 는 S5 자리, 버튼은 가운데 홈에 걸쳐 11 · 13번 줄. 14번 선과 − 줄 선은 대각선 다리에"
          captionDevkit: "RGB LED 는 S5 자리, 버튼은 가운데 홈에 걸쳐 5 · 7번 줄. 14번 선과 − 줄 선은 대각선 다리에"
        body: |
          먼저 브레드보드에 버튼과 RGB LED 를 꽂아요. RGB LED 는 오늘 미션부터 쓰지만, 한 번에 꽂아 두면 편해요. 버튼은 **가운데 홈에 걸쳐**, 14번 선과 − 줄 선은 **대각선** 다리 줄에 이어요.

          실행한 뒤 "톡 치기"와 "꾹 누르기"를 세 번씩 해 보고 찍힌 ms 를 공책에 적어요. 내 짧게와 길게는 몇 ms 쯤에서 나뉘나요?
        todo:
          - USB 를 뺀 채 그림대로 버튼 · RGB LED · 저항 · 선 꽂기
          - "**보드 연결** → **실행** 누르기"
          - 톡 치기 · 꾹 누르기를 세 번씩 하고 ms 를 공책에 적기
        code: step1_press_time.py
        expected: 코드를 실행하면 처음엔 출력 창이 조용해요. 버튼을 눌렀다 떼면 그 순간 누른 시간이 ms 로 한 줄 찍혀요. 톡 치면 100 안팎, 1초쯤 꾹 누르면 1000 안팎의 숫자가 나와요.
        codeNotes:
          - { line: 4, note: "14번 핀을 풀업 입력으로 준비해요. 떼면 1, 누르면 0 (S8 과 같아요)" }
          - { line: 6, note: "아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 7, note: "버튼이 눌렸는지 물어요. 0 이면 누르기 시작한 거예요" }
          - { line: 8, note: "`time.ticks_ms()` 로 지금 시각(ms)을 읽어 `start` 에 적어 둬요 (블록: 지금까지 지난 시간)" }
          - { line: 9, note: "버튼이 눌려 있는 동안은 이 작은 반복 안에서 기다려요" }
          - { line: 10, note: "0.01초(10 ms)씩 쉬면서 버튼 값을 다시 봐요" }
          - { line: 11, note: "손을 떼면 여기로 와요. **지금 − start** 를 `time.ticks_diff` 로 구해 `held` 에 담아요" }
          - { line: 12, note: "누른 시간(ms)을 출력 창에 찍어요" }
          - { line: 13, note: "바깥 반복도 10 ms 쉬고 다시 버튼을 봐요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 시각 두 번, 빼기 한 번
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          이 코드는 시계를 **두 번** 봐요. 한 번은 누르기 시작할 때, 한 번은 손을 뗀 뒤예요. 그리고 둘을 빼요.

          손가락으로 한 줄씩 짚으며 따라가 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - 시계를 보는 줄 두 곳을 찾기
          - 누르고 있는 동안 도는 줄을 손가락으로 짚기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_press_time.py
        questions:
