  <rect x="412" y="154" width="186" height="52" rx="10" fill="var(--card)" stroke-width="1.5"/>
  <text x="426" y="185" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">길게 꾹</text>
  <circle cx="566" cy="180" r="16" fill="#1971c2" fill-opacity="0.25" stroke="none"/>
  <circle cx="566" cy="180" r="10" fill="#1971c2" stroke-width="1.5"/>
  <text x="534" y="185" text-anchor="end" font-size="12" font-weight="700" fill="currentColor" stroke="none" fill-opacity="0.8">파랑</text>
