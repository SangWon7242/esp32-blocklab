<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="bkc-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="bkc-title">버튼 왕 표지: 버튼 하나를 짧게 한 번, 길게, 두 번 누르면 ESP32 가 누른 시간(ms)을 재서 RGB LED 를 빨강, 파랑, 초록으로 켠다</title>
  <defs><marker id="bkc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/></marker></defs>
  <rect x="44" y="118" width="120" height="96" rx="12" fill="var(--card)" stroke-width="2"/>
