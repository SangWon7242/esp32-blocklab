  <path d="M272 42 H288 M280 42 V46" stroke-width="3"/>
  <path d="M280 76 V56 M280 76 L294 84" stroke-width="2.5"/>
  <path d="M280 106 V122" stroke-width="2" stroke-dasharray="3 4"/>
  <path d="M172 166 L206 172" stroke-width="2.5" marker-end="url(#bkc-arrow)"/>
  <path d="M354 180 C380 180 380 92 404 92" stroke-width="2" marker-end="url(#bkc-arrow)"/>
  <rect x="412" y="66" width="186" height="52" rx="10" fill="var(--card)" stroke-width="1.5"/>
  <text x="426" y="97" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">짧게 한 번</text>
