      - id: design
        type: design
        title: 설계 — 우리말로 먼저 쓰기
        minutes: 6
        scene:
          image: images/list-loop.svg
          caption: 목록에 담고, 하나씩 꺼내 켰다 끄기 — 이 순서를 우리말로 먼저 써요
        body: |
          이번에는 물이 처음엔 **천천히** 흐르다 점점 빨라지게 설계해요. 처음 한 번은 300 ms 간격, 다음 한 번은 200 ms 간격, 그다음부터는 계속 100 ms 간격으로요.

          블록 중 **흐르는 LED 준비하기** 는 `pins` 목록과 "하나씩 꺼내 켰다 끄기"(`for pin in pins:`)를 한꺼번에 만들어 줘요. 설계도의 빈칸을 채우고, 번역표를 본 뒤, 섞인 블록을 그 순서대로 이어 붙여요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 "하나씩 꺼낸다"가 어떤 코드인지 찾아보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 핀 번호 __ 개를 목록(pins)에 담는다
            blank: { answer: 5 }
          - text: 처음엔 __ ms 간격으로 천천히 한 번 흐른다
            blank: { answer: 300 }
          - text: 조금 빠르게 __ ms 간격으로 한 번 더 흐른다
            blank: { answer: 200 }
          - text: 계속 반복한다
          - text: __ ms 간격으로 흐른다
            blank: { answer: 100 }
        translation:
          - ["핀 번호를 목록에 담는다", "pins = [18, 5, 14, 17, 26]"]
          - ["목록에서 하나씩 꺼낸다", "for pin in pins:"]
          - ["차례로 켰다 끈다 (간격 ms)", "flow_leds(ms)"]
          - ["계속 반복한다", "while True:"]
        targetCode: design_flowing.py

