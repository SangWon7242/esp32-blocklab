          - codeMatches: 'time\.sleep\(1\)'
            fail: 다 켜진 채로 1초를 기다리는 줄이 있나요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*reversed)'
            fail: 이번에도 되돌아오는 길이 필요할까요?
