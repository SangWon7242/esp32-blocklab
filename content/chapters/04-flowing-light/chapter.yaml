          - 하나 켤 때마다 0.3초, 다 켜진 뒤 1초 기다리기
          - 실행해 보고 **판정** 누르기
        instructions: 하나씩 0.3초 간격으로 켜되 끄지 말고, 다섯 개가 다 켜지면 1초 뒤 한꺼번에 꺼지게 해 주세요 (되돌아오는 길은 없어요)
        code: step1_flowing.py
        rules:
