          caption: 목록을 한 번 돌며 켜기만 하고, 한 번 더 돌며 끄기만 한다면?
        body: |
          이번에는 하나씩 켜지되 **꺼지지 않게** 해 봐요. 다섯 개가 모두 켜지면 1초 뒤 **한꺼번에** 꺼지고, 다시 처음부터요.

          켜는 일과 끄는 일을 한 for 안에 두면 어떻게 될까요? for 를 둘로 나누면요? 하나 켤 때마다 0.3초 기다려요.
        todo:
