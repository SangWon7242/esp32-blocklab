# 챕터 4 · 흐르는 물빛 — 수업 저장소 04_흐르는물빛. 형식 설명은 src/track/README.md
id: 04-flowing-light
order: 4
track: sensor
label: S4
sessions: 2
title: 흐르는 물빛
summary: |
  LED **다섯 개**가 물이 흐르듯 차례로 켜졌다 꺼지고, 끝까지 가면 거꾸로 되돌아와요.
  핀 번호 다섯 개를 **목록(리스트)** 하나에 모아 두고 `for` 로 하나씩 꺼내 쓰면, "켜기 → 기다리기 → 끄기"를 다섯 번 쓰지 않아도 돼요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 납땜 없이 빼고 꽂을 수 있어요 }
  - { name: 빨강 LED 5개, note: 긴 다리가 + }
  - { name: 220Ω 저항 5개, note: "LED 마다 하나씩. 빨강-빨강-갈색 띠" }
  - { name: M-F 듀폰선 6가닥, note: "보드의 18 · 5 · 14 · 17 · 26번 핀과 GND 핀 → 브레드보드" }
  - { name: 점퍼선(M-M) 5가닥, note: "LED 짧은 다리 줄 → 브레드보드 − 줄" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "브레드보드 6 · 12 · 18 · 24 · 30번 줄에 차례로 io18 · io5 · io14 · io17 · io26: 줄마다 220Ω 저항 → 3칸 옆 LED 긴 다리(+). LED 짧은 다리(−) 줄(2 · 8 · 14 · 20 · 26번)은 점퍼선으로 모두 − 줄에 모으고, − 줄 하나를 보드 GND 에 이어요"
  captionDevkit: "브레드보드 6 · 12 · 18 · 24 · 30번 줄에 차례로 D18 · D5 · D14 · TX2(17) · D26: 줄마다 220Ω 저항 → 3칸 옆 LED 긴 다리(+). D18 · D5 · TX2 는 아래 줄 핀이라 선이 보드 바깥으로 돌아와요. LED 짧은 다리(−) 줄(2 · 8 · 14 · 20 · 26번)은 점퍼선으로 모두 − 줄에 모으고, − 줄 하나를 보드 GND 에 이어요"
principle:
  image: images/list-loop.svg
  body: |
    LED 다섯 개는 18 · 5 · 14 · 17 · 26번 핀에 하나씩 이어져 있어요. 이 다섯 번호를 **목록(리스트)** 하나에 모아 `pins` 라고 이름 붙여요.

    `for pin in pins:` 는 목록에서 번호를 **앞에서부터 하나씩** 꺼내 `pin` 에 담고, 들여 쓴 줄들을 해요. 꺼낸 번호의 핀을 그때그때 출력으로 준비해 켰다 끄니까, LED가 물이 흐르듯 차례로 켜져요.

    `reversed(pins)` 는 같은 목록을 **뒤에서부터** 읽어요. 그래서 끝까지 간 물빛이 거꾸로 되돌아와요.
goals:
  content: 핀 번호를 리스트에 담고 for 로 하나씩 꺼내 써서 LED 다섯 개를 차례로 켜고 끈다
  thinking: 되풀이되는 일을 찾아 한 번만 쓰고, 순서(앞으로 · 거꾸로)를 목록으로 다룬다
successCriteria:
  - pins 목록의 첫 칸(pins[0])이 무엇이고, for 가 몇 번 도는지 말할 수 있다
  - reversed(pins) 가 어떤 순서로 읽는지 내 말로 설명할 수 있다
  - 기다리는 숫자를 바꿔 흐르는 빠르기를 내 뜻대로 바꿀 수 있다
parts:
  - id: part1
    title: 흐르는 물빛 만들기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 다섯 개를 차례로 켜려면?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — LED 다섯 개가 물결처럼 차례로 켜졌다 꺼지고, 끝에서 되돌아오기
        body: |
          1장에서는 LED **하나**를 "켜기 → 기다리기 → 끄기"로 깜빡였어요. 오늘은 LED 가 **다섯 개**예요. 물결처럼 하나씩 차례로 켜졌다 꺼지게 하고 싶어요.

          1장처럼 LED 마다 코드를 따로 쓰면 어떻게 될까요? 더 짧고 똑똑하게 쓰는 방법은 없을까요? 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없고, 틀려도 괜찮아요.
        todo:
          - 준비물(LED 5개, 저항 5개, 브레드보드, 듀폰선·점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 숫자를 묻는 질문에는 **숫자와 그 이유**를 함께 쓰기
        questions:
          - LED 다섯 개를 차례로 켜고 끄려면 "켜기 → 기다리기 → 끄기"를 몇 번 써야 할까요? 그렇게 쓰면 코드는 몇 줄쯤 될까요?
          - 핀 번호 다섯 개(18 · 5 · 14 · 17 · 26)를 한곳에 모아 두고 하나씩 꺼내 쓸 수 있다면, 무엇이 편해질까요?
          - 물결이 끝까지 간 다음 되돌아오게 하려면, 핀 번호를 어떤 순서로 읽어야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "흐르는 물빛"을 보드에게 시키려면 일을 잘게 나눠야 해요. LED 가 다섯 개라도, 보드는 한 번에 한 가지씩만 알아들어요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. **순서**도 무언가를 정하는 일일까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 보드가 시작 전에 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 순서나 숫자 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["LED 다섯 개가 각각 몇 번 핀에 꽂혀 있는지", "LED 가 꽂힌 순서"]
          decide: ["어떤 순서로 켤지", "LED 하나를 얼마나 오래 켜 둘지", "끝에서 되돌아올지"]
          act: ["LED 를 하나씩 켰다 끄기", "끝에서 거꾸로 되돌아오기", "이 일을 계속 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 목록에서 하나씩
        minutes: 5
        scene:
          image: images/list-loop.svg
          caption: "pins 목록의 칸을 for 가 하나씩 꺼내 pin 에 담고, 그 핀의 LED 를 켰다 꺼요"
        body: |
          아직 실행하지 않아요. `pins = [18, 5, 14, 17, 26]` 은 핀 번호 다섯 개를 **목록(리스트)** 하나에 담아 `pins` 라고 이름 붙이는 줄이에요.

          `for pin in pins:` 는 목록에서 하나씩 꺼내 `pin` 에 담고, 아래 들여 쓴 줄들을 해요. 다 꺼낼 때까지요. `time.sleep_ms(100)` 의 **ms** 는 1000분의 1초예요. 코드를 따라가며 빈칸에 내 예측을 적어요.
        todo:
          - 그림에서 목록의 칸과 for 가 꺼내는 차례를 짝지어 보기
          - "`showLed()` 안의 for 두 개가 각각 무엇을 하는지 손가락으로 짚어 읽기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_flowing.py
        blanks:
          - q: LED 하나가 켜져 있는 시간은 몇 초일까요?
            unit: 초
          - q: 26번 LED 까지 켜진 다음에는 어떤 일이 일어날까요?
          - q: 가는 길에 다섯 개가 한 번씩 켜지는 데 걸리는 시간은 대략 몇 초일까요?
            unit: 초

      - id: run
        type: run
        title: 복사 · 실행 — 흐르는 물빛
        minutes: 8
        scene:
          image: images/wiring-breadboard.svg
          caption: "줄 번호가 작은 쪽부터 io18 · io5 · io14 · io17 · io26. 핀마다 저항 하나, LED 짧은 다리 쪽은 모두 같은 − 줄로"
          captionDevkit: "줄 번호가 작은 쪽부터 D18 · D5 · D14 · TX2(17) · D26. 핀마다 저항 하나, LED 짧은 다리 쪽은 모두 같은 − 줄로"
        body: |
          이제 LED 다섯 개를 **브레드보드**에 꽂아요. 핀마다 220Ω 저항을 하나씩 거쳐 LED 긴 다리(+)로 가고, 짧은 다리(−) 쪽은 모두 **같은 − 줄**에 모아 GND 하나로 이어요.

          순서가 중요해요. 브레드보드 줄 번호가 작은 쪽부터 **18 · 5 · 14 · 17 · 26** 순서로 꽂아야 물결처럼 보여요. 실행하면 창에 핀 번호가 찍혀요. 찍히는 순서와 불이 켜지는 자리가 같은지 보세요.
        todo:
          - USB 를 뺀 채 그림대로 LED · 저항 · 선 꽂기 (저항 5개, GND 는 − 줄 하나로)
          - "**보드 연결** → **실행** 누르기"
          - 창의 핀 번호 순서와 불이 켜지는 자리가 같은지, 예측과 비교하기
        code: step1_flowing.py
        expected: 코드를 실행하면 LED가 18번부터 26번까지 하나씩 차례로 켜졌다 꺼지고, 끝에서 거꾸로 되돌아와요. 출력 창에는 지금 켜지는 핀 번호가 차례로 찍혀요.
        codeNotes:
          - { line: 4, note: "LED를 갔다가 되돌아오게 하는 동작을 `showLed` 라는 이름으로 묶어요(함수)" }
          - { line: 5, note: "`pins` 목록에서 핀 번호를 앞에서부터 하나씩 꺼내 `pin` 에 담아요" }
          - { line: 6, note: "지금 꺼낸 핀 번호를 출력 창에 찍어요" }
          - { line: 7, note: "`pin` 에 든 번호의 핀을 출력으로 준비하고 이름을 `led` 로 붙여요" }
          - { line: 8, note: "그 LED를 켜고, 100ms(0.1초) 기다렸다가 꺼요 (8~11번 줄)" }
          - { line: 12, note: "`reversed(pins)` 로 목록을 뒤에서부터 읽어 거꾸로 되돌아와요" }
          - { line: 21, note: "핀 번호 다섯 개를 목록에 담아요. 함수는 위에 적어 두기만 하고, 23번 줄에서 부를 때 비로소 움직여요" }
          - { line: 23, note: "묶어 둔 `showLed()` 를 끝없이 다시 불러요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          `showLed()` 안에는 `for` 가 **두 개** 있어요. 하나는 목록을 앞에서부터, 하나는 `reversed(pins)` 로 **뒤에서부터** 읽어요.

          손가락으로 한 줄씩 짚으며 for 가 몇 번 도는지 세어 보세요. 답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - for 두 개가 각각 몇 번 도는지 세기
          - "`reversed(pins)` 가 목록을 어떤 순서로 읽는지 따라가 보기"
          - 세 문제에 답하고 **확인** 누르기
        code: step1_flowing.py
        questions:
          - { kind: number, q: "showLed() 를 한 번 부르면 LED 가 켜지는 일은 모두 몇 번 일어나나요?", answer: 10, hint: "for 가 두 개, 목록의 칸은 다섯 개" }
          - { kind: choice, q: "거꾸로 돌아오는 길에서 가장 먼저 켜지는 LED 는 몇 번 핀인가요?", options: ["18", "5", "26"], answer: 2 }
          - { kind: line, q: "목록을 뒤에서부터 읽기 시작하는 for 줄의 줄 번호를 클릭하세요", answer: 12 }
        codeNotes:
          - { line: 4, note: "`def showLed():` 아래 들여 쓴 줄들이 `showLed` 라는 이름의 묶음(함수)이에요" }
          - { line: 5, note: "`for pin in pins:` 는 목록의 칸 수만큼 되풀이하며, 칸을 하나씩 `pin` 에 담아요" }
          - { line: 7, note: "`pin` 에 든 번호의 핀을 출력으로 준비해요" }
          - { line: 8, note: "LED를 켜요. 아래 줄에서 100ms 기다린 뒤 꺼요" }
          - { line: 21, note: "핀 번호 다섯 개를 담은 목록이에요. 첫 칸 `pins[0]` 은 18 이에요" }
          - { line: 23, note: "`showLed()` 를 부를 때마다 함수 안의 줄들이 처음부터 끝까지 한 번 움직여요" }

      - id: mission
        type: mission
        title: 미션 — 두 배 빠르게 흐르기
        minutes: 6
        scene:
          image: images/flow-timeline.svg
          caption: "지금은 칸 하나가 0.2초: 켜짐 0.1초 + 꺼짐 0.1초. 가는 길 다섯 칸, 돌아오는 길 다섯 칸"
        body: |
          지금 물빛은 칸 하나에 0.2초씩 흘러요. 이 물살을 **두 배 빠르게** 만들어 봐요. 빨라지면 기다리는 시간은 늘어날까요, 줄어들까요?

          그리고 핀 번호를 찍던 `print(pin)` 두 줄은 순서 확인이 끝났으니 지워요. 블록이든 코드든 편한 쪽에서 고쳐요. 고친 뒤 실행해서 물빛이 정말 빨라졌는지 눈으로 보고 **판정**을 눌러요.
        todo:
          - "`time.sleep_ms(...)` 가 몇 군데 있는지 모두 찾기"
          - "기다리는 숫자를 바꾸고 `print(pin)` 두 줄 지우기"
          - 실행해서 빨라졌는지 보고 **판정** 누르기
        instructions: 흐르는 속도를 두 배 빠르게 만들어 주세요. 기다리는 시간을 모두 바꾸고, 핀 번호를 찍던 print(pin) 두 줄은 지워요
        hint: time.sleep_ms 가 몇 군데 있나요? 가는 길에만 있지 않아요. 두 배 빠르면 한 번 기다리는 시간은 지금의 몇 분의 몇일까요?
        code: step1_flowing.py
        rules:
          - codeMatches: '(?<![\s\S])(?![\s\S]*print\(\s*\w+\s*\))'
            fail: 핀 번호를 찍던 print 줄은 모두 지웠나요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*time\.sleep_ms\((?!\s*50\s*\))[^)]*\))[\s\S]*time\.sleep_ms\(\s*50\s*\)'
            fail: 기다리는 곳을 모두 찾았나요? 두 배 빠르면 그 숫자들은 어떻게 되어야 할까요?
          - codeMatches: 'for \w+ in (\w+)\s*:[\s\S]*for \w+ in reversed\(\s*\1\s*\)\s*:'
            fail: 가는 길과 돌아오는 길, 두 for 가 모두 남아 있나요?
          - codeMatches: '(?:\.value\(1\)\n +time\.sleep_ms\(\s*50\s*\)\n +\w+\.value\(0\)\n +time\.sleep_ms\(\s*50\s*\)[\s\S]*){2}'
            fail: 켜기 · 기다리기 · 끄기 · 기다리기가 가는 길과 돌아오는 길 모두에서 빨라졌나요?
        answerCode: mission_faster.py

      - id: extra1
        type: mission
        title: 추가 미션 ① — 한 방향으로만 흐르기
        optional: true
        minutes: 4
        scene:
          image: images/flow-timeline.svg
          caption: 시간표에서 돌아오는 길 다섯 칸이 없어지면 물빛은 어떻게 흐를까요?
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 물빛이 끝까지 가면 되돌아오지 말고, **처음 자리에서 다시** 흐르게 해 봐요. 폭포처럼 한 방향으로만요.

          어느 덩어리를 없애면 될까요? 그 덩어리는 몇 줄부터 몇 줄까지일까요? 들여쓰기를 보고 경계를 찾아요.
        todo:
          - 되돌아오는 일을 하는 덩어리를 찾기
          - 그 덩어리를 지우고 `print(pin)` 줄도 지우기
          - 실행해서 한 방향으로만 흐르는지 보고 **판정** 누르기
        instructions: 되돌아오지 않고 한 방향으로만 흐르게 해 주세요 (print 줄은 지워요)
        code: step1_flowing.py
        rules:
          # 처음 자리(?<![\s\S])에서 시작해, 코드 어디에도 reversed 가 없을 때만 맞는다
          - codeMatches: '(?<![\s\S])(?![\s\S]*reversed)'
            fail: 거꾸로 읽는 부분이 아직 남아 있지 않나요?
          - codeMatches: 'for pin in pins:'
            fail: 앞으로 흐르는 부분은 남겨 두었나요?
        answerCode: extra1_one_way.py

      - id: extra2
        type: mission
        title: 추가 미션 ② — 모두 켰다가 한꺼번에 끄기
        optional: true
