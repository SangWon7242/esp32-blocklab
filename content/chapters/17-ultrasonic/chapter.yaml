  - { name: HC-SR04 초음파 센서, note: "핀 4개: VCC · Trig · Echo · GND. 브레드보드 없이 F-F 듀폰선으로 보드 핀에 바로" }
  - { name: 빨강 LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 브레드보드, note: LED 와 저항을 꽂는 판 }
  - { name: F-F 듀폰선 4가닥, note: "양쪽 끝이 구멍인 선. 초음파 센서 핀 4개를 보드 핀에 바로 씌워요" }
  - { name: M-F 듀폰선 2가닥, note: "한쪽은 핀, 한쪽은 구멍인 선. 26번 핀 → 브레드보드, LED 짧은 다리 줄 → 보드 GND" }
  - { name: USB 선, note: 마이크로 USB. 배선할 때는 빼 두기 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "초음파 센서는 보드에 바로: VCC → 5V · GND → GND · Trig → io13 · Echo → io12 (위쪽 한 줄). LED 는 보드 위 브레드보드에: io26 → 9번 줄 → 220Ω 저항 → 15번 줄의 긴 다리(+), 짧은 다리(−)는 16번 줄 → io26 기둥 맨 아래 G"
  captionDevkit: "초음파 센서는 보드에 바로: VCC → VIN(5V) · GND → GND(위 줄) · Trig → D13 · Echo → D12. LED 는 보드 위 브레드보드에: D26 → 3번 줄 → 220Ω 저항 → 8번 줄의 긴 다리(+), 짧은 다리(−)는 9번 줄 → GND(아래 줄)"
principle:
  image: images/formula-steps.svg
  body: |
    초음파 센서는 사람 귀에 들리지 않는 높은 소리(40kHz)를 쏘고, 물체에 부딪혀 돌아오는 **메아리**를 들어요. 박쥐가 길을 찾는 방법과 같아요.

    - **Trig** 핀에 10마이크로초(µs) 동안 1 을 주면 센서가 소리를 쏘아요
    - **Echo** 핀은 소리가 갔다가 돌아올 때까지 1 로 켜져 있어요. 그 길이가 **왕복 시간**이에요
    - 소리는 1초에 약 **340m** 를 가요. 시간을 µs 로, 거리를 cm 로 바꿔 식을 정리하면 340 ÷ 10000 이 돼요
    - 갔다가 돌아왔으니 **절반**만 물체까지의 거리예요: 거리(cm) = 340 × 왕복 시간 ÷ 10000 ÷ 2
goals:
  content: 초음파 센서로 소리가 갔다 오는 시간을 재고, 그 시간을 cm 로 바꿔 거리를 출력하고, 거리를 기준과 비교해 LED를 켠다
  thinking: 속력 × 시간 = 거리 식을 단위를 바꿔 가며 코드의 숫자(340 · 2 · 10000)와 짝지어 설명한다
successCriteria:
  - 센서가 거리를 어떻게 재는지 "소리 · 메아리 · 시간"으로 내 말로 설명할 수 있다
  - 코드에서 2로 나누는 까닭과 340 · 10000 이 무엇인지 말할 수 있다
  - 거리를 d 에 담고 if · else 로 15 cm 보다 가까우면 LED를 켤 수 있다
  - 숫자가 안 나오거나 0 · 들쭉날쭉할 때 어떤 선부터 볼지 안다
parts:
  - id: part1
    title: 소리로 거리 재기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 박쥐는 어떻게 어둠 속에서 길을 찾을까?
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 박쥐는 소리를 쏘고 메아리를 들어요. 자동차 주차 센서도 벽까지 남은 거리를 알려 줘요
        body: |
          박쥐는 깜깜한 밤에도 나뭇가지에 부딪히지 않고, 날아가는 작은 나방까지 잡아요. 눈으로 보는 것이 아니라면 무엇으로 "보는" 걸까요?

          자동차가 뒤로 갈 때 "삐- 삐-" 소리가 점점 빨라지는 것도 같은 비밀이에요. 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(ESP32 보드, 초음파 센서, LED, 저항, 브레드보드, 듀폰선, USB 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 박쥐는 깜깜한 밤에 어떻게 부딪히지 않고 날 수 있을까요? 눈 대신 무엇을 쓸까요?
          - 소리를 쏘고 메아리가 돌아오기까지 걸린 시간을 안다면, 물체까지의 거리는 어떻게 구할 수 있을까요?
          - 물체가 가까우면 메아리는 빨리 돌아올까요, 늦게 돌아올까요? 왜 그렇게 생각하나요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 4
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "가까우면 알려 주기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 센서는 거리를 바로 알려 주지 않아요. 센서가 주는 것은 소리가 **갔다 온 시간**뿐이에요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 시간을 거리로 바꾸려면 무엇을 알아야 할지도 생각해 봐요.
        todo:
          - "**알아야 할 것**: 보드가 미리 알고 있어야 할 사실 적기 (소리는 얼마나 빠를까요?)"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["소리를 쏘는 핀(Trig 13번)과 듣는 핀(Echo 12번)", "소리 빠르기 (1초에 약 340m)", "센서가 주는 것은 거리가 아니라 소리가 갔다 온 시간"]
          decide: ["몇 cm 보다 가까우면 알릴지 (기준 거리)", "몇 초마다 잴지"]
          act: ["소리를 쏘고 돌아올 때까지 시간 재기", "시간을 거리(cm)로 바꾸기", "거리를 출력하고, 가까우면 LED 켜기", "이것을 끝없이 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 어떤 숫자가 찍힐까?
        minutes: 4
        scene:
          image: images/ultrasonic-principle.svg
          caption: trig 가 소리를 쏘고, 벽에 부딪혀 돌아온 메아리를 echo 가 들어요
        body: |
          활동 칸의 코드는 0.5초마다 거리를 재서 `23 cm` 처럼 찍어요. 아직 실행하지 않아요.

          그림처럼 소리가 갔다 오는 시간의 **절반**에 소리 빠르기를 곱하면 거리가 나와요. 세 경우에 찍힐 숫자를 cm 로 예측해 적어 보세요. 정답을 맞히기보다 **내 예측과 근거를 먼저 적는 것**이 중요해요.
        todo:
          - 코드를 위에서부터 한 줄씩 소리 내어 읽기
          - 거리를 찍는 줄과 기다리는 줄 찾기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_distance.py
        blanks:
          - { q: "센서 앞 1m 쯤 떨어진 벽을 향하면?", unit: cm }
          - { q: "손바닥을 센서 앞 10cm 쯤에 대면?", unit: cm }
          - { q: "창문 밖 먼 허공을 향하면?", unit: cm }

      - id: run
        type: run
        title: 복사 · 실행 — 거리 재기
        minutes: 6
        scene:
          image: images/wiring-breadboard.svg
          caption: "초음파 VCC → 5V, GND → GND, Trig → io13, Echo → io12 에 바로. LED 는 io26 → 9번 줄 → 저항 → 긴 다리, 짧은 다리 줄 → io26 기둥 G"
          captionDevkit: "초음파 VCC → VIN(5V), GND → GND, Trig → D13, Echo → D12 에 바로. LED 는 D26 → 3번 줄 → 저항 → 긴 다리, 짧은 다리 줄 → 아래 줄 GND"
        body: |
          **USB 를 뺀 채로** 안내 칸의 **부품과 배선**의 배선도를 보고 센서를 꽂아요. **GND 선을 가장 먼저** 꽂고, VCC 는 3V3 이 아니라 **5V**(VIN) 핀에 이어요. LED도 지금 같이 꽂아 두면 미션에서 바로 쓸 수 있어요.

          실행한 뒤 손을 센서 앞에서 앞뒤로 움직여 보세요. 숫자가 따라 바뀌나요? 자로 10cm · 20cm 에 손을 대고 찍힌 숫자를 예측과 비교해 공책에 적어요.
        todo:
          - "**부품과 배선**대로 센서(VCC · Trig · Echo · GND)와 LED 꽂기"
          - "**보드 연결** → **실행** 누르기"
          - 손을 10cm · 20cm 에 대 보고 찍힌 숫자를 예측과 비교하기
        code: step1_distance.py
        expected: 코드를 실행하면 2초 뒤부터 출력 칸에 `23 cm` 처럼 센서 앞 물체까지의 거리가 0.5초마다 한 줄씩 찍혀요. 손을 가까이 대면 숫자가 작아지고, 멀리 떼면 커져요.
        codeNotes:
          - { line: 4, note: "13번 핀(Trig)을 내보내는 핀으로 정하고 `trig` 라고 이름 붙여요" }
          - { line: 5, note: "12번 핀(Echo)을 받아들이는(입력) 핀으로 정하고 `echo` 라고 이름 붙여요" }
          - { line: 8, note: "`def get_distance():` 거리를 재서 cm 로 알려 주는 함수를 만들어요" }
          - { line: 9, note: "Trig 에 1 을 주고 10마이크로초 뒤 0 으로 돌리면 센서가 소리를 쏘아요" }
          - { line: 12, note: "Echo 가 1 이 될 때까지(소리가 나갈 때까지) 기다려요" }
          - { line: 14, note: "Echo 가 1 이 된 순간의 시각(마이크로초)을 `start` 에 적어 둬요" }
          - { line: 17, note: "Echo 가 0 으로 돌아온 순간(메아리가 돌아온 때)의 시각을 `stop` 에 적어 둬요" }
          - { line: 18, note: "`ticks_diff` 로 두 시각의 차이(왕복 시간)를 구하고 `// 2` 로 절반만 남겨요" }
          - { line: 19, note: "소리 빠르기 340m/s 를 곱하고 10000 으로 나눠 cm 로 바꿔 돌려줘요" }
          - { line: 22, note: "센서가 깨어날 시간 2초를 기다려요" }
          - { line: 25, note: "거리를 재서 숫자와 `cm` 를 출력 칸에 찍어요" }
          - { line: 26, note: "0.5초(500ms) 쉬고 다시 재요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 거리 공식 따라가기
        minutes: 6
        scene:
          image: images/read-code.svg
          caption: 네 문제의 답은 모두 활동 칸의 코드와 원리 카드의 ①~⑥ 식 안에 있어요
        body: |
          방금 본 숫자가 코드의 어디에서 나왔는지 확인해요. `get_distance` 함수의 마지막 두 줄이 **시간을 거리로 바꾸는** 곳이에요. 챕터 화면 원리 카드의 ①~⑥ 식과 짝지어 읽어 보세요.

          계산 문제는 공책에 식을 한 줄씩 적어 가며 풀고, 답을 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - "`get_distance` 함수의 마지막 두 줄을 소리 내어 읽기"
          - 1000 µs 를 넣어 두 줄을 차례로 공책에 계산해 보기
          - 네 문제에 답하고 **확인** 누르기
        code: step1_distance.py
        questions:
          - { kind: number, q: "코드는 소리가 1초에 약 몇 m 를 간다고 보고 계산하나요?", answer: 340, hint: "거리를 돌려주는 return 줄에서 곱하는 숫자를 찾아봐요" }
          - { kind: choice, q: "t = time.ticks_diff(stop, start) // 2 에서 2로 나누는 까닭은?", options: ["소리가 물체까지 갔다가 돌아온 왕복 시간이라서", "센서에 동그라미가 두 개 있어서", "2초마다 한 번씩 재려고"], answer: 0 }
          - { kind: number, q: "메아리가 1000 µs(마이크로초) 만에 돌아왔어요. 몇 cm 가 찍힐까요?", answer: 17, hint: "먼저 t = 1000 // 2, 그다음 340 × t // 10000" }
          - { kind: line, q: "마이크로초 시간을 cm 거리로 바꾸는 줄의 번호를 클릭하세요", answer: 19 }
        codeNotes:
          - { line: 4, note: "13번 Trig 는 소리를 쏘는 핀이에요" }
          - { line: 5, note: "12번 Echo 는 메아리를 듣는 핀이에요" }
          - { line: 9, note: "Trig 에 1 을 아주 짧게(10µs) 줘서 소리를 쏘아요" }
          - { line: 14, note: "소리가 나간 순간의 시각을 적어 둬요" }
          - { line: 17, note: "메아리가 돌아온 순간의 시각을 적어 둬요" }
          - { line: 25, note: "함수가 돌려준 거리를 찍어요" }

      - id: mission
        type: mission
        title: 미션 — 가까우면 켜지는 경고등
        minutes: 7
        scene:
          image: images/threshold.svg
          caption: "기준선 15 cm: 이보다 가까우면 LED 켜기, 15 cm 이상이면 LED 끄기"
        body: |
          지금 코드는 거리를 찍기만 해요. 이제 보드가 **판단**하게 해 봐요: 15cm 보다 가까우면 LED를 켜고, 멀어지면 다시 꺼요. 주차 센서의 경고등처럼요.

          잰 거리를 `d` 라는 이름에 한 번 담아 두면, 출력과 판단에 같은 숫자를 쓸 수 있어요. 한 번 켠 LED는 누가 꺼 줄까요?
        todo:
          - LED를 26번 핀에 준비하는 줄 넣기
          - 거리를 `d` 에 담고, if · else 로 LED 켜고 끄기
          - 실행해서 손을 15cm 안팎으로 움직여 보고 **판정** 누르기
        instructions: "LED를 26번 핀에 준비하고(이름 led), 반복 안에서 잰 거리를 d 에 담아 d 와 \"cm\" 를 함께 출력하세요. d 가 15 보다 작으면 LED 켜기, 그렇지 않으면 LED 끄기. 0.5초 기다리기는 지금처럼 남겨 두세요"
        hint: "`d = get_distance()` 다음 줄에 출력, 그 아래 `if d < 15:` 와 `else:`. 켜고 끄는 줄은 한 칸 더 들여쓰기"
        code: step1_distance.py
        rules:
          - pinIs: { name: led, pin: 26 }
            fail: 경고 LED는 몇 번 핀에 꽂았나요? 코드에 그 핀을 LED(led)로 준비하는 줄이 있나요?
          - codeMatches: '^\s+d\s*=\s*get_distance\(\)$'
            fail: 거리를 한 번 재서 d 에 담아 두었나요? 그래야 출력과 판단에 같은 숫자를 쓸 수 있어요
          - codeMatches: '^\s+if (?:d\s*<\s*15|15\s*>\s*d)\s*:$'
            fail: LED를 켤지 정하는 if 줄이 있나요? 15 보다 작을 때예요
          - codeMatches: '^\s+else\s*:$'
            fail: 손이 15cm 밖으로 나가면 LED는 어떻게 되어야 할까요? 한 번 켠 LED는 누가 끌까요?
          - codeMatches: '^led\s*=\s*Pin\(\s*26\s*,\s*Pin\.OUT\s*\)'
            fail: LED 는 보드가 신호를 내보내는 쪽인가요, 받는 쪽인가요? 준비하는 줄에 그것이 적혀 있나요?
          - codeMatches: 'print\(\s*d\s*,\s*"cm"\s*\)'
            fail: 잰 거리 d 와 "cm" 를 함께 찍고 있나요?
          - codeMatches: 'if (?:d\s*<\s*15|15\s*>\s*d)\s*:\n\s+led\.value\(1\)'
            fail: 15 보다 가까울 때 LED 는 켜져야 할까요, 꺼져야 할까요? if 안에서 LED 에게 무엇을 시키나요?
          - codeMatches: 'else\s*:\n\s+led\.value\(0\)'
            fail: 15 이상일 때 LED 에게 무엇을 시키나요? else 안에 켜기와 끄기 가운데 어느 것이 있나요?
          - codeMatches: '^\s+time\.sleep_ms\(\s*500\s*\)|^\s+time\.sleep\(\s*0\.5\s*\)'
            fail: 0.5초 기다리기는 지금처럼 남아 있나요?
        answerCode: mission_near_led.py

      - id: debug
        type: debug
        title: 디버깅 — 거리가 이상해요
        minutes: 6
        scene:
          image: images/breadboard-basics.svg
          caption: 같은 번호 줄의 다섯 칸은 이어져요. LED 다리와 선이 같은 번호 줄에 꽂혔는지, 센서 선 네 가닥이 맞는 핀에 씌워졌는지부터 봐요
        body: |
          고장 난 거리 재기 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 초음파 센서의 숫자 문제는 대부분 **선과 핀 번호**에서 시작해요.

          멈춘 것 같으면 **정지** 버튼을 먼저 눌러요. 그리고 코드가 지금 무엇을 기다리고 있는지 떠올려 보세요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정** (증상 3은 선을 고친 뒤 판정)
          - 세 증상을 모두 고치기
        symptoms:
          - title: 실행해도 숫자가 하나도 안 나와요. 멈춘 것 같아요
            code: "trig = Pin(13, Pin.OUT)\necho = Pin(14, Pin.IN)"
            question: "`while not echo.value():` 는 Echo 핀이 1 이 될 때까지 기다려요. 코드가 듣는 핀에 메아리 신호가 정말 들어오나요? Echo 선은 실제로 몇 번에 꽂혀 있나요? 번호가 맞는데도 멈춘다면 Echo 선이 빠지지 않았는지도 보세요"
            rules:
              - codeMatches: 'echo = Pin\(12, Pin\.IN\)'
                fail: 배선도에서 Echo 선은 몇 번 핀으로 가나요? 코드의 숫자와 같나요?
          - title: 숫자가 계속 0 만 나와요
            code: "trig = Pin(12, Pin.OUT)\necho = Pin(13, Pin.IN)"
            question: 숫자 문제는 배선부터 봐요. 소리를 쏘는 선과 듣는 선이 실제로 몇 번에 꽂혀 있는지, 코드의 번호와 짝지어 보세요. 어디가 바뀌었나요?
            rules:
              - codeMatches: 'trig = Pin\(13, Pin\.OUT\)'
                fail: 쏘는 선(Trig)과 듣는 선(Echo), 어느 쪽이 13번이죠?
              - codeMatches: 'echo = Pin\(12, Pin\.IN\)'
                fail: 듣는 선(Echo)은 몇 번에 꽂혀 있나요?
          - title: 숫자가 들쭉날쭉 튀어요 (8, 213, 15, 0 …)
            code: "trig = Pin(13, Pin.OUT)\necho = Pin(12, Pin.IN)"
            question: 이번에는 코드가 맞아요. 센서 VCC 선은 보드의 몇 V 핀에 꽂혀 있나요? 이 센서는 5V 로 움직여요. 선을 옮긴 뒤 다시 실행하고, 코드는 그대로 둔 채 판정을 눌러요
            rules:
              - codeMatches: 'trig = Pin\(13, Pin\.OUT\)'
                fail: 코드는 그대로 두고 선을 고쳐요. Trig 13번 줄이 그대로 있나요?

      - id: design
        type: design
        title: 설계 — 주차 센서처럼 단계별로 알리기
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 벽에 가까워질수록 주차 센서는 다르게 알려 줘요. 거리를 세 구간으로 나눠 봐요
        body: |
          진짜 주차 센서는 멀 때는 조용하고, 가까워지면 깜빡이고, 아주 가까우면 계속 켜져요. 이번에는 거리를 **세 구간**으로 나눠 LED가 다르게 움직이게 설계해요.

          "아주 가까움"을 먼저 묻고, 아니면 "조금 가까움"을 물어야 해요. 순서를 바꾸면 어떻게 될지도 생각해 봐요.
        todo:
          - 우리말 설계도의 빈칸을 채우고 **빈칸 확인** 누르기
          - 번역표에서 우리말 한 줄이 어떤 코드가 되는지 짝지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **판정** 누르기
        pseudocode:
          - text: 초음파 센서를 trig __번, echo 12번에 준비한다
            blank: { answer: 13 }
          - text: LED를 26번 핀에 준비한다
          - text: 센서가 깨어나도록 2초 기다린다
          - text: 끝없이 되풀이한다
          - text: "  ↳ 거리를 재서 d 에 담고 출력한다"
          - text: "  ↳ d 가 __ 보다 작으면 LED를 켠다 (아주 가까움)"
            blank: { answer: 10 }
          - text: "  ↳ 아니고 d 가 __ 보다 작으면 LED를 0.1초 켰다 끈다 (깜빡)"
            blank: { answer: 30 }
          - text: "  ↳ 둘 다 아니면 LED를 끈다"
          - text: "  ↳ __ms 기다린다"
            blank: { answer: 300 }
        translation:
          - ["초음파 센서 준비 (13 · 12)", "trig = Pin(13, Pin.OUT) · echo = Pin(12, Pin.IN) · def get_distance()"]
          - ["LED 준비 (26번)", "led = Pin(26, Pin.OUT)"]
          - ["거리를 재서 d 에 담는다", "d = get_distance()"]
          - ["만약 ~면 / 아니고 ~면 / 둘 다 아니면", "if · elif · else"]
          - ["0.1초 켰다 끈다", "led.value(1) · time.sleep_ms(100) · led.value(0)"]
          - ["ms 기다린다", "time.sleep_ms(ms)"]
        targetCode: design_parking.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 소리가 갔다 오는 시간으로 거리를 쟀어요. 이 생각을 또 어디에 쓸 수 있을까요?
        body: |
          오늘은 소리가 갔다 오는 시간을 재서 거리로 바꾸고, 가까우면 켜지는 경고등을 만들었어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요.

          먼저 미션 코드의 줄마다 "이 줄은 ___"을 내 말로 채우고, 네 칸에 오늘 있었던 일을 솔직하게 적어요. 다 쓰면 짝에게 1분 동안 설명해 보세요.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸을 모두 채우기
          - 짝에게 1분 동안 설명하기
        lineExplain: mission_near_led.py
        prompts:
          - 오늘 가장 오래 막혔던 곳은 어디였고, 어떻게 풀었나요?
          - 코드에서 왜 2로 나누는지, 340 과 10000 은 각각 무엇인지 친구에게 설명하듯 써 보세요
          - 박쥐 · 주차 센서처럼 소리로 거리를 재는 것을 우리 생활에서 하나 더 찾고, 어디에 쓰면 좋을지 적어 보세요
          - "다음엔 여기부터 본다: 한 줄로"
