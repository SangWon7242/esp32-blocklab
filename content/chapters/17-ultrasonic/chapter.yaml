# 센서 트랙 S14 · 초음파 거리 — 원본: 아두이노 기본 W07(초음파 거리 공식 유도 ①~⑥), 챕터 10 교사용 지도안·학생용 진행표(예상 오류). 10장 F3 1부의 기초. 형식 설명은 src/track/README.md
id: 17-ultrasonic
order: 17
track: sensor
label: S14
prerequisites: [11-button-touch]
subjects: [과학, 수학]
sessions: 1
teacherNotes: |
  **핀** 초음파 Trig 13 · Echo 12(계획 11 핀 표, 10장 F3 자동문과 같은 자리), LED 26(1·2장 자리). 코드의 `get_distance()` 함수는 블록의 "초음파 센서 준비하기"가 만드는 본문 그대로라 블록과 코드가 오간다.

  **전원** HC-SR04 는 **5V** 로 움직인다. 3V3 에 꽂으면 값이 들쭉날쭉하거나 아예 안 나온다(디버깅 증상 3). Echo 는 5V 신호라 키트 튜토리얼처럼 바로 잇지만, 오래 켜 두는 작품에서는 1kΩ · 2kΩ 분압을 권한다. 배선은 USB 를 뺀 채, GND 선부터.

  **멈춤** Echo 선이 빠지거나 코드의 echo 핀 번호가 틀리면 `while not echo.value():` 에서 끝없이 기다려 멈춘 것처럼 보인다(디버깅 증상 1). 정지 버튼으로 멈추고 선을 확인한다. Trig · Echo 를 바꿔 꽂았을 때는 지도안처럼 0 이 계속 나오기도 하고 멈추기도 한다(센서마다 다름).

  **기준값** 미션의 15 cm 는 예시 값이다. 판정은 지시의 숫자 그대로여야 통과하므로, 판정 뒤에 모둠마다 쓰임새에 맞는 숫자로 바꿔 보게 한다. 설계의 10 cm · 30 cm 도 예시다.

  **측정** 재는 범위는 약 2~400 cm. 센서를 손바닥으로 완전히 덮거나, 부드러운 천 · 비스듬한 면을 향하면 0 이나 아주 큰 수가 나올 수 있다 — 예측 활동의 이야깃거리로 쓴다.

  - 1차시(45분): 문제 만나기 ~ 성찰. 시간이 모자라면 설계를 과제로
  - 수학 융합: 원본 W07 의 거리 공식 유도 ①~⑥(단위 바꾸기 m → cm, s → µs, 왕복이라 ÷ 2)을 원리 카드 그림으로 옮겼다. 읽기 체크 3번(1000 µs → 17 cm)을 칠판에서 함께 계산한다
  - 과학 융합: 사람이 듣는 소리는 약 20kHz 까지, 센서는 40kHz. 박쥐 · 돌고래의 반향정위
  - 이 챕터를 마친 반은 10장(F3) 1부를 짧은 복습으로 넘길 수 있다
title: 초음파 거리
subtitle: 소리가 갔다 오는 시간으로 거리 재기
summary: |
  박쥐는 깜깜한 밤에도 소리를 쏘고 **메아리**를 들어 부딪히지 않고 날아요. 자동차의 주차 센서도 같은 방법을 써요.
  오늘은 **초음파 센서**로 소리가 갔다 오는 시간을 재고, 그 시간을 **cm** 로 바꾸는 공식을 직접 따라가요. 마지막에는 15 cm 보다 가까우면 LED가 켜지는 경고등을 만들어요.
