<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sfd-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="sfd-title">위험 거리 수직선: 0 에서 12 cm 까지의 수직선에서 2 초과 8 미만(두 끝은 빈 동그라미)을 칠해 "멈춤" 구간으로 표시. 8 이상은 계속 돌기, 2 이하에는 센서가 잘못 읽은 0 이 떨어진다</title>
  <text x="40" y="52" font-size="16" font-weight="700" fill="currentColor" stroke="none">어디부터 어디까지를 위험으로 볼까?</text>
  <rect x="40" y="70" width="290" height="34" rx="8" fill="var(--card)"/>
  <text x="54" y="93" font-size="15" font-weight="700" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">if d &gt; 2 and d &lt; 8:</text>
  <!-- 구간 색 -->
  <rect x="133" y="150" width="276" height="44" rx="6" fill="#c92a2a" fill-opacity="0.18" stroke="none"/>
  <text x="271" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">멈춤 (모드 0)</text>
  <rect x="409" y="150" width="190" height="44" rx="6" fill="#2f9e44" fill-opacity="0.16" stroke="none"/>
  <text x="504" y="178" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">계속 돌기</text>
  <!-- 수직선 -->
  <path d="M64 222 H600" stroke-width="2.5"/>
  <path d="M133 222 H409" stroke="#c92a2a" stroke-width="6"/>
  <g stroke-width="2">
    <path d="M64 214 V230 M110 216 V228 M156 216 V228 M202 216 V228 M248 216 V228 M294 216 V228 M340 216 V228 M386 216 V228 M432 216 V228 M478 216 V228 M524 216 V228 M570 216 V228"/>
  </g>
  <circle cx="133" cy="222" r="8" fill="var(--card)" stroke="#c92a2a" stroke-width="3"/>
  <circle cx="409" cy="222" r="8" fill="var(--card)" stroke="#c92a2a" stroke-width="3"/>
  <g font-size="14" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="64" y="252">0</text>
    <text x="133" y="252" font-weight="700">2</text>
    <text x="202" y="252">4</text>
    <text x="294" y="252">6</text>
    <text x="409" y="252" font-weight="700">8</text>
    <text x="524" y="252">10</text>
    <text x="600" y="252">cm</text>
  </g>
  <!-- 잘못 읽은 0 -->
  <circle cx="64" cy="222" r="6" fill="currentColor" stroke="none"/>
  <path d="M64 268 V236"/>
  <rect x="24" y="270" width="210" height="44" rx="10" fill="var(--card)" stroke-width="1.5"/>
  <text x="129" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">센서가 잘못 읽은 0</text>
  <text x="129" y="305" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8" stroke="none">메아리를 놓치면 0 이 찍혀요</text>
  <rect x="300" y="270" width="300" height="44" rx="10" fill="var(--card)" stroke-width="1.5"/>
  <text x="450" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none">빈 동그라미 = 그 수는 넣지 않아요</text>
  <text x="450" y="305" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8" stroke="none">2 초과(2보다 큼) · 8 미만(8보다 작음)</text>
  <text x="320" y="342" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">숫자 2 · 8 은 예시예요. 내 선풍기에 맞게 정해요</text>
</svg>
