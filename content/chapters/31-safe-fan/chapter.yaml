      - id: mission
        type: mission
        title: 미션 — 손이 가까우면 멈추기 (통합 평가)
        minutes: 12
        scene:
          image: images/danger-range.svg
          caption: 2 cm 초과 8 cm 미만이면 멈춤. 빈 동그라미는 그 수를 넣지 않는다는 뜻이에요
        body: |
          이제 안전 기능을 더해 선풍기를 완성해요. 초음파 센서를 **18 · 19번**으로 준비하고, 바퀴마다 거리를 재서 **2 cm 초과 8 cm 미만**이면 팬을 멈추고 꺼짐(모드 0)으로 바꿔요.

          판정은 기능 체크리스트예요. 새 기능뿐 아니라 켜기 · 끄기, 세기 순환, 꺼졌을 때 B 무시도 **그대로 되는지** 함께 봐요. 시험은 손가락 말고 종이나 막대로 해요.
        todo:
          - 초음파 센서 준비 블록을 넣고 Trig 18 · Echo 19 로 맞추기
          - 팬을 맞추기 전에 거리를 재고, 위험 범위면 speed 와 mode 를 0 으로 바꾸기
          - 막대를 5 cm 쯤에 대어 멈추는지 시험하고 **판정** 누르기
        instructions: 거리가 2 cm 초과 8 cm 미만이면 팬을 멈추고 꺼짐(모드 0)으로 바꿔 주세요. 버튼 A 켜기 · 끄기, 버튼 B 세기 순환(900 다음은 300), 꺼져 있을 때 B 무시도 그대로 되어야 해요. 초음파는 Trig 18 · Echo 19 예요
        hint: 반복 안 팬을 맞추는 줄(forward) 앞에 `d = get_distance()` 를 넣어요. 그다음 "d 가 2 보다 크고 그리고 d 가 8 보다 작으면" 조건 안에서 mode 와 speed 를 0 으로 바꿔요. 논리 블록의 "그리고"를 써요
        code: step2_speed_levels.py
        rules:
          - codeMatches: 'if (button_a\.value\(\) == 0|not button_a\.value\(\)):\n\s+(if mode == 0:\n\s+(mode = 1\n\s+speed = 300|speed = 300\n\s+mode = 1)\n\s+else:\n\s+(mode = 0\n\s+speed = 0|speed = 0\n\s+mode = 0)|mode = 1 - mode)'
            fail: (기능 1) 버튼 A 를 누를 때마다 켜짐 · 꺼짐이 바뀌나요? 꺼져 있었으면 모드와 세기가 무엇이 되고, 켜져 있었으면 무엇이 되나요?
          - codeMatches: 'speed (= speed \+ 300|\+= 300)\n\s+if speed (> 900|>= 1000|> 1000|>= 1200|== 1200):\n\s+speed = 300|(\w+) (= \3 \+ 1|\+= 1)\n\s+if \3 (> 3|>= 4|== 4):\n\s+\3 = 1[\s\S]*speed = .*\3 \* 300'
            fail: (기능 2) 900 에서 B 를 한 번 더 누르면 세기는 얼마가 되나요? 900 을 넘었을 때 300 으로 돌아오게 하는 곳이 있나요?
          - codeMatches: 'if ((mode == 1|mode != 0) and (button_b\.value\(\) == 0|not button_b\.value\(\))|(button_b\.value\(\) == 0|not button_b\.value\(\)) and (mode == 1|mode != 0)):|if (mode == 1|mode != 0):\n\s+if (button_b\.value\(\) == 0|not button_b\.value\(\)):|if (button_b\.value\(\) == 0|not button_b\.value\(\)):\n\s+if (mode == 1|mode != 0):'
            fail: (기능 3) 꺼져 있을 때 B 를 누르면 팬이 돌기 시작하지 않나요? B 를 볼 때 모드도 함께 묻고 있나요?
          - codeMatches: 'if ((\w+(?:\(\))?) > 2 and \2 < 8|(\w+(?:\(\))?) < 8 and \3 > 2|2 < (\w+(?:\(\))?) and \4 < 8|2 < (\w+(?:\(\))?) < 8):\n(\s+.*\n)*?\s+(mode = 0\n\s+speed = 0|speed = 0\n\s+mode = 0|mode = 0\n[\s\S]*speed = mode \*)'
            fail: (기능 4) 손이 5 cm 에 있을 때 팬이 멈추고 꺼짐으로 바뀌나요? 2 초과 8 미만, 두 끝을 모두 묻고 있나요? 모드는 그대로 두면 다음 바퀴에 어떻게 될까요?
          - pinIs: { name: trig, pin: 18 }
            fail: 초음파의 Trig 는 몇 번 핀에 꽂았나요? 팬이 13 · 12번을 쓰고 있지 않나요?
          - pinIs: { name: echo, pin: 19 }
