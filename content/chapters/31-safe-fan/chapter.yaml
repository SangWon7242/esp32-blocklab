              motor1a = PWM(Pin(13))
              motor1b = PWM(Pin(12))
              motor1a.freq(1000)
              motor1b.freq(1000)
              trig = Pin(18, Pin.OUT)
              echo = Pin(19, Pin.IN)


              def forward(speed):
                  motor1a.duty(speed)
                  motor1b.duty(0)


              def backward(speed):
                  motor1a.duty(0)
                  motor1b.duty(speed)


              def stop():
                  motor1a.duty(0)
                  motor1b.duty(0)


              def get_distance():
                  trig.value(1)
                  time.sleep_us(10)
                  trig.value(0)
                  while not echo.value():
                      pass
                  start = time.ticks_us()
                  while echo.value():
                      pass
                  stop = time.ticks_us()
                  t = time.ticks_diff(stop, start) // 2
                  return int(340 * t // 10000)


              mode = 1
              speed = 600
              while True:
                  d = get_distance()
                  print(d, speed)
                  if d < 8:
                      mode = 0
                      speed = 0
                  forward(speed)
                  time.sleep(0.1)
            question: 센서가 메아리를 놓쳐 0 을 읽으면 `d < 8` 은 참일까요, 거짓일까요? 수직선 그림에서 0 은 어느 구간에 떨어지나요?
