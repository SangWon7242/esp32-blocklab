# 챕터 31 · 안전 선풍기 — 교과 융합 F4. 원본: 마이크로비트 심화 W03 안전선풍기(SDG 3). 형식 설명은 src/track/README.md
# 팬(13·12)과 초음파(원래 13·12)가 겹치므로 초음파를 Trig 18 · Echo 19 로 옮겼다(키트 튜토리얼 2-4-22 배치)
id: 31-safe-fan
order: 31
track: fusion
label: F4
prerequisites: [07-fan, 11-button-touch, 17-ultrasonic]
subjects: [과학, 보건, 수학]
sdg: [3]
sessions: 2
teacherNotes: |
  **교과 연결**
  - 과학: 전기의 이용 · 에너지 전환(전기 에너지 → 운동 에너지). 원리 카드 그림으로 배터리 → 모터 → 날개를 짚고, PWM 세기 300 · 600 · 900 을 "1023 가운데 켜져 있는 몫"으로 읽는다
  - 수학: 초과 · 미만과 수직선(빈 동그라미), 300 씩 늘어나는 규칙(단계 × 300), 0 을 곱하면 0(설계의 `speed = mode * level * 300`)
  - 보건: 생활 안전 — 집 안에서 아이 · 어르신이 다칠 수 있는 전기 제품 찾기, 날개 없는 선풍기 사례. 사회 시간의 SDG 3(건강과 복지)과 이어도 좋다

  **안전**
  - 팬 날개가 도는 동안 손가락으로 시험하지 않는다. 안전 기능 시험은 **종이 · 자 · 나무 막대**를 센서 앞에 대어서 한다
  - 모터는 전기를 많이 쓰므로 보드 외부 전원 단자에 **배터리 홀더**(AA 6개)를 꽂아 쓴다(7장과 같다). 기본 보드(DevKit)는 외부 전원 단자가 없어 USB 전원으로 돌리고, 보드가 저절로 다시 시작되면 다른 USB 포트에 꽂아 본다. 배선은 USB · 배터리를 모두 뺀 채로
  - 날개는 배선과 첫 실행이 끝난 뒤에 끼운다. 코드를 올리는 순간 팬이 잠깐 돌 수 있다고 미리 알린다

  **기준값은 예시** 위험 거리 2 cm · 8 cm, 세기 300 · 600 · 900 은 원본 수업의 값이다. 미션 판정은 이 숫자로 보지만, 판정 뒤에 모둠마다 컵 크기 · 센서 위치에 맞게 바꿔 보게 한다. 출력 창의 거리 값을 먼저 보고 정하게 하면 좋다.

  **측정값 안내** 초음파는 2 cm 보다 가까운 것, 비스듬한 면, 천처럼 부드러운 면을 잘 못 재고, 메아리를 놓치면 `0` 을 돌려준다. 모터가 돌면 전원이 흔들려 0 이 더 자주 나오기도 한다. 그래서 원본도 "2 보다 크고"를 함께 썼다(디버깅 증상 3). 다만 손이 센서에 **딱 붙으면**(2 cm 안쪽) 멈추지 않을 수 있다 — 성찰 2번 문항에서 "그럼 어떻게 막을까?"(컵 테두리 · 망으로 손이 2 cm 안쪽에 못 들어오게)를 토의한다.

  **메이킹(종이컵 · 박스지)** 종이컵 바닥에 팬 모듈을 테이프로 붙여 날개가 컵 밖으로 나오게 하고, 컵 옆면에 초음파 센서의 두 눈이 들어갈 구멍 둘을 뚫어 **팬과 같은 쪽**을 보게 한다. 박스지로 받침을 만들어 컵을 눕혀 고정하고, 버튼 · LED 브레드보드는 받침 앞에 둔다. 메이킹은 2차시 끝이나 다음 시간 20분.

  - 1차시: 문제 만나기 ~ 읽기 체크(배선 전체를 이때 끝낸다)
  - 2차시: 실행 2 ~ 성찰
  - 버튼 떨림으로 한 번 누름이 두 번 세지면 손을 뗄 때까지 기다리는 `while` 의 `time.sleep(0.01)` 을 `0.05` 로 늘린다
title: 안전 선풍기
subtitle: 버튼 두 개와 초음파로 만드는, 손을 먼저 알아채는 선풍기
summary: |
  동생이 돌아가는 선풍기에 손가락을 넣으려 해요. 오늘은 **팬 · 버튼 두 개 · 초음파 센서 · LED 세 개**를 한 보드에 묶어, 손이 가까이 오면 먼저 멈추는 **안전 선풍기**를 만들어요.
  1부에서 버튼 A 로 켜고 끄는 **모드 변수**를 익히고, 2부에서 버튼 B 로 세기를 300 → 600 → 900 으로 바꾼 뒤 **2 cm 초과 8 cm 미만**이면 멈추는 안전 기능을 더해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 배선할 때는 USB 를 빼 두기 }
  - { name: 130 모터(팬) 모듈 + 날개, note: "핀 4개: G · V · IN+ · IN−. 날개는 배선과 첫 실행이 끝난 뒤에 끼워요" }
  - { name: HC-SR04 초음파 센서, note: "핀 4개: VCC · Trig · Echo · GND. 팬과 같은 쪽을 보게 놓아요" }
  - { name: 버튼(푸시 버튼) 2개, note: "버튼 A(켜기 · 끄기), 버튼 B(세기). 가운데 홈에 걸쳐 꽂아요" }
  - { name: LED 3개 (초록 · 노랑 · 빨강), note: 세기 단계 표시. 긴 다리가 + }
  - { name: 220Ω 저항 3개, note: 빨강-빨강-갈색 띠 }
  - { name: 브레드보드, note: 버튼 · LED · 저항을 꽂는 판 }
  - { name: F-F 듀폰선 8가닥, board: plus, note: "양쪽 끝이 구멍인 선. 초음파 4가닥(5V · GND · 18 · 19), 팬 4가닥(13 · 12, G · V → I2C 묶음 GND · 5V)" }
  - { name: M-F 듀폰선 6가닥, board: plus, note: "보드 → 브레드보드: 14 · 27 · 25 · 26 · 33번 · GND" }
  - { name: 배터리 홀더 (AA 6개), board: plus, note: 보드 외부 전원 단자에 꽂아 모터 전기를 대요 }
  - { name: 브레드보드 + − 줄 조각, board: devkit, note: "VIN(5V) · GND 를 팬과 초음파가 나눠 쓰는 두 줄 띠" }
  - { name: F-F 듀폰선 5가닥, board: devkit, note: "팬 IN+ · IN− → D13 · D12, 초음파 Trig · Echo · GND → D18 · D19 · GND" }
  - { name: M-F 듀폰선 10가닥, board: devkit, note: "D14 · D27 · D25 · D26 · D33 → 브레드보드, VIN · GND · 팬 G · V · 초음파 VCC → 띠" }
  - { name: 점퍼선(M-M) 6가닥, board: plus, note: "LED 짧은 다리 줄 3 · 버튼 대각선 다리 줄 2 → − 줄, 위 − 줄 ↔ 아래 − 줄 1" }
  - { name: 점퍼선(M-M) 7가닥, board: devkit, note: "LED 짧은 다리 줄 3 · 버튼 대각선 다리 줄 2 → − 줄, 위 − 줄 ↔ 아래 − 줄 1, 아래 − 줄 ↔ 띠 − 줄 1" }
  - { name: 종이컵 · 박스지 · 테이프, note: 선풍기 몸체와 받침 만들기 }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "모듈은 F-F 듀폰선으로 보드에 바로: 초음파 VCC · GND · Trig · Echo → 위 줄 5V · GND · 18 · 19, 팬 IN+ · IN− → 13 · 12, 팬 G · V → io12 와 io14 사이 빈 틈으로 내려 I2C 묶음 GND · 5V. 버튼 · LED 는 맨 위 브레드보드: 버튼 A 3 · 5번 줄(14번 → 3번 줄, 대각선 5번 줄 → 위 − 줄), 버튼 B 7 · 9번 줄(27번 → 7번 줄, 9번 줄 → 위 − 줄). 25 · 26 · 33번 → 11 · 18 · 25번 줄 → 220Ω → LED 1 · 2 · 3 긴 다리(15 · 22 · 29번 줄), 짧은 다리 16 · 23 · 30번 줄 → 아래 − 줄. 33번은 아래 줄 io33. 위 − 줄과 아래 − 줄은 점퍼로 잇고, 아래 − 줄 → 보드 바깥으로 돌아 아래 줄 GND. 배터리 홀더는 외부 전원 단자에"
  captionDevkit: "보드 위 왼쪽 + − 줄 띠에 VIN · GND 를 잇고 팬 G · V 와 초음파 VCC 는 띠로(5V 를 나눠 써요). 팬 IN+ · IN− → D13 · D12. 초음파는 보드 아래: Trig → D18, Echo → D19, GND → 아래 줄 GND. 버튼 · LED 는 맨 위 브레드보드: 버튼 A 3 · 5번 줄(D14 → 3번 줄, 대각선 5번 줄 → 위 − 줄), 버튼 B 7 · 9번 줄(D27 → 7번 줄, 9번 줄 → 위 − 줄). D25 · D26 · D33 → 11 · 18 · 25번 줄 → 220Ω → LED 1 · 2 · 3 긴 다리, 짧은 다리 16 · 23 · 30번 줄 → 아래 − 줄. 위 − 줄 ↔ 아래 − 줄 점퍼, 아래 − 줄 ↔ 띠 − 줄. 외부 전원 단자가 없어 USB 전원으로 돌려요"
principle:
  image: images/energy-principle.svg
  body: |
    선풍기는 **에너지를 바꾸는 기계**예요. 배터리의 **전기 에너지**가 모터 안 코일을 전자석으로 만들고, 전자석과 자석이 밀고 당기며 축을 돌려 날개의 **운동 에너지**(바람)가 돼요.

    ESP32 는 모터에 PWM 으로 세기(0~1023)를 보내요. 300 은 1023 가운데 약 3할만 켜져 있어 약한 바람, 900 은 9할 가까이 켜져 있어 센 바람이에요. 단계가 하나 오를 때마다 **300 씩** 늘어나요.

    안전 기능은 초음파 센서가 맡아요. 손까지의 거리가 **2 cm 초과 8 cm 미만**이면 위험으로 보고 팬을 멈춰요. "2 보다 크다"는 조건은 센서가 메아리를 놓쳐 `0` 을 읽었을 때 잘못 멈추지 않게 해 줘요.
goals:
  content: 버튼 두 개 · 초음파 · 팬 · LED 를 한 프로그램으로 묶어, 모드 변수로 켜고 끄고 세기를 순환하며 위험 거리에서 멈추는 안전 선풍기를 만든다
  thinking: 기계가 "지금 어떤 상태인가"를 변수로 기억하고, 범위(초과 · 미만)와 규칙(300 씩)을 조건과 계산으로 옮기며, 안전 확인을 어디에 둘지 정한다
successCriteria:
  - 모드 변수(0 · 1)로 버튼 A 한 번에 켜짐 · 꺼짐이 바뀌는 까닭을 코드를 짚으며 설명할 수 있다
  - 세기가 900 을 넘으면 300 으로 돌아오고, 꺼져 있을 때는 버튼 B 가 아무 일도 하지 않게 할 수 있다
  - 거리가 2 cm 초과 8 cm 미만일 때 팬을 멈추게 하고, 왜 "2 보다 크다"가 필요한지 말할 수 있다
  - 생활 속 전기 제품의 위험을 하나 찾아 센서로 막는 방법을 제안할 수 있다
parts:
  - id: part1
    title: 1부 · 켜고 끄는 선풍기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 선풍기가 먼저 알아챌 수 있을까?
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 손이 8 cm 안쪽으로 다가오면 초음파 센서가 알아채고 팬을 멈춰요
        body: |
          동생이 돌아가는 선풍기에 손가락을 넣으려 해요. 어른이 늘 옆에 있을 수는 없는데, **선풍기가 먼저 알아채고 멈출 수** 있을까요?

          유엔의 지속가능발전목표 3번(건강과 복지)은 생활 속 사고를 줄이는 일도 담고 있어요. 그래서 날개를 아예 감춘 **날개 없는 선풍기**도 나왔어요. 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없어요.
        todo:
          - 준비물(팬 모듈, 초음파 센서, 버튼 2개, LED 3개)을 책상에 꺼내 놓기
          - 세 질문에 내 생각을 한두 문장씩 적기
          - 집 안에서 아이나 어르신이 다칠 수 있는 전기 제품을 하나 떠올려 함께 쓰기
        questions:
          - 선풍기가 "손이 가까이 왔다"는 것을 알려면 무엇을 재야 할까요? 몇 cm 안쪽을 위험으로 보면 좋을까요?
          - 버튼 하나로 켜고, 같은 버튼을 또 누르면 꺼져요. 선풍기는 지금 켜져 있는지 꺼져 있는지를 어떻게 기억할까요?
          - 꺼져 있는 선풍기의 세기 버튼을 누르면 어떻게 되어야 할까요? 그 까닭은?

      - id: analysis
        type: analysis
        title: 조건 분석 — 센서별로 세 칸 나누기
        minutes: 6
        scene:
          image: images/three-boxes.svg
          caption: 버튼 A · 버튼 B · 초음파마다 알아야 할 것, 정해야 할 것, 움직여야 할 것을 나눠요
        body: |
          안전 선풍기에는 입력이 셋(버튼 A, 버튼 B, 초음파), 출력이 둘(팬, LED)이에요. 한꺼번에 생각하면 엉키니까 **센서마다** 세 칸을 채워요.

          "정해야 할 것"에는 모드 번호, 세기 숫자, 위험 거리처럼 사람이 골라 줄 숫자를 적어요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 버튼 A · B 가 눌렸는지, 손까지의 거리"
          - "**정해야 할 것**: 모드 번호, 세기 단계 숫자, 위험으로 볼 거리"
          - "**움직여야 할 것**: 팬 속도, LED 단계 표시"
        answer:
          know: ["버튼 A(14번)가 눌렸는가 — 누르면 0", "버튼 B(27번)가 눌렸는가", "초음파로 잰 손까지의 거리(cm)"]
          decide: ["모드: 0 은 꺼짐, 1 은 켜짐", "세기: 300 · 600 · 900, 900 다음은 다시 300", "위험 거리: 2 cm 초과 8 cm 미만"]
          act: ["팬을 지금 속도로 돌리기(forward)", "세기 단계만큼 LED 켜기(1 · 2 · 3개)", "위험하면 속도 0 · 모드 0 으로 바꾸기"]

      - id: predict
        type: predict
        title: 예측하기 — 버튼 A 를 누를 때마다
        minutes: 5
        scene:
          image: images/mode-cycle.svg
          caption: 모드 0(꺼짐)과 모드 1(켜짐) 사이를 버튼 A 가 오가요. 오늘 1부는 이 그림의 A 화살표만 만들어요
        body: |
          아직 실행하지 않아요. 코드의 `mode` 는 선풍기가 지금 켜져 있는지(1) 꺼져 있는지(0)를 **기억하는 변수**이고, `speed` 는 팬 세기를 기억해요.

          버튼 A 를 처음 누를 때, 두 번째 누를 때 두 변수가 어떻게 바뀔지 코드를 따라가며 빈칸에 내 예측을 적어요.
        todo:
          - "`mode = 0` 과 `speed = 0` 이 반복 밖에 있는 까닭 생각하기"
          - 버튼 A 를 누를 때 지나가는 줄을 손가락으로 따라가기
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_on_off.py
        blanks:
          - q: 실행하고 아무것도 누르지 않으면 팬은 어떻게 될까요?
          - q: 버튼 A 를 한 번 누르면 출력 창에 찍히는 speed 는 얼마일까요?
          - q: 버튼 A 를 꾹 누른 채 3초 있으면 모드는 몇 번 바뀔까요?
            unit: 번

      - id: run
        type: run
        title: 복사 · 실행 — 버튼 A 로 켜고 끄기
        minutes: 14
        scene:
          image: images/wiring-breadboard.svg
          caption: 팬과 초음파는 보드에 바로, 버튼 두 개와 LED 세 개는 브레드보드에. 1부에서 배선을 모두 끝내요
