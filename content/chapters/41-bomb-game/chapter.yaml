  caption: "OLED 는 F-F 듀폰선으로 보드에 바로: GND · VCC · SDA · SCL → I2C 묶음 GND · 5V · SDA · SCL. 브레드보드는 보드 위에 두어요. 버튼 a 는 13 · 15번 줄에 걸쳐 꽂고 io14 → 13번 줄, 대각선 다리 15번 줄 → 위 − 줄. 버튼 b 는 17 · 19번 줄에 걸쳐 꽂고 io27 → 17번 줄, 대각선 다리 19번 줄 → 위 − 줄. (선택) 수동 부저 + 다리 22번 줄 ← io25, − 다리 25번 줄 → 아래 − 줄. 보드 GND → 아래 − 줄, 위 − 줄과 아래 − 줄은 점퍼선으로 이어요"
  captionDevkit: "OLED 는 F-F 듀폰선으로 보드에 바로: VCC → 3V3, GND → GND(아래 줄), SDA → D21, SCL → D22. 브레드보드는 보드 위에 두어요. 버튼 a 는 7 · 9번 줄에 걸쳐 꽂고 D14 → 7번 줄, 대각선 다리 9번 줄 → 위 − 줄. 버튼 b 는 11 · 13번 줄에 걸쳐 꽂고 D27 → 11번 줄, 대각선 다리 13번 줄 → 위 − 줄. (선택) 수동 부저 + 다리 16번 줄 ← D25, − 다리 19번 줄 → 아래 − 줄. 보드 GND → 아래 − 줄, 위 − 줄과 아래 − 줄은 점퍼선으로 이어요"
principle:
  image: images/grid-coordinates.svg
  body: |
    **좌표(수학)** OLED 는 가로 128 · 세로 64 개의 점으로 되어 있어요. 이 화면을 **5칸 × 5줄** 격자로 나누면 칸 하나는 폭 25 · 높이 12 점이에요. 칸 번호 `x` 에 25 를 곱하고 줄 번호 `y` 에 12 를 곱하면 네모를 그릴 픽셀 자리가 되어요. 그래서 폭탄과 플레이어는 0~4 사이의 **작은 숫자**만 기억하면 돼요.

    **시간(정보)** 보드는 한 번에 한 가지 일만 해요. `time.sleep(0.5)` 로 기다리는 동안은 버튼도, 다른 폭탄도 보지 못해요. 그래서 폭탄마다 **다음에 움직일 시각**을 리스트에 적어 두고, 반복마다 지금 시각 `time.ticks_ms()` 와 비교해 시각이 지난 폭탄만 한 줄 내려요. 그러면 세 폭탄이 각자 다른 빠르기로 떨어지는 것처럼 보여요.

    **확률(수학) · 감염병(보건)** 폭탄 칸은 0~4 가운데 하나를 똑같은 가능성으로 뽑으니, 폭탄 하나가 지금 내 칸에 떨어질 가능성은 **5분의 1** 이에요. 바이러스도 어디서 올지 모르니 미리 **피하는 습관**(손 씻기 · 거리 두기)이 가장 좋은 방어예요.
goals:
  content: OLED 격자 좌표와 버튼 두 개로 폭탄 피하기 게임을 만들고, 리스트와 다음 시각 비교로 폭탄 셋을 sleep 없이 각자 움직이게 한다
  thinking: 게임을 "입력 → 움직이기 → 비교 → 그리기" 덩어리로 나누고, 기다리는 대신 시각을 비교하면 여러 일을 함께 할 수 있다는 것을 깨닫는다
successCriteria:
  - 칸 번호 x · 줄 번호 y 를 픽셀 자리(x × 25, y × 12)로 바꾸는 식을 말할 수 있다
  - 플레이어를 0~4 안에서만 움직이고, 맨 밑에서 폭탄 칸과 플레이어 칸이 같으면 END 를 띄울 수 있다
  - 함수 안의 sleep 이 폭탄을 차례로만 움직이는 까닭과, 다음 시각 리스트가 이를 푸는 방법을 설명할 수 있다
  - 점수가 오르면 폭탄 간격이 줄되 200ms 보다 짧아지지 않게 할 수 있다
parts:
  - id: part1
    title: 1부 · 폭탄 하나 피하기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 떨어지는 바이러스를 피할 수 있을까?
        minutes: 5
        scene:
          image: images/cover.svg
          caption: 화면 맨 위에서 폭탄이 한 줄씩 내려와요. 버튼 a · b 로 플레이어 칸을 바꿔 피해요
        body: |
          감기나 독감 같은 감염병은 누가 걸릴지 모르게 퍼져요. 그래서 손 씻기 · 기침 예절 · 거리 두기처럼 **미리 피하는 습관**이 가장 좋은 약이에요. 모두가 건강하게 사는 것은 유엔 지속가능발전목표 **SDG 3**(건강과 웰빙)이기도 해요.

          오늘은 그 "피하기"를 게임으로 만들어요. 화면 맨 위에서 바이러스 폭탄이 떨어지고, 버튼 두 개로 플레이어를 움직여 피해요. 폭탄 셋이 **동시에** 떨어지려면 보드는 무엇을 해야 할까요? 코드를 보기 전에 내 생각부터 적어 봐요.
        todo:
          - 준비물(OLED, 버튼 2개, 브레드보드, 듀폰선, 점퍼선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 내가 아는 "피하기 게임"을 하나 떠올려 규칙을 한 줄로 적기
        questions:
          - OLED 화면은 점 128 × 64 개예요. 폭탄과 플레이어를 "몇 번 칸"처럼 작은 숫자로 다루려면 화면을 어떻게 나누면 좋을까요?
          - 폭탄이 맨 밑에 닿았을 때 보드는 "맞았다"를 어떻게 알 수 있을까요? 무엇과 무엇을 비교해야 할까요?
          - 폭탄 셋이 각자 다른 빠르기로 떨어지게 하려면, 보드는 폭탄마다 무엇을 기억해 두어야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 7
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 움직여야 할 것 순서로 나눠요
        body: |
          게임기를 부품마다 나눠 생각해 봐요. **버튼**은 플레이어를 움직이고, **OLED** 는 폭탄과 플레이어를 그리고, **보드**는 칸 번호와 시각을 기억해 비교해요.

          보드는 "저기 저 칸" 같은 말을 몰라요. 칸에 **0~4** 번호를 붙이고, 줄에도 0(맨 위)~4(맨 밑) 번호를 붙이면 숫자로 기억할 수 있어요. "맞았다"는 정확히 무엇이 같다는 뜻일까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 플레이어 칸, 폭탄 칸 · 줄, 시각처럼 보드가 기억해야 할 것 적기"
          - "**정해야 할 것**: 떨어지는 간격, 맞았다고 볼 규칙, 점수 같은 것 적기"
          - "**움직여야 할 것**: 버튼 · OLED · 보드가 차례대로 하는 일 적기"
        answer:
          know: ["플레이어 칸 번호 x (0~4)", "폭탄의 칸 번호 x 와 줄 번호 y (0 맨 위 ~ 4 맨 밑)", "지금 시각과 폭탄이 다음에 움직일 시각", "버튼은 누르면 0 이 된다"]
          decide: ["폭탄이 한 줄 내려오는 간격 (예: 0.5초, 2부에서는 400~900ms 랜덤)", "맞았다고 볼 규칙: 맨 밑에서 폭탄 칸과 플레이어 칸이 같다", "점수: 피한 폭탄 하나에 1점", "격자: 5칸 × 5줄, 칸 폭 25 · 높이 12 픽셀"]
          act: ["버튼 값을 읽어 플레이어 칸을 바꾸기 (0~4 안에서만)", "폭탄 줄을 하나 내리고, 맨 밑이면 비교한 뒤 맨 위로 보내기", "OLED 를 지우고 폭탄 · 플레이어 네모를 다시 그려 내보내기", "맞으면 END 와 점수를 보여 주기"]

      - id: predict
        type: predict
        title: 예측하기 — 칸 번호가 어떻게 바뀔까?
        minutes: 5
        scene:
          image: images/grid-coordinates.svg
