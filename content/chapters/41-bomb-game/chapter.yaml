# 교과 융합 F14 · 바이러스 폭탄 피하기 — 원본: 마이크로비트 심화 W04 폭탄 피하기 게임(SDG 3). 형식 설명은 src/track/README.md
# OLED(SCL 22 · SDA 21)를 5칸 × 5줄 격자(칸 폭 25px · 높이 12px)로 쓰고, 버튼 a(14) · b(27)로 플레이어를 움직인다. 수동 부저(25)는 설계 단계에서만(선택). ESP32 Plus 확장 보드에 io15 가 없어 부저는 25번(S9 와 같음).
# 2부의 핵심: 폭탄마다 "다음에 움직일 시각" 리스트를 두고 time.ticks_ms() 와 비교해 sleep 없이 각자 움직이기 (함수 move_bomb(i) 매개변수, global)
id: 41-bomb-game
order: 41
track: fusion
label: F14
prerequisites: [11-button-touch, 21-oled, 23-button-king, 36-memory-game]
subjects: [정보, 보건, 수학, 체육]
sdg: [3]
sessions: 2
teacherNotes: |
  **시간 값은 모두 예시예요.** 1부의 `0.5`초(폭탄이 한 줄 내려오는 간격), 2부의 `400~900`ms 랜덤 간격, 미션 2의 `900 - score * 50` 과 최소 `200`ms, 반복 끝의 `0.1`초는 반 수준에 맞게 바꿔도 됩니다. 버튼을 꾹 누르면 0.1초마다 한 칸씩 움직여 너무 빠르다고 하면 `time.sleep(0.1)` 을 `0.2` 로 늘려 주세요(그만큼 폭탄 그리기도 느려집니다).

  **과몰입 시간 관리** 게임이 완성되면 아이들이 계속 하려고 합니다. 미션 판정 뒤 "3판만" 처럼 횟수를 먼저 정하고, 점수 기록표를 나눠 주어 **기록하는 활동**으로 바꿔 주세요. 반 전체 점수의 평균 · 최고값 구하기(수학), 반응 속도가 빠른 친구의 비결 이야기하기(체육)로 이어 갑니다.

  - **1부 끝 미션 1** 시작 코드(step1)에는 범위 검사 · 충돌 비교 · 점수가 없습니다. 플레이어가 화면 밖으로 사라지는 것을 먼저 겪게 한 뒤 미션으로 고치게 하는 흐름이에요. 규칙 6개가 체크리스트처럼 하나씩 되묻습니다.
  - **2부 핵심 개념** 보드는 한 번에 한 가지 일만 해서, 함수 안의 `sleep` 은 폭탄을 차례로만 움직입니다(디버깅 1 "엥? 하나씩"). 폭탄마다 다음에 움직일 시각을 리스트에 적어 두고 `time.ticks_diff(time.ticks_ms(), next_time[i]) >= 0` 으로 비교하는 꼴을 꼭 짚어 주세요. `global score` · `global playing` 은 함수 안에서 바깥 변수를 바꿀 때 필요합니다(변수 꾸러미의 "전역 변수 쓰기" 블록).
  - **버튼 2개** 14번(a) · 27번(b) 모두 풀업 입력이라 누르면 0 입니다. 버튼은 가운데 홈에 걸쳐 꽂고 **대각선** 다리를 써야 해요(S8 참고). a · b 이름으로만 부르고 왼 · 오 같은 방향 말은 쓰지 않습니다(화면 번호 0~4 와 맞추기).
  - **부저(선택)** 설계 단계 코드에만 수동 부저(25번)로 맞았을 때 220Hz 소리를 넣었습니다. 부품이 모자라면 배선 없이 설계만 해도 됩니다(S9 와 같은 핀: + 다리 → 25번, − 다리 → − 줄). ESP32 Plus 확장 보드에는 io15 가 없어 15번 대신 25번을 씁니다.
  - **두 보드** ESP32 Plus 확장 보드는 OLED 를 I2C 묶음(GND · 5V · SDA · SCL)에 F-F 듀폰선으로 바로, 기본 보드(DevKit)는 3V3 · GND · D21 · D22 에 바로 꽂습니다. 버튼 · 부저는 두 보드 모두 브레드보드에 꽂고, 열 번호는 보드마다 그림 아래 설명을 따릅니다.
  - **메이킹** 박스지로 게임기 틀(화면 창 + 버튼 두 구멍)을 만들어 OLED 와 버튼을 끼우면 "내 게임기"가 됩니다. 배선할 때는 USB 를 빼 두게 하세요.
  - **흔한 막힘** 폭탄 세 개가 처음에 같은 시각에 함께 움직이는 것은 정상(다음 시각이 모두 0)이고 곧 흩어집니다. 점수가 늘어도 간격이 안 줄면 `gap` 을 함수 안에서 계산하는지, `score` 를 `global` 로 썼는지 확인합니다.

  **교과 연결**
  - 정보: 함수와 매개변수(`move_bomb(i)`), 리스트 세 개를 같은 번호로 묶어 쓰기, `time.ticks_ms()` 로 기다리지 않고 시간 재기, 상태 변수(`playing`).
  - 보건(SDG 3 건강과 웰빙): 감염병은 "피하기"가 먼저 — 손 씻기 · 기침 예절 · 거리 두기를 게임의 "피하기"에 빗대어 이야기합니다.
  - 수학: 좌표(칸 번호 × 25, 줄 번호 × 12 → 픽셀), 확률(폭탄 칸은 0~4 가운데 하나를 똑같은 가능성으로 뽑으니 내 칸에 올 가능성은 1/5), 반 점수의 평균 · 최고값.
  - 체육: 반응 속도 — 폭탄 간격을 줄여 가며 몇 점까지 가는지 재고, 손 바꿔 하기 · 눈 감고 신호 듣기 같은 반응 놀이와 비교합니다.
title: 바이러스 폭탄 피하기
subtitle: 세 폭탄이 각자 떨어지는 OLED 게임
summary: |
  화면 맨 위에서 **바이러스 폭탄**이 떨어져요. 버튼 두 개로 플레이어를 0~4번 칸 사이에서 움직여 피하고, 피한 만큼 점수를 받아요.
  1부에서는 폭탄 하나로 게임의 뼈대를 만들고, 2부에서는 **리스트**와 **다음에 움직일 시각**으로 폭탄 셋을 `sleep` 없이 각자 떨어지게 해요. 점수가 오르면 폭탄이 빨라져요.
