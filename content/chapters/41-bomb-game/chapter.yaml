  - { name: F-F 듀폰선 4가닥, board: plus, note: "OLED GND · VCC · SDA · SCL → 보드 I2C 묶음 GND · 5V · SDA · SCL 에 바로" }
  - { name: F-F 듀폰선 4가닥, board: devkit, note: "OLED VCC · GND · SDA · SCL → 보드 3V3 · GND · D21 · D22 에 바로" }
  - { name: M-F 듀폰선 4가닥, note: "보드의 14 · 27번 핀과 GND 핀 → 브레드보드, (선택) 25번 핀 → 부저 + 다리 줄" }
