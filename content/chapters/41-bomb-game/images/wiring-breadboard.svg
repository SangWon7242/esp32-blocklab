<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="bgw-title" font-family="inherit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="bgw-title">브레드보드 배선도: OLED 는 브레드보드 위쪽 바깥에 두고 M-F 듀폰선으로 GND → 위쪽 − 줄, VCC → 위쪽 + 줄, SCL → 11번 줄 a 칸, SDA → 14번 줄 f 칸. ESP32 5V → + 줄, GND → − 줄, 22번 → 11번 줄 e 칸(SCL 줄), 21번 → 14번 줄 j 칸(SDA 줄). 버튼 a 는 가운데 홈에 걸쳐 24 · 26번 줄에 꽂고 14번 → 초록 선 → 24번 줄 h 칸, 대각선 반대쪽 26번 줄 a 칸 → 검은 선 → 위쪽 − 줄. 버튼 b 는 18 · 20번 줄에 꽂고 27번 → 주황 선 → 18번 줄 i 칸, 대각선 반대쪽 20번 줄 a 칸 → 검은 선 → 위쪽 − 줄</title>
