      - id: mission
        type: mission
        title: 미션 — 다이얼로 LED 밝기 조절
        minutes: 8
        scene:
          image: images/map-scale.svg
          caption: 0~4095 의 긴 자를 0~1023 의 짧은 자로 옮겨요. 한가운데는 한가운데로 가요
        body: |
          다이얼 값은 0~4095 인데, LED 세기(duty)는 0~1023 이에요(2장 숨쉬는 LED). 다이얼을 끝까지 돌렸을 때 LED 가 가장 밝게 되려면 숫자를 **바꿔서** 보내야 해요.

          계산 블록의 **범위 바꾸기**는 "값을 0~4095 에서 0~1023 으로" 옮겨 줘요. 그림처럼 2048 은 몇이 될까요? 숫자를 바꾼 뒤 다이얼을 돌려 LED 밝기가 따라 바뀌는지 확인하고 **판정**을 눌러요.
        todo:
          - LED 를 밝기 조절이 되는 PWM 으로 26번에 준비하기 (1초에 1000번)
          - 반복 안에서 다이얼 값을 **범위 바꾸기**로 0~1023 으로 바꿔 `duty` 에 담기
          - "`duty` 로 LED 세기를 정하고 20ms 기다리기. 찍는 줄은 지우고 **판정** 누르기"
        instructions: 다이얼을 돌리면 LED 밝기가 따라 바뀌게 하세요. 반복 안에서는 다이얼 값(0~4095)을 범위 바꾸기로 0~1023 으로 바꿔 duty 에 담고, LED 세기를 duty 로 정한 뒤 20밀리초 기다려요
        hint: 2장에서 밝기를 바꿀 때 LED 를 어떻게 준비했나요? 범위 바꾸기 블록의 네 칸에는 원래 범위의 처음·끝, 바꿀 범위의 처음·끝이 들어가요
        code: step1_dial.py
        rules:
          - pinIs: { name: led, pin: 26 }
            fail: LED 는 몇 번 핀에 꽂았나요? 그 핀을 led 라는 이름으로 준비했나요?
          - codeMatches: '^led = PWM\(Pin\(26\)\)$'
            fail: 켜기·끄기만 하는 핀으로 밝기를 여러 단계로 바꿀 수 있을까요? 2장에서는 어떻게 준비했나요?
          - codeMatches: '^led\.freq\(\s*1000\s*\)'
            fail: 밝기 조절 LED 는 1초에 몇 번 켜고 끄게 준비했나요? 2장의 숨쉬는 LED 는 어떻게 했나요?
          - codeMatches: '\(\((?:knob\.read\(\)|\w+)\s*-\s*0\)\s*\*\s*\(1023\s*-\s*0\)\s*//\s*\(4095\s*-\s*0\)\s*\+\s*0\)'
            fail: 다이얼 값의 범위와 LED 세기의 범위는 각각 어디부터 어디까지인가요? 범위 바꾸기의 네 칸에 그 숫자가 들어갔나요?
          - codeMatches: '^\s+duty\s*=\s*\(\('
            fail: 범위를 바꾼 숫자를 duty 라는 이름에 담아 두었나요?
          - codeMatches: '^\s+led\.duty\(duty\)$'
            fail: 바꾼 숫자를 LED 세기로 보냈나요?
          - codeMatches: '^\s+time\.sleep_ms\(\s*20\s*\)|^\s+time\.sleep\(\s*0\.02\s*\)'
            fail: LED 세기를 정한 뒤 얼마나 기다리나요? 지시에서 정한 시간은 몇 밀리초였나요?
          - notHas: time.sleep(0.5)
            fail: 다이얼을 돌리면 LED 가 바로 따라오나요? 반복 한 바퀴에 기다리는 시간이 20밀리초뿐인가요?
        answerCode: mission_dimmer.py

      - id: debug
        type: debug
        title: 디버깅 — 박수 스위치가 이상해요
        minutes: 8
        scene:
          image: images/threshold-graph.svg
          caption: "기준선이 너무 낮으면 조용할 때도 넘고, 기다리지 않으면 박수 한 번의 여러 점을 다 세요"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 저절로 세면 기준값부터, 빨간 글씨가 뜨면 핀 번호부터, 한 번에 여러 번 세면 기다리는 줄부터 봐요.

          셋 중 **빨간 글씨가 뜨는 것**은 어느 것일까요? 나머지 둘은 왜 에러 없이 이상하게만 굴까요? 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 박수를 안 쳤는데도 횟수가 저절로 계속 올라가요
            code: |
              from machine import Pin, ADC
              import time

              sound = ADC(Pin(36))
              sound.atten(ADC.ATTN_11DB)
              sound.width(ADC.WIDTH_12BIT)

              count = 0
              while True:
                  if sound.read() > 100:
                      count = count + 1
                      print("clap", count)
                      time.sleep(0.3)
                  time.sleep_ms(10)
            question: 조용할 때 소리 값은 얼마쯤이었나요? 기준 100 은 그 값보다 큰가요, 작은가요? 기준은 어디쯤에 있어야 할까요?
            rules:
              - codeMatches: 'sound\.read\(\)\s*>\s*(1[5-9]\d\d|[23]\d\d\d)\s*:'
                fail: 조용할 때 값과 박수 칠 때 값 사이에 기준이 있나요? 두 값을 재서 비교해 보세요
          - title: "실행하자마자 빨간 글씨로 ValueError: pin can only be input 이 떠요"
            code: |
              from machine import Pin, ADC
              import time

              sound = ADC(Pin(26))
              sound.atten(ADC.ATTN_11DB)
              sound.width(ADC.WIDTH_12BIT)
              led = Pin(36, Pin.OUT)

              count = 0
              while True:
                  if sound.read() > 2000:
                      count = count + 1
                      if count % 2 == 1:
                          led.value(1)
                      else:
                          led.value(0)
                      time.sleep(0.3)
                  time.sleep_ms(10)
            question: 34~39번 핀은 읽기만 할 수 있는 입력 전용 핀이에요. 이 코드에서 그 핀에 무엇을 준비했나요? 배선도에서 소리 센서와 LED 는 각각 몇 번이었나요?
            rules:
              - pinIs: { name: sound, pin: 36 }
                fail: 소리 센서 S 는 배선도에서 몇 번 핀으로 갔나요? 아날로그 센서는 어느 번호대 핀에 꽂아야 할까요?
              - pinIs: { name: led, pin: 26 }
                fail: LED 처럼 전기를 내보내는 부품을 입력 전용 핀에 둘 수 있을까요? LED 는 몇 번 핀에 꽂았나요?
          - title: 박수를 한 번 쳤는데 횟수가 3, 4씩 올라가요
            code: |
              from machine import Pin, ADC
              import time

              sound = ADC(Pin(36))
              sound.atten(ADC.ATTN_11DB)
              sound.width(ADC.WIDTH_12BIT)

              count = 0
              while True:
                  if sound.read() > 2000:
                      count = count + 1
                      print("clap", count)
                  time.sleep_ms(10)
            question: 박수 소리 한 번은 얼마 동안 이어질까요? 0.01초마다 읽으면 그동안 몇 번이나 기준을 넘을까요? 한 번 센 다음에 무엇이 필요할까요?
            rules:
              - codeMatches: '^ {8}time\.(sleep\(0?\.\d+\)|sleep\(1\)|sleep_ms\(\d{3,4}\))$'
                fail: 횟수를 센 다음, 같은 박수 소리가 잦아들 때까지 기다리는 줄이 if 안에 있나요?

