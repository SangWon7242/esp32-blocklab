# 챕터 S10 · 박수 스위치와 다이얼 — 아두이노 기본 W03(마이크 임계값 카운트, 가변저항 전압 환산), 마이크로비트 심화 W05(가변저항 범위 재계산), Keyestudio 2-3-17·2-3-22. 형식 설명은 src/track/README.md
id: 13-clap-dial
order: 13
track: sensor
label: S10
prerequisites: [02-breathing-led, 11-button-touch]
subjects: [과학, 수학]
sessions: 2
teacherNotes: |
  **준비** 소리 센서 모듈의 감도 나사(파란 네모)를 미리 돌려 맞춰 두면 좋아요. 조용한 교실에서 값이 1000 아래, 박수에서 3000 위로 솟는 정도가 다루기 쉬워요.

  - 기준값 2000 은 예시예요. 모둠마다 조용할 때·박수 칠 때 값을 재서 **그 사이**로 정하게 하세요(원본 W03 "각 센서 값의 기준은 여러분이 맞춰주세요").
  - 아날로그 센서는 GPIO32~39(ADC1)에 꽂아요. 34~39는 입력 전용이라 LED 를 꽂으면 `ValueError` 가 나요. 나중에 WiFi 챕터에서도 이 규칙 그대로예요.
  - 미션의 `((값 − 0) × (1023 − 0) // (4095 − 0) + 0)` 은 수학의 비례식과 같아요. 마이크로비트 W05 의 "0~1023 범위표를 4배로 다시 계산하기"를 수학 시간과 이어 보세요.
  - 여러 반이 동시에 박수를 치면 옆 모둠 소리도 세요. 한 모둠씩 차례로 시험하거나 책상을 두드리는 소리로 바꿔도 돼요.
title: 박수 스위치와 다이얼
summary: |
  버튼은 0과 1 두 가지만 알려 줬어요. 이번에는 **가변저항(다이얼)** 과 **소리 센서**로 0부터 **4095** 까지의 숫자를 읽어요.
  다이얼 값을 전압으로 바꿔 보고, 소리 값이 **기준**을 넘을 때마다 박수를 세어 LED 를 켜고 끄는 **박수 스위치**를 만들어요. 마지막엔 다이얼로 LED 밝기를 조절해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 가변저항, note: "다리 3개. 브레드보드에 꽂아요. 가운데 다리가 신호(39번), 양 끝은 + 줄(3V3)과 − 줄(GND)" }
  - { name: 소리 센서 모듈, note: "마이크가 달린 모듈. 핀 글자 G · V · S 를 보고 꽂아요. S 는 36번 핀에 바로, V · G 는 + 줄 · − 줄로" }
  - { name: LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: 브레드보드, note: "부품을 꽂고 선으로 잇는 판. + 줄은 3V3, − 줄은 GND" }
  - { name: M-F 듀폰선 6가닥, note: "보드 핀 → 브레드보드: 3V3 · GND · 39번 · 26번, 소리 센서 V · G → + 줄 · − 줄" }
  - { name: F-F 듀폰선 1가닥, note: "소리 센서 S → 36번 핀에 바로" }
  - { name: 점퍼선(M-M) 3가닥, note: "가변저항 양 끝 → + 줄 · − 줄, LED 짧은 다리 → − 줄" }
wiring:
  image: images/wiring-breadboard.svg
  caption: "브레드보드는 보드 아래에 두어요. 아래 줄 3V3 → + 줄, GND → − 줄. 가변저항 23 · 24 · 25번 줄: 가운데 24번 ← 39번(아래 줄 io39), 23번 → − 줄, 25번 → + 줄. 소리 센서 S → 36번(아래 줄 io36) 바로, V → + 줄, G → − 줄. LED: 26번(위 줄 io26) → 보드 바깥으로 돌아 6번 줄 → 220Ω 저항 → 10번 줄 긴 다리, 짧은 다리 11번 줄 → − 줄"
  captionDevkit: "브레드보드는 보드 위에 두어요. 3V3(아래 줄) → 보드 바깥으로 돌아 + 줄, GND → − 줄. 가변저항 18 · 19 · 20번 줄: 가운데 19번 ← VN(39), 18번 → + 줄, 20번 → − 줄. 소리 센서 S → VP(36) 바로, V → + 줄, G → − 줄. LED: D26 → 11번 줄 → 220Ω 저항 → 6번 줄 긴 다리, 짧은 다리 5번 줄 → − 줄"
principle:
  image: images/analog-vs-digital.svg
  body: |
    버튼 같은 **디지털** 입력은 0 아니면 1, 두 가지만 알려 줘요. 그런데 다이얼을 반쯤 돌린 것, 소리가 조금 큰 것은 0과 1 사이 어딘가예요. 이렇게 이어지는 크기를 **아날로그**라고 해요.

    **가변저항**은 긴 저항 위를 가운데 다리가 미끄러지는 부품이에요. 양 끝에 3.3V 와 0V 를 걸면 가운데 다리는 그 사이 전압을 내보내요(**전압 나누기**). 한가운데면 약 1.65V 예요.

    - ESP32 의 **ADC** 는 0~3.3V 를 **0~4095** 숫자로 바꿔요 (12비트, 한 칸에 약 0.0008V)
    - 숫자를 전압으로 되돌리려면 `값 * 3.3 / 4095`
    - **소리 센서**는 마이크 신호를 키워서 내보내요. 소리가 클수록 값이 크게 솟아요
    - 아날로그 센서는 **32~39번** 핀에 꽂아요. 그중 34~39번은 **입력 전용**이라 읽기만 하고, LED 처럼 내보내는 일은 못 해요
goals:
  content: 가변저항과 소리 센서의 값을 0~4095 로 읽고, 전압으로 바꾸거나 기준값과 비교해 박수를 세고, 범위 바꾸기로 LED 밝기를 조절한다
  thinking: 센서 값을 직접 재 보고 기준값을 근거 있게 정하며, 0~4095 와 0~1023 사이의 비례 관계를 식으로 나타낸다
successCriteria:
  - 디지털 입력과 아날로그 입력의 차이를 값의 범위로 말할 수 있다
  - 조용할 때와 박수 칠 때 값을 재 보고, 그 사이에서 기준값을 정한 이유를 말할 수 있다
  - 같은 박수를 여러 번 세지 않으려면 무엇이 필요한지 설명할 수 있다
  - 0~4095 를 0~1023 으로 바꾸는 식을 블록으로 만들 수 있다
parts:
  - id: part1
    title: 다이얼과 박수를 숫자로 읽기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 0과 1 사이에는 무엇이 있을까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 다이얼은 0~4095 숫자로, 박수는 소리 값이 솟는 순간으로 읽어요
        body: |
          지난번 버튼은 눌렸는지 아닌지, **0 아니면 1** 만 알려 줬어요. 그런데 볼륨 다이얼은 조금씩 돌릴 수 있고, 소리도 작게부터 크게까지 여러 크기가 있어요.

          손뼉 두 번에 켜지는 전등은 "박수"를 어떻게 알아들을까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(가변저항, 소리 센서, LED, 저항, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 버튼은 0과 1 두 가지만 알려 줘요. 다이얼을 반쯤 돌린 것처럼 "중간"을 알려 주려면 숫자가 어떻게 되어야 할까요?
          - 보드가 박수 소리를 "들으려면" 무엇을 재고, 무엇과 비교하면 될까요?
          - 손뼉 두 번에 켜지는 전등은 "두 번"을 어떻게 셀까요? 박수 한 번을 두 번으로 세는 일은 없을까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "박수 스위치"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "시끄럽다"는 말을 몰라요. **몇보다 크면** 박수인지 숫자로 알려 줘야 해요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 센서가 몇 번 핀에 있고, 값이 어디부터 어디까지인지 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기 (기준은 누가 정하죠?)"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["가변저항은 39번, 소리 센서는 36번, LED 는 26번", "센서 값은 0~4095 (전압 0~3.3V)"]
          decide: ["박수로 볼 기준값 (예: 2000)", "한 번 센 뒤 얼마나 기다릴지 (예: 0.3초)"]
          act: ["소리 값을 계속 읽기", "기준보다 크면 횟수 1 늘리기", "횟수가 홀수면 LED 켜기, 짝수면 끄기"]

      - id: predict
        type: predict
        title: 예측하기 — 다이얼 값 읽기
        minutes: 4
        scene:
          image: images/analog-vs-digital.svg
          caption: 가변저항 가운데 다리는 0V~3.3V 사이 전압을 내보내고, 보드는 그것을 0~4095 숫자로 읽어요
        body: |
          먼저 다이얼(가변저항)부터 읽어요. `knob.read()` 는 0~4095 숫자 하나를 돌려줘요. 다음 줄은 그 숫자를 **전압(V)** 으로 바꿔요.

          활동 칸의 코드는 아직 실행하지 않아요. 다이얼을 끝까지 돌렸을 때, 한가운데 두었을 때 숫자가 어떻게 나올지 미리 적어 봐요.
        todo:
          - 코드를 한 줄씩 소리 내어 읽기
          - "`value * 3.3 / 4095` 가 무엇을 계산하는지 생각하기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_dial.py
        blanks:
          - q: 다이얼을 한쪽 끝까지 돌리면 value 는 얼마쯤 나올까요? 반대쪽 끝은요?
          - q: 다이얼을 한가운데 두면 value 는 얼마쯤일까요?
          - q: value 가 4095 일 때 voltage 는 몇 V 일까요?
            unit: V

      - id: run
        type: run
        title: 복사 · 실행 — 다이얼 값과 전압
        minutes: 7
        scene:
          image: images/wiring-breadboard.svg
          caption: "가변저항 가운데 다리(24번 줄) ← 39번(아래 줄 io39). 양 끝은 + 줄(3V3)과 − 줄(GND)"
          captionDevkit: "가변저항 가운데 다리(19번 줄) ← VN(39). 양 끝은 + 줄(3V3)과 − 줄(GND)"
        body: |
          **USB 를 뺀 채로** **부품과 배선**의 배선 그림과 아래 표처럼 오늘 쓸 부품을 모두 꽂아요. 3V3 은 + 줄, GND 는 − 줄로 가요. 가변저항은 **가운데 다리**가 39번이에요. 소리 센서는 S 선만 36번 핀에 바로 꽂고, V · G 는 + 줄 · − 줄로 가요.

          실행한 뒤 다이얼을 천천히 돌리며 창에 찍히는 두 숫자를 보세요. 0.5초마다 한 줄씩 찍혀요. 예측과 비교해 봐요.
        todo:
          - 배선도대로 꽂고, 가운데 다리가 39번 선과 같은 줄인지 확인하기
          - "**보드 연결** → **실행** 누르기"
          - 다이얼을 양 끝과 한가운데에 두고 숫자를 공책에 적기
        code: step1_dial.py
        expected: 코드를 실행하면 0.5초마다 `값 전압` 두 숫자가 찍혀요. 다이얼을 돌리면 값은 0~4095, 전압은 0~3.3 사이에서 함께 바뀌어요.
        codeNotes:
          - { line: 1, note: "핀을 다루는 `Pin` 과 아날로그 값을 읽는 `ADC` 기능을 가져와요" }
          - { line: 4, note: "39번 핀을 아날로그 입력으로 준비하고 이름을 `knob` 으로 붙여요" }
          - { line: 5, note: "0~3.3V 를 모두 읽을 수 있게 정해요 (11dB 감쇠)" }
          - { line: 6, note: "읽은 값을 0~4095 (12비트) 숫자로 받게 정해요" }
          - { line: 9, note: "`knob.read()` 로 지금 다이얼 값(0~4095)을 읽어 `value` 에 담아요" }
          - { line: 10, note: "값을 4095 로 나누고 3.3 을 곱해 전압(V)으로 바꿔요" }
          - { line: 11, note: "값과 전압을 한 줄에 함께 찍어요" }
          - { line: 12, note: "0.5초 기다렸다가 다시 읽어요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — 다이얼
        minutes: 5
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          창에서 본 숫자를 이제 코드로 확인해요. `while True:` 안의 네 줄이 0.5초마다 되풀이돼요.

          줄마다 손가락으로 짚으며 읽고, 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - "`knob.read()` 가 나오는 줄 찾기"
          - 전압으로 바꾸는 식에서 3.3 과 4095 가 무슨 뜻인지 떠올리기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_dial.py
        questions:
          - { kind: number, q: "다이얼 값을 몇 초마다 한 번씩 읽나요?", answer: 0.5 }
          - { kind: choice, q: "value 가 4095 이면 voltage 는 얼마인가요?", options: ["0", "1.65", "3.3", "4095"], answer: 2, hint: "4095 / 4095 는 1 이에요. 거기에 무엇을 곱하나요?" }
          - { kind: line, q: "읽은 숫자를 전압으로 바꾸는 줄의 번호를 클릭하세요", answer: 10 }
        codeNotes:
          - { line: 4, note: "39번 핀을 아날로그 입력 `knob` 으로 준비해요 (4~6번 줄)" }
          - { line: 9, note: "다이얼 값 0~4095 를 읽어요" }
          - { line: 10, note: "`값 * 3.3 / 4095`: 숫자를 0~3.3V 전압으로 바꿔요" }
          - { line: 12, note: "다음 읽기까지 0.5초 기다려요" }

      - id: run2
        type: run
        title: 실행 2 — 박수 스위치
        minutes: 8
        scene:
          image: images/threshold-graph.svg
          caption: 조용할 때는 값이 낮게 흔들리다가 박수를 치면 솟아요. 기준선을 넘으면 박수로 세요
        body: |
          이번에는 **소리 센서**(36번)를 읽어요. 소리 값이 **기준 2000** 보다 크면 박수로 보고 횟수를 1 늘려요. 횟수가 홀수면 LED 를 켜고, 짝수면 꺼요.

          먼저 실행하고 **조용히** 있어 보세요. 횟수가 저절로 올라가나요? 그다음 박수를 한 번씩 쳐 봐요. 한 번 칠 때 횟수가 딱 1 씩 오르는지 지켜보세요.
        todo:
          - 소리 센서 S 가 36번, LED 가 26번에 이어졌는지 확인하기
          - 실행하고 10초 동안 조용히 있어 보기
          - 박수를 한 번씩 치며 횟수와 LED 를 보기
        code: step2_clap.py
        expected: 코드를 실행하면 박수를 칠 때마다 `clap 1`, `clap 2` … 처럼 횟수가 찍히고, LED 가 켜졌다 꺼졌다 바뀌어요. 조용할 때는 아무것도 찍히지 않아요.
        codeNotes:
          - { line: 4, note: "36번 핀을 아날로그 입력으로 준비하고 이름을 `sound` 로 붙여요 (4~6번 줄)" }
          - { line: 7, note: "26번 핀을 LED 를 켜고 끄는 출력 핀으로 준비해요" }
          - { line: 9, note: "박수 횟수를 0 부터 세기 시작해요" }
          - { line: 11, note: "소리 값이 **기준 2000** 보다 크면 박수로 봐요" }
          - { line: 12, note: "횟수를 1 늘려요" }
