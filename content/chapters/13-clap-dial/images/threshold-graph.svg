  <title id="cd-th-title">소리 값 그래프와 기준선: 조용할 때는 300~500 쯤에서 조금씩 흔들리고, 박수를 치면 3000 넘게 솟는다. 기준선 2000 을 넘으면 박수로 센다. 박수 한 번에도 기준을 넘는 점이 여러 개라, 한 번 센 뒤 0.3초 기다려야 한 번만 센다</title>
