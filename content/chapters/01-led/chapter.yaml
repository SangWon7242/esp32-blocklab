# 챕터 1 · LED 켜기 — 형식 설명은 src/track/README.md
id: 01-led
order: 1
track: sensor
label: S1
sessions: 1
title: LED 켜기
summary: |
  브레드보드에 LED 하나를 꽂아 ESP32 보드의 **26번 핀**에 잇고, 파이썬 코드 몇 줄로 불을 켜고, 끄고, 깜빡이게 해 봐요.
  "켜기 → 기다리기 → 끄기"를 순서대로 적으면 보드가 그대로 따라 한다는 것을 직접 확인해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 납땜 없이 빼고 꽂을 수 있어요 }
  - { name: LED, note: 긴 다리가 + }
  - { name: 220Ω 저항, note: 빨강-빨강-갈색 띠 }
  - { name: M-F 듀폰선 2가닥, note: "한쪽은 구멍, 한쪽은 핀. 보드의 26번 핀과 GND 핀에 씌우고 핀 끝은 브레드보드에" }
  - { name: 점퍼선(M-M) 1가닥, note: "LED 짧은 다리 줄 → 브레드보드 − 줄" }
  - { name: 확장 보드 (38핀), board: expansion, note: "DevKit 38핀을 노란 암 헤더에 꽂아요. JUMP 점퍼는 평소 자리(V–3.3V) 그대로" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-led.svg
  caption: "브레드보드 위에서: 보드 io26 핀 → 22번 줄 → 220Ω 저항 → 17번 줄의 LED 긴 다리(+). 짧은 다리(−)는 16번 줄 → 점퍼선 → 브레드보드 − 줄 → 보드 GND"
  captionDevkit: "브레드보드 위에서: 보드 D26 핀 → 11번 줄 → 220Ω 저항 → 6번 줄의 LED 긴 다리(+). 짧은 다리(−)는 5번 줄 → 점퍼선 → 브레드보드 − 줄 → 보드 GND"
  captionExpansion: "브레드보드 위에서: 확장 보드 위 줄 P26 칸 S 핀 → 18번 줄 → 220Ω 저항 → 13번 줄의 LED 긴 다리(+). 짧은 다리(−)는 12번 줄 → 점퍼선 → 브레드보드 − 줄 → 위 줄 GND 칸 S 핀"
principle:
  image: images/led-parts.svg
  body: |
    LED는 전기가 지나갈 때 빛을 내는 작은 부품이에요. 전기는 **긴 다리(+)로 들어가 짧은 다리(−)로 나올 때만** 흘러서, 거꾸로 꽂으면 불이 들어오지 않아요.

    불이 켜지려면 전기가 한 바퀴 돌아야 해요: 보드의 26번 핀 → 저항 → LED → GND(전기가 돌아가는 곳). **220Ω 저항**은 전기가 너무 많이 흘러 LED가 상하지 않도록 흐름을 줄여 줘요.

    26번 핀은 **디지털 출력** 핀으로 써요. 디지털 출력은 두 가지 중 하나만 내보내요.

    - **HIGH**(1, 3.3V): 전기가 흘러 불이 켜져요
    - **LOW**(0, 0V): 전기가 흐르지 않아 불이 꺼져요
why: [led-resistor, gnd]
parts:
  - id: part1
    title: LED 켜고 깜빡이기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — LED는 어떻게 켜질까?
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 노트북에서 코드를 실행해 책상 위 LED 불 켜기
        body: |
          책상 위에 ESP32 보드와 LED 하나가 있어요. 스위치도 없는데, 노트북에서 코드를 실행하면 LED에 불이 들어와요.

          불이 켜지려면 전기가 LED를 지나 한 바퀴 돌아야 해요. 그 전기를 **보내는 쪽**은 누구이고, 어떻게 "보내라"고 시킬 수 있을까요? 코드를 보기 전에 내 생각부터 적어 봐요.
        todo:
          - 준비물(ESP32 보드, 브레드보드, LED, 저항, 듀폰선·점퍼선, USB 선)을 책상에 꺼내 놓기
          - 아래 **부품과 배선**을 열어 브레드보드 위에서 LED 다리가 어디로 이어지는지 보기
          - 질문마다 내 생각을 한두 문장으로 쓰기
        questions:
          - LED의 긴 다리는 저항을 거쳐 몇 번 핀에 이어져 있나요? 그 번호가 코드 어디에 보일 것 같나요?
          - 스위치를 누르는 사람이 없는데 LED에 전기가 흐르게 하는 건 무엇일까요? 보드는 그 핀으로 무엇을 보내야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "LED 켜기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 눈치가 없어서, 하나하나 알려 주지 않으면 아무것도 못 하거든요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 세 칸을 다 쓰면 **예시 답 보기**가 열리고, 내 답과 비교할 수 있어요.
        todo:
          - "**알아야 할 것**: 보드가 시작 전에 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 선택이나 숫자 적기"
          - "**해야 할 것**: 보드가 실제로 바꾸는 일 적기"
        answer:
          know: ["어느 핀에 LED가 있는지"]
          decide: ["켤지 끌지", "얼마나 오래 켜 둘지"]
          act: ["LED 켜기·끄기"]

      - id: predict
        type: predict
        title: 예측하기
        scene:
          image: images/led-parts.svg
          caption: 긴 다리(+)는 저항을 거쳐 26번 핀으로, 짧은 다리(−)는 브레드보드 − 줄을 거쳐 GND로 이어져요
        body: |
          활동 칸의 코드는 아직 실행하지 않아요. `led = Pin(26, Pin.OUT)`은 "26번 핀을 내보내는(출력) 핀으로 쓰고, 이름은 led로 부른다"는 뜻이에요.

          마지막 줄 `led.value(1)`이 26번 핀으로 무엇을 보낼지 상상해 보고, LED가 어떻게 될지 미리 적어요. 틀려도 괜찮아요. 다음 단계에서 직접 확인해요.
        todo:
          - 코드 5줄을 위에서부터 한 줄씩 소리 내어 읽기
          - 빈칸 두 개에 내 예측 쓰기 (켜진다? 꺼진다? 아무 일도 없다?)
        code: step1_led_on.py
        blanks:
          - q: 실행하면 26번 핀에 꽂힌 LED는 어떻게 될까요?
          - q: 마지막 줄을 led.value(0)으로 바꾸면 LED는 어떻게 될까요?

      - id: run
        type: run
        title: 복사 · 실행 — LED 켜기
        scene:
          image: images/breadboard-basics.svg
          caption: "브레드보드 읽는 법: 같은 번호의 다섯 칸(a~e, f~j)은 이어져 있고, 가운데 홈 건너편은 안 이어져요"
        body: |
          이제 예측을 직접 확인할 차례예요. 부품은 **브레드보드**에 꽂아요. 같은 번호 줄의 다섯 칸은 안에서 이어져 있어서, 다리와 선을 같은 줄에 꽂으면 납땜 없이 연결돼요.

          아래 **부품과 배선**의 배선도를 보고 LED와 저항을 꽂은 뒤, 보드를 USB 선으로 노트북에 꽂아요.

          코드를 실행한 뒤 LED를 보세요. 내 예측과 같았나요? 다르다면 어디가 달랐는지 기억해 두세요.
        todo:
          - "**부품과 배선**의 배선도대로 브레드보드에 LED·저항·선 꽂기"
          - LED 긴 다리가 저항과 같은 줄(26번 쪽), 짧은 다리가 − 줄(GND) 쪽인지 확인하기
          - 위쪽 **보드 연결**을 누르고 USB로 이은 보드 고르기
          - "**실행**을 누르고 LED에 불이 들어오는지 보기"
        code: step1_led_on.py
        expected: 코드를 실행하면 26번 핀에 꽂은 LED에 불이 들어오고, 그대로 켜져 있어요.
        codeNotes:
          - { line: 1, note: "보드의 핀을 다루는 `Pin` 기능을 가져와요" }
          - { line: 3, note: "26번 핀을 내보내는(출력) 핀으로 정하고 이름을 `led`로 붙여요" }
          - { line: 5, note: "`led`에 1(HIGH)을 보내 LED를 켜요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          이번 코드는 LED를 **계속** 깜빡이게 해요. 눈으로 보기만 해서는 몇 초씩인지 정확히 알기 어렵지만, 코드를 읽으면 숫자로 알 수 있어요.

          `while True:` 아래 들여 쓴 4줄이 끝없이 되풀이돼요. 한 줄씩 읽으면서 세 문제에 답하고 **확인**을 누르세요.
        todo:
          - "`time.sleep(...)` 괄호 안의 숫자 찾기"
          - "`led.value(1)` 줄과 `led.value(0)` 줄이 무엇이 다른지 보기"
          - 세 문제에 답하고 **확인** 누르기
        code: step4_blink_loop.py
        questions:
          - { kind: number, q: "LED가 한 번 켜져 있는 시간은 몇 초인가요?", answer: 1 }
          - { kind: choice, q: "LED를 끄는 줄은 어느 것인가요?", options: ["led.value(1)", "led.value(0)"], answer: 1 }
          # 계획에는 7로 적혀 있으나 step4_blink_loop.py 의 첫 time.sleep(1) 은 8번째 줄이다
          - { kind: line, q: "1초 기다리는 첫 줄의 줄 번호를 클릭하세요", answer: 8 }
        codeNotes:
          - { line: 1, note: "보드의 핀을 다루는 `Pin` 기능을 가져와요" }
          - { line: 2, note: "기다리기(`time.sleep`)에 쓰는 시간 기능을 가져와요" }
          - { line: 4, note: "26번 핀을 내보내는(출력) 핀으로 정하고 이름을 `led`로 붙여요" }
          - { line: 6, note: "`while True:` 아래 들여 쓴 줄들을 끝없이 되풀이해요" }
          - { line: 7, note: "`led`에 1(HIGH)을 보내 LED를 켜요" }
          - { line: 10, note: "괄호 안 숫자만큼(초) 기다려요. 그동안 LED는 바로 위 줄의 상태 그대로예요" }

      - id: mission
        type: mission
        title: 미션 — 천천히 깜빡이기
        scene:
          image: images/mission-timeline.svg
          caption: 지금은 켜짐 1초 · 꺼짐 1초, 목표는 켜짐 2초 · 꺼짐 1초. 켜기 바로 아래 기다리기가 켜진 시간이에요
        body: |
          지금 LED는 1초 켜지고 1초 꺼져요. 켜진 시간과 꺼진 시간을 다르게 하면 느낌이 달라져요. 켜져 있는 시간을 늘려 **천천히** 깜빡이게 만들어 봐요.

          **기다리기**는 LED를 바꾸지 않아요. 기다리는 동안 LED는 **바로 위 블록**(켜기 또는 끄기)의 상태 그대로예요. 그래서 켜기 바로 아래 기다리기가 **켜져 있는 시간**, 끄기 바로 아래 기다리기가 **꺼져 있는 시간**이에요.

          코드를 고친 뒤 실행해서 LED가 켜져 있는 동안 "하나, 둘", 꺼져 있는 동안 "하나" 세어 보세요. 맞는 것 같으면 **채점하기**를 눌러요.
        todo:
          - 그림의 **목표** 줄 보기 — 켜짐 2초, 꺼짐 1초
          - 켜기 바로 아래 기다리기 숫자를 목표의 켜짐 시간으로 바꾸기
          - 끄기 바로 아래 기다리기 숫자가 목표의 꺼짐 시간과 같은지 확인하기
          - 실행해서 "하나, 둘(켜짐) · 하나(꺼짐)" 세어 보고 **채점하기** 누르기
        instructions: |
          LED가 **2초 켜져 있다가 1초 꺼지기**를 계속 되풀이하게 바꾸세요.
          - 켜져 있는 시간: **2초** (지금 1초)
          - 꺼져 있는 시간: **1초** (지금과 같아요)
        hint: 바꿀 곳은 "초 기다리기"(time.sleep) 두 군데 중 하나예요. 바로 위 블록이 켜기인 기다리기가 켜져 있는 시간이에요
        code: step4_blink_loop.py
        rules:
          # 블록 모양 규칙(blocks): 코드 모드도 codeToBlocks 로 만든 작업판으로 같은 기준. 변수 이름은 보지 않는다
          - blocks: { type: flow_wait, inputs: { SEC: { type: math_number, fields: { NUM: 2 } } }, after: { type: esp_pin_write, fields: { VALUE: "1" } } }
            fail: 켜진 시간과 꺼진 시간이 다른가요? time.sleep 숫자를 다시 보세요
          - blocks: { type: flow_wait, inputs: { SEC: { type: math_number, fields: { NUM: 1 } } }, after: { type: esp_pin_write, fields: { VALUE: "0" } } }
            fail: LED 를 끈 바로 다음에 기다리는 시간은 지시문과 같나요?
          - blocks: { type: esp_pin_write, fields: { VALUE: "1" }, inside: loop }
            fail: 켜고 끄기가 계속 되풀이되나요? 끝없이 반복하는 블록 안에 들어 있나요?
          # 핀 번호는 보지 않는다: 학생이 LED 를 다른 핀에 꽂았으면 그 번호로 바꿔도 통과
          - blocks: { type: esp_pin_setup, fields: { MODE: OUT } }
            fail: LED 핀을 출력으로 준비하는 줄이 그대로 있나요?
        answerCode: mission1_slow_blink.py

      - id: design
        type: design
        title: 설계 — 우리말로 먼저 쓰기
        scene:
          image: images/blink-timeline.svg
          caption: 이 깜빡임(켜짐 1초, 꺼짐 1초, 계속)을 우리말 순서로 먼저 써요
        body: |
          프로그래머는 코드를 바로 쓰지 않고, 먼저 **우리말로 순서**를 적어요. 순서만 맞으면 코드로 옮기는 건 쉬워요.

          위 그림처럼 1초 켜고 1초 끄기를 계속 되풀이하려면 어떤 순서여야 할까요? 설계도의 빈칸을 채우고, 번역표를 보고, 섞인 블록을 그 순서대로 이어 붙여 보세요.
        todo:
          - 우리말 설계도의 빈칸(몇 초?)을 채우고 **빈칸 확인** 누르기
          - 번역표에서 우리말 한 줄이 어떤 코드가 되는지 짝 지어 보기
          - 섞인 블록을 설계도 순서대로 이어 붙이고 **채점하기** 누르기
        pseudocode:
          - text: 계속 반복한다
          - text: LED를 켠다
          - text: __초 기다린다
            blank: { answer: 1 }
          - text: LED를 끈다
          - text: __초 기다린다
            blank: { answer: 1 }
        translation:
          - ["켠다", "led.value(1)"]
          - ["기다린다", "time.sleep(초)"]
          - ["계속 반복", "while True:"]
        targetCode: step4_blink_loop.py

      - id: reflect
        type: reflect
        title: 성찰 — 오늘 한 생각 쓰기
        scene:
          image: images/sos.svg
          caption: 다음 도전 — 켜기·기다리기·끄기만으로 SOS 신호를 만들 수 있을까요? 성찰을 마치면 다음 단계에서 도전해요
        body: |
          오늘 LED를 켜고, 끄고, 깜빡이게 했어요. 잘 된 순간보다 **막혔던 순간**이 더 중요해요. 그때 무엇을 해 봤는지가 다음 시간의 나를 도와줘요.

          먼저 코드 줄마다 "이 줄은 ___"을 내 말로 채우고, 아래 네 칸에 오늘 있었던 일을 솔직하게 적어요.
        todo:
          - 코드 줄마다 "이 줄은 ___" 한 문장씩 쓰기 (할 수 있는 만큼)
          - 네 칸(막힌 곳 · 해 본 것 · 원인 · 다음엔)을 모두 채우기
        lineExplain: step4_blink_loop.py
        prompts:
          - 막힌 곳
          - 내가 해 본 것
          - 결국 원인은
          - 다음엔 여기부터 본다

      - id: challenge
        type: mission
        title: 다음 도전 — SOS 빛 신호
        optional: true
        scene:
          image: images/sos.svg
          caption: 짧게 3번(S) · 길게 3번(O) · 짧게 3번(S). 짧게는 0.2초, 길게는 0.6초 켜요
        body: |
          배가 위험할 때 빛으로 "도와주세요"를 보내는 신호가 **SOS**예요. 짧은 빛 3번(S), 긴 빛 3번(O), 다시 짧은 빛 3번(S)이에요.

          짧은 빛과 긴 빛은 **켜져 있는 시간**만 달라요. 미션에서 본 것처럼 켜기 바로 아래 기다리기가 켜진 시간이에요. 빛과 빛 사이는 꺼진 채로 조금 쉬어야 따로따로 보여요.

          같은 묶음(켜기 · 기다리기 · 끄기 · 기다리기)을 세 번씩 써야 해요. 아홉 번 붙여 써도 되고, **흐름**의 "3번 반복" 블록을 써도 돼요.
        todo:
          - 그림에서 짧은 빛, 긴 빛, 쉬는 시간이 각각 몇 초인지 보기
          - 짧게 3번 묶음을 먼저 만들고 실행해서 확인하기
          - 길게 3번, 다시 짧게 3번을 이어 붙이고 끝에 1초 쉬기
          - 실행해서 LED가 SOS 로 보이면 **채점하기** 누르기
        instructions: |
          LED로 **SOS**를 계속 보내게 하세요.
          - 짧은 빛: **0.2초** 켜기 → 0.2초 끄기, 3번
          - 긴 빛: **0.6초** 켜기 → 0.2초 끄기, 3번
          - 다시 짧은 빛 3번
          - SOS 를 한 번 다 보내면 **1초** 쉬고 처음부터
        hint: "\"3번 반복\" 블록 안에 켜기 · 0.2초 기다리기 · 끄기 · 0.2초 기다리기를 넣으면 짧은 빛 3번이 돼요. 그 묶음을 복사해서 기다리기 숫자 하나만 바꾸면 긴 빛이에요"
        code: step4_blink_loop.py
        rules:
          - codeMatches: '(?:\.value\(1\)\n *time\.sleep|^ *\w+)\(\s*0?\.2\s*\)'
            fail: 짧은 빛은 몇 초 동안 켜 두나요? 켜기 바로 아래 기다리기 숫자를 보세요
          - codeMatches: '(?:\.value\(1\)\n *time\.sleep|^ *\w+)\(\s*0?\.6\s*\)'
            fail: 긴 빛은 몇 초 동안 켜 두나요? 짧은 빛과 무엇이 달라야 할까요?
          - codeMatches: '\.value\(0\)\n *time\.sleep\(\s*0?\.2\s*\)'
            fail: 빛과 빛 사이에 꺼진 채로 쉬는 시간이 있나요? 끄기 바로 아래 기다리기를 보세요
          - codeMatches: '(?:\.value\(1\)\n *time\.sleep|^ *\w+)\(\s*0?\.2\s*\)[\s\S]*(?:\.value\(1\)\n *time\.sleep|^ *\w+)\(\s*0?\.6\s*\)[\s\S]*(?:\.value\(1\)\n *time\.sleep|^ *\w+)\(\s*0?\.2\s*\)'
            fail: 짧게 → 길게 → 다시 짧게, 순서가 맞나요?
          - codeMatches: 'range\(\s*(?:0\s*,\s*)?3\s*\)|(?:\.value\(1\)[\s\S]*){9}'
            fail: 짧은 빛과 긴 빛을 각각 3번씩 보내나요?
          - codeMatches: '^while True:'
            fail: SOS 를 한 번만 보내고 끝나지 않나요? 계속 되풀이하는 블록 안에 들어 있나요?
          - pinIs: { name: led }
            fail: LED 핀을 led 라는 이름으로 준비하는 줄이 그대로 있나요?
