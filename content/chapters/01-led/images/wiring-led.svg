<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="inherit">
  <title>배선도: LED 긴 다리(+)는 220옴 저항을 거쳐 ESP32 26번 핀에, 짧은 다리(−)는 GND 핀에 연결</title>
  <!-- USB 선 -->
  <path d="M140 14 V40" stroke-width="3"/>
  <text x="152" y="32" font-size="14" fill="currentColor" stroke="none">USB</text>
  <!-- ESP32 보드 -->
  <rect x="40" y="56" width="200" height="262" rx="14" fill="var(--muted)"/>
  <rect x="112" y="40" width="56" height="22" rx="4" fill="var(--card)"/>
  <rect x="72" y="88" width="136" height="76" rx="6" fill="var(--card)"/>
  <text x="140" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">ESP32</text>
  <!-- 핀 -->
  <g fill="currentColor" stroke="none" font-size="15">
    <text x="206" y="205" text-anchor="end" opacity="0.6">25</text>
    <text x="206" y="235" text-anchor="end" font-size="16" font-weight="700">26</text>
    <text x="206" y="265" text-anchor="end" opacity="0.6">27</text>
    <text x="206" y="295" text-anchor="end" font-size="16" font-weight="700">GND</text>
  </g>
  <circle cx="224" cy="200" r="5" fill="var(--card)"/>
  <circle cx="224" cy="230" r="7" fill="#c92a2a" stroke="none"/>
  <circle cx="224" cy="260" r="5" fill="var(--card)"/>
  <circle cx="224" cy="290" r="7" fill="currentColor" stroke="none"/>
  <!-- 26번 → 저항 → 긴 다리 -->
  <path d="M224 230 H318 M402 230 H470" stroke="#c92a2a" stroke-width="4"/>
  <rect x="318" y="217" width="84" height="26" rx="8" fill="var(--card)"/>
  <path d="M336 218 V242 M350 218 V242" stroke="#c92a2a" stroke-width="5" stroke-linecap="butt"/>
  <path d="M364 218 V242" stroke="#8b6b3e" stroke-width="5" stroke-linecap="butt"/>
  <path d="M386 218 V242" stroke="#c99c00" stroke-width="5" stroke-linecap="butt"/>
  <text x="360" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor" stroke="none">220Ω 저항</text>
  <!-- 짧은 다리 → GND -->
  <path d="M506 200 V290 H224" stroke-width="4"/>
  <!-- LED (켜짐) -->
  <circle cx="488" cy="108" r="40" fill="#c99c00" fill-opacity="0.15" stroke="none"/>
  <path d="M468 150 V108 A20 20 0 0 1 508 108 V150 Z" fill="#c99c00"/>
  <path d="M462 150 H514" stroke-width="3"/>
  <path d="M488 52 V62 M450 70 L457 77 M526 70 L519 77 M436 104 H446 M540 104 H530" stroke="#c99c00" stroke-width="3"/>
  <path d="M470 152 V230 M506 152 V200" stroke-width="3"/>
  <circle cx="470" cy="230" r="4" fill="currentColor" stroke="none"/>
  <circle cx="506" cy="200" r="4" fill="currentColor" stroke="none"/>
  <g fill="currentColor" stroke="none" font-size="16" font-weight="600">
    <text x="458" y="190" text-anchor="end">긴 다리 +</text>
    <text x="518" y="180">짧은 다리 −</text>
  </g>
</svg>
