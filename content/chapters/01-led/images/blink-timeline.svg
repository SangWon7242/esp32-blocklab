<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="inherit">
  <title>깜빡임 시간표: LED가 1초 켜지고 1초 꺼지기를 계속 되풀이</title>
  <!-- 계속 반복 화살표 -->
  <path d="M286 104 C 268 54, 112 54, 94 100"/>
  <path d="M88 90 L94 102 L104 94"/>
  <text x="190" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" stroke="none">계속 반복</text>
  <!-- 막대 -->
  <text x="78" y="146" text-anchor="end" font-size="16" font-weight="700" fill="currentColor" stroke="none">LED</text>
  <rect x="90" y="112" width="100" height="56" rx="6" fill="#c99c00"/>
  <rect x="190" y="112" width="100" height="56" rx="6" fill="var(--muted)"/>
  <rect x="290" y="112" width="100" height="56" rx="6" fill="#c99c00"/>
  <rect x="390" y="112" width="100" height="56" rx="6" fill="var(--muted)"/>
  <rect x="490" y="112" width="100" height="56" rx="6" fill="#c99c00" fill-opacity="0.45" stroke-dasharray="6 6"/>
  <g font-size="16" font-weight="700" text-anchor="middle" stroke="none">
    <text x="140" y="146" fill="#2b2200">켜짐 1초</text>
    <text x="240" y="146" fill="currentColor">꺼짐 1초</text>
    <text x="340" y="146" fill="#2b2200">켜짐 1초</text>
    <text x="440" y="146" fill="currentColor">꺼짐 1초</text>
    <text x="540" y="146" fill="currentColor" opacity="0.7">…</text>
  </g>
  <!-- 시간 축 -->
  <path d="M90 214 H604"/>
  <path d="M596 207 L604 214 L596 221"/>
  <path d="M90 208 V220 M190 208 V220 M290 208 V220 M390 208 V220 M490 208 V220 M590 208 V220"/>
  <g font-size="14" text-anchor="middle" fill="currentColor" stroke="none">
    <text x="90" y="242">0초</text>
    <text x="190" y="242">1초</text>
    <text x="290" y="242">2초</text>
    <text x="390" y="242">3초</text>
    <text x="490" y="242">4초</text>
    <text x="590" y="242">5초</text>
  </g>
  <text x="604" y="266" text-anchor="end" font-size="14" fill="currentColor" stroke="none" opacity="0.75">시간 →</text>
  <!-- 칸과 코드 -->
  <rect x="90" y="292" width="18" height="18" rx="4" fill="#c99c00"/>
  <text x="116" y="306" font-size="14" fill="currentColor" stroke="none">켜고 기다리는 동안</text>
  <rect x="330" y="292" width="18" height="18" rx="4" fill="var(--muted)"/>
  <text x="356" y="306" font-size="14" fill="currentColor" stroke="none">끄고 기다리는 동안</text>
</svg>
