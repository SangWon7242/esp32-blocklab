# 챕터 S16 · 조이스틱 조종기 — 아두이노 기본 W07(조이스틱 X·Y·SW, 방향 판정, 숙제 "조이스틱으로 서보 제어"), W08(조이스틱 패턴은 선택). 형식 설명은 src/track/README.md
# 18장(S15) 서보와 같은 꼴(4번, duty_u16 1638~8100), 13장(S10) 범위 바꾸기(calc_map)를 그대로 쓴다. 버튼 B 는 버튼 챕터(14번)와 겹치지 않게 26번
id: 19-joystick
order: 19
track: sensor
label: S16
prerequisites: [13-clap-dial, 18-servo]
subjects: [수학, 기술가정]
sessions: 1
teacherNotes: |
  **가운데 값부터 재기** 조이스틱에서 손을 떼었을 때 X·Y 값은 2048 이 아니에요. 모듈마다 1800~2100 쯤으로 조금씩 달라요(원본 W07 "중앙값은 2048 이 아닐 수 있음"). 첫 실행에서 꼭 가만히 둔 값을 공책에 적게 하세요.

  - 기준 `1000`·`3000` 은 예시예요. 원본 아두이노 기준 250/750(0~1023)을 4배로 옮긴 값이에요. 가운데 값에서 충분히 떨어져 있으면 모둠마다 바꿔도 돼요. 가운데를 넓게 비워 두는 칸을 **데드존**이라고 해요.
  - X 와 Y 중 어느 쪽이 Left·Up 이 되는지는 모듈을 놓는 방향에 따라 바뀌어요. 모둠마다 핀이 학생 쪽을 보게 놓는 식으로 방향을 맞춰 두면 설명이 쉬워요.
  - 조이스틱 **V 는 3V3** 에 꽂아요. 5V 에 꽂으면 ADC 핀에 3.3V 넘게 들어가고, 끝까지 기울이기 전에 값이 4095 에 붙어 버려요. 서보 빨강은 18장처럼 **5V**(기본 보드는 VIN)예요.
  - X·Y 는 아날로그 핀 **32~39**(ADC1)에 꽂아요. 25·26·27 같은 ADC2 핀도 지금은 읽히지만 WiFi 를 켜는 웹 챕터에서는 못 읽어요. 23번처럼 아날로그가 없는 핀은 블록 검사가 바로 알려 줘요.
  - 버튼 B 는 풀업이라 누르면 `0`, 놓으면 `1` 이에요(11장 버튼과 같아요). 버튼 챕터의 14번과 겹치지 않게 26번에 꽂아요.
  - 미션의 `((값 − 0) × (180 − 0) // (4095 − 0) + 0)` 은 13장·18장과 같은 비례식이에요. 설계 단계(기울인 쪽으로 1°씩, 0~180 을 넘지 않기)는 원본 W07 숙제를 옮긴 것이에요. 굴착기·로봇 팔의 관절 조종(기술가정)과 이어 보세요.
  - 확장: 원본 W08 처럼 조이스틱 방향을 차례로 기록해 "방향 비밀번호"를 만드는 활동을 선택 과제로 쓸 수 있어요.
title: 조이스틱 조종기
subtitle: 기울인 만큼 팔이 움직여요
summary: |
  굴착기 기사님은 손잡이를 조금 밀면 팔이 조금, 많이 밀면 많이 움직여요. 이번에는 그 손잡이, **조이스틱**을 읽어요.
  X·Y 두 값과 버튼을 찍어 보고, **기준값**으로 Left·Right·Center 를 가려요. 마지막엔 X 값을 **범위 바꾸기**로 0~180도로 옮겨 조이스틱으로 서보 팔을 조종해요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: 노트북과 USB 선으로 연결 }
  - { name: 조이스틱 모듈, note: "핀 5개: X → 36번, Y → 39번, B(버튼) → 26번, V → 3V3, G → GND. 모듈에 따라 VRX · VRY · SW 로 적혀 있어요" }
  - { name: 서보 모터(SG90), note: "선 3가닥: 주황 신호 → 4번, 빨강 → 5V, 갈색 → GND" }
  - { name: F-F 듀폰선 5가닥, note: "양쪽 끝이 구멍인 선. 조이스틱 핀 5개를 보드 핀에 바로 씌워요 (브레드보드 없이)" }
  - { name: M-F 듀폰선 3가닥, board: devkit, note: "서보 플러그 구멍 3개 → D4 · VIN · GND" }
wiring:
  image: images/wiring-breadboard.svg
  caption: "브레드보드 없이 보드에 바로 꽂아요. 조이스틱(보드 아래, 핀이 위로): X → io36(초록), Y → io39(파랑), V → 3V3, G → GND (모두 아래 줄), B → 위쪽 한 줄 io26(노랑, 보드 바깥으로 돌아서). 서보 플러그는 ANALOG io4 줄에 그대로 (갈색 G · 빨강 V · 주황 S)"
  captionDevkit: "조이스틱은 F-F 선으로 바로: X → VP(36, 초록), Y → VN(39, 파랑), B → D26(노랑), G → 위 줄 GND, V → 3V3. 서보 플러그 구멍에 M-F 선: 주황 → D4, 빨강 → VIN(5V), 갈색 → 아래 줄 GND"
principle:
  image: images/joystick-axes.svg
  body: |
    조이스틱 속에는 13장의 **가변저항이 두 개** 들어 있어요. 하나는 좌우 기울기(**X**), 하나는 앞뒤 기울기(**Y**)를 재요. 손잡이를 기울이면 가운데 다리 전압이 바뀌고, 보드는 그것을 **0~4095** 숫자로 읽어요.

    - 가만히 두면 X·Y 모두 **가운데쯤**(약 2000). 정확히 2048 은 아니라서 먼저 재 봐야 해요
    - 한쪽 끝까지 기울이면 0 쪽, 반대쪽 끝은 4095 쪽으로 가요
    - 손잡이를 꾹 누르면 속의 **버튼**이 눌려요. 11장 버튼처럼 풀업이라 누르면 `0`, 놓으면 `1`
    - X·Y 는 아날로그 핀 **36·39번**, 버튼은 **26번**. 조이스틱 전원은 **3V3** 이에요

    "얼마나 기울였나"는 0~4095 의 숫자예요. 이 숫자를 **범위 바꾸기**로 0~180 으로 옮기면 그대로 서보 각도가 돼요.
goals:
  content: 조이스틱의 X·Y 값과 버튼을 읽고, 기준값으로 방향을 가리며, X 값을 범위 바꾸기로 0~180도로 옮겨 서보를 조종한다
  thinking: 가만히 둔 값을 직접 재 보고 기준값을 근거 있게 정하며, 기울인 정도와 팔 각도 사이의 비례 관계를 식으로 나타낸다
successCriteria:
  - 조이스틱의 X·Y·버튼이 각각 무엇을 재고 어느 핀에 꽂는지 말할 수 있다
  - 가만히 둔 값을 재 보고, 그 값에서 떨어진 곳에 기준값을 정한 이유를 말할 수 있다
  - 조이스틱 X 값 0~4095 를 서보 각도 0~180 으로 바꾸는 블록을 만들 수 있다
  - 각도가 0~180 을 넘지 않게 지키는 방법을 설명할 수 있다
parts:
  - id: part1
    title: 조이스틱으로 팔 조종하기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 손의 "얼마나"를 각도로
        minutes: 3
        scene:
          image: images/cover.svg
          caption: 손잡이를 조금 기울이면 팔이 조금, 많이 기울이면 많이 움직여요
        body: |
          굴착기 기사님은 손잡이를 조금만 밀어도 팔이 **조금만** 움직여요. 많이 밀면 많이 움직이고요. 버튼처럼 0과 1 만으로는 이렇게 할 수 없어요.

          손의 "얼마나"를 각도로 어떻게 바꿀까요? 코드를 보기 전에 내 생각부터 적어 봐요. 틀려도 괜찮아요.
        todo:
          - 준비물(조이스틱 모듈, 서보 모터, 선)을 책상에 꺼내 놓기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 굴착기 손잡이는 "얼마나 밀었는지"를 알아야 해요. 버튼(0과 1)과 무엇이 달라야 할까요?
          - 손잡이에서 손을 떼면 팔은 어떻게 되어야 할까요? 보드는 "손을 뗐다"는 것을 어떻게 알 수 있을까요?
          - 손잡이를 끝까지 밀었을 때 팔이 너무 멀리 가서 부서지지 않게 하려면 무엇을 정해 둬야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 3
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "조이스틱을 기울인 만큼 서보 팔 돌리기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 보드는 "조금"이나 "많이"를 몰라요. **숫자**로 알려 줘야 해요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 조이스틱이 어느 핀에 있고, 값이 어디부터 어디까지인지 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 숫자 적기 (가운데는 몇이죠?)"
          - "**해야 할 것**: 보드가 되풀이하는 일 적기"
        answer:
          know: ["조이스틱 X 는 36번, Y 는 39번, 버튼은 26번, 서보는 4번", "X·Y 값은 0~4095, 버튼은 누르면 0"]
          decide: ["가만히 둔 값과 방향으로 볼 기준값 (예: 1000, 3000)", "X 값 0~4095 를 몇 도~몇 도로 옮길지 (예: 0~180)"]
          act: ["조이스틱 값을 계속 읽기", "범위 바꾸기로 각도를 계산하기", "서보를 그 각도로 보내고 잠깐 기다리기"]

      - id: predict
        type: predict
        title: 예측하기 — X, Y, 버튼 읽기
        minutes: 3
        scene:
          image: images/joystick-axes.svg
          caption: 좌우로 기울이면 X, 앞뒤로 기울이면 Y 가 0~4095 사이에서 바뀌어요
        body: |
          조이스틱 준비 블록 하나가 코드 다섯 줄이 돼요. `rocker_x.read()` 와 `rocker_y.read()` 는 0~4095 숫자를 하나씩 돌려줘요.

          활동 칸의 코드는 아직 실행하지 않아요. 손을 뗐을 때, 끝까지 기울였을 때 숫자가 어떻게 나올지 미리 적어 봐요.
        todo:
          - 코드를 한 줄씩 소리 내어 읽기
          - "`button_z.value() == 0` 이 언제 참인지 생각하기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_read.py
        blanks:
          - q: 조이스틱에서 손을 떼고 가만히 두면 x 와 y 는 각각 얼마쯤 나올까요?
          - q: 손잡이를 좌우 한쪽 끝까지 기울이면 x 는 얼마쯤일까요? 반대쪽 끝은요?
          - q: 화면에 한 줄이 찍히고 다음 줄이 찍히기까지 몇 초 걸릴까요?
            unit: 초

      - id: run
        type: run
        title: 복사 · 실행 — 가만히 둔 값 재기
        minutes: 5
        scene:
          image: images/wiring-breadboard.svg
          caption: "조이스틱 X → io36(초록), Y → io39(파랑), B → io26(노랑), V → 3V3, G → GND. 서보 플러그는 io4 줄에 그대로"
          captionDevkit: "조이스틱 X → VP(36, 초록), Y → VN(39, 파랑), B → D26(노랑), V → 3V3, G → GND. 서보 주황 → D4, 빨강 → VIN(5V)"
        body: |
          **USB 를 뺀 채로** **부품과 배선**의 배선도를 보고 오늘 쓸 부품을 모두 꽂아요. 서보 빨강은 **5V**, 조이스틱 V 는 **3V3** 이에요. 조이스틱 V 를 5V 에 꽂으면 안 돼요. 선이 몇 군데 엇갈리니 배선 그림과 아래 표를 한 줄씩 짚으며 꽂아요.

          실행한 뒤 먼저 **손을 떼고** 찍히는 두 숫자를 공책에 적어요. 2048 과 같나요? 그다음 손잡이를 끝까지 기울이고, 꾹 눌러 봐요.
        todo:
          - 배선도대로 꽂고, 조이스틱 V 가 3V3 핀에 있는지 확인하기
          - "**보드 연결** → **실행** 누르기"
          - 가만히 둔 x·y 값과 끝까지 기울인 값을 공책에 적기
        code: step1_read.py
        expected: 코드를 실행하면 0.2초마다 `x y` 두 숫자가 찍혀요. 가만히 두면 둘 다 2000 언저리, 기울이면 0 이나 4095 쪽으로 가요. 손잡이를 누르고 있는 동안에는 `Button` 도 찍혀요.
        codeNotes:
          - { line: 4, note: "조이스틱 X 를 36번 아날로그 입력으로 준비해요 (4~8번 줄이 조이스틱 준비 블록 하나)" }
          - { line: 6, note: "0~3.3V 를 모두 읽을 수 있게 정해요 (11dB 감쇠). 7번 줄은 Y 에게 같은 일을 해요" }
          - { line: 8, note: "버튼 B 를 26번에 풀업 입력으로 준비해요. 누르지 않으면 1, 누르면 0" }
          - { line: 11, note: "`rocker_x.read()`: 좌우로 기울인 정도를 0~4095 로 읽어 `x` 에 담아요" }
          - { line: 13, note: "`x` 와 `y` 를 한 줄에 함께 찍어요" }
          - { line: 14, note: "버튼 값이 0 이면, 곧 눌렸으면 아래 줄을 실행해요" }
          - { line: 16, note: "0.2초 기다렸다가 다시 읽어요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 — X, Y, 버튼
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          창에서 본 숫자를 이제 코드로 확인해요. 준비하는 다섯 줄과 `while True:` 안의 줄들을 나눠서 읽어 봐요.

          줄마다 손가락으로 짚으며 읽고, 답을 공책에 먼저 적은 뒤 **확인**을 눌러요.
        todo:
          - 조이스틱을 준비하는 다섯 줄 찾기
          - 손잡이를 누르지 않을 때 어느 줄이 건너뛰어지는지 따라가 보기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_read.py
        questions:
          - { kind: number, q: "조이스틱 값을 몇 초마다 한 번씩 읽나요?", answer: 0.2 }
          - { kind: choice, q: "손잡이를 누르지 않고 가만히 두면 창에 무엇이 찍힐까요?", options: ["두 숫자만", "두 숫자와 Button", "Button 만"], answer: 0, hint: "누르지 않을 때 button_z.value() 는 얼마인가요? 그러면 if 안의 줄은 실행될까요?" }
          - { kind: line, q: "x 와 y 를 창에 찍는 줄의 번호를 클릭하세요", answer: 13 }
        codeNotes:
          - { line: 4, note: "조이스틱을 준비해요 (4~8번 줄)" }
          - { line: 11, note: "X 값 0~4095 를 읽어요. 다음 줄은 Y 값" }
          - { line: 14, note: "버튼이 눌렸는지 봐요" }
          - { line: 16, note: "다음 읽기까지 기다려요" }

      - id: run2
        type: run
        title: 실행 2 — Left, Right, Center 가리기
        minutes: 5
        scene:
          image: images/deadzone.svg
          caption: 1000 보다 작으면 Left, 3000 보다 크면 Right. 가운데는 넓게 비워 둬요
        body: |
          이번에는 숫자 대신 **방향 글자**를 찍어요. x 가 **1000 보다 작으면** Left, **3000 보다 크면** Right 예요. y 도 같은 방법으로 Up·Down 을 가려요. 아무 쪽도 아니면 Center 예요.

          왜 2048 하나가 아니라 1000 과 3000 두 기준을 쓸까요? 손을 떼었을 때 찍히는 글자를 보며 생각해 봐요.
