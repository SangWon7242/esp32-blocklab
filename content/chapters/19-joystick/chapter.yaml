          caption: 0~4095 의 긴 자를 0~180 의 짧은 자로 옮겨요. 한가운데 2048 은 90도쯤이 돼요
        body: |
          이제 조이스틱으로 굴착기 팔을 조종해요. 18장에서 다이얼로 서보를 돌렸던 것처럼, 이번에는 **조이스틱 X 값**을 범위 바꾸기로 0~180 으로 옮겨 서보 각도로 보내요.

          손잡이를 천천히 기울여 팔이 따라오는지, 손을 떼면 팔이 가운데쯤으로 돌아오는지 확인하고 **판정**을 눌러요.
        todo:
          - "조이스틱 준비 블록 **아래**에 서보를 4번 핀에 `servo` 이름으로 준비하기"
          - "반복 안의 줄들을 지우고, 조이스틱 X 값을 **범위 바꾸기**로 0~180 으로 바꿔 `angle` 에 담기"
          - "서보 각도를 `angle` 도로 정하고 20ms 기다린 뒤 **판정** 누르기"
        instructions: 조이스틱을 기울이면 서보 팔이 따라 돌게 하세요. 조이스틱 준비 아래에 서보를 4번 핀에 servo 이름으로 준비하고, 반복 안에서는 조이스틱 X 값(0~4095)을 범위 바꾸기로 0~180 으로 바꿔 angle 에 담은 뒤, 서보 각도를 angle 도로 정하고 20밀리초 기다려요
        hint: 18장 미션과 무엇이 같고 무엇이 다른가요? 범위 바꾸기 블록의 첫 칸에 다이얼 값 대신 조이스틱 X 값 블록을 끼워 보세요
        code: step1_read.py
        rules:
          - pinIs: { name: servo, pin: 4 }
            fail: 서보 주황 신호선은 몇 번 핀에 꽂았나요? 그 핀을 servo 라는 이름으로 준비했나요?
          - codeMatches: '\(\(rocker_x\.read\(\)\s*-\s*0\)\s*\*\s*\(180\s*-\s*0\)\s*//\s*\(4095\s*-\s*0\)\s*\+\s*0\)'
            fail: 조이스틱 X 값의 범위와 서보 각도의 범위는 각각 어디부터 어디까지인가요? 범위 바꾸기의 첫 칸에 조이스틱 X 값이 들어갔나요?
          - codeMatches: '^\s+servo\.duty_u16\(1638\s*\+\s*angle\s*\*\s*6462\s*//\s*180\)$'
            fail: 바꾼 각도를 서보에게 보냈나요? 서보 각도 블록의 칸에 무엇이 들어 있나요?
          - codeMatches: '^rocker_x\s*=\s*ADC\(Pin\(36\)\)[\s\S]*^servo\s*=\s*PWM\(Pin\(4\)\)'
            fail: 서보 준비와 조이스틱 준비는 어느 순서로 있나요? 둘 다 반복 밖에 있나요?
          - codeMatches: '^\s+angle\s*=\s*.*rocker_x\.read\(\).*\n(\s*print\(.*\)\n)*\s+servo\.duty_u16\(1638\s*\+\s*angle\b'
            fail: 조이스틱 값을 바꿔 담은 이름과 서보에게 보내는 이름이 같나요? 담은 줄 바로 다음에 서보에게 보내나요?
          - codeMatches: '(?<![\s\S])(?![\s\S]*(print\(\s*x\s*,\s*y\s*\)|print\("Button"\)|^\s+time\.sleep\(0\.2\)))'
            fail: 반복 안에 처음 코드의 줄이 아직 남아 있지 않나요? 값을 찍던 줄과 0.2초 기다리던 줄을 찾아 보세요
          - codeMatches: '^\s+time\.sleep(_ms\(20\)|\(0?\.02\))$'
            fail: 한 바퀴마다 얼마나 기다리나요? 지시의 밀리초와 같은가요? 그 줄은 반복 안에 있나요?
