  <title id="mbf-title">진동수와 듀티: 도(262 Hz)는 느리게 떨려 낮은 소리, 높은 도(523 Hz)는 2배 빠르게 떨려 높은 소리. duty 512 는 한 번 떨 때 반은 켜지고 반은 꺼져 소리가 나고, duty 0 이면 꺼진 채라 조용하다</title>
  <text x="32" y="40" font-size="20" font-weight="700" text-anchor="start" fill="currentColor" stroke="none">소리는 떨림이에요</text>
  <text x="32" y="64" font-size="14" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" fill-opacity="0.75">1초에 떨리는 횟수 = 진동수 (Hz). 빠르게 떨수록 높은 소리</text>
