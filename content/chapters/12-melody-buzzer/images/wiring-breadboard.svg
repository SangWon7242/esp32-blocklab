  <title id="mbw-title">멜로디 버저 브레드보드 배선도: 부저의 + 다리는 16번 줄, − 다리는 19번 줄에 꽂는다. 16번 줄에서 노란 선으로 ESP32 15번 핀, 19번 줄에서 검은 선으로 위쪽 − 줄, − 줄은 검은 선으로 ESP32 GND 에 연결. 1단계에는 능동 부저(검은 스티커), 2단계부터는 같은 자리에 수동 부저(초록 판)를 꽂는다</title>
