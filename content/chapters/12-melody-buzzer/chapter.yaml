# 챕터 12 · 멜로디 버저 (S9) — 원본: 아두이노 기본 W03(수동 버저·음계 주파수표·for·배열), W04(센서 악기), Keyestudio 2-3-09·2-3-10. 형식 설명은 src/track/README.md
id: 12-melody-buzzer
order: 12
track: sensor
label: S9
prerequisites: [04-flowing-light]
subjects: [과학, 수학, 음악]
sessions: 2
teacherNotes: |
  **핀** 부저는 사이트 블록의 기본 핀인 **15번**을 써요. Keyestudio 튜토리얼(2-3-09·2-3-10)은 13번, 계획 표는 25번이라 다르니, 키트 그림을 보고 꽂는 학생에게 "코드의 핀 번호와 실제 꽂은 핀이 같은가"를 먼저 묻게 해 주세요.

  **부저 구별** 능동 부저는 검은 스티커가 붙어 있고(+ 표시, 다리 길이 다름, 극성 있음), 수동 부저는 초록 판이 보이고 극성이 없어요. 두 부저를 섞어 나눠 주면 "바꿔 꽂음" 디버깅이 저절로 생겨요.

  **소리 크기** 튜토리얼은 S8050 트랜지스터와 1kΩ·10kΩ 저항으로 전류를 키워요. 이 챕터는 부저를 핀에 바로 꽂아 회로를 줄였기 때문에 소리가 작을 수 있어요. 교실이 시끄러우면 트랜지스터 회로를 보여 주거나 모둠별로 돌아가며 실행해요.

  **교과 융합**
  - 과학: 소리는 떨림, 1초에 떨리는 횟수 = 진동수(Hz). 높은 소리 = 빠른 떨림
  - 수학: 음계 주파수표에서 규칙 찾기 — 한 옥타브 위는 진동수가 약 2배(262 → 523). 박자 비율(한 박 0.4초면 두 박은 0.8초)
  - 음악: 계이름과 박자. 작은 별 첫 소절 "도 도 솔 솔 라 라 솔(두 박)"

  **원본에서 더 가져올 거리**
  - 디버깅: 쉼표를 `freq(0)` 으로 넣어 오류 → duty 0 으로 쉼. 음 길이를 `1000 / 4` 처럼 나누면 실수가 되어 `sleep_ms` 에서 오류 → `//`
  - 미션: 학교 종 멜로디(솔 솔 라 라 솔 솔 미), 버튼을 누르면 연주(S8 버튼과 연결), 센서 값이 기준을 넘으면 멜로디(W04 센서 악기 — 마이크·가변저항·조도 챕터 뒤 교과 융합으로)
  - 층간소음·알림음 이야기는 사회·기술가정 연결 거리
title: 멜로디 버저
summary: |
  부저는 **떨림**으로 소리를 내요. 켜기만 하면 "삑" 하는 **능동 부저**로 시작해서, 떨림의 빠르기(**진동수**)를 정해 주는 **수동 부저**로 도레미파솔라시도를 연주해요.
  음 높이를 **목록(리스트)** 에 담고 `for` 로 하나씩 꺼내면, 박자 목록까지 짝지어 "작은 별"도 연주할 수 있어요.
cover: images/cover.svg
materials:
  - { name: ESP32 보드, note: Micro USB 선으로 노트북과 연결 }
  - { name: 수동 부저, note: 초록 판이 보이는 쪽. 진동수를 정해 주면 여러 음을 내요 }
  - { name: 능동 부저, note: "검은 스티커(+ 표시)가 붙은 쪽. 켜기만 하면 정해진 음 하나로 삑" }
  - { name: 브레드보드, note: 부품을 꽂고 선으로 잇는 판. 납땜 없이 빼고 꽂을 수 있어요 }
  - { name: 점퍼선(M-M), note: "3개 (15번 신호 1, 부저 − → − 줄 1, − 줄 → GND 1)" }
  - { name: USB 선, note: 충전 전용 말고 데이터가 되는 선 }
wiring:
  image: images/wiring-breadboard.svg
  caption: "부저 + 다리 → 16번 줄 → 노란 선 → 15번 핀. − 다리 → 19번 줄 → 검은 선 → − 줄 → GND. 1단계는 능동 부저, 2단계부터는 같은 자리에 수동 부저를 꽂아요"
principle:
  image: images/frequency-wave.svg
  body: |
    소리는 **떨림**이에요. 부저 안의 얇은 판이 떨면 공기가 함께 떨려 귀까지 전해져요. 1초에 떨리는 횟수를 **진동수**라고 하고, 단위는 **Hz**(헤르츠)예요. **빠르게 떨수록 높은 소리**가 나요.

    - **능동 부저**: 안에 떨림을 만드는 회로가 있어서 핀에 1(HIGH)만 보내면 정해진 음 하나로 "삑" 울려요. 음 높이는 바꿀 수 없어요
    - **수동 부저**: 떨림 회로가 없어요. 1만 보내면 판을 한 번 밀 뿐 소리가 안 나요. 그래서 ESP32 가 **PWM** 으로 아주 빠르게 켰다 껐다 해 줘야 해요. `beeper.freq(262)` 는 "1초에 262번 떨어라", 곧 **도**예요
    - `beeper.duty(512)` 는 한 번 떨 때 **반은 켜짐, 반은 꺼짐**으로 소리를 내고, `beeper.duty(0)` 은 꺼진 채라 **조용**해요

    음계 주파수표에서 도는 262 Hz, 높은 도는 523 Hz 예요. **한 옥타브 올라가면 진동수가 약 2배**가 돼요.
goals:
  content: 능동 부저를 켜고 끄고, 수동 부저의 진동수를 음 목록과 for 로 바꿔 멜로디를 연주한다
  thinking: 소리의 높낮이를 숫자(진동수)로, 박자를 시간으로 바꿔 생각하고, 두 목록을 같은 칸 번호로 짝짓는다
successCriteria:
  - 능동 부저와 수동 부저가 어떻게 다른지 소리를 내는 방법으로 말할 수 있다
  - 높은 음이 왜 큰 진동수인지, 도와 높은 도의 진동수가 어떤 관계인지 설명할 수 있다
  - 음 목록과 박자 목록을 칸 번호 i 로 짝지어 노래 한 소절을 연주할 수 있다
parts:
  - id: part1
    title: 떨림으로 노래하기
    steps:
      - id: problem
        type: problem
        title: 문제 만나기 — 부저는 어떻게 노래할까?
        minutes: 4
        scene:
          image: images/cover.svg
          caption: 오늘의 목표 — 부저 하나로 도레미파솔라시도, 그리고 "작은 별" 연주하기
        body: |
          전자레인지나 세탁기는 일이 끝나면 "띵" 하고 끝나기도 하지만, 짧은 노래를 부르기도 해요. 그 소리를 내는 부품이 **부저**예요.

          소리는 무언가가 **떨려서** 나요. 그런데 부저 하나로 어떻게 낮은 도와 높은 도를 다르게 낼 수 있을까요? 코드를 보기 전에 내 생각부터 적어 봐요. 정답은 없고, 틀려도 괜찮아요.
        todo:
          - 준비물(부저 두 개, 브레드보드, 점퍼선)을 책상에 꺼내 놓고 두 부저의 생김새 비교하기
          - 질문마다 내 생각을 한두 문장으로 쓰기
          - 다 적으면 **완료** 누르기
        questions:
          - 부저 하나로 "삑" 소리 말고 여러 음(도, 레, 미 …)을 내려면 무엇을 바꿔야 할까요?
          - 기타 줄이나 고무줄을 튕겨 보면 떨면서 소리가 나요. 빠르게 떨면 소리가 높아질까요, 낮아질까요? 왜 그렇게 생각하나요?
          - 노래 한 곡을 보드에게 시키려면 음 하나마다 무엇과 무엇을 알려 줘야 할까요?

      - id: analysis
        type: analysis
        title: 조건 분석 — 세 칸 보드
        minutes: 5
        scene:
          image: images/three-boxes.svg
          caption: 알아야 할 것 → 정해야 할 것 → 해야 할 것 순서로 나눠요
        body: |
          "부저로 노래하기"를 보드에게 시키려면 일을 잘게 나눠야 해요. 음 하나를 낼 때도 **높이**와 **길이**가 함께 필요해요.

          활동 칸의 세 칸에 각각 한 가지 이상 적어 보세요. 박자(음의 길이)는 알아야 할 것일까요, 정해야 할 것일까요? 세 칸을 다 쓰면 **예시 답 보기**가 열려요.
        todo:
          - "**알아야 할 것**: 부저와 음에 대해 보드가 미리 알고 있어야 할 사실 적기"
          - "**정해야 할 것**: 사람이 골라 줘야 하는 음·순서·시간 적기"
          - "**해야 할 것**: 보드가 실제로 하는 일 적기"
        answer:
          know: ["부저가 몇 번 핀에 꽂혀 있는지 (15번)", "부저가 능동인지 수동인지", "음마다 진동수 (도 262 Hz, 레 294 Hz …)"]
          decide: ["어떤 음을 어떤 순서로 낼지", "음 하나를 얼마나 오래 낼지 (박자)", "음과 음 사이를 얼마나 쉴지"]
          act: ["음 높이(진동수)를 정하기", "소리를 켜고, 기다렸다가, 끄기", "목록의 음을 차례로 되풀이하기"]

      - id: predict
        type: predict
        title: 예측하기 — 능동 부저 삑삑
        minutes: 5
        scene:
          image: images/wiring-breadboard.svg
          caption: "먼저 능동 부저(검은 스티커)를 꽂아요. + 다리는 15번 핀, − 다리는 GND 로 가요"
        body: |
          아직 실행하지 않아요. 먼저 **능동 부저**부터 울려 봐요. 능동 부저는 안에 떨림 회로가 있어서, 1장의 LED 처럼 `1`(켜기)과 `0`(끄기)만 보내면 돼요.

          `buzzer.value(1)` 과 `buzzer.value(0)` 사이에 무엇이 있는지, `while True:` 가 무엇을 되풀이하는지 따라가며 빈칸에 내 예측을 적어요.
        todo:
          - 1장 LED 코드와 이 코드가 무엇이 같고 무엇이 다른지 찾기
          - "`time.sleep(0.5)` 가 몇 번 나오는지 세기"
          - 빈칸 세 개에 내 예측 쓰기
        code: step1_beep.py
        blanks:
          - q: '"삑" 소리 한 번은 몇 초 동안 날까요?'
            unit: 초
          - q: '1분 동안 "삑" 소리는 모두 몇 번 날까요?'
            unit: 번
          - q: buzzer.value(0) 줄을 지우면 소리는 어떻게 될까요?

      - id: run
        type: run
        title: 복사 · 실행 — 삑삑 울리기
        minutes: 6
        scene:
          image: images/wiring-breadboard.svg
          caption: "부저 + 다리 → 16번 줄 → 15번 핀, − 다리 → 19번 줄 → − 줄 → GND"
        body: |
          USB 를 뺀 채 **능동 부저**를 브레드보드에 꽂아요. 능동 부저는 다리 방향이 있어요. 스티커의 **+** 쪽(긴 다리)이 15번 핀으로, 다른 다리가 GND 로 가야 해요.

          실행해서 "삑" 하는 시간과 조용한 시간이 예측과 같은지 들어 보세요. 멈출 때는 **정지**를 눌러요.
        todo:
          - USB 를 뺀 채 그림대로 능동 부저와 선 꽂기 (+ 다리 → 15번)
          - "**보드 연결** → **실행** 누르기"
          - 삑 소리의 길이와 횟수를 예측과 비교하기
        code: step1_beep.py
        expected: 코드를 실행하면 능동 부저가 0.5초 동안 "삑" 울리고 0.5초 조용하기를 되풀이해요. 1초에 한 번씩 삑, 삑 소리가 나요.
        codeNotes:
          - { line: 4, note: "15번 핀을 내보내는(출력) 핀으로 정하고 이름을 `buzzer` 로 붙여요" }
          - { line: 6, note: "들여 쓴 네 줄을 끝없이 되풀이해요" }
          - { line: 7, note: "`1`(HIGH)을 보내면 능동 부저 안의 떨림 회로가 움직여 \"삑\" 소리가 나요" }
          - { line: 8, note: "0.5초 동안 소리를 낸 채 기다려요" }
          - { line: 9, note: "`0`(LOW)을 보내 부저를 조용히 해요" }
          - { line: 10, note: "0.5초 조용히 기다린 뒤 다시 처음으로 돌아가요" }

      - id: readcheck
        type: readcheck
        title: 읽기 체크 ① — 켜기와 끄기
        minutes: 4
        scene:
          image: images/read-code.svg
          caption: 세 문제의 답은 모두 활동 칸의 코드 안에 있어요
        body: |
          능동 부저 코드는 1장의 LED 깜빡이기와 꼴이 거의 같아요. 다른 것은 핀 번호와 이름뿐이에요.

          손가락으로 한 줄씩 짚으며 읽고, 답을 공책에 먼저 적은 뒤 **확인**을 눌러요. 틀린 문항은 그 줄을 다시 읽으면 돼요.
        todo:
          - 소리가 나는 시간과 조용한 시간을 더해 보기
          - 핀에 보내는 값이 1일 때와 0일 때 무엇이 달라지는지 말해 보기
          - 세 문제에 답하고 **확인** 누르기
        code: step1_beep.py
        questions:
          - { kind: number, q: "\"삑\" 소리는 1초에 몇 번 나나요?", answer: 1, hint: "소리 나는 시간 + 조용한 시간" }
          - { kind: choice, q: "부저가 울리는 동안 15번 핀으로 보내는 값은?", options: ["0", "1"], answer: 1 }
          - { kind: line, q: "부저를 조용히 하는 줄의 줄 번호를 클릭하세요", answer: 9 }
        codeNotes:
          - { line: 4, note: "`Pin(15, Pin.OUT)` — 15번 핀으로 전기를 내보내요" }
          - { line: 7, note: "켜기: 능동 부저는 켜기만 해도 정해진 음 하나가 나요" }
          - { line: 9, note: "끄기: 이 줄이 없으면 소리가 멈추지 않아요" }

      - id: run2
        type: run
        title: 복사 · 실행 ② — 도레미파솔라시도
        minutes: 8
        scene:
          image: images/note-table.svg
          caption: "음계 주파수표 — 도 262 Hz 부터 높은 도 523 Hz 까지. 한 옥타브 위는 진동수가 약 2배"
        body: |
          이제 USB 를 빼고 능동 부저를 뽑은 다음, **같은 자리에 수동 부저**(초록 판)를 꽂아요. 수동 부저는 1만 보내서는 소리가 안 나요. `PWM` 으로 1초에 몇 번 떨지(**진동수**)를 정해 줘야 해요.

          음 여덟 개의 진동수를 `notes` 목록에 담고, 4장의 흐르는 물빛처럼 `for` 로 하나씩 꺼내 울려요. 실행하면서 음이 점점 높아지는지 들어 보세요.
        todo:
          - USB 를 빼고 능동 부저 자리에 수동 부저 꽂기
          - "**실행** 누르고 도레미파솔라시도가 들리는지 듣기"
          - 그림의 주파수표와 `notes` 목록의 숫자를 짝지어 보기
        code: step2_notes.py
        expected: 코드를 실행하면 수동 부저가 도 레 미 파 솔 라 시 도를 차례로 한 번 연주하고 멈춰요. 음 하나는 0.4초 울리고, 음과 음 사이에 0.1초 쉬어요.
        codeNotes:
          - { line: 4, note: "15번 핀을 **PWM** 핀으로 준비해요. 이름은 `beeper`" }
          - { line: 6, note: "처음에는 `duty(0)` 으로 조용히 둬요 (4~6번 줄이 한 덩어리)" }
          - { line: 8, note: "도부터 높은 도까지 진동수 여덟 개를 목록 `notes` 에 담아요" }
          - { line: 9, note: "목록에서 진동수를 앞에서부터 하나씩 꺼내 `hz` 에 담아요" }
          - { line: 10, note: "1초에 `hz` 번 떨게 해요. 이 숫자가 음 높이예요" }
          - { line: 11, note: "`duty(512)` — 반은 켜짐, 반은 꺼짐으로 떨어서 소리가 나요" }
