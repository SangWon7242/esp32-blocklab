      - id: mission
        type: mission
        title: 미션 — 작은 별 첫 소절
        minutes: 8
        scene:
          image: images/beat-timeline.svg
          caption: "음 목록 notes 와 박자 목록 beats 의 같은 칸(i)이 짝이에요. 마지막 솔만 두 박"
        body: |
          "반짝반짝 작은 별"의 첫 소절은 **도 도 솔 솔 라 라 솔** 이에요. 앞의 여섯 음은 한 박, 마지막 솔은 **두 박**이에요. 음 높이만 담은 목록으로는 길이를 다르게 할 수 없어요.

          그래서 박자를 담은 목록 `beats` 를 하나 더 만들어요. `for i in range(len(notes)):` 는 칸 번호 `i` 를 0, 1, 2 … 로 하나씩 꺼내요. 그러면 `notes[i]` 와 `beats[i]` 로 **같은 칸**의 음과 박자를 함께 쓸 수 있어요. 한 박은 0.4초예요.
        todo:
          - "`notes` 를 작은 별 첫 소절 일곱 음의 진동수로 바꾸기 (주파수표 보기)"
          - "`beats = [1, 1, 1, 1, 1, 1, 2]` 를 만들고, for 를 칸 번호 `i` 로 돌게 바꾸기"
          - 실행해서 노래로 들리는지 확인하고 **판정** 누르기
        instructions: "notes 를 작은 별 첫 소절(도 도 솔 솔 라 라 솔)의 진동수로 바꾸고, 바로 다음 줄에 박자 목록 beats = [1, 1, 1, 1, 1, 1, 2] 를 만들어 주세요. for 는 for i in range(len(notes)): 로 바꾸고, i번째 음(notes[i])을 i번째 박자 × 0.4초 동안 울려요. 음 사이 0.1초 쉼은 그대로 둬요"
        hint: "기다리는 시간도 계산할 수 있어요. 한 박이 0.4초면 beats[i] 박은 몇 초일까요? 진동수 자리에는 hz 대신 무엇이 들어가야 할까요?"
        code: step2_notes.py
        rules:
          - codeMatches: 'beats = \['
            fail: 박자를 담을 목록을 만들었나요? 이름은 무엇으로 하기로 했나요?
          - codeMatches: 'for i in range\(len\(notes\)\):'
            fail: 음과 박자를 같은 칸 번호로 함께 꺼내려면, for 가 숫자를 꺼내야 할까요, 칸 번호를 꺼내야 할까요?
          - codeEquals: { file: mission_twinkle.py }
            fail: 일곱 음의 진동수가 주파수표와 맞나요? notes 와 beats 의 칸 수가 같나요? 기다리는 시간에 박자를 넣었나요?
        answerCode: mission_twinkle.py

      - id: extra1
        type: mission
        title: 추가 미션 — 사이렌 만들기
        optional: true
        minutes: 5
        scene:
          image: images/frequency-wave.svg
          caption: 진동수를 조금씩 올렸다 내리면 소리가 "위잉— 위잉—" 오르내려요
        body: |
          먼저 끝낸 사람을 위한 미션이에요. 구급차 사이렌은 음이 미끄러지듯 올라갔다 내려와요. 음 목록 대신 `range` 로 진동수를 조금씩 바꿔 봐요.

          `range(400, 1000, 20)` 의 세 번째 숫자 20 은 **걸음**이에요. 400, 420, 440 … 처럼 20씩 커져요. 걸음을 `-20` 으로 하면 거꾸로 작아져요. 한 걸음은 0.01초씩 울리고, 이 오르내림을 계속 되풀이해요.
        todo:
          - 400 Hz 에서 1000 Hz 까지 20 Hz 걸음으로 올라가는 for 만들기
          - 1000 Hz 에서 400 Hz 까지 -20 걸음으로 내려오는 for 만들기
          - 둘을 계속 되풀이하게 하고 실행해 보고 **판정** 누르기
        instructions: 400 Hz 에서 1000 Hz 까지 20 Hz 걸음으로 올라갔다가, 다시 -20 걸음으로 내려오기를 계속 되풀이하는 사이렌을 만들어 주세요. 한 걸음은 0.01초씩 울려요
        hint: range(시작, 끝, 걸음) 에서 걸음이 음수면 숫자가 작아져요. 오르는 for 와 내리는 for 를 while True 안에 넣어요
        code: step2_notes.py
        rules:
          - codeMatches: 'while True:'
            fail: 사이렌이 한 번만 오르내리고 끝나지 않나요? 계속 되풀이하려면?
          - codeMatches: 'range\(\s*400\s*,\s*1000\s*,\s*20\s*\)'
            fail: 올라가는 길은 어디서 시작해 어디까지, 몇 걸음씩인가요?
          - codeMatches: 'range\(\s*1000\s*,\s*400\s*,\s*-20\s*\)'
            fail: 내려오는 길의 걸음은 어떤 수여야 숫자가 작아질까요?
        answerCode: extra_siren.py

      - id: debug
        type: debug
        title: 디버깅 미션 — 소리가 이상해요
        minutes: 7
        scene:
          image: images/frequency-wave.svg
          caption: "소리 문제는 세 가지를 봐요: 진동수(음 높이) · duty(켜고 끄기) · 꽂은 부저의 종류"
        body: |
          고장 난 코드 세 개가 있어요. 바로 고치지 말고 **증상을 보고 어디부터 볼지** 먼저 정해요. 소리가 이상할 때는 **꽂은 부저 → 켜고 끄기(duty) → 목록** 순서로 보는 게 오늘의 약속이에요.

          셋 중 **빨간 글씨가 뜨는 것**은 어느 것일까요? 나머지 둘은 왜 에러 없이 이상하게만 굴까요? 최소 4분은 혼자 해 봐요.
        todo:
          - 증상마다 "왜 이런 증상일까?" 에 내 생각 적고 저장
          - 편집기에서 고장 난 곳을 고치고 **판정**
          - 세 증상을 모두 고치기
        symptoms:
          - title: 노래가 끝났는데도 마지막 음이 멈추지 않고 계속 울려요
            code: |
              from machine import Pin, PWM
              import time

              beeper = PWM(Pin(15))
              beeper.freq(440)
              beeper.duty(0)

              notes = [262, 294, 330]
              for hz in notes:
                  beeper.freq(hz)
                  beeper.duty(512)
                  time.sleep(0.4)
            question: 소리를 켜는 줄은 있어요. 그럼 소리를 끄는 줄은 어디 있나요? duty 가 512 인 채로 끝나면 부저는 어떻게 될까요?
            rules:
              - codeMatches: '\.duty\(512\)(?![\s\S]*\.duty\(512\))[\s\S]*\.duty\(0\)'
                fail: 마지막으로 소리를 켠 다음, 소리를 끄는 줄이 있나요?
          - title: "두 음은 잘 나오다가 빨간 글씨로 IndexError: list index out of range 가 떠요"
            code: |
              from machine import Pin, PWM
              import time

              beeper = PWM(Pin(15))
              beeper.freq(440)
              beeper.duty(0)

              notes = [262, 262, 392, 392, 440, 440, 392]
              beats = [1, 1, 1, 1, 1, 1]
              for i in range(len(notes)):
                  beeper.freq(notes[i])
                  beeper.duty(512)
                  time.sleep(beats[i] * 0.4)
                  beeper.duty(0)
                  time.sleep(0.1)
            question: 에러는 "목록에 없는 칸 번호를 찾았다"는 뜻이에요. notes 는 몇 칸이고 beats 는 몇 칸인가요? i 가 마지막에 몇이 될 때 문제가 생길까요?
            rules:
              - codeMatches: 'beats = \[\s*\d+(\s*,\s*\d+){6}\s*\]'
                fail: 두 목록의 칸 수를 다시 세어 보세요. 마지막 솔은 몇 박이었나요?
          - title: 수동 부저를 꽂았더니 "틱… 틱…" 작은 소리만 나요
            code: |
              from machine import Pin
              import time

              buzzer = Pin(15, Pin.OUT)

              while True:
                  buzzer.value(1)
                  time.sleep(0.5)
                  buzzer.value(0)
                  time.sleep(0.5)
            question: 이 코드는 어느 부저를 위한 코드였나요? 1과 0만 보내면 수동 부저의 떨림판은 1초에 몇 번 떨까요? 부저를 바꾸지 말고, 코드를 수동 부저에 맞게 고쳐 보세요.
            rules:
              - codeMatches: 'PWM\(Pin\(15\)\)'
                fail: 수동 부저는 떨림 빠르기를 정해 주는 핀이 필요해요. 15번 핀을 무엇으로 준비해야 할까요?
              - codeMatches: '\.freq\('
                fail: 1초에 몇 번 떨지(진동수)를 정하는 줄이 있나요?
              - codeMatches: '\.duty\(512\)'
                fail: 진동수를 정한 다음, 소리를 켜는 줄이 있나요?

